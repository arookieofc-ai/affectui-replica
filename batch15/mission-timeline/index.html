<head>

<title>Mission timeline</title>
<style>
:root{
--surface:#ffffff;--page:#fafaf9;--ink:#171717;--ink2:#1c1917;--muted:#78716c;--subtle:#f5f5f4;--border:#e7e5e4;
--radius-lg:16px;--radius:10px;--radius-sm:6px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--working:#2563eb;--working-bg:#dbeafe;--waiting:#f59e0b;--waiting-bg:#fef3c7;--waiting-tx:#92400e;
--failed:#dc2626;--failed-bg:#fee2e2;--ok:#15803d;--ok-bg:#dcfce7;
}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--ink2:#ededed;--muted:#a1a1aa;--subtle:#26262a;--border:#2e2e33;
--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
--working:#60a5fa;--working-bg:#1e3a8a;--waiting:#fbbf24;--waiting-bg:#451a03;--waiting-tx:#fde68a;
--failed:#f87171;--failed-bg:#450a0a;--ok:#4ade80;--ok-bg:#052e16;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:14px/20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:4px}
.themebtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;box-shadow:var(--shadow);transition:background 160ms ease,transform 160ms ease}
.themebtn:hover{transform:translateY(-1px)}
.themebtn:focus-visible{outline:2px solid var(--working);outline-offset:2px}
.mt{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);padding:14px 16px}
.mt-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:10px}
.mt-title{flex:1 1 auto;min-width:min(220px,100%);margin:0;font-size:16px;font-weight:600;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-counts{font-size:12.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.mt-filter{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--subtle);max-width:100%;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:0;border-radius:999px;background:none;font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;cursor:pointer;transition:background-color 160ms ease,color 160ms ease,box-shadow 160ms ease}
.chip:hover:not(:disabled){color:var(--ink)}
.chip[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip:disabled{opacity:.45;cursor:default}
.chip:focus-visible{outline:2px solid var(--working);outline-offset:-2px}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted)}
.recent{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:10px 12px;margin-bottom:12px}
.recent h3,.lanes-title,.inbox-title{margin:0 0 8px;font-size:14px;line-height:20px;font-weight:600}
.recent-sub{font-size:12px;color:var(--muted);margin:-6px 0 8px}
.evlist{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.ev{flex:0 0 190px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;background:var(--page);transition:box-shadow 160ms ease,transform 160ms ease}
.ev:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.ev.hl{outline:2px solid var(--working);outline-offset:1px}
.ev-time{font-size:11.5px;color:var(--muted)}
.ev-title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-detail{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.lanes{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:10px 12px;min-width:0}
.agent{border:1px solid var(--border);border-radius:var(--radius);background:var(--page);padding:10px 12px;margin-bottom:8px;transition:box-shadow 160ms ease,transform 160ms ease,opacity 160ms ease}
.agent:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.agent.hl{outline:2px solid var(--working);outline-offset:1px}
.agent.sub{padding:8px 10px;margin:6px 0 0 26px;background:var(--surface)}
.agent.dim{opacity:.85}
.a-row1{display:flex;align-items:center;gap:8px;min-width:0}
.a-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-model{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-cost{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.a-task{font-size:13px;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
.a-meta .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:inline-flex;gap:4px;margin-left:auto;flex:none}
.tool{width:20px;height:20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.pill{flex:none;display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600}
.pill-running{background:var(--working-bg);color:var(--working)}
html[data-theme="light"] .pill-running{background:#dbeafe;color:#1d4ed8}
.pill-waiting{background:var(--waiting-bg);color:var(--waiting-tx)}
.pill-failed{background:var(--failed-bg);color:var(--failed)}
.pill-done{background:var(--ok-bg);color:var(--ok)}
.track{position:relative;height:22px;border-radius:6px;background:var(--subtle);margin-top:8px;overflow:hidden}
.bar{position:absolute;top:4px;height:14px;border-radius:4px;background:var(--working);opacity:.85;cursor:pointer;border:0;padding:0}
.bar.done{background:var(--muted)}
.bar.waiting{background:var(--waiting)}
.bar.failed{background:var(--failed)}
.bar.running{background:var(--working)}
.bar:focus-visible{outline:2px solid var(--working);outline-offset:1px}
.pix{display:grid;grid-template-columns:repeat(3,6px);grid-auto-rows:6px;gap:1px;flex:none;width:20px}
.pix i{width:6px;height:6px;border-radius:1px;background:var(--border);display:block}
.pix i.on{background:var(--pc,#2563eb)}
.pix.working i.on{animation:tw 1.6s ease-in-out infinite}
.pix.working i.on:nth-child(2n){animation-delay:.2s}
.pix.working i.on:nth-child(3n){animation-delay:.4s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.pix.working i.on{animation:none}.chip,.agent,.ev,.themebtn{transition:none}}
.side{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:10px 12px;min-width:0}
.inbox-item{border:1px solid var(--border);border-radius:var(--radius);background:var(--page);padding:10px 12px;margin-bottom:8px}
.inbox-item.hl{outline:2px solid var(--working)}
.inbox-item h4{margin:0;font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-desc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-agent{font-size:12px;color:var(--muted);margin:2px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btnrow{display:flex;gap:6px}
.btn{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:inherit;font-size:12px;cursor:pointer}
.btn:hover{background:var(--subtle)}
.btn:focus-visible{outline:2px solid var(--working);outline-offset:2px}
.btn.primary{background:var(--working);border-color:var(--working);color:#fff}
html[data-theme="light"] .btn.primary{background:#2563eb}
.btn.danger{color:var(--failed)}
.pop{position:fixed;z-index:50;max-width:260px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px}
.pop h4{margin:0 0 4px;font-size:13px}
.clockline{font-size:12px;color:var(--muted);margin:0 0 8px;font-variant-numeric:tabular-nums}
.tlist{font-size:11.5px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{font-size:13px;color:var(--muted);padding:8px 2px}
</style>
</head>
<body>
<div class="page">
<div class="topbar"><button class="themebtn" id="themeBtn" type="button" aria-label="Toggle theme">◐ Theme</button></div>
<section class="mt" aria-label="Mission timeline">
<div class="mt-bar">
<h2 class="mt-title">Mission timeline <span class="mt-counts" id="counts"></span></h2>

</div>
<p class="clockline" id="clock"></p>
<div class="recent" aria-label="Recent activity">
<h3>Since you looked</h3>
<div class="recent-sub">Shared clock — all agents, last 45 min</div>
<div class="evlist" id="evlist"></div>
</div>
<div class="grid">
<main class="lanes" aria-label="Agent lanes"><h3 class="lanes-title">Agents</h3><div id="lanes"></div></main>
<aside class="side" aria-label="Needs you"><h3 class="inbox-title">Inbox</h3><div id="inbox"></div></aside>
</div>
</section>
</div>
<div class="pop" id="pop" hidden></div>

function toggleExpand(card,a){var ex=card.querySelector('[data-exp]');if(ex){ex.hidden=!ex.hidden;return;}var d=document.createElement('div');d.setAttribute('data-exp','');d.style.fontSize='12px';d.style.color='var(--muted)';d.style.marginTop='6px';d.style.paddingBottom='2px';var parts=[];for(var i=0;i<(a.tasks||[]).length;i++)parts.push(a.tasks[i].title+' ('+a.tasks[i].status+')');d.textContent=parts.join(' · ');card.appendChild(d);}

function buildEvents(){var host=el.evlist;while(host.firstChild)host.removeChild(host.firstChild);evEls={};for(var i=0;i<state.events.length;i++)(function(e){var d=document.createElement('div');d.setAttribute('class','ev'+(state.highlight===e.agent?' hl':''));d.setAttribute('data-ev',e.id);var tm=document.createElement('div');tm.setAttribute('class','ev-time');tm.textContent=ago(e.at,state.now);d.appendChild(tm);var ti=document.createElement('div');ti.setAttribute('class','ev-title');ti.textContent=e.title;d.appendChild(ti);var de=document.createElement('div');de.setAttribute('class','ev-detail');var extra=e.detail||(e.count!=null?('× '+e.count):'');de.textContent=extra;d.appendChild(de);d.tabIndex=0;d.addEventListener('mouseenter',function(){setHighlight(e.agent);});d.addEventListener('mouseleave',function(){setHighlight(null);});d.addEventListener('focus',function(){/* no rerender */});host.appendChild(d);evEls[e.id]={root:d,time:tm};})(state.events[i]);}
function buildInbox(){var host=el.inbox;while(host.firstChild)host.removeChild(host.firstChild);inboxEls={};var items=inboxItems();if(!items.length){var em=document.createElement('div');em.setAttribute('class','empty');em.textContent=state.filter==='all'?'All clear — nothing needs you.':'Nothing in this view.';host.appendChild(em);inboxEls._empty=em;return;}for(var i=0;i<items.length;i++)(function(a){var es=effStatus(a);var d=document.createElement('div');d.setAttribute('class','inbox-item'+(state.highlight===a.id?' hl':''));d.setAttribute('data-inbox',a.id);var h=document.createElement('h4');h.textContent=a.task;d.appendChild(h);var desc=document.createElement('div');desc.setAttribute('class','inbox-desc');desc.textContent=(es==='waiting'?(a.ask||'Needs approval'):(a.error||'Failed'));d.appendChild(desc);var ag=document.createElement('div');ag.setAttribute('class','inbox-agent');ag.textContent=(es==='waiting'?('Asked by '+a.name):('Stopped in '+a.name))+' · '+ago(a.started,state.now);d.appendChild(ag);var row=document.createElement('div');row.setAttribute('class','btnrow');if(es==='waiting'){var ap=document.createElement('button');ap.setAttribute('class','btn primary');ap.setAttribute('type','button');ap.textContent='Approve';ap.addEventListener('pointerdown',function(){d._armed=true;},{capture:true});ap.addEventListener('mousedown',function(){d._armed=true;},{capture:true});ap.addEventListener('click',function(){doAction(a.id,'approve');});row.appendChild(ap);var rj=document.createElement('button');rj.setAttribute('type','button');rj.setAttribute('class','btn danger');rj.textContent='Reject';rj.addEventListener('pointerdown',function(){d._armed=true;},{capture:true});rj.addEventListener('click',function(){doAction(a.id,'reject');});row.appendChild(rj);}else{var rt=document.createElement('button');rt.setAttribute('type','button');rt.setAttribute('class','btn primary');rt.textContent='Retry';rt.addEventListener('pointerdown',function(){d._armed=true;},{capture:true});rt.addEventListener('click',function(){doAction(a.id,'retry');});row.appendChild(rt);}d.appendChild(row);d.addEventListener('mouseenter',function(){setHighlight(a.id);});d.addEventListener('mouseleave',function(){setHighlight(null);});host.appendChild(d);inboxEls[a.id]={root:d,desc:desc,agent:ag,row:row};})(items[i]);}
function refreshCounts(){var all=allAgents();var working=0;for(var i=0;i<all.length;i++)if(effStatus(all[i])==='running')working++;el.counts.textContent='· '+working+' working · '+all.length+' agents';for(var k=0;k<FILTERS.length;k++){var id=FILTERS[k].id;var c=el.chips[id];if(!c)continue;c.count.textContent=String(countFor(id));c.btn.setAttribute('aria-checked',state.filter===id?'true':'false');c.btn.tabIndex=(state.filter===id?0:-1);var dis=(countFor(id)===0&&id!=='all');if(dis)c.btn.setAttribute('disabled','');else c.btn.removeAttribute('disabled');}}
function refreshClock(){var d=new Date(state.now);var hh=String(d.getHours()).padStart(2,'0');var mm=String(d.getMinutes()).padStart(2,'0');el.clock.textContent='Clock '+hh+':'+mm+' · last 45 min · live ×10';}
function applyFilterVisibility(){
var vis=visibleAgents();var visIds={};for(var i=0;i<vis.length;i++){visIds[vis[i].a.id]=true;for(var j=0;j<vis[i].kids.length;j++)visIds[vis[i].kids[j].id]=true;}

}
function setFilter(f){if(state.filter===f)return;state.filter=f;for(var id in el.chips){var c=el.chips[id];c.btn.setAttribute('aria-checked',id===f?'true':'false');c.btn.tabIndex=(id===f?0:-1);}applyFilterVisibility();}
function setHighlight(id){if(state.highlight===id)return;state.highlight=id;var all=allAgents();for(var i=0;i<all.length;i++){var card=agentCard[all[i].id];if(card)card.classList.toggle('hl',id===all[i].id);}for(var eid in evEls){var e=null;for(var k=0;k<state.events.length;k++)if(state.events[k].id===eid)e=state.events[k];if(e&&evEls[eid].root)evEls[eid].root.classList.toggle('hl',id===e.agent);}for(var iid in inboxEls){var n=inboxEls[iid];if(n&&n.root)n.root.classList.toggle('hl',id===iid);}}
var ACTION_MAP={approve:'running',reject:'failed',retry:'running',dismiss:'done'};
function doAction(id,act){var all=allAgents();var target=null;for(var i=0;i<all.length;i++)if(all[i].id===id)target=all[i];if(!target)return;var to=ACTION_MAP[act];state.pending[id]={from:baseOf(target),to:to};if(to==='failed'&&act==='reject'){target.error='You rejected the request';}if(to==='running'&&target.error&&baseOf(target)==='waiting'){/* keep ask flow */}syncAgent(id);}
function syncAgent(id){var all=allAgents();var a=null;for(var i=0;i<all.length;i++)if(all[i].id===id)a=all[i];if(!a)return;var es=effStatus(a);var card=agentCard[id];if(card){var pill=agentPill[id];pill.setAttribute('class',pillClass(es));pill.textContent=statusLabel(es);var px=card._pix;if(px)px.setAttribute('class','pix'+(es==='running'?' working':''));}

buildInbox();refreshCounts();
var evVis={};var ve=visibleEvents();for(var q=0;q<ve.length;q++)evVis[ve[q].id]=true;
for(var eid in evEls){if(evEls[eid].root){var shouldHide=!evVis[eid];if(evEls[eid].root.hidden!==shouldHide)evEls[eid].root.hidden=shouldHide;}}
applyFilterVisibility();}
function liveStep(n,at){var tmpl=LIVE[n%LIVE.length];var found=null;var all=allAgents();for(var i=0;i<all.length;i++){if(all[i].id===tmpl.agent&&effStatus(all[i])==='running'){found=all[i];break;}}if(!found)return false;var keep=[];for(var j=0;j<(found.tasks||[]).length;j++){var t=found.tasks[j];if(t.end===undefined||t.end>at-40*C){if(t.status==='running'){t.status='done';t.end=at;}keep.push(t);}}found.cost=(found.cost||0)+0.04;var nid=tmpl.agent+'-'+n;keep.push({id:nid,title:tmpl.next,status:'running',start:at,tools:tmpl.tools.slice()});found.tasks=keep;state.events=state.events.filter(function(e){return (+e.at)>at-SPAN-C;});var ev={id:'live-'+n,at:at,kind:'done',title:tmpl.title,agent:tmpl.agent};if(tmpl.detail)ev.detail=tmpl.detail;if(tmpl.count!=null)ev.count=tmpl.count;state.events.push(ev);return true;}
function tickReal(){var elapsedReal=Date.now()-state.realStart;var t=baseNow+elapsedReal*SPEED;var step=Math.floor((t-baseNow)/STEP);if(step>state.steps){for(var s=state.steps;s<step;s++){liveStep(s,t);}state.steps=step;onLiveChanged(t);}state.now=t;state.since=t-SPAN;refreshTickTimes();}

function onLiveChanged(at){var host=el.evlist;var known={};for(var id in evEls)known[id]=true;for(var i=0;i<state.events.length;i++){var e=state.events[i];if(!evEls[e.id]){var d=document.createElement('div');d.setAttribute('class','ev');d.setAttribute('data-ev',e.id);var tm=document.createElement('div');tm.setAttribute('class','ev-time');tm.textContent=ago(e.at,state.now);d.appendChild(tm);var ti=document.createElement('div');ti.setAttribute('class','ev-title');ti.textContent=e.title;d.appendChild(ti);var de=document.createElement('div');de.setAttribute('class','ev-detail');de.textContent=e.detail||(e.count!=null?('× '+e.count):'');d.appendChild(de);d.tabIndex=0;(function(ag,root){root.addEventListener('mouseenter',function(){setHighlight(ag);});root.addEventListener('mouseleave',function(){setHighlight(null);});})(e.agent,d);host.appendChild(d);evEls[e.id]={root:d,time:tm};}}
var all=flat(state.agents);for(var a=0;a<all.length;a++){var ag=all[a];var card=agentCard[ag.id];if(!card)continue;var tr=null;for(var c=0;c<card.childNodes.length;c++){var n2=card.childNodes[c];if(n2.setAttribute&&n2.getAttribute&&n2.getAttribute('class')==='track'){tr=n2;break;}}if(!tr)continue;var bars=agentTrackBars[ag.id]||{};for(var t=0;t<(ag.tasks||[]).length;t++){var tt=ag.tasks[t];if(!bars[tt.id]){var b=document.createElement('button');b.setAttribute('type','button');b.setAttribute('class','bar '+tt.status);b.setAttribute('data-task',tt.id);b.setAttribute('aria-label',tt.title+' '+tt.status);var pos=taskBarPos(tt);if(pos){b.style.left=pos.l+'%';b.style.width=pos.w+'%';}(function(ta,aa,bb){bb.addEventListener('pointerdown',function(){card._armed=true;},{capture:true});bb.addEventListener('click',function(ev){ev.stopPropagation();showPop(ta,aa,bb);});bb.addEventListener('mouseenter',function(){setHighlight(aa.id);});bb.addEventListener('mouseleave',function(){setHighlight(null);});})(tt,ag,b);tr.appendChild(b);bars[tt.id]=b;}}}
for(var u=0;u<all.length;u++){var ga=all[u];if(agentTaskList[ga.id])agentTaskList[ga.id].textContent=(ga.tasks||[]).map(function(t){return t.title;}).join(' · ');}applyFilterVisibility();refreshTickTimes();}
function init(){el.filter=document.getElementById('filter');el.lanes=document.getElementById('lanes');el.evlist=document.getElementById('evlist');el.inbox=document.getElementById('inbox');el.counts=document.getElementById('counts');el.clock=document.getElementById('clock');el.pop=document.getElementById('pop');
