<style>
:root{color-scheme:light dark}
html[data-theme="light"]{

--subtle:#f5f5f4;--well:#f4f4f5;--border:#e7e5e4;--track:#ededf0;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}

.stage{max-width:720px;margin:0 auto;padding:14px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
.xc-demo{width:100%;max-width:348px}

/* ---- experiment card (clean-room) ---- */
.ui-xc{--tray:var(--tray);--card:var(--card);--line:var(--line);--ink:var(--ink);--txt:var(--text);--mut:var(--muted);--well:var(--well);--trk:var(--track);box-sizing:border-box;width:100%;max-width:340px;padding:4px;border-radius:calc(var(--radius-lg) + 4px);background:var(--tray);font-size:13px;line-height:20px;color:var(--txt);text-align:left;container-type:inline-size}

.ui-xc button{margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ui-xc button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ui-xc__card{border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);transition:transform 160ms ease}
@media (hover: hover) and (pointer: fine) {
.ui-xc__card:hover{transform:translateY(-1px)}
}
.ui-xc__fold{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 520ms cubic-bezier(.32,.72,.24,1),opacity 260ms ease}
.ui-xc[data-open] .ui-xc__fold{grid-template-rows:1fr;opacity:1;transition:grid-template-rows 520ms cubic-bezier(.32,.72,.24,1),opacity 380ms ease 120ms}

.ui-xc__toggle{position:absolute;inset:0;border-radius:var(--radius-lg)}

.ui-xc__col[data-hot]{transform:scaleX(1.25)}
.ui-xc__col[data-dim]{opacity:.75}
.ui-xc__col[data-passed]:not([data-hot]){opacity:.75}
.ui-xc__titles{display:grid;grid-template-columns:minmax(0,1fr);flex:1;min-width:0}
.ui-xc__name{overflow:hidden;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}

.ui-xc__note{min-width:0;overflow:hidden;text-overflow:ellipsis}

.ui-xc__body{padding:0 12px 10px}
.ui-xc__switch{position:relative;display:grid;grid-auto-columns:1fr;grid-auto-flow:column;padding:2px;border-radius:var(--radius);background:var(--well);box-shadow:inset 0 0 0 1px var(--line);overflow-x:auto;scrollbar-width:none}

.ui-xc__thumb{position:absolute;top:2px;left:0;height:calc(100% - 4px);border-radius:calc(var(--radius) - 2px);background:var(--surface);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06);transition:transform 420ms cubic-bezier(.32,.72,.24,1),width 420ms cubic-bezier(.32,.72,.24,1)}

.ui-xc__rows{display:grid;gap:2px;margin-top:8px}

.ui-xc__label{overflow:hidden;color:var(--txt);white-space:nowrap;text-overflow:ellipsis;text-align:start}

.ui-xc__lift[data-tone="green"]{background:var(--tag-green-bg);color:var(--tag-green)}
.ui-xc__lift[data-tone="red"]{background:var(--tag-red-bg);color:var(--tag-red)}
.ui-xc__track{grid-column:2/-1;height:4px;overflow:hidden;border-radius:2px;background:var(--trk)}
.ui-xc__bar{display:block;width:100%;height:100%;border-radius:2px;background:var(--col,var(--c0));transform-origin:0 50%;transition:transform 620ms cubic-bezier(.32,.72,.24,1)}
.ui-xc__foot{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 4px 0 10px}
.ui-xc__caption{flex:1;min-width:0;overflow:hidden;font-size:12.5px;color:var(--mut);white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ui-xc__caption>span{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.ui-xc__caption b{font-weight:600;color:var(--ink)}
.ui-xc__action{display:inline-flex;align-items:center;gap:4px;flex:0 1 auto;min-width:0;max-width:65%;height:26px;padding:0 7px 0 10px;border-radius:var(--radius);background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:500;white-space:nowrap;transition:opacity 160ms ease}

@container (max-width:300px){
.ui-xc__head{gap:8px;padding:10px}
.ui-xc__chart{width:30px;height:30px}

</style>

var root=$("xc"),demo=$("demo"),toggle=$("xcToggle"),chart=$("xcChart"),lead=$("xcLead"),leadKey=$("xcLeadKey"),leadNum=$("xcLeadNum"),leadArrow=$("xcLeadArrow"),cap=$("xcCap"),action=$("xcAction"),actionText=$("xcActionText"),sw=$("xcSwitch"),thumb=$("xcThumb"),rowsBox=$("xcRows"),foldBody=$("xcFoldBody"),foldFoot=$("xcFoldFoot");
