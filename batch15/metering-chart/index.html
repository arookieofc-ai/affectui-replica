function totals(){var s=0;for(var i=0;i<data.length;i++)s+=data[i].value;var base=s-13000;return{vol:base*1.4,ev:base}}
function refreshYAxis(nice){var labels=[nice,nice*2/3,nice/3,0].map(fmtAxis);var longest=labels.reduce(function(a,b){return b.length>a.length?b:a},"");if(ySize)ySize.textContent=longest;
for(var i=0;i<4;i++){var top=(i/3*100);gridEls[i].style.top=top+"%";if(yLabelEls[i]){yLabelEls[i].style.top=top+"%";var txt=labels[i];if(yLabelEls[i].textContent!==txt)yLabelEls[i].textContent=txt}}}
function refreshStatic(){
var nice=niceMax(Math.max.apply(null,data.map(function(d){return d.value})));
refreshYAxis(nice);
var per=dayLabel(dayOffset)+" – "+dayLabel(dayOffset+data.length-1);
if(periodEl.textContent!==per)periodEl.textContent=per;
for(var i=0;i<data.length;i++){var v=data[i].value;var h=Math.max(v>0?3:0,v/nice*100);barEls[i].style.height=h+"%";barEls[i].style.setProperty("--mtr-c",i===data.length-1?ACCENT:gradColor(PALETTE,data.length>1?i/(data.length-1):0));barEls[i].style.animationDelay=(Math.min(i,40)*28)+"ms";
if(i===data.length-1)barEls[i].setAttribute("data-live","true");else barEls[i].removeAttribute("data-live");
if(showDate(i)){dateEls[i].textContent=data[i].label;dateEls[i].removeAttribute("hidden");var odd=visibleCount(i)%2===1;if(odd)dateEls[i].setAttribute("data-odd","true");else dateEls[i].removeAttribute("data-odd")}else{dateEls[i].textContent="";dateEls[i].setAttribute("hidden","true")}}
var t=totals();tween(volEl,volSr,animVol,t.vol,fmtMoney);tween(evEl,evSr,animEv,t.ev,function(v){return fmtAxis(Math.round(v))});
if(!reduceMotion){/* seed sr immediately for tests */volSr.textContent=fmtMoney(t.vol);evSr.textContent=fmtAxis(Math.round(t.ev))}
else{volEl.textContent=fmtMoney(t.vol);evEl.textContent=fmtAxis(Math.round(t.ev))}
refreshTag(nice);
return nice}
function currentSel(){if(sel==null)return null;return Math.min(data.length-1,sel)}
function refreshTag(nice){
if(pinned==null)pinned=0;if(pinned<0)pinned=0;if(pinned>data.length-1)pinned=data.length-1;
var pick=currentSel();var active=pick==null?pinned:pick;
if(active==null||!data[active]){tag.removeAttribute("data-open");return}
var v=data[active].value;var live=active===data.length-1;
tagVal.textContent=fmtPlain(v);
var dl=data[active].label+(live?LIVE_SUFFIX:"");
if(tagDate.textContent!==dl)tagDate.textContent=dl;
var rows=breakdown(data[active].breakdown);
var wide=rows.length>0;
if(wide)tag.setAttribute("data-wide","true");else tag.removeAttribute("data-wide");
if(live)tag.setAttribute("data-live","true");else tag.removeAttribute("data-live");
for(var i=0;i<partRows.length;i++){var pr=partRows[i];if(i<rows.length){pr.row.removeAttribute("hidden");pr.label.textContent=rows[i].label;pr.label.setAttribute("title",rows[i].label);pr.pct.textContent=rows[i].text;pr.fill.style.width=Math.max(4,rows[i].pct)+"%";var c=TOOL_NAMES.indexOf(rows[i].label);var col=c>=0?TOOL_DOTS[c]:gradColor(PALETTE,rows.length>1?i/(rows.length-1):0);pr.dot.style.background=col;pr.dot.textContent=rows[i].label.slice(0,1);pr.fill.style.setProperty("--mtr-c",col)}else{pr.row.setAttribute("hidden","true")}}
if(parts)parts.style.display=wide?"":"none";
for(var b=0;b<barEls.length;b++){if(pick!=null&&pick!==b)barEls[b].setAttribute("data-dim","true");else barEls[b].removeAttribute("data-dim")}
if(pick==null){tag.removeAttribute("data-open")}
else{tag.setAttribute("data-open","true")}
var pctPos=(active+0.5)/data.length*100;
tag.style.left=pctPos+"%";
if(!wide){tag.style.bottom=(v/nice*100)+"%";tag.style.top="";tag.style.setProperty("--mtr-nudge","0px")}
else{tag.style.top="8px";tag.style.bottom="";tag.style.left=Math.min(70,Math.max(2,pctPos))+"%"}
plot.setAttribute("aria-label",TITLE+" per day – "+data[active].label+" "+fmtPlain(v)+(live?", live":""));
}
function indexFromEvent(e){try{var r=plot.getBoundingClientRect?plot.getBoundingClientRect():{left:0,width:1};var w=r.width||1;var ratio=Math.min(0.9999,Math.max(0,(e.clientX-r.left)/w));return Math.floor(ratio*data.length)}catch(_){return 0}}
buildOnce();
refreshStatic();
plot.addEventListener("pointermove",function(e){if(!data.length)return;var i=indexFromEvent(e);if(i!==sel){sel=i;refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))}});
plot.addEventListener("pointerdown",function(e){if(!data.length)return;var i=indexFromEvent(e);sel=i;pinned=i;refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))},true);
plot.addEventListener("pointerleave",function(e){if(e&&e.pointerType!=null&&e.pointerType!=="mouse")return;if(sel!=null){sel=null;refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))}});
plot.addEventListener("blur",function(){if(sel!=null){sel=null;refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))}});
plot.addEventListener("keydown",function(e){if(!data.length)return;var cur=(sel==null?(e.key==="ArrowLeft"?data.length:-1):sel);if(e.key==="ArrowRight"){sel=Math.min(data.length-1,cur+1);pinned=sel;e.preventDefault();refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))}else if(e.key==="ArrowLeft"){sel=Math.max(0,cur-1);pinned=sel;e.preventDefault();refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))}else if(e.key==="Home"){sel=0;pinned=0;e.preventDefault();refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))}else if(e.key==="End"){sel=data.length-1;pinned=data.length-1;e.preventDefault();refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))}else if(e.key==="Escape"){sel=null;refreshTag(niceMax(Math.max.apply(null,data.map(function(d){return d.value}))))}});
/* live loop — in-place only, no innerHTML */
var timer=null;
function tick(){
var last=data[data.length-1];
if(last.value>3150){dayOffset+=1;var nd=makeDay(dayOffset+data.length-1,140);var next=data.slice(1);next.push(nd);data=next}
else{var bump=40+Math.round(Math.random()*90);var idx=dayOffset+data.length-1;data[data.length-1]={label:data[data.length-1].label,value:last.value+bump,breakdown:mixBreakdown(last.value+bump,idx)}}
if(pinned>data.length-1)pinned=data.length-1;
refreshStatic()}
if(!reduceMotion){try{timer=setInterval(tick,900)}catch(e){}}
/* expose for harness */
try{window.__mtr={tick:tick,get data(){return data},get dayOffset(){return dayOffset},bars:barEls,vol:volEl,ev:evEl,period:periodEl,tag:tag,plot:plot,totals:totals,niceMax:niceMax,fmtAxis:fmtAxis}}catch(e){}
})();
</script>
</body>
</html>
