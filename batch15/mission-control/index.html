<style>
:root{color-scheme:light dark}
html[data-theme="light"]{

html[data-theme="dark"]{

html,body{margin:0;padding:0;overflow-x:clip}

function fmtCost(c){ return "$"+(Math.round(c*100)/100).toFixed(2); }
function fmtAgo(ts){ var m=Math.max(0,Math.round((state.now-ts)/C)); if(m<1) return "just now"; if(m===1) return "1m ago"; return m+"m ago"; }

// pixel mark: exactly 9 cells
function makeMark(id){

// agent cards: build once, keyed

function buildAgentCard(a, isSub){

  var errActs=document.createElement("div"); errActs.className="ag-actions"; errActs.setAttribute("hidden","");

  art.addEventListener("mousedown",function(){ armed=true; },{capture:true});
  cardById[a.id]={art:art,pill:pill,task:task,cost:cost,elapsed:el,ask:ask,askActs:askActs,err:err,errActs:errActs,det:det,tools:tools,isSub:!!isSub};
  return art;
}
function ensureCards(eff){
  flat(eff).forEach(function(a){
    var isSub=!!findParent(eff,a.id);
    if(!cardById[a.id]){ buildAgentCard(a,isSub); }
  });
}
function findParent(list,id,par){ for(var i=0;i<(list||[]).length;i++){ var a=list[i]; if(a.id===id) return par||null; var r=findParent(a.children||[],id,a); if(r) return r; } return null; }
function renderAgentsSkeleton(eff){
  agentsEl.textContent="";
  eff.forEach(function(a){
    var e=cardById[a.id]; if(!e) return;
    agentsEl.appendChild(e.art);
    var kids=document.createElement("div"); kids.className="ag-kids"; kids.setAttribute("data-kids",a.id);
    e.art.appendChild(kids);
    (a.children||[]).forEach(function(k){ var ce=cardById[k.id]; if(ce) kids.appendChild(ce.art); });
    if(!(a.children||[]).length){ kids.setAttribute("hidden",""); }
    e.kids=kids;
  });

// inbox + activity keyed maps
var inboxById={}, eventById={};
function resolve(id,action){
  var map={approve:"running",reject:"failed",retry:"running",dismiss:"done"};
  var all=flat(state.agents); var cur=null;
  (function find(l){ l.forEach(function(a){ if(a.id===id) cur=a; if(a.children) find(a.children); }); })(state.agents);
  if(!cur) return;
  state.overrides[id]={from:cur.status,to:map[action]||cur.status};
  refreshAll(false);
}
function effEvents(){
  var eff=allEff(); var all=flat(eff);
  var doneIds={}; all.forEach(function(a){ var o=state.overrides[a.id]; if(o&&a.status!=="waiting"&&a.status!=="failed") doneIds[a.id]=1; });
  return state.events.map(function(e){ if(doneIds[e.agent]&&(e.kind==="needs"||e.kind==="failed")){ var n={}; for(var k in e) n[k]=e[k]; n.kind="done"; return n; } return e; });
}
function refreshAll(structural){
  var eff=allEff();
  ensureCards(eff);
  if(structural){ renderAgentsSkeleton(eff); }
  // counts
  var all=flat(eff);
  function cnt(f){ return all.filter(function(a){return matchSt(a.status,f)}).length; }
  var cAll=all.length, cRun=cnt("running"), cWait=cnt("waiting"), cFail=cnt("failed");
  setText(filterBtns.all.n,cAll); setText(filterBtns.running.n,cRun); setText(filterBtns.waiting.n,cWait); setText(filterBtns.failed.n,cFail);
  filterBtns.failed.btn.disabled=!(cFail>0);
  filterBtns.running.btn.disabled=!(cRun>0);
  filterBtns.waiting.btn.disabled=!(cWait>0);
  setText(countsEl, cRun+" running \u00B7 "+cAll+" agents");
  if(sinceEl) setText(sinceEl, "last "+Math.round(E/C)+" min");
  if(nowEl) setText(nowEl, fmtAgo(state.now-0)+" \u00B7 live");
  // visible set
  var tree=filterTree(eff,state.filter);
  var visIds={}; flat(tree).forEach(function(x){ if(matchSt(x.status,state.filter)) visIds[x.id]=1; });

  flat(eff).forEach(function(a){
    var r=cardById[a.id]; if(!r) return;
    var inTree=flat(tree).some(function(x){return x.id===a.id});
    if(!inTree){ if(!r.art.hasAttribute("hidden")) r.art.setAttribute("hidden",""); }
    else { if(r.art.hasAttribute("hidden")) r.art.removeAttribute("hidden"); }
    // dim non-matching but kept parents
    var dim=inTree&&!visIds[a.id];
    if(dim){ if(r.art.getAttribute("data-dim")!=="1") r.art.setAttribute("data-dim","1"); if(!r.art.classList.contains("is-dim")) r.art.classList.add("is-dim"); }
    else { if(r.art.classList.contains("is-dim")) r.art.classList.remove("is-dim"); r.art.removeAttribute("data-dim"); }
    if(r.art.getAttribute("data-status")!==a.status) r.art.setAttribute("data-status",a.status);
    if(r.pill.textContent!==a.status) r.pill.textContent=a.status;
    if(r.pill.getAttribute("data-s")!==a.status) r.pill.setAttribute("data-s",a.status);
    if(r.task.textContent!==(a.task||"")) r.task.textContent=a.task||"";
    var cs=fmtCost(a.cost||0); if(r.cost.textContent!==cs) r.cost.textContent=cs;
    var es=fmtAgo(a.started||state.now)+((a.ended)?" \u00B7 ended "+fmtAgo(a.ended):""); if(r.elapsed.textContent!==es) r.elapsed.textContent=es;
    if(a.status==="waiting"&&a.ask){ if(r.ask.textContent!==a.ask) r.ask.textContent=a.ask; if(r.ask.hasAttribute("hidden")) r.ask.removeAttribute("hidden"); if(r.askActs.hasAttribute("hidden")) r.askActs.removeAttribute("hidden"); }
    else { if(!r.ask.hasAttribute("hidden")) r.ask.setAttribute("hidden",""); if(!r.askActs.hasAttribute("hidden")) r.askActs.setAttribute("hidden",""); }
    if(a.status==="failed"&&a.error){ if(r.err.textContent!==a.error) r.err.textContent=a.error; if(r.err.hasAttribute("hidden")) r.err.removeAttribute("hidden"); if(r.errActs.hasAttribute("hidden")) r.errActs.removeAttribute("hidden"); }
    else { if(!r.err.hasAttribute("hidden")) r.err.setAttribute("hidden",""); if(!r.errActs.hasAttribute("hidden")) r.errActs.setAttribute("hidden",""); }
    var dtx="Cost "+fmtCost(a.cost||0)+" \u00B7 started "+fmtAgo(a.started||state.now)+(a.model&&!r.isSub?" \u00B7 "+a.model:"");
    if(r.det.textContent!==dtx) r.det.textContent=dtx;
    // kids container
    if(r.kids){ var has=(a.children||[]).length>0; if(has&&r.kids.hasAttribute("hidden")) r.kids.removeAttribute("hidden"); if(!has&&!r.kids.hasAttribute("hidden")) r.kids.setAttribute("hidden",""); }
    // highlight

    if(hl){ if(!r.art.classList.contains("is-hl")) r.art.classList.add("is-hl"); } else { if(r.art.classList.contains("is-hl")) r.art.classList.remove("is-hl"); }
  });

  eff.forEach(function(a){ var r=cardById[a.id]; if(r&&r.kids){ (a.children||[]).forEach(function(k){ var cr=cardById[k.id]; if(cr&&cr.art.parentNode!==r.kids) r.kids.appendChild(cr.art); }); } });
  refreshEvents(visIds);

function setText(el,v){ v=String(v); if(el.textContent!==v) el.textContent=v; }
function evLabel(e){ var s=e.title||""; var d=e.detail||(e.count!=null?String(e.count):""); return {t:s,d:d}; }
function refreshEvents(visIds){
  var evs=effEvents().filter(function(e){ return visIds[e.agent]; }).filter(function(e){ return (+e.at)>=state.now-E; }).sort(function(a,b){return b.at-a.at;});
  var seen={};
  evs.forEach(function(e){
    seen[e.id]=1;
    var r=eventById[e.id];
    if(!r){
      var b=document.createElement("button"); b.type="button"; b.className="ui-rca__item"; b.setAttribute("data-kind",e.kind||"done");
      var t=document.createElement("div"); t.className="ui-rca__t"; var d=document.createElement("div"); d.className="ui-rca__d"; var m=document.createElement("div"); m.className="ui-rca__m";
      b.appendChild(t); b.appendChild(d); b.appendChild(m);
      (function(id,ag){ b.addEventListener("mouseenter",function(){ state.highlight=ag; paintHighlight(); }); b.addEventListener("mouseleave",function(){ if(state.highlight===ag) state.highlight=null; paintHighlight(); }); b.addEventListener("focus",function(){ state.highlight=ag; paintHighlight(); }); b.addEventListener("blur",function(){ if(state.highlight===ag) state.highlight=null; paintHighlight(); }); })(e.id,e.agent);
      eventsEl.appendChild(b);
      r=eventById[e.id]={el:b,t:t,d:d,m:m,agent:e.agent,kind:e.kind};
    }
    if(r.el.getAttribute("data-kind")!==(e.kind||"done")) r.el.setAttribute("data-kind",e.kind||"done");
    var L=evLabel(e); if(r.t.textContent!==L.t) r.t.textContent=L.t; if(r.d.textContent!==L.d) r.d.textContent=L.d;
    var mm=L.d? (L.t? "":"") : ""; var meta=fmtAgo(e.at)+((e.count!=null)?" \u00B7 "+e.count:"");
    if(r.m.textContent!==meta) r.m.textContent=meta;
    if(r.agent!==e.agent){ r.agent=e.agent; }
  });
  Object.keys(eventById).forEach(function(id){ if(!seen[id]){ var r=eventById[id]; if(r.el.parentNode) r.el.parentNode.removeChild(r.el); delete eventById[id]; } });

  evs.forEach(function(e){ var r=eventById[e.id]; if(r&&r.el.parentNode===eventsEl) eventsEl.appendChild(r.el); });

function inboxTasks(eff){
  var all=flat(eff); var vis={}; flat(filterTree(eff,state.filter)).forEach(function(x){ if(matchSt(x.status,state.filter)) vis[x.id]=1; });
  return all.filter(function(a){ return vis[a.id]&&(a.status==="waiting"||a.status==="failed"); }).map(function(a){ return {id:a.id,title:a.task,description:a.ask||a.error||"",agent:a.status==="waiting"?("Asked by "+a.name):("Stopped in "+a.name),status:a.status==="waiting"?"waiting":"failed",raw:a}; });
}
function refreshInbox(eff,visIds){
  var tasks=inboxTasks(eff);
  var seen={};
  tasks.forEach(function(tk){
    seen[tk.id]=1;
    var r=inboxById[tk.id];
    if(!r){
      var c=document.createElement("div"); c.className="ui-ai__card"; c.setAttribute("data-id",tk.id);
      var ti=document.createElement("div"); ti.className="ui-ai__title";
      var de=document.createElement("div"); de.className="ui-ai__desc";
      var ag=document.createElement("div"); ag.className="ui-ai__agent";
      var ac=document.createElement("div"); ac.className="ui-ai__actions";
      var b1=document.createElement("button"); b1.type="button"; b1.className="ui-ai__btn";
      var b2=document.createElement("button"); b2.type="button"; b2.className="ui-ai__btn";
      ac.appendChild(b1); ac.appendChild(b2);
      c.appendChild(ti); c.appendChild(de); c.appendChild(ag); c.appendChild(ac);
      (function(id){ b1.addEventListener("click",function(ev){ ev.stopPropagation(); var cur=findEff(id); if(!cur) return; if(cur.status==="waiting") resolve(id,"approve"); else resolve(id,"retry"); }); b2.addEventListener("click",function(ev){ ev.stopPropagation(); var cur=findEff(id); if(!cur) return; if(cur.status==="waiting") resolve(id,"reject"); else resolve(id,"dismiss"); }); })(tk.id);
      inboxEl.appendChild(c);
      r=inboxById[tk.id]={el:c,ti:ti,de:de,ag:ag,b1:b1,b2:b2};
    }
    if(r.ti.textContent!==tk.title) r.ti.textContent=tk.title;
    if(r.de.textContent!==tk.description) r.de.textContent=tk.description;
    if(r.ag.textContent!==tk.agent) r.ag.textContent=tk.agent;
    var l1=tk.status==="waiting"?"Approve":"Retry", l2=tk.status==="waiting"?"Reject":"Dismiss";
    if(r.b1.textContent!==l1) r.b1.textContent=l1;
    if(r.b2.textContent!==l2) r.b2.textContent=l2;

  });
  Object.keys(inboxById).forEach(function(id){ if(!seen[id]){ var r=inboxById[id]; if(r.el.parentNode) r.el.parentNode.removeChild(r.el); delete inboxById[id]; } });
  tasks.forEach(function(tk){ var r=inboxById[tk.id]; if(r) inboxEl.appendChild(r.el); });
  setText(inboxCountEl, tasks.length? String(tasks.length)+" need"+(tasks.length>1?"":"s")+" you" : "clear");

function findEff(id){ var f=null; flat(allEff()).forEach(function(a){ if(a.id===id) f=a; }); return f; }
function paintHighlight(){
  Object.keys(cardById).forEach(function(id){ var r=cardById[id]; var on=state.highlight===id; if(on){ if(!r.art.classList.contains("is-hl")) r.art.classList.add("is-hl"); } else { if(r.art.classList.contains("is-hl")) r.art.classList.remove("is-hl"); } });
  Object.keys(eventById).forEach(function(id){ var r=eventById[id]; var on=state.highlight===r.agent; if(on){ if(!r.el.classList.contains("is-hl")) r.el.classList.add("is-hl"); } else { if(r.el.classList.contains("is-hl")) r.el.classList.remove("is-hl"); } });
  Object.keys(inboxById).forEach(function(id){ var r=inboxById[id]; var on=state.highlight===id; if(on){ if(!r.el.classList.contains("is-hl")) r.el.classList.add("is-hl"); } else { if(r.el.classList.contains("is-hl")) r.el.classList.remove("is-hl"); } });
}
// ---- live loop ----
function bump(agentId){
  var found=false;
  function rec(l){ return l.map(function(a){ if(a.id===agentId&&a.status==="running"){ found=true; var n={}; for(var k in a) n[k]=a[k]; n.cost=(n.cost||0)+0.04; if(a.children) n.children=rec(a.children); return n; } if(a.children){ var nn={}; for(var k2 in a) nn[k2]=a[k2]; nn.children=rec(a.children); return nn; } return a; }); }
  state.agents=rec(state.agents); return found;
}
function liveStep(n, at){
  var tpl=LIVE[n%LIVE.length];
  if(!bump(tpl.agent)) return false;
  var ev={id:"live-"+n,agent:tpl.agent,at:at,kind:"done",title:tpl.title};
  if(tpl.count!=null) ev.count=tpl.count; if(tpl.detail) ev.detail=tpl.detail;
  state.events=state.events.filter(function(e){ return (+e.at)>at-E-C; });
  state.events.push(ev);
  return true;
}
function tick(){
  var virt=t0+(Date.now()-t0)*SPEED;
  state.now=virt;
  var ns=Math.floor((virt-t0)/D);
  if(ns>state.step){ for(var s=state.step;s<ns;s++){ liveStep(s, t0+(s+1)*D); } state.step=Math.max(state.step,ns); refreshAll(false); }
  else { // still update clocks/costs display cheaply in place without rebuild
    // update elapsed/time labels only
    var eff=allEff();
    flat(eff).forEach(function(a){ var r=cardById[a.id]; if(r&&!r.art.hasAttribute("hidden")){ var es=fmtAgo(a.started||state.now)+((a.ended)?" \u00B7 ended "+fmtAgo(a.ended):""); if(r.elapsed.textContent!==es) r.elapsed.textContent=es; } });
    Object.keys(eventById).forEach(function(id){ var r=eventById[id]; var ev=null; state.events.forEach(function(e){ if(e.id===id) ev=e; }); if(ev){ var meta=fmtAgo(ev.at)+((ev.count!=null)?" \u00B7 "+ev.count:""); if(r.m.textContent!==meta) r.m.textContent=meta; } });
    if(nowEl){ var nv=fmtAgo(state.now-0)+" \u00B7 live"; if(nowEl.textContent!==nv) nowEl.textContent=nv; }
  }
}
// init build
(function init(){
  var eff=allEff(); ensureCards(eff); renderAgentsSkeleton(eff); syncFilterUI(); refreshAll(false);
  var reduce=false; try{ reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
  var iv=window.setInterval(tick, reduce?1000:125);
  if(window.__mcTest) window.__mcTest.iv=iv;
})();
// test hooks
try{
  window.__mc={state:state,tick:tick,liveStep:liveStep,stepTo:function(n){ for(var s=state.step;s<n;s++){ liveStep(s,t0+(s+1)*D);} state.step=Math.max(state.step,n); state.now=t0+n*D; refreshAll(false); },cards:cardById,events:eventById,inbox:inboxById,setFilter:setFilter,resolve:resolve,getCounts:function(){return {filter:state.filter,now:state.now,step:state.step}}};
}catch(e){}
})();
