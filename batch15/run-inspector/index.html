<style>

html[data-theme="light"]{

  --focus:rgba(0,96,226,.7);
}
html[data-theme="dark"]{
  --surface:#1c1c1f;--page:#101012;--ink:#ededed;--muted:#a1a1aa;--subtle:#26262a;
  --border:#2e2e33;--tray:#19191c;--track:#2a2a2e;--fill:#26262a;--picked:#162b3f;
  --llm-bg:#39244c;--llm-edge:#6f4793;--tool-bg:#15303b;--tool-edge:#0a85b8;
  --err-bg:#3b1c14;--err-edge:#7a3725;--err-fg:#ff8a7a;
  --amber:#fbbf24;--amber-bg:#451a03;--amber-fg:#fde68a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
  --focus:rgba(77,141,255,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:20px;background:var(--page);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ri-page{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
/* header: project name + working count + agent count, toggle top-right */
.ri-header{display:flex;align-items:flex-start;gap:12px;margin:0 0 12px}
.ri-title{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{margin:2px 0 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ri-count{font-variant-numeric:tabular-nums}
.ri-pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--subtle);color:var(--muted)}
.ri-pill.live{color:var(--amber-fg);background:var(--amber-bg);border-color:var(--amber)}
.ri-pill.bad{color:var(--err-fg);background:var(--err-bg);border-color:var(--err-edge)}
.ri-pill.ok{color:var(--muted)}
.ri-toggle{margin-left:auto;flex:none;width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);font-size:16px;line-height:1;display:grid;place-items:center;transition:transform 150ms ease,box-shadow 150ms ease}
.ri-toggle:hover{transform:translateY(-1px)}
/* cards + facts */
.ri-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px;transition:box-shadow 150ms ease}
.ri-facts{margin:0 0 12px}
.ri-facts dl{margin:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 20px}
.ri-facts dt{font-size:12px;line-height:16px;color:var(--muted)}
.ri-facts dd{margin:0;font-size:14px;font-weight:500;line-height:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-facts dd[data-bad]{color:var(--err-fg)}
.ri-errbtn{color:inherit;text-align:inherit;border-radius:6px}
.ri-errbtn:hover{text-decoration:underline}
/* run layout */
.ri-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.ri-sect{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.ri-agent{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;margin:0 0 10px;transition:box-shadow 150ms ease,transform 150ms ease}
.ri-agent:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.ri-agent.sub{padding:8px 10px}
.ri-agent.sel{border-color:var(--focus)}
.ri-ahead{display:flex;align-items:center;gap:8px;width:100%;text-align:inherit;border-radius:6px;padding:2px}
.ri-aname{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px;font-weight:600}
.ri-agent.sub .ri-aname{font-size:14px}
.ri-amodel{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-atask{margin:4px 0 8px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ri-status.running{color:var(--amber-fg);background:var(--amber-bg);border-color:var(--amber)}
.ri-status.failed{color:var(--err-fg);background:var(--err-bg);border-color:var(--err-edge)}
.ri-status.done{color:var(--muted)}

.ri-pix i{width:6px;height:6px;border-radius:1.5px;background:var(--border)}
.ri-pix i.on{background:var(--pix,var(--amber))}
.ri-pix.live i.on{animation:ri-tw 1.6s ease-in-out infinite}
.ri-pix.live i.on:nth-child(2n){animation-delay:.2s}
.ri-pix.live i.on:nth-child(3n){animation-delay:.5s}
.ri-pix.live i.on:nth-child(4n){animation-delay:.8s}
@keyframes ri-tw{0%,100%{opacity:1}50%{opacity:.35}}

.ri-trace{display:grid;gap:1px;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.ri-item{display:grid;min-width:0}
.ri-row{display:grid;grid-template-columns:20px minmax(0,1fr) 56px 52px;align-items:center;gap:6px;min-height:26px;padding:2px 6px;border-radius:7px;font-size:12.5px;line-height:16px;color:var(--muted);transition:background-color 140ms ease,color 140ms ease;width:100%}
.ri-row:hover{background:var(--fill);color:var(--ink)}
.ri-row[aria-expanded="true"]{background:var(--picked);color:var(--ink)}
.ri-ico{display:grid;width:20px;height:20px;place-items:center}
.ri-dot{width:16px;height:16px;border-radius:999px;display:grid;place-items:center;font-size:9px;font-weight:700;line-height:1;border:1px solid var(--border);background:var(--subtle);color:var(--muted)}
.ri-row[data-kind="llm"] .ri-dot{background:var(--llm-bg);border-color:var(--llm-edge)}
.ri-row[data-kind="tool"] .ri-dot{background:var(--tool-bg);border-color:var(--tool-edge)}
.ri-row[data-status="failed"] .ri-dot{background:var(--err-bg);border-color:var(--err-edge);color:var(--err-fg)}
.ri-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.ri-track{position:relative;height:8px;border-radius:3px;background:var(--track);overflow:hidden}
.ri-bar{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--tool-bg);box-shadow:inset 0 0 0 .5px var(--tool-edge);transition:left 200ms ease,width 200ms ease}
.ri-row[data-kind="llm"] .ri-bar{background:var(--llm-bg);box-shadow:inset 0 0 0 .5px var(--llm-edge)}
.ri-row[data-status="failed"] .ri-bar{background:var(--err-bg);box-shadow:inset 0 0 0 .5px var(--err-edge)}
.ri-row[data-status="running"] .ri-bar{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);background-size:40px 100%;background-repeat:no-repeat;animation:ri-sweep 1.3s linear infinite}
@keyframes ri-sweep{from{background-position:-40px 0}to{background-position:calc(100% + 40px) 0}}
.ri-took{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap;font-size:12px}
.ri-row[data-status="failed"] .ri-took{color:var(--err-fg)}
.ri-more{justify-self:start;min-height:24px;margin-left:2px;padding:0 6px;border-radius:6px;font-size:12px;color:var(--muted)}
.ri-more:hover{color:var(--ink)}
.ri-detail{display:grid;gap:2px;margin:2px 0 6px;padding:8px 10px 9px;border-radius:10px;background:var(--fill);font-size:12.5px;line-height:18px;animation:ri-open 200ms ease both}
@keyframes ri-open{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.ri-dwhat{display:flex;align-items:baseline;gap:8px;min-width:0}
.ri-dwhat>span:first-child{min-width:0;overflow:hidden;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.ri-dwhat>[data-state]{flex:none;margin-left:auto;font-size:11px;color:var(--muted)}
.ri-detail[data-status="failed"] [data-state]{font-weight:600;color:var(--err-fg)}
.ri-derror{color:var(--err-fg);overflow-wrap:anywhere}
.ri-dout{color:var(--ink);overflow:hidden;overflow-wrap:anywhere}
.ri-din{overflow:hidden;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.ri-din>span{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--muted)}
.ri-foot{margin:14px 0 0;font-size:12px;color:var(--muted)}
@media (max-width:760px){
  .ri-grid{grid-template-columns:minmax(0,1fr)}
  .ri-facts dl{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ri-title{white-space:normal}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- build (once) ---------- */
function buildPix(id){
  var w=el('span','ri-pix');w.setAttribute('aria-hidden','true');
  var h=hashStr('pix:'+id),c=pixFor(id),i,b;
  w.style.setProperty('--pix',c);
  for(i=0;i<9;i++){b=document.createElement('i');if(((h>>(i%16))>>(0))%2===0||((h>>i)&1)===1){b.setAttribute('class','on');}w.appendChild(b);}
  return w;
}
function buildRow(call){
  var item=el('div','ri-item');
  var row=document.createElement('button');
  row.setAttribute('type','button');
  row.setAttribute('class','ri-row');
  row.setAttribute('data-kind',call.kind);
  row.setAttribute('data-status','queued');
  var icon=el('span','ri-ico');icon.setAttribute('aria-hidden','true');
  var dot=el('span','ri-dot',glyphFor(call));icon.appendChild(dot);row.appendChild(icon);
  var nm=el('span','ri-name',call.name);nm.setAttribute('dir','auto');nm.setAttribute('title',call.name);row.appendChild(nm);
  var tr=el('span','ri-track');tr.setAttribute('aria-hidden','true');
  var bar=el('span','ri-bar');tr.appendChild(bar);row.appendChild(tr);
  var took=el('span','ri-took','\u2014');row.appendChild(took);
  item.appendChild(row);
  var det=el('div','ri-detail');det.setAttribute('id',call.id+'-detail');det.setAttribute('data-status','queued');det.hidden=true;
  var what=el('p','ri-dwhat');
  var w0=el('span',null,call.kind==='tool'?(call.tool||call.detail||'Tool'):(call.model||'Model'));
  var w1=el('span',null,'Queued');w1.setAttribute('data-state','');
  what.appendChild(w0);what.appendChild(w1);det.appendChild(what);
  var body=el('p','ri-dout','No output');det.appendChild(body);
  var inp=el('p','ri-din');var lab=el('span',null,call.kind==='tool'?'Called with':'Prompt');inp.appendChild(lab);det.appendChild(inp);
  var inTxt=document.createTextNode('');inp.appendChild(inTxt);
  item.appendChild(det);
  var clickGuard=false;
  function toggle(){userLatch=true;openCall=(openCall===call.id)?null:call.id;syncCallsOnly();}
  row.addEventListener('pointerdown',function(){toggle();clickGuard=true;},true);
  row.addEventListener('click',function(){if(clickGuard){clickGuard=false;return;}toggle();});
  row.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&openCall===call.id){userLatch=true;openCall=null;syncCallsOnly();}ev.stopPropagation();});
  R.rows[call.id]={item:item,row:row,bar:bar,took:took,det:det,w0:w0,w1:w1,body:body,inp:inp,inTxt:inTxt,lastBar:null,lastTook:null,lastState:null,call:call};
  return item;
}
function buildTrace(agent){
  var calls=callsOf(agent.id);
  var box=el('div','ri-trace');box.setAttribute('role','list');box.setAttribute('aria-label','Calls of '+agent.name);
  var i;
  for(i=0;i<calls.length;i++){box.appendChild(buildRow(calls[i]));}
  var more=null;
  if(calls.length>MAXR){
    more=document.createElement('button');
    more.setAttribute('type','button');more.setAttribute('class','ri-more');
    (function(aid){more.addEventListener('click',function(){moreOpen[aid]=!moreOpen[aid];frame(clock,true);});})(agent.id);
    box.appendChild(more);
  }
  return {box:box,more:more,calls:calls};
}
function buildAgentCard(agent,isSub){
  var card=el('article','ri-agent'+(isSub?' sub':''));
  card.setAttribute('data-agent',agent.id);
  var head=document.createElement('button');
  head.setAttribute('type','button');head.setAttribute('class','ri-ahead');
  head.setAttribute('aria-label',agent.name+(agent.model?', '+agent.model:''));
  var pix=buildPix(agent.id);head.appendChild(pix);
  var nm=el('span','ri-aname',agent.name);nm.setAttribute('dir','auto');head.appendChild(nm);
  if(agent.model){var mo=el('span','ri-amodel',agent.model);head.appendChild(mo);}
  var st=el('span','ri-status','Queued');head.appendChild(st);
  card.appendChild(head);
  var guard=false;
  head.addEventListener('pointerdown',function(){selectAgent(agent.id);guard=true;},true);
  head.addEventListener('click',function(){if(guard){guard=false;return;}selectAgent(agent.id);});
  if(agent.task){var tk=el('p','ri-atask',agent.task);tk.setAttribute('dir','auto');tk.setAttribute('title',agent.task);card.appendChild(tk);}
  var tr=buildTrace(agent);card.appendChild(tr.box);
  var subBox=el('div','ri-subs');
  var subs=agentsOf(agent.id),i;
  for(i=0;i<subs.length;i++){subBox.appendChild(buildAgentCard(subs[i],true));}
  card.appendChild(subBox);
  R.cards[agent.id]={card:card,head:head,pix:pix,st:st,more:tr.more,trace:tr,agent:agent,lastSt:null};
  return card;
}
function selectAgent(id){
  userLatch=true;
  if(id===ROOT.id||id===selId){selId=null;}else{selId=id;}
  frame(clock,true);
}
function build(){
  var app=document.getElementById('app');
  var page=el('div','ri-page');
  var header=el('div','ri-header');
  var htxt=el('div',null);htxt.setAttribute('style','min-width:0;flex:1');
  var h1=el('h1','ri-title',ROOT.task);h1.setAttribute('id','riTitle');htxt.appendChild(h1);
  var sub=el('p','ri-sub');
  var wc=el('span','ri-count','0 working');wc.setAttribute('id','riWork');sub.appendChild(wc);
  var agents=el('span','ri-count','5 agents');agents.setAttribute('id','riAgents');sub.appendChild(agents);
  var pill=el('span','ri-pill live','Running');pill.setAttribute('id','riStatus');sub.appendChild(pill);
  htxt.appendChild(sub);header.appendChild(htxt);
  var tg=document.createElement('button');
  tg.setAttribute('type','button');tg.setAttribute('class','ri-toggle');
  tg.setAttribute('id','riTheme');tg.setAttribute('aria-label','Switch to dark theme');
  tg.textContent='\u263E';
  tg.addEventListener('click',function(){
    var h=document.documentElement;
    var cur=h.getAttribute('data-theme')==='dark'?'light':'dark';
    h.setAttribute('data-theme',cur);
    try{localStorage.setItem('run-inspector-theme',cur);}catch(e){}
    tg.textContent=cur==='dark'?'\u2600':'\u263E';
    tg.setAttribute('aria-label',cur==='dark'?'Switch to light theme':'Switch to dark theme');
  });
  header.appendChild(tg);
  page.appendChild(header);
  R.head.work=wc;R.head.agents=agents;R.head.pill=pill;R.head.toggle=tg;
  var facts=el('section','ri-card ri-facts');facts.setAttribute('aria-label','Run totals');
  var dl=document.createElement('dl');dl.setAttribute('id','riFacts');
  var names=['Duration','Cost','Tokens','Model calls','Tool calls','Errors'],i;
  for(i=0;i<names.length;i++){
    (function(nm){
      var wrap=document.createElement('div');
      var dt=document.createElement('dt');dt.textContent=nm;wrap.appendChild(dt);
      var dd=document.createElement('dd');
      if(nm==='Errors'){
        var b=document.createElement('button');
        b.setAttribute('type','button');b.setAttribute('class','ri-errbtn');b.setAttribute('id','riErrBtn');
        b.setAttribute('aria-label','Errors: open the failed call');
        b.textContent='0';
        var g=false;
        b.addEventListener('pointerdown',function(){g=true;openFailed();},true);
        b.addEventListener('click',function(){if(g){g=false;return;}openFailed();});
        dd.appendChild(b);
        R.facts[nm]={dd:dd,btn:b,last:null};
      }else{dd.textContent='\u2014';R.facts[nm]={dd:dd,last:null};}
      wrap.appendChild(dd);dl.appendChild(wrap);
    })(names[i]);
  }
  facts.appendChild(dl);page.appendChild(facts);
  var grid=el('div','ri-grid');
  var left=el('div',null);
  var s1=el('p','ri-sect','Run tree');left.appendChild(s1);
  left.appendChild(buildAgentCard(ROOT,false));
  var right=el('div',null);
  var s2=el('p','ri-sect','Supervisor');right.appendChild(s2);
  right.appendChild(buildAgentCard(BYID.inspector,false));
  grid.appendChild(left);grid.appendChild(right);page.appendChild(grid);
  var foot=el('p','ri-foot','Loop 17.6s \u00B7 auto-focus on Coder while checkout tests fail \u00B7 click a row for inputs and outputs');page.appendChild(foot);
  app.appendChild(page);
  /* theme toggle reflects stored theme (noflash guard set it already) */
  try{
    var cur=document.documentElement.getAttribute('data-theme')||'light';
    tg.textContent=cur==='dark'?'\u2600':'\u263E';
    tg.setAttribute('aria-label',cur==='dark'?'Switch to light theme':'Switch to dark theme');
  }catch(e){}
}
function openFailed(){
  userLatch=true;selId='coder';openCall='tests';
  moreOpen.coder=true;
  frame(clock,true);
}
/* ---------- per-frame in-place update ---------- */
function fmtState(st){return st==='failed'?'Failed':(st==='running'?'Running\u2026':(st==='done'?'Done':'Queued'));}
function syncCallsOnly(){
  var S=Math.min(clock,RUN_END),nowMs=P(S),id;
  for(id in R.rows){updateRow(R.rows[id],S,nowMs);}
}
function updateRow(r,S,nowMs){
  var c=r.call,d=dyn(c,S,nowMs);
  var vis=d.started;
  if(r.item.hidden===vis)r.item.hidden=!vis;
  if(!vis)return;
  var open=openCall===c.id;
  if(r.row.getAttribute('data-status')!==d.status)r.row.setAttribute('data-status',d.status);
  if(r.row.getAttribute('aria-expanded')!==(open?'true':'false'))r.row.setAttribute('aria-expanded',open?'true':'false');
  if(open&&!r.row.getAttribute('aria-controls'))r.row.setAttribute('aria-controls',c.id+'-detail');
  if(!open&&r.row.getAttribute('aria-controls'))r.row.setAttribute('aria-controls','');
  var dur=d.endMs-P(c.at);
  var took=d.status==='running'?'\u2026':fmtDur(dur);
  if(r.lastTook!==took){r.lastTook=took;setText(r.took,took);}
  r.row.setAttribute('aria-label',c.name+', '+(d.status==='running'?'running':took)+(d.status==='failed'?', failed':''));
  /* bar geometry */
  var host=BYID[c.parent],span=Math.max(1,(dyn(host,S,nowMs).endMs-P(host.at)));
  var L=Math.min((P(c.at)-P(host.at))/span*100,100-2.5);
  var W=Math.max(2.5,(d.endMs-P(c.at))/span*100);
  var key=L.toFixed(2)+'/'+W.toFixed(2);
  if(r.lastBar!==key){r.lastBar=key;r.bar.style.left=L+'%';r.bar.style.width=W+'%';}
  /* detail */
  if(r.det.hidden===open)r.det.hidden=!open;
  if(!open)return;
  if(r.det.getAttribute('data-status')!==d.status)r.det.setAttribute('data-status',d.status);
  setText(r.w0,c.kind==='tool'?(c.tool||c.detail||'Tool'):(c.model||'Model'));
  setText(r.w1,fmtState(d.status));
  var bodyVal=c.error?c.error:(fmtVal(c.result!==undefined?c.result:c.output)!==undefined?fmtVal(c.result!==undefined?c.result:c.output):(d.status==='running'?'Still running\u2026':'No output'));
  if(r.body.getAttribute('class')!==(c.error?'ri-derror':'ri-dout'))r.body.setAttribute('class',c.error?'ri-derror':'ri-dout');
  setText(r.body,bodyVal);
  var inVal=fmtVal(c.args!==undefined?c.args:c.input);
  setText(r.inTxt,inVal==null?'':' '+inVal);
  if(r.inp.hidden===(inVal==null))r.inp.hidden=(inVal==null);
}
function frame(t,force){
  clock=t;
  var S=Math.min(t,RUN_END),nowMs=P(S);
  if(t<prevT)gen++;
  prevT=t;
  var auto=!userLatch&&(t>=WIN_S&&t<WIN_E);
  if(!userLatch){
    selId=auto?'coder':null;
    openCall=auto?'tests':null;
  }
  var sel=selId?BYID[selId]:ROOT;
  /* precompute dyn for all */
  var i,n,D={};
  for(i=0;i<NODES.length;i++){n=NODES[i];D[n.id]=dyn(n,S,nowMs);}
  /* header counts */
  var working=0,visAgents=0;
  for(i=0;i<NODES.length;i++){n=NODES[i];if(D[n.id].status==='running')working++;}
  for(i=0;i<AGENTS.length;i++){if(D[AGENTS[i].id].started)visAgents++;}
  setText(R.head.work,working+' working');
  setText(R.head.agents,visAgents+' agents');
  var runDone=D.root.done&&D.inspector.done;
  var pill=R.head.pill;
  var ptxt=runDone?'Done':(working>0?'Running':'Queued');
  var pcls='ri-pill '+(runDone?'ok':(D.tests&&D.tests.status==='failed'&&S>=8.5?'bad':'live'));
  setText(pill,ptxt);
  if(pill.__c!==pcls){pill.__c=pcls;pill.setAttribute('class',pcls);}
  /* facts for selected subtree */
  var flat=flatOf(sel.id);
  var dur=D[sel.id].endMs-P(sel.at);
  var cost=0,tok=0,mc=0,tc=0,ec=0;
  for(i=0;i<flat.length;i++){n=flat[i];var d=D[n.id];
    if(n.kind==='llm'){mc++;}else if(n.kind==='tool'){tc++;}
    if(d.status==='failed')ec++;
    if(d.cost!=null)cost+=d.cost;
    if(n.tin!=null)tok+=n.tin;
    if(d.tout!=null)tok+=d.tout;
  }
  var F=[['Duration',fmtDur(dur)],['Cost',fmtCost(cost)],['Tokens',fmtNum(tok)],['Model calls',String(mc)],['Tool calls',String(tc)],['Errors',String(ec)]];
  for(i=0;i<F.length;i++){
    (function(nm,val){
      var r=R.facts[nm];
      if(nm==='Errors'){
        if(r.last!==val){r.last=val;setText(r.btn,val);}
        var bad=parseInt(val,10)>0;
        if(bad&&!r.dd.hasAttribute('data-bad'))r.dd.setAttribute('data-bad','');
        if(!bad&&r.dd.hasAttribute('data-bad'))r.dd.removeAttribute('data-bad');
      }else if(r.last!==val){r.last=val;setText(r.dd,val);}
    })(F[i][0],F[i][1]);
  }
  /* cards */
  var id;
  for(id in R.cards){
    (function(rc){
      var a=rc.agent,d=D[a.id];
      if(rc.card.hidden===d.started)rc.card.hidden=!d.started;
      if(!d.started)return;
      if(rc.lastSt!==d.status){
        rc.lastSt=d.status;
        setText(rc.st,d.status==='running'?'Running':(d.status==='failed'?'Failed':(d.status==='done'?'Done':'Queued')));
        rc.st.setAttribute('class','ri-status '+d.status);
        var px=rc.pix.getAttribute('class')||'';
        var want='ri-pix'+(d.status==='running'?' live':'');
        if(px!==want)rc.pix.setAttribute('class',want);
      }
      var want2='ri-agent'+(a.parent&&BYID[a.parent]&&BYID[a.parent].parent?' sub':'')+((selId===a.id)?' sel':'');
      if(rc.card.__c!==want2){rc.card.__c=want2;rc.card.setAttribute('class',want2);}
      /* show-more window */
      var calls=rc.trace.calls,more=rc.more;
      if(more){
        var open=!!moreOpen[a.id];
        var list=(open||calls.length<=MAXR)?calls:calls.slice(0,CUT);
        var k;
        for(k=0;k<calls.length;k++){
          var shouldHide=list.indexOf(calls[k])<0;
          var rr=R.rows[calls[k].id];
          if(rr.item.__mh!==shouldHide){rr.item.__mh=shouldHide;if(shouldHide&&D[calls[k].id].started){rr.item.hidden=true;}else if(!shouldHide){rr.item.hidden=!D[calls[k].id].started;}}
        }
        var lbl=open?'Show less':'+'+(calls.length-MAXR+1)+' more';
        setText(more,lbl);
      }
    })(R.cards[id]);
  }
  /* rows */
  for(id in R.rows){updateRow(R.rows[id],S,nowMs);}
}
/* ---------- boot ---------- */
build();
frame(0,true);
var t0=null;
try{t0=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();}catch(e){t0=0;}
var timerId=null;
try{
  timerId=setInterval(function(){
    var now=0;
    try{now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();}catch(e){now=t0+clock*1000;}
    var e=((now-t0)/1000)%LOOP;
    frame(e);
  },60);
}catch(e){}
window.__ri={frame:frame,select:selectAgent,nodes:NODES,byId:BYID,LOOP:LOOP,RUN_END:RUN_END,
  get clock(){return clock;},get gen(){return gen;},get sel(){return selId;},get open(){return openCall;},
  get latched(){return userLatch;},refs:R,timer:timerId};
})();
</script>
</body>
