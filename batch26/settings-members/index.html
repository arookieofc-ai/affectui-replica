<!doctype html>
<html lang="en" data-theme="light">
<head>
<script>/*noflash*/(function(){try{var k="ui-st-theme",s=null;try{s=localStorage.getItem(k)}catch(e){}if(!s){try{s=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){s="light"}}document.documentElement.setAttribute("data-theme",s==="dark"?"dark":"light")}catch(e){try{document.documentElement.setAttribute("data-theme","light")}catch(_){}}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<meta name="color-scheme" content="light dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members &amp; teams — Settings</title>
<style>
:root{color-scheme:light dark}
html{-webkit-tap-highlight-color:transparent}
html[data-theme="light"]{
--page:#fafaf9;--surface:#ffffff;--card:#ffffff;--ink:#1c1917;--strong:#1c1917;--text:#1c1917;
--muted:#78716c;--subtle:#f5f5f4;--chip:#f5f5f4;--frame:#f5f5f4;--border:#e7e5e4;--line:#e7e5e4;
--hover:#f5f5f4;--accent:#1d4ed8;--accent-soft:#eff6ff;--focus:#1d4ed8;--faint:#d6d3d1;
--red:#dc2626;--amber:#92400e;--amber-bg:#fef3c7;--amber-bar:#f59e0b;
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--card-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
html[data-theme="dark"]{
--page:#101012;--surface:#1c1c1f;--card:#1c1c1f;--ink:#ededed;--strong:#ededed;--text:#ededed;
--muted:#a1a1aa;--subtle:#26262a;--chip:#26262a;--frame:#26262a;--border:#2e2e33;--line:#2e2e33;
--hover:#2a2a2e;--accent:#93c5fd;--accent-soft:#1c2a3f;--focus:#93c5fd;--faint:#52525b;
--red:#f87171;--amber:#fde68a;--amber-bg:#451a03;--amber-bar:#fbbf24;
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
--card-shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;
font-variant-numeric:tabular-nums}
img{box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
html[data-theme="dark"] img{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.topbar{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:14px 20px 0}
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:none;border:0;padding:6px 8px 6px 6px;border-radius:8px;cursor:pointer}
.settings-pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);border:1px solid var(--border)}
.spacer{flex:1}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--card-shadow);padding-right:1px}
.theme-btn:focus-visible,.backlink:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:6px 20px 64px}
h1.page-title{font-size:16px;font-weight:600;margin:10px 0 4px;color:var(--strong);letter-spacing:-.01em}
.page-sub{margin:0 0 4px;font-size:13px;color:var(--muted)}
.page-sub a{color:inherit}
.tabs{display:flex;gap:4px;margin-top:20px;padding:3px;background:var(--chip);border-radius:calc(var(--radius) + 2px);width:max-content;border:1px solid var(--border)}
.tab{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;padding:6px 14px;padding-left:12px;border-radius:calc(var(--radius) - 1px);cursor:pointer;min-width:96px}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--card-shadow)}
.panel{display:flex;flex-direction:column;animation:rise 380ms ease both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px;border-radius:calc(var(--radius-lg) + 2px);background:var(--card);box-shadow:var(--card-shadow);border:1px solid var(--border)}
.stats>div{display:grid;gap:2px;padding:14px 16px;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats .lbl{font-size:12px;line-height:16px;color:var(--muted)}
.stats .big{font-size:20px;line-height:28px;font-weight:500;color:var(--strong);font-variant-numeric:tabular-nums}
.stats .big i{font-size:13px;font-style:normal;font-weight:400;color:var(--muted)}
.stats .sub{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seats{display:block;height:4px;margin-top:6px;border-radius:2px;background:var(--chip);overflow:hidden}
.seats i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.note{display:flex;align-items:flex-start;gap:8px;margin:16px 0 0;padding:10px 12px;border-radius:var(--radius);background:var(--accent-soft);font-size:13px;line-height:20px;color:var(--accent);border:1px solid var(--border)}
.note svg{flex:none;margin-top:2px}
.note button{font-weight:500;color:inherit;text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;padding:0;font-size:inherit}
.toolbar{display:flex;align-items:center;gap:8px;margin-top:28px;flex-wrap:wrap}
.search{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:0 8px;height:32px;min-width:200px;box-shadow:var(--card-shadow)}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:transparent;color:var(--ink);font-size:13px;outline:none;width:190px}
.filter-btn,.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;padding-left:10px;border-radius:calc(var(--radius-sm) + 1px);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--ink);box-shadow:var(--card-shadow);transition:background-color 160ms ease,transform 160ms ease}
.btn-primary{background:var(--ink);color:var(--page);border-color:var(--ink);padding-left:10px}
html[data-theme="dark"] .btn-primary{background:#ededed;color:#101012;border-color:#ededed}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--card)}
.toolbar-end{display:flex;align-items:center;gap:6px;margin-left:auto}
.anchor{position:relative;display:inline-flex}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:200px;background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 1px);box-shadow:var(--shadow);padding:6px;z-index:30;display:grid;gap:2px}
.menu[hidden]{display:none}
.menu.left{left:0;right:auto}
.menu button.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font-size:13px;padding:8px 10px;padding-left:8px;border-radius:calc(var(--radius) - 2px);cursor:pointer}
.menu button.item.danger{color:var(--red)}
.menu .check{width:16px;flex:none;color:var(--accent)}
.invite-pop{width:300px;padding:14px;display:grid;gap:6px}
.invite-pop b{font-size:13px;font-weight:600;color:var(--strong)}
.invite-pop .hint{font-size:12px;color:var(--muted)}
.invite-pop input[type="email"]{margin-top:6px;height:32px;border-radius:calc(var(--radius-sm) + 1px);border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:0 10px;font-size:13px;width:100%}
.roleseg{display:flex;gap:4px;margin:4px 0 6px;padding:2px;border-radius:calc(var(--radius) + 1px);background:var(--chip);border:1px solid var(--border)}
.roleseg button{flex:1;height:26px;border:0;border-radius:calc(var(--radius) - 1px);font-size:12px;color:var(--muted);background:transparent;cursor:pointer}
.roleseg button[aria-checked="true"]{background:var(--card);box-shadow:var(--card-shadow);color:var(--ink);font-weight:600}
.bulk{display:flex;align-items:center;gap:6px;margin-top:12px;padding:6px 6px 6px 12px;border-radius:var(--radius);background:var(--frame);border:1px solid var(--line);font-size:13px;position:relative;z-index:11}
.bulk[hidden]{display:none}
.bulk b{margin-right:6px;font-weight:500;color:var(--strong)}
.bulk-btn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;padding-left:8px;border-radius:calc(var(--radius) - 1px);background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow);font-size:13px;color:var(--ink);cursor:pointer}
.bulk-btn.danger{color:var(--red)}
.bulk-clear{margin-left:auto;height:28px;padding:0 8px;border:0;border-radius:calc(var(--radius) - 1px);font-size:13px;color:var(--muted);background:transparent;cursor:pointer}
.table{margin-top:12px;border-radius:calc(var(--radius) + 2px);background:var(--card);box-shadow:var(--card-shadow);border:1px solid var(--border);overflow:visible}
.tr{display:grid;grid-template-columns:36px minmax(0,1fr) 120px 110px 120px 36px;align-items:center;gap:8px;min-height:56px;padding:0 10px 0 14px;transition:background-color 140ms ease}
.tr+.tr{border-top:1px solid var(--line)}
.tr-head{min-height:40px;font-size:12px;color:var(--muted)}
.tr>span{display:flex;align-items:center;min-width:0}
.person{gap:10px}
.person-text{display:grid;flex:1;min-width:0}
.person-text b{display:flex;align-items:center;gap:4px;min-width:0;font-size:13px;line-height:20px;font-weight:500;color:var(--strong);white-space:nowrap}
.person-text b>span.nm{overflow:hidden;text-overflow:ellipsis}
.person-text b i.you{font-style:normal;font-weight:400;color:var(--muted);flex:none}
.person-text b em{margin-left:4px;padding:1px 6px;border-radius:calc(var(--radius-sm) - 1px);background:var(--chip);border:1px solid var(--border);font-size:11px;font-style:normal;font-weight:500;color:var(--muted);flex:none}
.person-text small{overflow:hidden;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.avatar{display:grid;flex:none;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--h,210) 70% 94%);font-size:11px;font-weight:600;color:hsl(var(--h,210) 45% 38%)}
html[data-theme="dark"] .avatar{background:hsl(var(--h,210) 30% 22%);color:hsl(var(--h,210) 60% 78%)}
.avatar.mail{font-size:13px}
.pick{display:inline-flex;align-items:center;gap:6px;height:28px;margin-left:-8px;padding:0 8px;padding-left:6px;border-radius:calc(var(--radius-sm) + 1px);font-size:13px;color:var(--text);background:transparent;border:0;cursor:pointer;transition:background-color 140ms ease}
.pick.chip{height:24px;margin-left:0;padding:0 6px 0 8px;gap:4px;background:var(--chip);border:1px solid var(--border);font-size:12px;font-weight:500}
.pick.chip[data-plan="Business"]{background:var(--accent-soft);color:var(--accent);border-color:var(--border)}
.pick svg{color:var(--muted);flex:none}
.pick.chip[data-plan="Business"] svg{color:inherit}
.usage{gap:8px}
.ubar{display:block;flex:none;width:56px;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.ubar i{display:block;height:100%;border-radius:inherit;background:var(--faint)}
.ubar[data-high] i{background:#d97506}
html[data-theme="dark"] .ubar[data-high] i{background:#fbbf24}
.usage small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding-left:1px}
.rowmenu{position:relative;display:inline-flex}
.empty{margin-top:12px;border:1px solid var(--border);border-radius:calc(var(--radius) + 2px);background:var(--card);box-shadow:var(--card-shadow);padding:32px 20px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty[hidden]{display:none}
.empty .eicon{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;color:var(--muted)}
.empty b{color:var(--strong);font-size:14px}
.empty p{margin:0;color:var(--muted);font-size:13px;max-width:380px}
.teamrow{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 10px 8px 14px}
.teamrow+.teamrow{border-top:1px solid var(--line)}
.tmark{display:grid;flex:none;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--chip);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text)}
.faces{display:flex;align-items:center;margin-left:auto}
.faces .avatar{width:26px;height:26px;box-shadow:0 0 0 2px var(--card)}
.faces .avatar+.avatar{margin-left:-6px}
.faces-more{margin-left:6px;font-size:12px;color:var(--muted)}
.countline{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--page);font-size:13px;padding:10px 14px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity 180ms ease,transform 180ms ease;z-index:60;max-width:min(92vw,480px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="dark"] .toast{background:#ededed;color:#101012}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input[type="checkbox"].chk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
@media (max-width:760px){
.stats{grid-template-columns:minmax(0,1fr)}
.stats>div+div{border-left:0;border-top:1px solid var(--line)}
.toolbar .search{flex:1 1 100%;width:auto}
.search input{width:100%}
.tr{grid-template-columns:28px minmax(0,1fr) 92px 36px}
.tr>.hide-m{display:none}
.topbar{padding:10px 14px 0}
.wrap{padding:6px 14px 64px}
}
@media (hover:hover) and (pointer:fine){
.backlink:hover{background:var(--hover);color:var(--ink)}
.theme-btn:hover{transform:translateY(-1px)}
.tab:hover{color:var(--ink)}
.btn:hover,.filter-btn:hover{transform:translateY(-1px);background:var(--hover)}
.menu button.item:hover{background:var(--hover)}
.roleseg button:hover{color:var(--ink)}
.bulk-clear:hover{background:var(--hover);color:var(--ink)}
.tr:not(.tr-head):hover,.teamrow:hover{background:var(--hover)}
.pick:hover,.pick[aria-expanded="true"]{background:var(--chip);color:var(--ink)}
.icon-btn:hover{background:var(--chip);color:var(--ink)}
.note button:hover{color:var(--ink)}
}
</style>
</head>
<body>
<div class="topbar">
<button class="backlink" id="backBtn" type="button" aria-label="Back to Settings"><span aria-hidden="true">←</span><span class="settings-pill">Settings</span></button>
<span class="spacer"></span>
<button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme">◐</button>
</div>
<main class="wrap">
<h1 class="page-title">Members &amp; teams</h1>
<p class="page-sub">Invite people, set what they can do and group them into teams. <a href="#learn-more">Learn more</a></p>
<div class="tabs" role="tablist" aria-label="Members and teams">
<button class="tab" id="tabMembers" role="tab" aria-selected="true" type="button">Members</button>
<button class="tab" id="tabTeams" role="tab" aria-selected="false" type="button">Teams</button>
</div>
<section class="panel" id="panelMembers" role="tabpanel" aria-labelledby="tabMembers">
<div class="stats" aria-label="Overview">
<div><span class="lbl">Members</span><b class="big" id="statMembers">–</b><small class="sub" id="statMembersSub">–</small></div>
<div><span class="lbl">Seats</span><b class="big" id="statSeats">–</b><span class="seats" aria-hidden="true"><i id="seatsBar"></i></span></div>
<div><span class="lbl">Admins</span><b class="big" id="statAdmins">–</b><small class="sub">Can invite, remove and bill</small></div>
</div>
<p class="note"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.3"/><path d="M8 7.2v3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="5" r=".9" fill="currentColor"/></svg><span>Extra usage and spending limits are set on <button type="button" id="usageLink">Usage &amp; limits</button>.</span></p>
<div class="toolbar">
<label class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7.2" cy="7.2" r="4.4" stroke="currentColor" stroke-width="1.4"/><path d="M10.8 10.8 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input id="searchInput" type="search" placeholder="Search name or email" aria-label="Search name or email"></label>
<span class="anchor"><button class="filter-btn" id="roleFilterBtn" type="button" aria-expanded="false">Role</button><span class="menu left" id="roleMenu" hidden></span></span>
<span class="toolbar-end">
<button class="btn btn-ghost" id="exportBtn" type="button"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v8m0 0L5 7.2M8 10l3-2.8M3 12.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Export</button>
<span class="anchor"><button class="btn btn-primary" id="inviteBtn" type="button" aria-expanded="false"><span aria-hidden="true" style="margin-left:1px">+</span>Invite members</button>
<span class="menu" id="invitePop" hidden><form class="invite-pop" id="inviteForm"><b>Invite to the workspace</b><span class="hint">They get an email with a link to join.</span><input type="email" id="inviteEmail" placeholder="name@company.com" aria-label="Email address" autocomplete="off"><span class="roleseg" id="inviteRoles" role="radiogroup" aria-label="Role"></span><button class="btn btn-primary" id="inviteSend" type="submit" disabled>Send invite</button></form></span></span>
</span>
</div>
<div class="bulk" id="bulkBar" hidden><b id="bulkCount">0 selected</b><span class="anchor"><button class="bulk-btn" id="bulkRoleBtn" type="button" aria-expanded="false">Change role <span aria-hidden="true">▾</span></button><span class="menu left" id="bulkMenu" hidden></span></span><button class="bulk-btn danger" id="bulkRemove" type="button">Remove</button><button class="bulk-clear" id="bulkClear" type="button">Clear</button></div>
<div class="table" id="membersTable" role="table" aria-label="Members">
<div class="tr tr-head" role="row"><span><input class="chk" id="selectAll" type="checkbox" aria-label="Select all"></span><span>Name</span><span>Role</span><span class="hide-m">Plan</span><span class="hide-m">Usage</span><span aria-label="Actions"></span></div>
<div id="membersBody"></div>
</div>
<div class="empty" id="membersEmpty" hidden></div>
</section>
<section class="panel" id="panelTeams" role="tabpanel" aria-labelledby="tabTeams" hidden>
<div class="toolbar"><span class="countline" id="teamsCount">3 teams</span><span class="toolbar-end"><button class="btn btn-ghost" id="newTeamBtn" type="button"><span aria-hidden="true">+</span>New team</button></span></div>
<div class="table" id="teamsTable" role="list" aria-label="Teams"><div id="teamsBody"></div></div>
<div class="empty" id="teamsEmpty" hidden></div>
</section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
var MEMBERS=[
{id:"alex",name:"Alex Morgan",email:"alex@acme.com",role:"Admin",plan:"Business",usage:.68},
{id:"jonas",name:"Jonas Weber",email:"jonas@acme.com",role:"Admin",plan:"Business",usage:.42},
{id:"mara",name:"Mara Klein",email:"mara@acme.com",role:"Member",plan:"Pro",usage:.81},
{id:"lea",name:"Lea Braun",email:"lea@acme.com",role:"Member",plan:"Pro",usage:.23},
{id:"tom",name:"Tom Fischer",email:"tom@acme.com",role:"Viewer",plan:"Free",usage:.05},
{id:"sam",email:"sam@acme.com",role:"Member",plan:"Pro",usage:0,invited:true}
];
var TEAMS=[
{id:"product",name:"Product",members:["alex","jonas","mara"]},
{id:"marketing",name:"Marketing",members:["lea","tom"]},
{id:"engineering",name:"Engineering",members:["jonas","mara"]}
];
var ROLES=["Admin","Member","Viewer"];
var PLANS=["Business","Pro","Free"];
var SEATS=10, ME="alex";
var fmt=new Intl.NumberFormat("en-US");
function disp(m){return (m.name&&m.name.trim())?m.name.trim():m.email}
function initials(m){
var n=(m.name||"").trim();
if(n){
var parts=n.split(/\s+/).filter(function(p){try{return /^\p{L}/u.test(p)}catch(e){return /^[A-Za-z]/.test(p)}}).slice(0,2);
var s=parts.map(function(p){return Array.from(p)[0]}).join("");
if(s) return s.toUpperCase();
return (Array.from(n)[0]||"?").toUpperCase();
}
return (Array.from(m.email||"?")[0]||"?").toUpperCase();
}
function hue(id){var h=7;for(var i=0;i<id.length;i++){h=(h*31+id.charCodeAt(i))%360}return h}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function svgIcon(kind,size){
var ns="http://www.w3.org/2000/svg";

}
function createTeam(){
var names=new Set(state.teams.map(function(t){return t.name}));
var n="New team";for(var i=2;names.has(n);i++)n="New team "+i;
var t={id:"team-"+Date.now(),name:n,members:[ME]};
state.teams.push(t);renderTeams();toast(n+" created");
}
function openInvite(){closeAllMenus(invitePop);invitePop.hidden=false;inviteBtn.setAttribute("aria-expanded","true");setTimeout(function(){inviteEmail.focus()},0)}
/* events */
tabM.addEventListener("click",function(){state.tab="Members";tabM.setAttribute("aria-selected","true");tabT.setAttribute("aria-selected","false");panelM.hidden=false;panelT.hidden=true;});
tabT.addEventListener("click",function(){state.tab="Teams";tabT.setAttribute("aria-selected","true");tabM.setAttribute("aria-selected","false");panelT.hidden=false;panelM.hidden=true;});
searchInput.addEventListener("input",function(){state.q=searchInput.value;renderMembers()});
roleBtn.addEventListener("click",function(ev){ev.stopPropagation();var was=roleMenu.hidden;closeAllMenus(roleMenu);roleMenu.hidden=!was;roleBtn.setAttribute("aria-expanded",was?"true":"false")});
bulkRoleBtn.addEventListener("click",function(ev){ev.stopPropagation();var was=bulkMenu.hidden;closeAllMenus(bulkMenu);bulkMenu.hidden=!was;bulkRoleBtn.setAttribute("aria-expanded",was?"true":"false")});
bulkClear.addEventListener("click",function(){state.sel.clear();renderMembers();searchInput.focus()});
bulkRemove.addEventListener("click",function(){removeMembers(Array.from(state.sel))});
selectAll.addEventListener("change",function(){
var list=filtered();
if(selectAll.checked){state.sel=new Set(list.map(function(m){return m.id}))}else{state.sel.clear()}
renderMembers();
});
inviteBtn.addEventListener("click",function(ev){ev.stopPropagation();var was=invitePop.hidden;closeAllMenus(was?invitePop:null);invitePop.hidden=!was;inviteBtn.setAttribute("aria-expanded",was?"true":"false");if(was)setTimeout(function(){inviteEmail.focus()},0)});
inviteEmail.addEventListener("input",function(){inviteSend.disabled=!validEmail(inviteEmail.value)});
inviteForm.addEventListener("submit",function(e){
e.preventDefault();
var v=inviteEmail.value.trim();
if(!validEmail(v))return;
var low=v.toLowerCase();
if(state.members.some(function(m){return m.email===low})){toast(low+" is already in the workspace");return}
state.members.push({id:"inv-"+Date.now(),email:low,role:state.inviteRole,plan:"Pro",usage:0,invited:true});
inviteEmail.value="";inviteSend.disabled=true;
closeAllMenus(null);inviteBtn.focus();
renderMembers();toast("Invite sent to "+low);
});
exportBtn.addEventListener("click",function(){
var rows=[["Name","Email","Role","Plan","Status"]].concat(state.members.map(function(m){return [m.name||"",m.email,m.role,m.plan,m.invited?"Invited":"Active"]}));
var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replaceAll('"','""')+'"'}).join(",")}).join("\n");
try{
var blob=new Blob([csv],{type:"text/csv"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="members.csv";document.body.appendChild(a);a.click();setTimeout(function(){if(a.parentNode)a.parentNode.removeChild(a);try{URL.revokeObjectURL(url)}catch(e){}},0);
}catch(err){}
toast(fmt.format(state.members.length)+" members exported");
});
newTeamBtn.addEventListener("click",createTeam);
$("usageLink").addEventListener("click",function(){toast("Usage & limits lives in Billing")});
$("backBtn").addEventListener("click",function(){toast("Back to Settings")});
/* theme */
var themeBtn=$("themeBtn");
function curTheme(){return document.documentElement.getAttribute("data-theme")||"light"}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("ui-st-theme",t)}catch(e){}themeBtn.textContent=t==="dark"?"☀":"◐";themeBtn.setAttribute("aria-label",t==="dark"?"Switch to light":"Switch to dark")}
themeBtn.addEventListener("click",function(){setTheme(curTheme()==="dark"?"light":"dark")});
setTheme(curTheme());
/* init build once */
buildInviteRoles();buildRoleMenu();buildBulkMenu();
renderMembers();renderTeams();
/* expose for harness */
window.__st={state:state,rowById:rowById,teamRowById:teamRowById,renderMembers:renderMembers,renderTeams:renderTeams,setTheme:setTheme,getVisibleText:function(){return document.body.textContent||""},filtered:filtered};
})();
</script>
</body>
</html>
