  spark.addEventListener('pointermove',function(e){setDay(sparkIndex(e))});
  spark.addEventListener('pointerdown',function(e){setDay(sparkIndex(e))});
  spark.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')setDay(null)});
  spark.addEventListener('keydown',function(e){
    var len=state.daily.length;
    if(e.key==='ArrowRight')setDay(state.day===null?0:Math.min(len-1,state.day+1));
    else if(e.key==='ArrowLeft')setDay(state.day===null?len-1:Math.max(0,state.day-1));
    else if(e.key==='Escape')setDay(null);
    else return;e.preventDefault();
  });
  spark.addEventListener('blur',function(){setDay(null)});
  var limUl=document.createElement('ul');limUl.className='um__limits';limUl.setAttribute('aria-label','Plan limits');inner.appendChild(limUl);els.limUl=limUl;
  els.lims={};
  ALL_LIMITS.forEach(function(label){
    var li=document.createElement('li');li.className='um__limit';limUl.appendChild(li);
    var labRow=document.createElement('span');labRow.className='um__limit-label';li.appendChild(labRow);
    var nm=document.createElement('span');nm.className='um__limit-name';nm.textContent=label;nm.title=label;labRow.appendChild(nm);
    var dot=document.createElement('span');dot.className='um__dot';dot.setAttribute('hidden','');labRow.appendChild(dot);
    var valRow=document.createElement('span');valRow.className='um__limit-value';li.appendChild(valRow);
    var vnum=document.createElement('span');valRow.appendChild(vnum);
    var vmut=document.createElement('span');vmut.className='um__muted';valRow.appendChild(vmut);
    var thin=document.createElement('span');thin.className='um__thin';li.appendChild(thin);
    var fill2=document.createElement('span');thin.appendChild(fill2);
    els.lims[label]={li:li,dot:dot,vnum:vnum,vmut:vmut,thin:thin,fill:fill2};
  });
  var foot=el('div','um__foot',inner);
  var status=el('span','um__status',foot);els.status=status;
  els.statusDot=document.createElement('span');els.statusDot.className='um__dot';els.statusDot.setAttribute('aria-hidden','true');
  els.statusMain=document.createElement('span');status.appendChild(els.statusMain);
  var act=document.createElement('button');act.type='button';act.className='um__action';foot.appendChild(act);els.action=act;
  act.addEventListener('click',function(){try{els.live.textContent=(state.kind==='ok'?UPGRADE_LABEL:TOPUP_LABEL)+' clicked';}catch(e){}});
  els.actionInner=el('span','um__action-inner',act);
  els.actionText=el('span','um__action-text',els.actionInner);els.actionText.textContent=UPGRADE_LABEL;
  var live=el('span','um__live',sec);live.setAttribute('aria-live','polite');els.live=live;
  positionPill(false);
  try{
    if(typeof ResizeObserver!=='undefined'&&sw){
      var ro=new ResizeObserver(function(){positionPill(false)});
      ro.observe(sw);
    }
  }catch(e){}
  try{window.addEventListener('resize',function(){positionPill(false)})}catch(e){}
}

function barHoverLabel(e){
  try{
    var r=e.currentTarget.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width*100;
    var acc=0;
    var cats=DEMO[state.period].used;
    for(var i=0;i<cats.length;i++){
      var w=segWidth(cats[i].label);
      if(x>=acc&&x<=acc+w&&w>0)return cats[i].label;
      acc+=w;
    }
  }catch(err){}
  return null;
}
function sparkIndex(e){
  try{
    var r=e.currentTarget.getBoundingClientRect();
    var n=state.daily.length;
    var idx=Math.floor((e.clientX-r.left)/r.width*n);
    return Math.min(n-1,Math.max(0,idx));
  }catch(err){return 0}
}
function catVal(label){var arr=DEMO[state.period].used;for(var i=0;i<arr.length;i++)if(arr[i].label===label)return arr[i].value;return 0}
function segWidth(label){
  var tot=TOTAL;var sum=0;DEMO[state.period].used.forEach(function(c){sum+=num(c.value)});
  var denom=Math.max(tot,sum)||1;
  return catVal(label)/denom*100;
}

var state={period:'month',hover:null,day:null,daily:[],today:null,resetAt:null,kind:'ok',first:true,visible:true,anim:{used:0,pct:0,left:0,perCat:{},perLim:{},perDay:{}},targets:{used:0,pct:0,left:0,perCat:{},perLim:{},perDay:{}},raf:0};
var autoTimers=[];var autoOff=false;
function todayMid(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}

function computeTargets(){
  var d=DEMO[state.period];
  var sum=0;d.used.forEach(function(c){sum+=num(c.value)});
  var ratio=TOTAL>0?sum/TOTAL:(sum>0?Infinity:0);
  var kind=ratio>=1?'limit':(ratio>=WARN_AT?'warn':'ok');
  state.kind=kind;
  state.sum=sum;state.ratio=ratio;
  state.targets.used=sum;
  state.targets.pct=Math.min(ratio*100,1000);
  state.targets.left=Math.max(0,TOTAL-sum);
  state.targets.perCat={};d.used.forEach(function(c){state.targets.perCat[c.label]=num(c.value)});
  ALL_CATS.forEach(function(l){if(!(l in state.targets.perCat))state.targets.perCat[l]=0});
  state.targets.perLim={};d.limits.forEach(function(l2){state.targets.perLim[l2.label]=num(l2.used)});
  state.daily=d.mk(state.today);
  state.targets.perDay={};state.daily.forEach(function(dd,i){state.targets.perDay[i]=num(dd.value)});
}

function renderStatic(){
  els.title.textContent=TITLE;
  els.planSpan.textContent=PLAN;
  var rt=resetText(state.resetAt);
  els.resetTime.textContent=rt;
  try{els.resetTime.setAttribute('dateTime',state.resetAt.toISOString())}catch(e){}
  try{els.resetTime.setAttribute('title','Resets on '+new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric'}).format(state.resetAt))}catch(e){}
  els.sub.title=[PLAN,rt].join(' · ');
  els.of.textContent='of '+joinVal(fmt(TOTAL),UNIT);
  PERIODS.forEach(function(p){
    var b=els.optBtns[p.id];var on=p.id===state.period;
    b.setAttribute('aria-checked',on?'true':'false');b.tabIndex=on?0:-1;
  });
  positionPill(true);
  els.sec.setAttribute('data-state',state.kind);
  els.pct.setAttribute('data-state',state.kind);
  var hasAlert=state.kind!=='ok';
  if(hasAlert){if(!els.pctDot.parentNode)els.pct.insertBefore(els.pctDot,els.pct.firstChild)}else{if(els.pctDot.parentNode)els.pct.removeChild(els.pctDot)}
  els.bar.setAttribute('aria-label',fmt(state.sum)+' of '+fmt(TOTAL)+' '+UNIT+' used – arrow keys read each category');
  els.track.setAttribute('aria-valuemax',String(TOTAL));
  els.track.setAttribute('aria-valuenow',String(Math.min(state.sum,TOTAL)));
  els.track.setAttribute('aria-valuetext',fmt(state.sum)+' of '+fmt(TOTAL)+' '+UNIT);
  var present={};DEMO[state.period].used.forEach(function(c){present[c.label]=true});
  ALL_CATS.forEach(function(label){
    var r=els.rows[label];var isP=!!present[label];
    if(isP){r.li.removeAttribute('data-leaving')}else{r.li.setAttribute('data-leaving','')}
    r.li.style.display='';
  });
  els.limUl.style.setProperty('--n',String(Math.min(3,DEMO[state.period].limits.length)));
  ALL_LIMITS.forEach(function(label){
    var cfg=null;DEMO[state.period].used;DEMO[state.period].limits.forEach(function(l2){if(l2.label===label)cfg=l2});
    var slot=els.lims[label];
    if(!cfg){slot.li.setAttribute('hidden','');return}else{slot.li.removeAttribute('hidden')}
    var unlimited=cfg.total==null||!isFinite(cfg.total);
    var dec=(Number.isInteger(num(cfg.used))&&(unlimited||Number.isInteger(cfg.total)))?0:1;
    var frac=unlimited?0:num(cfg.used)/Math.max(cfg.total,1e-9);
    var ls=unlimited?'ok':(frac>=1?'limit':(frac>=WARN_AT?'warn':'ok'));
    slot.li.setAttribute('data-state',ls);
    var totTxt=unlimited?'∞':fmt(cfg.total,Number.isInteger(cfg.total)?0:dec);
    slot.vmut.textContent=' of '+joinVal(totTxt,cfg.unit);
    if(ls!=='ok'){slot.dot.removeAttribute('hidden');slot.dot.setAttribute('aria-label',ls==='limit'?'At the limit':'Close to the limit')}else{slot.dot.setAttribute('hidden','')}
    if(unlimited){slot.thin.setAttribute('data-unlimited','');slot.thin.setAttribute('role','img');slot.thin.setAttribute('aria-label',label+': '+fmt(num(cfg.used),dec)+', unlimited')}
    else{slot.thin.removeAttribute('data-unlimited');slot.thin.setAttribute('role','meter');slot.thin.setAttribute('aria-label',label);slot.thin.setAttribute('aria-valuemin','0');slot.thin.setAttribute('aria-valuemax',String(cfg.total));slot.thin.setAttribute('aria-valuenow',String(Math.min(num(cfg.used),cfg.total)));slot.thin.setAttribute('aria-valuetext',fmt(num(cfg.used),dec)+' of '+joinVal(totTxt,cfg.unit))}
    slot._dec=dec;slot._cfg=cfg;slot._state=ls;
  });
  var n=state.daily.length;
  els.spark.setAttribute('aria-label',TITLE+' per day, '+fmt(avgDaily())+' '+UNIT+' on average – arrow keys read each day');
  for(var i=0;i<MAX_DAYS;i++){
    var node=els.days[i];
    if(i<n){node.outer.removeAttribute('hidden');node.outer.style.display=''}
    else{node.outer.setAttribute('hidden','');node.outer.style.display='none'}
  }
  if(n<=14)els.spark.setAttribute('data-few','');else els.spark.removeAttribute('data-few');
  updateHover();updateDay();updateFoot();updateLive();
}
function avgDaily(){var f=state.daily.filter(function(d){return d.value!==null});if(!f.length)return 0;var s=0;f.forEach(function(d){s+=num(d.value)});return s/f.length}
function maxDaily(){var m=1;state.daily.forEach(function(d){m=Math.max(m,num(d.value))});return m}

function updateAnimatedText(){
  var a=state.anim;
  els.big.textContent=fmt(Math.round(a.used));
  var ptxt=a.pct>999?'>999':fmt(Math.round(a.pct));
  els.pctText.textContent=ptxt+'%';
  ALL_CATS.forEach(function(label){
    var r=els.rows[label];var v=a.perCat[label]||0;
    r.val.textContent=fmtSmall(catVal(label),Math.round(v));
    var share=a.used? (v/a.used*100):0;
    r.share.textContent=fmt(Math.round(share))+'%';
  });
  ALL_LIMITS.forEach(function(label){
    var slot=els.lims[label];if(!slot||!slot._cfg)return;
    slot.vnum.textContent=fmt(Math.round((a.perLim[label]||0)*10)/10,slot._dec);
  });
  var mx=maxDaily();
  for(var i=0;i<state.daily.length;i++){
    var node=els.days[i];var dd=state.daily[i];
    if(dd.value===null){node.outer.setAttribute('data-future','');node.fill.style.height=''}
    else{node.outer.removeAttribute('data-future');var h=Math.max(4,(a.perDay[i]||0)/mx*100);node.fill.style.height=h+'%'}
  }
  var segsLeft=0;
  DEMO[state.period].used.forEach(function(c){
    var w=(a.perCat[c.label]||0)/(Math.max(TOTAL,state.sum)||1)*100;
    var sEl=els.segs[c.label];if(sEl)sEl.style.width=w+'%';
    segsLeft+=w;
  });
  ALL_CATS.forEach(function(label){
    var isP=false;DEMO[state.period].used.forEach(function(c){if(c.label===label)isP=true});
    if(!isP&&els.segs[label])els.segs[label].style.width='0%';
  });
  DEMO[state.period].limits.forEach(function(l2){
    var slot2=els.lims[l2.label];if(!slot2)return;
    if(l2.total==null||!isFinite(l2.total))return;
    var cur=a.perLim[l2.label]||0;
    slot2.fill.style.width=Math.min(100,cur/Math.max(l2.total,1e-9)*100)+'%';
  });
  var ltxt=fmt(Math.round(a.left));
  if(state.kind==='limit'){
    els.statusMain.textContent='';
    while(els.statusMain.firstChild)els.statusMain.removeChild(els.statusMain.firstChild);
    var b=document.createElement('b');b.textContent='Limit reached';els.statusMain.appendChild(b);
    if(state.sum>TOTAL){var ov=document.createElement('span');ov.className='um__muted';ov.textContent=joinVal(fmt(state.sum-TOTAL),'over');els.statusMain.appendChild(document.createTextNode(' '));els.statusMain.appendChild(ov)}
  }else if(state.kind==='warn'){
    els.statusMain.textContent='';
    while(els.statusMain.firstChild)els.statusMain.removeChild(els.statusMain.firstChild);
    var b2=document.createElement('b');b2.textContent='Running low';els.statusMain.appendChild(b2);
    var s2=document.createElement('span');s2.className='um__muted';s2.textContent=joinVal(ltxt,UNIT)+' left';els.statusMain.appendChild(document.createTextNode(' '));els.statusMain.appendChild(s2);
  }else{
    els.statusMain.textContent='';
    while(els.statusMain.firstChild)els.statusMain.removeChild(els.statusMain.firstChild);
    var s3=document.createElement('span');s3.textContent=joinVal(ltxt,UNIT)+' left';els.statusMain.appendChild(s3);
  }
  if(state.kind!=='ok'){if(!els.statusDot.parentNode)els.status.insertBefore(els.statusDot,els.status.firstChild)}else{if(els.statusDot.parentNode)els.status.removeChild(els.statusDot)}
  els.status.setAttribute('data-state',state.kind);
}
function updateHover(){
  var h=state.hover;
  if(h)els.bar.setAttribute('data-active','');else els.bar.removeAttribute('data-active');
  if(h)els.legend.setAttribute('data-active','');else els.legend.removeAttribute('data-active');
  ALL_CATS.forEach(function(label){
    var r=els.rows[label];
    if(label===h)r.item.setAttribute('data-active','');else r.item.removeAttribute('data-active');
    var sEl=els.segs[label];
    if(sEl){if(label===h)sEl.setAttribute('data-active','');else sEl.removeAttribute('data-active')}
  });
  var found=null;
  DEMO[state.period].used.forEach(function(c){if(c.label===h)found=c});
  if(found){
    els.tip.setAttribute('data-open','');
    var share=state.sum?num(found.value)/state.sum*100:0;
    els.tipSw.style.background=colorFor(found.label);
    els.tipName.textContent=found.label;
    els.tipValue.textContent=joinVal(fmtSmall(num(found.value),num(found.value)),UNIT);
    els.tipShare.textContent=' · '+fmt(Math.round(share))+'%';
    var left=0,w=segWidth(found.label);
    DEMO[state.period].used.forEach(function(c){if(c.label===found.label)return;});
    var acc=0;for(var i=0;i<DEMO[state.period].used.length;i++){var cc=DEMO[state.period].used[i];if(cc.label===found.label){left=acc;break}acc+=segWidth(cc.label)}
    var mid=Math.min(100,Math.max(0,left+w/2));
    els.tip.style.left=mid+'%';els.tip.style.setProperty('--tip-x',(-mid)+'%');
  }else{els.tip.removeAttribute('data-open')}
}
function colorFor(label){var i=ALL_CATS.indexOf(label);return SOLID[i%SOLID.length]}
function updateDay(){
  var k=state.day;
  if(k!==null)els.spark.setAttribute('data-hover','');else els.spark.removeAttribute('data-hover');
  for(var i=0;i<state.daily.length;i++){
    var node=els.days[i];
    if(i===k)node.outer.setAttribute('data-active','');else node.outer.removeAttribute('data-active');
  }
  els.dailyRead.textContent='';
  while(els.dailyRead.firstChild)els.dailyRead.removeChild(els.dailyRead.firstChild);
  if(k!==null&&state.daily[k]){
    var dd=state.daily[k];
    els.dailyRead.appendChild(document.createTextNode(dd.label+' · '));
    var b=document.createElement('b');b.textContent=dd.value===null?'–':joinVal(fmt(dd.value),UNIT);els.dailyRead.appendChild(b);
  }else{
    els.dailyRead.appendChild(document.createTextNode('Avg '));
    var b2=document.createElement('b');b2.textContent=fmt(Math.round(avgDaily()));els.dailyRead.appendChild(b2);
    els.dailyRead.appendChild(document.createTextNode(' / day'));
  }
}
function updateFoot(){
  var strong=state.kind!=='ok';
  if(strong)els.action.setAttribute('data-strong','');else els.action.removeAttribute('data-strong');
  els.actionText.textContent=strong?TOPUP_LABEL:UPGRADE_LABEL;
}
function updateLive(){
  var msg;
  if(state.kind==='limit')msg=TITLE+': limit reached, '+fmt(state.sum)+' of '+fmt(TOTAL)+' '+UNIT+' used';
  else if(state.kind==='warn')msg=TITLE+': running low, '+Math.round(state.ratio*100)+'% of '+UNIT+' used';
  else msg=TITLE+': '+fmt(state.sum)+' of '+fmt(TOTAL)+' '+UNIT+' used';
  els.live.textContent=msg;
}
function positionPill(animate){
  try{
    var sel=null;PERIODS.forEach(function(p){if(p.id===state.period)sel=els.optBtns[p.id]});
    if(!sel||!sel.offsetWidth){if(els.pill)els.pill.style.opacity='0';return}
    var left=sel.offsetLeft,ww=sel.offsetWidth,hh=sel.offsetHeight;
    var pill=els.pill;
    if(!animate&&!pill.dataset.ready){pill.style.transition='none'}
    pill.style.opacity='1';pill.style.width=ww+'px';pill.style.height=hh+'px';
    pill.style.transform='translate('+left+'px,'+sel.offsetTop+'px)';
    if(!pill.dataset.ready){pill.dataset.ready='1';void pill.offsetWidth;pill.style.transition=''}
  }catch(e){}
}
function animateTo(dur,onDone){
  try{cancelAnimationFrame(state.raf)}catch(e){}
  var from={used:state.anim.used,pct:state.anim.pct,left:state.anim.left,perCat:Object.assign({},state.anim.perCat),perLim:Object.assign({},state.anim.perLim),perDay:Object.assign({},state.anim.perDay)};
  var to=state.targets;
  if(reduced()||dur<=0){
    state.anim.used=to.used;state.anim.pct=to.pct;state.anim.left=to.left;
    Object.keys(to.perCat).forEach(function(k){state.anim.perCat[k]=to.perCat[k]});
    Object.keys(to.perLim).forEach(function(k){state.anim.perLim[k]=to.perLim[k]});
    Object.keys(to.perDay).forEach(function(k){state.anim.perDay[k]=to.perDay[k]});
    updateAnimatedText();if(onDone)onDone();return;
  }
  var t0=null;
  try{t0=performance.now()}catch(e){t0=Date.now()}
  function frame(now){
    var p=Math.min(1,(now-t0)/dur);var e2=easeOut(p);
    state.anim.used=from.used+(to.used-from.used)*e2;
    state.anim.pct=from.pct+(to.pct-from.pct)*e2;
    state.anim.left=from.left+(to.left-from.left)*e2;
    Object.keys(to.perCat).forEach(function(k){var f=from.perCat[k]||0;state.anim.perCat[k]=f+(to.perCat[k]-f)*e2});
    Object.keys(to.perLim).forEach(function(k){var f2=from.perLim[k]||0;state.anim.perLim[k]=f2+(to.perLim[k]-f2)*e2});
    Object.keys(to.perDay).forEach(function(k){var f3=from.perDay[k]||0;state.anim.perDay[k]=f3+(to.perDay[k]-f3)*e2});
    updateAnimatedText();
    if(p<1)state.raf=requestAnimationFrame(frame);
    else if(onDone)onDone();
  }
  state.raf=requestAnimationFrame(frame);
}
function setHover(label){
  if(state.hover===label)return;
  state.hover=label;updateHover();
}
function setDay(idx){
  if(state.day===idx)return;
  state.day=idx;updateDay();
}
function setPeriod(id,user){
  if(user)cancelAuto();
  if(id===state.period&&user){return}
  if(id===state.period)return;
  state.period=id;state.hover=null;state.day=null;
  computeTargets();renderStatic();
  animateTo(state.first?1200:650);
  state.first=false;
}
function cancelAuto(){autoOff=true;autoTimers.forEach(function(t){clearTimeout(t)});autoTimers=[]}
function scheduleAuto(){
  cancelAuto0();
  var seq=['last','7d','month'];
  seq.forEach(function(id,i){
    var t=setTimeout(function(){if(!autoOff)setPeriod(id,false)},3600+i*3200);
    autoTimers.push(t);
  });
}
function cancelAuto0(){autoTimers.forEach(function(t){clearTimeout(t)});autoTimers=[]}
function initTheme(){
  var btn=document.getElementById('theme-toggle');
  function cur(){return document.documentElement.getAttribute('data-theme')||'light'}
  function paint(){
    var c=cur();
    btn.textContent=c==='dark'?'☀ Light':'☾ Dark';
    btn.setAttribute('aria-label',c==='dark'?'Switch to light theme':'Switch to dark theme');
  }
  paint();
  btn.addEventListener('pointerdown',function(){},true);
  btn.addEventListener('click',function(){
    var n=cur()==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    try{localStorage.setItem(THEME_KEY,n)}catch(e){}
    paint();
  });
}
function init(){
  state.today=todayMid();state.resetAt=dayAt(state.today,9);
  state.daily=[];
  build();
  computeTargets();
  ['used','pct','left'].forEach(function(k){state.anim[k]=0});
  ALL_CATS.forEach(function(l){state.anim.perCat[l]=0});
  ALL_LIMITS.forEach(function(l){state.anim.perLim[l]=0});
  for(var i=0;i<MAX_DAYS;i++)state.anim.perDay[i]=0;
  renderStatic();updateAnimatedText();
  initTheme();
  try{
    if(typeof IntersectionObserver==='undefined'){animateTo(1200);state.first=false}
    else{
      var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){animateTo(1200);state.first=false;try{io.disconnect()}catch(e){}}})},{threshold:0.2});
      try{io.observe(els.sec)}catch(e){animateTo(1200);state.first=false}
    }
  }catch(e){animateTo(1200);state.first=false}
  try{
    root.addEventListener('pointerdown',function(){autoOff=true;cancelAuto()},true);
    root.addEventListener('keydown',function(){autoOff=true;cancelAuto()},true);
  }catch(e){}
  scheduleAuto();
  try{window.__um={state:state,setPeriod:setPeriod,els:els}}catch(e){}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
