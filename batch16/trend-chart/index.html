<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Trend Chart — AI spend</title>
<script>/*noflash*/(function(){try{var k="trend-chart-theme";var s=null;try{s=localStorage.getItem(k)}catch(e){}var t=s||"light";if(t!=="light"&&t!=="dark"){t="light"}document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root{--page:#fafaf9;--surface:#ffffff;--ink:#171717;--ink2:#1c1917;--muted:#78716c;--subtle:#f5f5f4;--border:#e7e5e4;--radius-lg:16px;--radius:10px;--radius-sm:6px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);--blue:#2563eb;--blue-soft:rgba(37,99,235,.12);--green:#16a34a;--amber:#f59e0b;--amber-bg:#fef3c7;--amber-text:#92400e;--red:#dc2626;--grey:#78716c;--focus:#2563eb}
html[data-theme="dark"]{--page:#101012;--surface:#1c1c1f;--ink:#ededed;--ink2:#ededed;--muted:#a1a1aa;--subtle:#26262a;--border:#2e2e33;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);--blue:#60a5fa;--blue-soft:rgba(96,165,250,.16);--green:#4ade80;--amber:#fbbf24;--amber-bg:#451a03;--amber-text:#fde68a;--red:#f87171;--grey:#a1a1aa;--focus:#93c5fd}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.page{max-width:880px;margin:0 auto;padding:20px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.topbar__eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px 6px 10px;font-size:13px;cursor:pointer;box-shadow:var(--shadow);transition:transform 150ms ease,box-shadow 150ms ease,background 150ms ease}
.toggle__icon{font-size:14px;line-height:1}
.toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.trd-demo{display:flex;flex-direction:column;gap:12px}
.trd-demo__card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px}
.trd-demo__head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.trd-demo__title{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trd-demo__value{margin:4px 0 0;font-size:24px;font-weight:700;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.trd-demo__delta{display:inline-block;font-size:12px;font-weight:600;color:var(--green);background:var(--subtle);border:1px solid var(--border);border-radius:999px;padding:2px 8px}
.trd-demo__switches{display:flex;gap:8px;flex-wrap:wrap}
.trd-demo__seg{display:inline-flex;background:var(--subtle);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px}
.trd-demo__seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:background 150ms ease,color 150ms ease}
.trd-demo__seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.trd-demo__seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.legend{display:flex;gap:14px;align-items:center;margin:4px 0 6px;font-size:12px;color:var(--muted)}
.legend__item{display:inline-flex;align-items:center;gap:6px}
.swatch{display:inline-block;width:18px;height:3px;border-radius:999px;background:var(--blue)}
.swatch--last{background:var(--grey);background-image:linear-gradient(90deg,var(--grey) 55%,transparent 45%);background-size:5px 3px;background-repeat:repeat-x;height:3px}
.chart-box{position:relative;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:6px 6px 2px;overflow:hidden}
.chart-box:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chart-box svg{display:block;width:100%;height:auto}
.tooltip{position:absolute;min-width:132px;max-width:210px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:8px 10px;font-size:12px;pointer-events:none;z-index:3}
.tooltip__title{margin:0 0 4px;font-weight:700;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tooltip__row{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.tooltip__row b{color:var(--ink);font-weight:700}
.tooltip__dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;vertical-align:baseline}
.trd-demo__row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.trd-demo__card--small{padding:12px}
.trd-demo__small-title{margin:0 0 2px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trd-demo__small-value{margin:0 0 6px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark-box{position:relative;border:1px solid var(--border);border-radius:var(--radius);padding:4px;overflow:hidden}
.spark-box:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.spark-box svg{display:block;width:100%;height:auto}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
@media (max-width:640px){.trd-demo__row{grid-template-columns:1fr}.trd-demo__head{flex-direction:column}.page{padding:14px 10px 28px}}
@media (hover:hover) and (pointer:fine){
.toggle:hover{transform:translateY(-1px)}
.trd-demo__seg button:hover{color:var(--ink)}
.trd-demo__card:hover{box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08)}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <span class="topbar__eyebrow">affectUI &middot; Trend Chart &middot; AI spend per day</span>
    <button id="themeToggle" class="toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme"><span class="toggle__icon" id="themeIcon" aria-hidden="true">&#9790;</span><span id="themeLabel">Dark</span></button>
  </div>
  <div class="trd-demo" data-style="classic" id="demoRoot">
    <section class="trd-demo__card" aria-label="AI spend chart">
      <header class="trd-demo__head">
        <div class="trd-demo__heading">
          <h3 class="trd-demo__title">AI spend</h3>
          <p class="trd-demo__value"><span id="totalValue">$2.7k</span><span class="trd-demo__delta" id="deltaValue">+16.5%</span></p>
        </div>
        <div class="trd-demo__switches">
          <div class="trd-demo__seg" role="radiogroup" aria-label="Chart type" id="typeSeg">
            <button type="button" role="radio" aria-checked="false" data-type="line">Line</button>
            <button type="button" role="radio" aria-checked="true" data-type="area">Area</button>
            <button type="button" role="radio" aria-checked="false" data-type="bar">Bar</button>
          </div>
          <div class="trd-demo__seg" role="radiogroup" aria-label="Range" id="rangeSeg">
            <button type="button" role="radio" aria-checked="true" data-range="7d">7D</button>
            <button type="button" role="radio" aria-checked="false" data-range="30d">30D</button>
          </div>
        </div>
      </header>
      <div class="legend" aria-hidden="true"><span class="legend__item"><i class="swatch"></i>This period</span><span class="legend__item"><i class="swatch swatch--last"></i>Last period</span></div>
      <div class="chart-box" id="mainBox" tabindex="0" role="img" aria-label="AI spend per day chart. Use left and right arrow keys to explore values.">
        <svg id="mainSvg" viewBox="0 0 600 240" role="presentation" aria-hidden="true"></svg>
        <div class="tooltip" id="mainTip" hidden></div>
      </div>
      <p class="hint" id="mainHint">Hover or tap the chart to compare This period vs Last period. Shared with sparklines below.</p>
    </section>
    <div class="trd-demo__row" id="smallRow">
      <section class="trd-demo__card trd-demo__card--small" aria-label="Tokens per day">
        <h4 class="trd-demo__small-title">Tokens</h4>
        <p class="trd-demo__small-value" id="smallValue0">257.7M</p>
        <div class="spark-box" id="sparkBox0" tabindex="0" role="img" aria-label="Tokens per day sparkline. Use arrow keys to explore.">
          <svg id="sparkSvg0" viewBox="0 0 220 60" role="presentation" aria-hidden="true"></svg>
          <div class="tooltip" id="sparkTip0" hidden></div>
        </div>
      </section>
      <section class="trd-demo__card trd-demo__card--small" aria-label="Requests per day">
        <h4 class="trd-demo__small-title">Requests</h4>
        <p class="trd-demo__small-value" id="smallValue1">144.6k</p>
        <div class="spark-box" id="sparkBox1" tabindex="0" role="img" aria-label="Requests per day sparkline. Use arrow keys to explore.">
          <svg id="sparkSvg1" viewBox="0 0 220 60" role="presentation" aria-hidden="true"></svg>
          <div class="tooltip" id="sparkTip1" hidden></div>
        </div>
      </section>
      <section class="trd-demo__card trd-demo__card--small" aria-label="Cost per 1k requests per day">
        <h4 class="trd-demo__small-title">Cost per 1k requests</h4>
        <p class="trd-demo__small-value" id="smallValue2">$18.60</p>
        <div class="spark-box" id="sparkBox2" tabindex="0" role="img" aria-label="Cost per 1k requests per day sparkline. Use arrow keys to explore.">
          <svg id="sparkSvg2" viewBox="0 0 220 60" role="presentation" aria-hidden="true"></svg>
          <div class="tooltip" id="sparkTip2" hidden></div>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var DAY=864e5, END=Date.UTC(2026,2,9), MAXN=30;
var RANGES={"7d":{label:"7D",n:7},"30d":{label:"30D",n:30}};
var TYPES=["line","area","bar"];
function dates(n){var out=[],i;for(i=0;i<n;i++){out.push(new Date(END-(n-1-i)*DAY))}return out}
function fmtShort(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})}
function fmtLong(d){return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"})}
function gen(n,base,seed,growth){if(growth===undefined){growth=0.012}var out=[],i,a,o;for(i=0;i<n;i++){a=((i+seed)%7>=5)?0.72:1;o=1+0.09*Math.sin(i*1.7+seed)+0.05*Math.cos(i*0.6+seed*2);out.push(Math.round(base*a*o*(1+growth*i)))}return out}
function fmtMoney(v){if(Math.abs(v)>=1000){return "$"+(+((v/1000).toFixed(1)))+"k"}return "$"+Math.round(v)}
function fmtCompact(v){if(v>=1e9){return (+((v/1e9).toFixed(1)))+"B"}if(v>=1e6){return (+((v/1e6).toFixed(1)))+"M"}if(v>=1e3){return (+((v/1e3).toFixed(1)))+"k"}return ""+v}
function fmtCost(v){return "$"+v.toFixed(2)}
function sum(a){var s=0,i;for(i=0;i<a.length;i++){s+=a[i]}return s}
function buildPeriod(key){
  var n=RANGES[key].n, ds=dates(n), i, labels=[], tips=[];
  for(i=0;i<n;i++){labels.push(fmtShort(ds[i]));tips.push(fmtLong(ds[i]))}
  var cur=gen(n,412,1,0.012), prev=gen(n,356,3,0.006);
  var tok=gen(n,384e5,2,0.012), req=gen(n,21800,4,0.016);
  var tot=sum(cur), totP=sum(prev), ch=(tot-totP)/totP*100;
  var totTok=sum(tok), totReq=sum(req), cost=tot/totReq*1000;
  var costVals=[],k;for(k=0;k<n;k++){costVals.push(+((cur[k]/req[k]*1000).toFixed(2)))}
  return {key:key,n:n,labels:labels,tips:tips,cur:cur,prev:prev,total:tot,change:ch,
    small:[
      {title:"Tokens",value:fmtCompact(totTok),format:fmtCompact,values:tok},
      {title:"Requests",value:fmtCompact(totReq),format:fmtCompact,values:req},
      {title:"Cost per 1k requests",value:fmtCost(cost),format:fmtCost,values:costVals}
    ]};
}
var state={range:"7d",type:"area",index:null,data:buildPeriod("7d")};
var NS="http://www.w3.org/2000/svg";
function el(tag,attrs){var e=document.createElementNS(NS,tag);if(attrs){for(var k in attrs){if(k==="cls"){e.setAttribute("class",attrs[k])}else{e.setAttribute(k,attrs[k])}}}return e}
function txt(tag,content,attrs){var e=el(tag,attrs);e.textContent=content;return e}
function cssVar(n){var v=getComputedStyle(document.documentElement).getPropertyValue(n);return v?v.trim():""}
/* main chart nodes built once */
var mainSvg=document.getElementById("mainSvg"), mainBox=document.getElementById("mainBox"), mainTip=document.getElementById("mainTip");
var MW=600,MH=240,PL=46,PR=12,PT=12,PB=28, IW=MW-PL-PR, IH=MH-PT-PB;
var gridG=el("g",{cls:"grid"}), yLabG=el("g",{cls:"ylab"}), xLabG=el("g",{cls:"xlab"});
var areaFill=el("path",{cls:"area-fill",fill:"rgba(37,99,235,.12)"});
var prevPath=el("path",{cls:"prev-line",fill:"none",stroke:"#a8a29e","stroke-width":"2","stroke-dasharray":"5 4"});
var curPath=el("path",{cls:"cur-line",fill:"none",stroke:"#2563eb","stroke-width":"2.5","stroke-linejoin":"round","stroke-linecap":"round"});
var barG=el("g",{cls:"bars"});
var cross=el("line",{cls:"cross",y1:String(PT),y2:String(PT+IH),stroke:"#78716c","stroke-width":"1","stroke-dasharray":"3 3",visibility:"hidden"});
var dotCur=el("circle",{cls:"dot-cur",r:"4",fill:"#2563eb",stroke:"#fff","stroke-width":"2",visibility:"hidden"});
var dotPrev=el("circle",{cls:"dot-prev",r:"3.5",fill:"#fff",stroke:"#a8a29e","stroke-width":"2",visibility:"hidden"});
var overlay=el("rect",{cls:"overlay",x:String(PL),y:String(PT),width:String(IW),height:String(IH),fill:"transparent"});
var yTicks=[],xLabs=[],barRects=[],curDots=[];
var i;
for(i=0;i<4;i++){var gl=el("line",{cls:"grid-line",x1:String(PL),x2:String(PL+IW),stroke:"currentColor","stroke-opacity":".12","stroke-width":"1"});gridG.appendChild(gl);var yl=txt("text","",{cls:"y-tick",x:String(PL-6),y:"0","text-anchor":"end","dominant-baseline":"middle",fill:"currentColor","font-size":"10"});yLabG.appendChild(yl);yTicks.push({line:gl,label:yl})}
for(i=0;i<MAXN;i++){var xl=txt("text","",{cls:"x-tick",x:"0",y:String(PT+IH+16),"text-anchor":"middle",fill:"currentColor","font-size":"10"});xLabG.appendChild(xl);xLabs.push(xl)}
for(i=0;i<MAXN;i++){var b1=el("rect",{cls:"bar-cur",rx:"2",fill:"#2563eb"});var b2=el("rect",{cls:"bar-prev",rx:"2",fill:"#d6d3d1"});barG.appendChild(b2);barG.appendChild(b1);barRects.push({cur:b1,prev:b2})}
mainSvg.appendChild(gridG);mainSvg.appendChild(yLabG);mainSvg.appendChild(areaFill);mainSvg.appendChild(barG);mainSvg.appendChild(prevPath);mainSvg.appendChild(curPath);mainSvg.appendChild(xLabG);mainSvg.appendChild(cross);mainSvg.appendChild(dotPrev);mainSvg.appendChild(dotCur);mainSvg.appendChild(overlay);
/* sparklines built once */
var sparks=[];
for(var s=0;s<3;s++){
  (function(idx){
    var svg=document.getElementById("sparkSvg"+idx), box=document.getElementById("sparkBox"+idx), tip=document.getElementById("sparkTip"+idx);
    var fill=el("path",{cls:"sp-fill",fill:"rgba(37,99,235,.12)"});
    var line=el("path",{cls:"sp-line",fill:"none",stroke:"#2563eb","stroke-width":"2","stroke-linejoin":"round","stroke-linecap":"round"});
    var dot=el("circle",{cls:"sp-dot",r:"3.5",fill:"#2563eb",stroke:"#fff","stroke-width":"2",visibility:"hidden"});
    var ov=el("rect",{cls:"sp-overlay",x:"0",y:"0",width:"220",height:"60",fill:"transparent"});
    svg.appendChild(fill);svg.appendChild(line);svg.appendChild(dot);svg.appendChild(ov);
    sparks.push({svg:svg,box:box,tip:tip,fill:fill,line:line,dot:dot,overlay:ov});
  })(s);
}
function xPos(j,n){if(n===1){return PL+IW/2}return PL+j*(IW/(n-1))}
function yScale(v,ymax){return PT+IH*(1-v/ymax)}
function niceMax(v){if(v<=0){return 1}var p=Math.pow(10,Math.floor(Math.log10(v)));var f=v/p;var nf=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return nf*p}
function linePath(vals,ymax){var d="",j;for(j=0;j<vals.length;j++){var x=xPos(j,vals.length),y=yScale(vals[j],ymax);d+=(j===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1)}return d}
function areaD(vals,ymax){var d=linePath(vals,ymax);var x1=xPos(vals.length-1,vals.length),x0=xPos(0,vals.length);d+="L"+x1.toFixed(1)+" "+(PT+IH).toFixed(1)+"L"+x0.toFixed(1)+" "+(PT+IH).toFixed(1)+"Z";return d}
function sparkPath(vals){var n=vals.length,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;var W=220,H=60,P=6;var d="",j;for(j=0;j<n;j++){var x=P+j*(W-2*P)/((n-1)||1);var y=P+(H-2*P)*(1-(vals[j]-mn)/rg);d+=(j===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1)}return {line:d,fill:d+"L"+(W-P).toFixed(1)+" "+(H-P).toFixed(1)+"L"+P.toFixed(1)+" "+(H-P).toFixed(1)+"Z",pts:vals.map(function(v,jj){return {x:P+jj*(W-2*P)/((n-1)||1),y:P+(H-2*P)*(1-(v-mn)/rg)}})}}
var totalEl=document.getElementById("totalValue"),deltaEl=document.getElementById("deltaValue");
var smallEls=[document.getElementById("smallValue0"),document.getElementById("smallValue1"),document.getElementById("smallValue2")];
function renderMain(){
  var d=state.data,n=d.n,ymax=niceMax(Math.max.apply(null,d.cur.concat(d.prev))*1.08);
  var t,step=ymax/3;
  for(t=0;t<4;t++){var v=ymax-t*step;var y=yScale(v,ymax);yTicks[t].line.setAttribute("y1",y.toFixed(1));yTicks[t].line.setAttribute("y2",y.toFixed(1));yTicks[t].label.setAttribute("y",y.toFixed(1));yTicks[t].label.textContent=fmtMoney(Math.round(v))}
  var showEvery=n<=7?1:5;
  for(var j=0;j<MAXN;j++){
    if(j<n){var vis=(n<=7)||(j%showEvery===0)||(j===n-1);xLabs[j].setAttribute("x",xPos(j,n).toFixed(1));xLabs[j].textContent=d.labels[j];xLabs[j].setAttribute("visibility",vis?"visible":"hidden")}
    else{xLabs[j].setAttribute("visibility","hidden")}
  }
  var isBar=(state.type==="bar");
  curPath.setAttribute("visibility",isBar?"hidden":"visible");
  prevPath.setAttribute("visibility",isBar?"hidden":"visible");
  areaFill.setAttribute("visibility",(!isBar&&state.type==="area")?"visible":"hidden");
  barG.setAttribute("visibility",isBar?"visible":"hidden");
  if(!isBar){
    curPath.setAttribute("d",linePath(d.cur,ymax));
    prevPath.setAttribute("d",linePath(d.prev,ymax));
    if(state.type==="area"){areaFill.setAttribute("d",areaD(d.cur,ymax))}
  }else{
    var band=IW/n,bw=Math.min(14,band*0.28);
    for(var k=0;k<MAXN;k++){
      if(k<n){var cx=PL+k*band+band/2;var h1=Math.max(1,IH*(d.cur[k]/ymax));var h2=Math.max(1,IH*(d.prev[k]/ymax));
        barRects[k].cur.setAttribute("x",(cx-bw+1).toFixed(1));barRects[k].cur.setAttribute("y",(PT+IH-h1).toFixed(1));barRects[k].cur.setAttribute("width",bw.toFixed(1));barRects[k].cur.setAttribute("height",h1.toFixed(1));barRects[k].cur.setAttribute("visibility","visible");
        barRects[k].prev.setAttribute("x",(cx+1).toFixed(1));barRects[k].prev.setAttribute("y",(PT+IH-h2).toFixed(1));barRects[k].prev.setAttribute("width",bw.toFixed(1));barRects[k].prev.setAttribute("height",h2.toFixed(1));barRects[k].prev.setAttribute("visibility","visible")}
      else{barRects[k].cur.setAttribute("visibility","hidden");barRects[k].prev.setAttribute("visibility","hidden")}
    }
  }
  updateCrosshair();
}
function updateCrosshair(){
  var d=state.data,idx=state.index;
  if(idx===null||idx===undefined||idx<0||idx>=d.n){
    cross.setAttribute("visibility","hidden");dotCur.setAttribute("visibility","hidden");dotPrev.setAttribute("visibility","hidden");mainTip.hidden=true;
    for(var s=0;s<3;s++){sparks[s].dot.setAttribute("visibility","hidden");sparks[s].tip.hidden=true}
    return;
  }
  var n=d.n,ymax=niceMax(Math.max.apply(null,d.cur.concat(d.prev))*1.08);
  var x=xPos(idx,n);
  cross.setAttribute("x1",x.toFixed(1));cross.setAttribute("x2",x.toFixed(1));cross.setAttribute("visibility","visible");
  var isBar=(state.type==="bar");
  if(!isBar){dotCur.setAttribute("cx",x.toFixed(1));dotCur.setAttribute("cy",yScale(d.cur[idx],ymax).toFixed(1));dotCur.setAttribute("visibility","visible");dotPrev.setAttribute("cx",x.toFixed(1));dotPrev.setAttribute("cy",yScale(d.prev[idx],ymax).toFixed(1));dotPrev.setAttribute("visibility","visible")}
  else{dotCur.setAttribute("visibility","hidden");dotPrev.setAttribute("visibility","hidden")}
  while(mainTip.firstChild){mainTip.removeChild(mainTip.firstChild)}
  var h3=document.createElement("p");h3.setAttribute("class","tooltip__title");h3.textContent=d.tips[idx];mainTip.appendChild(h3);
  var rows=[["This period",d.cur[idx],fmtMoney,"#2563eb"],["Last period",d.prev[idx],fmtMoney,"#a8a29e"]];
  for(var r=0;r<rows.length;r++){var row=document.createElement("div");row.setAttribute("class","tooltip__row");var l=document.createElement("span");var dot=document.createElement("i");dot.setAttribute("class","tooltip__dot");dot.style.background=rows[r][3];l.appendChild(dot);l.appendChild(document.createTextNode(rows[r][0]));var b=document.createElement("b");b.textContent=rows[r][2](rows[r][1]);row.appendChild(l);row.appendChild(b);mainTip.appendChild(row)}
  mainTip.hidden=false;
  var pct=(x-PL)/IW;var left=Math.max(2,Math.min(96,pct*100));mainTip.style.left=left+"%";mainTip.style.top="8px";mainTip.style.transform=(pct>0.72?"translateX(-104%)":"translateX(-8%)");
  for(var q=0;q<3;q++){renderSparkTip(q,idx)}
}
function renderSparks(){
  var d=state.data;
  for(var q=0;q<3;q++){var vals=d.small[q].values;var sp=sparkPath(vals);sparks[q].line.setAttribute("d",sp.line);sparks[q].fill.setAttribute("d",sp.fill);sparks[q].line._pts=sp.pts;sparks[q]._sp=sp}
  updateCrosshair();
}
function renderSparkTip(q,idx){
  var d=state.data,sp=sparks[q]._sp;if(!sp){return}
  var pt=sp.pts[idx];sparks[q].dot.setAttribute("cx",pt.x.toFixed(1));sparks[q].dot.setAttribute("cy",pt.y.toFixed(1));sparks[q].dot.setAttribute("visibility","visible");
  var tip=sparks[q].tip;while(tip.firstChild){tip.removeChild(tip.firstChild)}
  var t=document.createElement("p");t.setAttribute("class","tooltip__title");t.textContent=d.labels[idx];tip.appendChild(t);
  var row=document.createElement("div");row.setAttribute("class","tooltip__row");var l=document.createElement("span");l.textContent=d.small[q].title;var b=document.createElement("b");b.textContent=d.small[q].format(d.small[q].values[idx]);row.appendChild(l);row.appendChild(b);tip.appendChild(row);
  tip.hidden=false;var pct=pt.x/220;tip.style.left=Math.max(1,Math.min(88,pct*100))+"%";tip.style.top="4px";tip.style.transform=(pct>0.7?"translateX(-102%)":"translateX(-6%)");
}
function renderHeader(){
  totalEl.textContent=fmtMoney(state.data.total);
  deltaEl.textContent="+"+state.data.change.toFixed(1)+"%";
  for(var q=0;q<3;q++){smallEls[q].textContent=state.data.small[q].value}
  var tb=document.getElementById("typeSeg").children,rb=document.getElementById("rangeSeg").children,j;
  for(j=0;j<tb.length;j++){tb[j].setAttribute("aria-checked",tb[j].getAttribute("data-type")===state.type?"true":"false")}
  for(j=0;j<rb.length;j++){rb[j].setAttribute("aria-checked",rb[j].getAttribute("data-range")===state.range?"true":"false")}
}
function setIndex(v){if(v===state.index){return}state.index=v;updateCrosshair()}
function setRange(r){if(!RANGES[r]||r===state.range){return}state.range=r;state.data=buildPeriod(r);state.index=null;renderHeader();renderMain();renderSparks()}
function setType(t){if(TYPES.indexOf(t)<0||t===state.type){return}state.type=t;renderHeader();renderMain()}
function idxFromEvent(e,n){
  var box=mainBox.getBoundingClientRect?mainBox.getBoundingClientRect():null;
  var fx=0.5;
  if(e&&typeof e.clientX==="number"&&box&&box.width){fx=(e.clientX-box.left-PL/box.width*0+0)/box.width;var padL=46/600* (box.width||1)/ (box.width||1);fx=((e.clientX-box.left)-(46/600*box.width))/((600-46-12)/600*box.width)}
  else if(e&&typeof e.offsetX==="number"&&box&&box.width){fx=e.offsetX/box.width}
  if(!(fx>=0&&fx<=1.2)){fx=0.5}
  var v=Math.round(fx*(n-1));if(v<0){v=0}if(v>n-1){v=n-1}return v;
}
overlay.addEventListener("pointermove",function(e){try{var r=mainBox.getBoundingClientRect();var px=e.clientX-r.left;var frac=(px-r.width*(PL/MW))/(r.width*(IW/MW));var v=Math.round(frac*(state.data.n-1));if(v<0){v=0}if(v>state.data.n-1){v=state.data.n-1}setIndex(v)}catch(err){}});
overlay.addEventListener("pointerdown",function(e){try{var r=mainBox.getBoundingClientRect();var px=e.clientX-r.left;var frac=(px-r.width*(PL/MW))/(r.width*(IW/MW));var v=Math.round(frac*(state.data.n-1));if(v<0){v=0}if(v>state.data.n-1){v=state.data.n-1}setIndex(v)}catch(err){}},true);
overlay.addEventListener("pointerleave",function(){setIndex(null)});
mainBox.addEventListener("keydown",function(e){var n=state.data.n;if(e.key==="ArrowRight"){var v=(state.index===null?0:Math.min(n-1,state.index+1));setIndex(v);e.preventDefault()}else if(e.key==="ArrowLeft"){var v2=(state.index===null?n-1:Math.max(0,state.index-1));setIndex(v2);e.preventDefault()}else if(e.key==="Escape"){setIndex(null)}});
mainBox.addEventListener("focus",function(){if(state.index===null){setIndex(state.data.n-1)}});
for(var b=0;b<3;b++){
  (function(q){
    sparks[q].overlay.addEventListener("pointermove",function(e){try{var r=sparks[q].box.getBoundingClientRect();var frac=(e.clientX-r.left)/r.width;var v=Math.round(frac*(state.data.n-1));if(v<0){v=0}if(v>state.data.n-1){v=state.data.n-1}setIndex(v)}catch(err){}});
    sparks[q].overlay.addEventListener("pointerdown",function(e){try{var r=sparks[q].box.getBoundingClientRect();var frac=(e.clientX-r.left)/r.width;var v=Math.round(frac*(state.data.n-1));if(v<0){v=0}if(v>state.data.n-1){v=state.data.n-1}setIndex(v)}catch(err){}},true);
    sparks[q].overlay.addEventListener("pointerleave",function(){setIndex(null)});
    sparks[q].box.addEventListener("keydown",function(e){var n=state.data.n;if(e.key==="ArrowRight"){setIndex(state.index===null?0:Math.min(n-1,state.index+1));e.preventDefault()}else if(e.key==="ArrowLeft"){setIndex(state.index===null?n-1:Math.max(0,state.index-1));e.preventDefault()}else if(e.key==="Escape"){setIndex(null)}});
    sparks[q].box.addEventListener("focus",function(){if(state.index===null){setIndex(state.data.n-1)}});
  })(b);
}
document.getElementById("typeSeg").addEventListener("click",function(e){var t=e.target&&e.target.getAttribute?e.target.getAttribute("data-type"):null;if(t){setType(t)}});
document.getElementById("rangeSeg").addEventListener("click",function(e){var t=e.target&&e.target.getAttribute?e.target.getAttribute("data-range"):null;if(t){setRange(t)}});
/* theme toggle */
var toggle=document.getElementById("themeToggle"),tIcon=document.getElementById("themeIcon"),tLabel=document.getElementById("themeLabel");
function paintToggle(){var th=document.documentElement.getAttribute("data-theme");var dark=(th==="dark");tIcon.textContent=dark?"\u2600":"\u263E";tLabel.textContent=dark?"Light":"Dark";toggle.setAttribute("aria-pressed",dark?"true":"false");toggle.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme")}
toggle.addEventListener("click",function(){var cur=document.documentElement.getAttribute("data-theme");var nx=(cur==="dark")?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("trend-chart-theme",nx)}catch(e){}paintToggle()});
paintToggle();
renderHeader();renderMain();renderSparks();
/* expose for harness */
window.__trend={state:state,setIndex:setIndex,setRange:setRange,setType:setType,buildPeriod:buildPeriod,fmtMoney:fmtMoney,fmtCompact:fmtCompact,nodes:{total:totalEl,delta:deltaEl,mainTip:mainTip,cur:curPath,prev:prevPath,area:areaFill,bars:barRects,sparks:sparks}};
})();
</script>
