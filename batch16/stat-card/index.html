<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>/*noflash*/(function(){try{var k='affectui-stat-card-theme';var t=null;try{t=localStorage.getItem(k);}catch(e){t=null;}if(!t){try{t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}catch(e){t='light';}}document.documentElement.setAttribute('data-theme',t||'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<title>Stat Card — Usage</title>
<style>
/* Design tokens (light = original demo "classic" appearance) */
:root{
  --surface:#ffffff;
  --page:#fafaf9;
  --ink:#1c1917;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --radius-lg:16px;   /* card shell: inner 10px + 6px inset (concentric) */
  --radius:10px;      /* inner surfaces */
  --radius-sm:6px;    /* pills-in-card, chart box */
  --pill:999px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-lift:0 2px 4px rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.10);
  --accent:#2563eb;
  --accent-soft:rgba(37,99,235,.12);
  --good:#15803d; --good-bg:#dcfce7;
  --bad:#b91c1c; --bad-bg:#fee2e2;
  --flat:#57534e; --flat-bg:#f5f5f4;
  --amber:#f59e0b; --amber-bg:#fef3c7; --amber-text:#92400e;
  --focus:#2563eb;
  --img-outline:rgba(0,0,0,.10);
}
html[data-theme="dark"]{
  --surface:#1c1c1f;
  --page:#101012;
  --ink:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 16px 36px rgba(0,0,0,.45);
  --accent:#60a5fa;
  --accent-soft:rgba(96,165,250,.16);
  --good:#86efac; --good-bg:#052e16;
  --bad:#fca5a5; --bad-bg:#450a0a;
  --flat:#d6d3d1; --flat-bg:#26262a;
  --amber:#fbbf24; --amber-bg:#451a03; --amber-text:#fde68a;
  --focus:#60a5fa;
  --img-outline:rgba(255,255,255,.10);
}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.45;
  font-variant-numeric:tabular-nums;
}
img{outline:1px solid var(--img-outline);outline-offset:-1px}
.page{max-width:1060px;margin:0 auto;padding:24px 20px 40px}
.stat-demo__bar{
  display:flex;align-items:center;gap:12px;
  margin:0 0 16px;
}
.stat-demo__title{font-size:16px;font-weight:650;letter-spacing:-.01em}
.stat-demo__seg{
  display:inline-flex;gap:2px;padding:2px;
  background:var(--subtle);
  border:1px solid var(--border);
  border-radius:var(--pill);
  margin-left:auto;
}
.stat-demo__seg button{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--muted);
  font:inherit;font-size:12.5px;font-weight:600;
  padding:5px 14px 5px 12px; /* optical: glyph side gets ~2px less */
  border-radius:var(--pill);cursor:pointer;
  transition:background 160ms ease,color 160ms ease,box-shadow 160ms ease,border-color 160ms ease;
}
.stat-demo__seg button[aria-checked="true"]{
  background:var(--surface);color:var(--ink);
  border-color:var(--border);
  box-shadow:var(--shadow);
}
.stat-demo__seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-toggle{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);color:var(--ink);
  cursor:pointer;box-shadow:var(--shadow);
  padding:0 0 0 2px; /* optical: nudge glyph by eye */
  transition:box-shadow 160ms ease,transform 160ms ease,background 160ms ease;
}
.theme-toggle svg{display:block;width:17px;height:17px}
.theme-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stat-demo__grid{
  display:grid;gap:12px;
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.stat-card{
  background:var(--surface);
  border:1px solid var(--border); /* structure */
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow); /* elevation */
  padding:14px 14px 16px; /* roomy bottom so text never sits under controls */
  cursor:pointer;
  transition:box-shadow 180ms ease,transform 180ms ease,border-color 180ms ease,opacity 180ms ease;
  position:relative;
}
.stat-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stat-card__top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.stat-card__label{
  font-size:13px;font-weight:600;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stat-card__change{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  border-radius:var(--pill);padding:2px 8px;
  border:1px solid transparent;
}
.stat-card__change.is-good{background:var(--good-bg);color:var(--good)}
.stat-card__change.is-bad{background:var(--bad-bg);color:var(--bad)}
.stat-card__change.is-flat{background:var(--flat-bg);color:var(--flat);border-color:var(--border)}
.stat-card__arrow{font-size:10px;line-height:1}
.stat-card__value{
  margin-top:6px;font-size:24px;font-weight:700;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stat-card__vs{margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.stat-card__chart{position:relative;margin-top:10px;height:44px;border-radius:var(--radius-sm)}
.stat-card__chart svg{display:block;width:100%;height:40px;overflow:visible}
.chart-tip{
  position:absolute;left:0;top:0;transform:translate(-50%,-115%);
  background:var(--surface);color:var(--ink);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow);
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  padding:3px 8px;white-space:nowrap;pointer-events:none;z-index:2;
}
.stat-card.is-loading .stat-card__value,
.stat-card.is-loading .stat-card__chart{opacity:.55}
.stat-card.is-loading .stat-card__value::after{
  content:"";display:block;height:10px;margin-top:6px;border-radius:var(--radius-sm);
  background:linear-gradient(90deg,var(--subtle) 25%,var(--border) 50%,var(--subtle) 75%);
  background-size:200% 100%;
  animation:skimmer 900ms ease-in-out infinite;
}
@keyframes skimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.foot{margin:16px 2px 0;font-size:12.5px;color:var(--muted)}
/* Detail dialog (opened on pointerdown/mousedown capture + click, keyboard accessible) */
.detail-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.detail{
  position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(420px,calc(100vw - 32px));max-height:min(72vh,560px);overflow:auto;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lift);padding:16px;
}
.detail__head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.detail__title{font-size:15px;font-weight:650}
.detail__close{
  margin-left:auto;appearance:none;cursor:pointer;
  border:1px solid var(--border);background:var(--subtle);color:var(--ink);
  border-radius:var(--pill);font:inherit;font-size:12.5px;font-weight:600;padding:5px 12px;
  transition:background 160ms ease,box-shadow 160ms ease;
}
.detail__close:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.detail table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.detail th,.detail td{text-align:right;padding:5px 4px;border-top:1px solid var(--border)}
.detail th:first-child,.detail td:first-child{text-align:left}
.detail thead th{border-top:0;color:var(--muted);font-weight:600;font-size:12px}
@media (max-width:920px){.stat-demo__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.stat-demo__grid{grid-template-columns:minmax(0,1fr)}.page{padding:16px 12px 32px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
/* v5: hover affordances only on devices with a real hover pointer */
@media (hover:hover) and (pointer:fine){
  .stat-demo__seg button:hover{color:var(--ink)}
  .stat-demo__seg button[aria-checked="true"]:hover{box-shadow:var(--shadow-lift)}
  .stat-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
  .theme-toggle:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
  .detail__close:hover{background:var(--surface);box-shadow:var(--shadow)}
}
</style>
</head>
<body>
<div class="page">
  <div class="stat-demo" data-style="classic">
    <div class="stat-demo__bar">
      <span class="stat-demo__title">Usage</span>
      <div class="stat-demo__seg" role="radiogroup" aria-label="Range" id="seg">
        <button type="button" role="radio" aria-checked="true" id="seg-7d" data-range="7d">7D</button>
        <button type="button" role="radio" aria-checked="false" id="seg-30d" data-range="30d">30D</button>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
        <svg id="icon-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <svg id="icon-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="stat-demo__grid" id="grid">
      <article class="stat-card" id="card-spend" data-metric="spend" tabindex="0" role="button" aria-label="Spend details">
        <div class="stat-card__top">
          <span class="stat-card__label">Spend</span>
          <span class="stat-card__change is-good" id="ch-spend"><span class="stat-card__arrow" id="cha-spend" aria-hidden="true">▲</span><span id="chv-spend">16.5%</span></span>
        </div>
        <div class="stat-card__value" id="val-spend">$2.7k</div>
        <div class="stat-card__vs" id="vs-spend">vs last week</div>
        <div class="stat-card__chart" id="chart-spend" role="img" aria-label="Spend per day"><div class="chart-tip" id="tip-spend" hidden></div></div>
      </article>
      <article class="stat-card" id="card-tokens" data-metric="tokens" tabindex="0" role="button" aria-label="Tokens details">
        <div class="stat-card__top">
          <span class="stat-card__label">Tokens</span>
          <span class="stat-card__change is-good" id="ch-tokens"><span class="stat-card__arrow" id="cha-tokens" aria-hidden="true">▲</span><span id="chv-tokens">8.2%</span></span>
        </div>
        <div class="stat-card__value" id="val-tokens">257.7M</div>
        <div class="stat-card__vs" id="vs-tokens">vs last week</div>
        <div class="stat-card__chart" id="chart-tokens" role="img" aria-label="Tokens per day"><div class="chart-tip" id="tip-tokens" hidden></div></div>
      </article>
      <article class="stat-card" id="card-latency" data-metric="latency" tabindex="0" role="button" aria-label="Avg. latency details">
        <div class="stat-card__top">
          <span class="stat-card__label">Avg. latency</span>
          <span class="stat-card__change is-good" id="ch-latency"><span class="stat-card__arrow" id="cha-latency" aria-hidden="true">▼</span><span id="chv-latency">6.1%</span></span>
        </div>
        <div class="stat-card__value" id="val-latency">1.18s</div>
        <div class="stat-card__vs" id="vs-latency">vs last week</div>
        <div class="stat-card__chart" id="chart-latency" role="img" aria-label="Latency per day"><div class="chart-tip" id="tip-latency" hidden></div></div>
      </article>
      <article class="stat-card" id="card-errors" data-metric="errors" tabindex="0" role="button" aria-label="Error rate details">
        <div class="stat-card__top">
          <span class="stat-card__label">Error rate</span>
          <span class="stat-card__change is-bad" id="ch-errors"><span class="stat-card__arrow" id="cha-errors" aria-hidden="true">▲</span><span id="chv-errors">12.3%</span></span>
        </div>
        <div class="stat-card__value" id="val-errors">0.35%</div>
        <div class="stat-card__vs" id="vs-errors">vs last week</div>
        <div class="stat-card__chart" id="chart-errors" role="img" aria-label="Errors per day"><div class="chart-tip" id="tip-errors" hidden></div></div>
      </article>
    </div>
  </div>
  <p class="foot" id="foot">Range switches after a short load. Select any card for its per-day breakdown.</p>
</div>
<div class="detail-backdrop" id="detail-backdrop" hidden></div>
<div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="detail__head">
    <span class="detail__title" id="detail-title">Details</span>
    <button type="button" class="detail__close" id="detail-close">Close</button>
  </div>
  <table aria-label="Per-day values">
    <thead><tr><th scope="col">Day</th><th scope="col">Value</th></tr></thead>
    <tbody id="detail-rows"></tbody>
  </table>
</div>
<script>
(function(){
'use strict';
/* Clean-room rebuild of the "Stat Card" demo.
   Data + behaviour ground truth: demo-original.js in this directory.
   DOM is built once at init; every later update touches changed nodes in place. */
var DAY_MS = 864e5;
var ANCHOR = Date.UTC(2026, 2, 9);
var RANGE_MS = 650;
var THEME_KEY = 'affectui-stat-card-theme';
var SVG_NS = 'http://www.w3.org/2000/svg';
var CH_W = 120, CH_H = 40, CH_PAD = 4;

function dayLabels(n){
  return Array.from({length:n}, function(_, i){
    return new Date(ANCHOR - (n - 1 - i) * DAY_MS)
      .toLocaleDateString('en-US', {month:'short', day:'numeric', timeZone:'UTC'});
  });
}
function genSeries(n, base, seed, growth){
  if(growth === undefined) growth = 0.012;
  return Array.from({length:n}, function(_, i){
    var wk = (i + seed) % 7 >= 5 ? 0.72 : 1;
    var osc = 1 + 0.09 * Math.sin(i * 1.7 + seed) + 0.05 * Math.cos(i * 0.6 + seed * 2);
    return +(base * wk * osc * (1 + growth * i)).toFixed(3);
  });
}
function sum(a){ return a.reduce(function(s, v){ return s + v; }, 0); }
function avg(a){ return sum(a) / a.length; }

var RANGES = {
  '7d':  {label:'7D',  n:7,  vs:'vs last week'},
  '30d': {label:'30D', n:30, vs:'vs last month'}
};
function buildRange(key){
  var n = RANGES[key].n;
  var spend = genSeries(n, 412, 1);
  var tokens = genSeries(n, 384e5, 2);
  var lat = genSeries(n, 1.31, 3, -0.004);
  var err = genSeries(n, 0.38, 4, 0.01);
  return {
    labels: dayLabels(n),
    spend:   {total: sum(spend), values: spend, change: key === '7d' ? 16.5 : 24.1},
    tokens:  {total: sum(tokens), values: tokens, change: key === '7d' ? 8.2 : 11.7},
    latency: {total: avg(lat), values: lat, change: key === '7d' ? -6.1 : -9.4},
    errors:  {total: avg(err), values: err, change: key === '7d' ? 12.3 : 0}
  };
}
function fmtSpend(v){ return v >= 1e3 ? '$' + (v / 1e3).toFixed(1) + 'k' : '$' + Math.round(v); }
function fmtTokens(v){
  if(v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if(v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  return '' + Math.round(v);
}
function fmtLatency(v){ return v.toFixed(2) + 's'; }
function fmtErrors(v){ return v.toFixed(2) + '%'; }

var METRICS = [
  {id:'spend',   label:'Spend',        fmt:fmtSpend,   kind:'sparkline', chartLabel:'Spend per day'},
  {id:'tokens',  label:'Tokens',       fmt:fmtTokens,  kind:'bar',       chartLabel:'Tokens per day'},
  {id:'latency', label:'Avg. latency', fmt:fmtLatency, kind:'sparkline', chartLabel:'Latency per day', lowerIsBetter:true},
  {id:'errors',  label:'Error rate',   fmt:fmtErrors,  kind:'sparkline', chartLabel:'Errors per day',  lowerIsBetter:true}
];
function changeTone(change, lowerIsBetter){
  if(change === 0) return 'flat';
  var good = lowerIsBetter ? change < 0 : change > 0;
  return good ? 'good' : 'bad';
}
function changeText(change){
  if(change === 0) return '0.0%';
  return (change > 0 ? '+' : '\u2212') + Math.abs(change).toFixed(1) + '%';
}
function changeArrow(change){
  if(change === 0) return '\u25AA';
  return change > 0 ? '\u25B2' : '\u25BC';
}

/* ---- state (single source of truth; DOM updated in place from here) ---- */
var pendingKey = '7d';
var committedKey = '7d';
var loading = false;
var hoverIndex = null;
var displayed = {};   /* metric id -> currently shown numeric value */
var rangeTimer = null;
var rafIds = {};
var cache = {};
function dataFor(key){
  if(!cache[key]) cache[key] = buildRange(key);
  return cache[key];
}

/* ---- element handles (grabbed once at init) ---- */
var D = document, W = window;
var els = {};
function grab(){
  els.seg7 = D.getElementById('seg-7d');
  els.seg30 = D.getElementById('seg-30d');
  els.seg = D.getElementById('seg');
  els.toggle = D.getElementById('theme-toggle');
  els.iconSun = D.getElementById('icon-sun');
  els.iconMoon = D.getElementById('icon-moon');
  els.detail = D.getElementById('detail');
  els.backdrop = D.getElementById('detail-backdrop');
  els.detailTitle = D.getElementById('detail-title');
  els.detailClose = D.getElementById('detail-close');
  els.detailRows = D.getElementById('detail-rows');
  els.cards = {}; els.vals = {}; els.chs = {}; els.charrows = {}; els.chvals = {};
  els.vs = {}; els.charts = {}; els.tips = {}; els.svg = {};
  METRICS.forEach(function(m){
    els.cards[m.id] = D.getElementById('card-' + m.id);
    els.vals[m.id] = D.getElementById('val-' + m.id);
    els.chs[m.id] = D.getElementById('ch-' + m.id);
    els.charrows[m.id] = D.getElementById('cha-' + m.id);
    els.chvals[m.id] = D.getElementById('chv-' + m.id);
    els.vs[m.id] = D.getElementById('vs-' + m.id);
    els.charts[m.id] = D.getElementById('chart-' + m.id);
    els.tips[m.id] = D.getElementById('tip-' + m.id);
  });
}

/* ---- charts: SVG built ONCE at init, geometry updated in place ---- */
var chartNodes = {}; /* id -> {svg, line, area, dot, guide, bars[]} */
function svgEl(tag, attrs){
  var n = D.createElementNS(SVG_NS, tag);
  if(attrs) for(var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function xPos(i, n){ return CH_PAD + (i * (CH_W - CH_PAD * 2)) / Math.max(n - 1, 1); }
function yPos(v, min, span){
  return (CH_H - CH_PAD) - ((v - min) / (span || 1)) * (CH_H - CH_PAD * 2 - 4);
}
function lineD(vals, min, span){
  var p = '';
  for(var i = 0; i < vals.length; i++){
    p += (i === 0 ? 'M' : 'L') + xPos(i, vals.length).toFixed(2) + ' ' + yPos(vals[i], min, span).toFixed(2);
  }
  return p;
}
function buildCharts(){
  METRICS.forEach(function(m){
    var box = els.charts[m.id];
    var svg = svgEl('svg', {viewBox:'0 0 ' + CH_W + ' ' + CH_H, height:'40', 'aria-hidden':'true'});
    svg.setAttribute('class', 'chart-svg chart-svg--' + m.kind);
    var rec = {svg:svg, bars:[]};
    if(m.kind === 'bar'){
      for(var i = 0; i < 30; i++){
        var r = svgEl('rect', {rx:'1.5', opacity:'0.65'});
        r.setAttribute('class', 'chart-bar');
        svg.appendChild(r);
        rec.bars.push(r);
      }
      rec.guide = svgEl('line', {y1:String(CH_PAD), y2:String(CH_H - CH_PAD), stroke:'currentColor', 'stroke-opacity':'0.35', 'stroke-width':'1'});
      rec.guide.setAttribute('class', 'chart-guide');
      svg.appendChild(rec.guide);
    }else{
      rec.area = svgEl('path', {fill:'currentColor', 'fill-opacity':'0.12', stroke:'none'});
      rec.area.setAttribute('class', 'chart-area');
      rec.line = svgEl('path', {fill:'none', stroke:'currentColor', 'stroke-width':'1.8', 'stroke-linecap':'round', 'stroke-linejoin':'round'});
      rec.line.setAttribute('class', 'chart-line');
      rec.guide = svgEl('line', {y1:String(CH_PAD), y2:String(CH_H - CH_PAD), stroke:'currentColor', 'stroke-opacity':'0.35', 'stroke-width':'1'});
      rec.guide.setAttribute('class', 'chart-guide');
      rec.dot = svgEl('circle', {r:'2.6', fill:'currentColor', stroke:'none'});
      rec.dot.setAttribute('class', 'chart-dot');
      svg.appendChild(rec.area);
      svg.appendChild(rec.line);
      svg.appendChild(rec.guide);
      svg.appendChild(rec.dot);
    }
    /* tooltip stays last so it paints above the svg */
    box.appendChild(svg);
    box.appendChild(els.tips[m.id]);
    chartNodes[m.id] = rec;
  });
}
function chartMinMax(vals){
  var min = vals[0], max = vals[0], i;
  for(i = 1; i < vals.length; i++){ if(vals[i] < min) min = vals[i]; if(vals[i] > max) max = vals[i]; }
  if(max - min < 1e-9){ min -= 1; max += 1; }
  return {min:min, span:max - min};
}
function paintChart(m, d){
  var rec = chartNodes[m.id];
  var vals = d[m.id].values, n = vals.length;
  var mm = chartMinMax(vals);
  var i, b;
  if(m.kind === 'bar'){
    var slot = (CH_W - CH_PAD * 2) / n;
    var bw = Math.max(slot * 0.62, 1.4);
    for(i = 0; i < rec.bars.length; i++){
      b = rec.bars[i];
      if(i >= n){ b.hidden = true; continue; }
      b.hidden = false;
      var h = 4 + ((vals[i] - mm.min) / mm.span) * (CH_H - CH_PAD * 2 - 8);
      b.setAttribute('x', (xPos(i, n) - bw / 2).toFixed(2));
      b.setAttribute('y', (CH_H - CH_PAD - h).toFixed(2));
      b.setAttribute('width', bw.toFixed(2));
      b.setAttribute('height', h.toFixed(2));
      b.setAttribute('opacity', (hoverIndex === null || hoverIndex === i) ? '1' : '0.45');
    }
  }else{
    var dd = lineD(vals, mm.min, mm.span);
    rec.line.setAttribute('d', dd);
    var base = (CH_H - CH_PAD).toFixed(2);
    var lastX = xPos(n - 1, n).toFixed(2), firstX = xPos(0, n).toFixed(2);
    rec.area.setAttribute('d', dd + 'L' + lastX + ' ' + base + 'L' + firstX + ' ' + base + 'Z');
  }
  paintMarker(m, d);
}
function paintMarker(m, d){
  var rec = chartNodes[m.id];
  var vals = d[m.id].values, n = vals.length;
  var tip = els.tips[m.id];
  var idx = (hoverIndex === null || hoverIndex < 0 || hoverIndex >= n) ? null : hoverIndex;
  if(idx === null){
    if(m.kind === 'bar'){ /* opacities reset above */ }
    else{
      rec.guide.setAttribute('x1', '-10'); rec.guide.setAttribute('x2', '-10');
      rec.dot.setAttribute('cx', '-10'); rec.dot.setAttribute('cy', '-10');
    }
    tip.hidden = true;
    return;
  }
  var mm = chartMinMax(vals);
  var x = xPos(idx, n);
  if(m.kind === 'bar'){
    for(var i = 0; i < n; i++) rec.bars[i].setAttribute('opacity', i === idx ? '1' : '0.45');
    rec.guide.setAttribute('x1', x.toFixed(2)); rec.guide.setAttribute('x2', x.toFixed(2));
  }else{
    rec.guide.setAttribute('x1', x.toFixed(2)); rec.guide.setAttribute('x2', x.toFixed(2));
    rec.dot.setAttribute('cx', x.toFixed(2));
    rec.dot.setAttribute('cy', yPos(vals[idx], mm.min, mm.span).toFixed(2));
  }
  tip.textContent = d.labels[idx] + ' \u00B7 ' + m.fmt(vals[idx]);
  tip.hidden = false;
  var pct = n === 1 ? 50 : (idx / (n - 1)) * 100;
  tip.style.left = Math.min(Math.max(pct, 14), 86) + '%';
}
function paintAllCharts(){
  var d = dataFor(committedKey);
  METRICS.forEach(function(m){ paintChart(m, d); });
}
function setHover(idx){
  if(idx === hoverIndex) return;
  hoverIndex = idx;
  paintAllCharts(); /* in-place marker/tooltip updates only */
}

/* ---- values: animated numbers, textContent updated in place ---- */
function raf(fn){
  if(W.requestAnimationFrame) return W.requestAnimationFrame(fn);
  return W.setTimeout(function(){ fn(W.performance && W.performance.now ? W.performance.now() : Date.now()); }, 16);
}
function cancelRaf(id){
  if(W.cancelAnimationFrame) W.cancelAnimationFrame(id);
  else W.clearTimeout(id);
}
function animateValue(id, fmt, from, to){
  var node = els.vals[id];
  if(rafIds[id] !== undefined){ cancelRaf(rafIds[id]); delete rafIds[id]; }
  if(from === to || !(W.requestAnimationFrame || W.setTimeout)){ node.textContent = fmt(to); displayed[id] = to; return; }
  var dur = 520, t0 = null;
  node.textContent = fmt(from);
  function frame(t){
    if(t0 === null) t0 = t;
    var k = Math.min(((t - t0) / dur), 1);
    var e = 1 - Math.pow(1 - k, 3);
    var v = from + (to - from) * e;
    node.textContent = fmt(v);
    if(k < 1){ rafIds[id] = raf(frame); }
    else{ node.textContent = fmt(to); displayed[id] = to; delete rafIds[id]; }
  }
  rafIds[id] = raf(frame);
}
function renderChange(m, d){
  var tone = changeTone(d[m.id].change, m.lowerIsBetter);
  var pill = els.chs[m.id];
  pill.setAttribute('class', 'stat-card__change is-' + tone);
  els.charrows[m.id].textContent = changeArrow(d[m.id].change);
  els.chvals[m.id].textContent = d[m.id].change === 0 ? '0.0%'
    : (m.lowerIsBetter && d[m.id].change < 0 ? '' : (d[m.id].change > 0 ? '+' : '\u2212'))
      + Math.abs(d[m.id].change).toFixed(1) + '%';
  /* latency shows direction without a redundant plus: "-6.1%" reads as ▼ 6.1% */
  if(m.lowerIsBetter && d[m.id].change < 0) els.chvals[m.id].textContent = Math.abs(d[m.id].change).toFixed(1) + '%';
  els.cards[m.id].setAttribute('aria-label', m.label + ' details');
}

/* ---- range switching: pending select now, commit after 650ms load ---- */
function paintSeg(){
  var a = pendingKey === '7d';
  els.seg7.setAttribute('aria-checked', a ? 'true' : 'false');
  els.seg30.setAttribute('aria-checked', a ? 'false' : 'true');
}
function setLoading(on){
  loading = on;
  METRICS.forEach(function(m){
    var card = els.cards[m.id];
    if(on) card.classList.add('is-loading');
    else card.classList.remove('is-loading');
    card.setAttribute('aria-busy', on ? 'true' : 'false');
  });
}
function commitRange(key){
  committedKey = key;
  setLoading(false);
  var d = dataFor(key);
  METRICS.forEach(function(m){
    els.vs[m.id].textContent = RANGES[key].vs;
    renderChange(m, d);
    animateValue(m.id, m.fmt, displayed[m.id], d[m.id].total);
    paintChart(m, d);
  });
}
function selectRange(key){
  if(key !== '7d' && key !== '30d') return;
  if(key === pendingKey && key === committedKey && !loading) return;
  pendingKey = key;
  paintSeg();
  if(key === committedKey){ setLoading(false); return; }
  setLoading(true);
  if(rangeTimer !== null){ W.clearTimeout(rangeTimer); rangeTimer = null; }
  rangeTimer = W.setTimeout(function(){
    rangeTimer = null;
    commitRange(pendingKey);
  }, RANGE_MS);
}

/* ---- detail dialog: rows built once, updated in place ---- */
var detailRows = [];
var detailFor = null;
function buildDetailRows(){
  var tb = els.detailRows;
  for(var i = 0; i < 30; i++){
    var tr = D.createElement('tr');
    var tdD = D.createElement('td');
    var tdV = D.createElement('td');
    tr.appendChild(tdD);
    tr.appendChild(tdV);
    tb.appendChild(tr);
    detailRows.push({tr:tr, d:tdD, v:tdV});
  }
}
function openDetail(id){
  var m = null;
  for(var i = 0; i < METRICS.length; i++) if(METRICS[i].id === id) m = METRICS[i];
  if(!m) return;
  if(!els.detail.hidden && detailFor === id && committedKey === openDetail._key) return;
  var d = dataFor(committedKey);
  els.detailTitle.textContent = m.label + ' \u2014 per day (' + RANGES[committedKey].label + ')';
  for(var r = 0; r < detailRows.length; r++){
    if(r < d.labels.length){
      detailRows[r].tr.hidden = false;
      detailRows[r].d.textContent = d.labels[r];
      detailRows[r].v.textContent = m.fmt(d[m.id].values[r]);
    }else{
      detailRows[r].tr.hidden = true;
    }
  }
  detailFor = id;
  openDetail._key = committedKey;
  els.detail.hidden = false;
  els.backdrop.hidden = false;
  if(els.detailClose && els.detailClose.focus) els.detailClose.focus();
}
function closeDetail(){
  els.detail.hidden = true;
  els.backdrop.hidden = true;
  detailFor = null;
}

/* ---- theme toggle ---- */
function currentTheme(){ return D.documentElement.getAttribute('data-theme') || 'light'; }
function applyTheme(t){
  D.documentElement.setAttribute('data-theme', t);
  try{ W.localStorage.setItem(THEME_KEY, t); }catch(e){}
  var dark = t === 'dark';
  els.toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
  els.toggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  els.iconSun.hidden = !dark;
  els.iconMoon.hidden = dark;
}
function toggleTheme(){ applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'); }

/* ---- init: wire everything once ---- */
function init(){
  grab();
  buildCharts();
  buildDetailRows();
  var d0 = dataFor('7d');
  METRICS.forEach(function(m){
    displayed[m.id] = 0;
    els.vs[m.id].textContent = RANGES['7d'].vs;
    renderChange(m, d0);
    animateValue(m.id, m.fmt, 0, d0[m.id].total);
    paintChart(m, d0);
  });
  paintSeg();
  applyTheme(currentTheme());

  els.seg7.addEventListener('click', function(){ selectRange('7d'); });
  els.seg30.addEventListener('click', function(){ selectRange('30d'); });
  els.seg.addEventListener('keydown', function(e){
    if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var next = (e.key === 'ArrowRight')
      ? (pendingKey === '7d' ? '30d' : '7d')
      : (pendingKey === '7d' ? '30d' : '7d');
    if(e.preventDefault) e.preventDefault();
    selectRange(next);
    var btn = next === '7d' ? els.seg7 : els.seg30;
    if(btn && btn.focus) btn.focus();
  });
  els.toggle.addEventListener('click', toggleTheme);

  METRICS.forEach(function(m){
    (function(mm){
      var card = els.cards[mm.id];
      var box = els.charts[mm.id];
      /* capture-phase open so a real click still survives dialog focus work */
      card.addEventListener('pointerdown', function(){ openDetail(mm.id); }, true);
      card.addEventListener('mousedown', function(){ openDetail(mm.id); }, true);
      card.addEventListener('click', function(){ openDetail(mm.id); });
      card.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ if(e.preventDefault) e.preventDefault(); openDetail(mm.id); }
      });
      /* hover/focus only move markers + tooltip text: never a re-render */
      box.addEventListener('mousemove', function(e){
        var n = dataFor(committedKey).labels.length;
        var frac = 0.5;
        if(e && typeof e.offsetX === 'number') frac = e.offsetX / CH_W;
        var idx = Math.round(frac * (n - 1));
        if(idx < 0) idx = 0;
        if(idx > n - 1) idx = n - 1;
        setHover(idx);
      });
      box.addEventListener('mouseleave', function(){ setHover(null); });
      card.addEventListener('blur', function(){ /* no re-render on focus loss */ });
    })(m);
  });
  els.detailClose.addEventListener('click', closeDetail);
  els.backdrop.addEventListener('click', closeDetail);
  D.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !els.detail.hidden) closeDetail();
  });

  /* test hooks (used by the in-dir harness; harmless in browsers) */
  W.__stat = {
    metrics: METRICS, ranges: RANGES,
    data: dataFor,
    state: function(){ return {pending:pendingKey, committed:committedKey, loading:loading, hover:hoverIndex, displayed:displayed}; },
    select: selectRange, hover: setHover, open: openDetail, close: closeDetail,
    theme: function(t){ if(t) applyTheme(t); return currentTheme(); },
    els: els
  };
}
init();
})();
</script>
</body>
</html>
