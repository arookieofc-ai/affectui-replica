<style>

html,body{margin:0;padding:0}

  font-size:14px; line-height:20px;

.theme-toggle{

  width:36px; height:36px; border-radius:999px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);

@media (max-width:480px){
  body{padding:52px 10px 24px}
  .tv-demo__scroll{max-height:none}
}

}
/* typeahead */
var typeState={text:"",at:0};
function typeahead(ch,fromIdx){
  var now=Date.now();
  if(now-typeState.at>700)typeState.text=ch;else typeState.text+=ch;
  typeState.at=now;
  var q=typeState.text.toLowerCase();
  var single=[...q].every(function(c){return c===q[0]});
  var needle=single?q[0]:q;
  var start=single?fromIdx+1:fromIdx;
  var nav=navigable();
  for(var k=0;k<nav.length;k++){
    var cand=nav[(start+k+nav.length)%nav.length];
    var lbl=String(cand.def.label||"").trimStart().toLowerCase();
    if(lbl.startsWith(needle)){focusId(cand.id);return}
  }
}
function onKey(ev){
  var t=ev.target;
  if(!t||t.getAttribute("role")!=="treeitem"||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  var id=t.getAttribute("data-id")||"";
  var e=byId.get(id); if(!e)return;
  var nav=navigable();
  var idx=nav.indexOf(e);
  var rtl=false;
  try{rtl=treeEl&&getComputedStyle(treeEl).direction==="rtl"}catch(err){rtl=false}
  var fwd=rtl?"ArrowLeft":"ArrowRight", back=rtl?"ArrowRight":"ArrowLeft";
  var isOpen=e.kids!==null&&expanded.has(e.id);
  var handled=true;
  if(ev.key==="ArrowDown"){var nx=nav[idx+1];if(nx)focusId(nx.id)}
  else if(ev.key==="ArrowUp"){if(idx>0)focusId(nav[idx-1].id)}
  else if(ev.key==="Home"){if(nav[0])focusId(nav[0].id)}
  else if(ev.key==="End"){if(nav[nav.length-1])focusId(nav[nav.length-1].id)}
  else if(ev.key===fwd){
    if(e.kids&&!e.def.disabled){
      if(isOpen){var first=(e.kids||[]).filter(function(k){return !k.def.disabled})[0];if(first)focusId(first.id)}
      else{applyExpanded(e.id,true);syncRoving()}
    }
  }
  else if(ev.key===back){
    if(isOpen)applyExpanded(e.id,false);
    else if(e.parent!=null)focusId(e.parent);
    syncRoving();
  }
  else if(ev.key==="Enter"){
    if(!e.def.disabled){applySelected(e.id);if(e.kids)applyExpanded(e.id,!isOpen);syncRoving()}
  }
  else if(ev.key===" "){if(!e.def.disabled){applySelected(e.id);syncRoving()}}
  else if(ev.key==="*"){
    var sibs=e.parent!=null?(byId.get(e.parent).kids||[]):roots;
    var changed=false;
    for(var s=0;s<sibs.length;s++){if(sibs[s].kids&&!sibs[s].def.disabled){if(applyExpanded(sibs[s].id,true))changed=true}}
    if(changed)syncRoving();
  }
  else if(ev.key.length===1&&/\S/.test(ev.key)){typeahead(ev.key,idx)}
  else handled=false;
  if(handled)ev.preventDefault();
}
function applyStep(st){
  var want=new Set(st.expanded.map(String));
  /* collapse removed first, then expand (in place, no rebuild) */
  liById.forEach(function(li,id){
    var e=byId.get(id);
    if(e&&e.kids&&!want.has(id)&&expanded.has(id))applyExpanded(id,false);
  });
  for(var i=0;i<st.expanded.length;i++){applyExpanded(st.expanded[i],true)}
  if(st.selected!==selected)applySelected(st.selected);
  else updateFoot();
  syncRoving();
}
function init(){
  footEl=document.getElementById("crumbFoot");
  var host=document.getElementById("scrollHost");
  var tree=buildTree();
  host.appendChild(tree);
  updateFoot(); syncRoving();
  var root=document.getElementById("demoRoot");
  if(root){
    root.addEventListener("pointerdown",function(){clearDemo()},{capture:true});
    root.addEventListener("keydown",function(){clearDemo()},{capture:true});
  }
  for(var i=0;i<STEPS.length;i++){
    (function(st,at){var id=setTimeout(function(){applyStep(st)},at);demoTimers.push(id)})(STEPS[i],STEP_TIMES[i]);
  }
  /* theme toggle */
  var btn=document.getElementById("themeToggle");
  function paintBtn(){
    var cur=document.documentElement.getAttribute("data-theme")||"light";
    var dark=cur==="dark";
    btn.textContent=dark?"☾":"◐";
    btn.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
    btn.setAttribute("aria-pressed",dark?"true":"false");
    btn.setAttribute("title",dark?"Switch to light theme":"Switch to dark theme");
  }
  paintBtn();
  btn.addEventListener("pointerdown",function(ev){ev.stopPropagation()},{capture:true});
  btn.addEventListener("mousedown",function(ev){ev.stopPropagation()},{capture:true});
  btn.addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme")||"light";
    var nxt=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",nxt);
    try{document.documentElement.dataset.theme=nxt}catch(e){}
    try{localStorage.setItem(THEME_KEY,nxt)}catch(e){}
    paintBtn();
  });
  /* expose for harness (read-only state snapshot) */
  try{
    window.__tv={get expanded(){return Array.from(expanded)},get selected(){return selected},steps:STEPS,times:STEP_TIMES,applyStep:applyStep,clearDemo:clearDemo};
  }catch(e){}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
})();
</script>
