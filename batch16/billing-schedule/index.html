<meta name="color-scheme" content="light dark">
<title>Billing Schedule — Create a billing schedule</title>
<style>
:root{
  --surface:#ffffff; --page:#fafaf9; --ink:#171717; --ink2:#1c1917;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --focus:rgba(0,96,226,.7);
  --amber:#f59e0b; --amber-bg:#fef3c7; --amber-tx:#92400e;
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --focus:rgba(77,141,255,.8);
  --amber:#fbbf24; --amber-bg:#451a03; --amber-tx:#fde68a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.page{max-width:600px;margin:0 auto;padding:16px 14px 40px}
.topbar{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.topbar .proj{min-width:0;flex:1}
.topbar .proj b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .proj span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:background 150ms ease,transform 150ms ease}
@media (hover: hover) and (pointer: fine) {
.theme-btn:hover{background:var(--subtle)}
}
.theme-btn:active{transform:scale(.96)}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ---- component tray ---- */
.ui-bs{width:100%;max-width:560px;padding:6px;border-radius:calc(var(--radius-lg) + 4px);background:var(--subtle);color:var(--ink);border:1px solid var(--border)}
.ui-bs button{font:inherit;color:inherit}
.ui-bs button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ui-bs :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ui-bs svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ui-bs__title{margin:0;padding:10px 10px 12px;font-size:15px;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere}
.ui-bs__card{padding:12px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow)}
.ui-bs__summary{display:flex;align-items:center;gap:8px;padding:2px 2px 12px;font-size:14px;color:var(--ink)}
.ui-bs__phase{min-width:0;width:auto;padding:2px 4px;margin-left:-4px;border:0;border-radius:4px;background:none;font-weight:500;color:var(--ink);outline:none;transition:background-color 160ms ease}
@media (hover: hover) and (pointer: fine) {
.ui-bs__phase:hover,.ui-bs__phase:focus{background:var(--subtle)}
}
.ui-bs__summary svg{width:15px;height:15px;color:var(--muted)}
.ui-bs__end{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui-bs__fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border-radius:calc(var(--radius-lg) - 4px);background:var(--subtle)}
.ui-bs__field{display:grid;gap:7px;min-width:0;font-size:13px}
.ui-bs__field>span:first-child{color:var(--ink)}
.ui-bs__input,.ui-bs__select{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:40px;padding:0 12px;border:0;border-radius:var(--radius);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-size:14px;color:var(--ink);text-align:left}
.ui-bs__select svg{color:var(--muted);transition:transform 220ms ease}
.ui-bs__select[aria-expanded="true"] svg{transform:rotate(180deg)}
.ui-bs__dd{position:relative}
.ui-bs__menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:5;display:grid;gap:2px;min-width:220px;max-width:min(360px,calc(100vw - 32px));max-height:min(320px,60vh);overflow-y:auto;overscroll-behavior:contain;padding:5px;border-radius:calc(var(--radius-lg) - 4px);background:var(--surface);box-shadow:0 0 0 1px var(--border),0 10px 30px rgba(0,0,0,.1)}
.ui-bs__menu[data-up]{top:auto;bottom:calc(100% + 6px)}
.ui-bs__menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:0;border-radius:7px;background:none;font-size:13.5px;text-align:left;width:100%}
@media (hover: hover) and (pointer: fine) {
.ui-bs__menu button:hover{background:var(--subtle)}
}
.ui-bs__menu small{display:block;margin-top:1px;font-size:12px;color:var(--muted)}
.ui-bs__table{margin-top:6px}
.ui-bs__row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr) 216px;align-items:center;gap:14px;min-height:52px;padding:6px 4px 6px 6px;border-bottom:1px solid var(--border);font-size:14px}
.ui-bs__row--head{min-height:40px;font-size:13px;color:var(--muted)}
.ui-bs__right{text-align:right;padding-right:30px}
.ui-bs__rows-outer{overflow:hidden}
.ui-bs__rows-outer[data-smooth]{transition:height 320ms ease}
.ui-bs__inline{border:0;background:none;font:inherit;display:inline-flex;align-items:center;gap:4px;height:24px;margin-left:-6px;padding:0 4px 0 6px;border-radius:5px;color:var(--ink);white-space:nowrap;cursor:pointer}
.ui-bs__inline svg{width:14px;height:14px;color:var(--muted)}
.ui-bs__inline>svg{width:12px;height:12px}
.ui-bs__inline[aria-expanded="true"]>svg{transform:rotate(180deg)}
@media (hover: hover) and (pointer: fine) {
.ui-bs__inline:hover,.ui-bs__inline[aria-expanded="true"]{background:var(--subtle)}
}
.ui-bs__timing{justify-self:end;margin:0 28px 0 0}
.ui-bs__timing .ui-bs__inline{height:20px;margin:0;padding:0 2px 0 4px;font-size:12px;color:var(--muted)}
.ui-bs__input-value{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.ui-bs__menu.ui-bs__cal{width:252px;max-height:none;overflow:visible;padding:8px}
.ui-bs__cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 4px 6px;font-weight:500}
.ui-bs__cal-nav{display:flex;gap:2px}
.ui-bs__cal-nav button{width:28px;height:28px;padding:0;display:grid;place-items:center;color:var(--muted)}
.ui-bs__cal-grid{display:grid}
.ui-bs__cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.ui-bs__cal-row>[role="gridcell"]{display:grid}
.ui-bs__cal-dow{display:grid;place-items:center;height:26px;font-size:11px;color:var(--muted)}
.ui-bs__cal-day{display:grid;place-items:center;height:32px;padding:0;border-radius:6px;font-size:12.5px;background:none;border:0;color:var(--ink);font-variant-numeric:tabular-nums}
.ui-bs__cal-day[data-out]{color:var(--muted);opacity:.6}
.ui-bs__cal-day[data-picked]{background:var(--ink);color:var(--surface);opacity:1}
.ui-bs__empty{margin:0;padding:16px 6px;font-size:13px;color:var(--muted)}
.ui-bs__name{display:flex;align-items:center;gap:8px;min-width:0}
.ui-bs__name-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui-bs__tag{display:grid;place-items:center;width:22px;height:22px;flex:none;border-radius:6px;background:var(--subtle);color:var(--muted)}
.ui-bs__tag svg{width:13px;height:13px}
.ui-bs__muted{font-size:13px;color:var(--muted);white-space:nowrap}
.ui-bs__price{display:grid;justify-items:end;min-width:0}
.ui-bs__price-main{display:flex;align-items:center;gap:4px;white-space:nowrap}
.ui-bs__num{display:inline-flex;align-items:center;color:var(--ink);font-variant-numeric:tabular-nums}
.ui-bs__num input{padding:3px 1px;border:0;border-radius:5px;background:none;outline:none;text-align:right;font-variant-numeric:tabular-nums;width:auto}
@media (hover: hover) and (pointer: fine) {
.ui-bs__num input:hover{background:var(--subtle)}
}
.ui-bs__remove{display:grid;place-items:center;width:24px;height:24px;margin-left:4px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);opacity:0;transition:opacity 160ms ease,background-color 160ms ease}
.ui-bs__remove svg{width:13px;height:13px}
@media (hover: hover) and (pointer: fine) {
.ui-bs__row:hover .ui-bs__remove,.ui-bs__remove:focus-visible{opacity:1}
}
@media (hover: hover) and (pointer: fine) {
.ui-bs__remove:hover{background:var(--subtle);color:var(--ink)}
}
.ui-bs__actions{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:calc(var(--radius-lg) - 4px);background:var(--subtle)}
.ui-bs__spacer{flex:1}
.ui-bs__btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-radius:var(--radius);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-size:13.5px;white-space:nowrap;transition:background-color 160ms ease,opacity 200ms ease,transform 160ms ease}
@media (hover: hover) and (pointer: fine) {
.ui-bs__btn:hover:not(:disabled){background:var(--page)}
}
.ui-bs__btn:active:not(:disabled){transform:scale(.98)}
.ui-bs__btn:disabled{opacity:.45;cursor:default}
.ui-bs__btn svg{color:var(--muted)}
.ui-bs__select-label{display:inline-flex;align-items:center;gap:8px}
.ui-bs__totals{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 10px 6px;font-size:13px;color:var(--muted)}
.ui-bs__totals b{margin-left:4px;white-space:nowrap;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ui-bs__totals em{margin-left:6px;font-style:normal;font-size:12px;color:var(--muted)}
@media (max-width:520px){
  .ui-bs__fields{grid-template-columns:1fr}
  .ui-bs__summary{flex-wrap:wrap;row-gap:2px}
  .ui-bs__row{grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 4px 10px 6px}
  .ui-bs__row--head{display:none}
  .ui-bs__price{justify-items:stretch}
  .ui-bs__price-main{justify-content:flex-start}
  .ui-bs__timing{justify-self:start;margin:0 0 0 -4px}
  .ui-bs__remove{opacity:1;margin-left:auto}
  .ui-bs__actions{flex-wrap:wrap}
  .ui-bs__spacer{display:none}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="proj"><b id="proj-name">Billing Schedule</b><span id="proj-meta">Build-out phase · 1 line</span></div>
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle theme"><svg id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v1M12 19v1M4 12h1M19 12h1M6.3 6.3l.7.7M17 17l.7.7M6.3 17.7 7 17M17 7l.7-.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg></button>
  </div>
  <div id="app"></div>
</div>
<script>
(function(){
'use strict';
/* data verbatim from demo-original */
var DURATIONS=[
  {id:'milestone',label:'Milestone',months:0},
  {id:'1m',label:'1 month',months:1},
  {id:'3m',label:'3 months',months:3},

  {id:'12m',label:'12 months',months:12}
];
var REPEATS=[
  {id:'once',label:'Once',perYear:0},
  {id:'monthly',label:'Monthly',perYear:12},
  {id:'quarterly',label:'Quarterly',perYear:4},
  {id:'yearly',label:'Yearly',perYear:1}
];
var CATALOG=[
  {name:'Set-up fee',repeat:'once',price:4999},

  {name:'Premium support',repeat:'monthly',price:350},
  {name:'Extra seats (10)',repeat:'monthly',price:240},
  {name:'Onboarding workshop',repeat:'once',price:1500}
];
var TITLE='Create a billing schedule';
var CURRENCY='$';
var DEFAULT_PHASE='Build-out phase';
var DEFAULT_START='2026-01-01';
var P_REPEAT='M17 3.5 19.5 6 17 8.5M19.5 6H9a5 5 0 0 0-5 5M7 20.5 4.5 18 7 15.5M4.5 18H15a5 5 0 0 0 5-5';
var P_DISC='M9 15 15 9M9.5 9.5h.01M14.5 14.5h.01M12 3l2.1 1.6 2.6-.2.9 2.5 2.3 1.2-.4 2.6L21 12.6l-1.5 2.1.4 2.6-2.3 1.2-.9 2.5-2.6-.2L12 21.4l-2.1-1.6-2.6.2-.9-2.5L4.1 16.3l.4-2.6L3 12l1.5-2.1-.4-2.6 2.3-1.2.9-2.5 2.6.2Z';
var P_MIN='M5 19.5h14M7 15.5h10M9 11.5h6M10 7.5h4M12 4v1';
var P_CHECK='m6 12.5 4 4 8-9';
var P_X='M7 7l10 10M17 7 7 17';
var P_PLUS='M12 5.5v13M5.5 12h13';
var P_CHEV='m7 10 5 5 5-5';
var P_ARR='M5 12h14m0 0-5-5m5 5-5 5';
var P_CAL='M7 4v3M17 4v3M4.5 9.5h15M6 6h12a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 18 20H6a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 6 6Z';
var P_PREV='m14.5 6-6 6 6 6';
var P_NEXT='m9.5 6 6 6-6 6';
var DOW=['Mo','Tu','We','Th','Fr','Sa','Su'];
var DOW_LONG=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var FMT_D=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'});
var FMT_FULL=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
var FMT_M=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'});

var state={phase:DEFAULT_PHASE,start:DEFAULT_START,durationId:'milestone',
  lines:[{id:'seed-1',kind:'product',name:'Set-up fee',repeat:'once',price:4999,timing:'advance'}],
  open:null};
var seq=0;
function nid(){seq+=1;return 'l'+seq}
function num(v){return Number.isFinite(v)?v:0}
function repOf(id){for(var i=0;i<REPEATS.length;i++){if(REPEATS[i].id===id)return REPEATS[i]}return REPEATS[0]}
function durOf(id){for(var i=0;i<DURATIONS.length;i++){if(DURATIONS[i].id===id)return DURATIONS[i]}return DURATIONS[0]}
function fmtMoney(v){
  var t=num(v);
  if(t!==0&&Math.abs(t)<0.005){return (t<0?'-':'')+'<'+CURRENCY+'0.01'}
  var s=(t<0?'-':'')+CURRENCY+Math.abs(t).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return s;
}
function fmtDateObj(d){if(isNaN(d.getTime()))return '\u2013';return FMT_D.format(d)}
function fmtStartStr(s){var d=new Date(s+'T12:00:00');return fmtDateObj(d)}
function endLabel(){
  var b=durOf(state.durationId);
  if(!b.months)return 'Milestone';
  var d=new Date(state.start+'T12:00:00');
  if(isNaN(d.getTime()))return '\u2013';
  d.setMonth(d.getMonth()+b.months);d.setDate(d.getDate()-1);
  return fmtDateObj(d);
}
function totals(){
  var prods=[],i;
  for(i=0;i<state.lines.length;i++){if(state.lines[i].kind==='product')prods.push(state.lines[i])}
  var disc=null,mini=null;
  for(i=0;i<state.lines.length;i++){if(state.lines[i].kind==='discount'&&!disc)disc=state.lines[i];if(state.lines[i].kind==='minimum'&&!mini)mini=state.lines[i]}
  var f=1-Math.min(100,Math.max(0,num(disc?disc.percent:0)))/100;
  var first=0;
  for(i=0;i<prods.length;i++){if(prods[i].timing==='advance')first+=num(prods[i].price)}
  first=first*f;
  var te=durOf(state.durationId).months||1;
  var z=0;
  for(i=0;i<prods.length;i++){var p=prods[i];var n=repOf(p.repeat).perYear;
    z+=(n?num(p.price)*Math.max(1,Math.round(n*te/12)):num(p.price))}
  z=z*f;
  var q=num(mini?mini.amount:0);
  var tot=Math.max(z,q);
  return {first:first,phase:tot,base:z,min:q,hasMin:!!mini,minApplies:!!mini&&tot===q&&z<q};
}
/* ---------- dom helpers ---------- */
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function svgIcon(d){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);s.appendChild(p);return s}
function btn(label,cls){var b=document.createElement('button');b.type='button';if(cls)b.className=cls;return b}

var R={};
var rowMap={};
var calState={view:null};
var docCloserBound=false;

function closeOpen(refocus){
  if(!state.open){return}
  var key=state.open;state.open=null;syncMenus(refocus?key:null);
}
function toggleOpen(key){if(state.open===key){closeOpen(true)}else{state.open=key;syncMenus(null)}}

function bindTriggerOpen(trigger,key){
  var fired=false;
  trigger.addEventListener('pointerdown',function(){fired=true;toggleOpen(key)},true);
  trigger.addEventListener('mousedown',function(e){if(!fired){toggleOpen(key)}fired=false},true);
  trigger.addEventListener('click',function(e){
    if(fired){fired=false;e.preventDefault();return}
    toggleOpen(key);
  });
  trigger.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleOpen(key)}
    else if(e.key==='Escape'){closeOpen(true)}
  });
}
function ensureDocCloser(){
  if(docCloserBound)return;docCloserBound=true;
  document.addEventListener('pointerdown',function(e){
    if(!state.open)return;
    var t=e.target;
    var dd=t&&t.closest? t.closest('.ui-bs__dd'):null;
    if(!dd){closeOpen(false)}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&state.open){closeOpen(true)}
  });
}

/* number field: prefix input suffix, in-place updates */
function makeNum(get,set,opts){
  var prefix=opts.prefix||'',suffix=opts.suffix||'',max=opts.max,label=opts.label||'';
  var wrap=el('span','ui-bs__num');
  var editing={v:null};
  var pre=document.createTextNode(prefix);
  wrap.appendChild(pre);
  var inp=document.createElement('input');
  inp.setAttribute('aria-label',label);
  inp.inputMode='decimal';
  wrap.appendChild(inp);
  if(suffix){wrap.appendChild(document.createTextNode(suffix))}
  function paint(){
    var raw=get();
    var u=Math.min(max!=null?max:Infinity,Number.isFinite(raw)?raw:0);
    var show;
    if(editing.v!==null){show=editing.v}
    else{var abs=Math.abs(u);show=abs.toLocaleString('en-US',{minimumFractionDigits:suffix?0:2,maximumFractionDigits:2})}
    if(inp.value!==show)inp.value=show;
    try{inp.size=Math.max(2,show.length)}catch(e){}
    var neg=(editing.v===null&&u<0);
    if(neg&&!wrap.firstChild.__neg){var d=document.createTextNode('-');wrap.insertBefore(d,wrap.firstChild);wrap.firstChild.__neg=1}
    if(!neg&&wrap.firstChild&&wrap.firstChild.__neg){wrap.removeChild(wrap.firstChild)}
  }
  inp.addEventListener('focus',function(){var raw=get();var u=Math.min(max!=null?max:Infinity,Number.isFinite(raw)?raw:0);editing.v=String(u);paint();try{inp.select()}catch(e){}});
  inp.addEventListener('change',function(){editing.v=inp.value.replace(/[^\d.]/g,'')});
  inp.addEventListener('input',function(){editing.v=inp.value.replace(/[^\d.]/g,'');try{inp.size=Math.max(2,editing.v.length||1)}catch(e){}});
  inp.addEventListener('blur',function(){
    var cap=max!=null?max:Infinity;
    var v=Math.max(0,Math.min(cap,parseFloat(editing.v!=null?editing.v:'')||0));
    editing.v=null;set(v);paint();refreshTotals();refreshProjMeta();
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.target.blur()}});
  paint();
  return {node:wrap,repaint:paint};
}

function buildApp(){
  var app=document.getElementById('app');
  while(app.firstChild)app.removeChild(app.firstChild);
  var root=el('div','ui-bs');

  if(state.open==='date'){
    if(!calState.view)calState.view=cur||new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12);
  } else if(!calState.view){calState.view=cur||new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate(),12)}

  calRefs.label.textContent=FMT_M.format(view);

  }
}

    else if(focusKey==='duration')t=R.trigDur;
    else if(focusKey==='product')t=R.trigProd;
    else{Object.keys(rowMap).forEach(function(id){var r=rowMap[id];if(r._rep&&r._rep.key===focusKey)t=r._rep.trig;if(r._tim&&r._tim.key===focusKey)t=r._tim.trig})}
    if(t){try{t.focus()}catch(e){}}
  }
}
function refreshTotals(){
  var t=totals();
  if(R.bA.textContent!==fmtMoney(t.first))R.bA.textContent=fmtMoney(t.first);
  /* rebuild tB in place */
  while(R.tB.firstChild)R.tB.removeChild(R.tB.firstChild);
  var b=durOf(state.durationId);
  R.tB.appendChild(document.createTextNode(b.months?('Phase total ('+b.label+')'):('Phase total')));
  R.tB.appendChild(document.createTextNode(' '));
  var bb=el('b',null,fmtMoney(t.phase));
  R.tB.appendChild(bb);R.bB=bb;
  if(t.minApplies){var em=el('em',null,'minimum applies');R.tB.appendChild(em)}
}
function refreshProjMeta(){
  var m=document.getElementById('proj-meta');
  if(m){var s=state.phase+' \u00b7 '+state.lines.length+(state.lines.length===1?' line':' lines');if(m.textContent!==s)m.textContent=s}
  var pn=document.getElementById('proj-name');
}
function refreshSummary(){
  var s=fmtStartStr(state.start);
  if(R.sumStart.textContent!==s)R.sumStart.textContent=s;
  if(R.dateVal.textContent!==s)R.dateVal.textContent=s;
  var e=endLabel();
  if(R.sumEnd.textContent!==e)R.sumEnd.textContent=e;
}
function refreshAll(){refreshSummary();refreshRows();refreshTotals();refreshProjMeta();syncMenus(null)}
/* theme */
function initTheme(){
  var btnT=document.getElementById('theme-toggle');
  var icon=document.getElementById('theme-icon');
  function paint(){
    var cur=document.documentElement.getAttribute('data-theme')||'light';
    btnT.setAttribute('aria-label',cur==='dark'?'Switch to light mode':'Switch to dark mode');
    btnT.title=cur==='dark'?'Switch to light':'Switch to dark';
    while(icon.firstChild)icon.removeChild(icon.firstChild);
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    if(cur==='dark'){p.setAttribute('d','M12 4v1M12 19v1M4 12h1M19 12h1M6.3 6.3l.7.7M17 17l.7.7M6.3 17.7 7 17M17 7l.7-.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z')}
    else{p.setAttribute('d','M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5Z')}
    icon.appendChild(p);
  }
  btnT.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme')||'light';
    var nx=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',nx);
    try{localStorage.setItem('bs-theme',nx)}catch(e){}
    paint();
  });
  paint();
  window.__bsToggle=paint;
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){buildApp();initTheme()})}else{buildApp();initTheme()}
})();
</script>
