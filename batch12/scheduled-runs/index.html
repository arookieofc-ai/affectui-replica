html[data-theme="dark"]{

  --muted:#a1a1aa; --faint:rgba(255,255,255,.34); --subtle:#26262a; --lane:#161618;

  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --shadow-card:0 0 0 .5px rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.4);

  --accent:#4fb0fe; --accent-bg:rgba(79,176,254,.12); --drop:rgba(79,176,254,.55);
  --focus:rgba(77,141,255,.8); --now:#ff6b5f;

[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{

.wrap{max-width:1140px;margin:28px auto 48px;padding:0 16px}

.sr{position:relative;box-sizing:border-box;width:100%;min-width:0;

  background:var(--track);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.sr-tile-top{display:flex;align-items:center;gap:6px;min-width:0}

.sr-tile-meta{overflow:hidden;padding-left:24px;font-size:11.5px;line-height:14px;color:var(--muted);

.sr-tile-meta[data-nope]{color:var(--amber-tx);background:var(--amber-bg);border-radius:4px}
.sr-card{height:auto;min-height:64px}

.sr-empty[data-show]{opacity:1}

.px{display:grid;flex:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:1px;width:18px;height:18px;padding:2px;border-radius:5px;background:var(--surface);

@keyframes px-tw{0%,100%{opacity:1}50%{opacity:.3}}
.sr-tile[data-fresh] .px span[data-on],.sr-flier .px span[data-on]{animation:px-tw 900ms ease-in-out infinite}
.sr-flier{position:absolute;z-index:5;pointer-events:none}

.sr-info{position:absolute;z-index:7;display:grid;gap:8px;padding:12px;pointer-events:none;

  border-radius:14px;background:var(--surface);box-shadow:var(--shadow);
  border:1px solid var(--border);transform-origin:top left;animation:sr-pop 180ms cubic-bezier(.32,.72,.24,1) both}
@keyframes sr-pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.sr-info-head{display:flex;align-items:center;gap:8px;min-width:0}
.sr-info-title{min-width:0;font-size:13px;font-weight:500;line-height:18px;color:var(--ink-strong);overflow-wrap:anywhere}
.sr-info-text{margin:0;font-size:12px;line-height:17px;color:var(--muted)}
.sr-info-rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;
  padding-top:8px;border-top:1px solid var(--border);font-size:12px;line-height:16px}
.sr-info-rows dt{color:var(--muted)}
.sr-info-rows dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.sr-info-hint{margin:0;font-size:11px;line-height:15px;color:var(--faint)}
/* ---- week grid ---- */
.sr-scroll{min-width:0;overflow-x:auto;user-select:none}
.sr-week{display:grid;gap:4px;min-width:calc(38px + 3 * 128px)}
.sr-row{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr));gap:4px}
.sr-row-head{height:30px;align-items:center}
.sr-day{display:flex;align-items:baseline;gap:4px;height:26px;padding:5px 8px 0;border-radius:10px;
  background:var(--lane);box-shadow:inset 0 0 0 1px var(--border);
  font-size:10.5px;font-weight:500;line-height:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.sr-day b{font-size:12px;font-weight:500;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.sr-day[data-today]{color:var(--ink)}
.sr-time{padding-top:6px;font-size:11px;line-height:16px;color:var(--faint);font-variant-numeric:tabular-nums}
.sr-cell{position:relative;display:flex;flex-direction:column;min-width:0;min-height:156px;
  padding:4px 4px 20px;border-radius:12px;background:var(--lane);
  box-shadow:inset 0 0 0 1px var(--border);
  transition:background-color 160ms ease,box-shadow 160ms ease,opacity 160ms ease}
.sr-cell[data-past]{background:transparent}
.sr-cell[data-past] .sr-chips{opacity:.45}
.sr-cell[data-blocked]{background:repeating-linear-gradient(135deg,var(--lane) 0 6px,var(--hatch) 6px 7px)}
.sr-cell[data-blocked]>:not(.sr-why){opacity:.45}
.sr-cell[data-over]{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--drop)}
.sr-chips{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:3px}
.sr-chip[data-landing]{visibility:hidden}
.sr-chip[data-fresh]{animation:sr-drop 460ms cubic-bezier(.32,.72,.24,1) both}
@keyframes sr-drop{from{opacity:0;transform:translateY(-6px) scale(.96)}}
.sr-more{height:64px;padding-left:6px;font-size:11px;line-height:64px;color:var(--muted)}
.sr-now{position:absolute;top:-2px;right:0;left:0;z-index:2;height:1.5px;margin-top:-.75px;
  background:var(--now);pointer-events:none}
.sr-now::before{content:"";position:absolute;top:50%;left:-4px;width:8px;height:8px;border-radius:50%;
  background:var(--now);transform:translateY(-50%)}
.sr-use{position:absolute;right:8px;bottom:9px;left:8px;height:3px;overflow:hidden;
  border-radius:2px;background:var(--track)}
.sr-use>i{display:block;height:100%;border-radius:inherit;background:var(--meter);transition:width 520ms cubic-bezier(.32,.72,.24,1)}
.sr-cell[data-past] .sr-use>i{opacity:.5}
.sr-why{position:absolute;top:50%;left:50%;z-index:3;padding:2px 8px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-card);font-size:11px;font-weight:500;
  line-height:16px;color:var(--ink);white-space:nowrap;transform:translate(-50%,-50%);
  pointer-events:none;animation:sr-pop 140ms ease both}
.sr-ghost{position:absolute;top:0;left:0;z-index:6;margin:0;pointer-events:none;animation:none;
  box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 12px 24px -8px rgba(166,81,240,.28)}
.sr[data-dragging],.sr[data-dragging] *{cursor:grabbing !important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-width:640px){
  .sr-body{grid-template-columns:minmax(0,1fr)}
  .sr-stack{min-height:0}
  .sr-stack>.sr-cards{max-height:320px}
  .sr-cards{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));column-gap:4px}
}
@media (prefers-reduced-motion:reduce){
  .sr *,.sr *::before,.sr *::after{animation:none !important;transition:none !important}
}
</style>

  else{path('M4 2.5h5l3 3v8H4z');}

/* deterministic 3x3 agent pixel-mark: always EXACTLY 9 cells */
function hashStr(s){var x=0,i;for(i=0;i<s.length;i++){x=((x*31)+s.charCodeAt(i))>>>0;}return x;}
function agentHue(agent){return hashStr(String(agent))%360;}
function pixelmark(agent){
  var hx=hashStr('px:'+String(agent));
  var bits=(hx^(hx>>>9)^(hx>>>17))&0x1FF;
  var el=h('span',{'class':'px','aria-hidden':'true'});
  el.style.setProperty('--px-c','hsl('+agentHue(agent)+' 60% 48%)');
  for(var i=0;i<9;i++){
    var cell=h('span',{});
    if((bits>>i)&1) cell.setAttribute('data-on','');
    el.appendChild(cell);
  }
  return el;
}

/* ============ state ============ */
var placed=[], skipped=[], flying=null, fresh=[];
var mode='auto', paused=false, filterAgent=null, openDlg=null;
var carry=null, press=null, dragGhost=null, hoverCell=null, hoveredRoot=false, suppressTap=false;
var timers=[], refs={cards:{},chips:{}};
var rootEl=null, liveEl=null, lastAnnounce='', uid=0;
function later(fn,ms){
  var id=window.setTimeout(function(){
    for(var i=0;i<timers.length;i++) if(timers[i]===id){timers.splice(i,1);break;}
    fn();
  },ms);
  timers.push(id); return id;
}
function clearTimers(){for(var i=0;i<timers.length;i++) window.clearTimeout(timers[i]);timers=[];}
function announce(msg){lastAnnounce=msg;if(liveEl) liveEl.textContent=msg;}
function cellName(i){return DAYS[Math.floor(i/NX)].name+' '+DAYS[Math.floor(i/NX)].date+', '+SESSIONS[i%NX];}
function taskById(id){for(var i=0;i<TASKS.length;i++) if(TASKS[i].id===id) return TASKS[i];return null;}
function chipByKey(key){for(var i=0;i<placed.length;i++) if(placed[i].key===key) return placed[i];return null;}

function initialBooked(){
  var out=[],occ={used:[],count:[]},i;
  for(i=0;i<NCELL;i++){occ.used.push(0);occ.count.push(0);}
  var n=0;
  for(i=0;i<TASKS.length;i++){
    var t=TASKS[i];
    if(!t.at) continue;
    var idx=t.at.day*NX+t.at.session;
    if(idx<0||idx>=NCELL) continue;
    var res=fit(t,idx,occ,'booked')||[];
    for(var j=0;j<res.length;j++){occ.used[res[j].cell]+=res[j].usage;occ.count[res[j].cell]+=1;}
    for(j=0;j<res.length;j++){
      out.push({key:'booked-'+(n++),task:t,cell:res[j].cell,usage:res[j].usage,
        part:j+1,parts:res.length,booked:true,manual:false});
    }
  }
  return out;
}
function trayTasks(){
  var have={};
  for(var i=0;i<placed.length;i++) have[placed[i].task.id]=true;
  var out=[];
  for(i=0;i<TASKS.length;i++){
    var t=TASKS[i];
    if(t.at) continue;
    if(have[t.id]||flying&&flying.id===t.id) continue;
    if(skipped.indexOf(t.id)>=0) continue;
    out.push(t);
  }
  return out;
}
function dimmed(agent){return filterAgent!==null&&agent!==filterAgent;}

/* ============ auto-schedule engine ============ */
function autoStep(){
  if(mode!=='auto'||paused||flying) return;
  var have={};
  for(var i=0;i<placed.length;i++) have[placed[i].task.id]=true;
  var acc=[];
  var list=TASKS.filter(function(t){return !t.at;});
  for(var li=0;li<list.length;li++){
    var t=list[li];
    if(have[t.id]||skipped.indexOf(t.id)>=0) continue;
    var res=fit(t,Math.max(0,NOWIDX),occupancy(null));
    if(!res){acc.push(t.id);continue;}
    if(acc.length){skipped=skipped.concat(acc);}
    var first=res[0],rest=res.slice(1);
    var key=t.id+'#1';
    placed.push({key:key,task:t,cell:first.cell,usage:first.usage,part:1,parts:res.length,booked:false,manual:false});
    if(rest.length){
      flying={id:t.id,key:key,rest:rest};
    }else{
      fresh=[key];
    }
    render();
    if(rest.length){flyToTray(t,key,rest);}
    else{later(autoStep,GAP_MS);}
    return;
  }
  if(acc.length){skipped=skipped.concat(acc);render();}
  announce('Auto-schedule is done');
  if(mode==='auto'&&!paused&&trayTasks().length===0){
    later(function(){
      if(mode!=='auto'||paused||hoveredRoot||trayTasks().length>0) return;
      resetWeek(); autoStep();
    },LOOP_MS);
  }
}
function flyToTray(task,firstKey,rest){
  render();
  var root=rootEl;
  var cardEl=refs.cards[task.id], chipEl=refs.chips[firstKey];
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function commit(){
    if(!flying||flying.id!==task.id) return;
    var made=[];
    for(var i=0;i<rest.length;i++){
      var key=task.id+'#'+(i+2);
      placed.push({key:key,task:task,cell:rest[i].cell,usage:rest[i].usage,
        part:i+2,parts:rest.length+1,booked:false,manual:false});
      made.push(key);
    }
    flying=null; fresh=made;
    render();
    later(autoStep,GAP_MS);
  }
  if(!root||!cardEl||!chipEl||reduce||typeof chipEl.animate!=='function'){
    later(commit,reduce?0:120);
    return;
  }
  try{
    var rb=root.getBoundingClientRect(), a=cardEl.getBoundingClientRect(), b=chipEl.getBoundingClientRect();
    var fl=h('div',{'class':'sr-tile sr-card sr-flier'});
    fl.style.left=(a.left-rb.left)+'px'; fl.style.top=(a.top-rb.top)+'px';
    fl.style.width=a.width+'px'; fl.style.height=a.height+'px';
    fl.appendChild(buildTileInner(task,1,1,taskUsage(task),false));
    root.appendChild(fl);
    var anim=fl.animate([
      {left:(a.left-rb.left)+'px',top:(a.top-rb.top)+'px'},
      {left:(b.left-rb.left)+'px',top:(b.top-rb.top)+'px'}
    ],{duration:FLY_MS,easing:'cubic-bezier(0.32, 0.72, 0.24, 1)',fill:'forwards'});
    var done=false;
    function fin(){if(done) return;done=true;try{fl.remove();}catch(e){} commit();}
    anim.onfinish=fin;
    later(fin,FLY_MS+400);
  }catch(e){later(commit,120);}
}
function resetWeek(){
  clearTimers(); flying=null; fresh=[]; skipped=[]; carry=null; openDlg=null;
  paused=false; placed=initialBooked();
  render();
}

/* ============ drag & drop / keyboard move ============ */
function fitsAt(target,payload,exceptKey){
  if(target<NOWIDX) return null;
  if(payload.kind==='card'){
    var c=chipByKey(payload.key);
    if(!c||target===payload.from) return null;
    var tmp={usage:c.usage};
    return fit(tmp,target,occupancy(payload.key),'drop',NOWIDX);
  }
  var t=taskById(payload.id);
  if(!t) return null;
  return fit(t,target,occupancy(exceptKey||null),'drop',NOWIDX);
}
function mergeTask(taskId){
  var mine=placed.filter(function(p){return p.task.id===taskId;});
  var byCell={};
  for(var i=0;i<mine.length;i++){
    var p=mine[i];
    if(byCell[p.cell]) byCell[p.cell].usage+=p.usage;
    else byCell[p.cell]={cell:p.cell,usage:p.usage,booked:p.booked};
  }
  var cells=Object.keys(byCell).map(Number).sort(function(a,b){return a-b;});
  var made=cells.map(function(c,idx){
    return {key:taskId+'@'+c,task:taskById(taskId),cell:c,usage:byCell[c].usage,
      part:idx+1,parts:cells.length,booked:byCell[c].booked,manual:true};
  });
  placed=placed.filter(function(p){return p.task.id!==taskId;}).concat(made);
  return made;
}
function performDrop(target,payload){
  var res=fitsAt(target,payload);
  if(!res) return false;
  if(payload.kind==='card'){
    var c=chipByKey(payload.key);
    if(!c) return false;
    placed=placed.filter(function(p){return p.key!==payload.key;});
    for(var i=0;i<res.length;i++){
      placed.push({key:payload.key+'~'+i,task:c.task,cell:res[i].cell,usage:res[i].usage,
        part:1,parts:1,booked:false,manual:true});
    }
    mergeTask(c.task.id);
    announce('Moved to '+cellName(target));
  }else{
    var t=taskById(payload.id);
    if(!t||chipByKey(payload.id+'#1')) return false;
    placed=placed.filter(function(p){return p.task.id!==t.id;});
    for(var j=0;j<res.length;j++){
      placed.push({key:t.id+'#'+(j+1),task:t,cell:res[j].cell,usage:res[j].usage,
        part:j+1,parts:res.length,booked:false,manual:true});
    }
    mergeTask(t.id);
    announce('Booked '+t.title+' in '+cellName(target));
  }
  fresh=placed.filter(function(p){return true;}).slice(-res.length).map(function(p){return p.key;});
  openDlg=null;
  render();
  return true;
}
function whyLabel(idx,payload){
  var sum=0,n=0,i;
  for(i=0;i<placed.length;i++){
    if(payload&&payload.kind==='card'&&placed[i].key===payload.key) continue;
    if(placed[i].cell===idx){sum+=placed[i].usage;n++;}
  }
  var free=Math.max(0,100-pctNum(sum));
  if(idx<NOWIDX) return 'Over';
  if(n>=MAXPER||free<1) return 'Full';
  return 'Only '+pct(free)+' left';
  function pctNum(s){return Math.min(100,s/LIMIT*100);}
}

/* ============ tile content ============ */
function shareOf(usage){return pct(Math.max(1,usage)/LIMIT*100);}
function buildTileInner(task,part,parts,usage,isTray){
  var frag=document.createDocumentFragment();
  var top=h('span',{'class':'sr-tile-top'});
  top.appendChild(pixelmark(task.agent));
  var title=h('span',{'class':'sr-tile-title',title:task.title});
  title.textContent=task.title;
  top.appendChild(title);
  if(parts>1) top.appendChild(h('span',{'class':'sr-tile-part',text:part+'/'+parts}));
  frag.appendChild(top);
  var nope=isTray&&skipped.indexOf(task.id)>=0;
  var meta=h('span',{'class':'sr-tile-meta'});
  if(nope){
    meta.setAttribute('data-nope','');
    meta.textContent=Number.isFinite(task.usage)?'No room this week':'No usage set \u2013 can\u2019t schedule';
  }else{
    meta.textContent=[task.agent,task.detail].filter(Boolean).join(' \u00B7 ');
  }
  frag.appendChild(meta);
  var stats=h('span',{'class':'sr-tile-stats'});
  var list=(task.stats||[]).slice(0,2);
  for(var i=0;i<list.length;i++){
    var s=h('span',{'class':'sr-stat','aria-label':list[i].value+' '+list[i].label});
    s.appendChild(svgIcon(list[i].icon));
    var v=h('span',{}); v.textContent=compact(list[i].value); s.appendChild(v);
    stats.appendChild(s);
  }
  stats.appendChild(h('span',{'class':'sr-tag',text:isTray?shareOf(taskUsage(task)):pct(usage/LIMIT*100)}));
  frag.appendChild(stats);
  return frag;
}

  shead.appendChild(h('span',{'class':'sr-count',id:'sr-tray-count',text:String(tray.length)}));

function themeButton(){

  s.setAttribute('stroke-width','1.8'); s.setAttribute('stroke-linecap','round');
  var p=document.createElementNS(NS,'path');
  if(cur==='dark'){
    p.setAttribute('d','M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4');
  }else{
    p.setAttribute('d','M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5Z');
  }
  s.appendChild(p); b.appendChild(s);
  b.addEventListener('click',function(){
    var next=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    announce(next==='dark'?'Dark theme on':'Light theme on');
    render();
  });
  return b;
}
function buildDialog(sr,dlg){
  var task,chip=null,past=false,sessionTxt='Not scheduled yet';
  if(dlg.kind==='card'){
    chip=chipByKey(dlg.key); if(!chip) return;
    task=chip.task; past=chip.cell<NOWIDX;
    sessionTxt=cellName(chip.cell);
  }else{
    task=taskById(dlg.id); if(!task) return;
    if(skipped.indexOf(task.id)>=0) sessionTxt='No session has room for it this week';
  }
  var info=h('div',{'class':'sr-info',role:'dialog','aria-label':task.title});
  var anchor=(dlg.kind==='card'?refs.chips[dlg.key]:refs.cards[dlg.id]);
  var left=8,top=8;
  if(anchor&&rootEl){
    try{
      var rb=rootEl.getBoundingClientRect(), r=anchor.getBoundingClientRect();
      /* clamp inside the component AND inside the viewport: the dialog's
         viewport top is rb.top + top, so top must stay >= 8 - rb.top to keep
         the title row fully below the viewport top even when scrolled */
      var maxLeft=Math.max(8,rb.width-FLY_W-16);
      left=Math.max(8,Math.min(r.left-rb.left,maxLeft));
      var minTop=Math.max(8,8-rb.top);
      top=Math.max(minTop,r.bottom-rb.top+6);
    }catch(e){}
  }
  info.style.left=left+'px'; info.style.top=top+'px'; info.style.width=FLY_W+'px';
  var head=h('div',{'class':'sr-info-head'});
  head.appendChild(pixelmark(task.agent));
  head.appendChild(h('span',{'class':'sr-info-title',text:task.title}));
  info.appendChild(head);
  if(task.detail) info.appendChild(h('p',{'class':'sr-info-text',text:task.detail}));
  var rows=h('dl',{'class':'sr-info-rows'});
  if(task.agent){
    rows.appendChild(h('dt',{text:'Agent'}));
    rows.appendChild(h('dd',{text:task.agent}));
  }
  rows.appendChild(h('dt',{text:'Session'}));
  rows.appendChild(h('dd',{text:sessionTxt}));
  var stats=(task.stats||[]).slice(0,2),i;
  for(i=0;i<stats.length;i++){
    rows.appendChild(h('dt',{text:cap(stats[i].label)}));
    rows.appendChild(h('dd',{text:String(stats[i].value)}));
  }
  rows.appendChild(h('dt',{text:'Needs'}));
  var needs;
  if(chip&&chip.parts>1) needs='Part '+chip.part+' of '+chip.parts+' \u00B7 '+pct(chip.usage/LIMIT*100)+' of the session';
  else if(chip) needs=pct(chip.usage/LIMIT*100)+' of the session';
  else{
    var u=taskUsage(task)/LIMIT;
    needs=u>1?(pct(u*100)+' \u00B7 split over '+Math.ceil(u)+' sessions'):(pct(u*100)+' of a session');
  }
  rows.appendChild(h('dd',{text:needs}));
  info.appendChild(rows);
  var hint=past?'This session is over':
    chip?'Drag it to another session to move it':
    (skipped.indexOf(task.id)>=0?'No session has room for it this week':'Drag it into a session to book it');
  info.appendChild(h('p',{'class':'sr-info-hint',text:hint}));
  sr.appendChild(info);
}
/* tile press/drag wiring: pointerdown starts a potential drag; a tap toggles
   the details popover (real clicks are never prevented) */
function wireTile(el,payload,movable,task){
  el.addEventListener('pointerdown',function(e){
    if(e.button!==0&&e.pointerType==='mouse') return;
    press={payload:payload,movable:movable,x:e.clientX||0,y:e.clientY||0,el:el,moved:false};
  });
  el.addEventListener('click',function(){
    if(suppressTap){suppressTap=false;press=null;return;}
    if(press&&press.moved){press=null;return;}
    press=null;
    toggleDialog(payload);
  });
  el.addEventListener('keydown',function(e){
    if(carry){return;}
    if(e.key==='Enter'){e.preventDefault();toggleDialog(payload);}
    else if(e.key===' '&&movable){e.preventDefault();pickUp(payload,el);}
  });
}
function toggleDialog(payload){
  if(openDlg&&samePayload(openDlg,payload)){openDlg=null;render();return;}
  openDlg=Object.assign({},payload);
  announce(taskTitle(payload)+' \u2013 details open');
  render();
}
function samePayload(a,b){
  if(a.kind!==b.kind) return false;
  return a.kind==='card'?a.key===b.key:a.id===b.id;
}
function taskTitle(payload){
  if(payload.kind==='card'){var c=chipByKey(payload.key);return c?c.task.title:'the task';}
  var t=taskById(payload.id);return t?t.title:'the task';
}
function pickUp(payload,el){
  paused=true;
  if(mode==='auto'){/* stay in auto visuals but pause engine until dropped */}
  carry=Object.assign({fromEl:el},payload);
  var at=(payload.kind==='card'?payload.from:Math.max(0,NOWIDX));
  carry.at=at; hoverCell=at;
  announce('Picked up '+taskTitle(payload)+'. Arrow keys choose a session, Space drops it, Escape cancels. '+cellName(at)+'.');
  render();
}
function dropCarry(){
  if(!carry) return;
  var p=carry;
  if(fitsAt(p.at,p,p.kind==='card'?p.key:null)!==null){
    carry=null; hoverCell=null;
    performDrop(p.at,p);
  }else{
    announce('Can\u2019t drop here \u2013 '+whyLabel(p.at,p));
  }
}
function cancelCarry(){
  if(!carry) return;
  carry=null; hoverCell=null;
  announce('Cancelled \u2013 it\u2019s back where it was');
  render();
}
function setMode(m){
  if(m===mode) return;
  mode=m;
  if(m==='auto'){
    paused=false;
    render();
    if(trayTasks().length>0){announce('Auto scheduling');autoStep();}
  }else{
    paused=true; clearTimers(); flying=null; carry=null; hoverCell=null;
    placed=placed.filter(function(p){return p.booked||p.manual;});
    announce('Manual scheduling');
    render();
  }
}
/* document-level pointer routing: move threshold starts a ghost drag;
   hover only flips cell classes directly (never a full re-render) */
function paintHover(){
  if(!rootEl) return;
  var cells=rootEl.querySelectorAll?rootEl.querySelectorAll('.sr-cell'):[];
  for(var i=0;i<cells.length;i++){
    var el=cells[i],idx=Number(el.getAttribute('data-cell'));
    if(hoverCell===idx) el.setAttribute('data-over','');
    else el.removeAttribute('data-over');
  }
}
function clearGhost(){
  if(dragGhost){try{dragGhost.remove();}catch(e){} dragGhost=null;}
  if(rootEl) rootEl.removeAttribute('data-dragging');
}
function boot(){
  var app=document.getElementById('app');
  if(!app) return;
  rootEl=h('div',{id:'sr-root'});
  app.appendChild(rootEl);
  /* theme default follows the OS, toggle overrides */
  try{
    if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){
      document.documentElement.setAttribute('data-theme','dark');
    }
  }catch(e){}
  placed=initialBooked();
  render();
  /* global pointer handlers (capture for the popover closer so taps survive) */
  document.addEventListener('pointerdown',function(e){
    if(openDlg&&e.target&&e.target.closest&&!e.target.closest('.sr-info')&&!e.target.closest('.sr-tile')){
      openDlg=null; render();
    }
  },true);
  document.addEventListener('pointermove',function(e){
    if(!press||press.moved) {
      if(press&&press.moved&&dragGhost){
        var x=(e.clientX||0),y=(e.clientY||0);
        dragGhost.style.transform='translate('+(x-press.ox)+'px,'+(y-press.oy)+'px) rotate(-1.5deg)';
        var under=document.elementFromPoint?document.elementFromPoint(x,y):null;
        var cellEl=under&&under.closest?under.closest('[data-cell]'):null;
        var idx=cellEl?Number(cellEl.getAttribute('data-cell')):null;
        if(idx!==hoverCell){hoverCell=idx;paintHover();}
      }
      return;
    }
    if(!press.movable) return;
    var dx=(e.clientX||0)-press.x,dy=(e.clientY||0)-press.y;
    if(Math.hypot(dx,dy)<4) return;
    press.moved=true; paused=true;
    var ghost=h('div',{'class':'sr-tile sr-card sr-ghost'});
    ghost.appendChild(buildTileInner(taskTitleTask(press.payload),1,1,taskUsage(taskTitleTask(press.payload)),press.payload.kind==='task'));
    try{
      var r=press.el.getBoundingClientRect();
      ghost.style.width=r.width+'px';
      press.ox=(e.clientX||0)-r.left; press.oy=(e.clientY||0)-r.top;
      ghost.style.transform='translate('+((e.clientX||0)-press.ox)+'px,'+((e.clientY||0)-press.oy)+'px)';
    }catch(err){}
    rootEl.appendChild(ghost); dragGhost=ghost;
    dragGhost.payload=press.payload;
    rootEl.setAttribute('data-dragging','');
    openDlg=null;
    render();
    /* re-append ghost above the rebuilt tree */
    if(dragGhost){try{rootEl.appendChild(dragGhost);}catch(err2){}}
  });
  document.addEventListener('pointerup',function(e){
    if(press&&press.moved){
      var p=press.payload,at=hoverCell;
      press=null;
      clearGhost();
      suppressTap=true;
      if(at!==null&&at!==undefined&&fitsAt(at,p,p.kind==='card'?p.key:null)!==null){
        hoverCell=null; performDrop(at,p);
      }else{hoverCell=null;render();}
    }
  });
  document.addEventListener('pointercancel',function(){
    if(press&&press.moved){press=null;clearGhost();hoverCell=null;render();}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if(openDlg){openDlg=null;render();}
      if(carry){cancelCarry();return;}
    }
    if(!carry) return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='ArrowUp'){
      var d=e.key==='ArrowRight'?NX:e.key==='ArrowLeft'?-NX:e.key==='ArrowDown'?1:-1;
      var n=carry.at+d;
      if(n>=0&&n<NCELL){
        carry.at=n;hoverCell=n;paintHover();
        var ok=fitsAt(n,carry,carry.kind==='card'?carry.key:null)!==null;
        announce(cellName(n)+' \u2013 '+(ok?'room to drop it':'can\u2019t drop, '+whyLabel(n,carry)));
      }
      e.preventDefault();e.stopPropagation();
    }else if(e.key===' '||e.key==='Enter'){e.preventDefault();e.stopPropagation();dropCarry();}
  },true);
  rootEl.addEventListener('pointerenter',function(){hoveredRoot=true;});
  rootEl.addEventListener('pointerleave',function(){hoveredRoot=false;});
  /* auto-run + loop, like the original demo */
  later(function(){autoStep();},START_MS);
}
function taskTitleTask(payload){
  if(payload.kind==='card'){var c=chipByKey(payload.key);return c?c.task:taskById(payload.id);}
  return taskById(payload.id);
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
}else{boot();}
})();
</script>
