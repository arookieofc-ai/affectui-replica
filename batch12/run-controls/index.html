<title>Run Controls — Trip planner</title>
<style>
/* ---- design tokens ---- */
:root, :root[data-theme="light"]{
  --surface:#ffffff;
  --page:#fafaf9;
  --ink:#171717;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --border-strong:#d6d3d1;
  --radius-lg:16px;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --shadow-pop:0 0 0 1px rgba(0,0,0,.06), 0 18px 40px -12px rgba(0,0,0,.18), 0 4px 12px -4px rgba(0,0,0,.06);
  --accent:#0284c7;
  --accent-soft:rgba(2,132,199,.12);
  --warn:#f59e0b; --warn-bg:#fef3c7; --warn-ink:#92400e;
  --fail:#dc2626; --fail-soft:rgba(220,38,38,.10);
  --ok:#16a34a;
  --mark:rgba(2,132,199,.78);
  --focus:rgba(2,132,199,.7);
  --wash:rgba(23,23,23,.06);
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-theme="dark"]{
  --surface:#1c1c1f;
  --page:#101012;
  --ink:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --border-strong:#3f3f46;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
  --shadow-pop:0 0 0 1px rgba(255,255,255,.07), 0 18px 40px -12px rgba(0,0,0,.7);
  --accent:#38bdf8;
  --accent-soft:rgba(56,189,248,.16);
  --warn:#fbbf24; --warn-bg:#451a03; --warn-ink:#fde68a;
  --fail:#f87171; --fail-soft:rgba(248,113,113,.14);
  --ok:#4ade80;
  --mark:rgba(56,189,248,.85);
  --focus:rgba(56,189,248,.8);
  --wash:rgba(255,255,255,.07);
}
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  color:var(--ink);
  font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:14px; line-height:20px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 16px 48px;
}
/* ---- page header: project + working count + agent count + toggle ---- */
.page{width:100%; max-width:640px}
.page-head{
  display:flex; align-items:center; gap:10px;
  margin:0 2px 14px;
}
.page-head h1{
  margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.count{
  flex:none; font-size:12px; line-height:20px; color:var(--muted);
  background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:1px 10px; white-space:nowrap;
}
.count[data-live="true"]{color:var(--accent); border-color:var(--accent)}
.spacer{flex:1}
.theme-btn{
  flex:none; display:inline-grid; place-items:center;
  width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);
  cursor:pointer; transition:background-color 150ms ease, transform 150ms ease;
}
.theme-btn:hover{background:var(--wash)}
.theme-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.theme-btn svg{display:block}
/* ---- run-controls card ---- */
.rcl{
  display:flex; flex-direction:column; gap:4px;
  background:var(--subtle);
  border:1px solid var(--border);
  border-radius:calc(var(--radius-lg) + 4px);
  padding:4px; width:100%; min-width:0;
  box-shadow:var(--shadow);
}
.rcl p, .rcl ul{margin:0; padding:0; list-style:none}
.rcl button{margin:0; padding:0; border:0; background:none; font:inherit; color:inherit; cursor:pointer}
.rcl button:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.rcl .menu button:focus-visible{outline-offset:-2px}
/* log */
.log{
  position:relative; height:252px; overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:none; padding:16px 16px 8px;
  border-radius:var(--radius-lg); background:var(--surface);
  box-shadow:var(--shadow); outline:none;
}
.log::-webkit-scrollbar{display:none}
.log:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.turn{display:flex; flex-direction:column; min-height:100%; animation:rise 420ms var(--ease) both}
.you{
  align-self:flex-end; max-width:82%; padding:8px 13px;
  border-radius:16px; border-end-end-radius:5px; background:var(--subtle);
  overflow-wrap:anywhere; white-space:pre-wrap;
}
.agent-row{display:flex; align-items:center; gap:8px; height:20px; margin-top:14px; font-size:12.5px; line-height:16px}
.agent-name{min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; color:var(--ink)}
.state-label{flex:none; color:var(--muted)}
.state-label[data-tone="alert"]{color:var(--fail)}
.answer{flex:1; margin-top:6px; padding-inline-start:24px; overflow-wrap:anywhere; white-space:pre-wrap; color:var(--ink)}
.steer-pill{
  display:inline-flex; align-items:center; gap:4px; max-width:100%;
  margin:0 4px; padding:0 8px 0 6px; border-radius:999px;
  background:var(--accent-soft); font-size:12.5px; line-height:20px; color:var(--accent);
  vertical-align:1px; white-space:nowrap; animation:drop 560ms var(--ease) both;
}
.steer-pill > span{overflow:hidden; text-overflow:ellipsis}
.caret{display:inline-block; width:7px; height:14px; margin-left:2px; border-radius:2px; background:var(--ink); vertical-align:-2px; animation:blink 1s ease-in-out infinite}
.cut{display:inline-block; width:2px; height:14px; margin-left:3px; border-radius:1px; background:var(--border-strong); vertical-align:-2px}
.cut[data-tone="alert"]{background:var(--fail)}
.dots{display:inline-flex; gap:4px; padding-top:6px}
.dots > i{width:5px; height:5px; border-radius:50%; background:var(--border-strong); animation:dot 1.2s ease-in-out infinite}
.dots > i:nth-child(2){animation-delay:.15s}
.dots > i:nth-child(3){animation-delay:.3s}
.after{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  min-height:28px; margin-top:10px; padding-inline-start:24px; padding-bottom:4px;
}
.note{
  min-width:0; overflow:hidden; font-size:12px; line-height:16px; color:var(--muted);
  white-space:nowrap; text-overflow:ellipsis; animation:fade 240ms ease both;
}
.note kbd{
  display:inline-block; min-width:20px; margin-inline-end:2px; padding:0 4px;
  border-radius:4px; background:var(--subtle); box-shadow:inset 0 0 0 .5px var(--border-strong);
  font:inherit; font-size:11px; text-align:center;
}
.acts{display:flex; flex:none; gap:2px; animation:fade 240ms ease both}
.act{
  display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px 0 9px;
  border-radius:999px; font-size:13px; font-weight:500; color:var(--muted);
  transition:background-color 160ms ease, color 160ms ease;
}
.act:hover{background:var(--wash); color:var(--ink)}
.act[data-main]{background:var(--ink); color:var(--surface)}
.act[data-main]:hover{opacity:.88; color:var(--surface)}
.empty{ display:grid; place-items:center; align-content:center; gap:10px; height:100%; padding:0 24px; text-align:center; color:var(--muted)}
/* composer */
.composer{padding:0}
.queue{display:grid; grid-template-columns:minmax(0,1fr); max-height:128px; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; padding:2px 6px 4px}
.queue::-webkit-scrollbar{display:none}
.queue[data-more]{-webkit-mask:linear-gradient(#000 calc(100% - 16px), transparent); mask:linear-gradient(#000 calc(100% - 16px), transparent)}
.queued{display:flex; align-items:center; gap:8px; height:30px; padding:0 2px 0 8px; font-size:12.5px; color:var(--muted); animation:rise 360ms var(--ease) both}
.queued-text{flex:1; min-width:0; overflow:hidden; color:var(--ink); white-space:nowrap; text-overflow:ellipsis}
.queued-n{flex:none; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.icon-btn{display:grid; flex:none; place-items:center; width:24px; height:24px; border-radius:6px; color:var(--muted); transition:background-color 160ms ease, color 160ms ease}
.icon-btn:hover{background:var(--wash); color:var(--ink)}
.write{padding:12px 10px 10px; border-radius:var(--radius-lg); background:var(--surface); box-shadow:var(--shadow); cursor:text; transition:box-shadow 160ms ease}
.write:focus-within{box-shadow:0 0 0 1px var(--border-strong), 0 1px 2px rgba(0,0,0,.04)}
.field{display:block; width:100%; height:40px; margin:0; padding:0 4px; border:0; outline:0; background:transparent; font:inherit; color:var(--ink); resize:none; scrollbar-width:none; caret-color:var(--accent)}
.field::placeholder{color:var(--muted); opacity:.75}
.tools{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px}
.tool-left, .tool-right{display:flex; align-items:center; gap:6px; min-width:0}
.tool-right{flex:none}
.mode{display:flex; flex:none; padding:2px; border-radius:var(--radius-sm); background:var(--subtle); box-shadow:inset 0 0 0 1px var(--border)}
.mode > button{height:24px; padding:0 10px; border-radius:calc(var(--radius-sm) - 2px); font-size:13px; font-weight:500; color:var(--muted); transition:background-color 180ms ease, color 180ms ease, box-shadow 180ms ease}
.mode > button[aria-checked="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.perm-wrap{position:relative; min-width:0}
.perm{
  display:inline-flex; align-items:center; gap:6px; max-width:100%; height:28px; padding:0 8px;
  border-radius:var(--radius-sm); font-size:12.5px; color:var(--muted); white-space:nowrap;
  transition:background-color 160ms ease, color 160ms ease, opacity 160ms ease;
}
.perm-label{overflow:hidden; text-overflow:ellipsis}
.perm:hover:not(:disabled), .perm[aria-expanded="true"]{background:var(--wash); color:var(--ink)}
.perm[data-tone="alert"]{color:var(--fail)}
.perm[data-tone="alert"]:hover:not(:disabled){background:var(--fail-soft)}
.perm:disabled{opacity:.45; cursor:default}
.menu{
  position:absolute; bottom:calc(100% + 6px); inset-inline-start:0; z-index:5;
  display:grid; width:272px; padding:5px; border-radius:var(--radius-lg);
  background:var(--surface); box-shadow:var(--shadow-pop);
  transform-origin:bottom left; animation:menupop 180ms var(--ease) both;
}
.item{display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:calc(var(--radius-lg) - 5px); text-align:start; transition:background-color 120ms ease}
.item:hover, .item:focus-visible{background:var(--wash)}
.item-icon{display:grid; place-items:center; width:16px; color:var(--muted)}
.item[data-tone="alert"] .item-icon{color:var(--fail)}
.item-text{display:grid; flex:1; min-width:0}
.item-text > span:first-child{font-size:13px; color:var(--ink)}
.item-text > span:last-child{font-size:12px; line-height:16px; color:var(--muted)}
.item-check{display:grid; place-items:center; width:16px; color:var(--ink)}
.ctx{display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 6px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.ctx-track{fill:none; stroke:var(--border); stroke-width:2}
.ctx-fill{fill:none; stroke:var(--muted); stroke-width:2; stroke-linecap:round; transition:stroke-dasharray 400ms var(--ease), stroke 200ms ease}
.ctx[data-high]{color:var(--warn)}
.ctx[data-high] .ctx-fill{stroke:var(--warn)}
.round{
  display:grid; flex:none; place-items:center; width:30px; height:30px; border-radius:50%;
  background:var(--ink); color:var(--surface);
  transition:opacity 160ms ease, transform 160ms var(--ease); animation:pop 260ms var(--ease) both;
}
.round:active:not(:disabled){transform:scale(.92)}
.round:disabled{background:var(--wash); color:var(--muted); cursor:default}
.btn{
  display:inline-flex; flex:none; align-items:center; gap:5px; height:30px; padding:0 12px 0 10px;
  border-radius:999px; font-size:13px; font-weight:500; color:var(--muted);
  transition:background-color 160ms ease, color 160ms ease; animation:pop 260ms var(--ease) both;
}
.btn:hover{background:var(--wash); color:var(--ink)}
.btn[data-solid]{background:var(--ink); color:var(--surface)}
.btn[data-solid]:hover{opacity:.88; color:var(--surface)}
/* 3x3 pixel-mark: EXACTLY 9 cells */
.pmark{display:grid; flex:none; grid-template-columns:repeat(3,3px); grid-auto-rows:3px; gap:1.5px; place-content:center; width:16px; height:16px}
.pmark > i{border-radius:.75px; background:var(--mark); opacity:0; transition:opacity 240ms ease}
.pmark > i[data-on]{opacity:1}
.pmark[data-busy] > i{animation:pixel 1.2s ease-in-out infinite both}
.pmark[data-busy] > i:not([data-on]){opacity:.16}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.page-foot{margin:14px 2px 0; font-size:12px; color:var(--muted)}
@keyframes pixel{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes dot{0%,100%{opacity:.3; transform:translateY(0)}50%{opacity:1; transform:translateY(-2px)}}
@keyframes drop{from{opacity:0; transform:translateY(-10px) scale(.92)}}
@keyframes rise{from{opacity:0; transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0; transform:scale(.9)}}
@keyframes menupop{from{opacity:0; transform:translateY(4px) scale(.97)}}
@media (max-width:480px){
  .perm-label{display:none}
  .log{height:280px; padding:14px 12px 8px}
  .answer, .after{padding-inline-start:0}
  .after{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  .rcl *, .rcl *::before, .rcl *::after{animation:none !important; transition:none !important}
}
</style>

<body>
<div class="page">
  <header class="page-head">
    <h1>Trip planner</h1>
    <span class="count" id="workingCount" data-live="true">1 working</span>
    <span class="count">1 agent</span>
    <span class="spacer"></span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme" title="Toggle theme"></button>
  </header>

  <main>
    <section class="rcl" id="rcl" data-status="running" aria-label="Trip planner run">
      <div class="log" id="log" tabindex="0" role="region" aria-label="Conversation"></div>
      <div class="composer">
        <ul class="queue" id="queue" aria-label="Queued messages" hidden></ul>
        <div class="write" id="write">
          <textarea class="field" id="field" rows="2" aria-label="Message" aria-describedby="keysHint"></textarea>
          <span class="sr" id="keysHint"></span>
          <div class="tools">
            <div class="tool-left">
              <div class="mode" id="mode" role="radiogroup" aria-label="Mode"></div>
              <div class="perm-wrap">
                <button class="perm" id="permBtn" type="button" aria-haspopup="menu" aria-expanded="false"></button>
                <div class="menu" id="menu" role="menu" aria-label="What the agent may do" hidden></div>
              </div>
            </div>
            <div class="tool-right">
              <span class="ctx" id="ctx"></span>
              <span id="actions" style="display:inline-flex;align-items:center;gap:2px"></span>
            </div>
          </div>
        </div>
      </div>
      <p class="sr" role="status" aria-live="polite" id="live"></p>
    </section>
  </main>
  <p class="page-foot">Enter sends · Shift+Enter adds a line · while running, Enter steers and ⌥ Enter queues · Esc stops.</p>
</div>

/* ============ run engine (timings match the demo) ============ */
function clearTimers() {

}

}

    return;

  accumulated += tok;
  state.answer = accumulated;
  appendTokenFast(tok);
  syncLogHead();
  renderCtx(); // targeted context update only
  if (autoSteerArmed && sourceKind === "S" && accumulated.length > 100 && accumulated.slice(-2) === "\n\n") {

menuEl.addEventListener("keydown", function (e) {
  var items = Array.prototype.slice.call(menuEl.querySelectorAll('[role="menuitemradio"]'));
  var i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    var n = (i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
    if (items[n]) items[n].focus();
  } else if (e.key === "Home" || e.key === "End") {
    e.preventDefault();
    var t = items[e.key === "Home" ? 0 : items.length - 1];
    if (t) t.focus();
  } else if (e.key === "Escape" || e.key === "Tab") {
    if (e.key === "Escape") e.preventDefault();
    e.stopPropagation();
    setMenu(false);
    if (e.key === "Escape") permBtn.focus();
  }
});
modeEl.addEventListener("keydown", function (e) {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].indexOf(e.key) === -1) return;
  e.preventDefault();
  var next = state.mode === "chat" ? "act" : "chat";
  setMode(next);
  var btn = modeEl.querySelector('[data-mode="' + next + '"]');
  if (btn) btn.focus();
});
var logStuck = true;
logEl.addEventListener("scroll", function () {
  logStuck = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 24;
});

/* ============ theme toggle ============ */
var themeBtn = $("themeBtn");
function paintThemeBtn() {
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  themeBtn.innerHTML = dark ? IC.sun() : IC.moon();
  themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}
themeBtn.addEventListener("click", function () {
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("rcl-theme", next); } catch (e) {}
  paintThemeBtn();
});
(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem("rcl-theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") {
    document.documentElement.setAttribute("data-theme", saved);
  } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.setAttribute("data-theme", "dark");
  } else {
    document.documentElement.setAttribute("data-theme", "light"); // original demo appearance
  }
  paintThemeBtn();
})();

/* ============ boot ============ */
renderAll();
if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  // instant path, mirrors the demo: first paragraph + scripted steer + three-day rewrite
  clearTimers();
  var cut = ANSWER_S.indexOf("\n\n") + 2;
  var head = ANSWER_S.slice(0, cut);
  state.steers = [{ at: head.length, text: STEER_C }];
  state.answer = head + ANSWER_W;
  accumulated = state.answer;
  state.status = "done";
  renderAll();
  scheduleQueueAdvance();
} else {
  scheduleTick(true);
}
</script>
