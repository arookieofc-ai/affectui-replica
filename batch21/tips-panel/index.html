<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tips Panel — affectUI replica</title>
<script>/*noflash*/(function(){try{var k='tips-panel-theme';var s=null;try{s=localStorage.getItem(k)}catch(e){}var t=s;if(!t){try{t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}if(t!=='dark'){t='light'}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root{
  --page:#fafaf9;
  --surface:#ffffff;
  --ink:#171717;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --radius-lg:16px;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --ok:#4fb0fe;
  --focus:rgba(0,96,226,.7);
  --ease:cubic-bezier(.22,1,.36,1);
  /* component tokens (anchored to page tokens, values match original demo) */
  --tp-tray:#f0f0f0;
  --tp-card:#ffffff;
  --tp-line:#ececec;
  --tp-ink:#171717;
  --tp-muted:#737373;
  --tp-ok:#4fb0fe;
  --tp-focus:rgba(0,96,226,.7);
}
html[data-theme="dark"]{
  --page:#101012;
  --surface:#1c1c1f;
  --ink:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --ok:#4fb0fe;
  --focus:rgba(77,141,255,.8);
  --tp-tray:#161618;
  --tp-card:#232326;
  --tp-line:rgba(255,255,255,.08);
  --tp-ink:#ededed;
  --tp-muted:#8f8f8f;
  --tp-ok:#4fb0fe;
  --tp-focus:rgba(77,141,255,.8);
}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.45;
  background:var(--page);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:820px;margin:0 auto;padding:28px 20px 56px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.topbar p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.theme-btn{
  flex:none;
  display:inline-flex;align-items:center;gap:8px;
  min-height:32px;padding:5px 12px 5px 10px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--surface);
  box-shadow:var(--shadow);
  color:var(--ink);
  font:inherit;font-size:13px;font-weight:500;
  cursor:pointer;
}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-btn svg{flex:none}
/* ---------- Tips Panel (clean-room replica of ui-tp) ---------- */
.tp{
  box-sizing:border-box;
  width:100%;
  max-width:760px;
  margin:0 auto;
  background:var(--tp-tray);
  padding:6px;
  border-radius:calc(var(--radius-lg) + 6px);
  color:var(--tp-ink);
  transition:opacity 260ms ease,transform 260ms ease;
}
.tp[data-closing]{
  opacity:0;
  transform:scale(.985) translateY(4px);
  pointer-events:none;
}
/* container for responsive grid (container queries where supported, media fallback below) */
.tp__head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 20px 12px}
.tp__title{min-width:0;margin:0;font-size:16px;font-weight:600;line-height:22px;letter-spacing:-.01em;overflow-wrap:anywhere}
.tp__count{flex:none;font-size:13px;color:var(--tp-muted);font-variant-numeric:tabular-nums}
.tp__card{
  container-type:inline-size;
  max-height:420px;
  overflow-y:auto;
  scrollbar-width:thin;
  background:var(--tp-card);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:0 1px 2px rgba(0,0,0,.06);
  color-scheme:light;
}
html[data-theme="dark"] .tp__card{box-shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
.tp__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:14px;list-style:none}
.tp__tip{
  display:flex;flex-direction:column;align-items:flex-start;
  padding:16px 16px 14px;
  border:1px solid var(--tp-line);
  border-radius:calc(var(--radius-lg) - 2px);
  background:transparent;
  animation:tp-in 480ms var(--ease) both;
  transition:background-color 260ms ease,border-color 260ms ease;
}
.tp__tip[data-done]{background:var(--subtle)}
.tp__tip-title{max-width:100%;margin:0;overflow-wrap:anywhere;text-align:start;font-size:14px;font-weight:500;line-height:20px}
.tp__tip-text{flex:1;max-width:100%;overflow-wrap:anywhere;white-space:pre-line;text-align:start;margin:6px 0 14px;font-size:13px;line-height:20px;color:var(--tp-muted)}
.tp__kbd{
  display:inline-grid;place-items:center;
  min-width:20px;height:20px;padding:0 5px;
  border-radius:calc(var(--radius-sm) - 1px);
  background:var(--tp-card);
  box-shadow:0 0 0 1px var(--border),0 1px 0 var(--border);
  font-family:inherit;font-size:11px;font-weight:500;line-height:1;
  color:var(--tp-ink);vertical-align:1px;white-space:nowrap;
}
.tp__btn{
  max-width:100%;min-height:30px;
  padding:5px 12px;
  border:0;border-radius:calc(var(--radius) - 1px);
  background:var(--tp-card);
  box-shadow:0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.04);
  font-size:13px;font-weight:500;line-height:20px;
  color:var(--tp-ink);text-align:start;overflow-wrap:anywhere;
  transition:background-color 160ms ease,transform 160ms ease;
  cursor:pointer;
}
.tp__btn:active{transform:scale(.98)}
.tp__btn:focus-visible{outline:2px solid var(--tp-focus);outline-offset:2px}
.tp__btn--primary{
  background:linear-gradient(#323137,#201e25);
  box-shadow:0 0 0 1px #0d0d0d,0 2px 4px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.12);
  color:#fff;
}
html[data-theme="dark"] .tp__btn{background:#2a2a2d;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.4)}
html[data-theme="dark"] .tp__btn--primary{
  background:linear-gradient(#f4f4f5,#e4e4e7);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 #fff;
  color:#121213;
}
.tp__done{
  display:inline-flex;align-items:center;gap:6px;
  max-width:100%;min-height:30px;overflow-wrap:anywhere;
  font-size:13px;font-weight:500;color:var(--tp-ok);
  animation:tp-pop 360ms var(--ease);
}
.tp__foot{padding:8px 10px 10px}
.tp:not(:has(.tp__foot)){padding-bottom:8px}
@keyframes tp-in{from{opacity:0;transform:translateY(4px)}}
@keyframes tp-pop{from{opacity:0;transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){
  .tp__tip,.tp__done{animation:none}
  .tp{transition:none}
}
/* responsive: container queries (modern) + media-query fallback */
@container (max-width:560px){.tp__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:380px){.tp__grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.tp__grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:430px){.tp__grid{grid-template-columns:minmax(0,1fr)}.tp__card{max-height:none}}
@media (hover:hover) and (pointer:fine){
  .theme-btn:hover{filter:brightness(.97)}
  .tp__btn:hover{background:#f7f7f7}
  .tp__btn--primary:hover{background:linear-gradient(#3b3a41,#26242b)}
  html[data-theme="dark"] .tp__btn:hover{background:#313135}
  html[data-theme="dark"] .tp__btn--primary:hover{background:linear-gradient(#ffffff,#ececef)}
}
.hint{max-width:760px;margin:14px auto 0;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div>
      <h1>Tips Panel</h1>
      <p>Grid of actionable short tips; completed tips switch to done state.</p>
    </div>
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Switch theme">
      <svg id="theme-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"></svg>
      <span id="theme-label">Dark</span>
    </button>
  </div>
  <div id="tips-root"></div>
  <p class="hint" id="hint">Click a tip action to mark it done. Close resets the demo.</p>
</div>
<script>
(function(){
  "use strict";
  var TIPS=[
    {id:"invite",title:"Invite your team",description:"Work on projects together and keep feedback in one place.",action:"Invite",doneLabel:"Invite sent"},
    {id:"search",title:"Quick search",descriptionPre:"Press ",descriptionKbd:"\u2318K",descriptionPost:" to jump to any page, project or setting.",action:"Try it",doneLabel:"Got it"},
    {id:"digest",title:"Weekly digest",description:"Get a short summary of what changed every Monday morning.",action:"Turn on",doneLabel:"Turned on"},
    {id:"slack",title:"Connect Slack",description:"Post an update to a channel when something needs your attention.",action:"Connect",doneLabel:"Connected"},
    {id:"mobile",title:"Mobile app",description:"Check activity and approve requests while you're on the go.",action:"Get the app",doneLabel:"Link sent"},
    {id:"pro",title:"Ready for Pro?",description:"Unlimited projects, priority support and advanced analytics.",action:"See plans",doneLabel:"Opened",primary:true},
    {id:"theme",title:"Dark mode",description:"Switch the theme or follow your system setting automatically.",action:"Switch",doneLabel:"Switched"},
    {id:"api",title:"API keys",description:"Automate your workflow and pull data into your own tools.",action:"Create key",doneLabel:"Key created"},
    {id:"export",title:"Export data",description:"Download every project as CSV whenever you need a copy.",action:"Export",doneLabel:"Export started"}
  ];
  var TITLE="Tips";
  var CLOSE_LABEL="Close";
  var fmt=null;
  try{fmt=new Intl.NumberFormat("en")}catch(e){fmt={format:function(n){return String(n)}}}

  /* theme toggle */
  var root=document.documentElement;
  var toggle=document.getElementById("theme-toggle");
  var themeLabel=document.getElementById("theme-label");
  var themeIcon=document.getElementById("theme-icon");
  function paintThemeIcon(theme){
    while(themeIcon.firstChild){themeIcon.removeChild(themeIcon.firstChild)}
    var ns="http://www.w3.org/2000/svg";
    var c=document.createElementNS(ns,"circle");
    c.setAttribute("cx","8");c.setAttribute("cy","8");c.setAttribute("r","6.2");
    c.setAttribute("fill","none");c.setAttribute("stroke","currentColor");c.setAttribute("stroke-width","1.5");
    themeIcon.appendChild(c);
    var p=document.createElementNS(ns,"path");
    if(theme==="dark"){p.setAttribute("d","M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4")}
    else{p.setAttribute("d","M11.5 9.5A4.5 4.5 0 0 1 6.5 4.5A4.5 4.5 0 1 0 11.5 9.5Z")}
    p.setAttribute("fill","none");p.setAttribute("stroke","currentColor");p.setAttribute("stroke-width","1.5");
    p.setAttribute("stroke-linecap","round");p.setAttribute("stroke-linejoin","round");
    themeIcon.appendChild(p);
  }
  function currentTheme(){return root.getAttribute("data-theme")==="dark"?"dark":"light"}
  function paintTheme(){
    var t=currentTheme();
    themeLabel.textContent=(t==="dark")?"Light":"Dark";
    toggle.setAttribute("aria-label",t==="dark"?"Switch to light theme":"Switch to dark theme");
    paintThemeIcon(t);
  }
  if(toggle){
    toggle.addEventListener("click",function(){
      var next=currentTheme()==="dark"?"light":"dark";
      root.setAttribute("data-theme",next);
      try{localStorage.setItem("tips-panel-theme",next)}catch(e){}
      paintTheme();
    });
    paintTheme();
  }

  /* panel: build DOM once, update in place */
  var host=document.getElementById("tips-root");
  var done=new Set();
  var section=null,countEl=null,gridEl=null,closeBtn=null;
  var rowRefs=[]; /* {li, actionSlot} */
  var closing=false,closeTimer=null;

  function checkSvg(){
    var ns="http://www.w3.org/2000/svg";
    var svg=document.createElementNS(ns,"svg");
    svg.setAttribute("viewBox","0 0 16 16");
    svg.setAttribute("width","16");
    svg.setAttribute("height","16");
    svg.setAttribute("aria-hidden","true");
    var circle=document.createElementNS(ns,"circle");
    circle.setAttribute("cx","8");circle.setAttribute("cy","8");circle.setAttribute("r","7");
    circle.setAttribute("fill","currentColor");
    svg.appendChild(circle);
    var path=document.createElementNS(ns,"path");
    path.setAttribute("d","m5 8.2 2 2 4-4.2");
    path.setAttribute("fill","none");
    path.setAttribute("stroke","#fff");
    path.setAttribute("stroke-width","1.6");
    path.setAttribute("stroke-linecap","round");
    path.setAttribute("stroke-linejoin","round");
    svg.appendChild(path);
    return svg;
  }

  function updateCount(){
    var n=done.size;
    countEl.textContent=fmt.format(n)+"/"+fmt.format(TIPS.length)+" done";
  }

  function showAction(slot,tip,key){
    while(slot.firstChild){slot.removeChild(slot.firstChild)}
    var btn=document.createElement("button");
    btn.setAttribute("type","button");
    btn.className="tp__btn"+(tip.primary?" tp__btn--primary":"");
    btn.textContent=tip.action;
    btn.addEventListener("click",function(){
      if(!done.has(key)){done.add(key);markDone(key)}
    });
    slot.appendChild(btn);
  }

  function showDone(slot,tip){
    while(slot.firstChild){slot.removeChild(slot.firstChild)}
    var s=document.createElement("span");
    s.className="tp__done";
    s.setAttribute("role","status");
    s.appendChild(checkSvg());
    s.appendChild(document.createTextNode(tip.doneLabel||"Done"));
    slot.appendChild(s);
  }

  function markDone(key){
    for(var i=0;i<rowRefs.length;i++){
      if(rowRefs[i].key===key){
        var r=rowRefs[i];
        r.li.setAttribute("data-done","");
        showDone(r.slot,r.tip);
        break;
      }
    }
    updateCount();
  }

  function resetAll(){
    done.clear();
    for(var i=0;i<rowRefs.length;i++){
      var r=rowRefs[i];
      r.li.removeAttribute("data-done");
      showAction(r.slot,r.tip,r.key);
    }
    updateCount();
  }

  function build(){
    section=document.createElement("section");
    section.className="tp";
    section.setAttribute("aria-label",TITLE);

    var head=document.createElement("header");
    head.className="tp__head";
    var h=document.createElement("h3");
    h.className="tp__title";
    h.setAttribute("dir","auto");
    h.textContent=TITLE;
    head.appendChild(h);
    countEl=document.createElement("span");
    countEl.className="tp__count";
    countEl.setAttribute("aria-live","polite");
    head.appendChild(countEl);
    section.appendChild(head);

    var card=document.createElement("div");
    card.className="tp__card";
    gridEl=document.createElement("ul");
    gridEl.className="tp__grid";
    card.appendChild(gridEl);
    section.appendChild(card);

    var seen={};
    for(var i=0;i<TIPS.length;i++){
      var tip=TIPS[i];
      var n=seen[tip.id]||0;
      seen[tip.id]=n+1;
      var key=n?(tip.id+"#"+n):tip.id;
      var li=document.createElement("li");
      li.className="tp__tip";
      li.style.animationDelay=(80+Math.min(i,12)*50)+"ms";
      var pt=document.createElement("p");
      pt.className="tp__tip-title";
      pt.setAttribute("dir","auto");
      pt.textContent=tip.title;
      li.appendChild(pt);
      var pd=document.createElement("p");
      pd.className="tp__tip-text";
      pd.setAttribute("dir","auto");
      if(tip.descriptionKbd){
        pd.appendChild(document.createTextNode(tip.descriptionPre));
        var kbd=document.createElement("kbd");
        kbd.className="tp__kbd";
        kbd.textContent=tip.descriptionKbd;
        pd.appendChild(kbd);
        pd.appendChild(document.createTextNode(tip.descriptionPost));
      }else{
        pd.textContent=tip.description;
      }
      li.appendChild(pd);
      var slot=document.createElement("div");
      slot.className="tp__slot";
      slot.style.display="contents";
      li.appendChild(slot);
      gridEl.appendChild(li);
      rowRefs.push({li:li,slot:slot,tip:tip,key:key});
      showAction(slot,tip,key);
    }

    var foot=document.createElement("footer");
    foot.className="tp__foot";
    closeBtn=document.createElement("button");
    closeBtn.setAttribute("type","button");
    closeBtn.className="tp__btn";
    closeBtn.textContent=CLOSE_LABEL;
    closeBtn.addEventListener("click",function(){
      if(closing){return}
      closing=true;
      section.setAttribute("data-closing","");
      closeTimer=window.setTimeout(function(){
        resetAll();
        section.removeAttribute("data-closing");
        closing=false;
        closeTimer=null;
      },650);
    });
    foot.appendChild(closeBtn);
    section.appendChild(foot);

    host.appendChild(section);
    updateCount();
  }

  build();
  /* expose minimal hooks for testing without affecting behaviour */
  try{
    window.__tipsPanel={
      get doneCount(){return done.size},
      get total(){return TIPS.length},
      get closing(){return closing},
      reset:resetAll,
      countEl:function(){return countEl},
      rows:function(){return rowRefs}
    };
  }catch(e){}
})();
</script>
</body>
</html>
