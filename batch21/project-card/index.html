<!doctype html>
<html lang="en" data-theme="light">
<head>
<script>/*noflash*/(function(){try{var k='project-card-theme';var s=null;try{s=localStorage.getItem(k);}catch(e){}var t=s;if(!t){try{t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}catch(e){t='light';}}if(t!=='dark'&&t!=='light')t='light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Project Card — Onboarding flow</title>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root{
  --pc-surface:#ffffff; --pc-page:#fafaf9; --pc-ink:#171717; --pc-text:#404040;
  --pc-muted:#78716c; --pc-subtle:#f5f5f4; --pc-border:#e7e5e4;
  --pc-radius-lg:16px; --pc-radius:10px; --pc-radius-sm:6px;
  --pc-shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --pc-focus:rgba(0,96,226,.7);
  --pc-tray:#f0f0f0; --pc-card:#ffffff; --pc-line:#ececec;
  --pc-well:#f4f4f5; --pc-ring:#dcdce0;
  --pc-ease:cubic-bezier(.32,.72,.24,1); --pc-time:520ms;
}
html[data-theme="dark"]{
  --pc-surface:#1c1c1f; --pc-page:#101012; --pc-ink:#ededed; --pc-text:#c8c8cc;
  --pc-muted:#a1a1aa; --pc-subtle:#26262a; --pc-border:#2e2e33;
  --pc-shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  --pc-focus:rgba(77,141,255,.8);
  --pc-tray:#111113; --pc-card:#19191b; --pc-line:#2a2a2e;
  --pc-well:#222225; --pc-ring:#3a3a40;
}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
body{font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
body{
  margin:0; background:var(--pc-page); color:var(--pc-text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  min-height:100vh; display:flex; justify-content:center;
}
.page{width:100%; max-width:720px; padding:20px 16px 48px}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px}
.topbar-title{font-size:13px; font-weight:600; color:var(--pc-muted); letter-spacing:.02em}
.theme-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:999px;
  border:1px solid var(--pc-border); background:var(--pc-surface); color:var(--pc-text);
  cursor:pointer; transition:background-color 160ms ease, transform 160ms ease;
}
.theme-btn:focus-visible{outline:2px solid var(--pc-focus); outline-offset:2px}
.stage{display:flex; flex-direction:column; align-items:center; gap:12px}
.hint{font-size:12.5px; color:var(--pc-muted); margin:4px 0 0}
/* ---- project card ---- */
.ui-pc{
  box-sizing:border-box; width:100%; max-width:320px;
  container-type:inline-size; padding:4px;
  border-radius:calc(var(--pc-radius-lg) + 4px);
  background:var(--pc-tray);
  font-size:13px; line-height:20px; text-align:left;
  -webkit-font-smoothing:antialiased;
}
.ui-pc *, .ui-pc *::before, .ui-pc *::after{box-sizing:border-box}
.ui-pc button{margin:0; padding:0; border:0; background:none; font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
.ui-pc button:focus-visible{outline:2px solid var(--pc-focus); outline-offset:2px}
.ui-pc svg{display:block; flex:none}
.ui-pc [hidden]{display:none !important}
.ui-pc b{font-weight:500; color:var(--pc-ink)}
.ui-pc [data-tone="red"]{--pc-tag:#c4320a; --pc-tag-bg:rgba(240,68,56,.10); --pc-tag-on:rgba(240,68,56,.18)}
.ui-pc [data-tone="amber"]{--pc-tag:#b25e00; --pc-tag-bg:rgba(232,176,0,.14); --pc-tag-on:rgba(232,176,0,.24)}
.ui-pc [data-tone="green"]{--pc-tag:#1e8a4f; --pc-tag-bg:rgba(95,200,138,.11); --pc-tag-on:rgba(95,200,138,.20)}
.ui-pc [data-tone="blue"]{--pc-tag:#0190fe; --pc-tag-bg:rgba(1,144,254,.09); --pc-tag-on:rgba(1,144,254,.17)}
.ui-pc [data-tone="violet"]{--pc-tag:#8a35d6; --pc-tag-bg:rgba(166,81,240,.10); --pc-tag-on:rgba(166,81,240,.18)}
.ui-pc [data-tone="gray"]{--pc-tag:#5f5f66; --pc-tag-bg:rgba(110,110,120,.09); --pc-tag-on:rgba(110,110,120,.17)}
html[data-theme="dark"] .ui-pc [data-tone="red"]{--pc-tag:#ff8a7a}
html[data-theme="dark"] .ui-pc [data-tone="amber"]{--pc-tag:#fbbf24; --pc-tag-bg:rgba(251,191,36,.14); --pc-tag-on:rgba(251,191,36,.24)}
html[data-theme="dark"] .ui-pc [data-tone="green"]{--pc-tag:#7dcf9f}
html[data-theme="dark"] .ui-pc [data-tone="blue"]{--pc-tag:#9cd2fe}
html[data-theme="dark"] .ui-pc [data-tone="violet"]{--pc-tag:#d6baf6}
html[data-theme="dark"] .ui-pc [data-tone="gray"]{--pc-tag:#b4b4bb}
.ui-pc__card{border-radius:var(--pc-radius-lg); background:var(--pc-surface); box-shadow:0 0 0 1px var(--pc-line), 0 1px 2px rgba(0,0,0,.04)}
.ui-pc__fold{display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows var(--pc-time) var(--pc-ease), opacity 260ms ease}
.ui-pc__fold > *{min-height:0; overflow:hidden}
.ui-pc[data-open] > .ui-pc__card > .ui-pc__fold, .ui-pc[data-open] > .ui-pc__fold, .ui-pc__fold--status[data-open]{grid-template-rows:1fr; opacity:1; transition:grid-template-rows var(--pc-time) var(--pc-ease), opacity 380ms ease 120ms}
.ui-pc__head{position:relative; display:flex; align-items:center; gap:10px; padding:10px 12px}
.ui-pc__toggle{position:absolute; inset:0; border-radius:var(--pc-radius-lg)}
.ui-pc__head > :not(.ui-pc__toggle){position:relative; pointer-events:none}
.ui-pc[data-open] .ui-pc__status, .ui-pc[data-open] .ui-pc__member, .ui-pc__progress[data-live] .ui-pc__seg{pointer-events:auto}
.ui-pc__progress{display:grid; flex:none; place-items:center; width:32px; height:32px}
.ui-pc__progress > *{grid-area:1/1}
.ui-pc__seg{fill:none; stroke:var(--pc-ring); stroke-width:3; stroke-linecap:round; cursor:pointer; transition:stroke 260ms ease, stroke-width 260ms var(--pc-ease), opacity 240ms ease}
.ui-pc__seg[data-done]{stroke:var(--pc-ink)}
.ui-pc__seg[data-hot]{stroke-width:4.5; stroke:var(--pc-muted)}
.ui-pc__seg[data-done][data-hot]{stroke:var(--pc-ink)}
.ui-pc__seg[data-dim]{opacity:.3}
.ui-pc__num{font-size:11.5px; font-weight:600; line-height:1; color:var(--pc-ink); font-variant-numeric:tabular-nums; pointer-events:none; animation:ui-pc-num 320ms var(--pc-ease) both}
.ui-pc__titles{display:grid; grid-template-columns:minmax(0,1fr); flex:1; min-width:0}
.ui-pc__name{overflow:hidden; text-align:start; font-size:13.5px; font-weight:600; color:var(--pc-ink); white-space:nowrap; text-overflow:ellipsis}
.ui-pc__sub{display:flex; align-items:center; gap:6px; min-width:0; height:20px; margin-top:1px; overflow:hidden; font-size:12px; line-height:20px; color:var(--pc-muted); white-space:nowrap}
.ui-pc__status{display:inline-flex; flex:0 1 auto; min-width:0; max-width:100%; align-items:center; gap:4px; height:20px; padding:0 7px 0 5px; border-radius:5px; background:var(--pc-tag-bg); font-weight:500; color:var(--pc-tag); transition:background-color 200ms ease}
.ui-pc__status-text{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ui-pc__due{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
.ui-pc__people{display:flex; flex:none}
.ui-pc__member{position:relative; border-radius:50%; transition:transform 260ms var(--pc-ease), opacity 240ms ease}
.ui-pc__member + .ui-pc__member{margin-left:-6px}
.ui-pc__member[data-on]{z-index:1; transform:scale(1.12)}
.ui-pc__member[data-off]{opacity:.4}
.ui-pc__member[aria-pressed="true"] .ui-pc__avatar{box-shadow:0 0 0 1.5px var(--pc-card), 0 0 0 3px var(--pc-ink)}
.ui-pc__avatar{display:grid; flex:none; place-items:center; width:20px; height:20px; overflow:hidden; border-radius:50%; background:hsl(var(--pc-hue,210) 70% 90%); color:hsl(var(--pc-hue,210) 45% 34%); box-shadow:0 0 0 1.5px var(--pc-card); font-size:9px; font-weight:600; line-height:1; transition:box-shadow 200ms ease}
html[data-theme="dark"] .ui-pc__avatar{background:hsl(var(--pc-hue,210) 30% 26%); color:hsl(var(--pc-hue,210) 70% 82%)}
.ui-pc__avatar img{width:100%; height:100%; object-fit:cover; outline:1px solid rgba(0,0,0,.1); outline-offset:-1px}
html[data-theme="dark"] .ui-pc__avatar img{outline-color:rgba(255,255,255,.1)}
.ui-pc__more{position:relative; margin-left:-5px; padding:0 3px; width:auto; min-width:20px; border-radius:10px; background:var(--pc-well); color:var(--pc-text); font-variant-numeric:tabular-nums}
.ui-pc[data-open] .ui-pc__more{pointer-events:auto}
.ui-pc__body{padding:0 12px}
.ui-pc__options{display:flex; flex-wrap:wrap; gap:4px; padding-bottom:10px}
.ui-pc__option{display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px 0 7px; border-radius:6px; background:var(--pc-tag-bg); font-size:12px; font-weight:500; color:var(--pc-tag); white-space:nowrap; transition:background-color 160ms ease, box-shadow 160ms ease; max-width:100%}
.ui-pc__option-text{min-width:0; overflow:hidden; text-overflow:ellipsis}
.ui-pc__option[aria-checked="true"]{background:var(--pc-tag-on); box-shadow:inset 0 0 0 1px var(--pc-tag)}
.ui-pc__tasks{max-height:352px; margin:0 -6px; padding:8px 6px; border-top:1px solid transparent; overflow-y:auto; overscroll-behavior:contain; background:linear-gradient(var(--pc-line),var(--pc-line)) 6px 0/calc(100% - 12px) 1px no-repeat border-box; list-style:none}
.ui-pc__task{display:flex; align-items:center; gap:9px; width:calc(100% + 12px); height:30px; margin:0 -6px; padding:0 6px; border-radius:8px; color:var(--pc-text); transition:background-color 160ms ease, opacity 240ms ease}
.ui-pc__task[data-dim]{opacity:.35}
.ui-pc__label{flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; text-align:start}
.ui-pc__task .ui-pc__avatar{width:18px; height:18px; font-size:8px; opacity:0; transform:translateX(4px); transition:opacity 200ms ease, transform 260ms var(--pc-ease)}
.ui-pc__task[data-hot] .ui-pc__avatar, .ui-pc__task:focus-visible .ui-pc__avatar{opacity:1; transform:none}
.ui-pc__ring{fill:none; stroke:#c9c9ce; stroke-width:1.4; transition:stroke 160ms ease}
html[data-theme="dark"] .ui-pc__ring{stroke:#4a4a50}
.ui-pc__disc{fill:var(--pc-ink); transform-origin:8px 8px; transform:scale(0); transition:transform 340ms var(--pc-ease)}
.ui-pc__tick{fill:none; stroke:var(--pc-card); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:9; stroke-dashoffset:9; transition:stroke-dashoffset 280ms var(--pc-ease) 80ms}
.ui-pc__task[aria-checked="true"] .ui-pc__disc{transform:scale(1)}
.ui-pc__task[aria-checked="true"] .ui-pc__tick{stroke-dashoffset:0}
.ui-pc__task[aria-checked="true"]{color:var(--pc-muted)}
.ui-pc__foot{display:flex; align-items:center; gap:8px; height:38px; padding:4px 4px 0 10px}
.ui-pc__caption{flex:1; min-width:0; overflow:hidden; text-align:start; font-size:12.5px; color:var(--pc-muted); white-space:nowrap; text-overflow:ellipsis}
.ui-pc__caption > span{display:inline-block; animation:ui-pc-in 280ms var(--pc-ease) both}
.ui-pc__action{display:inline-flex; align-items:center; gap:4px; flex:0 1 auto; min-width:0; max-width:60%; height:26px; padding:0 6px 0 8px; border-radius:var(--pc-radius); font-size:12.5px; font-weight:500; color:var(--pc-text); white-space:nowrap; transition:background-color 160ms ease}
.ui-pc__action-text{min-width:0; overflow:hidden; text-overflow:ellipsis}
@keyframes ui-pc-in{from{opacity:0; transform:translateY(3px)}}
@keyframes ui-pc-num{from{opacity:0; transform:scale(.8)}}
@container (max-width:290px){
  .ui-pc__due-word{display:none}
  .ui-pc__member + .ui-pc__member{margin-left:-9px}
  .ui-pc__head{gap:8px}
  .ui-pc__sub{gap:4px}
  .ui-pc__status{padding:0 6px 0 4px}
}
@media (pointer:coarse){
  .ui-pc__task{height:36px}
  .ui-pc__task .ui-pc__avatar{opacity:1; transform:none}
  .ui-pc__option{height:30px}
  .ui-pc__action{height:30px}
}
@media (prefers-reduced-motion:reduce){
  .ui-pc *, .ui-pc *::before, .ui-pc *::after{animation:none !important; transition:none !important}
}
@media (hover: hover) and (pointer: fine){
  .ui-pc[data-open] .ui-pc__status:hover{background:var(--pc-tag-on)}
  .ui-pc__option:hover{background:var(--pc-tag-on)}
  .ui-pc__task[data-hot]{background:var(--pc-well)}
  .ui-pc__action:hover{background:var(--pc-card); color:var(--pc-ink)}
  .ui-pc__action:hover svg{transform:translateX(2px)}
  .theme-btn:hover{background:var(--pc-subtle)}
  .ui-pc[data-open] .ui-pc__member:hover{transform:scale(1.08)}
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <span class="topbar-title">Project Card</span>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme"><span id="themeIcon" aria-hidden="true">◐</span></button>
  </header>
  <main class="stage">
    <div id="demoMount"></div>
    <p class="hint">Hover to expand · click ring or tasks to toggle · click people to filter</p>
  </main>
</div>
<script>
(function(){
'use strict';
var TITLE='Onboarding flow';
var DUE='Oct 24';
var ACTION_LABEL='Open';
var STATUSES=[
  {id:'todo',label:'To do',tone:'violet'},
  {id:'progress',label:'In progress',tone:'amber'},
  {id:'review',label:'In review',tone:'blue'},
  {id:'done',label:'Done',tone:'green'}
];
var TASKS=[
  {id:'welcome',label:'Welcome screen',done:true,assignee:'Mara'},
  {id:'workspace',label:'Workspace setup',done:true,assignee:'Jonas'},
  {id:'invite',label:'Invite teammates',done:true,assignee:'Mara'},
  {id:'checklist',label:'First-run checklist',done:false,assignee:'Priya'},
  {id:'emails',label:'Lifecycle emails',done:false,assignee:'Jonas'}
];
var MEMBERS=[{name:'Mara'},{name:'Jonas'},{name:'Priya'}];
var MAX_AVATARS=4;
var fmt=new Intl.NumberFormat('en');
function initials(name){
  var parts=String(name).trim().split(/\s+/);
  var out='';
  for(var i=0;i<parts.length&&out.length<2;i++){
    var m=parts[i].match(/[\p{L}\p{N}]/u);
    if(m) out+=m[0];
  }
  return out.toUpperCase()||'?';
}
function hueOf(name){
  var h=7; var s=String(name);
  for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))%360; }
  return h;
}
function toneOf(t){ return t||'gray'; }
function arcPath(f0,f1,r,cx){
  function pt(f){ var a=f*Math.PI*2-Math.PI/2; return (cx+r*Math.cos(a)).toFixed(2)+' '+(cx+r*Math.sin(a)).toFixed(2); }
  var large=((f1-f0)>.5)?1:0;
  return 'M '+pt(f0)+' A '+r+' '+r+' 0 '+large+' 1 '+pt(f1);
}
function el(tag,cls){ var n=document.createElement(tag); if(cls) n.setAttribute('class',cls); return n; }
function svgEl(tag,cls){ var n=document.createElementNS('http://www.w3.org/2000/svg',tag); if(cls) n.setAttribute('class',cls); return n; }
function statusIcon(tone){
  var s=svgEl('svg',''); s.setAttribute('width','12'); s.setAttribute('height','12');
  s.setAttribute('viewBox','0 0 12 12'); s.setAttribute('fill','none'); s.setAttribute('aria-hidden','true');
  function circle(extra,dash){
    var c=svgEl('circle',''); c.setAttribute('cx','6'); c.setAttribute('cy','6'); c.setAttribute('r','4.25');
    c.setAttribute('stroke','currentColor'); c.setAttribute('stroke-width','1.5');
    c.setAttribute('stroke-linecap','round'); c.setAttribute('stroke-linejoin','round');
    if(dash) c.setAttribute('stroke-dasharray','2.2 2.25');
    if(extra) for(var k in extra) c.setAttribute(k,extra[k]);
    return c;
  }
  if(tone==='gray'||tone==='violet'){ s.appendChild(circle(null,true)); }
  else if(tone==='amber'){
    s.appendChild(circle(null,false));
    var p=svgEl('path',''); p.setAttribute('d','M6 3.4a2.6 2.6 0 0 1 0 5.2V3.4Z'); p.setAttribute('fill','currentColor'); s.appendChild(p);
  } else if(tone==='blue'){
    var p2=svgEl('path',''); p2.setAttribute('d','M1.2 6S3 2.7 6 2.7 10.8 6 10.8 6 9 9.3 6 9.3 1.2 6 1.2 6Z');
    p2.setAttribute('stroke','currentColor'); p2.setAttribute('stroke-width','1.5'); p2.setAttribute('stroke-linecap','round'); p2.setAttribute('stroke-linejoin','round');
    s.appendChild(p2);
    var d=svgEl('circle',''); d.setAttribute('cx','6'); d.setAttribute('cy','6'); d.setAttribute('r','1.4'); d.setAttribute('fill','currentColor'); s.appendChild(d);
  } else if(tone==='green'){
    s.appendChild(circle(null,false));
    var p3=svgEl('path',''); p3.setAttribute('d','m4.1 6.1 1.3 1.3 2.5-2.7');
    p3.setAttribute('stroke','currentColor'); p3.setAttribute('stroke-width','1.5'); p3.setAttribute('stroke-linecap','round'); p3.setAttribute('stroke-linejoin','round');
    s.appendChild(p3);
  } else {
    s.appendChild(circle(null,false));
    var p4=svgEl('path',''); p4.setAttribute('d','M6 3.8v2.6M6 8.2v.01');
    p4.setAttribute('stroke','currentColor'); p4.setAttribute('stroke-width','1.5'); p4.setAttribute('stroke-linecap','round'); p4.setAttribute('stroke-linejoin','round');
    s.appendChild(p4);
  }
  return s;
}
function checkSvg(){
  var s=svgEl('svg',''); s.setAttribute('width','16'); s.setAttribute('height','16');
  s.setAttribute('viewBox','0 0 16 16'); s.setAttribute('fill','none'); s.setAttribute('aria-hidden','true');
  var ring=svgEl('circle','ui-pc__ring'); ring.setAttribute('cx','8'); ring.setAttribute('cy','8'); ring.setAttribute('r','6.3'); s.appendChild(ring);
  var disc=svgEl('circle','ui-pc__disc'); disc.setAttribute('cx','8'); disc.setAttribute('cy','8'); disc.setAttribute('r','7'); s.appendChild(disc);
  var tick=svgEl('path','ui-pc__tick'); tick.setAttribute('d','m5.2 8.2 1.9 1.9 3.7-4'); s.appendChild(tick);
  return s;
}
function arrowSvg(){
  var s=svgEl('svg',''); s.setAttribute('width','12'); s.setAttribute('height','12');
  s.setAttribute('viewBox','0 0 12 12'); s.setAttribute('fill','none'); s.setAttribute('aria-hidden','true');
  var p=svgEl('path',''); p.setAttribute('d','M2.5 6h7M6.5 3l3 3-3 3');
  p.setAttribute('stroke','currentColor'); p.setAttribute('stroke-width','1.4'); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
  s.appendChild(p); return s;
}
function makeAvatar(member){
  var a=el('span','ui-pc__avatar');
  a.style.setProperty('--pc-hue',String(hueOf(member.name)));
  a.style.setProperty('--ui-pc-hue',String(hueOf(member.name)));
  var t=document.createTextNode(initials(member.name));
  a.appendChild(t);
  return a;
}
/* state */
var state={ open:false, statusId:'progress', done:{}, hotTask:null, hotPerson:null, selPerson:null, statusOpen:false };
TASKS.forEach(function(t){ state.done[t.id]=!!t.done; });
var interacted=false;
var openTimer=0, closeTimer=0;
/* refs built once */
var root, card, head, toggleBtn, progWrap, ringSvg, numEl, nameEl, subEl, statusBtn, statusText, dueEl,
    peopleWrap, foldBody, foldFoot, statusFold, optionsWrap, tasksUl, captionInner, captionKey,
    actionBtn, memberBtns=[], taskRows=[], segEls=[], optionBtns=[];
function currentStatus(){ for(var i=0;i<STATUSES.length;i++) if(STATUSES[i].id===state.statusId) return STATUSES[i]; return STATUSES[0]; }
function doneCount(){ var n=0; TASKS.forEach(function(t){ if(state.done[t.id]) n++; }); return n; }
function activeFilter(){ return state.hotPerson||state.selPerson; }
function visibleFor(task){ var z=activeFilter(); return !z||task.assignee===z; }
function captionModel(){
  var left=TASKS.length-doneCount();
  var base = left===0 ? 'All done' : (fmt.format(left)+' left');
  var key='rest';
  var hot=null;
  if(state.hotTask){
    for(var i=0;i<TASKS.length;i++) if(TASKS[i].id===state.hotTask){ hot=TASKS[i]; break; }
  }
  if(hot){
    key='task-'+hot.id;
    if(hot.assignee){ base=(state.done[hot.id]?'Done by ':'Assigned to ')+hot.assignee; }
    else { base=state.done[hot.id]?'Done':'Nobody on it yet'; }
    return {text:base,key:key,hotAssignee:hot.assignee||null,done:!!state.done[hot.id]};
  }
  var z=activeFilter();
  if(z){
    var tot=0, dn=0;
    TASKS.forEach(function(t){ if(t.assignee===z){ tot++; if(state.done[t.id]) dn++; } });
    key='person-'+z;
    return {text:'',key:key,person:z,dn:dn,tot:tot};
  }
  return {text:base,key:key};
}
function setOpen(next){
  if(state.open===next) return;
  window.clearTimeout(openTimer); window.clearTimeout(closeTimer);
  state.open=next;
  if(!next){ state.statusOpen=false; state.hotTask=null; state.hotPerson=null; }
  syncOpen(); syncTasks(); syncRing(); syncPeople(); syncCaption(); syncStatus();
}
function scheduleOpen(v,delay){
  window.clearTimeout(openTimer); window.clearTimeout(closeTimer);
  if(v){ closeTimer=0; openTimer=window.setTimeout(function(){ setOpen(true); },delay); }
  else { openTimer=0; closeTimer=window.setTimeout(function(){ setOpen(false); },delay); }
}
function syncOpen(){
  if(state.open) root.setAttribute('data-open',''); else root.removeAttribute('data-open');
  toggleBtn.setAttribute('aria-expanded',state.open?'true':'false');
  var st=currentStatus();
  toggleBtn.setAttribute('aria-label',TITLE+': '+fmt.format(doneCount())+' of '+fmt.format(TASKS.length)+' done, '+(st?st.label:'')+(DUE?', due '+DUE:''));
  if(state.open) progWrap.setAttribute('data-live',''); else progWrap.removeAttribute('data-live');
  foldBody.inert=!state.open; foldFoot.inert=!state.open;
  if(state.open){ foldBody.removeAttribute('inert'); foldFoot.removeAttribute('inert'); }
  else { foldBody.setAttribute('inert',''); foldFoot.setAttribute('inert',''); }
  statusBtn.tabIndex=state.open?0:-1;
  memberBtns.forEach(function(b){ b.tabIndex=state.open?0:-1; });
  syncStatusFold();
}
function syncStatusFold(){
  if(state.statusOpen) statusFold.setAttribute('data-open',''); else statusFold.removeAttribute('data-open');
  statusFold.inert=!state.statusOpen;
  if(state.statusOpen) statusFold.removeAttribute('inert'); else statusFold.setAttribute('inert','');
  statusBtn.setAttribute('aria-expanded',state.statusOpen?'true':'false');
}
function syncStatus(){
  var st=currentStatus();
  statusBtn.setAttribute('data-tone',toneOf(st.tone));
  statusBtn.setAttribute('title',st.label);
  while(statusText.firstChild) statusText.removeChild(statusText.firstChild);
  statusText.appendChild(document.createTextNode(st.label));
  var icon=statusBtn.querySelector('svg');
  if(icon) statusBtn.removeChild(icon);
  statusBtn.insertBefore(statusIcon(toneOf(st.tone)),statusText);
  optionBtns.forEach(function(o){
    o.btn.setAttribute('aria-checked',o.def.id===st.id?'true':'false');
  });
  var lbl=TITLE+': '+fmt.format(doneCount())+' of '+fmt.format(TASKS.length)+' done, '+st.label+(DUE?', due '+DUE:'');
  toggleBtn.setAttribute('aria-label',lbl);
}
function syncRing(){
  var n=TASKS.length;
  var gap=n>1?Math.min(.055,1/n*.35):0;
  var step=1/Math.max(n,1);
  for(var i=0;i<segEls.length;i++){
    var t=TASKS[i]; var s=segEls[i];
    if(state.done[t.id]) s.setAttribute('data-done',''); else s.removeAttribute('data-done');
    if(state.hotTask===t.id) s.setAttribute('data-hot',''); else s.removeAttribute('data-hot');
    if(visibleFor(t)) s.removeAttribute('data-dim'); else s.setAttribute('data-dim','');
  }
  var nk=fmt.format(doneCount());
  if(numEl.textContent!==nk){
    numEl.textContent=nk;
    try{ numEl.style.animation='none'; void numEl.offsetWidth; numEl.style.animation=''; }catch(e){}
  }
}
function syncTasks(){
  taskRows.forEach(function(r){
    var t=r.task;
    r.btn.setAttribute('aria-checked',state.done[t.id]?'true':'false');
    if(state.hotTask===t.id) r.btn.setAttribute('data-hot',''); else r.btn.removeAttribute('data-hot');
    if(visibleFor(t)) r.btn.removeAttribute('data-dim'); else r.btn.setAttribute('data-dim','');
  });
  syncRing(); syncCaption(); syncOpenLabel();
}
function syncOpenLabel(){
  var st=currentStatus();
  toggleBtn.setAttribute('aria-label',TITLE+': '+fmt.format(doneCount())+' of '+fmt.format(TASKS.length)+' done, '+st.label+(DUE?', due '+DUE:''));
}
function syncPeople(){
  var z=activeFilter();
  memberBtns.forEach(function(b){
    var nm=b.name;
    b.btn.setAttribute('aria-pressed',state.selPerson===nm?'true':'false');
    if(z===nm) b.btn.setAttribute('data-on',''); else b.btn.removeAttribute('data-on');
    if(z&&z!==nm) b.btn.setAttribute('data-off',''); else b.btn.removeAttribute('data-off');
  });
}
function syncCaption(){
  var m=captionModel();
  while(captionInner.firstChild) captionInner.removeChild(captionInner.firstChild);
  if(m.person){
    captionInner.appendChild(document.createElement('b')).textContent=m.person;
    captionInner.appendChild(document.createTextNode(' · '+fmt.format(m.dn)+' of '+fmt.format(m.tot)+' done'));
  } else if(m.hotAssignee){
    captionInner.appendChild(document.createTextNode(state.done[state.hotTask]?'Done by ':'Assigned to '));
    var b=document.createElement('b'); b.textContent=m.hotAssignee; captionInner.appendChild(b);
  } else {
    captionInner.appendChild(document.createTextNode(m.text));
  }
  if(captionKey!==m.key){
    captionKey=m.key;
    try{ captionInner.style.animation='none'; void captionInner.offsetWidth; captionInner.style.animation=''; }catch(e){}
  }
}
function toggleTask(id){
  state.done[id]=!state.done[id];
  syncTasks();
}
function build(){
  var mount=document.getElementById('demoMount');
  root=el('div','ui-pc');
  root.setAttribute('id','pc-root');
  card=el('div','ui-pc__card');
  root.appendChild(card);
  head=el('div','ui-pc__head');
  card.appendChild(head);
  toggleBtn=document.createElement('button');
  toggleBtn.setAttribute('class','ui-pc__toggle');
  toggleBtn.setAttribute('type','button');
  toggleBtn.setAttribute('aria-expanded','false');
  toggleBtn.setAttribute('aria-controls','pc-body');
  head.appendChild(toggleBtn);
  progWrap=el('span','ui-pc__progress');
  head.appendChild(progWrap);
  ringSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  ringSvg.setAttribute('width','32'); ringSvg.setAttribute('height','32');
  ringSvg.setAttribute('viewBox','0 0 32 32'); ringSvg.setAttribute('fill','none');
  ringSvg.setAttribute('aria-hidden','true');
  progWrap.appendChild(ringSvg);
  var R=12.5;
  if(TASKS.length===1){
    var c=svgEl('circle','ui-pc__seg');
    c.setAttribute('cx','16'); c.setAttribute('cy','16'); c.setAttribute('r',String(R));
    (function(id,node){ node.addEventListener('pointerenter',function(){ state.hotTask=id; syncTasks(); }); node.addEventListener('click',function(){ toggleTask(id); }); })(TASKS[0].id,c);
    ringSvg.appendChild(c); segEls.push(c);
  } else {
    var n=TASKS.length; var gap=Math.min(.055,1/n*.35); var step=1/Math.max(n,1);
    TASKS.forEach(function(t,i){
      var p=svgEl('path','ui-pc__seg');
      p.setAttribute('d',arcPath(i*step+gap/2,(i+1)*step-gap/2,R,16));
      (function(id,node){
        node.addEventListener('pointerenter',function(){ state.hotTask=id; syncTasks(); });
        node.addEventListener('click',function(ev){ try{ev.stopPropagation();}catch(e){} toggleTask(id); });
      })(t.id,p);
      ringSvg.appendChild(p); segEls.push(p);
    });
  }
  ringSvg.addEventListener('pointerleave',function(){ if(state.hotTask){ state.hotTask=null; syncTasks(); } });
  numEl=el('span','ui-pc__num'); numEl.textContent=fmt.format(doneCount());
  progWrap.appendChild(numEl);
  var titles=el('span','ui-pc__titles'); head.appendChild(titles);
  nameEl=el('span','ui-pc__name'); nameEl.setAttribute('dir','auto'); nameEl.setAttribute('title',TITLE);
  nameEl.textContent=TITLE; titles.appendChild(nameEl);
  subEl=el('span','ui-pc__sub'); titles.appendChild(subEl);
  statusBtn=document.createElement('button');
  statusBtn.setAttribute('class','ui-pc__status');
  statusBtn.setAttribute('type','button');
  statusBtn.setAttribute('aria-expanded','false');
  statusBtn.setAttribute('aria-controls','pc-status');
  statusBtn.tabIndex=-1;
  subEl.appendChild(statusBtn);
  var st0=currentStatus();
  statusBtn.appendChild(statusIcon(toneOf(st0.tone)));
  statusText=el('span','ui-pc__status-text'); statusText.setAttribute('dir','auto'); statusText.textContent=st0.label;
  statusBtn.appendChild(statusText);
  dueEl=el('span','ui-pc__due'); dueEl.setAttribute('dir','auto'); dueEl.setAttribute('title',DUE);
  var w1=el('span','ui-pc__due-word'); w1.textContent='Due '; dueEl.appendChild(w1);
  dueEl.appendChild(document.createTextNode(DUE));
  subEl.appendChild(dueEl);
  peopleWrap=el('span','ui-pc__people'); head.appendChild(peopleWrap);
  MEMBERS.slice(0,MAX_AVATARS).forEach(function(m){
    var b=document.createElement('button');
    b.setAttribute('class','ui-pc__member'); b.setAttribute('type','button'); b.setAttribute('title',m.name);
    b.setAttribute('aria-label',"Only "+m.name+"'s subtasks"); b.setAttribute('aria-pressed','false');
    b.tabIndex=-1;
    b.appendChild(makeAvatar(m));
    (function(name,node){
      node.addEventListener('pointerenter',function(ev){ try{ if(ev&&ev.pointerType&&ev.pointerType!=='mouse') return; }catch(e){} state.hotPerson=name; syncPeople(); syncCaption(); });
      node.addEventListener('focus',function(){ state.hotPerson=name; syncPeople(); syncCaption(); });
      node.addEventListener('blur',function(){ state.hotPerson=null; syncPeople(); syncCaption(); });
      node.addEventListener('click',function(){ state.selPerson=(state.selPerson===name?null:name); syncPeople(); syncTasks(); syncCaption(); });
    })(m.name,b);
    peopleWrap.appendChild(b);
    memberBtns.push({name:m.name,btn:b});
  });
  peopleWrap.addEventListener('pointerleave',function(){ if(state.hotPerson){ state.hotPerson=null; syncPeople(); syncCaption(); } });
  /* body fold */
  var foldB=el('div','ui-pc__fold'); foldB.setAttribute('id','pc-body'); foldB.inert=true; foldB.setAttribute('inert','');
  card.appendChild(foldB); foldBody=foldB;
  var bodyInner=el('div','ui-pc__body'); foldB.appendChild(bodyInner);
  statusFold=el('div','ui-pc__fold ui-pc__fold--status'); statusFold.setAttribute('id','pc-status'); statusFold.inert=true; statusFold.setAttribute('inert','');
  bodyInner.appendChild(statusFold);
  var clip1=el('div','ui-pc__clip'); statusFold.appendChild(clip1);
  optionsWrap=el('div','ui-pc__options'); optionsWrap.setAttribute('role','radiogroup'); optionsWrap.setAttribute('aria-label','Status');
  clip1.appendChild(optionsWrap);
  STATUSES.forEach(function(sdef){
    var b=document.createElement('button');
    b.setAttribute('class','ui-pc__option'); b.setAttribute('type','button'); b.setAttribute('role','radio');
    b.setAttribute('title',sdef.label); b.setAttribute('data-tone',toneOf(sdef.tone));
    b.setAttribute('aria-checked',sdef.id===state.statusId?'true':'false');
    b.appendChild(statusIcon(toneOf(sdef.tone)));
    var tx=el('span','ui-pc__option-text'); tx.setAttribute('dir','auto'); tx.textContent=sdef.label; b.appendChild(tx);
    (function(id,node){ node.addEventListener('click',function(){ state.statusId=id; state.statusOpen=false; syncStatus(); syncStatusFold(); syncOpenLabel(); }); })(sdef.id,b);
    optionsWrap.appendChild(b);
    optionBtns.push({def:sdef,btn:b});
  });
  tasksUl=el('ul','ui-pc__tasks');
  bodyInner.appendChild(tasksUl);
  tasksUl.addEventListener('pointerleave',function(){ if(state.hotTask){ state.hotTask=null; syncTasks(); } });
  TASKS.forEach(function(t){
    var li=document.createElement('li');
    var b=document.createElement('button');
    b.setAttribute('class','ui-pc__task'); b.setAttribute('type','button'); b.setAttribute('role','checkbox');
    b.setAttribute('aria-checked',state.done[t.id]?'true':'false');
    b.appendChild(checkSvg());
    var lab=el('span','ui-pc__label'); lab.setAttribute('dir','auto'); lab.setAttribute('title',t.label); lab.textContent=t.label;
    b.appendChild(lab);
    var mem=null; for(var i=0;i<MEMBERS.length;i++) if(MEMBERS[i].name===t.assignee) mem=MEMBERS[i];
    if(mem) b.appendChild(makeAvatar(mem));
    (function(id,node){
      node.addEventListener('pointerenter',function(ev){ try{ if(ev&&ev.pointerType&&ev.pointerType!=='mouse') return; }catch(e){} state.hotTask=id; syncTasks(); });
      node.addEventListener('focus',function(){ state.hotTask=id; syncTasks(); });
      node.addEventListener('blur',function(){ if(state.hotTask===id){ state.hotTask=null; syncTasks(); } });
      node.addEventListener('click',function(){ toggleTask(id); });
    })(t.id,b);
    li.appendChild(b); tasksUl.appendChild(li);
    taskRows.push({task:t,btn:b,labelEl:lab});
  });
  /* foot fold */
  var foldF=el('div','ui-pc__fold'); foldF.inert=true; foldF.setAttribute('inert','');
  root.appendChild(foldF); foldFoot=foldF;
  var clip2=el('div','ui-pc__clip'); foldF.appendChild(clip2);
  var foot=el('div','ui-pc__foot'); clip2.appendChild(foot);
  var cap=el('span','ui-pc__caption'); cap.setAttribute('aria-live','polite'); foot.appendChild(cap);
  captionInner=el('span',''); captionInner.setAttribute('dir','auto');
  captionInner.textContent=fmt.format(TASKS.length-doneCount())+' left';
  cap.appendChild(captionInner); captionKey='rest';
  actionBtn=document.createElement('button');
  actionBtn.setAttribute('class','ui-pc__action'); actionBtn.setAttribute('type','button'); actionBtn.setAttribute('title',ACTION_LABEL);
  var atx=el('span','ui-pc__action-text'); atx.textContent=ACTION_LABEL; actionBtn.appendChild(atx);
  actionBtn.appendChild(arrowSvg());
  actionBtn.addEventListener('click',function(){});
  foot.appendChild(actionBtn);
  /* interactions on root */
  root.addEventListener('pointerenter',function(ev){ try{ if(ev&&ev.pointerType&&ev.pointerType!=='mouse') return; }catch(e){} scheduleOpen(true,90); });
  root.addEventListener('pointerleave',function(ev){ try{ if(ev&&ev.pointerType&&ev.pointerType!=='mouse') return; }catch(e){} scheduleOpen(false,220); });
  root.addEventListener('keydown',function(ev){
    if(!ev||ev.key!=='Escape') return;
    if(!state.open) return;
    try{ if(ev.stopPropagation) ev.stopPropagation(); }catch(e){}
    if(state.statusOpen){ state.statusOpen=false; syncStatusFold(); return; }
    setOpen(false);
    try{ toggleBtn.focus({preventScroll:true}); }catch(e){ try{toggleBtn.focus();}catch(e2){} }
  });
  toggleBtn.addEventListener('click',function(){ setOpen(!state.open); });
  statusBtn.addEventListener('pointerdown',function(){
    if(!state.open) return;
    if(!state.statusOpen){ state.statusOpen=true; syncStatusFold(); }
  },true);
  statusBtn.addEventListener('click',function(){
    if(!state.open) return;
    state.statusOpen=!state.statusOpen; syncStatusFold();
  });
  document.addEventListener('pointerdown',function(ev){
    if(!state.open) return;
    try{ if(root.contains(ev.target)) return; }catch(e){ return; }
    setOpen(false);
  });
  document.addEventListener('pointerdown',function(ev){
    if(!state.statusOpen||!state.open) return;
    try{
      if(statusFold.contains(ev.target)||statusBtn.contains(ev.target)) return;
    }catch(e){ return; }
    state.statusOpen=false; syncStatusFold();
  });
  mount.appendChild(root);
  syncOpen(); syncStatus(); syncTasks(); syncPeople(); syncCaption();
  /* demo auto loop */
  function markInteracted(){ interacted=true; }
  var demoWrap=document.getElementById('demoMount');
  demoWrap.addEventListener('pointerenter',markInteracted);
  demoWrap.addEventListener('pointerdown',markInteracted,true);
  demoWrap.addEventListener('keydown',markInteracted,true);
  demoWrap.addEventListener('focus',markInteracted,true);
  var iv=window.setTimeout(function(){
    setOpen(!state.open);
    var id=window.setInterval(function(){ if(!interacted) setOpen(!state.open); },3400);
    try{ root.setAttribute('data-auto-id',String(id)); }catch(e){}
    window.__pcInterval=id;
  },700);
  window.__pcTimeout=iv;
  window.__pcTest={
    root:root, toggleBtn:toggleBtn, statusBtn:statusBtn, numEl:numEl, nameEl:nameEl,
    captionInner:captionInner, taskRows:taskRows, segEls:segEls, memberBtns:memberBtns,
    getState:function(){ return {open:state.open,statusId:state.statusId,done:Object.assign({},state.done),hotTask:state.hotTask,selPerson:state.selPerson,statusOpen:state.statusOpen,interacted:interacted}; },
    setOpen:setOpen, toggleTask:toggleTask
  };
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',build); }
else { build(); }
/* theme toggle */
(function(){
  var btn=document.getElementById('themeToggle');
  var icon=document.getElementById('themeIcon');
  function paint(){
    var t=document.documentElement.getAttribute('data-theme')||'light';
    if(icon) icon.textContent=(t==='dark')?'☾':'◐';
    if(btn) btn.setAttribute('aria-label','Switch to '+(t==='dark'?'light':'dark')+' theme');
  }
  if(btn) btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme')||'light';
    var nxt=(cur==='dark')?'light':'dark';
    document.documentElement.setAttribute('data-theme',nxt);
    try{ localStorage.setItem('project-card-theme',nxt); }catch(e){}
    paint();
  });
  paint();
})();
})();
</script>
</body>
