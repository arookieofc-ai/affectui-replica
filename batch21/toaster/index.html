<style>

--ink2:#ededed;
--muted:#a1a1aa;
--subtle:#26262a;

--err:#f87171;
--err-bg:#450a0a;
--warn:#fbbf24;
--warn-bg:#451a03;
--warn-ink:#fde68a;

}
html{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html [hidden]{display:none!important}
body{

background:var(--page);
color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
font-size:14px;

}
img{box-shadow:0 0 0 1px rgba(0,0,0,.1)}
html[data-theme="dark"] img{box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.page-head{

}
.page-head__in{

}
.page-head__title{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0}
.page-head__sub{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.page-head__spacer{flex:1}
.theme-toggle{

border:1px solid var(--border);background:var(--surface);color:var(--ink);
cursor:pointer;transition:transform 150ms ease,background 150ms ease;
padding:0 0 0 2px;
}
.theme-toggle svg{width:18px;height:18px}
.theme-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
.toaster-demo{width:100%}
.toaster-demo__col{display:flex;flex-direction:column;gap:16px}
.toaster-demo__panel{display:flex;flex-direction:column;gap:12px}
.toaster-demo__card{
background:var(--surface);
border:1px solid var(--border);
border-radius:var(--radius-lg);
box-shadow:var(--shadow);
padding:16px;
}
.toaster-demo__head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.toaster-demo__doc{
display:inline-flex;align-items:center;justify-content:center;

background:var(--subtle);border:1px solid var(--border);color:var(--muted);
flex:none;
}
.toaster-demo__doc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.toaster-demo__meta{display:flex;flex-direction:column;min-width:0}
.toaster-demo__name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toaster-demo__sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toaster-demo__grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:12px}
.toaster-demo__btn{

border-radius:var(--radius);
border:1px solid var(--border);
background:var(--surface);color:var(--ink2);
font:inherit;font-weight:550;cursor:pointer;
transition:transform 150ms ease,background 150ms ease,box-shadow 150ms ease;
}
.toaster-demo__btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.toaster-demo__foot{font-size:12.5px;color:var(--muted);margin:0}

border-radius:var(--radius-lg);
box-shadow:var(--shadow);

display:flex;flex-direction:column;gap:8px;
}
.toaster-demo__slot-label{font-size:12.5px;color:var(--muted);margin:0}
.toast-stack{

.toast-stack[data-inline="true"]{position:relative}

.toast{

border-radius:var(--radius);
box-shadow:var(--toast-shadow);

position:relative;overflow:hidden;

transition:transform 180ms ease,opacity 180ms ease,box-shadow 150ms ease;

}
.toast-stack[data-expanded="false"] .toast{

}
.toast-stack[data-expanded="true"] .toast{transform:none}
.toast[data-leaving="true"]{opacity:0;transform:translateY(6px) scale(.98)}
.toast__icon{

width:28px;height:28px;border-radius:999px;flex:none;
background:var(--subtle);color:var(--muted);border:1px solid var(--border);
}

.toast[data-status="success"] .toast__icon{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.toast[data-status="error"] .toast__icon{background:var(--err-bg);border-color:transparent;color:var(--err)}
.toast[data-status="loading"] .toast__icon{background:var(--subtle);color:var(--muted)}
.toast[data-status="loading"] .toast__icon svg{animation:spin 900ms linear infinite}
.toast__body{display:flex;flex-direction:column;min-width:0;flex:1;padding-top:1px}
.toast__title{font-size:14px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast__desc{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast__action{
align-self:center;flex:none;

border-radius:999px;padding:6px 12px 6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
transition:background 150ms ease,transform 150ms ease;
}
.toast__action:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.toast__close{
position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:999px;
border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;
display:inline-flex;align-items:center;justify-content:center;padding:0;
}
.toast__close:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.toast__bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;overflow:hidden}
.toast__bar i{display:block;height:100%;width:100%;background:var(--info);transform-origin:left;transition:transform linear}
@keyframes toast-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){
.toaster-demo__grid{grid-template-columns:1fr}
.wrap{padding:16px 12px 48px}
}
@media (hover:hover) and (pointer:fine){
.toaster-demo__btn:hover{background:var(--subtle);transform:translateY(-1px);box-shadow:var(--shadow)}
.theme-toggle:hover{background:var(--subtle);transform:translateY(-1px)}
.toast:hover{box-shadow:var(--toast-shadow)}
.toast__action:hover{background:var(--border)}
.toast__close:hover{background:var(--subtle);color:var(--ink)}
}
@media (prefers-reduced-motion:reduce){
.toast{animation:none;transition:none}
.toast__bar i{transition:none}
}
</style>
</head>

<header class="page-head"><div class="page-head__in">

}
el.addEventListener('pointerup',end);
el.addEventListener('pointercancel',end);
el.addEventListener('mousedown',function(e){
if(e.target&&e.target.closest&&(e.target.closest('.toast__action')||e.target.closest('.toast__close'))){return;}
drag=true;sx=e.clientX;dx=0;
el.setAttribute('data-dragging','true');
},true);
}
function paintThemeToggle(){
var btn=document.getElementById('theme-toggle');
if(!btn){return;}
while(btn.firstChild){btn.removeChild(btn.firstChild);}
var cur=document.documentElement.getAttribute('data-theme')||'light';
btn.appendChild(makeSvg(cur==='dark'?ICONS.sun:ICONS.moon,''));
btn.setAttribute('aria-label',cur==='dark'?'Switch to light theme':'Switch to dark theme');
}
function setTheme(next){
if(next!=='light'&&next!=='dark'){next='light';}
document.documentElement.setAttribute('data-theme',next);
try{localStorage.setItem('affectui-toaster-theme',next);}catch(e){}
paintThemeToggle();
}
function init(){
stack=document.getElementById('toast-stack');
if(!stack){return;}
var doc=document.getElementById('doc-icon');
if(doc){setIcon(doc,ICONS.doc);}
var saved=document.querySelectorAll('.toaster-demo__btn .bi');
for(var i=0;i<saved.length;i++){
(function(h){
var k=h.getAttribute('data-icon');
var d=ICONS[k]||ICONS.doc;
while(h.firstChild){h.removeChild(h.firstChild);}
h.appendChild(makeSvg(d,''));
})(saved[i]);
}
paintThemeToggle();
var toggle=document.getElementById('theme-toggle');
if(toggle){
toggle.addEventListener('click',function(){
var cur=document.documentElement.getAttribute('data-theme')||'light';
setTheme(cur==='dark'?'light':'dark');
});
toggle.addEventListener('pointerdown',function(){},true);
}
stack.addEventListener('pointerenter',function(){stack.setAttribute('data-expanded','true');});
stack.addEventListener('pointerleave',function(){if(records.length>2){stack.setAttribute('data-expanded','false');} });
stack.addEventListener('focusin',function(){stack.setAttribute('data-expanded','true');});
stack.addEventListener('focusout',function(){if(records.length>2){stack.setAttribute('data-expanded','false');}});
document.addEventListener('keydown',function(e){
if(e&&e.key==='F8'){if(e.preventDefault){e.preventDefault();}try{stack.focus();}catch(_){}stack.setAttribute('data-expanded','true');}
});
var grid=document.querySelector('.toaster-demo__grid');
if(grid){
grid.addEventListener('click',function(e){
var t=e.target&&e.target.closest?e.target.closest('[data-act]'):null;
if(!t){return;}
var a=t.getAttribute('data-act');
if(a==='save'){fireSave({});}
else if(a==='delete'){fireTrash({});}
else if(a==='upload'){fireUpload({});}
else if(a==='sync'){fireSync({});}
});
grid.addEventListener('pointerdown',function(){},true);
grid.addEventListener('mousedown',function(){},true);
}
window.setTimeout(function(){fireSave({duration:9000});},500);
window.setTimeout(function(){fireTrash({duration:9000});},1300);
window.setTimeout(function(){fireUpload({duration:9000});},2100);
window.__toaster={
show:showToast,update:updateToast,dismiss:dismissToast,promise:promiseToast,
fireSave:fireSave,fireTrash:fireTrash,fireRestored:fireRestored,
fireUpload:fireUpload,fireUploadFail:fireUploadFail,fireSync:fireSync,
stack:function(){return stack;},items:function(){return records.slice();},
setTheme:setTheme,icons:ICONS
};
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}
else{init();}
})();
</script>
</body>
</html>
