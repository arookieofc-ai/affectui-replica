<style>
:root{color-scheme:light dark}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html[data-theme="light"]{
--surface:#ffffff;--page:#fafaf9;--ink:#171717;--ink2:#1c1917;--muted:#78716c;--faint:#a8a29e;--subtle:#f5f5f4;--border:#e7e5e4;--chip:#f5f5f4;--hover:#f5f5f4;--card:#ffffff;--panel:#ffffff;--text:#1c1917;--line:#e7e5e4;--placeholder:#a8a29e;
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--card-shadow:0 0 0 0.5px rgba(0,0,0,.06),0 1px 1px -1px rgba(0,0,0,.1),0 1px 2px 0 rgba(0,0,0,.05);
--focus:rgba(0,96,226,.7);
--amber-bg:#fef3c7;--amber-tx:#92400e;--amber-dot:#f59e0b;
--auto:#0190fe;--approved:#c99a00;
}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--ink2:#ededed;--muted:#a1a1aa;--faint:#71717a;--subtle:#26262a;--border:#2e2e33;--chip:#26262a;--hover:#26262a;--card:#1c1c1f;--panel:#1c1c1f;--text:#ededed;--line:#2e2e33;--placeholder:#52525b;
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
--card-shadow:0 0 0 0.5px rgba(255,255,255,.08),0 1px 2px 0 rgba(0,0,0,.3);
--focus:rgba(77,141,255,.8);
--amber-bg:#451a03;--amber-tx:#fde68a;--amber-dot:#fbbf24;
--auto:#4fb0fe;--approved:#e6c24d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:20px;background:var(--page);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.page{max-width:1120px;margin:0 auto;padding:12px 12px 32px}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 4px 12px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.brand b{color:var(--ink);font-weight:600;font-size:13px}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:999px;background:var(--card);box-shadow:var(--card-shadow);border:1px solid var(--border);font-size:13px;color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.aga{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:560px}
.aga-head{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line)}
.aga-title{margin:0;font-size:13px;font-weight:600;line-height:20px;white-space:nowrap}
.seg{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:calc(var(--radius) - 4px);font-size:13px;color:var(--muted);white-space:nowrap;transition:background-color 150ms ease,color 150ms ease}
.seg button[aria-selected="true"]{background:var(--chip);color:var(--ink)}
.seg-n{font-size:12px;color:var(--faint)}
.search{display:flex;align-items:center;gap:6px;flex:0 1 200px;min-width:0;height:28px;margin-left:auto;padding:0 8px;border-radius:calc(var(--radius) - 4px);background:var(--chip);color:var(--faint);border:1px solid transparent;transition:background-color 150ms ease,box-shadow 150ms ease}
.search:focus-within{background:var(--card);box-shadow:var(--card-shadow);border-color:var(--border)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);outline:none;font-size:13px;height:100%;padding:0}
.search input::placeholder{color:var(--placeholder)}
.aga-scroll{max-height:640px;overflow-y:auto;padding:10px 8px 40px}
.aga-list{display:grid;gap:16px}
.day{display:grid;gap:4px}
.dhead{display:flex;align-items:center;gap:8px;min-height:32px;margin:0;padding:0 12px;border-radius:var(--radius);background:color-mix(in srgb,var(--ink) 4.5%,var(--panel));font-size:12.5px;font-weight:600}
.dhead-n{min-width:20px;padding:0 5px;border-radius:calc(var(--radius-sm) + 1px);background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:400;line-height:18px;text-align:center;color:var(--muted)}
.rows{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.row{position:relative;display:flex;align-items:center;gap:8px;min-height:56px;padding-right:10px;border-radius:calc(var(--radius-sm) + 3px);border:1px solid transparent;transition:background-color 140ms ease}
.row__main{display:flex;flex:1;align-items:center;gap:12px;min-width:0;min-height:56px;padding:8px 0 8px 12px;border-radius:calc(var(--radius-sm) + 3px);text-align:left;width:100%}
.row[data-selected]{background:var(--chip);border-color:var(--line)}
.row__time{flex:none;width:38px;font-size:12px;color:var(--faint)}
.row__text{display:grid;flex:1;min-width:0}
.row__line{overflow:hidden;font-size:13px;line-height:20px;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.row__sentence{position:relative;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 55%;background-size:0 1px;transition:color 400ms ease 300ms}
.row[data-undone] .row__sentence{background-size:100% 1px;color:var(--faint)}
.row[data-struck] .row__sentence{animation:strike 520ms cubic-bezier(.23,1,.32,1) both}
@keyframes strike{0%{background-size:0 1px;color:var(--ink)}60%{background-size:100% 1px;color:var(--ink)}100%{background-size:100% 1px;color:var(--faint)}}
.row__meta{display:flex;align-items:center;gap:5px;min-width:0;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.row__task{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--faint)}
.who{display:inline-flex;flex:none;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--auto)}
.who[data-by="approved"] .dot{background:var(--amber-dot)}
.row[data-undone] .dot{background:var(--faint)}
.row__end{display:flex;flex:none;justify-content:flex-end;min-width:84px}
.tag{padding:0 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:11px;font-weight:600;line-height:18px;color:var(--muted)}
.row[data-struck] .tag{animation:pop 360ms cubic-bezier(.23,1,.32,1) 360ms both}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.final{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--faint)}
.mark{display:grid;flex:none;place-items:center;border-radius:7px;background:var(--chip);color:var(--muted);font-weight:700;overflow:hidden;outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
html[data-theme="dark"] .mark{outline-color:rgba(255,255,255,.1)}
.mark[data-logo]{background:#fff;color:#444;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 1px 2px 0 rgba(0,0,0,.05)}
.btn{display:inline-flex;flex:none;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:calc(var(--radius) - 4px);background:var(--card);box-shadow:var(--card-shadow);border:1px solid var(--border);font-size:13px;font-weight:500;white-space:nowrap;transition:box-shadow 150ms ease,filter 150ms ease,transform 100ms ease}
.btn--sm{height:26px;font-size:12.5px}
.btn--dark{background:var(--ink);color:var(--page);border-color:transparent;box-shadow:none}
.btn:active{transform:scale(.97)}
.center{display:grid;place-items:center;padding:40px 24px 80px;text-align:center;color:var(--muted)}
.center h3{margin:8px 0 4px;color:var(--ink);font-size:14px}
.center p{margin:0 0 12px;font-size:13px;max-width:340px}
.detail{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px 16px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:12px}
.phead{display:flex;align-items:flex-start;gap:12px}
.ptitles{display:grid;gap:2px;min-width:0}
.ptitle{margin:0;font-size:15px;font-weight:600;line-height:22px;overflow-wrap:anywhere}
.ptitle[data-undone]{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.psub{overflow:hidden;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.props{display:grid;gap:2px;margin:0}
.props>div{display:grid;grid-template-columns:68px minmax(0,1fr);align-items:center;min-height:28px}
.props dt{font-size:12px;color:var(--muted)}
.props dd{display:flex;align-items:center;gap:6px;min-width:0;margin:0;font-size:13px;color:var(--ink)}
.props dd>span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.faint{color:var(--faint)}
.sect{display:grid;gap:8px}
.lbl{margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.card{margin:0;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow)}
.what{display:grid;gap:10px;padding:10px 12px}
.details{display:grid;gap:4px;margin:0}
.details>div{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px;font-size:13px;line-height:20px}
.details dt{color:var(--muted)}
.details dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.prev{margin:0;padding-left:10px;border-left:2px solid var(--line);font-size:13px;line-height:20px;color:var(--text);overflow-wrap:anywhere}
.prev:not([data-open]){display:-webkit-box;overflow:hidden;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.link{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:calc(var(--radius-sm) + 1px);color:var(--faint);padding:0 4px;transition:background-color 150ms ease,color 150ms ease}
.link--text{display:inline-flex;align-items:center;gap:2px;width:auto;margin-left:auto;font-size:12px;color:var(--muted)}
.why{display:grid;gap:6px;padding:10px 12px;font-size:13px}
.why .who{font-size:12px;font-weight:600;color:var(--ink)}
.why-text{margin:0;line-height:20px}
.rule{display:flex;align-items:center;gap:6px;min-width:0;margin:2px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px}
.rule>span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.undo{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);box-shadow:var(--card-shadow)}
.undo-t{display:grid;flex:1;min-width:0;font-size:12px;line-height:16px}
.undo-how{font-size:13px;line-height:20px;color:var(--ink)}
.note{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:13px;line-height:20px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.kbd-hint{font-size:12px;color:var(--faint)}
@media (hover:hover) and (pointer:fine){
.seg button:hover{color:var(--ink);background:var(--hover)}
.row:hover{background:var(--hover)}
.btn:hover{box-shadow:0 0 0 .5px var(--border),0 2px 4px rgba(0,0,0,.06);filter:brightness(1.02)}
.btn--dark:hover{filter:brightness(1.15)}
.link:hover{background:var(--chip);color:var(--ink)}
.themebtn:hover{filter:brightness(1.03)}
}
@media (prefers-reduced-motion:reduce){.row[data-struck] .row__sentence,.row[data-struck] .tag{animation:none}.row__sentence{transition:none}}
@media(max-width:560px){
.aga-title{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.search{flex:0 0 28px;justify-content:center}
.search input::placeholder{color:transparent}
.search:focus-within{flex:1 1 auto}
.aga-head:has(.search:focus-within) .seg{display:none}
.row__time{display:none}
.row__line{display:-webkit-box;white-space:normal;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row__end{min-width:0}
.row__end .btn>span{display:none}
.row__end .btn{width:28px;padding:0}
}

}

function move(d){
var list=Array.prototype.slice.call(els.agaList.querySelectorAll('.row__main')).filter(function(b){return !b.closest('li').hidden;});
if(!list.length)return;
var ix=list.indexOf(document.activeElement);
var nx=null;
if(ix<0){nx=list.filter(function(b){return b.dataset.id===state.sel;})[0]||list[0];}
else nx=list[Math.min(list.length-1,Math.max(0,ix+d))];
if(nx)nx.focus();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
/* expose for harness */
window.__aga={state:state,els:els,tick:tick,select:select,doUndo:doUndo,relayout:relayout,filtered:filtered};
})();
</script>
