var c=cardNodes[a.id];if(c){c.li.setAttribute('data-status',a.status);c.btn.setAttribute('aria-current',openId===a.id?'true':'false');if(c.btn.getAttribute('aria-current')==='false')c.btn.removeAttribute('aria-current');if(c.name.textContent!==a.name)c.name.textContent=a.name;if(c.role.textContent!==a.role)c.role.textContent=a.role;if(c.status.textContent!==(LABEL[a.status]))c.status.textContent=LABEL[a.status];c.status.setAttribute('data-status',a.status);
var busy=a.status==='working';var mk=c.mark;if((mk.hasAttribute('data-busy')?true:false)!==busy){if(busy)mk.setAttribute('data-busy','');else mk.removeAttribute('data-busy');}
var want=a.apps.length?('Access to '+a.apps.length+' '+(a.apps.length===1?'app':'apps')):'No app access yet';if(c.appText.textContent!==want)c.appText.textContent=want;
if(c.modelText.textContent!==a.model)c.modelText.textContent=a.model;
var rs=fmtCompact.format(a.runs)+' runs';if(c.runs.textContent!==rs){c.runs.textContent=rs;c.runs.setAttribute('title',fmtInt.format(a.runs)+' runs this week');}
var cs=money(a.cost);if(c.cost.textContent!==cs){c.cost.textContent=cs;c.cost.setAttribute('title',fmtEUR2.format(a.cost)+' this week');}
c.tile.style.setProperty('--agn-mark',a.color);
}
var r=rowNodes[a.id];if(r){r.li.setAttribute('data-status',a.status);r.btn.setAttribute('aria-current',openId===a.id?'true':'false');if(r.btn.getAttribute('aria-current')==='false')r.btn.removeAttribute('aria-current');if(r.name.textContent!==a.name)r.name.textContent=a.name;if(r.role.textContent!==a.role)r.role.textContent=a.role;if(r.status.textContent!==LABEL[a.status])r.status.textContent=LABEL[a.status];r.status.setAttribute('data-status',a.status);if(r.modelText.textContent!==a.model)r.modelText.textContent=a.model;var rr2=fmtCompact.format(a.runs);if(r.runs.textContent!==rr2)r.runs.textContent=rr2;var cc2=money(a.cost);if(r.cost.textContent!==cc2)r.cost.textContent=cc2;var busy2=a.status==='working';if((r.mark.hasAttribute('data-busy')?true:false)!==busy2){if(busy2)r.mark.setAttribute('data-busy','');else r.mark.removeAttribute('data-busy');}}
}
function updateAllCards(){for(var i=0;i<agents.length;i++)updateCard(agents[i]);updateToolbar();}
function updateDetail(){
var a=current();if(!a)return;
expandedInstr=false;
var tile=dRefs.tile;tile.textContent='';tile.style.setProperty('--agn-mark',a.color);tile.appendChild(mark(a.id,a.color,a.status==='working'));
if(dRefs.name.textContent!==a.name)dRefs.name.textContent=a.name;
dRefs.name.setAttribute('title',a.name);
if(dRefs.role.textContent!==a.role)dRefs.role.textContent=a.role;
dRefs.role.setAttribute('title',a.role);
dRefs.dot.setAttribute('data-status',a.status);
var stxt=a.status==='working'?(a.doing||'Working'):LABEL[a.status];
if(dRefs.statusText.textContent!==stxt)dRefs.statusText.textContent=stxt;
dRefs.modLogo.textContent='';dRefs.modLogo.appendChild(modelMark(a.model).firstChild||document.createTextNode(''));
if(dRefs.modText.textContent!==a.model)dRefs.modText.textContent=a.model;
var initials=a.owner?a.owner.split(' ').map(function(s){return s[0];}).slice(0,2).join(''):'';
if(dRefs.avatar.textContent!==initials)dRefs.avatar.textContent=initials;
if(dRefs.owner.textContent!==a.owner)dRefs.owner.textContent=a.owner||'';
var showLast=(a.status!=='working'&&a.lastRun);
dRefs.dtLast.hidden=!showLast;dRefs.ddLast.hidden=!showLast;
if(showLast){var lr=rel(a.lastRun,nowMs);if(dRefs.lastRan.textContent!==lr)dRefs.lastRan.textContent=lr;}
var paused=(a.status==='paused');
dRefs.pause.setAttribute('aria-label',paused?'Resume':'Pause');
dRefs.pauseIcon.setAttribute('d',paused?'M8 5v14l11-7Z':'M9 5v14M15 5v14');
/* chart */
var data=chartData(a);var sc=chartScale(data);var max=sc;
if(dRefs.chartRight.textContent!==(fmtInt.format(a.runs)+' this week \u00B7 '+fmtEUR2.format(a.cost)))dRefs.chartRight.textContent=fmtInt.format(a.runs)+' this week \u00B7 '+fmtEUR2.format(a.cost);
dRefs.y0.textContent=fmtInt.format(max);dRefs.y1.textContent=fmtInt.format(max/2);dRefs.y2.textContent='0';
dRefs.chart.style.setProperty('--agn-tone',a.color);
if(paused)dRefs.chart.setAttribute('data-off','');else dRefs.chart.removeAttribute('data-off');
for(var i=0;i<14;i++){var b=dRefs.bars[i];var v=data[i]||0;var h=v?(Math.max(4,v/max*100)+'%'):'2px';if(b.style.height!==h)b.style.height=h;var isNow=i>=7;if((b.hasAttribute('data-now')?true:false)!==isNow){if(isNow)b.setAttribute('data-now','');else b.removeAttribute('data-now');}b.style.setProperty('animation-delay',(i*24)+'ms');}
/* instructions */
if(a.instructions){dRefs.instrSec.hidden=false;if(dRefs.instr.textContent!==a.instructions)dRefs.instr.textContent=a.instructions;dRefs.instr.removeAttribute('data-more');dRefs.showBtn.textContent='Show all';dRefs.showBtn.setAttribute('aria-expanded','false');var need=a.instructions.length>140;dRefs.showBtn.hidden=!need;}else dRefs.instrSec.hidden=true;
/* skills/apps */
dRefs.skTags.textContent='';dRefs.appTags.textContent='';
if(a.skills&&a.skills.length){dRefs.skLab.hidden=false;dRefs.skTags.hidden=false;for(var s=0;s<a.skills.length;s++){var tg=el('span','tag',a.skills[s]);dRefs.skTags.appendChild(tg);}}else{dRefs.skLab.hidden=true;dRefs.skTags.hidden=true;}
if(a.apps&&a.apps.length){dRefs.appLab.hidden=false;dRefs.appTags.hidden=false;for(var q=0;q<a.apps.length;q++){var ta=el('span','tag');ta.appendChild(appTile(a.apps[q]));ta.appendChild(el('span',null,a.apps[q]));dRefs.appTags.appendChild(ta);}}else{dRefs.appLab.hidden=true;dRefs.appTags.hidden=true;}
/* recent */
if(a.recent&&a.recent.length){dRefs.recList.hidden=false;dRefs.recEmpty.hidden=true;for(var r=0;r<3;r++){var row=dRefs.recRows[r];if(r<a.recent.length){row.li.hidden=false;var it=a.recent[r];row.dot.setAttribute('data-state',it.state);if(row.title.textContent!==it.title)row.title.textContent=it.title;row.title.setAttribute('title',it.title);var when=it.state==='running'?'now':rel(it.at,nowMs);if(row.when.textContent!==when)row.when.textContent=when;}else row.li.hidden=true;}}else{dRefs.recList.hidden=true;dRefs.recEmpty.hidden=false;}
detail.setAttribute('aria-label',a.name);
}
function select(id){if(openId!==id){openId=id;expandedInstr=false;updateAllCards();updateDetail();}else{openId=id;updateAllCards();}}
function setFilter(k){if(filter===k)return;filter=k;updateToolbar();}
function setView(v){if(view===v)return;view=v;updateToolbar();}
function togglePause(id){for(var i=0;i<agents.length;i++){if(agents[i].id===id){var a=agents[i];var toPaused=(a.status!=='paused');if(toPaused){a.status='paused';a.doing=undefined;if(!a.lastRun)a.lastRun=Date.now();showToast(a.name+' paused');}else{a.status='idle';showToast(a.name+' is back');}updateCard(a);if(a.id===openId)updateDetail();updateToolbar();break;}}}
function showToast(msg){toast.textContent=msg;toast.hidden=false;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.hidden=true;},1400);}
function tick(){
var key=ROT_KEYS[tickIdx%ROT_KEYS.length];tickIdx++;
for(var i=0;i<agents.length;i++){var a=agents[i];if(a.id!==key||a.status!=='working')continue;var seq=ROT[key];if(!seq)continue;var ix=seq.indexOf(a.doing||'');var nx=(ix+1)%seq.length;a.doing=seq[nx];if(ix===seq.length-1)a.runs+=1;updateCard(a);if(a.id===openId)updateDetail();break;}
}
function tickNow(){nowMs=Date.now();var a=current();if(a&&a.lastRun){var lr=rel(a.lastRun,nowMs);if(dRefs.lastRan.textContent!==lr)dRefs.lastRan.textContent=lr;}for(var i=0;i<a.recent.length;i++){var row=dRefs.recRows[i];if(!row||row.li.hidden)continue;var it=a.recent[i];var when=it.state==='running'?'now':rel(it.at,nowMs);if(row.when.textContent!==when)row.when.textContent=when;}}
/* modal */
function slug(name){return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'agent';}
function refreshModal(){
var base=slug(fName.value);var id=base;var taken={};for(var i=0;i<agents.length;i++)taken[agents[i].id]=1;var n=2;while(taken[id]){id=base+'-'+n;n++;}
mPreview.textContent='';mPreview.style.setProperty('--agn-mark',newColor);mPreview.appendChild(mark(id,newColor,false,'lg'));
mModels.textContent='';for(var j=0;j<MODELS.length;j++){var mm=MODELS[j];var b=el('button',null,null);b.setAttribute('type','button');b.setAttribute('role','radio');b.setAttribute('aria-checked',newModel===mm?'true':'false');b.appendChild(modelMark(mm));b.appendChild(el('span',null,mm));(function(v,btn){btn.addEventListener('click',function(){newModel=v;refreshModal();});})(mm,b);mModels.appendChild(b);}
mColors.textContent='';for(var k=0;k<COLORS.length;k++){var cc=COLORS[k];var sw=el('button');sw.setAttribute('type','button');sw.setAttribute('role','radio');sw.setAttribute('aria-checked',newColor===cc?'true':'false');sw.setAttribute('aria-label',cc);sw.style.setProperty('--sw',cc);(function(v){sw.addEventListener('click',function(){newColor=v;refreshModal();});})(cc);mColors.appendChild(sw);}
var ok=fName.value.trim()&&fRole.value.trim();mCreate.disabled=!ok;
mCreate.setAttribute('data-id',id);
}
function openModal(){modal.hidden=false;refreshModal();setTimeout(function(){try{fName.focus();}catch(e){}},0);}
function closeModal(){modal.hidden=true;try{document.getElementById('newBtn').focus();}catch(e){}}
/* theme */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('affectui-agents-theme',t);}catch(e){}var dark=(t==='dark');document.getElementById('themeLabel').textContent=dark?'Light':'Dark';}
function initTheme(){var t=null;try{t=localStorage.getItem('affectui-agents-theme');}catch(e){}if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){t='light';}}setTheme(t||'light');}
/* init */
buildToolbar();buildCards();buildDetail();updateAllCards();updateDetail();initTheme();
document.getElementById('themeBtn').addEventListener('click',function(){var cur=document.documentElement.getAttribute('data-theme');setTheme(cur==='dark'?'light':'dark');});
var newBtn=document.getElementById('newBtn');
newBtn.addEventListener('pointerdown',function(){openModal();},{capture:true});
newBtn.addEventListener('click',function(){if(modal.hidden)openModal();});
newBtn.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&modal.hidden){openModal();}});
document.getElementById('mClose').addEventListener('click',closeModal);
document.getElementById('mCancel').addEventListener('click',closeModal);
modal.addEventListener('pointerdown',function(e){if(e.target===modal)closeModal();});
fName.addEventListener('input',refreshModal);fRole.addEventListener('input',refreshModal);
mCreate.addEventListener('click',function(){
var id=mCreate.getAttribute('data-id')||slug(fName.value);
var nm=fName.value.trim(),rl=fRole.value.trim();if(!nm||!rl)return;
var na={id:id,name:nm,role:rl,color:newColor,model:newModel,status:'idle',runs:0,cost:0,lastRun:undefined,instructions:('You are '+nm+'. '+rl+'.'),skills:[],apps:[],recent:[]};
agents.push(na);
/* build new card nodes in place (state change, not timer) */
var li=el('li','card');li.setAttribute('data-status',na.status);
var btn=el('button','card-main');btn.setAttribute('data-agent',na.id);
var top=el('span','card-top');var tile=el('span','tile');tile.appendChild(mark(na.id,na.color,false));var titles=el('span','titles');var nme=el('span','name',na.name);var rle=el('span','role',na.role);titles.appendChild(nme);titles.appendChild(rle);var st=statusPill(na.status);top.appendChild(tile);top.appendChild(titles);top.appendChild(st);
var apps=el('span','apps',na.apps.length?('Access to '+na.apps.length+' apps'):'No app access yet');
var foot=el('span','foot');var chip=el('span','chip');chip.appendChild(modelMark(na.model));chip.appendChild(el('span',null,na.model));var stats=el('span','stats');stats.appendChild(el('span',null,'0 runs'));stats.appendChild(el('span',null,money(0)));foot.appendChild(chip);foot.appendChild(stats);
btn.appendChild(top);btn.appendChild(apps);btn.appendChild(foot);
btn.addEventListener('click',function(){select(na.id);});
li.appendChild(btn);grid.appendChild(li);
cardNodes[na.id]={li:li,btn:btn,tile:tile,mark:tile.firstChild,name:nme,role:rle,status:st,tiles:null,appText:apps,appsWrap:apps,modelText:chip.lastChild,runs:stats.firstChild,cost:stats.lastChild};
var rli=document.createElement('li');rli.setAttribute('class','row');var rb=el('button','row-main');rb.setAttribute('data-agent',na.id);rb.appendChild(mark(na.id,na.color,false));rb.appendChild(el('b','rname',na.name));rb.appendChild(el('span','rrole',na.role));var rtag=el('span','rtag');rtag.appendChild(statusPill(na.status));rb.appendChild(rtag);var rmod=el('span','rmodel');rmod.appendChild(modelMark(na.model));rmod.appendChild(el('span',null,na.model));rb.appendChild(rmod);rb.appendChild(el('span','rnum','0'));rb.appendChild(el('span','rnum',money(0)));rb.addEventListener('click',function(){select(na.id);});rli.appendChild(rb);rows.appendChild(rli);
rowNodes[na.id]={li:rli,btn:rb,mark:rb.firstChild,name:rb.childNodes[1],role:rb.childNodes[2],status:rtag.firstChild,modelText:rmod.lastChild,runs:rb.childNodes[5],cost:rb.childNodes[6]};
freshId=na.id;openId=na.id;filter='all';fName.value='';fRole.value='';closeModal();updateAllCards();updateDetail();showToast(na.name+' joined the team');
setTimeout(function(){freshId=null;},1400);
});
document.addEventListener('keydown',function(e){
if(e.defaultPrevented||e.metaKey||e.ctrlKey||e.altKey||e.isComposing)return;
var ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable))return;
if(document.querySelector('.modal:not([hidden])')){if(e.key==='Escape'){closeModal();}return;}
var k=(e.key||'').toLowerCase();
if(k==='j'||k==='k'){var ids=agents.filter(function(a){return filter==='all'||a.status===filter;}).map(function(a){return a.id;});if(!ids.length)return;var ix=ids.indexOf(openId);var nx=k==='j'?Math.min(ids.length-1,ix+1):Math.max(0,ix-1);if(ix<0)nx=0;select(ids[nx]);var bn=cardNodes[ids[nx]];if(bn&&view==='grid')bn.btn.focus();else if(rowNodes[ids[nx]])rowNodes[ids[nx]].btn.focus();}
});
setInterval(tick,2600);
setInterval(tickNow,30000);
/* test hook */
try{window.__agn={agents:agents,tick:tick,tickNow:tickNow,select:select,get filter(){return filter;},get view(){return view;},get openId(){return openId;},cardNodes:cardNodes,rowNodes:rowNodes,rot:ROT,pixelPattern:pixelPattern,chartData:chartData,rel:rel};}catch(e){}
/* keyboard arrows for cards */
grid.addEventListener('keydown',function(e){if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].indexOf(e.key)>=0){e.preventDefault();var ids=agents.filter(function(a){return filter==='all'||a.status===filter;}).map(function(a){return a.id;});var ix=ids.indexOf(document.activeElement&&document.activeElement.getAttribute?document.activeElement.getAttribute('data-agent'):null);var d=(e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1;var nx=Math.min(ids.length-1,Math.max(0,(ix<0?0:ix+d)));select(ids[nx]);if(cardNodes[ids[nx]])cardNodes[ids[nx]].btn.focus();}});
rows.addEventListener('keydown',function(e){if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].indexOf(e.key)>=0){e.preventDefault();var ids=agents.filter(function(a){return filter==='all'||a.status===filter;}).map(function(a){return a.id;});var ix=ids.indexOf(document.activeElement&&document.activeElement.getAttribute?document.activeElement.getAttribute('data-agent'):null);var d=(e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1;var nx=Math.min(ids.length-1,Math.max(0,(ix<0?0:ix+d)));select(ids[nx]);if(rowNodes[ids[nx]])rowNodes[ids[nx]].btn.focus();}});
})();
