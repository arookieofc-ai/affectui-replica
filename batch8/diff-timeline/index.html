function scaleFor(peak){var t=Math.max(30,peak)*1.04,n=Math.max(1,Math.pow(10,Math.floor(Math.log10(t/4))));
  var cands=[1,2,2.5,5,10];
  for(var k=0;k<cands.length;k++){var st=cands[k]*n,rows=Math.ceil(t/st);if(rows<=4)return{step:st,rows:Math.max(3,rows)};}
  return{step:10*n,rows:4};}
function fileKind(f){var b=f.slice(f.lastIndexOf("/")+1),e=b.indexOf(".")>=0?b.slice(b.lastIndexOf(".")+1).toLowerCase():"";
  if(!e)return"folder";
  if(["csv","xls","xlsx","ods","tsv"].indexOf(e)>=0)return"sheet";
  if(["png","jpg","jpeg","gif","webp","svg","avif","ico"].indexOf(e)>=0)return"image";
  if(["json","yaml","yml","js","ts","tsx","jsx","mjs","py","sh","toml","sql","css","scss","html"].indexOf(e)>=0)return"code";
  return"doc";}

var state={el:0,playing:true,hoverIdx:null,hoverFile:null,lastRenderedEl:-1,lastRenderedCount:-1,lastHoverKey:""};
var sorted=EDITS.slice().sort(function(a,b){return a.at-b.at;});
var files=[];sorted.forEach(function(e){if(files.indexOf(e.file)<0)files.push(e.file);});
var peak=0;sorted.forEach(function(e){peak=Math.max(peak,e.added,e.removed);});
var sc=scaleFor(peak),DMAX=sc.step*sc.rows;
var ramp=DURATION*0.03;

function levelAt(t){var a=0,r=0;for(var i=0;i<sorted.length;i++){var e=sorted[i];if(e.at>t)break;
  var k=smooth((t-e.at)/ramp);a+=e.added*k;r+=e.removed*k;}return{a:a,r:r};}
function visibleEdits(el){return sorted.filter(function(e){return e.at<=el;});}

var $=function(id){return document.getElementById(id);};
var markEl=$("mark"),statusEl=$("status"),tadd=$("tadd"),tdel=$("tdel"),tacross=$("tacross"),
    liveb=$("liveb"),scaleEl=$("scale"),chart=$("chart"),wrap=$("chartwrap"),svg=$("svg"),
    grid=$("grid"),base=$("base"),fillAdd=$("fillAdd"),fillDel=$("fillDel"),
    lineNet=$("lineNet"),lineDel=$("lineDel"),lineAdd=$("lineAdd"),nowline=$("nowline"),
    dots=$("dots"),pins=$("pins"),axis=$("axis"),guide=$("guide"),tip=$("tip"),
    scroll=$("scroll"),cur=$("cur"),none=$("none"),fileul=$("fileul"),
    netb=$("netb"),projsub=$("projsub"),panel=$("filespanel");

/* build 9-cell pixel mark (exactly 9 cells) */
(function(){var cells=markFor(AGENT.id),delays=[0,120,240,120,240,360,240,360,480];
  markEl.innerHTML="";cells.forEach(function(on,i){var c=document.createElement("i");
    if(on)c.className="on";c.style.animationDelay=delays[i]+"ms";markEl.appendChild(c);});})();

function glyphSVG(kind){
  var col=kind==="code"?"code":kind==="image"?"image":kind==="sheet"?"sheet":kind==="folder"?"folder":"doc";
  var inner=col==="folder"
    ?'<path d="M1.4 3.1c0-.72.58-1.3 1.3-1.3h1.72c.38 0 .73.19.94.5l.6.9h3.34c.72 0 1.3.58 1.3 1.3V6H1.4Z" fill="currentColor"/><path d="M1 6.95C.86 6.3 1.36 5.7 2.02 5.7h7.96c.66 0 1.16.6 1.02 1.25l-.5 2.4a1.3 1.3 0 0 1-1.27 1.05H2.77A1.3 1.3 0 0 1 1.5 9.35Z" fill="currentColor" opacity="0.45"/>'
    :'<path d="M3.3 1h3.9L10 3.8v6.4c0 .72-.58 1.3-1.3 1.3H3.3c-.72 0-1.3-.58-1.3-1.3V2.3C2 1.58 2.58 1 3.3 1Z" fill="currentColor" opacity="0.45"/><path d="M7.2 1v1.8c0 .55.45 1 1 1H10Z" fill="currentColor"/>'
      +(col==="sheet"
        ?'<rect x="3.4" y="5.6" width="2.3" height="1.6" rx="0.4" fill="currentColor"/><rect x="6.3" y="5.6" width="2.3" height="1.6" rx="0.4" fill="currentColor"/><rect x="3.4" y="7.8" width="2.3" height="1.6" rx="0.4" fill="currentColor"/><rect x="6.3" y="7.8" width="2.3" height="1.6" rx="0.4" fill="currentColor"/>'
        :'<path d="M4 6.6h4M4 8.6h2.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>');
  return '<svg class="glyph '+col+'" width="14" height="14" viewBox="0 0 12 12" fill="none" aria-hidden="true">'+inner+'</svg>';
}

function chartW(){return Math.max(0,wrap.clientWidth||wrap.getBoundingClientRect().width||0);}
function X(at,w){return clamp(at,0,DURATION)/DURATION*w;}
function Y(v){return CH*(1-clamp(v,0,DMAX)/DMAX);}

function pathFor(kind,w){
  var R=clamp(state.el,0,DURATION),xe=X(R,w),pts=[],n=Math.max(1,Math.floor(xe/2));
  var d="";
  for(var i=0;i<=n;i++){var px=i<n?i*2:xe,t=px/w*DURATION,L=levelAt(t);
    var v=kind==="add"?L.a:kind==="del"?L.r:L.a-L.r;
    d+=(i===0?"M":"L")+px.toFixed(1)+" "+Y(v).toFixed(1);}
  return d;
}
function areaFor(d,xe){return d?d+("L"+xe.toFixed(1)+" "+CH+"L0 "+CH+"Z"):"";}

function nearestIdx(clientX){
  var vis=visibleEdits(state.el);if(!vis.length)return null;
  var r=wrap.getBoundingClientRect(),t=(clientX-r.left)/r.width*DURATION,best=0;
  for(var i=1;i<vis.length;i++)if(Math.abs(vis[i].at-t)<Math.abs(vis[best].at-t))best=i;
  var gi=sorted.indexOf(vis[best]);return gi;
}

function renderHeader(vis,live){
  var a=0,r=0;vis.forEach(function(e){a+=e.added;r+=e.removed;});
  tadd.textContent=fmtFull(a,"+");tdel.textContent=fmtFull(r,"−");
  var nf={};vis.forEach(function(e){nf[e.file]=1;});var n=Object.keys(nf).length;
  tacross.textContent="across "+n+" "+(n===1?"file":"files");
  netb.textContent=(a-r>=0?fmtFull(a-r,"+"):fmtFull(r-a,"−"));
  var last=vis[vis.length-1];
  statusEl.innerHTML="";
  if(live&&last){var sp=splitPath(last.file);
    var ed=document.createElement("span");ed.className="ed";ed.textContent="Editing";statusEl.appendChild(ed);
    var d=document.createElement("span");d.className="dir";d.textContent=sp.dir;statusEl.appendChild(d);
    var f=document.createElement("span");f.className="file";f.textContent=sp.name;statusEl.appendChild(f);
  }else if(vis.length){statusEl.textContent="Done · "+vis.length+" "+(vis.length===1?"edit":"edits")+" in "+fmtTime(state.el);}
  else if(live){statusEl.textContent="Waiting for the first edit…";}
  else{statusEl.textContent="No edits";}
  liveb.hidden=!live;markEl.classList.toggle("busy",!!live);
  projsub.textContent=live?("live · "+vis.length+"/"+sorted.length+" edits · "+fmtTime(state.el)+" / "+fmtTime(DURATION))
    :("done · "+vis.length+" edits in "+fmtTime(state.el)+" · +"+a.toLocaleString("en-US")+" −"+r.toLocaleString("en-US"));
}

function renderChart(){
  var w=chartW();
  base.setAttribute("x2",w);base.setAttribute("y1",CH-.5);base.setAttribute("y2",CH-.5);
  grid.innerHTML="";
  for(var r=1;r<=sc.rows;r++){var yy=Math.round(Y(r*sc.step))+.5;
    var ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("class","grid");ln.setAttribute("x1",0);ln.setAttribute("x2",w);
    ln.setAttribute("y1",yy);ln.setAttribute("y2",yy);grid.appendChild(ln);}
  var da=pathFor("add",w),dd=pathFor("del",w),dn=pathFor("net",w);
  lineAdd.setAttribute("d",da);lineDel.setAttribute("d",dd);lineNet.setAttribute("d",dn);
  var live0=state.playing&&state.el<MAXEL;
  var R=clamp(state.el,0,DURATION),xe=X(R,w);
  fillAdd.setAttribute("d",areaFor(da,xe));fillDel.setAttribute("d",areaFor(dd,xe));
  var live=live0,vis=visibleEdits(state.el);
  nowline.hidden=!(live&&vis.length);nowline.setAttribute("x1",xe);nowline.setAttribute("x2",xe);
  /* dots */
  dots.innerHTML="";
  function dot(kind,x,y,glow){var s=document.createElement("span");s.className="dot "+kind+(glow?" glow":"");
    s.style.left=x+"px";s.style.top=y+"px";dots.appendChild(s);}
  var hov=state.hoverIdx!==null?sorted[state.hoverIdx]:null;
  var hovVis=hov&&hov.at<=state.el?hov:null;
  if(vis.length&&!hovVis){var L=levelAt(R);
    dot("net",xe,Y(L.a-L.r),false);dot("del",xe,Y(L.r),live);dot("add",xe,Y(L.a),live);}
  if(!vis.length&&live){dot("wait",0,CH,true);}
  if(hovVis){var q=Math.min(hovVis.at+ramp,R),L2=levelAt(q);
    dot("del",X(q,w),Y(L2.r),false);dot("add",X(q,w),Y(L2.a),false);}
  /* pins for hovered file */
  pins.innerHTML="";
  if(state.hoverFile){vis.forEach(function(e){if(e.file!==state.hoverFile)return;
    var s=document.createElement("span");
    s.className="pin "+(e.added+e.removed===0?"bin":e.added>=e.removed?"add":"del");
    s.style.left=X(e.at,w)+"px";pins.appendChild(s);});}
  /* axis */
  axis.innerHTML="";
  var st=axisStep(DURATION),k=0;
  for(var t=0;t<=DURATION+.01;t+=st,k++){
    var s=document.createElement("span");s.textContent=fmtTime(t);s.style.left=(t/DURATION*100)+"%";
    if(t===0)s.className="start";else if(t>=DURATION)s.className="end";axis.appendChild(s);}
  /* guide + tooltip */
  if(hovVis){
    var q2=Math.min(hovVis.at+ramp,R),L3=levelAt(q2),gx=X(q2,w);
    guide.hidden=false;guide.style.left=gx+"px";
    var left=clamp(gx>w/2?gx-14-TIPW:gx+14,-36,Math.max(-36,w-TIPW));
    tip.style.left=left+"px";tip.classList.add("open");
    var sp=splitPath(hovVis.file);
    var rows='<div><dt>Added</dt><dd><b>'+Math.round(L3.a).toLocaleString("en-US")+'</b><span>'+fmtFull(hovVis.added,"+")+'</span></dd></div>'
      +'<div class="del"><dt>Removed</dt><dd><b>'+Math.round(L3.r).toLocaleString("en-US")+'</b><span>'+fmtFull(hovVis.removed,"−")+'</span></dd></div>';
    var extra=(hovVis.added+hovVis.removed===0)
      ?'<p class="tipnote">Binary file changed</p>'
      :(hovVis.diff&&hovVis.diff.length?'<pre class="diff" aria-label="Changed lines">'+hovVis.diff.slice(0,4).map(function(l){
          var sym=l.kind==="add"?"+":l.kind==="del"?"−":" ";
          return '<code class="'+l.kind+'"><span>'+sym+'</span>'+escapeHtml(l.text)+'</code>';}).join("")+'</pre>':"");
    tip.innerHTML='<p class="tiphead" style="margin:0"><span class="tippath"><span class="dir">'+escapeHtml(sp.dir)+
      '</span><span>'+escapeHtml(sp.name)+'</span></span><span class="tiptime">'+fmtTime(hovVis.at)+'</span></p>'
      +'<dl class="tirows" style="margin-bottom:0">'+rows+'</dl>'+extra;
  }else{tip.classList.remove("open");tip.innerHTML="";guide.hidden=true;}
  /* scale */
  scaleEl.innerHTML="";
  for(var rr=sc.rows;rr>=0;rr--){var lab=document.createElement("span");
    lab.style.top=((sc.rows-rr)/sc.rows*100)+"%";
    lab.textContent=DMAX>=1e4?(rr*sc.step>=1e4?(rr*sc.step/1e3).toFixed(rr*sc.step>=1e5?0:1)+"k":(rr*sc.step).toLocaleString("en-US")):(rr*sc.step).toLocaleString("en-US");
    scaleEl.appendChild(lab);}
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

var builtFilesFor=-1;
function renderFiles(vis,live){
  var key=vis.length+"|"+(state.hoverFile||"")+"|"+(state.hoverIdx===null?"":sorted[state.hoverIdx].file);
  if(builtFilesFor===key)return;builtFilesFor=key;
  var max=1;files.forEach(function(f){var t=0;vis.forEach(function(e){if(e.file===f)t+=e.added+e.removed;});max=Math.max(max,t);});
  fileul.innerHTML="";
  scroll.style.setProperty("--rows",Math.max(1,Math.min(files.length,7)));
  if(!files.length||!vis.length){none.hidden=false;none.textContent=live?"Files show up here as the agent edits them":"No files changed";cur.hidden=true;}
  else none.hidden=true;
  files.forEach(function(f){
    var mine=vis.filter(function(e){return e.file===f;});
    var li=document.createElement("li");li.className="row";
    if(!mine.length){li.setAttribute("aria-hidden","true");fileul.appendChild(li);return;}
    var a=0,r=0;mine.forEach(function(e){a+=e.added;r+=e.removed;});
    var sp=splitPath(f);
    var on=(state.hoverIdx!==null&&sorted[state.hoverIdx].file===f)||state.hoverFile===f;
    if(on)li.classList.add("on");
    var lit=state.hoverIdx!==null&&sorted[state.hoverIdx]&&mine.indexOf(sorted[state.hoverIdx])>=0;
    if(lit)li.classList.add("lit");
    li.innerHTML=glyphSVG(fileKind(f))
      +'<span class="path" title="'+escapeHtml(f)+'"><span class="dir">'+escapeHtml(sp.dir)+'</span><span>'+escapeHtml(sp.name)+'</span></span>'
      +'<span class="track"><span class="bar" style="width:'+(Math.max(a+r,1)/max*100).toFixed(1)+'%">'
      +mine.map(function(e){if(e.added+e.removed===0)return '<i class="pc bin'+(sorted[state.hoverIdx]===e?" hot":"")+'"></i>';
        var hot=sorted[state.hoverIdx]===e?" hot":"";
        return '<span class="edit'+hot+'">'+(e.added?'<i class="pc add" style="flex-grow:'+e.added+'"></i>':"")+(e.removed?'<i class="pc del" style="flex-grow:'+e.removed+'"></i>':"")+'</span>';}).join("")
      +'</span></span>'
      +'<span class="count">'+((a+r===0)?'<span class="binlbl">binary</span>'
        :'<span class="'+(a?"a":"z")+'"><span class="full">'+fmtFull(a,"+")+'</span><span class="brief">'+fmtBrief(a,"+")+'</span></span>'
        +'<span class="'+(r?"d":"z")+'"><span class="full">'+fmtFull(r,"−")+'</span><span class="brief">'+fmtBrief(r,"−")+'</span></span>')+'</span>';
    (function(file){li.addEventListener("pointerenter",function(){state.hoverFile=file;requestRender();});
      li.addEventListener("pointerleave",function(){state.hoverFile=null;requestRender();});})(f);
    fileul.appendChild(li);
  });
  panel.classList.toggle("dim",!!(state.hoverIdx!==null||state.hoverFile));
  var last=vis[vis.length-1],qi=last?files.indexOf(last.file):-1;
  if(live&&qi>=0){cur.hidden=false;cur.style.transform="translateY("+(qi*100)+"%)";}
  else cur.hidden=true;
  scroll.classList.toggle("more",files.length>7);
}

/* render only when state actually changes (never rebuild in a blind fast loop) */
var rafQueued=false;
function requestRender(){if(rafQueued)return;rafQueued=true;
  (window.requestAnimationFrame||function(f){return setTimeout(f,16);})(function(){rafQueued=false;render();});}
function render(){
  var live=state.playing&&state.el<MAXEL,vis=visibleEdits(state.el);
  var elQ=Math.round(state.el*2)/2;
  if(elQ!==state.lastRenderedEl||vis.length!==state.lastRenderedCount||true){
    renderHeader(vis,live);renderChart();
    state.lastRenderedEl=elQ;state.lastRenderedCount=vis.length;
  }
  renderFiles(vis,live);
}

/* playback: 18 units/sec, 600ms lead-in; any trusted pointer interaction settles to end */
var rafId=0,startT=0;
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function stopLive(){if(state.playing&&state.el<MAXEL){state.el=MAXEL;state.playing=false;render();}else state.playing=false;}
function settle(e){if(e&&e.isTrusted===false)return;
  if(state.playing&&state.el<MAXEL){state.el=MAXEL;state.playing=false;render();}}
function loop(now){
  if(!state.playing)return;
  if(!startT)startT=now;
  var el=Math.max(0,(now-startT)/1e3*RATE);
  if(el>=307){startT=now+600;}
  var next=Math.min(MAXEL,el);
  if(Math.abs(next-state.el)>0.01){state.el=next;render();}
  if(next>=MAXEL){state.playing=false;render();return;}
  rafId=(window.requestAnimationFrame||function(f){return setTimeout(function(){f(Date.now());},16);})(loop);
}
function replay(){cancel();state.el=0;state.playing=true;state.hoverIdx=null;startT=0;
  if(reduceMotion){state.el=MAXEL;state.playing=false;render();return;}
  state.lastRenderedEl=-1;render();
  rafId=(window.requestAnimationFrame||function(f){return setTimeout(function(){f(Date.now());},16);})(loop);}
function cancel(){try{(window.cancelAnimationFrame||clearTimeout)(rafId);}catch(e){}rafId=0;}

/* hover: pointermove + pointerdown(capture) so a real click is never lost across a rebuild */
chart.addEventListener("pointermove",function(e){settleHover(e);});
chart.addEventListener("pointerdown",function(e){settleHover(e);},true);
chart.addEventListener("pointerleave",function(){if(state.hoverIdx!==null){state.hoverIdx=null;requestRender();}});
chart.addEventListener("focus",function(e){if(e.currentTarget.matches&&e.currentTarget.matches(":focus-visible")&&visibleEdits(state.el).length){state.hoverIdx=sorted.indexOf(visibleEdits(state.el)[visibleEdits(state.el).length-1]);requestRender();}});
chart.addEventListener("blur",function(){state.hoverIdx=null;requestRender();});
function settleHover(e){
  if(!visibleEdits(state.el).length)return;
  var i=nearestIdx(e.clientX===undefined?(wrap.getBoundingClientRect().left+1):e.clientX);
  if(i!==state.hoverIdx){state.hoverIdx=i;requestRender();}
}
chart.addEventListener("keydown",function(e){
  var vis=visibleEdits(state.el);if(!vis.length)return;
  var last=vis.length,curIdx=state.hoverIdx===null?last:(sorted.indexOf(sorted[state.hoverIdx])>=0?vis.indexOf(sorted[state.hoverIdx]):last);
  var n;
  if(e.key==="ArrowRight")n=Math.min(last-1,(state.hoverIdx===null?last-1:curIdx+1));
  else if(e.key==="ArrowLeft")n=Math.max(0,curIdx-1);
  else if(e.key==="Home")n=0;else if(e.key==="End")n=last-1;
  else if(e.key==="Escape")n=null;else return;
  e.preventDefault();
  state.hoverIdx=(n===null?null:sorted.indexOf(vis[n]));requestRender();
});
/* trusted interaction anywhere on the demo settles live playback (mirrors original capture-to-end) */
document.getElementById("dtl").addEventListener("pointermove",function(e){if(e.isTrusted!==false)settle(e);},{capture:true});
document.getElementById("dtl").addEventListener("pointerdown",function(e){if(e.isTrusted!==false)settle(e);},{capture:true});
document.getElementById("dtl").addEventListener("keydown",function(e){if(e.isTrusted!==false&&/Arrow|Home|End/.test(e.key||""))settle(e);},{capture:true});
$("replay").addEventListener("click",replay);
$("skip").addEventListener("click",function(){state.el=MAXEL;state.playing=false;render();});
window.addEventListener("resize",requestRender);

/* theme */
var themeBtn=$("theme");
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("dtl-theme",t);}catch(e){}
  themeBtn.textContent=t==="dark"?"☾":"◐";}
(function(){var t=null;try{t=localStorage.getItem("dtl-theme");}catch(e){}
  if(!t)t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  setTheme(t);})();
themeBtn.addEventListener("click",function(){setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");requestRender();});

/* gradient stops follow tokens */
function paintStops(){var cs=getComputedStyle(document.documentElement);
  var a=cs.getPropertyValue("--add-dot")||"#22a35c",d=cs.getPropertyValue("--del-dot")||"#f04438";
  $("sadd").setAttribute("stop-color",a.trim());$("sdel").setAttribute("stop-color",d.trim());}
new MutationObserver(paintStops).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
paintStops();

/* test hooks */
window.__dtl={edits:sorted,files:files,state:state,markFor:markFor,fmtTime:fmtTime,
  levelAt:levelAt,visibleEdits:visibleEdits,MAXEL:MAXEL,DURATION:DURATION,render:render,replay:replay};

/* boot: honour reduced motion, 600ms lead-in like the original */
state.el=0;state.playing=true;render();
if(reduceMotion){state.el=MAXEL;state.playing=false;render();}
else{state.el=0;setTimeout(function(){if(state.playing){startT=0;
  rafId=(window.requestAnimationFrame||function(f){return setTimeout(function(){f(Date.now());},16);})(function first(now){startT=now+0;loop(now);});}},600);}
</script>
</body>
