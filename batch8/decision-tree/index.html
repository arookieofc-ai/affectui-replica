function drawLinks(){

    if(!nodes||!nodes.length)return;

    if(!tb.width&&!tree.offsetWidth)return;
    function rel(el){
      var r=el.getBoundingClientRect();
      if(!r.width&&!r.height)return null;

    }

      return "M"+x1+" "+y1+"H"+(mx-o)+"Q"+mx+" "+y1+" "+mx+" "+(y1+s*o)+"V"+(y2-s*o)+"Q"+mx+" "+y2+" "+(mx+o)+" "+y2+"H"+x2;
    }
    function vCurve(x1,y1,x2,y2){
      if(x2-x1<2)return "M"+x1+" "+y1+"V"+y2;
      var o=Math.min(8,(y2-y1)/2,(x2-x1)/2);

      if(leaf){
        var dd2=narrow?vCurve(opt.l+16,opt.b,leaf.l,leaf.t+Math.min(14,leaf.h/2)):hCurve(opt.r,opt.t+opt.h/2,leaf.l,leaf.t+leaf.h/2);

    var d=current();
    if(b&&d&&!state.picked){
      var idx=parseInt(b.getAttribute("data-opt"),10);
      if(!isNaN(idx)&&state.hover!==idx){state.hover=idx;lastKey=snapKey();syncHot();}
    }
  }catch(err){}
}
function onOut(e){
  try{
    var t=e.target;
    if(t&&t.closest&&t.closest(".flg")){hideTip();return;}
    if(t&&t.closest&&t.closest("[data-opt]")&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest("[data-opt]"))){
      if(!state.otherOpen){state.hover=-1;lastKey=snapKey();syncHot();}
    }
  }catch(err){}
}
function onFocusIn(e){
  try{var t=e.target;if(t&&t.classList&&t.classList.contains("flg")){var fi=parseInt(t.getAttribute("data-flag"),10);if(!isNaN(fi))showTip(fi);}}catch(err){}
}
function onFocusOut(e){
  try{var t=e.target;if(t&&t.classList&&t.classList.contains("flg"))hideTip();}catch(err){}
}
function onInput(e){
  try{
    var t=e.target;
    if(t&&t.id==="dtInput"){setOtherText(t.value);}
  }catch(err){}
}
function onKey(e){
  if(e.defaultPrevented)return;
  try{
    if(e.target&&e.target.closest&&e.target.closest("textarea, input")){
      if(e.key==="Escape"){e.stopPropagation();state.otherOpen=false;state.hover=-1;render();try{root.focus();}catch(x){}}
      else if(e.key==="Enter"&&!e.shiftKey&&!(e.nativeEvent&&e.nativeEvent.isComposing)){e.preventDefault();send();}
      return;
    }
  }catch(err){}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var d=current();if(!d)return;
  function go(fn){e.preventDefault();fn();}
  var k=String(e.key||"").toLowerCase(),num=parseInt(e.key,10);
  var n=d.options.length+1;
  if(!isNaN(num)&&num>=1&&num<=n&&num<=9){go(function(){choose(num-1);});return;}
  var map={arrowright:function(){step(1);},j:function(){step(1);},arrowleft:function(){step(-1);},k:function(){step(-1);},f:function(){cycleTip();},
    escape:function(){if(state.tip!==null)hideTip();else if(state.otherOpen){state.otherOpen=false;state.hover=-1;render();}}};
  if(map[k])go(map[k]);
}
/* narrow detection ( ResizeObserver guarded; CSS media query is the fallback ) */
function watchSize(){
  try{
    var body=function(){return document.getElementById("dtBody");};
    function check(){var b=body();if(!b)return;var w=b.clientWidth||0;var nw=w>0&&w<640;if(nw!==state.narrow){state.narrow=nw;render();}}
    if(window.ResizeObserver){
      var ro=new window.ResizeObserver(function(){check();});
      var t0=body();if(t0)ro.observe(t0);
    }
  }catch(e){}
}
/* theme toggle */
var themeBtn=document.getElementById("themeBtn");
function sunHTML(){return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/></svg>';}
function moonHTML(){return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/></svg>';}
function paintThemeBtn(){
  if(!themeBtn)return;
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  themeBtn.innerHTML=(dark?sunHTML():moonHTML())+"<span>"+(dark?"Light":"Dark")+"</span>";
  themeBtn.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
}
function setTheme(mode){
  try{document.documentElement.setAttribute("data-theme",mode);}catch(e){}
  try{if(window.localStorage)window.localStorage.setItem("dt-theme",mode);}catch(e){}
  paintThemeBtn();
}
function initTheme(){
  var mode=null;
  try{if(window.localStorage)mode=window.localStorage.getItem("dt-theme");}catch(e){}
  if(mode!=="dark"&&mode!=="light"){
    try{mode=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}catch(e){mode="light";}
  }
  try{document.documentElement.setAttribute("data-theme",mode);}catch(e){}
  paintThemeBtn();
}
/* init */
function init(){
  state.current=DECISIONS[0].id;
  render();
  try{
    root.addEventListener("pointerdown",onPointerDown,true);
    root.addEventListener("mousedown",onPointerDown,true);
    window.addEventListener("pointerup",onPointerUp,true);
    window.addEventListener("pointercancel",onPointerUp,true);
    root.addEventListener("click",onClick);
    root.addEventListener("mouseover",onOver);
    root.addEventListener("mouseout",onOut);
    root.addEventListener("focusin",onFocusIn);
    root.addEventListener("focusout",onFocusOut);
    root.addEventListener("input",onInput);
    root.addEventListener("keydown",onKey);
    root.addEventListener("pointerdown",function(){try{root.focus({preventScroll:true});}catch(x){}},false);
  }catch(e){}
  if(themeBtn){try{themeBtn.addEventListener("click",function(){setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");});}catch(e){}}
  watchSize();
  runAuto();
  window.__dt={state:state,
    get html(){try{return root.innerHTML;}catch(e){return "";}},
    get renders(){return renderCount;},
    choose:choose,send:send,next:function(){step(1);},prev:function(){step(-1);},
    peek:showTip,unpeek:hideTip,hover:function(i){state.hover=i;syncHot();},
    setOther:setOtherText,openOther:openOther,setTheme:setTheme,
    pause:function(){state.auto=false;clearAuto();}};
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",function(){initTheme();init();});
}else{initTheme();init();}
})();
</script>
</body>
