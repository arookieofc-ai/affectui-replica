<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/*noflash*/(function(){try{var k="affectui-agent-team-theme";var t=null;try{t=localStorage.getItem(k)}catch(e){}if(!t){try{t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){t="light"}}document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<meta name="color-scheme" content="light dark">
<title>Agent Team — affectUI replica</title>
<style>
:root{
  --page:#fafaf9; --surface:#ffffff; --ink:#171717; --ink-2:#1c1917;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --accent:#2f6bff; --online:#34c46a;
  --waiting-bg:#fef3c7; --waiting-tx:#92400e; --waiting-bd:#f59e0b;
  --halo-from:rgba(221,6,116,.18); --halo-to:rgba(94,62,224,.18);
  --dash:#e4e7ec; --face:#eef0f4; --tool-ring:#e5e5e5; --ring:rgba(10,10,10,.06);
}
html[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --ink:#ededed; --ink-2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --halo-from:rgba(244,114,182,.16); --halo-to:rgba(167,139,250,.16);
  --dash:rgba(255,255,255,.14); --face:#2e2e33; --tool-ring:rgba(255,255,255,.12);
  --ring:rgba(255,255,255,.08);
  --waiting-bg:#451a03; --waiting-tx:#fde68a;
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 32px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.proj{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-btn{
  flex:none;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 12px 7px 10px;font:inherit;font-size:13px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform 150ms ease, box-shadow 150ms ease;
}
.theme-btn .ic{width:16px;height:16px;flex:none}
.statusline{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:3px 10px 3px 8px;font-size:12px;font-weight:600;letter-spacing:-.01em;
  background:var(--waiting-bg);color:var(--waiting-tx);border:1px solid var(--border);
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pill .pd{width:7px;height:7px;border-radius:50%;background:var(--waiting-bd);flex:none}
.pill[data-s="team"]{background:var(--subtle);color:var(--ink-2)}
.pill[data-s="team"] .pd{background:var(--online)}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);padding:14px;transition:box-shadow 180ms ease, transform 180ms ease;
}
/* stage keeps the 3:2 demo grid */
.atm{
  --u:calc(100cqw / 600);
  position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;container-type:inline-size;
  border-radius:calc(var(--radius) + 4px);background:var(--surface);
}
.atm-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.atm-line{fill:none;stroke:var(--dash);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:6 7.23}
.atm-reveal{fill:none;stroke:#fff;stroke-width:8;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 700ms cubic-bezier(.7,0,.25,1)}
.atm[data-phase="sent"] .atm-reveal,.atm[data-phase="team"] .atm-reveal{stroke-dashoffset:0}
.atm[data-phase="reset"] .atm-lines{opacity:0;transition:opacity 500ms ease}
.atm-halo{
  position:absolute;left:50%;top:calc(52 * var(--u));width:calc(400 * var(--u));height:calc(68 * var(--u));
  transform:translateX(-50%) scale(.9);border-radius:999px;pointer-events:none;
  background:linear-gradient(90deg,var(--halo-from),var(--halo-to));filter:blur(calc(22 * var(--u)));
  opacity:0;transition:opacity 700ms ease,transform 900ms cubic-bezier(.7,0,.25,1);
}
.atm[data-phase="sent"] .atm-halo,.atm[data-phase="team"] .atm-halo{opacity:1;transform:translateX(-50%) scale(1)}
.atm-prompt{
  position:absolute;left:50%;top:calc(60 * var(--u));display:flex;align-items:center;gap:calc(12 * var(--u));
  width:calc(380 * var(--u));height:calc(52 * var(--u));padding:0 calc(8 * var(--u)) 0 calc(20 * var(--u));
  transform:translateX(-50%);border-radius:999px;background:var(--surface);
  box-shadow:0 0 0 calc(1 * var(--u)) var(--ring),0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(0,0,0,.07),0 calc(2 * var(--u)) calc(5 * var(--u)) rgba(0,0,0,.05);
}
.atm-text{
  flex:1;min-width:0;overflow:hidden;direction:rtl;text-align:left;white-space:nowrap;
  font-size:calc(15 * var(--u));line-height:1.3;letter-spacing:-.01em;color:var(--ink);
}
.atm-typed{direction:ltr;unicode-bidi:isolate}
.atm-caret{
  display:inline-block;width:calc(1.6 * var(--u));height:calc(17 * var(--u));
  margin-left:calc(2 * var(--u));vertical-align:calc(-3 * var(--u));border-radius:1px;background:var(--ink);
  animation:atm-blink 1s steps(1) infinite;
}
.atm-send{
  flex:none;display:grid;place-items:center;width:calc(36 * var(--u));height:calc(36 * var(--u));
  border-radius:50%;background:var(--accent);border:0;padding:0 0 0 2px;cursor:default;
}
.atm-send svg{width:calc(18 * var(--u));height:calc(18 * var(--u));fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.atm[data-phase="sent"] .atm-send{animation:atm-press 380ms cubic-bezier(.7,0,.25,1)}
.atm[data-phase="reset"] .atm-text{opacity:0;transition:opacity 400ms ease}
.atm-agent{position:absolute;top:calc(196 * var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(14 * var(--u));transform:translateX(-50%);padding-bottom:calc(8 * var(--u))}
.atm-node,.atm-role{opacity:0;transform:translateY(calc(10 * var(--u))) scale(.92);transition:opacity 360ms ease,transform 520ms cubic-bezier(.34,1.4,.64,1)}
.atm[data-phase="team"] .atm-node{opacity:1;transform:none;transition-delay:calc(var(--i) * 160ms)}
.atm[data-phase="team"] .atm-role{opacity:1;transform:none;transition-delay:calc(var(--i) * 160ms + 120ms)}
.atm[data-phase="reset"] .atm-node,.atm[data-phase="reset"] .atm-role{transform:none;transition:opacity 500ms ease}
.atm-node{position:relative;width:calc(84 * var(--u));height:calc(84 * var(--u));padding:calc(5 * var(--u));border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 calc(1 * var(--u)) var(--ring),0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(0,0,0,.07)}
.atm-face{
  display:grid;place-items:center;width:100%;height:100%;overflow:hidden;border-radius:50%;
  background:var(--face);color:var(--ink);font-weight:700;font-size:calc(22 * var(--u));letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
}
html[data-theme="dark"] .atm-face{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.atm-face.f0{background:linear-gradient(135deg,#dbeafe,#f5d0fe);color:#1e3a8a}
.atm-face.f1{background:linear-gradient(135deg,#dcfce7,#fef9c3);color:#14532d}
.atm-face.f2{background:linear-gradient(135deg,#ffedd5,#fecdd3);color:#7c2d12}
html[data-theme="dark"] .atm-face.f0{background:linear-gradient(135deg,#1e3a8a,#701a75);color:#dbeafe}
html[data-theme="dark"] .atm-face.f1{background:linear-gradient(135deg,#14532d,#713f12);color:#dcfce7}
html[data-theme="dark"] .atm-face.f2{background:linear-gradient(135deg,#7c2d12,#881337);color:#ffedd5}
.atm-dot{
  position:absolute;right:calc(1 * var(--u));bottom:calc(3 * var(--u));width:calc(24 * var(--u));height:calc(24 * var(--u));
  border:calc(7 * var(--u)) solid var(--surface);border-radius:50%;background:var(--online);
  box-shadow:0 0 0 calc(2 * var(--u)) rgba(52,196,106,.15);transform:scale(0);transition:transform 420ms cubic-bezier(.34,1.4,.64,1);
}
.atm[data-phase="team"] .atm-dot{transform:scale(1);transition-delay:calc(var(--i) * 160ms + 360ms)}
.atm-role{
  display:flex;align-items:center;gap:calc(10 * var(--u));height:calc(42 * var(--u));
  padding:0 calc(15 * var(--u)) 0 calc(7 * var(--u));border-radius:999px;background:var(--surface);
  box-shadow:0 0 0 calc(1 * var(--u)) var(--ring),0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(0,0,0,.07);
  font-size:calc(12.5 * var(--u));font-weight:500;letter-spacing:-.01em;white-space:nowrap;color:var(--ink);
  max-width:calc(184 * var(--u));
}
.atm-role > span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.atm-tools{display:flex}
.atm-tool{
  display:grid;place-items:center;width:calc(26 * var(--u));height:calc(26 * var(--u));border-radius:50%;
  background:var(--surface);box-shadow:0 0 0 calc(1 * var(--u)) var(--tool-ring),0 calc(1.5 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.08);
  font-size:calc(11 * var(--u));font-weight:800;color:#fff;
}
.atm-tool + .atm-tool{margin-left:calc(-8 * var(--u))}
.atm-tool.t-linkedin{background:#0A66C2}
.atm-tool.t-hubspot{background:#FF7A59}
.atm-tool.t-slack{background:#611f69}
.atm-tool.t-gmail{background:#EA4335}
.atm-tool.t-salesforce{background:#00A1E0}
@keyframes atm-blink{50%{opacity:0}}
@keyframes atm-press{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
.caption{margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
kbd{font:inherit;font-size:12px;border:1px solid var(--border);border-bottom-width:2px;border-radius:var(--radius-sm);padding:0 6px;background:var(--subtle);color:var(--ink)}
.replay{
  margin-top:10px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px 8px 12px;
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);
  transition:transform 160ms ease, box-shadow 160ms ease;
}
.replay .tri{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-right:-2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  .atm *,.atm *::before{transition:none !important;animation:none !important}
}
@media (hover: hover) and (pointer: fine){
  .card:hover{transform:translateY(-1px)}
  .theme-btn:hover{transform:translateY(-1px)}
  .replay:hover{transform:translateY(-1px)}
}
@media (max-width:560px){
  .wrap{padding:14px 10px 24px}
  .card{padding:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 class="proj" id="projName">Inbound Pipeline — Agent Team</h1>
      <p class="sub" id="projSub">Prompt builds a team of 3 agents · looping demo</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">
      <svg class="ic" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Theme</span>
    </button>
  </div>
  <p class="statusline"><span class="pill" id="phasePill" data-s="typing"><span class="pd"></span><span id="phaseText">Typing prompt…</span></span><span id="loopText">Loop 1 · 3 agents</span></p>
  <div class="card">
    <div class="atm" id="atm" data-phase="typing" role="img" aria-label="A prompt – “Build a team to work my inbound pipeline” – builds a team of three agents: Lead Researcher, Inbound Qualifier, Outbound SDR">
      <svg class="atm-lines" id="atmLines" viewBox="0 0 600 400" aria-hidden="true">
        <defs id="atmDefs"></defs>
        <g id="lineG"></g>
      </svg>
      <div class="atm-halo" aria-hidden="true"></div>
      <div class="atm-prompt" aria-hidden="true">
        <span class="atm-text"><bdi class="atm-typed" id="typedWrap"><span id="typedText"></span><span class="atm-caret"></span></bdi></span>
        <span class="atm-send" id="sendBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5v-13M6.5 11 12 5.5l5.5 5.5"/></svg></span>
      </div>
      <div id="agentHost"></div>
    </div>
  </div>
  <p class="caption">Self-typing prompt branches into three agents with overlapping tool icons. Press <kbd>R</kbd> to replay. Respects reduced-motion.</p>
  <button class="replay" id="replayBtn" type="button"><span class="tri" aria-hidden="true"></span>Replay loop</button>
</div>
<script>
(function(){
"use strict";
var PROMPT="Build a team to work my inbound pipeline";
var TYPE_MS=22, SEND_PAUSE=420, REVEAL_MS=700, HOLD_MS=2600, GAP_MS=600, START_MS=500;
var PATHS=["M300 110C300 162 102 152 102 196","M300 110V196","M300 110C300 162 498 152 498 196"];
var XS=[102,300,498];
var MEMBERS=[
  {role:"Lead Researcher", initials:"L", face:"f0", tools:["linkedin","hubspot"]},
  {role:"Inbound Qualifier", initials:"T", face:"f1", tools:["hubspot","slack"]},
  {role:"Outbound SDR", initials:"N", face:"f2", tools:["gmail","salesforce"]}
];
var TOOL_GLYPH={linkedin:"in", hubspot:"H", slack:"#", gmail:"M", salesforce:"S"};
var NS="http://www.w3.org/2000/svg";
var root=document.getElementById("atm");
var typedText=document.getElementById("typedText");
var pill=document.getElementById("phasePill");
var phaseText=document.getElementById("phaseText");
var loopText=document.getElementById("loopText");
var themeBtn=document.getElementById("themeBtn");
var themeLabel=document.getElementById("themeLabel");
var replayBtn=document.getElementById("replayBtn");
var defs=document.getElementById("atmDefs");
var lineG=document.getElementById("lineG");
var host=document.getElementById("agentHost");
var timers=[];
var loopCount=1;
var reduced=false;
try{reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){reduced=false;}
/* ---- build once: lines ---- */
var revealPaths=[];
for(var li=0; li<PATHS.length; li++){
  (function(idx){
    var mask=document.createElementNS(NS,"mask");
    mask.setAttribute("id","atm-reveal-"+idx);
    mask.setAttribute("maskUnits","userSpaceOnUse");
    mask.setAttribute("x","0"); mask.setAttribute("y","0");
    mask.setAttribute("width","600"); mask.setAttribute("height","400");
    var rp=document.createElementNS(NS,"path");
    rp.setAttribute("d",PATHS[idx]);
    rp.setAttribute("pathLength","1");
    rp.setAttribute("class","atm-reveal");
    mask.appendChild(rp);
    defs.appendChild(mask);
    var lp=document.createElementNS(NS,"path");
    lp.setAttribute("d",PATHS[idx]);
    lp.setAttribute("class","atm-line");
    lp.setAttribute("mask","url(#atm-reveal-"+idx+")");
    lineG.appendChild(lp);
    revealPaths.push(rp);
  })(li);
}
/* ---- build once: agents + pills (in place forever) ---- */
var agentEls=[];
for(var ai=0; ai<MEMBERS.length; ai++){
  (function(idx){
    var m=MEMBERS[idx];
    var cell=document.createElement("div");
    cell.setAttribute("class","atm-agent");
    cell.setAttribute("aria-hidden","true");
    cell.style.left="calc("+XS[idx]+" * var(--u))";
    cell.style.setProperty("--i", String(idx));
    var node=document.createElement("div");
    node.setAttribute("class","atm-node");
    var face=document.createElement("span");
    face.setAttribute("class","atm-face "+m.face);
    face.textContent=m.initials;
    node.appendChild(face);
    var dot=document.createElement("span");
    dot.setAttribute("class","atm-dot");
    node.appendChild(dot);
    cell.appendChild(node);
    var role=document.createElement("div");
    role.setAttribute("class","atm-role");
    if(m.tools && m.tools.length){
      var tools=document.createElement("span");
      tools.setAttribute("class","atm-tools");
      for(var ti=0; ti<Math.min(2,m.tools.length); ti++){
        var tn=m.tools[ti];
        var tool=document.createElement("span");
        tool.setAttribute("class","atm-tool t-"+tn);
        tool.setAttribute("title",tn);
        tool.textContent=TOOL_GLYPH[tn]||tn.charAt(0);
        tools.appendChild(tool);
      }
      role.appendChild(tools);
    }
    var label=document.createElement("span");
    label.textContent=m.role;
    role.appendChild(label);
    cell.appendChild(role);
    host.appendChild(cell);
    agentEls.push(cell);
  })(ai);
}
/* ---- phase + text mutate in place only ---- */
function later(fn,ms){ var id=window.setTimeout(fn,ms); timers.push(id); return id; }
function clearTimers(){ for(var k=0;k<timers.length;k++){window.clearTimeout(timers[k]);} timers=[]; }
function setPhase(p){
  root.setAttribute("data-phase",p);
  pill.setAttribute("data-s",p);
  if(p==="typing"){phaseText.textContent="Typing prompt…";}
  else if(p==="sent"){phaseText.textContent="Prompt sent — branching…";}
  else if(p==="team"){phaseText.textContent="Team of 3 working";}
  else{phaseText.textContent="Resetting…";}
}
function setCount(n){ typedText.textContent=PROMPT.slice(0,n); }
function setLoop(n){ loopCount=n; loopText.textContent="Loop "+n+" · 3 agents"; }
function runLoop(){
  clearTimers();
  var keepLoop=loopCount;
  setPhase("typing"); setCount(0);
  loopText.textContent="Loop "+keepLoop+" · 3 agents";
  if(reduced){ setCount(PROMPT.length); setPhase("team"); return; }
  var t=START_MS, n=PROMPT.length;
  for(var i=1;i<=n;i++){ (function(c){later(function(){setCount(c);}, START_MS+c*TYPE_MS);})(i); }
  var tSent=START_MS+n*TYPE_MS+SEND_PAUSE;
  var tTeam=tSent+REVEAL_MS*0.55;
  var tReset=tSent+REVEAL_MS+480+500+HOLD_MS;
  later(function(){setPhase("sent");}, tSent);
  later(function(){setPhase("team");}, tTeam);
  later(function(){setPhase("reset");}, tReset);
  later(function(){ setLoop(keepLoop+1); runLoop(); }, tReset+GAP_MS);
}
/* ---- theme toggle ---- */
function paintTheme(){
  var t=document.documentElement.getAttribute("data-theme")||"light";
  themeLabel.textContent=(t==="dark")?"Dark":"Light";
}
themeBtn.addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme")||"light";
  var next=(cur==="dark")?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("affectui-agent-team-theme",next);}catch(e){}
  paintTheme();
});
replayBtn.addEventListener("click",function(){ runLoop(); });
document.addEventListener("keydown",function(e){
  if(e.key==="r"||e.key==="R"){ runLoop(); }
});
paintTheme();
runLoop();
})();
</script>
</body>
</html>
