<style>
:root{color-scheme:light dark}
html{-webkit-tap-highlight-color:transparent}
html[data-theme="light"]{
--surface:#ffffff;--page:#fafaf9;--ink:#171717;--ink2:#1c1917;--muted:#78716c;--faint:#a8a29e;
--subtle:#f5f5f4;--border:#e7e5e4;--chip:#f5f5f4;--hover:#f5f5f4;
--card:#ffffff;--panel:#fafaf9;--line:var(--border);
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--outline:rgba(0,96,226,.7);
--blue:#0190fe;--purple:#a651f0;--orange:#f28a2e;--teal:#13b3a0;--amber:#e8b000;--pink:#ee3e9e;--green:#5fc88a;--gray:rgba(0,0,0,.28);
--warn:#b25e00;--warn-bg:#ff9c0024;
}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--ink2:#ededed;--muted:#a1a1aa;--faint:#71717a;
--subtle:#26262a;--border:#2e2e33;--chip:#26262a;--hover:#26262a;
--card:#1c1c1f;--panel:#101012;--line:#2e2e33;
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
--outline:rgba(77,141,255,.8);
--blue:#4fb0fe;--purple:#b98af0;--orange:#f2a15c;--teal:#4fc3b4;--amber:#e6c24d;--pink:#f06db5;--green:#7dcf9f;--gray:rgba(255,255,255,.3);
--warn:#ffb35c;--warn-bg:#fb6a0026;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
img{outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
html[data-theme="dark"] img{outline-color:rgba(255,255,255,.1)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--outline);outline-offset:2px}
.agu-shell{min-height:100vh;display:flex;flex-direction:column}
.agu-head{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 20px;border-bottom:1px solid var(--border);background:var(--card)}
.agu-title{margin:0;font-size:13px;font-weight:600;line-height:20px}
.agu-month{font-size:13px;color:var(--faint)}
.agu-spacer{flex:1}
.agu-theme{width:32px;height:32px;margin-right:2px;border:1px solid var(--border);border-radius:999px;background:var(--card);display:inline-grid;place-items:center;font-size:15px;line-height:1;box-shadow:var(--shadow);transition:transform 150ms ease,box-shadow 150ms ease;padding-left:8px;padding-right:6px}
.agu-scroll{flex:1;min-height:0}
.agu-page{display:grid;gap:28px;max-width:720px;margin:0 auto;padding:24px 24px 48px}
.agu-label{margin:0;font-size:12px;font-weight:600;line-height:16px;color:var(--muted)}
.agu-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.agu-spend{display:grid;gap:14px;padding:16px 16px 0;overflow:hidden}
.agu-spend__sum{display:grid;gap:4px;min-width:0}
.agu-amount{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:2px 0 0}
.agu-value{font-size:28px;font-weight:600;line-height:34px;letter-spacing:-.4px}
.agu-budget{font-size:13px;color:var(--muted)}
.agu-status{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;line-height:20px;color:var(--muted)}
.agu-status[data-warn]{color:var(--warn)}
.agu-flash{display:none;align-items:baseline;gap:5px;max-width:100%;padding:1px 8px;border-radius:7px;background:var(--subtle);font-size:12px;font-weight:600}
.agu-flash[data-show]{display:inline-flex}
.agu-flash__task{font-weight:400;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.agu-chart{position:relative;min-width:0;margin:0 -2px;border-radius:6px}
.agu-chart svg{display:block;overflow:visible;width:100%;height:auto}
.agu-chart__base{stroke:var(--border);stroke-width:1}
.agu-chart__budget{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.agu-chart__tick{font-size:11px;fill:var(--faint)}
.agu-chart__budgetlbl{font-size:11px;fill:var(--faint)}
.agu-chart__area{fill:var(--blue);opacity:.12}
.agu-chart__line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.agu-chart__forecast{fill:none;stroke:var(--blue);stroke-width:1.5;stroke-dasharray:4 4;opacity:.4}
.agu-chart__today{fill:var(--blue);stroke:var(--card);stroke-width:2}
.agu-chart__pulse{fill:var(--blue);opacity:.4}
.agu-tip{position:absolute;z-index:2;display:none;gap:1px;padding:6px 9px;border-radius:8px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-size:12px;line-height:16px;white-space:nowrap;transform:translateY(-50%);pointer-events:none}
.agu-tip[data-show]{display:grid}
.agu-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 -16px;border-top:1px solid var(--border)}
.agu-stats>div{display:grid;gap:2px;padding:12px 16px 14px}
.agu-stats>div+div{border-left:1px solid var(--border)}
.agu-stats dt{font-size:12px;color:var(--muted)}
.agu-stats dd{margin:0;font-size:15px;font-weight:600}
.agu-section{display:grid;gap:8px;min-width:0}
.agu-section__head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}
.agu-seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--chip);border:1px solid var(--border)}
.agu-seg button{height:24px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);transition:background-color 160ms ease,color 160ms ease}
.agu-seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--border)}
.agu-groups{margin:0;padding:4px;list-style:none}
.agu-group{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 10px;border-radius:8px;text-align:left;font-size:13px;transition:background-color 140ms ease}
.agu-group[aria-current]{background:var(--subtle)}
.agu-group__mark{flex:none;width:8px;height:8px;border-radius:2px;background:var(--tone,var(--gray))}
.agu-group__name{flex:0 0 150px;min-width:0;overflow:hidden;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.agu-group__bar{flex:1;min-width:40px;height:6px;border-radius:3px;background:var(--subtle);border:1px solid var(--border);overflow:hidden}
.agu-group__bar>span{display:block;height:100%;border-radius:3px;background:var(--tone,var(--gray))}
.agu-group__amount{flex:none;width:84px;white-space:nowrap;text-align:right}
.agu-group__share{flex:none;width:34px;font-size:12px;color:var(--faint);text-align:right}
.agu-group__change{flex:none;width:52px;white-space:nowrap;font-size:12px;color:var(--muted);text-align:right}
.agu-group__change[data-up]{color:var(--warn)}
.agu-group__chev{flex:none;color:var(--faint)}
.agu-groups li+li{border-top:1px solid var(--border)}
.agu-detail{display:flex;flex-direction:column;gap:14px;padding:14px 14px 16px}
.agu-detail__head{display:flex;align-items:center;gap:10px;min-width:0}
.agu-detail__title{margin:0;overflow:hidden;font-size:15px;font-weight:600;line-height:22px;white-space:nowrap;text-overflow:ellipsis}
.agu-detail__sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px;color:var(--muted);padding-bottom:12px}
.agu-detail__amount{font-size:22px;font-weight:600;color:var(--ink)}
.agu-bars{display:flex;align-items:flex-end;gap:2px;height:72px}
.agu-bars__day{flex:1;display:flex;align-items:flex-end;height:100%;min-width:0;border-radius:2px}
.agu-bars__day>span{display:block;width:100%;border-radius:2px;background:var(--tone,var(--blue));opacity:.75}
.agu-bars__day[data-future]>span{background:var(--border);opacity:1}
.agu-bars__read{margin:6px 0 0;font-size:12px;color:var(--muted)}
.agu-tasks{margin:0 -8px;padding:2px 12px;list-style:none;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

.agu-tasks li+li{border-top:1px solid var(--border)}
.agu-tasks li[data-hidden]{display:none}
.agu-tasks__text{display:grid;flex:1;min-width:0}
.agu-tasks__title{overflow:hidden;font-size:13px;white-space:nowrap;text-overflow:ellipsis}
.agu-tasks__runs{font-size:12px;color:var(--muted)}
.agu-tasks__cost{flex:none;font-size:13px}
.agu-notes{margin:0;padding:2px 12px;list-style:none}
.agu-note{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0}
.agu-note+.agu-note{border-top:1px solid var(--border)}
.agu-note__icon{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--subtle);color:var(--muted);font-size:14px}
.agu-note__icon[data-kind="spike"],.agu-note__icon[data-kind="jump"]{background:var(--warn-bg);color:var(--warn)}
.agu-note__text{display:grid;flex:1;min-width:0}
.agu-note__line{overflow:hidden;font-size:13px;white-space:nowrap;text-overflow:ellipsis}
.agu-note__detail{overflow:hidden;font-size:12px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.agu-badge{flex:none;padding:0 6px;border-radius:5px;background:var(--chip);border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.agu-badge[data-kind="spike"],.agu-badge[data-kind="jump"]{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.agu-btn{display:inline-flex;flex:none;align-items:center;height:28px;padding:0 10px;border-radius:7px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-size:13px;font-weight:600;transition:box-shadow 140ms ease}
.agu-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.agu-layout>.agu-section{min-width:0}
@media (max-width:720px){.agu-layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){
.agu-page{padding:16px 16px 40px;gap:24px}
.agu-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.agu-stats>div:nth-child(3){border-left:0;border-top:1px solid var(--border)}
.agu-stats>div:nth-child(4){border-top:1px solid var(--border)}
.agu-group__name{flex:1 1 auto}
.agu-group__bar,.agu-group__share{display:none}
.agu-note{flex-wrap:wrap}
.agu-note__text{flex-basis:calc(100% - 40px)}
.agu-note .agu-badge{margin-left:40px}
.agu-note .agu-btn{margin-left:auto}
}
@media (hover:hover) and (pointer:fine){
.agu-theme:hover{box-shadow:0 2px 6px rgba(0,0,0,.1);transform:translateY(-1px)}
.agu-group:hover{background:var(--hover)}
.agu-seg button:hover{color:var(--ink)}
.agu-btn:hover{box-shadow:0 2px 4px rgba(0,0,0,.08)}
.agu-bars__day:hover>span{opacity:1}
}
@media (prefers-reduced-motion:reduce){
.agu-chart__pulse{display:none}
*{animation:none!important;transition:none!important}
}
</style>

var bP=el('button','','Projects');bP.setAttribute('role','tab');var bM=el('button','','Models');bM.setAttribute('role','tab');
bP.addEventListener('click',function(){setView('projects')});
bM.addEventListener('click',function(){setView('models')});
seg.appendChild(bP);seg.appendChild(bM);R.segP=bP;R.segM=bM;
shead.appendChild(slab);shead.appendChild(seg);sec.appendChild(shead);
var ul=el('ul','agu-card agu-groups');ul.setAttribute('role','tabpanel');
R.rows=[];
for(i=0;i<4;i++){
var li=document.createElement('li');
var btn=el('button','agu-group');btn.type='button';
var mark=el('span','agu-group__mark');mark.setAttribute('aria-hidden','true');
var nm=el('span','agu-group__name');nm.dir='auto';
var bar=el('span','agu-group__bar');bar.setAttribute('aria-hidden','true');var fill=el('span','');bar.appendChild(fill);
var amtS=el('span','agu-group__amount','');
var shr=el('span','agu-group__share','');
var chg=el('span','agu-group__change','');
var chev=el('span','agu-group__chev','\u203A');chev.setAttribute('aria-hidden','true');
btn.appendChild(mark);btn.appendChild(nm);btn.appendChild(bar);btn.appendChild(amtS);btn.appendChild(shr);btn.appendChild(chg);btn.appendChild(chev);
(function(idx){btn.addEventListener('click',function(){var d=currentList()[idx];if(d)select(d.id)})})(i);
li.appendChild(btn);ul.appendChild(li);
R.rows.push({li:li,btn:btn,mark:mark,name:nm,fill:fill,amount:amtS,share:shr,change:chg,id:null});
}
sec.appendChild(ul);layout.appendChild(sec);
var det=el('section','agu-card agu-detail');det.setAttribute('aria-label','Details');
var dhead=el('div','agu-detail__head');
var dmark=el('span','agu-group__mark');R.dmark=dmark;
var dtitle=el('h2','agu-detail__title','');R.dtitle=dtitle;
dhead.appendChild(dmark);dhead.appendChild(dtitle);det.appendChild(dhead);
var dsum=el('div','agu-detail__sum');
var damt=el('span','agu-detail__amount','');R.damount=damt;
var dshare=el('span','','');R.dshare=dshare;
var dchg=el('span','','');R.dchange=dchg;
dsum.appendChild(damt);dsum.appendChild(dshare);dsum.appendChild(dchg);det.appendChild(dsum);
var barsSec=el('div','');var barsLab=el('h3','agu-label','Day by day');barsSec.appendChild(barsLab);
var bars=el('div','agu-bars');bars.setAttribute('aria-hidden','true');R.barDays=[];
for(i=0;i<30;i++){var bd=el('span','agu-bars__day');var bf=el('span','');bf.style.height='3px';bd.appendChild(bf);bars.appendChild(bd);R.barDays.push({wrap:bd,fill:bf})}
barsSec.appendChild(bars);
var dread=el('p','agu-bars__read','');R.barsRead=dread;barsSec.appendChild(dread);det.appendChild(barsSec);
var tSec=el('div','');var tLab=el('h3','agu-label','What cost the most');tSec.appendChild(tLab);
var tUl=el('ul','agu-tasks');R.taskRows=[];
for(i=0;i<5;i++){var tl=document.createElement('li');var tx=el('span','agu-tasks__text');var tt=el('span','agu-tasks__title','');var tr=el('span','agu-tasks__runs','');tx.appendChild(tt);tx.appendChild(tr);var tc=el('span','agu-tasks__cost','');tl.appendChild(tx);tl.appendChild(tc);tUl.appendChild(tl);R.taskRows.push({li:tl,title:tt,runs:tr,cost:tc})}
tSec.appendChild(tUl);det.appendChild(tSec);
layout.appendChild(det);
page.appendChild(layout);
var nSec=el('section','agu-section');
var nLab=el('h2','agu-label','Worth a look');nLab.id='agu-look';nSec.appendChild(nLab);
var nUl=el('ul','agu-card agu-notes');R.noteLines=[];
NOTES.forEach(function(n){
var li2=document.createElement('li');li2.className='agu-note';
var ic=el('span','agu-note__icon',n.kind==='spike'?'\u26A0':n.kind==='jump'?'\u25B2':'\u25CB');ic.setAttribute('data-kind',n.kind);ic.setAttribute('aria-hidden','true');
var tx2=el('span','agu-note__text');var ln=el('span','agu-note__line',n.text);ln.dir='auto';ln.title=n.text;var dt2=el('span','agu-note__detail',n.detail);dt2.dir='auto';dt2.title=n.detail;tx2.appendChild(ln);tx2.appendChild(dt2);
var badge=el('span','agu-badge',n.badge);badge.setAttribute('data-kind',n.kind);
var open=el('button','agu-btn','Open');open.type='button';open.setAttribute('aria-label','Open: '+n.text);
open.addEventListener('click',function(){if(n.id==='evalkit')select('evalkit');else select('northwind');if(det.scrollIntoView){try{det.scrollIntoView({block:'nearest'})}catch(e){}}});
li2.appendChild(ic);li2.appendChild(tx2);li2.appendChild(badge);li2.appendChild(open);nUl.appendChild(li2);
R.noteLines.push(ln);
});
nSec.appendChild(nUl);page.appendChild(nSec);
var themeBtn=document.getElementById('agu-theme');
function syncThemeIcon(){var d=document.documentElement.getAttribute('data-theme');themeBtn.textContent=d==='dark'?'\u2600':'\u263E';themeBtn.setAttribute('aria-label',d==='dark'?'Switch to light mode':'Switch to dark mode')}
themeBtn.addEventListener('click',function(){
var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
document.documentElement.setAttribute('data-theme',cur);
try{localStorage.setItem('agu-theme',cur)}catch(e){}
syncThemeIcon();
});
syncThemeIcon();
try{var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;if(mq&&mq.addEventListener){mq.addEventListener('change',function(e){try{if(localStorage.getItem('agu-theme'))return}catch(x){}document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');syncThemeIcon()})}}catch(e){}
}
function currentList(){return state.view==='projects'?state.projects:state.models}
function totalSpent(){return sum(state.days)}
function paintSpend(){
var l=totalSpent(),u=state.days.length,f=l/(u||1),p=l+f*(MONTH_LEN-u);
var pc=BUDGET?Math.round(l/BUDGET*100):0;
R.value.textContent=fmt.format(l);
R.budget.textContent='of '+fmt0.format(BUDGET)+' \u00B7 '+pc+'%';
var over=l>BUDGET, cross=!over&&p>BUDGET?Math.ceil((BUDGET-l)/f):0;
var msg;
if(over){msg=fmt0.format(l-BUDGET)+' over the budget'}
else if(cross){msg='Passes the '+fmt0.format(BUDGET)+' budget around Nov '+cross}
else{msg='On track for '+fmt0.format(p)+' by Nov '+MONTH_LEN}
R.statusText.textContent=msg;
if(over||cross)R.status.setAttribute('data-warn','');else R.status.removeAttribute('data-warn');
R.statusIcon.textContent=(over||cross)?'\u26A0 ':'\u25CB ';
R.blabel.textContent='Budget '+fmt0.format(BUDGET);
var W=600,H=168;
function X(i){return MONTH_LEN<=1?0:i/(MONTH_LEN-1)*(W-2)+1}
function Y(v,top){return 18+(1-v/top)*128}
var cum=[],s=0,i;for(i=0;i<state.days.length;i++){s+=state.days[i];cum.push(s)}
var top=Math.max(BUDGET,p,cum[cum.length-1]||0)*1.08||1;
var d='';for(i=0;i<cum.length;i++){d+=(i?'L':'M')+X(i).toFixed(1)+','+Y(cum[i],top).toFixed(1)}
R.line.setAttribute('d',d);
R.area.setAttribute('d',d+'L'+X(cum.length-1).toFixed(1)+','+Y(0,top).toFixed(1)+'L'+X(0).toFixed(1)+','+Y(0,top).toFixed(1)+'Z');
var lx=X(cum.length-1),ly=Y(cum[cum.length-1]||0,top);
R.fore.setAttribute('d','M'+lx.toFixed(1)+','+ly.toFixed(1)+'L'+X(MONTH_LEN-1).toFixed(1)+','+Y(p,top).toFixed(1));
R.bline.setAttribute('y1',Y(BUDGET,top));R.bline.setAttribute('y2',Y(BUDGET,top));
R.blabel.setAttribute('y',Y(BUDGET,top)-6);
R.pulse.setAttribute('cx',lx);R.pulse.setAttribute('cy',ly);
R.today.setAttribute('cx',lx);R.today.setAttribute('cy',ly);
R.chart.setAttribute('aria-label','Spend this month, day by day: '+fmt.format(cum[cum.length-1]||0)+' by Nov '+state.days.length+', budget '+fmt0.format(BUDGET)+', '+fmt0.format(p)+' by Nov '+MONTH_LEN+' at this pace');
var ticks=[1,8,15,22,30];
for(i=0;i<R.ticks.length&&i<ticks.length;i++){var n=ticks[i];R.ticks[i].setAttribute('x',X(n-1));R.ticks[i].setAttribute('text-anchor',n===1?'start':n===30?'end':'middle');R.ticks[i].textContent='Nov '+n}
R.stTasks.textContent=fmtN.format(state.stats.tasks);
R.stRuns.textContent=fmtN.format(state.stats.runs);
R.stPer.textContent=fmt.format(l/state.stats.tasks);
R.stTok.textContent=fmtC.format(state.stats.tokens);
if(R.tip)R.tip.setAttribute('aria-hidden','true');
paintTip();
}
function paintTip(){
if(R.hover==null||R.hover<0){R.tip.removeAttribute('data-show');return}
var i=R.hover;if(i>=state.days.length)return;
var cum=0,k;for(k=0;k<=i;k++)cum+=state.days[k];
R.tipD.textContent='Nov '+(i+1);
R.tipA.textContent=fmt.format(state.days[i])+' that day';
R.tipB.textContent=fmt.format(cum)+' so far';
R.tip.setAttribute('data-show','');
var left=Math.min(520,Math.max(12,20+i*20));R.tip.style.left=left+'px';R.tip.style.top='40px';
}
function onHoverMove(ev){
try{
var r=ev.currentTarget.getBoundingClientRect?ev.currentTarget.getBoundingClientRect():{left:0,width:600};
var frac=r.width?((ev.clientX-r.left)/r.width):0;
var idx=Math.round(frac*(MONTH_LEN-1));
R.hover=Math.max(0,Math.min(state.days.length-1,idx));paintTip();
}catch(e){}
}
function paintGroups(){
var list=currentList().slice().sort(function(a,b){return b.amount-a.amount});
var tot=sum(currentList().map(function(e){return e.amount}))||1;
var mx=Math.max.apply(null,currentList().map(function(e){return e.amount}))||1;
R.segP.setAttribute('aria-selected',state.view==='projects'?'true':'false');
R.segM.setAttribute('aria-selected',state.view==='models'?'true':'false');
for(var i=0;i<R.rows.length;i++){
var row=R.rows[i],d=list[i];if(!d){row.li.style.display='none';continue}
row.li.style.display='';row.id=d.id;
row.btn.style.setProperty('--tone',TONE[d.tone]||TONE.gray);
if(d.id===state.selected)row.btn.setAttribute('aria-current','true');else row.btn.removeAttribute('aria-current');
row.btn.setAttribute('aria-label',d.name+': '+fmt.format(d.amount)+', '+Math.round(d.amount/tot*100)+'%');
row.name.textContent=d.name;row.name.title=d.name;
row.fill.style.width=(d.amount/mx*100)+'%';
row.amount.textContent=shortMoney(d.amount);row.amount.title=fmt.format(d.amount);
row.share.textContent=Math.round(d.amount/tot*100)+'%';
var t=d.last?pct(d.amount,d.last):null;
if(t==null||!d.last){row.change.textContent='';row.change.removeAttribute('data-up')}
else{row.change.textContent=delta(d.amount,d.last);if(t>0)row.change.setAttribute('data-up','');else row.change.removeAttribute('data-up')}
}
}
function paintDetail(){
var all=state.projects.concat(state.models);
var g=null,i;for(i=0;i<all.length;i++)if(all[i].id===state.selected)g=all[i];
if(!g){var l=currentList();g=l[0]}
var tot=totalSpent();
R.dmark.style.setProperty('--tone',TONE[g.tone]||TONE.gray);
R.dmark.style.background=TONE[g.tone]||'var(--gray)';
R.dtitle.textContent=g.name;R.dtitle.title=g.name;
R.damount.textContent=fmt.format(g.amount);
R.dshare.textContent=Math.round(g.amount/(tot||1)*100)+'% of Nov';
var t=g.last?pct(g.amount,g.last):null;
if(t==null){R.dchange.textContent='';R.dchange.removeAttribute('data-up')}
else{R.dchange.textContent=delta(g.amount,g.last||1)+' vs last month';if(t>0)R.dchange.setAttribute('data-up','');else R.dchange.removeAttribute('data-up')}
var days=g.days||[];
var mx=0;for(i=0;i<days.length;i++)if(days[i]>mx)mx=days[i];
if(!mx)mx=1;
for(i=0;i<R.barDays.length;i++){
var cell=R.barDays[i];
if(i<days.length){cell.wrap.removeAttribute('data-future');cell.fill.style.height=Math.max(3,days[i]/mx*100)+'%'}
else{cell.wrap.setAttribute('data-future','');cell.fill.style.height='3px'}
}
if(R.hoverBar!=null&&R.hoverBar<days.length){R.barsRead.textContent='Nov '+(R.hoverBar+1)+' \u00B7 '+fmt.format(days[R.hoverBar])}
else{R.barsRead.textContent='Nov 1 \u2013 Nov '+days.length+' \u00B7 '+fmt.format(sum(days))}
var tasks=(g.tasks||[]).slice().sort(function(a,b){return b.cost-a.cost}).slice(0,5);
for(i=0;i<R.taskRows.length;i++){
var r=R.taskRows[i],d=tasks[i];
if(!d){r.li.setAttribute('data-hidden','');continue}
r.li.removeAttribute('data-hidden');
r.title.textContent=d.title;r.title.title=d.title;
r.runs.textContent=d.runs===1?'1 run':fmtN.format(d.runs)+' runs';
r.cost.textContent=fmt.format(d.cost);
}
}
function paintFlash(){
if(!state.latest){R.flash.removeAttribute('data-show');return}
R.flash.setAttribute('data-show','');
R.flashCost.textContent='+'+fmt.format(state.latest.cost);
R.flashTask.textContent='\u00B7 '+state.latest.task;
}
function setView(v){if(state.view===v)return;state.view=v;paintGroups()}
function select(id){state.selected=id;paintGroups();paintDetail()}
var flashTimer=null;
function tick(){
var n=FEED[state.feed%FEED.length];state.feed++;
for(var i=0;i<state.days.length;i++){if(i===state.days.length-1)state.days[i]=Math.round((state.days[i]+n.cost)*100)/100}
function bump(list,key){for(var k=0;k<list.length;k++){if(list[k].id===key){list[k].amount=Math.round((list[k].amount+n.cost)*100)/100;var dd=list[k].days;if(dd&&dd.length)dd[dd.length-1]=Math.round((dd[dd.length-1]+n.cost)*100)/100}}}
bump(state.projects,n.project);bump(state.models,n.model);
state.stats.runs+=1;state.stats.tokens+=Math.round(n.cost*180000);
state.latest={id:'run-'+state.feed,task:n.task,cost:n.cost};
paintSpend();paintGroups();paintDetail();paintFlash();
if(flashTimer)clearTimeout(flashTimer);
flashTimer=setTimeout(function(){state.latest=null;paintFlash()},2600);
return n;
}
build();paintSpend();paintGroups();paintDetail();paintFlash();
var iv=setInterval(tick,3400);
if(iv&&iv.unref){try{iv.unref()}catch(e){}}
window.__agu={state:state,refs:R,tick:tick,select:select,setView:setView,
setTheme:function(m){document.documentElement.setAttribute('data-theme',m);try{localStorage.setItem('agu-theme',m)}catch(e){}},
setHover:function(i){R.hover=i;paintTip()},
setHoverBar:function(i){R.hoverBar=i;paintDetail()}};
})();
</script>
</body>
