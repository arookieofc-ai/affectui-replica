<style>
:root{

}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.proj{display:flex;align-items:center;gap:10px;min-width:0}
.px-stack{display:flex}

.proj-name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.ctx{text-align:right;flex-shrink:0}
.ctx-label{font-size:12px;color:var(--muted)}
.ctx-bar{width:110px;height:3px;background:var(--border);border-radius:999px;margin-top:4px;overflow:hidden}

.theme-btn{width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform 160ms ease}

.mode-btn[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:transparent}
.thread{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.thread-head{padding:12px 16px 10px;border-bottom:1px solid var(--border)}

.thread-head p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--subtle);border:1px solid var(--border);padding:2px 10px;border-radius:999px}
.bubble{max-width:88%;padding:10px 12px 12px;border-radius:12px;border:1px solid var(--border);background:var(--subtle)}
.bubble.user{align-self:flex-end;background:var(--ink);color:var(--page);border-color:transparent;border-bottom-right-radius:4px}
.bubble.plain{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.bubble .who{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.bubble.user .who{color:inherit;opacity:.75}
.bubble p{margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px 14px;transition:transform 170ms ease}
.card-title{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}

.pill.working{background:var(--blue-bg);color:var(--blue);border-color:transparent}
.pill.waiting{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.pill.failed{background:var(--red-bg);color:var(--red);border-color:transparent}
.pill.done{background:var(--green-bg);color:var(--green);border-color:transparent}
.tools{display:flex;gap:6px;align-items:center}
.tool{width:22px;height:22px;border-radius:999px;border:1px solid var(--border);background:var(--subtle);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex-shrink:0}
.checks{display:flex;flex-direction:column;gap:4px;font-size:13px}
.check{display:flex;gap:8px;align-items:center;color:var(--ink)}
.check s,.check .done-mark{color:var(--green)}
.task-detail{font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px}
.sub{background:var(--subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.decision{border-left:3px solid var(--amber-dot)}
.dec-actions{display:flex;gap:8px;margin-top:10px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 12px 7px 10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background 160ms ease,transform 160ms ease}
.btn.primary{background:var(--ink);color:var(--page);border-color:transparent;padding-left:12px}

.dim{opacity:.82}

.icon-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--border);background:var(--subtle);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 0 0 2px;transition:background 160ms ease}

.foot{display:flex;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
html[data-theme="dark"] .thumb{outline-color:rgba(255,255,255,.1)}
@media (max-width:560px){.wrap{padding:12px 10px 24px}.bubble{max-width:100%}.ctx-bar{width:80px}.topbar{flex-wrap:wrap}}
@media (hover:hover) and (pointer:fine){
.card:hover{transform:translateY(-1px)}
.mode-btn:hover{background:var(--subtle)}
.mode-btn[aria-pressed="true"]:hover{background:var(--ink)}
.btn:hover{background:var(--subtle)}
.btn.primary:hover{background:var(--ink2)}
.icon-btn:hover{background:var(--border)}
.theme-btn:hover{transform:translateY(-1px)}
.scrolled-pill:hover{opacity:.9}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function tick(){
state.tick++;
var t=state.tick;
R.ctxLabel.textContent=state.tokens+"k / 200k tokens";
R.prog.style.width=state.prog+"%";
if(state.mode==="live"){
var dots=".".repeat(1+(t%3));R.typText.textContent="orchestrator is working"+dots;
if(t%8===0){state.tokens=(state.tokens>=47?44:state.tokens+1);R.taskMeta.textContent="research-agent · 3 of 5 steps · "+state.tokens+"k / 200k";}
if(t===12){R.aText.textContent="Update \u2014 billing webhooks verified, only staging sign-off left.";}
if(t>=20){state.tick=0;R.aText.textContent="Here\u2019s where we stand \u2014 2 blockers remain: billing webhook retries and staging sign-off. Everything else is green.";}
}else if(state.mode==="uploading"){
state.prog=(state.prog+7)%101;R.upText.textContent="Uploading launch-notes.pdf · "+state.prog+"%";
if(state.prog===0){state.tick=0;}
}else if(state.mode==="dictating"){
state.dictSec++;var s=state.dictSec%60;var mm=Math.floor(state.dictSec/60);R.dictText.textContent="Dictating\u2026 "+mm+":"+(s<10?"0":"")+s;
if(state.dictSec>=30){state.dictSec=0;state.tick=0;}
}else if(state.mode==="offline"){
R.off.textContent="Offline \u2014 reconnecting\u2026 "+(state.queue)+" queued · replies will queue.";
}else if(state.mode==="error"&&R.errState==="retrying"){
if(t%4===0){R.errText.textContent="Something failed to send. ";R.errState="";state.mode="live";applyMode();}
}
}
function bind(){
for(var id in R.modeBtns){(function(k){R.modeBtns[k].addEventListener("click",function(){state.mode=k;state.tick=0;state.prog=0;applyMode();});})(id);}
R.send.addEventListener("click",send);R.input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send();}if(e.key==="Escape"){R.input.value="";}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){R.scrollBtn.hidden=true;}});
R.attach.addEventListener("click",function(){state.mode="uploading";state.prog=0;applyMode();});
R.mic.addEventListener("click",function(){state.mode="dictating";state.dictSec=0;applyMode();});
R.inbox.addEventListener("click",function(){R.route.textContent="Route: Agent Inbox";R.threadSub.textContent="Agent Inbox · 2 working · 3 agents";});
R.tasks.addEventListener("click",function(){R.route.textContent="Route: Tasks";R.threadSub.textContent="Tasks · 3 of 5 steps";});
R.themeBtn.addEventListener("click",function(){var h=document.documentElement;var next=h.getAttribute("data-theme")==="dark"?"light":"dark";h.setAttribute("data-theme",next);try{localStorage.setItem("affectui-agent-thread-theme",next);}catch(e){}R.themeIcon.textContent=next==="dark"?"☀":"☾";});
try{var cur=document.documentElement.getAttribute("data-theme");R.themeIcon.textContent=cur==="dark"?"☀":"☾";}catch(e){}
}
function send(){
var v=R.input.value.trim();
if(!v)return;
if(state.mode==="offline"){state.queue++;R.off.textContent="Offline \u2014 reconnecting\u2026 "+state.queue+" queued · replies will queue.";R.input.value="";return;}
R.uText.textContent=v;R.input.value="";state.mode="live";state.tick=0;applyMode();
}
buildStatic();bind();applyMode();
var timer=setInterval(tick,900);
if(window.__test__){clearInterval(timer);}
window.__thread={refs:R,state:state,setMode:function(m){state.mode=m;applyMode();},tick:tick,modes:MODES};
})();
</script>
</body>
</html>
