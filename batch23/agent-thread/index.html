<style>

.btn.primary:hover{background:var(--ink2)}

</style>
</head>

else if(m==="scrolled"){R.threadSub.textContent="Scrolled up \u00B7 3 unread below";R.route.textContent="Route: Scrolled up";}
else if(m==="offline"){R.threadSub.textContent="Offline \u00B7 replies queue locally";R.route.textContent="Route: Offline";}
else if(m==="uploading"){R.threadSub.textContent="Uploading \u00B7 resumable";R.route.textContent="Route: Uploading";}
else if(m==="dictating"){R.threadSub.textContent="Dictating \u00B7 transcribing locally";R.route.textContent="Route: Dictating";}
else if(m==="away"){R.threadSub.textContent="Away summary \u00B7 5 missed updates";R.route.textContent="Route: Away summary";}
else if(m==="error"){R.threadSub.textContent="Error \u00B7 retry safely";R.route.textContent="Route: Error";}
else if(m==="loading"){R.threadSub.textContent="Loading thread\u2026";R.route.textContent="Route: Loading";}
R.day.textContent="Today \u00B7 "+m;
}
function tick(){
state.tick++;
var t=state.tick;
R.ctxLabel.textContent=state.tokens+"k / 200k tokens";
R.prog.style.width=state.prog+"%";
if(state.mode==="live"){var dots=".".repeat(1+(t%3));R.typText.textContent="orchestrator is working"+dots;updateStreamInPlace();}
else if(state.mode==="decision"){if(!state.streamDone){R.aText.textContent=STREAM_FULL;state.streamIdx=STREAM_FULL.length;state.streamDone=true;}for(var i=0;i<R.taskCards.length;i++){R.taskCards[i].hidden=false;}}
else if(state.mode==="uploading"){state.prog=(state.prog+7)%101;R.upText.textContent="Uploading launch-notes.pdf \u00B7 "+state.prog+"%";if(state.prog===0){state.tick=0;}}
else if(state.mode==="dictating"){state.dictSec++;var s=state.dictSec%60;var mm=Math.floor(state.dictSec/60);R.dictText.textContent="Dictating\u2026 "+mm+":"+(s<10?"0":"")+s;if(state.dictSec>=30){state.dictSec=0;state.tick=0;}}
else if(state.mode==="offline"){R.off.textContent="Offline \u2014 reconnecting\u2026 "+(state.queue)+" queued \u00B7 replies will queue.";}
else if(state.mode==="error"&&R.errState==="retrying"){if(t%4===0){R.errText.textContent="Something failed to send. ";R.errState="";state.mode="live";applyMode();}}
if(state.tick>=60){state.tick=0;state.streamIdx=0;state.streamDone=false;R.aText.textContent="";if(state.mode!=="decision"&&state.mode!=="loading"){R.taskCards[2].hidden=true;}}
}
function bind(){
for(var id in R.modeBtns){(function(k){R.modeBtns[k].addEventListener("click",function(){state.mode=k;state.tick=0;state.prog=0;applyMode();});})(id);}
R.send.addEventListener("click",send);R.input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send();}if(e.key==="Escape"){R.input.value="";}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){R.scrollBtn.hidden=true;}});
R.attach.addEventListener("click",function(){state.mode="uploading";state.prog=0;applyMode();});
R.mic.addEventListener("click",function(){state.mode="dictating";state.dictSec=0;applyMode();});
R.inbox.addEventListener("click",function(){R.route.textContent="Route: Agent Inbox";R.threadSub.textContent="Agent Inbox \u00B7 2 working \u00B7 3 agents";});
R.tasks.addEventListener("click",function(){R.route.textContent="Route: Tasks";R.threadSub.textContent="Tasks \u00B7 3 cards";});
R.themeBtn.addEventListener("click",function(){var h=document.documentElement;var next=h.getAttribute("data-theme")==="dark"?"light":"dark";h.setAttribute("data-theme",next);try{localStorage.setItem("affectui-agent-thread-theme",next);}catch(e){}R.themeIcon.textContent=next==="dark"?"\u2600":"\u263E";});
try{var cur=document.documentElement.getAttribute("data-theme");R.themeIcon.textContent=cur==="dark"?"\u2600":"\u263E";}catch(e){}
}
function send(){
var v=R.input.value.trim();
if(!v)return;
if(state.mode==="offline"){state.queue++;R.off.textContent="Offline \u2014 reconnecting\u2026 "+state.queue+" queued \u00B7 replies will queue.";R.input.value="";return;}
R.uText.textContent=v;R.input.value="";state.mode="live";state.tick=0;applyMode();
}
buildStatic();bind();applyMode();
var timer=setInterval(tick,900);
if(window.__test__){clearInterval(timer);}
window.__thread={refs:R,state:state,setMode:function(m){state.mode=m;applyMode();},tick:tick,applyMode:applyMode,modes:MODES,completeStream:function(){state.streamIdx=STREAM_FULL.length;state.streamDone=true;R.aText.textContent=STREAM_FULL;if(state.mode!=="loading"){for(var i=0;i<R.taskCards.length;i++){R.taskCards[i].hidden=false;}}},resetStream:function(){state.streamIdx=0;state.streamDone=false;state.tick=0;R.aText.textContent="";applyMode();},streamFull:STREAM_FULL,tasks:TASKS,decQ:DEC_Q,decOpts:DEC_OPTS,decHead:DEC_HEAD};
})();

</script>
</body>
