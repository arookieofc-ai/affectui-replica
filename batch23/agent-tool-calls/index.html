<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ops agent — Agent / Tool Calls</title>
<script>/*noflash*/(function(){try{var k='atc-theme';var t=null;try{t=localStorage.getItem(k)}catch(e){}if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root, html[data-theme="light"]{
--surface:#ffffff; --page:#fafaf9; --ink:#171717; --strong:#1c1917;
--muted:#78716c; --faint:#a8a29e; --subtle:#f5f5f4; --border:#e7e5e4;
--panel:var(--page); --card:var(--surface); --line:var(--border); --line-strong:#d6d3d1;
--text:var(--ink); --chip:#efefec;
--hover:rgba(0,0,0,.045);
--radius-lg:16px; --radius:10px; --radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--shadow-hover:0 1px 2px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.09);
--focus:rgba(0,96,226,.7);
--run-bg:#e3f0fd; --run-fg:#0969c8; --ok-bg:#def5e5; --ok-fg:#0a7a3c;
--wait-bg:#fef3c7; --wait-fg:#92400e; --err-bg:#fde4e1; --err-fg:#c2261b;
--accent:#1c1917; --accent-ink:#ffffff;
--img-ring:rgba(0,0,0,.1);
}
html[data-theme="dark"]{
--surface:#1c1c1f; --page:#101012; --ink:#ededed; --strong:#f5f5f4;
--muted:#a1a1aa; --faint:#71717a; --subtle:#26262a; --border:#2e2e33;
--panel:var(--page); --card:var(--surface); --line:var(--border); --line-strong:#3f3f46;
--text:var(--ink); --chip:#2a2a2e;
--hover:rgba(255,255,255,.06);
--shadow:0 0 0 .5px rgba(255,255,255,.06),0 4px 16px rgba(0,0,0,.5);
--shadow-hover:0 0 0 .5px rgba(255,255,255,.1),0 8px 28px rgba(0,0,0,.55);
--focus:rgba(77,141,255,.8);
--run-bg:#0b2f55; --run-fg:#7cc0ff; --ok-bg:#0a3a22; --ok-fg:#6fd598;
--wait-bg:#451a03; --wait-fg:#fde68a; --err-bg:#47100c; --err-fg:#ff9a8f;
--accent:#ededed; --accent-ink:#101012;
--img-ring:rgba(255,255,255,.1);
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;background:var(--panel);color:var(--text);
font:14px/20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
font-variant-numeric:tabular-nums;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.page{max-width:1060px;margin:0 auto;padding:18px 18px 48px}
/* header: project name + working count + agent count */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0}
.crumbs .proj{font-size:15px;font-weight:650;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{color:var(--faint)}
.crumbs .range{font-size:13px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--chip);font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:#22c55e}
.live[data-live="false"] i{background:var(--faint)}
.counts{font-size:12.5px;color:var(--muted)}
.spacer{flex:1}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:999px;
border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);
font-size:13px;font-weight:550;color:var(--strong);transition:box-shadow 160ms ease,background-color 160ms ease,filter 160ms ease}
.btn .ic{display:grid;place-items:center;width:16px;height:16px}
.btn small{font-weight:500;color:var(--muted)}
.btn--primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn--primary small{color:inherit;opacity:.75}
.themebtn{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:50%}
.themebtn span{font-size:15px;line-height:1}
/* summary */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.sum>div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 12px 12px;min-width:0}
.sum dt{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.sum dd{margin:2px 0 0;font-size:16px;font-weight:650;color:var(--strong)}
.sum dd small{font-size:12px;font-weight:500;color:var(--muted)}
.ctxbar{height:3px;border-radius:999px;background:var(--chip);margin-top:8px;overflow:hidden}
.ctxbar i{display:block;height:100%;width:32%;background:var(--run-fg);border-radius:999px}
.ctxlabel{text-align:right;font-size:11.5px;color:var(--muted);margin-top:4px}
/* org chart */
.org{margin-top:14px}
.colhead{display:grid;grid-template-columns:1fr;gap:0;min-height:26px;margin:0 0 2px}
.colhead span{font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.agentwrap{display:flex;justify-content:center;padding:10px 0 0;position:relative}
.agentwrap::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:22px;background:var(--line-strong);transform:translateX(-50%)}
.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding-top:22px;position:relative}
.toolgrid::before{content:"";position:absolute;top:0;left:6%;right:6%;height:2px;background:var(--line-strong);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);
padding:12px 12px 14px;min-width:0;cursor:pointer;position:relative;transition:box-shadow 160ms ease,opacity 200ms ease,transform 160ms ease}
.card .role{position:absolute;bottom:calc(100% + 6px);left:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
padding:2px 7px;border-radius:var(--radius-sm);background:var(--chip);font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.card .head{display:flex;align-items:center;gap:8px;min-width:0;height:26px}
.card .head b{flex:1;min-width:0;overflow:hidden;font-size:13.5px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;color:var(--strong)}
.card .desc{overflow:hidden;font-size:12.5px;line-height:18px;white-space:nowrap;text-overflow:ellipsis;color:var(--text);height:18px;margin-top:2px}
.card .well{display:flex;align-items:center;gap:8px;min-width:0;height:36px;margin:8px -6px -6px;padding:0 10px 0 8px;border-radius:calc(var(--radius-lg) - 6px);background:var(--subtle)}
.card .well .fn{flex:1;min-width:0;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.card .well .n{flex:none;font-size:12px;font-weight:600;white-space:nowrap;color:var(--strong)}
.card .well .n small{font-weight:500;color:var(--muted)}
.card--agent{width:min(100%,340px);cursor:pointer}
.card--agent .task{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--text);white-space:nowrap;text-overflow:ellipsis}
.card[data-dim="true"]{opacity:.78}
.card[data-selected="true"]{border-color:var(--focus);box-shadow:var(--shadow-hover)}
.mark{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--subtle);border:1px solid var(--line);color:var(--text);box-shadow:inset 0 0 0 1px var(--img-ring)}
.mark .logo{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.pix{display:grid;grid-template-columns:repeat(3,4px);grid-auto-rows:4px;gap:2px;place-content:center;width:18px;height:18px}
.pix i{border-radius:1px;background:var(--focus);opacity:0}
.pix i[data-on]{opacity:1}
.pix[data-busy] i{animation:pix 1.2s ease-in-out infinite both}
.pix[data-busy] i:not([data-on]){opacity:.16}
@keyframes pix{0%,100%{opacity:1}50%{opacity:.2}}
.chip{display:inline-flex;flex:none;align-items:center;gap:5px;height:20px;padding:0 8px 0 7px;border-radius:999px;background:var(--chip);font-size:11px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[data-s="running"]{background:var(--run-bg);color:var(--run-fg)}
.chip[data-s="waiting"]{background:var(--wait-bg);color:var(--wait-fg)}
.chip[data-s="done"]{background:var(--ok-bg);color:var(--ok-fg)}
.chip[data-s="failed"]{background:var(--err-bg);color:var(--err-fg)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip[data-s="running"] .dot{animation:pix 1s ease-in-out infinite}
.mode{flex:none;padding:0 7px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:600;line-height:18px;white-space:nowrap;color:var(--text)}
.mode[data-m="off"]{color:var(--muted)}
.ghost{border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);padding:12px 14px;min-height:104px;display:grid;align-content:center;gap:4px;cursor:pointer;color:var(--muted);background:transparent}
.ghost b{color:var(--strong);font-size:13px}
/* history */
.hist{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.histhead{display:flex;align-items:center;gap:8px;padding:10px 10px 0;flex-wrap:wrap}
.tabs{display:flex;gap:2px}
.tabs button{height:30px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--chip);color:var(--strong);font-weight:600}
.tabs .cnt{margin-left:4px;padding:0 5px;border-radius:6px;background:var(--err-bg);color:var(--err-fg);font-size:11px}
.filterchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 9px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--strong)}
.hist table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;margin-top:6px}
.hist th,.hist td{height:34px;padding:0 10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist thead th{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.hist tbody tr{cursor:pointer}
.hist tbody tr[data-open="true"]{background:var(--hover)}
.hist td.num,.hist th.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.hist td.time{color:var(--muted);font-size:12px;width:132px}
.hist td.tool{width:150px}
.hist td.status{width:118px}
.hist td.dur,.hist td.tok{width:84px}
.hist td.run{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px;width:110px}
.hist td.input{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px}
/* panel */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 14px 16px;position:sticky;top:12px}
.panel h2{margin:0;font-size:14px;color:var(--strong);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.panel .sub{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.panel .prow{display:flex;align-items:center;gap:10px}
.panel section{margin-top:14px;display:grid;gap:6px}
.panel h3{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.panel p{margin:0;font-size:13px;line-height:20px}
.panel .facts{font-size:13px;color:var(--muted)}
.panel .facts b{color:var(--strong)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv>div{padding:9px 12px}
.kv>div:nth-child(2){border-left:1px solid var(--line)}
.kv dt{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--strong)}
.modes{display:flex;gap:2px}
.modes button{flex:1;height:30px;border-radius:8px;font-size:13px;color:var(--muted)}
.modes button[aria-checked="true"]{background:var(--chip);color:var(--strong);font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rowbtn{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 8px;border-radius:8px;text-align:left;font-size:13px}
.rowbtn .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rowbtn .m{flex:none;font-size:12px;color:var(--muted)}
.code{margin:0;padding:10px 12px;border-radius:10px;background:var(--subtle);border:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.note{display:grid;gap:8px;padding:10px 12px;border-radius:10px;background:var(--subtle);border:1px solid var(--line);font-size:13px}
.note .acts{display:flex;justify-content:flex-end;gap:6px}
.linkbtn{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-size:12.5px;font-weight:550;padding:5px 8px;border-radius:8px;justify-self:start}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.32)}
.dialog{width:min(100%,560px);max-height:84vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-hover);padding:14px}
.dialog input{width:100%;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--subtle);color:var(--strong);padding:0 10px;font:inherit}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border-radius:10px;text-align:left}
.opt b{display:block;font-size:13.5px;color:var(--strong)}
.opt small{display:block;font-size:12px;color:var(--muted)}
.opt .st{margin-left:auto;font-size:12px;color:var(--muted)}
@media (max-width:860px){
.layout{grid-template-columns:minmax(0,1fr)}
.panel{position:static}
.toolgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.sum{grid-template-columns:repeat(2,minmax(0,1fr))}
.hist td.run,.hist th.run,.hist td.tok,.hist th.tok{display:none}
}
@media (max-width:520px){.toolgrid{grid-template-columns:minmax(0,1fr)}.page{padding:12px 12px 40px}}
@media (prefers-reduced-motion:reduce){.pix i,.chip[data-s="running"] .dot{animation:none}}
@media (hover:hover) and (pointer:fine){
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.btn:hover{filter:brightness(1.04)}
.btn:not(.btn--primary):hover{background:var(--hover)}
.tabs button:hover{color:var(--strong)}
.hist tbody tr:hover{background:var(--hover)}
.rowbtn:hover{background:var(--hover)}
.opt:hover{background:var(--hover)}
.ghost:hover{background:var(--hover)}
.linkbtn:hover{background:var(--hover)}
}
</style>
</head>
<body>
<div class="page" id="page">
<header class="topbar">
<div class="crumbs"><span class="proj" id="proj">Ops agent</span><span class="sep">/</span><span class="range" id="rangeLabel">Today</span><span class="live" id="liveBadge" data-live="true"><i></i><span id="liveText">Live</span></span></div>
<div class="counts" id="counts"></div>
<div class="spacer"></div>
<div class="controls">
<button class="btn" id="btnConnect" type="button"><span class="ic">＋</span><span>Connect tool</span></button>
<button class="btn" id="btnPause" type="button"><span class="ic" id="pauseIc">⏸</span><span id="pauseTx">Pause agent</span></button>
<button class="btn themebtn" id="btnTheme" type="button" aria-label="Toggle theme"><span id="themeIc">◐</span></button>
</div>
</header>
<section class="sum" aria-label="Summary" id="sum"></section>
<div class="layout">
<div>
<section class="org" aria-label="Ops agent and its tools">
<div class="colhead"><span>Agent · Tools org chart</span></div>
<div class="agentwrap" id="agentWrap"></div>
<div class="toolgrid" id="toolGrid" role="list" aria-label="Agent and tools"></div>
</section>
<section class="hist" aria-label="Tool calls">
<div class="histhead">
<div class="tabs" role="tablist" aria-label="Tool calls">
<button type="button" role="tab" id="tabAll" aria-selected="true">Tool calls</button>
<button type="button" role="tab" id="tabFailed" aria-selected="false">Failed<span class="cnt" id="failCnt"></span></button>
</div>
<span id="filterSlot"></span>
<div class="spacer"></div>
<button class="linkbtn" id="btnFold" type="button">Fold ▾</button>
</div>
<div id="tableSlot"></div>
</section>
</div>
<aside class="panel" id="panel" aria-label="Details"></aside>
</div>
</div>
<div id="overlaySlot"></div>
