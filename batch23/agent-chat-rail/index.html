<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<script>/*noflash*/(function(){try{var k="agent-chat-rail-theme";var s=null;try{s=localStorage.getItem(k)}catch(e){}var t=s;if(!t){try{t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){t="light"}}if(!t)t="light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Assistant — Best fabric for a summer overshirt</title>
<style>
:root{
  --surface:#ffffff; --page:#fafaf9; --ink:#171717; --ink2:#1c1917;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-deep:0 2px 6px rgba(0,0,0,.07),0 10px 28px rgba(0,0,0,.09);
  --working:#2563eb; --working-bg:#dbeafe;
  --waiting:#f59e0b; --waiting-bg:#fef3c7; --waiting-ink:#92400e;
  --ok:#16a34a; --fail:#dc2626;
  --img-outline:rgba(0,0,0,.1);
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-deep:0 2px 8px rgba(0,0,0,.5),0 14px 36px rgba(0,0,0,.5);
  --working:#60a5fa; --working-bg:#172554;
  --waiting:#fbbf24; --waiting-bg:#451a03; --waiting-ink:#fde68a;
  --img-outline:rgba(255,255,255,.1);
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--working);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:60px 264px minmax(0,1fr) 336px;min-height:100vh}
/* icon rail */
.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);cursor:pointer;transition:background 160ms ease,color 160ms ease,transform 160ms ease}
.rail-btn svg{width:19px;height:19px;display:block}
.rail-btn span{font-size:10px;line-height:1}
.rail-btn[aria-current="true"]{background:var(--subtle);color:var(--ink)}
.rail-spacer{flex:1}
.rail-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--fail);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rail-wrap{position:relative}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.newchat{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px 9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-weight:600;transition:transform 160ms ease,box-shadow 160ms ease}
.newchat svg{width:16px;height:16px;flex:none}
.side-h{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 2px 0;min-height:18px}
.proj-list,.chat-list{display:flex;flex-direction:column;gap:4px}
.proj-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink);transition:background 160ms ease}
.proj-btn[aria-pressed="true"]{background:var(--subtle);border-color:var(--border)}
.proj-dot{width:8px;height:8px;border-radius:999px;flex:none}
.proj-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
.proj-count{margin-left:auto;font-size:12px;color:var(--muted)}
.chat-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border:1px solid transparent;background:transparent;border-radius:10px;cursor:pointer;min-width:0;transition:background 160ms ease}
.chat-btn[aria-current="true"]{background:var(--subtle);border-color:var(--border)}
.chat-btn.dim{opacity:.78}
.chat-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;flex:1;min-width:0}
.chat-meta{font-size:11px;color:var(--muted);flex:none}
.pin{font-size:11px;color:var(--muted);flex:none}
.unread{width:8px;height:8px;border-radius:999px;background:var(--working);flex:none}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:flex-start;gap:12px;padding:14px 18px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.topbar-main{min-width:0;flex:1}
.crumb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb strong{color:var(--ink);font-weight:700}
.chat-title-big{font-size:16px;font-weight:700;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--subtle);color:var(--ink)}
.pill.working{border-color:transparent;background:var(--working-bg);color:var(--working)}
.pill .pulse-dot{width:7px;height:7px;border-radius:999px;background:currentColor}
.pill.working .pulse-dot{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.ctx{min-width:150px;text-align:right}
.ctx-label{font-size:12px;color:var(--muted)}
.ctx-bar{height:3px;border-radius:999px;background:var(--subtle);border:1px solid var(--border);margin-top:6px;overflow:hidden}
.ctx-fill{display:block;height:100%;width:9%;background:var(--working);border-radius:999px}
.theme-btn{flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform 160ms ease;padding-left:8px;padding-right:6px}
.msgs{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
.msg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:12px 14px 14px;transition:transform 160ms ease,box-shadow 160ms ease}
.msg-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:22px}
.who{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--muted);margin-left:auto;flex:none}
.usermsg{align-self:flex-end;max-width:88%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:10px 13px}
.usermsg p{margin:0}
.agentmark{width:18px;height:18px;display:grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(3,6px);gap:0;border-radius:4px;overflow:hidden;flex:none;outline:1px solid var(--img-outline);outline-offset:-1px}
.agentmark i{width:6px;height:6px;display:block}
.agentmark.live{animation:markpulse 1.4s ease-in-out infinite}
@keyframes markpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.tools{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.tool{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink)}
.tool-ico{width:24px;height:24px;flex:none;border-radius:999px;border:1px solid var(--border);background:var(--subtle);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.tool-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tool-ms{font-size:12px;color:var(--muted);flex:none}
.tool-done{font-size:12px;color:var(--ok);font-weight:700;flex:none}
.msg-text{margin:0 0 8px}
.msg-text:last-child{margin-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;padding-left:9px;border-radius:999px;border:1px solid var(--border);background:var(--subtle);font-size:12px;font-weight:600;cursor:pointer;transition:transform 160ms ease}
.stream-caret{display:inline-block;width:8px;height:14px;background:var(--working);border-radius:2px;vertical-align:-2px;margin-left:4px;animation:blink 1s steps(2) infinite}
.composer{padding:12px 18px 16px;background:var(--surface);border-top:1px solid var(--border)}
.composer-inner{max-width:820px;margin:0 auto;display:flex;gap:8px}
.composer input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--border);background:var(--page);color:var(--ink);font:inherit}
.send{flex:none;min-width:64px;padding:11px 16px 11px 14px;border-radius:999px;border:1px solid transparent;background:var(--ink);color:var(--page);font-weight:700;cursor:pointer;transition:transform 160ms ease}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:16px;margin:0 0 6px}
/* findings */
.findings{background:var(--surface);border-left:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.find-h{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 2px 0;min-height:18px}
.find-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:12px 12px 14px;transition:transform 160ms ease,box-shadow 160ms ease}
.find-card.flash{box-shadow:var(--shadow-deep)}
.find-title{font-size:15px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find-updated{font-size:12px;color:var(--muted);margin:2px 0 8px}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
table.cmp th,table.cmp td{text-align:left;padding:7px 8px;border-top:1px solid var(--border);vertical-align:top}
table.cmp thead th{border-top:0;color:var(--muted);font-weight:700;font-size:12px;white-space:nowrap}
.src-list{margin:8px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:6px}
img{outline:1px solid var(--img-outline);outline-offset:-1px}
@media (hover:hover) and (pointer:fine){
  .rail-btn:hover{background:var(--subtle);color:var(--ink)}
  .newchat:hover{transform:translateY(-1px);box-shadow:var(--shadow-deep)}
  .proj-btn:hover{background:var(--subtle)}
  .chat-btn:hover{background:var(--subtle)}
  .msg-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-deep)}
  .theme-btn:hover{transform:translateY(-1px)}
  .chip:hover{transform:translateY(-1px)}
  .send:hover{transform:translateY(-1px)}
  .find-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-deep)}
}
@media (max-width:1180px){.app{grid-template-columns:60px 240px minmax(0,1fr)}.findings{grid-column:1/-1;border-left:0;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;align-items:start}.find-h{grid-column:1/-1}}
@media (max-width:820px){.app{grid-template-columns:52px minmax(0,1fr)}.rail{grid-row:span 3}.side{border-right:0;border-bottom:1px solid var(--border)}.main{grid-column:2}.findings{grid-column:2;display:flex}.ctx{display:none}.usermsg{max-width:100%}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Primary">
    <div id="railTop" style="display:contents"></div>
    <div class="rail-spacer"></div>
    <div id="railBottom" style="display:contents"></div>
  </nav>
  <aside class="side" aria-label="Projects and chats">
    <button class="newchat" id="newChatBtn" type="button"><span aria-hidden="true">✎</span><span>New chat</span></button>
    <div><div class="side-h">Projects</div><div class="proj-list" id="projList"></div></div>
    <div><div class="side-h">Chats</div><div class="chat-list" id="chatList"></div></div>
  </aside>
  <main class="main" aria-label="Assistant chat">
    <div class="topbar">
      <div class="topbar-main">
        <div class="crumb" id="crumb"></div>
        <h1 class="chat-title-big" id="chatTitle"></h1>
        <div class="sub"><span id="statusPill"></span><span id="agentLine"></span></div>
      </div>
      <div class="ctx" aria-label="Context usage"><div class="ctx-label" id="ctxLabel">18k / 200k</div><div class="ctx-bar" aria-hidden="true"><span class="ctx-fill" id="ctxFill"></span></div></div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">◐</button>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="empty" id="emptyView" hidden><h2>New chat</h2><p>Ask anything – it searches the web.</p></div>
    <div class="composer"><div class="composer-inner">
      <input id="composerInput" type="text" placeholder="Ask anything – it searches the web" aria-label="Ask anything">
      <button class="send" id="sendBtn" type="button">➤ Send</button>
    </div></div>
  </main>
  <aside class="findings" aria-label="Findings" id="findings">
    <div class="find-h">Findings</div>
    <div id="findCards" style="display:contents"></div>
  </aside>
</div>
<script>
(function(){
"use strict";
var THEME_KEY="agent-chat-rail-theme";
var RAIL_TOP=[{label:"Chats"},{label:"Tasks"},{label:"Runs"},{label:"Folders"},{label:"Integrations"}];
var RAIL_BOTTOM=[{label:"Notifications",count:2},{label:"Settings"}];
var ACTIVE_RAIL="Chats";
var PROJECTS=["Summer collection","Brand","Hiring","Research"];
var PROJ_COLORS={"Summer collection":"#0ea5e9","Brand":"#8b5cf6","Hiring":"#22c55e","Research":"#f59e0b"};
var CHATS=[
  {id:"c-fabric",title:"Best fabric for a summer overshirt",folder:"Summer collection"},
  {id:"c-colors",title:"Colour names for the linen line",folder:"Summer collection"},
  {id:"c-sizing",title:"Size chart for relaxed fits",folder:"Summer collection"},
  {id:"c-tone",title:"Tone of voice, in five rules",folder:"Brand",pinned:true},
  {id:"c-designer",title:"Interview questions for a designer",folder:"Hiring"},
  {id:"c-suppliers",title:"Linen suppliers in Portugal",folder:"Research",unread:true},
  {id:"c-returns",title:"Why people return shirts",folder:"Research"},
  {id:"c-trip",title:"Packing list for Lisbon",folder:""},
  {id:"c-email",title:"Reply to the agency",folder:""}
];
var ACTIVE_CHAT="c-fabric";
var TABLE_HEAD=["Fabric","Weight (gsm)","Breathes","Creases","Price / m"];
var TABLE_ROWS=[
  ["Linen","150–190","Best","A lot","€14"],
  ["Linen-cotton 55/45","160–180","Very well","Some","€11"],
  ["Cotton poplin","110–130","Well","Little","€8"],
  ["Cotton seersucker","140–160","Very well","Hardly","€10"]
];
var SOURCES={
  title:"Sources",
  intro:"Six pages the assistant read for this answer, with what it took from each.",
  bullets:[
    "Textile Exchange – Preferred Fiber Report: linen's water and pesticide use",
    "The Fabric Store – Linen weights explained: 150–190 gsm for shirts",
    "Merchant & Mills – Linen-cotton blends: fewer creases, softer from the start",
    "Hemp & Linen Institute – Moisture regain of flax vs. cotton",
    "Permanent Style – Seersucker in summer tailoring",
    "Reddit r/malefashionadvice – How linen shirts age after a summer"
  ]
};
var MSG_SEED=[
  {id:"u1",role:"user",text:"What\u2019s the best fabric for a summer overshirt \u2013 linen, cotton or a blend?"},
  {id:"a1",role:"agent",tools:[
    {label:"Searched the web for \u201Clinen vs cotton breathability\u201D",ms:"1.4s"},
    {label:"Read 6 pages",ms:"3.1s"},
    {label:"Compared weights, creasing and price",ms:"0.9s"}
  ],texts:[
    "Linen breathes best \u2013 it pulls moisture off the skin and dries fast, which is why it feels cool on a hot day. The trade-off is creasing: a pure linen overshirt looks lived-in after an hour.",
    "For an overshirt I\u2019d take a linen-cotton blend around 55/45 at 160\u2013180 gsm: it keeps most of the coolness, creases far less and is soft from the first wear. Pure linen if the relaxed look is the point; seersucker if it has to look sharp all day."
  ],artifacts:["fabric-comparison.csv","sources.md"]},
  {id:"u2",role:"user",text:"Which weight for a shirt you can wear open over a T-shirt?"},
  {id:"a2",role:"agent",tools:[{label:"Searched the web for \u201Covershirt fabric weight gsm\u201D",ms:"1.2s"}],
  texts:["Go a little heavier than a shirt: 180\u2013200 gsm. It hangs straight when it\u2019s open, doesn\u2019t cling to the T-shirt underneath and still breathes \u2013 under 160 gsm it starts to look like a shirt you forgot to button."]}
];
var REPLY_TEXT="Here\u2019s what I found: the sources agree on the main point, and the comparison sheet has the numbers side by side. Want me to turn it into a short brief for the supplier?";
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function svgIcon(kind){
  var map={Chats:"◫",Tasks:"✓",Runs:"▶",Folders:"▤",Integrations:"◈",Notifications:"🔔",Settings:"⚙"};
  var s=el("span",null,map[kind]||"•");s.setAttribute("aria-hidden","true");return s;
}
function pixelMark(id,live){
  var h=hashStr(id||"assistant");
  var box=el("span","agentmark"+(live?" live":""));box.setAttribute("aria-hidden","true");
  var hue=h%360;var hue2=(hue+70)%360;
  for(var i=0;i<9;i++){
    var c=document.createElement("i");
    var bit=(h>>i)&1;
    var center=(i===4);
    if(center||bit){c.style.background=(i%3===0)?("hsl("+hue+",65%,55%)"):(i%3===1?("hsl("+hue2+",60%,50%)"):"#2dd4bf");}
    else{c.style.background="transparent";}
    box.appendChild(c);
  }
  return box;
}
var refs={msgs:[],msgNodes:{},working:0,streamNodes:[],timers:[],activeProject:"Summer collection",empty:false};
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem(THEME_KEY,t)}catch(e){}var b=document.getElementById("themeBtn");if(b)b.textContent=(t==="dark"?"☾":"☀");}
function relTime(){return "Just now"}
function buildRail(){
  var top=document.getElementById("railTop");var bot=document.getElementById("railBottom");
  RAIL_TOP.forEach(function(r){
    var b=el("button","rail-btn");b.type="button";b.textContent="";
    var ic=el("span",null,null);var glyph=svgIcon(r.label);ic.appendChild(glyph);
    var lab=el("span",null,r.label);
    b.appendChild(glyph);b.appendChild(lab);
    if(r.label===ACTIVE_RAIL)b.setAttribute("aria-current","true");
    b.setAttribute("aria-label",r.label);
    top.appendChild(b);
  });
  RAIL_BOTTOM.forEach(function(r){
    var wrap=el("span","rail-wrap");
    var b=el("button","rail-btn");b.type="button";
    var glyph=svgIcon(r.label);b.appendChild(glyph);b.appendChild(el("span",null,r.label));
    b.setAttribute("aria-label",r.label+(r.count?(" ("+r.count+" unread)"):""));
    wrap.appendChild(b);
    if(r.count){wrap.appendChild(el("span","rail-badge",String(r.count)));}
    bot.appendChild(wrap);
  });
}
function buildSide(){
  var pl=document.getElementById("projList");
  PROJECTS.forEach(function(p){
    var b=el("button","proj-btn");b.type="button";b.setAttribute("aria-pressed",p===refs.activeProject?"true":"false");
    var d=el("span","proj-dot");d.style.background=PROJ_COLORS[p]||"#a3a3a3";
    b.appendChild(d);b.appendChild(el("span","proj-name",p));
    var n=CHATS.filter(function(c){return c.folder===p}).length;
    b.appendChild(el("span","proj-count",n?String(n):""));
    b.addEventListener("click",function(){refs.activeProject=p;var kids=pl.childNodes;for(var i=0;i<kids.length;i++){kids[i].setAttribute("aria-pressed",kids[i].childNodes[1].textContent===p?"true":"false")}filterChats();});
    pl.appendChild(b);
  });
  var cl=document.getElementById("chatList");
  CHATS.forEach(function(c){
    var b=el("button","chat-btn"+(c.id!==ACTIVE_CHAT?" dim":""));b.type="button";b.setAttribute("data-chat",c.id);
    if(c.id===ACTIVE_CHAT)b.setAttribute("aria-current","true");
    b.appendChild(el("span","chat-title",c.title));
    if(c.pinned)b.appendChild(el("span","pin","📌"));
    if(c.unread)b.appendChild(el("span","unread"));
    else if(c.folder)b.appendChild(el("span","chat-meta",c.folder));
    b.addEventListener("click",function(){switchChat(c.id);});
    cl.appendChild(b);
  });
}
function filterChats(){
  var cl=document.getElementById("chatList");var kids=cl.childNodes;
  CHATS.forEach(function(c,i){
    var show=!refs.activeProject||c.folder===refs.activeProject||c.id===ACTIVE_CHAT;
    kids[i].style.display=show?"":"none";
  });
}
function switchChat(id){
  ACTIVE_CHAT=id;
  var cl=document.getElementById("chatList");var kids=cl.childNodes;
  CHATS.forEach(function(c,i){var on=c.id===id;if(on)kids[i].setAttribute("aria-current","true");else kids[i].removeAttribute("aria-current");kids[i].classList.toggle("dim",!on);});
  var found=null;CHATS.forEach(function(c){if(c.id===id)found=c});
  if(found){setHeader(found.folder||refs.activeProject,found.title);setEmpty(false);}
}
function setHeader(project,title){
  var crumb=document.getElementById("crumb");crumb.textContent="";
  crumb.appendChild(el("strong",null,project||"Summer collection"));
  crumb.appendChild(document.createTextNode("  •  Assistant"));
  var t=document.getElementById("chatTitle");t.textContent=title;
  updateStatus();
}
function updateStatus(){
  var pill=document.getElementById("statusPill");pill.textContent="";
  var s=el("span","pill"+(refs.working>0?" working":""),refs.working>0?("● "+refs.working+" working"):"○ idle");
  if(refs.working>0){var d=el("span","pulse-dot");s.textContent="";s.appendChild(d);s.appendChild(document.createTextNode(" "+refs.working+" working"));}
  pill.appendChild(s);
  var line=document.getElementById("agentLine");line.textContent="1 agent • context below";
  var ctx=document.getElementById("ctxLabel");
  if(ctx)ctx.textContent=refs.working>0?"19k / 200k":"18k / 200k";
}
function toolRow(t){
  var row=el("div","tool");
  var ico=el("span","tool-ico",t.label.indexOf("Searched")===0?"⌕":(t.label.indexOf("Read")===0?"◍":"▦"));
  row.appendChild(ico);
  row.appendChild(el("span","tool-label",t.label));
  row.appendChild(el("span","tool-ms",t.ms||""));
  row.appendChild(el("span","tool-done","✓"));
  return row;
}
function userNode(m){
  var w=el("div","usermsg");w.setAttribute("data-mid",m.id);
  w.appendChild(el("p",null,m.text));
  var meta=el("div","time",relTime());meta.style.textAlign="right";meta.style.marginTop="4px";
  w.appendChild(meta);refs.msgNodes[m.id]=w;return w;
}
function agentNode(m){
  var card=el("div","msg-card");card.setAttribute("data-mid",m.id);
  var head=el("div","msg-head");
  head.appendChild(pixelMark(m.id,!!m.streaming));
  head.appendChild(el("span","who","Assistant"));
  var tm=el("span","time",relTime());tm.setAttribute("data-tm",m.id);
  head.appendChild(tm);card.appendChild(head);
  if(m.tools&&m.tools.length){
    var tw=el("div","tools");m.tools.forEach(function(t){tw.appendChild(toolRow(t))});card.appendChild(tw);
  }
  (m.texts||[]).forEach(function(tx){card.appendChild(el("p","msg-text",tx))});
  if(m.streaming){var c=el("span","stream-caret");card.appendChild(c);refs.streamNodes.push(c);}
  if(m.artifacts&&m.artifacts.length){
    var chips=el("div","chips");
    m.artifacts.forEach(function(a){
      var b=el("button","chip");b.type="button";
      b.appendChild(el("span",null,"⤓ "+a));
      b.addEventListener("click",function(){flashArtifact(a);});
      chips.appendChild(b);
    });
    card.appendChild(chips);
  }
  refs.msgNodes[m.id]=card;return card;
}
function flashArtifact(name){
  var host=document.getElementById("findCards");var kids=host.childNodes;
  for(var i=0;i<kids.length;i++){var n=kids[i];if(n.getAttribute&&n.getAttribute("data-art")===name){n.classList.add("flash");(function(nn){window.setTimeout(function(){nn.classList.remove("flash")},900)})(n);}}
}
function buildMsgs(){
  var host=document.getElementById("msgs");host.textContent="";
  MSG_SEED.forEach(function(m){
    var n=m.role==="user"?userNode(m):agentNode(m);
    host.appendChild(n);refs.msgs.push(m);refs.msgNodes[m.id]=n;
  });
}
function buildFindings(){
  var host=document.getElementById("findCards");host.textContent="";
  var c1=el("div","find-card");c1.setAttribute("data-art","fabric-comparison.csv");
  c1.appendChild(el("h3","find-title","fabric-comparison.csv"));
  c1.appendChild(el("div","find-updated","Updated Just now"));
  var tbl=document.createElement("table");tbl.className="cmp";
  var thead=document.createElement("thead");var hr=document.createElement("tr");
  TABLE_HEAD.forEach(function(h){var th=document.createElement("th");th.textContent=h;hr.appendChild(th)});
  thead.appendChild(hr);tbl.appendChild(thead);
  var tb=document.createElement("tbody");
  TABLE_ROWS.forEach(function(r){var tr=document.createElement("tr");r.forEach(function(v){var td=document.createElement("td");td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});
  tbl.appendChild(tb);c1.appendChild(tbl);host.appendChild(c1);
  var c2=el("div","find-card");c2.setAttribute("data-art","sources.md");
  c2.appendChild(el("h3","find-title","sources.md"));
  c2.appendChild(el("div","find-updated","Updated Just now"));
  c2.appendChild(el("h3","find-title",SOURCES.title));
  c2.appendChild(el("p","msg-text",SOURCES.intro));
  var ul=document.createElement("ul");ul.className="src-list";
  SOURCES.bullets.forEach(function(b){var li=document.createElement("li");li.textContent=b;ul.appendChild(li)});
  c2.appendChild(ul);host.appendChild(c2);
}
function setEmpty(on){
  refs.empty=on;
  var e=document.getElementById("emptyView");var m=document.getElementById("msgs");var f=document.getElementById("findings");
  if(on){e.hidden=false;m.style.display="none";f.style.display="none";var t=document.getElementById("chatTitle");t.textContent="New chat";var crumb=document.getElementById("crumb");crumb.textContent="New chat  •  Assistant";}
  else{e.hidden=true;m.style.display="";f.style.display="";}
}
function send(text){
  if(!text)return;
  if(refs.empty)setEmpty(false);
  var host=document.getElementById("msgs");
  var um={id:"m"+Date.now()+"-u",role:"user",text:text};
  var un=userNode(um);host.appendChild(un);refs.msgs.push(um);
  refs.working++;updateStatus();
  var liveId="m"+Date.now();
  var timer1=window.setTimeout(function(){
    var short=text.slice(0,48)+(text.length>48?"…":"");
    var am={id:liveId,role:"agent",streaming:true,tools:[{label:"Searched the web for \u201C"+short+"\u201D",ms:"1.3s"}],texts:[REPLY_TEXT]};
    var an=agentNode(am);host.appendChild(an);refs.msgs.push(am);
    try{if(an.scrollIntoView)an.scrollIntoView({block:"nearest"})}catch(e){}
  },700);
  var timer2=window.setTimeout(function(){
    refs.working=Math.max(0,refs.working-1);updateStatus();
    var node=refs.msgNodes[liveId];
    if(node){
      var marks=node.childNodes[0]&&node.childNodes[0].childNodes[0];
      if(marks&&marks.classList)marks.classList.remove("live");
      var carets=node.getElementsByClassName?node.getElementsByClassName("stream-caret"):[];
      for(var i=carets.length-1;i>=0;i--){if(carets[i].parentNode)carets[i].parentNode.removeChild(carets[i]);}
    }
  },3200);
  refs.timers.push(timer1,timer2);
}
function init(){
  var stored=null;try{stored=localStorage.getItem(THEME_KEY)}catch(e){}
  var cur=document.documentElement.getAttribute("data-theme")||stored||"light";
  setTheme(cur==="dark"?"dark":"light");
  buildRail();buildSide();setHeader("Summer collection","Best fabric for a summer overshirt");buildMsgs();buildFindings();updateStatus();filterChats();
  var tb=document.getElementById("themeBtn");
  tb.addEventListener("click",function(){var c=document.documentElement.getAttribute("data-theme");setTheme(c==="dark"?"light":"dark");});
  var nb=document.getElementById("newChatBtn");
  nb.addEventListener("click",function(){setEmpty(true);});
  var sb=document.getElementById("sendBtn");var inp=document.getElementById("composerInput");
  function go(){var v=inp.value;if(!v)v="Summarise the fabric comparison for the supplier";send(v);inp.value="";}
  sb.addEventListener("click",go);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")go();});
  var tick=window.setInterval(function(){
    var nodes=document.querySelectorAll?document.querySelectorAll("[data-tm]"):[];
    for(var i=0;i<nodes.length;i++){if(nodes[i].textContent!==relTime())nodes[i].textContent=relTime();}
  },5000);
  refs.timers.push(tick);
  try{
    window.__agentChat={send:send,refs:refs,setTheme:setTheme,
      snapshot:function(){var h=document.getElementById("msgs");return Array.prototype.slice.call(h.childNodes)},
      theme:function(){return document.documentElement.getAttribute("data-theme")}};
  }catch(e){}
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}
})();
</script>
</body>
</html>
