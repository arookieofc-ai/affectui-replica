<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>/*noflash*/(function(){try{var k='assistant-overview-theme';var t=null;try{t=localStorage.getItem(k);}catch(e){}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>affectUI — Overview</title>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root{
  --surface:#ffffff; --page:#fafaf9; --panel:#ffffff;
  --ink:#1c1917; --text:#44403c; --muted:#78716c;
  --subtle:#f5f5f4; --chip:#f5f5f4; --hover:#efefed;
  --border:#e7e5e4; --line:#e7e5e4;
  --focus:rgba(0,96,226,.7); --blue:#0190fe;
  --danger:#c4320a; --success:#1e8a4f;
  --amber:#f59e0b; --amber-bg:#fef3c7; --amber-text:#92400e;
  --r-lg:16px; --r:10px; --r-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --panel:#1c1c1f;
  --ink:#ededed; --text:#d4d4d8; --muted:#a1a1aa;
  --subtle:#26262a; --chip:#26262a; --hover:#2e2e33;
  --border:#2e2e33; --line:#2e2e33;
  --focus:rgba(77,141,255,.8);
  --danger:#ff8a7a; --success:#5fc88a;
  --amber:#fbbf24; --amber-bg:#451a03; --amber-text:#fde68a;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums;
}
.page{max-width:1020px;margin:0 auto;padding:18px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 12px}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:22px;font-weight:600;line-height:28px;letter-spacing:-.02em;color:var(--ink)}
.brand svg{flex:none;display:block;color:var(--ink)}
.theme-btn{
  flex:none;width:34px;height:34px;display:inline-grid;place-items:center;
  border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);
  box-shadow:var(--shadow);cursor:pointer;font-size:16px;line-height:1;
  padding:6px 8px 6px 6px;transition:transform 150ms ease,background-color 150ms ease;
}
.theme-btn .theme-ic{display:inline-block;transform:translateX(1px)}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ui-ov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.card{
  display:flex;flex-direction:column;gap:8px;min-width:0;padding:10px 12px 12px;
  border:1px solid var(--line);border-radius:calc(var(--r) + 2px);
  background:var(--panel);box-shadow:var(--shadow);text-align:left;
  transition:transform 150ms ease,box-shadow 180ms ease;
}
.card-activity,.card-recent,.card-files{grid-column:span 2}
.card h2{
  display:flex;align-items:center;gap:6px;margin:0;
  font-size:12px;font-weight:500;line-height:16px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card h2 svg{flex:none;color:var(--muted)}
.muted{color:var(--muted)}
.small{margin:0;font-size:11.5px;line-height:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.heat{
  display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:2px;
  border-radius:4px;padding:1px;
}
.heat:focus{outline:none}
.heat:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.week{display:grid;grid-template-rows:repeat(7,auto);gap:2px;min-width:0}
.week i{display:block;aspect-ratio:1/1;border-radius:2px;background:var(--chip);min-width:0}
.week i[data-level="1"]{background:#c9e8fe;background:color-mix(in srgb,var(--blue) 22%,var(--panel))}
.week i[data-level="2"]{background:#7fc6fe;background:color-mix(in srgb,var(--blue) 45%,var(--panel))}
.week i[data-level="3"]{background:#4da9fe;background:color-mix(in srgb,var(--blue) 70%,var(--panel))}
.week i[data-level="4"]{background:var(--blue)}
html[data-theme="dark"] .week i[data-level="1"]{background:#16344c;background:color-mix(in srgb,var(--blue) 24%,var(--panel))}
html[data-theme="dark"] .week i[data-level="2"]{background:#1d5a8f;background:color-mix(in srgb,var(--blue) 48%,var(--panel))}
html[data-theme="dark"] .week i[data-level="3"]{background:#1478cf;background:color-mix(in srgb,var(--blue) 72%,var(--panel))}
.week i[data-on]{box-shadow:0 0 0 1.5px var(--panel),0 0 0 2.5px var(--ink)}
.card-activity{position:relative}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tip{
  position:absolute;z-index:2;top:var(--tip-y,0px);left:clamp(70px,var(--tip-x,50%),calc(100% - 70px));
  translate:-50% calc(-100% - 6px);padding:3px 8px;border-radius:6px;background:var(--ink);
  font-size:11px;line-height:16px;color:var(--panel);white-space:nowrap;pointer-events:none;
  box-shadow:0 4px 12px -4px rgba(0,0,0,.25);font-variant-numeric:tabular-nums;
}
.tip b{font-weight:500}
.foot{display:flex;justify-content:space-between;gap:8px;margin:auto 0 0;font-size:11.5px;line-height:16px;color:var(--text);font-variant-numeric:tabular-nums}
.foot>span:first-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:0 -6px;padding:0;list-style:none}
.row{
  display:flex;align-items:center;gap:8px;width:100%;min-width:0;padding:3px 6px;
  border:0;border-radius:calc(var(--r-sm) + 2px);background:transparent;color:var(--ink);
  font:inherit;text-align:left;cursor:pointer;transition:background-color 120ms ease;
}
.row:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mark{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:11px;line-height:1}
.mark svg{display:block}
.rtitle{flex:1;min-width:0;overflow:hidden;font-size:12.5px;line-height:18px;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.rtitle-file{display:flex}
.rtitle-file>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtitle-file>span:last-child{flex:none}
.rmeta{flex:none;font-size:11px;line-height:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.more{
  flex:none;margin:-2px -6px -2px 0;padding:2px 6px;border:0;border-radius:calc(var(--r-sm) + 1px);
  background:transparent;color:var(--text);font-size:11.5px;line-height:16px;cursor:pointer;
  transition:background-color 120ms ease,color 120ms ease;
}
.more:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.big{margin:auto 0 0;font-size:18px;font-weight:500;line-height:24px;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums}
.big .muted{font-size:12px;font-weight:400;letter-spacing:0}
.meter{display:block;height:4px;overflow:hidden;border-radius:2px;background:var(--chip)}
.meter i{display:block;width:calc(var(--ov-share,0) * 100%);height:100%;border-radius:inherit;background:var(--blue)}
.meter[data-over] i{background:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:auto 0 0}
.stats>div{min-width:0}
.stats dt{overflow:hidden;font-size:11.5px;line-height:16px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.stats dd{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;margin:2px 0 0;padding:0}
.stat{font-size:18px;font-weight:500;line-height:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.delta{font-size:11px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.delta[data-dir="up"]{color:var(--success)}
.delta[data-dir="down"]{color:var(--danger)}
.toast{
  margin-top:10px;min-height:20px;font-size:12.5px;line-height:18px;color:var(--muted);
}
.toast[data-on]{color:var(--ink)}
.hint{margin:6px 0 0;font-size:12px;line-height:16px;color:var(--muted)}
@media (hover: hover) and (pointer: fine){
  .card:hover{transform:translateY(-1px)}
  .row:hover{background:var(--hover)}
  .more:hover{background:var(--hover);color:var(--ink)}
  .theme-btn:hover{background:var(--hover)}
}
@media (max-width:700px){
  .ui-ov{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card-activity,.card-recent,.card-files{grid-column:auto}
  .card-files{order:1}
  .card-usage{order:2}.card-month{order:3}.card-activity{order:0}.card-recent{order:0}
}
@media (max-width:460px){
  .ui-ov{grid-template-columns:minmax(0,1fr)}
  .page{padding:14px 12px 32px}
}
@media (pointer:coarse){
  .row{min-height:40px}
  .more{min-height:32px;margin-top:-8px;margin-bottom:-8px}
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <span class="brand" aria-label="affectUI home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1.5" y="8.5" width="13" height="13" rx="2.5" fill="currentColor" opacity=".28"></rect>

      <ul class="list" id="recentList">
        <li><button type="button" class="row" data-nav="Chat" data-title="Q3 launch messaging"><span class="mark" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 2.5h8v5H6l-2.5 2v-2H2v-5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></span><span class="rtitle" title="Q3 launch messaging">Q3 launch messaging</span><span class="rmeta">2 hours ago</span></button></li>

<script>
(function(){
'use strict';
var WEEKS=40, TOTAL_DAYS=280;
var heatVals=Array.from({length:TOTAL_DAYS},function(_,t){
  var n=Math.floor(t/7), r=t%7;
  var frac=Math.sin(t*12.9898)*43758.5453%1;
  var a=n/WEEKS*5+(r>=5?-2.5:1);
  return Math.max(0,Math.round(a+Math.abs(frac)*4-1.5));
});
function levelFor(v){return v<=0?0:v<=2?1:v<=4?2:v<=6?3:4;}
var total=heatVals.reduce(function(a,v){return a+v;},0);
var anchor=new Date(2026,10,7);
function dateFor(i){return new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate()-(TOTAL_DAYS-1-i));}
var dateFmt=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric'});
var numFmt=new Intl.NumberFormat('en-US');
function countLabel(n){return n===0?'No chats':n===1?'1 chat':numFmt.format(n)+' chats';}
var THEME_KEY='assistant-overview-theme';
var doc=document, root=doc.documentElement;
function storedTheme(){try{var s=null;if(window.localStorage){s=window.localStorage.getItem(THEME_KEY);}if(s==='light'||s==='dark')return s;}catch(e){}return null;}
function applyTheme(t){
  root.setAttribute('data-theme',t);
  try{if(window.localStorage)window.localStorage.setItem(THEME_KEY,t);}catch(e){}
  var btn=doc.getElementById('themeBtn'), ic=doc.getElementById('themeIc');
  if(btn)btn.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');
  if(ic)ic.textContent=(t==='dark')?'\u2600':'\u263E';
}
var initTheme=root.getAttribute('data-theme')||storedTheme()||'light';
applyTheme(initTheme);
var themeBtn=doc.getElementById('themeBtn');
if(themeBtn)themeBtn.addEventListener('click',function(){
  var cur=root.getAttribute('data-theme')==='dark'?'dark':'light';
  applyTheme(cur==='dark'?'light':'dark');
  say(cur==='dark'?'Light theme on':'Dark theme on');
});
var heat=doc.getElementById('heat'), tip=doc.getElementById('heatTip'),
    tipCount=doc.getElementById('heatTipCount'), tipDate=doc.getElementById('heatTipDate'),
    live=doc.getElementById('heatLive'), toast=doc.getElementById('toast');
var cells=[], weeks=[];
var wi, di, idx, wEl, cEl;
for(wi=0;wi<WEEKS;wi++){
  wEl=doc.createElement('span'); wEl.className='heat-week week'; wEl.setAttribute('aria-hidden','true');
  for(di=0;di<7;di++){
    idx=wi*7+di;
    cEl=doc.createElement('i');
    cEl.setAttribute('data-i',String(idx));
    cEl.setAttribute('data-level',String(levelFor(heatVals[idx])));
    wEl.appendChild(cEl);
    cells.push(cEl);
  }
  heat.appendChild(wEl);
  weeks.push(wEl);
}
var sel=-1, hovering=false, toastTimer=0;
function paintSelection(){
  var k;
  for(k=0;k<cells.length;k++){
    if(k===sel){cells[k].setAttribute('data-on','');}
    else{cells[k].removeAttribute('data-on');}
  }
  if(sel>=0){
    var col=Math.floor(sel/7), row=sel%7;
    var xp=((col+0.5)/WEEKS*100).toFixed(2)+'%';
    tip.style.setProperty('--tip-x',xp);
    tip.style.setProperty('--tip-y',(row*13)+'px');
    tipCount.textContent=countLabel(heatVals[sel]);
    tipDate.textContent=dateFmt.format(dateFor(sel));
    tip.removeAttribute('hidden');
    live.textContent=countLabel(heatVals[sel])+', '+dateFmt.format(dateFor(sel));
    if(heat.getAttribute('data-hovering')===null)heat.setAttribute('data-hovering','');
  }else{
    tip.setAttribute('hidden','');
    live.textContent='';
    heat.removeAttribute('data-hovering');
  }
}
function select(i){sel=Math.max(0,Math.min(TOTAL_DAYS-1,i));paintSelection();return sel;}
function clearSel(){sel=-1;paintSelection();}
function step(d){if(sel<0)sel=TOTAL_DAYS-1;else sel=(sel+d+TOTAL_DAYS)%TOTAL_DAYS;paintSelection();return sel;}
heat.addEventListener('pointermove',function(ev){
  var t=ev.target&&ev.target.closest?ev.target.closest('i[data-i]'):null;
  if(!t&&ev.target&&ev.target.getAttribute&&ev.target.getAttribute('data-i')!==null)t=ev.target;
  if(t){hovering=true;select(Number(t.getAttribute('data-i')));}
});
heat.addEventListener('pointerdown',function(ev){
  var t=ev.target&&ev.target.closest?ev.target.closest('i[data-i]'):null;
  if(t){select(Number(t.getAttribute('data-i')));}
});
heat.addEventListener('pointerleave',function(){hovering=false;if(doc.activeElement!==heat)clearSel();});
heat.addEventListener('focus',function(){if(sel<0)select(TOTAL_DAYS-1);});
heat.addEventListener('blur',function(){clearSel();});
heat.addEventListener('keydown',function(ev){
  var map={ArrowLeft:-7,ArrowRight:7,ArrowUp:-1,ArrowDown:1};
  var base=(sel<0)?TOTAL_DAYS-1:sel, next=null;
  if(ev.key==='Home')next=0;
  else if(ev.key==='End')next=TOTAL_DAYS-1;
  else if(ev.key==='Escape'){ev.preventDefault();clearSel();return;}
  else if(map[ev.key]!==undefined)next=Math.max(0,Math.min(TOTAL_DAYS-1,base+map[ev.key]));
  else return;
  ev.preventDefault();select(next);
});
function say(msg){
  toast.textContent=msg;
  toast.setAttribute('data-on','');
  if(toastTimer)window.clearTimeout(toastTimer);
  toastTimer=window.setTimeout(function(){toast.removeAttribute('data-on');toast.textContent='';},2200);
}
var navBtns=doc.querySelectorAll('[data-nav]');
var bi;
for(bi=0;bi<navBtns.length;bi++){
  (function(btn){
    btn.addEventListener('click',function(){
      var where=btn.getAttribute('data-nav')||'Chat';
      var what=btn.getAttribute('data-title')||'';
      say(what?('Opening '+where+': '+what):('Opened '+where));
    });
  })(navBtns[bi]);
}
var autoTimer=0;
function startAuto(){
  if(autoTimer)return;
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce)return;
  autoTimer=window.setInterval(function(){if(!hovering&&doc.activeElement!==heat)step(7);},3000);
}
startAuto();
window.__ov={
  cells:cells, weeks:weeks, total:total, values:heatVals,
  select:select, clear:clearSel, step:step, say:say,
  getSelected:function(){return sel;},
  tip:tip, tipCount:tipCount, tipDate:tipDate, live:live, toast:toast, heat:heat,
  loopLength:TOTAL_DAYS, themeKey:THEME_KEY, applyTheme:applyTheme
};
})();
</script>
