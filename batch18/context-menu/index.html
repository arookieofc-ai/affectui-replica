<html lang="en" data-theme="light">
<head>
<script>/*noflash*/(function(){try{var k="ctx-menu-theme",t=null;try{t=localStorage.getItem(k)}catch(e){} if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"} document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Context Menu — Files</title>
<meta name="color-scheme" content="light dark">
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root, html[data-theme="light"]{
--page:#fafaf9; --surface:#ffffff; --ink:#171717; --ink2:#1c1917;
--muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
--rlg:16px; --rm:10px; --rsm:6px;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--pop-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 40px -12px rgba(0,0,0,.18),0 4px 12px -4px rgba(0,0,0,.06);
--glow:#f4f4f5; --danger:#d92d20; --danger-glow:rgba(240,68,56,.08);
--focus:rgba(0,96,226,.7); --ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
--page:#101012; --surface:#1c1c1f; --ink:#ededed; --ink2:#ededed;
--muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
--pop-shadow:0 0 0 1px rgba(255,255,255,.06),0 18px 40px -12px rgba(0,0,0,.6);
--glow:#26262a; --danger:#ff8a7a; --danger-glow:rgba(255,107,95,.14);
--focus:rgba(77,141,255,.8);
color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;
-webkit-font-smoothing:antialiased;min-height:100vh}
.page{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.proj{display:flex;align-items:center;gap:10px}
.proj h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.01em}
.count{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 8px;border-radius:999px;
background:var(--subtle);border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600}
.themebtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);
color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;
box-shadow:var(--shadow);transition:transform 150ms ease,box-shadow 150ms ease}
@media (hover: hover) and (pointer: fine) {
.themebtn:hover{transform:translateY(-1px)}
}
.themebtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);
box-shadow:var(--shadow);padding:14px;transition:box-shadow 150ms ease}
@media (hover: hover) and (pointer: fine) {
.card:hover{box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.07)}
}
.cardhead{display:flex;align-items:center;gap:8px;margin:2px 2px 10px}
.cardhead h2{font-size:15px;font-weight:650;margin:0}
.cardhead .n{font-size:12px;color:var(--muted);border:1px solid var(--border);background:var(--subtle);
border-radius:999px;padding:1px 8px}
.area{border:1px dashed var(--border);border-radius:var(--rm);padding:6px;background:var(--page)}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;
background:transparent;color:var(--ink);border-radius:var(--rm);padding:9px 10px;cursor:pointer;font:inherit;
transition:background 150ms ease,border-color 150ms ease}
@media (hover: hover) and (pointer: fine) {
.rowbtn:hover{background:var(--subtle);border-color:var(--border)}
}
.rowbtn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.rowbtn[aria-pressed="true"]{background:var(--subtle);border-color:var(--border)}
.glyph{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--subtle);
border:1px solid var(--border)}
.glyph svg{display:block;width:16px;height:16px}
.rtext{display:grid;gap:1px;min-width:0;flex:1}
.rname{display:flex;align-items:center;gap:6px;min-width:0;font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin{flex:none;display:inline-grid;place-items:center;color:var(--muted)}
.pin svg{display:block;width:12px;height:12px}
.rmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{margin:12px 2px 0;font-size:13px;color:var(--muted);min-height:20px}
.kbd-hint{margin:6px 2px 0;font-size:12px;color:var(--muted)}
.kbd-hint kbd{border:1px solid var(--border);background:var(--subtle);border-radius:5px;padding:0 5px;font-size:11px;font-family:inherit}
/* context menu */
.ctx{position:fixed;z-index:1000;min-width:180px;max-width:min(320px,calc(100vw - 16px));max-height:calc(100vh - 16px);
background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--pop-shadow);
border:1px solid var(--border);padding:5px;font-size:13.5px;line-height:20px;
transform-origin:top left;animation:pop 220ms var(--ease) both}
.ctx[data-side="top"]{transform-origin:bottom left;animation-name:popup}
.ctx[data-side="right"]{transform-origin:top left;animation-name:popside;animation-duration:160ms}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
@keyframes popup{from{opacity:0;transform:scale(.96) translateY(4px)}}
@keyframes popside{from{opacity:0;transform:scale(.98)}}
.ctxlist{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:1px;max-height:60vh;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.ctxlist:focus{outline:none}
.glow{position:absolute;top:0;left:0;right:0;border-radius:9px;background:var(--glow);pointer-events:none;
transition:transform 180ms var(--ease),height 180ms var(--ease),background-color 120ms ease}
.glow[data-danger]{background:var(--danger-glow)}
.item{position:relative;display:flex;align-items:center;gap:9px;min-height:34px;padding:0 10px;border-radius:9px;
color:var(--ink2);white-space:nowrap;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:color 120ms ease}
.item:focus{outline:none;color:var(--ink)}
.item:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.item[data-open]{color:var(--ink)}
.item[data-open]:not(:focus){background:var(--glow)}
.item[aria-checked="true"]{color:var(--ink);font-weight:550}
.item[data-danger],.item[data-danger]:focus{color:var(--danger)}
.item[aria-disabled="true"]{color:var(--muted);cursor:default}
.ic{flex:none;width:16px;height:16px;display:grid;place-items:center;color:var(--muted);transition:color 120ms ease}
.ic svg{display:block;width:16px;height:16px}
.item:focus .ic:not([data-logo]),.item[data-open] .ic:not([data-logo]){color:var(--ink)}
.item[data-danger] .ic{color:var(--danger)}
.lbl{flex:1;display:grid;gap:1px;min-width:0}
.txt,.dsc{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.k{flex:none;padding-left:16px;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.more,.chk{flex:none;width:14px;height:14px;display:grid;place-items:center}
.more{color:var(--muted)} .chk{color:var(--ink)}
.more svg,.chk svg{display:block;width:14px;height:14px}
.tick{stroke-dasharray:1;animation:draw 280ms 40ms var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sep{display:block;height:1px;margin:5px 4px;background:var(--border)}
.doc{margin-top:12px;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.page{padding:14px 12px 40px}.area{padding:4px}.rowbtn{padding:10px 8px}}
@media (pointer:coarse){.item{min-height:40px}}
@media (prefers-reduced-motion:reduce){.ctx,.tick{animation-duration:1ms}.glow,.item,.ic{transition-duration:1ms}}
</style>

</div>

<script>
(function(){

{id:"summary",name:"Support tickets – weekly summary.pdf",kind:"pdf",color:"#F28A2E",size:412e3,at:3,when:"1h ago",folder:"Agents"},

function mk(el,cls,text){var e=document.createElement(el);if(cls)e.setAttribute("class",cls);if(text!=null)e.textContent=text;return e}
/* build static shell once */
var rowsEl=document.getElementById("rows"),noteEl=document.getElementById("note"),

fileCount=document.getElementById("fileCount"),topCount=document.getElementById("topCount");
var rowNodes={}; /* id -> {btn,glyph,name,pin,meta} */
function buildRows(){var frag=document.createDocumentFragment();
for(var i=0;i<FILES.length;i++){var f=FILES[i];

b.setAttribute("data-file",f.id);b.setAttribute("aria-pressed","false");

function refreshRowsInPlace(){var order=sortedFiles();
for(var i=0;i<order.length;i++){var f=order[i];var n=rowNodes[f.id];
n.label.textContent=f.name;
n.meta.textContent=state.folders[f.id]+" · "+fmtSize(f.size)+" · "+f.when;

if(noteEl.textContent!==state.status)noteEl.textContent=state.status}
/* menu: built once, updated in place */
var menuEl,menuList,glowEl,subEl,subList,menuTitle;
var fileItemNodes=[],bgItemNodes=[],moveNodes=[],sortNodes=[];
var openTimer=null,closeTimer=null,longTimer=null,longPos=null,typeBuf="",typeAt=0;
function makeItem(parent,arr,opts){var d=document.createElement("div");
d.setAttribute("class","item");d.setAttribute("role",opts.role||"menuitem");d.setAttribute("tabindex","-1");d.setAttribute("data-index",String(arr.length));

var lb=mk("span","lbl");var tx=mk("span","txt",opts.label);tx.setAttribute("title",opts.label);lb.appendChild(tx);d.appendChild(lb);

parent.appendChild(d);
var rec={el:d,icon:ic,label:tx,kbd:kbd,checkWrap:chk,checkHolder:chk?chk.firstChild:null,data:opts};
arr.push(rec);return rec}
function setCheck(rec,on){if(!rec.checkWrap)return;
var has=rec.checkHolder.firstChild!=null;
if(on&&!has){var c=svgIcon("check");c.setAttribute("class","tick");rec.checkHolder.appendChild(c)}
else if(!on&&has){rec.checkHolder.removeChild(rec.checkHolder.firstChild)}

function buildMenu(){
menuEl=document.createElement("div");menuEl.setAttribute("class","ctx");menuEl.setAttribute("id","ctxMenu");

{label:"Open",icon:"open",shortcut:"⌘O"},
{label:"Download",icon:"dl"},
{label:"Copy link",icon:"link",shortcut:"⌘L"},
{label:"Duplicate",icon:"dup",shortcut:"⌘D"},
{label:"Move to",icon:"move",sep:true,sub:"move"},
{label:"Pin to top",icon:"pin",checkable:true,checkRole:"checkbox"},
{label:"Delete file",icon:"trash",sep:true,danger:true}];
for(var i=0;i<defs.length;i++)makeItem(menuList,fileItemNodes,defs[i]);
var bgDefs=[{label:"New file",icon:"file",shortcut:"⌘N"},{label:"Upload…",icon:"up"},{label:"Sort by",icon:"sort",sep:true,sub:"sort"}];
for(var j=0;j<bgDefs.length;j++)makeItem(menuList,bgItemNodes,bgDefs[j]);
subEl=document.createElement("div");subEl.setAttribute("class","ctx");subEl.setAttribute("data-sub","");
subEl.hidden=true;menuHost.appendChild(subEl);
subList=document.createElement("div");subList.setAttribute("class","ctxlist");subList.setAttribute("role","menu");subList.setAttribute("tabindex","-1");
subEl.appendChild(subList);
for(var a=0;a<FOLDERS.length;a++)makeItem(subList,moveNodes,{label:FOLDERS[a],icon:"folder",checkable:true,checkRole:"radio"});
for(var b=0;b<SORTS.length;b++)makeItem(subList,sortNodes,{label:SORTS[b].label,icon:b===0?"clock":b===1?"sort":"db",checkable:true,checkRole:"radio"});
menuHost.appendChild(menuEl)}
function showList(which){var i;
for(i=0;i<fileItemNodes.length;i++)fileItemNodes[i].el.hidden=(which!=="file");

var sepPrev=bgItemNodes[i].el.previousSibling;

for(i=0;i<fileItemNodes.length;i++){var el=fileItemNodes[i].el;var sib=el.previousSibling;
if(sib&&sib.getAttribute&&sib.getAttribute("class")==="sep")sib.hidden=(which!=="file");}

for(i=0;i<sortNodes.length;i++)sortNodes[i].el.hidden=(state.sub!=="sort")}
function position(el,x,y,side){var w=240,h=el.offsetHeight||280;var vw=window.innerWidth||1024,vh=window.innerHeight||768;
var L=x,T=y;if(L+w>vw-8)L=Math.max(8,vw-8-w);if(T+h>vh-8)T=Math.max(8,vh-8-h);

el.setAttribute("data-side",side||"bottom");el.setAttribute("data-align",x>vw/2?"end":"start")}
function openMenu(x,y,which,fileId,sub){state.menu={which:which,fileId:fileId||null,x:x,y:y};state.sub=sub||null;
menuEl.hidden=false;subEl.hidden=!(sub);
showList(which);
if(which==="file"){var f=fileById(fileId);
menuTitle.hidden=true;
for(var i=0;i<fileItemNodes.length;i++){var r=fileItemNodes[i];
if(r.data.label==="Pin to top"){r.el.setAttribute("role","menuitemcheckbox");setCheck(r,!!state.pinned[fileId])}}
}else{menuTitle.hidden=true}
if(sub==="move"){for(var a=0;a<moveNodes.length;a++){var m=moveNodes[a];m.el.setAttribute("role","menuitemradio");
setCheck(m,state.folders[fileId]===m.data.label)}}
if(sub==="sort"){for(var b=0;b<sortNodes.length;b++){var s=sortNodes[b];s.el.setAttribute("role","menuitemradio");
setCheck(s,SORTS[b].id===state.sort)}}
position(menuEl,x,y,"bottom");
if(sub){var r2=menuEl.getBoundingClientRect?menuEl.getBoundingClientRect():{right:x+240,top:y};
position(subEl,(r2?r2.right+4:x+236),(r2?r2.top:y),"right")}
moveGlowTo(null);
var first=which==="file"?fileItemNodes[0].el:bgItemNodes[0].el;
if(first&&first.focus)try{first.focus({preventScroll:true})}catch(e){}}
function closeMenu(){state.menu=null;state.sub=null;menuEl.hidden=true;subEl.hidden=true;clearTimeout(openTimer);clearTimeout(closeTimer)}
function moveGlowTo(el){if(!el){glowEl.hidden=true;return}
try{glowEl.hidden=false;glowEl.style.transform="translateY("+el.offsetTop+"px)";glowEl.style.height=el.offsetHeight+"px";
if(el.hasAttribute("data-danger"))glowEl.setAttribute("data-danger","");else glowEl.removeAttribute("data-danger")}catch(e){}}
function doSelectFileAction(label,fileId){var f=fileById(fileId);if(!f)return;var msg=HINT;
if(label==="Open")msg="Opened "+f.name;
else if(label==="Download")msg="Downloading "+f.name;
else if(label==="Copy link")msg="Link copied";
else if(label==="Duplicate")msg=f.name+" duplicated";
else if(label==="Pin to top"){state.pinned[fileId]=!state.pinned[fileId];refreshRowsInPlace();return}
else if(label==="Delete file")msg=f.name+" would be deleted – kept for the demo";
else return;
state.status=msg;refreshRowsInPlace()}
function doMove(fileId,folder){var f=fileById(fileId);state.folders[fileId]=folder;state.status=f.name+" moved to "+folder;refreshRowsInPlace()}
function doBgAction(label){if(label==="New file")state.status="A new file would be created – kept for the demo";
else if(label==="Upload…")state.status="Upload – kept for the demo";refreshRowsInPlace()}
function tourTick(){var step=state.tour%6;var second=rowNodes[sortedFiles()[1]?sortedFiles()[1].id:null];
var r=second?second.btn.getBoundingClientRect?second.btn.getBoundingClientRect():{left:120,top:160,width:300,height:40}:{left:120,top:160,width:300,height:40};
var x=(r.left||120)+120,y=(r.top||160)+20;
if(step===0){closeMenu();state.status=HINT;refreshRowsInPlace()}
else if(step===1){openMenu(x,y,"file","export",null)}
else if(step===2){openMenu(x,y,"file","export","move")}
else if(step===3){doMove("export","Archive");openMenu(x,y,"file","export","move")}
else if(step===4){state.sort="name";refreshRowsInPlace();openMenu(140,220,"bg",null,"sort")}
else if(step===5){state.sort="newest";state.folders["export"]="Agents";state.status=HINT;refreshRowsInPlace();closeMenu()}
state.tour++;
if(window.__ctx)window.__ctx.tour=state.tour}
/* events: capture for survival */
function bind(){
document.addEventListener("pointerdown",function(e){
if(!menuEl.hidden){var inside=menuEl.contains(e.target)||subEl.contains(e.target);
if(!inside)closeMenu()}},true);
document.addEventListener("mousedown",function(e){
if(!menuEl.hidden){var inside2=menuEl.contains(e.target)||subEl.contains(e.target);
if(!inside2)closeMenu()}},true);
document.addEventListener("keydown",function(e){
if(e.key==="Escape"&&!menuEl.hidden){e.preventDefault();closeMenu();return}
var t=e.target;var fid=t&&t.getAttribute?t.getAttribute("data-file"):null;
if((e.key==="ContextMenu"||(e.shiftKey&&e.key==="F10"))&&t){
if(t.closest&&(t.closest("input,textarea,select,[contenteditable]")))return;
e.preventDefault();var rect=t.getBoundingClientRect?t.getBoundingClientRect():{left:100,top:150,width:200,height:36};
var xx=rect.left+Math.min(12,rect.width/2),yy=rect.top+Math.min(rect.height,26);
var which2=fid?"file":"bg";openMenu(xx,yy,which2,fid||null,null);return}
if(!menuEl.hidden){
if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Home"||e.key==="End"||e.key==="PageUp"||e.key==="PageDown"){e.preventDefault();
var vis=(state.menu.which==="file"?fileItemNodes:bgItemNodes).filter(function(n){return !n.el.hidden});
var idx=vis.indexOf(vis.filter(function(n){return document.activeElement===n.el})[0]);
var nx=e.key==="ArrowDown"||e.key==="PageDown"?(idx+1)%vis.length:e.key==="ArrowUp"||e.key==="PageUp"?(idx-1+vis.length)%vis.length:e.key==="Home"?0:vis.length-1;
if(vis[nx]&&vis[nx].el.focus)vis[nx].el.focus({preventScroll:true});}
else if(e.key==="ArrowRight"){var ae2=document.activeElement;var rc=allNodes().filter(function(n){return n.el===ae2})[0];
if(rc&&rc.data.sub){e.preventDefault();activate(rc)}}
else if(e.key==="ArrowLeft"){if(state.sub){e.preventDefault();state.sub=null;subEl.hidden=true;markOpen(null)}}
else if(e.key==="Enter"||e.key===" "){var ae=document.activeElement;
var rec=allNodes().filter(function(n){return n.el===ae})[0];
if(rec){e.preventDefault();activate(rec)}}
else if(e.key==="Tab"){closeMenu()}
else if(e.key&&e.key.length===1&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();
var now=Date.now();if(now-typeAt>700)typeBuf="";
typeBuf+=e.key;typeAt=now;var q=typeBuf.toLowerCase();
var vis2=(state.menu.which==="file"?fileItemNodes:bgItemNodes).filter(function(n){return !n.el.hidden});
var cur=vis2.indexOf(vis2.filter(function(n){return document.activeElement===n.el})[0]);
for(var oi=0;oi<vis2.length;oi++){var cand=vis2[(cur+1+oi)%vis2.length];
if((cand.data.label||"").toLowerCase().indexOf(q)===0){if(cand.el.focus)cand.el.focus({preventScroll:true});break}}}}});
function ctxOn(el){el.addEventListener("contextmenu",function(e){
if(Date.now()-(el.__last||0)<600){e.preventDefault();return}
var fid=e.target&&e.target.closest?e.target.closest("[data-file]"):null;
var id=fid?fid.getAttribute("data-file"):null;
var items=id?fileById(id):true;if(!items)return;
e.preventDefault();openMenu(e.clientX||140,e.clientY||160,id?"file":"bg",id,null);el.__last=Date.now()})}
ctxOn(bgArea);ctxOn(rowsEl);
bgArea.addEventListener("pointerdown",function(e){if(e.pointerType!=="touch")return;
longPos={x:e.clientX,y:e.clientY};clearTimeout(longTimer);
longTimer=setTimeout(function(){var fid=e.target&&e.target.closest?e.target.closest("[data-file]"):null;
var id=fid?fid.getAttribute("data-file"):null;openMenu(e.clientX,e.clientY,id?"file":"bg",id,null)},500)});
bgArea.addEventListener("pointermove",function(e){if(longPos&&Math.hypot(e.clientX-longPos.x,e.clientY-longPos.y)>10){clearTimeout(longTimer);longPos=null}});
bgArea.addEventListener("pointerup",function(){clearTimeout(longTimer);longPos=null});
bgArea.addEventListener("pointercancel",function(){clearTimeout(longTimer);longPos=null});
rowsEl.addEventListener("click",function(e){var b=e.target&&e.target.closest?e.target.closest("[data-file]"):null;
if(!b)return;state.selected=b.getAttribute("data-file");refreshRowsInPlace()});
rowsEl.addEventListener("dblclick",function(e){var b=e.target&&e.target.closest?e.target.closest("[data-file]"):null;
if(!b)return;var f=fileById(b.getAttribute("data-file"));state.status="Opened "+f.name;refreshRowsInPlace()});
function hover(el,rec,sub){el.addEventListener("pointermove",function(){if(el.hidden)return;
if(document.activeElement!==el&&el.focus)try{el.focus({preventScroll:true})}catch(x){}
moveGlowTo(el);
if(rec.data.sub){clearTimeout(closeTimer);
if(state.sub===rec.data.sub)return;
clearTimeout(openTimer);openTimer=setTimeout(function(){state.sub=rec.data.sub;subEl.hidden=false;showList(state.menu.which);
if(state.sub==="move"){for(var a=0;a<moveNodes.length;a++)setCheck(moveNodes[a],state.folders[state.menu.fileId]===moveNodes[a].data.label)}
if(state.sub==="sort"){for(var q=0;q<sortNodes.length;q++)setCheck(sortNodes[q],SORTS[q].id===state.sort)}
var rr=el.getBoundingClientRect?el.getBoundingClientRect():{right:300,top:200};
position(subEl,(rr.right?rr.right+4:300),(rr.top!=null?rr.top:200),"right");markOpen(rec)},90)}
else{clearTimeout(openTimer);if(state.sub){clearTimeout(closeTimer);closeTimer=setTimeout(function(){state.sub=null;subEl.hidden=true;markOpen(null)},220)}}});
el.addEventListener("focus",function(){moveGlowTo(el)});
el.addEventListener("click",function(e){activate(rec)})}
function markOpen(activeRec){var all=fileItemNodes.concat(bgItemNodes);
for(var i=0;i<all.length;i++){if(all[i]===activeRec)all[i].el.setAttribute("data-open","");
else all[i].el.removeAttribute("data-open")}}
function activate(rec){var L=rec.data.label;
if(rec.data.sub){state.sub=rec.data.sub;subEl.hidden=false;showList(state.menu.which);markOpen(rec);return}
if(state.menu&&state.menu.which==="file"){
if(L==="Move to")return;
if(moveNodes.indexOf(rec)>=0){doMove(state.menu.fileId,L);closeMenu();return}
if(sortNodes.indexOf(rec)>=0){state.sort=SORTS[sortNodes.indexOf(rec)].id;refreshRowsInPlace();closeMenu();return}
doSelectFileAction(L,state.menu.fileId);
if(L!=="Pin to top")closeMenu();else{openMenu(state.menu.x,state.menu.y,"file",state.menu.fileId,null)}
}else{
if(bgItemNodes.indexOf(rec)>=0){if(L==="Sort by")return;doBgAction(L);closeMenu();return}
if(sortNodes.indexOf(rec)>=0){state.sort=SORTS[sortNodes.indexOf(rec)].id;refreshRowsInPlace();closeMenu();return}
if(moveNodes.indexOf(rec)>=0){closeMenu();return}}}
function allNodes(){return fileItemNodes.concat(bgItemNodes).concat(moveNodes).concat(sortNodes)}
var all=fileItemNodes.concat(bgItemNodes).concat(moveNodes).concat(sortNodes);
for(var k=0;k<all.length;k++)(function(rec){hover(rec.el,rec)})(all[k]);
var themeBtn=document.getElementById("themeBtn");
themeBtn.addEventListener("click",function(){var h=document.documentElement;
var cur=h.getAttribute("data-theme")==="dark"?"light":"dark";h.setAttribute("data-theme",cur);
try{localStorage.setItem("ctx-menu-theme",cur)}catch(e){}
themeBtn.setAttribute("aria-label",cur==="dark"?"Switch to light mode":"Toggle dark mode")});
try{var stored=null;try{stored=localStorage.getItem("ctx-menu-theme")}catch(e){}
if(stored)themeBtn.setAttribute("aria-label",stored==="dark"?"Switch to light mode":"Toggle dark mode")}catch(e){}
}
/* init once */
buildRows();buildMenu();bind();refreshRowsInPlace();
window.__ctx={state:state,nodes:rowNodes,menu:function(){return menuEl},sub:function(){return subEl},
note:function(){return noteEl},sorted:sortedFiles,fmt:fmtSize,tick:tourTick,glow:function(){return glowEl}};
/* auto demo + loop (in-place only) */
var started=false;
function start(){if(started)return;started=true;
try{if(window.requestAnimationFrame){requestAnimationFrame(function(){requestAnimationFrame(function(){
var list=sortedFiles();var second=list[1];var n=second?rowNodes[second.id]:null;
if(n&&n.btn.getBoundingClientRect){var r=n.btn.getBoundingClientRect();
openMenu(r.left+r.width*0.42,r.top+r.height/2+6,"file",second.id,null);
if(document.activeElement&&document.activeElement.blur)try{document.activeElement.blur()}catch(e){}}})})}else{
var list2=sortedFiles();if(list2[1])openMenu(160,180,"file",list2[1].id,null)}}catch(e){}
window.__ctx.timer=setInterval(tourTick,1800)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);
else start();
})();
</script>
