lab=document.createElement('span');lab.setAttribute('class','ui-cm__label');lab.setAttribute('dir','auto');lab.textContent=glabel;g.appendChild(lab);refs.labels[gid]=lab;
}
inner.appendChild(g);refs.groups[gid]=g;return g;
}
function ensureButton(rec,groupId){
var key=rec.key;
if(refs.buttons[key])return refs.buttons[key];
var def=rec.def;
var btn=document.createElement('button');
btn.setAttribute('type','button');btn.setAttribute('role','option');btn.setAttribute('tabindex','-1');btn.setAttribute('class','ui-cm__item');btn.setAttribute('id',uid+'-'+key);btn.setAttribute('data-key',key);
var lead;
if(def.logoKind){lead=document.createElement('span');lead.setAttribute('class','ui-cm__logo');lead.setAttribute('data-letter',firstLetter(def.label));try{lead.appendChild(brandTile(def.logoKind));}catch(e){}}
else{lead=document.createElement('span');lead.setAttribute('class','ui-cm__icon');lead.setAttribute('data-letter',firstLetter(def.label));var ic=def.icon&&ICON_PATHS[def.icon]?glyphIcon(ICON_PATHS[def.icon]):null;if(ic)lead.appendChild(ic);}
btn.appendChild(lead);
var txt=document.createElement('span');txt.setAttribute('class','ui-cm__text');
var name=makeHighlightCell('ui-cm__name');name.setAttribute('dir','auto');name.setAttribute('title',def.label);txt.appendChild(name);
var hint=null;
if(def.hint){hint=makeHighlightCell('ui-cm__hint');hint.setAttribute('dir','auto');hint.setAttribute('title',def.hint);txt.appendChild(hint);}
btn.appendChild(txt);
var keys=spanWith('ui-cm__keys','');keys.setAttribute('aria-hidden','true');btn.appendChild(keys);
btn.addEventListener('pointerdown',function(e){try{e.preventDefault();}catch(err){}if(input&&input.focus){try{input.focus({preventScroll:true});}catch(err2){try{input.focus();}catch(err3){}}}},true);
btn.addEventListener('mousedown',function(e){try{e.preventDefault();}catch(err){}},true);
btn.addEventListener('pointerenter',function(){selectKey(key,false);});
btn.addEventListener('mousemove',function(){selectKey(key,false);});
btn.addEventListener('focus',function(){selectKey(key,false);});
btn.addEventListener('click',function(){runByKey(key);});
refs.buttons[key]=btn;refs.nameSpans[key]=name;refs.hintSpans[key]=hint;refs.keysSpans[key]=keys;
return btn;
}
var askGroup=null,askBtn=null,askName=null;
function ensureAsk(){
if(askGroup)return;
askGroup=document.createElement('div');askGroup.setAttribute('class','ui-cm__group');askGroup.setAttribute('role','group');askGroup.setAttribute('aria-label','Assistant');
inner.appendChild(askGroup);
askBtn=document.createElement('button');askBtn.setAttribute('type','button');askBtn.setAttribute('role','option');askBtn.setAttribute('tabindex','-1');askBtn.setAttribute('class','ui-cm__item');askBtn.setAttribute('id',uid+'-ask');askBtn.setAttribute('data-key','ask');
var lead=document.createElement('span');lead.setAttribute('class','ui-cm__logo');lead.setAttribute('data-letter','A');try{lead.appendChild(brandTile('ask'));}catch(e){}
askBtn.appendChild(lead);
var txt=document.createElement('span');txt.setAttribute('class','ui-cm__text');
askName=document.createElement('span');askName.setAttribute('class','ui-cm__name');askName.setAttribute('dir','auto');txt.appendChild(askName);askBtn.appendChild(txt);
var keys=document.createElement('span');keys.setAttribute('class','ui-cm__keys');keys.setAttribute('aria-hidden','true');askBtn.appendChild(keys);
askBtn.addEventListener('pointerdown',function(e){try{e.preventDefault();}catch(err){}},true);
askBtn.addEventListener('mousedown',function(e){try{e.preventDefault();}catch(err){}},true);
askBtn.addEventListener('pointerenter',function(){selectKey('ask',false);});
askBtn.addEventListener('mousemove',function(){selectKey('ask',false);});
askBtn.addEventListener('click',function(){runByKey('ask');});
askGroup.appendChild(askBtn);
}
function currentFiltered(){
var q=state.query.trim();
var nq=norm(q);
var out=[];
prepared.forEach(function(g){
var cmds=g.commands.filter(function(c){return !nq||c.text.indexOf(nq)>=0;}).map(function(c,idx){
var n=0;
if(g.id==='suggestions'&&idx<5)n=idx+1;
return{def:c.def,key:c.key,n:n};
});
if(cmds.length)out.push({id:g.id,label:g.label,commands:cmds});
});
if(q){
out.unshift({id:'ask-about',label:'Assistant',commands:[{def:{id:'ask-about',label:ASK_PREFIX+q+QUOTE,logoKind:'ask'},key:'ask',n:0}]});
}
return out;
}
function flatList(filtered){
var arr=[];filtered.forEach(function(g){g.commands.forEach(function(c){arr.push(c);});});return arr;
}
function paintKeys(keysEl,rec){
while(keysEl.firstChild)keysEl.removeChild(keysEl.firstChild);
var chips=null;
if(rec.n){chips=[MOD,String(rec.n)];}
else if(rec.def.keys){chips=rec.def.keys;}
if(!chips||!chips.length){keysEl.style.display='none';return;}
keysEl.style.display='';
chips.forEach(function(ch){
var k=document.createElement('kbd');k.textContent=ch;keysEl.appendChild(k);
});
}
function syncDom(){
var filtered=currentFiltered();
var flat=flatList(filtered);
var validKeys={};
filtered.forEach(function(g){
var container=(g.id==='ask-about')?(ensureAsk(),askGroup):ensureGroup(g.id,g.label);
validKeys[g.id]=1;
container.hidden=false;
if(g.id!=='ask-about'){
var ordered=[];
g.commands.forEach(function(rec){
var b=ensureButton({key:rec.key,def:rec.def},g.id);
validKeys[rec.key]=1;
b.hidden=false;
b.removeAttribute('data-ran');
paintHighlight(refs.nameSpans[rec.key],rec.def.label,state.query);
if(refs.hintSpans[rec.key]){if(rec.def.hint)paintHighlight(refs.hintSpans[rec.key],rec.def.hint,state.query);}
paintKeys(refs.keysSpans[rec.key],rec);
ordered.push(b);
});
Array.prototype.forEach.call(Array.prototype.slice.call(container.childNodes),function(ch){
if(ch&&ch.getAttribute&&ch.getAttribute('class')==='ui-cm__label')return;
if(ordered.indexOf(ch)<0&&ch!==undefined){try{ch.hidden=true;}catch(e){}}
});
ordered.forEach(function(b){try{container.appendChild(b);}catch(e){}});
}else{
ensureAsk();
validKeys['ask']=1;
askGroup.hidden=false;
askBtn.hidden=false;
var label=ASK_PREFIX+state.query.trim()+QUOTE;
askName.textContent='';while(askName.firstChild)askName.removeChild(askName.firstChild);
askName.appendChild(document.createTextNode(label));
askName.setAttribute('title',label);
askGroup.style.display='';
}
});
Object.keys(refs.groups).forEach(function(gid){
if(!validKeys[gid]&&gid!=='ask-about'){try{refs.groups[gid].hidden=true;}catch(e){}}
});
if(state.query.trim()===''&&askGroup){try{askGroup.hidden=true;}catch(e){}}
Object.keys(refs.buttons).forEach(function(k){
if(!validKeys[k]){try{refs.buttons[k].hidden=true;}catch(e){}}
});
var still=flat.some(function(r){return r.key===state.selectedKey;});
if(!still){state.selectedKey=flat.length?flat[0].key:null;}
flat.forEach(function(r){
var b=(r.key==='ask')?askBtn:refs.buttons[r.key];
if(!b)return;
var sel=(r.key===state.selectedKey);
if(b.getAttribute('aria-selected')!==(sel?'true':'false'))b.setAttribute('aria-selected',sel?'true':'false');
});
try{input.setAttribute('aria-activedescendant',state.selectedKey?uid+'-'+state.selectedKey:'');}catch(e){}
if(!state.selectedKey){pill.style.display='none';}
else{
var selBtn=(state.selectedKey==='ask')?askBtn:refs.buttons[state.selectedKey];
if(selBtn&&!selBtn.hidden){
pill.style.display='';
var y=0,h=40;
try{
if(typeof selBtn.offsetTop==='number'&&selBtn.offsetTop){y=selBtn.offsetTop;h=selBtn.offsetHeight||40;}
else{
var order=flat.map(function(r){return r.key;});
var idx=order.indexOf(state.selectedKey);
var labelCount=filtered.filter(function(g,gi){return gi<filtered.findIndex(function(x){return x.commands.some(function(c){return c.key===state.selectedKey;});});}).length;
y=idx*40+filtered.slice(0,filtered.findIndex(function(x){return x.commands.some(function(c){return c.key===state.selectedKey;});})).length*26+4;
h=40;
}
}catch(e){}
try{pill.style.transform='translateY('+y+'px)';pill.style.height=h+'px';}catch(e2){}
}
}
if(state.done){
tip.hidden=true;doneWrap.hidden=false;doneText.textContent=state.done.label;
}else{
tip.hidden=false;doneWrap.hidden=true;
}
try{
var modK=keysWrap.querySelector?keysWrap.querySelector('kbd'):null;
}catch(e){}
}
function selectKey(key,scroll){
if(!key||key===state.selectedKey)return;
state.selectedKey=key;
var flat=flatList(currentFiltered());
flat.forEach(function(r){
var b=(r.key==='ask')?askBtn:refs.buttons[r.key];
if(!b)return;
var sel=(r.key===key);
var cur=b.getAttribute('aria-selected');
if((sel&&cur!=='true')||(!sel&&cur==='true'))b.setAttribute('aria-selected',sel?'true':'false');
});
try{input.setAttribute('aria-activedescendant',uid+'-'+key);}catch(e){}
var selBtn=(key==='ask')?askBtn:refs.buttons[key];
if(selBtn){
var y=0,h=40;
try{
if(typeof selBtn.offsetTop==='number'&&selBtn.offsetTop){y=selBtn.offsetTop;h=selBtn.offsetHeight||40;}
else{
var fl=flat.map(function(r){return r.key;});
var idx=fl.indexOf(key);
y=idx*40+8;h=40;
}
pill.style.display='';pill.style.transform='translateY('+y+'px)';pill.style.height=h+'px';
}catch(e){}
if(scroll&&list&&typeof selBtn.offsetTop==='number'&&selBtn.offsetTop){
try{
var top=selBtn.offsetTop-8,h2=selBtn.offsetHeight||40;
if(top<list.scrollTop)list.scrollTop=top;
else if(top+h2+8>list.scrollTop+list.clientHeight)list.scrollTop=top+h2+8-list.clientHeight;
}catch(e2){}
}
}
}
function runByKey(key){
var filtered=currentFiltered();
var flat=flatList(filtered);
var rec=flat.filter(function(r){return r.key===key;})[0];
if(!rec)return;
var label=(key==='ask')?(ASKED_PREFIX+state.query.trim()+QUOTE):rec.def.label;
state.done={id:key,label:label};
var b=(key==='ask')?askBtn:refs.buttons[key];
if(b){try{b.setAttribute('data-ran','');}catch(e){}setTimeout(function(){try{b.removeAttribute('data-ran');}catch(e2){}},650);}
syncDom();
if(timers.done)try{clearTimeout(timers.done);}catch(e){}
timers.done=setTimeout(function(){state.done=null;syncDom();},DONE_MS);
try{if(window.__cmOnRun&&typeof window.__cmOnRun==='function')window.__cmOnRun(rec.def.id||key,state.query);}catch(e){}
}
input.addEventListener('input',function(e){state.query=e.target?e.target.value:'';state.selectedKey=null;syncDom();});
input.addEventListener('change',function(e){state.query=e.target?e.target.value:'';state.selectedKey=null;syncDom();});
input.addEventListener('keydown',function(e){
var k=e.key||'';
if(k==='ArrowDown'||k==='ArrowUp'){
try{e.preventDefault();}catch(err){}
var flat=flatList(currentFiltered());
if(!flat.length)return;
var idx=flat.findIndex(function(r){return r.key===state.selectedKey;});
if(idx<0)idx=k==='ArrowDown'?-1:0;
var next=flat[(idx+(k==='ArrowDown'?1:-1)+flat.length)%flat.length];
selectKey(next.key,true);
}else if(k==='Enter'){
if(state.selectedKey){try{e.preventDefault();}catch(err){}runByKey(state.selectedKey);}
}else if(k==='Tab'){
var filtered=currentFiltered();
if(filtered.length>1){
try{e.preventDefault();}catch(err){}
var gi=filtered.findIndex(function(g){return g.commands.some(function(c){return c.key===state.selectedKey;});});
if(gi<0)gi=0;
var nj=e.shiftKey?(gi<=0?filtered.length-1:gi-1):(gi+1)%filtered.length;
selectKey(filtered[nj].commands[0].key,true);
}
}else if(k==='Escape'){
if(state.query){state.query='';try{input.value='';}catch(err){}state.selectedKey=null;syncDom();}
}else if((e.metaKey||e.ctrlKey)&&/^[1-5]$/.test(k)){
var flat2=flatList(currentFiltered()).filter(function(r){return r.n;});
var t=flat2[Number(k)-1];
if(t){try{e.preventDefault();}catch(err){}runByKey(t.key);}
}
});
window.addEventListener('keydown',function(e){
try{
if((e.metaKey||e.ctrlKey)&&String(e.key||'').toLowerCase()==='k'){e.preventDefault();if(input.focus)input.focus();try{input.select();}catch(err){}}
}catch(err){}
});
ensureAsk();
['suggestions','share','general','go'].forEach(function(gid){
var g=prepared.filter(function(x){return x.id===gid;})[0];
ensureGroup(gid,g.label);
g.commands.forEach(function(c){ensureButton({key:c.key,def:c.def},gid);});
});
syncDom();
try{if(input&&document.activeElement!==input){} }catch(e){}
if(window.__cmTest!==undefined){}
window.__cmTest={state:state,refs:refs,input:input,list:list,pill:pill,tip:tip,doneWrap:doneWrap,doneText:doneText,setQuery:function(q){state.query=q;try{input.value=q;}catch(e){}state.selectedKey=null;syncDom();},selectKey:selectKey,runByKey:runByKey,sync:syncDom,filtered:currentFiltered,MOD:MOD,DONE_MS:DONE_MS};
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
// theme toggle (built once, in-place icon swap)
(function(){
var btn=document.getElementById('themeToggle');
if(!btn)return;
function icon(name){
while(btn.firstChild)btn.removeChild(btn.firstChild);
var s=svgEl('svg',{viewBox:'0 0 24 24','aria-hidden':'true'});
var p;
if(name==='sun'){p=svgEl('path',{d:'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4'});}
else{p=svgEl('path',{d:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z'});}
s.appendChild(p);btn.appendChild(s);
try{btn.setAttribute('aria-label',name==='sun'?'Switch to light mode':'Switch to dark mode');}catch(e){}
}
function current(){try{return document.documentElement.getAttribute('data-theme')||'light';}catch(e){return 'light';}}
function paint(){icon(current()==='dark'?'sun':'moon');}
btn.addEventListener('pointerdown',function(e){try{e.preventDefault();}catch(err){}},true);
btn.addEventListener('click',function(){
var next=current()==='dark'?'light':'dark';
try{document.documentElement.setAttribute('data-theme',next);}catch(e){}
try{localStorage.setItem('ui-cm-theme',next);}catch(e){}
paint();
});
paint();
})();
})();
