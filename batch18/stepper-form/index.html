<style>

*{box-sizing:border-box}

@media (hover: hover) and (pointer: fine) {
button.stp-stepbtn:hover .stp-label{color:var(--ink)}
}

.stp-compact-t{display:flex;align-items:baseline;min-width:0;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;animation:stp-in 280ms cubic-bezier(.22,1,.36,1) both}

.stp-pane[data-dir="-1"]{animation-name:stp-enter-b}
.stp-h{margin:0;font-size:16px;font-weight:600;line-height:1.3;letter-spacing:-.01em;color:var(--ink);outline:none;overflow-wrap:anywhere}

.stp-x{display:grid;place-items:center;flex:none;width:24px;height:24px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;transition:background-color 140ms ease,color 140ms ease}
@media (hover: hover) and (pointer: fine) {
.stp-x:hover{background:var(--track);color:var(--ink)}
}
.stp-tags-in{flex:1 1 140px;height:28px;padding:0 7px;border:0;outline:none;background:none;font:inherit;font-size:14px;color:var(--ink)}

.stp-choice{position:relative;display:grid;align-content:start;gap:2px;min-width:0;padding:12px;border:0;border-radius:12px;background:var(--field);box-shadow:inset 0 0 0 1px var(--edge);text-align:left;cursor:pointer;transition:background-color 200ms ease,box-shadow 200ms ease;font:inherit;color:inherit}
@media (hover: hover) and (pointer: fine) {
.stp-choice:hover{box-shadow:inset 0 0 0 1px var(--muted)}
}
.stp-choice[aria-checked="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px transparent}
.stp-choice:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stp-ctop{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-width:0}
.stp-ct{flex:1;min-width:0;overflow:hidden;font-weight:600;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.stp-badge{flex:0 1 auto;min-width:0;max-width:50%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:1px 6px;border-radius:6px;background:var(--chip);font-size:11px;font-weight:500;color:var(--ink)}
.stp-radio{position:relative;flex:none;width:16px;height:16px;margin-left:auto;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--edge);transition:box-shadow 220ms ease}
.stp-radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform 300ms cubic-bezier(.34,1.56,.64,1)}
.stp-choice[aria-checked="true"] .stp-radio{box-shadow:inset 0 0 0 1.5px var(--accent)}
.stp-choice[aria-checked="true"] .stp-radio::after{transform:scale(1)}
.stp-aside{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stp-cdesc{margin:4px 0 0;font-size:12px;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}
.stp-review{display:grid;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border);margin:0}

.stp-rrow + .stp-rrow{border-top:1px solid var(--border)}
.stp-rrow dt{min-width:0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.stp-rrow dd{min-width:0;margin:0;color:var(--ink);overflow-wrap:anywhere}
.stp-sub{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.stp-muted{color:var(--muted)}
.stp-edit{height:26px;margin:-4px 0;padding:0 8px;border:0;border-radius:7px;background:none;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;transition:background-color 140ms ease}

.stp-edit:hover{background:var(--hover)}
}
.stp-ok{display:grid;justify-items:center;padding:20px 0 14px;text-align:center}

.stp-footwrap{position:sticky;bottom:0;z-index:3;display:grid;grid-template-rows:1fr;border-radius:0 0 var(--r-lg) var(--r-lg);background:var(--surface);transition:grid-template-rows 360ms cubic-bezier(.22,1,.36,1),opacity 220ms ease}
.stp-footwrap[data-hidden="1"]{grid-template-rows:0fr;opacity:0}
.stp-foot{display:flex;align-items:center;gap:10px;min-height:0;overflow:hidden;padding:12px 16px 16px}
.stp-btn{display:inline-flex;align-items:center;justify-content:center;flex:none;height:36px;border:0;border-radius:var(--r);font:inherit;font-weight:500;white-space:nowrap;cursor:pointer;transition:background-color 140ms ease,opacity 200ms ease,transform 140ms ease,visibility 200ms}
.stp-ghost{gap:4px;padding:0 12px 0 8px;background:none;color:var(--ink)}
@media (hover: hover) and (pointer: fine) {
.stp-ghost:hover{background:var(--hover)}
}
.stp-ghost[data-hidden="1"]{opacity:0;visibility:hidden}
.stp-primary{margin-left:auto;overflow:hidden;background:var(--ink);color:var(--page)}
@media (hover: hover) and (pointer: fine) {
.stp-primary:hover{opacity:.88}
}
.stp-primary:active{transform:scale(.97)}
.stp-primary[aria-disabled="true"]{opacity:.4}
.stp-primary[data-busy="1"]{opacity:.75;cursor:progress}
.stp-binner{display:inline-flex;flex:none;align-items:center;gap:8px;max-width:calc(100cqw - 120px);padding:0 15px}
.stp-blabel{min-width:0;overflow:hidden;text-overflow:ellipsis;animation:stp-in 260ms cubic-bezier(.22,1,.36,1) both}
.stp-sec{padding:0 14px;background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
@media (hover: hover) and (pointer: fine) {
.stp-sec:hover{background:var(--hover)}
}
.stp-spin{width:13px;height:13px;border-radius:50%;border:1.8px solid currentColor;border-right-color:transparent;animation:stp-spin 700ms linear infinite}
.stp-suberr{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;font-size:12.5px;color:var(--danger);animation:stp-in 240ms cubic-bezier(.22,1,.36,1) both}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.stp-shake{animation:stp-shake 340ms ease}
@keyframes stp-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes stp-enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes stp-enter-b{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes stp-chip{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes stp-pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes stp-spin{to{transform:rotate(360deg)}}
@keyframes stp-shake{0%,100%{transform:none}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes stp-draw{to{stroke-dashoffset:0}}
.stp-draw{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stp-draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:stp-draw 360ms cubic-bezier(.22,1,.36,1) 80ms forwards}
.stp-glyph{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:420px){
.stp-steps-head{padding:12px 8px 12px}
.stp-ol{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.stp-compact{display:grid}
.stp-pane{padding:18px 16px 6px}
.stp-foot{padding:12px}
.stp-btn{height:40px}
.stp-choices{grid-template-columns:minmax(0,1fr);grid-auto-flow:row}
.stp-rrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px;padding-left:12px}
.stp-rrow dt{grid-column:1}
.stp-rrow dd{grid-column:1;grid-row:2}
.stp-edit{grid-column:2;grid-row:1 / span 2;align-self:center;margin:0}
}
@media (prefers-reduced-motion: reduce){
.stp-pane,.stp-chip-el,.stp-okc,.stp-num,.stp-compact-t,.stp-err,.stp-suberr,.stp-blabel{animation-duration:1ms!important;animation-delay:0ms!important}
.stp-view,.stp-footwrap,.stp-ring,.stp-btn,.stp-box,.stp-fold{transition:none!important}
}
</style>

<script>

{value:'business',title:'Business',aside:'$24'+NBSP+'/'+NBSP+'seat',description:'SSO, audit log and priority support'}
];

});
inTag.addEventListener('paste',function(e){
try{var t=(e.clipboardData&&e.clipboardData.getData('text'))||'';if(/[\s,;]/.test(t.trim())){e.preventDefault();commitTagText((inTag.value+' '+t));state._draft='';inTag.value='';updateFields();}}catch(err){}
});
inTag.addEventListener('blur',function(){if(String(inTag.value).trim()){commitTagText(inTag.value);state._draft='';inTag.value='';updateFields();}});
inTag.addEventListener('input',function(){state._tagError=null;state._draft=inTag.value;updateFields();updateFoot();});
inTag.addEventListener('change',function(){state._tagError=null;updateFields();});
/* workspace inputs */
function cancelAuto(){if(state.autoplay){state.autoplay=false;if(state.typingTimer){try{clearTimeout(state.typingTimer);}catch(e){}state.typingTimer=0;}}}
inName.addEventListener('focus',cancelAuto);
inSlug.addEventListener('focus',cancelAuto);
inName.addEventListener('input',function(){cancelAuto();var v=inName.value;var patch={name:v};if(!state.values.slugEdited)patch.slug=slugify(v);state.values.name=patch.name;if(patch.slug!==undefined)state.values.slug=patch.slug;state.touched[0]=false;updateFields();updateFoot();});
inSlug.addEventListener('input',function(){cancelAuto();var v=String(inSlug.value).toLowerCase().replace(/[^a-z0-9-]/g,'');state.values.slug=v;state.values.slugEdited=true;state.touched[0]=false;updateFields();updateFoot();});
/* choices keyboard */
choicesWrap.addEventListener('keydown',function(e){
var idx=0;for(var i=0;i<PLANS.length;i++)if(PLANS[i].value===state.values.plan)idx=i;
var d=0;if(e.key==='ArrowRight'||e.key==='ArrowDown')d=1;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')d=-1;
if(d){e.preventDefault();var ni=(idx+d+PLANS.length)%PLANS.length;setPlan(PLANS[ni].value);try{choiceBtns[ni].focus();}catch(err){}}
else if(e.key==='Enter'){e.preventDefault();try{form.requestSubmit();}catch(err){onNext();}}
});
form.addEventListener('submit',onNext);
boxTags.addEventListener('click',function(e){if(e.target===boxTags){try{inTag.focus();}catch(err){}}});
boxName.addEventListener('click',function(){try{inName.focus();}catch(e){}});
boxSlug.addEventListener('click',function(){try{inSlug.focus();}catch(e){}});
/* autoplay typing loop */
function startTyping(immediate){
if(!state.autoplay)return;
if(state.typingTimer){try{clearTimeout(state.typingTimer);}catch(e){}}
var delay=immediate?650:650;
state.typingTimer=setTimeout(tick,delay);
function tick(){
if(!state.autoplay||state.done){state.typingTimer=0;return;}
if(state.current!==0){state.typingTimer=0;return;}
state.typeIdx+=1;
var s=AUTOTYPE.slice(0,state.typeIdx);
state.values.name=s;
if(!state.values.slugEdited)state.values.slug=slugify(s);
updateFields();updateFoot();
if(state.typeIdx< AUTOTYPE.length){state.typingTimer=setTimeout(tick,55+Math.random()*45);}
else{state.autoplay=false;state.typingTimer=0;}
}
}
if(window.__stepperReset){try{window.__stepperReset();}catch(e){}}
window.__stepper={state:state,goTo:goTo,next:onNext,back:onBack,startOver:onStartOver,setPlan:setPlan,updateAll:updateAll,els:{root:root,panes:panes,stepLis:stepLis,btnPrimary:btnPrimary,btnBack:btnBack,inName:inName,inSlug:inSlug,inTag:inTag}};
updateAll();
startTyping(false);
try{if(window.ResizeObserver){var ro=new ResizeObserver(function(){positionRing(false);});try{ro.observe(choicesWrap);}catch(e){}} }catch(e){}
window.addEventListener('resize',function(){positionRing(false);});
/* theme toggle */
var tBtn=document.getElementById('themeToggle');
function paintThemeIcon(){
try{
var cur=document.documentElement.getAttribute('data-theme')||'light';
var ic=document.getElementById('themeIcon');
if(ic){while(ic.firstChild)ic.removeChild(ic.firstChild);var p=document.createElementNS('http://www.w3.org/2000/svg','path');if(cur==='dark'){p.setAttribute('d','M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0-15v2m0 16v2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M2 12h2m16 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4');}else{p.setAttribute('d','M20 13A8 8 0 1 1 11 4a6.5 6.5 0 0 0 9 9Z');}ic.appendChild(p);}
if(tBtn)tBtn.setAttribute('aria-label',cur==='dark'?'Switch to light theme':'Switch to dark theme');
}catch(e){}
}
if(tBtn){
var down=false;
tBtn.addEventListener('pointerdown',function(){down=true;});
tBtn.addEventListener('mousedown',function(){down=true;});
tBtn.addEventListener('click',function(){
try{
var cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
var nxt=cur==='dark'?'light':'dark';
document.documentElement.setAttribute('data-theme',nxt);
try{localStorage.setItem(THEME_KEY,nxt);}catch(e){}
paintThemeIcon();
}catch(e){}
down=false;
});
paintThemeIcon();
}
})();
</script>
</body>
</html>
