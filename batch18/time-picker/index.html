<body>
<div class="page">
<header class="topbar">
<div class="brand"><div class="brand-mark" aria-hidden="true">S</div><div><div class="brand-name">Scheduler</div><div class="brand-meta" id="counts">2 fields &bull; Europe/Vienna</div></div></div>

</header>
<main class="card" aria-labelledby="card-title">
<h1 class="card-title" id="card-title">Run schedule</h1>
<p class="card-sub">Pick times from the interval list or type them — flexible parsing, locale formats, min/max limits.</p>
<form id="demo-form" class="field-stack" autocomplete="off"><div id="mount-1"></div><div id="mount-2"></div></form>
<p class="footer">Type <code>9:30</code>, <code>930</code>, <code>9.30pm</code> or <code>21:30</code>. Arrow keys move, <code>Enter</code> confirms, <code>Esc</code> closes.</p>
</main>
</div>
