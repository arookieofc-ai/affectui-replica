<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" aria-pressed="false"></button>
<main class="page-wrap">
  <div id="rlpMount"></div>
  <p class="page-note">Clean-room replica of the affectUI <code>Rate limit</code> planner. Drag a run bar to reschedule it,
  hover the chart for per-minute load, open <code>…</code> to edit a run, or hit <code>Spread out</code> to even out the peak.
  Keyboard: arrows move the focused run (±15 min, <code>Shift</code> = ±60), <code>Enter</code> edits, <code>Delete</code> removes.</p>
</main>
<script>
(function(){
'use strict';
/* ================= Rate Limit Planner — clean-room implementation =================
   Behaviour ported from the observed demo: smoothstep climb + exponential-tail
   decay curves per run, 1440-minute day grid, 5-minute drag snapping, 3-pass
   peak-spreading, and the "Lead research" auto-play loop. All code below is
   original; only data values / user-facing strings match the demo. */

/* ---------- constants ---------- */
var DAY = 1440, SNAP = 5, YMAX = 1.3, SIGMA = 28, FLOOR = 0.12;
var LIMIT = 120000, BUFFER = 0.8, START_HOUR = 6, START_MIN = START_HOUR * 60;
var NOW_MIN = 10 * 60 + 30;              // "Now 10:30"
var TODAY = 'weekdays';
var COLORS = ['#0190fe','#a651f0','#13b3a0','#ee3e9e','#14b3f0','#5fc88a','#e8b000'];
var CHECKPOINT = { at: 23 * 60, label: 'Nightly batch' };
var TITLE = 'Rate limit';

/* ---------- demo data (verbatim from the demo) ---------- */
function at(h, m){ return h * 60 + (m || 0); }
var DEMO_RUNS = [
  { id:'triage',   name:'Inbox triage',  at:at(8),        peak:46000, rise:45, halfLife:70 },
  { id:'research', name:'Lead research', at:at(11),       peak:82000, rise:60, halfLife:90 },
  { id:'report',   name:'Report writer', at:at(15,30),    peak:74000, rise:55, halfLife:100 },
  { id:'review',   name:'Code review',   at:at(18,30),    peak:36000, rise:30, halfLife:60 },
  { id:'digest',   name:'Weekly digest', at:at(19,30),    peak:40000, rise:40, halfLife:80, days:'weekend' }
];
var LOOP_ID = 'research', LOOP_FROM = at(11), LOOP_TO = at(14,50);

/* ---------- math ---------- */
function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function fmtTime(mins){
  var t = ((Math.round(mins) % DAY) + DAY) % DAY;
  var h = Math.floor(t / 60), m = t % 60;
  return (h < 10 ? '0' + h : '' + h) + ':' + (m < 10 ? '0' + m : '' + m);
}
function fmtNum(n){
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'k';
  return '' + Math.round(n);
}
function norm(run){
  return {
    id: run.id, name: run.name, days: run.days,
    at: ((Math.round(typeof run.at === 'number' && isFinite(run.at) ? run.at : 0) % DAY) + DAY) % DAY,
    peak: Math.max(0, typeof run.peak === 'number' && isFinite(run.peak) ? run.peak : 0),
    rise: run.rise === undefined ? 30 : Math.max(1, run.rise),
    halfLife: run.halfLife === undefined ? 45 : Math.max(1, run.halfLife)
  };
}
/* load factor t minutes after start, for a unit-peak run */
function curve(run, t, peak){
  if (t < 0) return 0;
  var rise = Math.max(1, run.rise == null ? 30 : run.rise);
  if (t < rise){ var k = t / rise; return peak * k * k * (3 - 2 * k); }
  var d = t - rise, hl = Math.max(1, run.halfLife == null ? 45 : run.halfLife);
  return peak * Math.pow(0.5, (Math.sqrt(d * d + SIGMA * SIGMA) - SIGMA) / hl);
}
/* minutes until a unit-peak run decays below FLOOR */
function duration(run){
  var t = Math.max(1, run.rise == null ? 30 : run.rise);
  while (t < DAY && curve(run, t, 1) > FLOOR) t += SNAP;
  return t;
}
function forToday(run, day){ return !run.days || run.days === 'daily' || run.days === day; }
function toOffset(mins){ return ((mins - START_MIN) % DAY + DAY) % DAY; }
function addRun(grid, run, atMin, peak){
  for (var m = atMin; m < DAY; m++){
    var v = curve(run, m - atMin, peak);
    if (v < peak * 0.002 && m - atMin > 60) break;
    grid[m] += v;
  }
}
function buildTotals(runs, day){
  var out = new Float64Array(DAY);
  for (var i = 0; i < runs.length; i++){
    if (!forToday(runs[i], day)) continue;
    addRun(out, runs[i], toOffset(runs[i].at), runs[i].peak);
  }
  return out;
}
/* Catmull-Rom -> cubic bezier path through [x,y] points */
function smoothPath(pts){
  if (!pts.length) return '';
  var d = 'M ' + pts[0][0] + ' ' + pts[0][1];
  for (var n = 0; n < pts.length - 1; n++){
    var p0 = pts[Math.max(0, n - 1)], p1 = pts[n], p2 = pts[n + 1], p3 = pts[Math.min(pts.length - 1, n + 2)];
    d += ' C ' + (p1[0] + (p2[0] - p0[0]) / 6) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6) +
         ', ' + (p2[0] - (p3[0] - p1[0]) / 6) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6) +
         ', ' + p2[0] + ' ' + p2[1];
  }
  return d;
}
/* deterministic 3x3 pixel-mark: exactly 9 cells, >= 5 lit */
function markCells(id){
  var h = 0, i;
  for (i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  for (i = 0; i < 64; i++){
    var word = (h >> (i % 26)) & 63, cells = [], on = 0, b;
    for (b = 0; b < 3; b++){
      var col = (word >> (b * 2)) & 3;
      cells.push(col & 1); cells.push((col >> 1) & 1); cells.push(col & 1);
    }
    for (b = 0; b < 9; b++) if (cells[b]) on++;
    if (on >= 5) return cells;
    h = (h * 1103515245 + 12345) >>> 0;
  }
  return [1,0,1,0,1,0,1,0,1];
}
/* measured (actual) load for the elapsed part of the day */
function measuredLoad(){
  var plan = buildTotals(DEMO_RUNS.map(norm), TODAY);
  var n = NOW_MIN - START_MIN, out = new Array(n);
  for (var i = 0; i < n; i++) out[i] = plan[i] * (1.12 + 0.05 * Math.sin(i / 7) + 0.03 * Math.sin(i / 2.3));
  return out;
}

/* ---------- derived model ---------- */
function todayRuns(){ return runs.filter(function(r){ return forToday(r, TODAY); }); }
function colorFor(run, list){
  if (run.color) return run.color;
  var i = list.indexOf(run);
  return COLORS[((i < 0 ? 0 : i) % COLORS.length + COLORS.length) % COLORS.length];
}
function isPast(run){ return toOffset(run.at) < nowOffset; }
function runState(run){
  if (!isPast(run)) return null;
  return nowOffset < toOffset(run.at) + duration(run) ? 'running' : 'done';
}
function model(){
  var list = todayRuns().map(norm);
  var total = new Float64Array(DAY), sel = new Float64Array(DAY), rest = new Float64Array(DAY);
  var i, r, off;
  for (i = 0; i < list.length; i++){
    r = list[i]; off = toOffset(r.at);
    addRun(total, r, off, r.peak);
    addRun(r.id === selectedId ? sel : rest, r, off, r.peak);
  }
  var peak = 0, peakM = 0, amount = 0;
  for (i = 0; i < DAY; i++){ amount += total[i]; if (total[i] > total[peakM]){ peakM = i; peak = total[i]; } }
  var over = [];
  for (i = 0; i < DAY; i++){
    if (total[i] <= LIMIT) continue;
    var last = over[over.length - 1];
    if (last && last[1] === i - 1) last[1] = i; else over.push([i, i]);
  }
  return { list:list, total:total, sel:sel, rest:rest, peak:peak, peakM:peakM, amount:amount, over:over,
           overWithoutBust: rest.some(function(v){ return v > LIMIT; }) };
}
/* pace check: measured vs planned over the last hour */
function paceInfo(m){
  if (MEASURED.length < 30) return null;
  var ms = 0, ps = 0, i;
  for (i = Math.max(0, nowOffset - 60); i < Math.min(nowOffset, MEASURED.length); i++){ ms += MEASURED[i]; ps += m.total[i]; }
  if (ps < 1) return null;
  var ratio = ms / ps, atM = nowOffset, j;
  for (j = nowOffset; j < DAY; j++) if (m.total[j] > m.total[atM]) atM = j;
  return { ratio:ratio, peak:m.total[atM] * ratio, at:atM };
}
/* single-run fix suggestion for the selected run */
function fixSuggestion(m){
  var run = null, i;
  for (i = 0; i < m.list.length; i++) if (m.list[i].id === selectedId) run = m.list[i];
  if (!run || isPast(run) || !m.over.length || m.overWithoutBust) return null;
  function fits(atMin){
    for (var q = atMin; q < DAY; q++){
      var v = curve(run, q - atMin, run.peak);
      if (v < 1 && q - atMin > 60) return true;
      if (m.rest[q] + v > LIMIT) return false;
    }
    return true;
  }
  var base = toOffset(run.at);
  for (var step = SNAP; step < DAY; step += SNAP){
    var cand = [base - step, base + step];
    for (var c = 0; c < 2; c++){
      if (cand[c] >= nowOffset && cand[c] <= 1380 && fits(cand[c]))
        return { run:run, at:(cand[c] + START_MIN) % DAY };
    }
  }
  return null;
}
/* cheapest start minute for `run` near `fromMin`, scanning +-span on a 15-min grid */
function cheapestSlot(run, without, fromMin, span){
  var best = fromMin, bestCost = Infinity;
  var lo = Math.max(nowOffset, fromMin - span), hi = Math.min(DAY - duration(run), fromMin + span);
  for (var s = Math.ceil(lo / 15) * 15; s <= hi; s += 15){
    var worst = 0;
    for (var q = s; q < DAY; q++){
      var v = curve(run, q - s, run.peak);
      if (v < run.peak * 0.01 && q - s > 60) break;
      worst = Math.max(worst, without[q] + v);
    }
    var cost = worst + Math.abs(s - fromMin) * 1e-6;
    if (cost < bestCost){ bestCost = cost; best = s; }
  }
  return best;
}

    var m = Math.min(DAY - 1, Math.round(i / (buckets - 1) * (DAY - 1)));

    ' · ' + fmtNum(m.amount) + ' tokens · ' + fmtNum(LIMIT) + ' / min';
  var over = m.over.length > 0;
  var close = !over && m.peak > LIMIT * BUFFER;
  if (over){
    badge.setAttribute('data-state', 'over');

      fmtTime(m.over[m.over.length - 1][1] + START_MIN + 1);

    if (ev.key === 'Enter'){ ev.preventDefault(); toggleEditor(id, null); return; }
    if ((ev.key === 'Delete' || ev.key === 'Backspace') && !isPast(run)){ ev.preventDefault(); removeRun(id); return; }
    if (isPast(run)) return;
    var step = ev.shiftKey ? 60 : 15, off = toOffset(run.at), next = null;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') next = off + step;
    else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') next = off - step;
    else if (ev.key === 'PageUp') next = off + 60;
    else if (ev.key === 'PageDown') next = off - 60;
    else if (ev.key === 'Home') next = 0;
    else if (ev.key === 'End') next = DAY;
    if (next !== null){ ev.preventDefault(); select(id); setAt(id, next); }
  };
}
function onChartHover(ev){
  if (dragInfo) return; /* dragging owns the pointer; hover never re-renders rows */
  var r = chartBox.getBoundingClientRect ? chartBox.getBoundingClientRect() : { left:0, width:chartW || 600 };
  var w = r.width || 1;
  var x = (ev.clientX - r.left) / w * DAY;
  var nx = (x >= 0 && x < DAY) ? Math.floor(x) : null;
  if (nx !== hoverX){ hoverX = nx; if (chartModel) updateFlags(chartModel); }
}

/* ---------- demo auto-play loop (Lead research 11:00 <-> 14:50) ---------- */
function startLoop(){
  var pos = LOOP_FROM, dir = 1, pause = 6;
  var tick = function(){
    if (!autoPlay) return;
    if (pause > 0){ pause--; return; }
    pos += dir * SNAP;
    if (pos >= LOOP_TO || pos <= LOOP_FROM){
      pos = clamp(pos, LOOP_FROM, LOOP_TO);
      dir = -dir; pause = 14;
    }
    for (var i = 0; i < runs.length; i++){
      if (runs[i].id === LOOP_ID){
        runs[i] = norm({ id:runs[i].id, name:runs[i].name, days:runs[i].days,
          at:pos, peak:runs[i].peak, rise:runs[i].rise, halfLife:runs[i].halfLife });
        break;
      }
    }
    updateDynamic();
  };
  var iv = window.setInterval(function(){
    if (!autoPlay){ window.clearInterval(iv); return; }
    tick();
  }, 110);
  return iv;
}
function stopAuto(){ autoPlay = false; }
/* any trusted pointer/key interaction stops the demo loop (capture phase) */
document.addEventListener('pointerdown', function(ev){ if (ev.isTrusted) stopAuto(); }, true);
document.addEventListener('mousedown', function(ev){ if (ev.isTrusted) stopAuto(); }, true);
document.addEventListener('keydown', function(ev){ if (ev.isTrusted) stopAuto(); }, true);
/* clicking outside an open editor closes it */
document.addEventListener('pointerdown', function(ev){
  if (!editingId || !editorNode) return;
  var t = ev.target;
  if (editorNode.contains && editorNode.contains(t)) return;
  if (t && t.closest && t.closest('[data-more]')) return;
  closeEditor(false);
});

/* ---------- theme toggle ---------- */
var themeBtn = document.getElementById('themeToggle');
function paintThemeBtn(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  while (themeBtn.firstChild) themeBtn.removeChild(themeBtn.firstChild);
  var s = svgEl('svg', { viewBox:'0 0 16 16', 'aria-hidden':'true' });
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '1.5'); s.setAttribute('stroke-linecap', 'round');
  if (dark){
    svgElAppend(s, 'path', { d:'M8 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z' });
    svgElAppend(s, 'path', { d:'M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15' });
    themeBtn.appendChild(s);
    themeBtn.appendChild(document.createTextNode('Light'));
    themeBtn.setAttribute('aria-label', 'Switch to light theme');
    themeBtn.setAttribute('aria-pressed', 'true');
  } else {
    svgElAppend(s, 'circle', { cx:'8', cy:'8', r:'3.4' });
    svgElAppend(s, 'path', { d:'M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1' });
    themeBtn.appendChild(s);
    themeBtn.appendChild(document.createTextNode('Dark'));
    themeBtn.setAttribute('aria-label', 'Switch to dark theme');
    themeBtn.setAttribute('aria-pressed', 'false');
  }
}
if (themeBtn){
  paintThemeBtn();
  themeBtn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    paintThemeBtn();
  });
}

/* ---------- boot ---------- */
buildSkeleton();
buildLanes(model());
startLoop();

/* test hooks (harmless in the browser) */
try {
  window.__rlpTest = {
    get runs(){ return runs; },
    get selected(){ return selectedId; },
    get editing(){ return editingId; },
    get auto(){ return autoPlay; },
    stop:function(){ stopAuto(); },
    setAt:setAt, select:select, remove:removeRun, spread:spreadOut, add:addRunFlow,
    model:model, fmtTime:fmtTime, fmtNum:fmtNum,
    root:function(){ return root; }
  };
} catch(e){}
})();
