<title>Model router — affectUI replica</title>
<style>
/* ---- design tokens (v3: every colour via custom properties) ---- */
:root{
  color-scheme: light dark;
  --surface:#ffffff;
  --page:#fafaf9;
  --ink:#1c1917;
  --ink-strong:#171717;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --radius-lg:16px;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --pop:0 0 0 1px var(--border),0 16px 32px -12px rgba(0,0,0,.2);
  --blue:#0060e2;
  --good:#1a7f45;
  --good-bg:rgba(31,168,85,.1);
  --bad:#c2341f;
  --bad-bg:rgba(240,68,56,.1);
  --warn:#f59e0b;
  --warn-bg:#fef3c7;
  --warn-text:#92400e;
  --live:#2fb36a;
  --button:#171717;
  --button-ink:#ffffff;
  --focus:rgba(0,96,226,.7);
  --track:rgba(0,0,0,.07);
  --sel:rgba(0,0,0,.06);
  --fail:#f04438;
  --ease:cubic-bezier(.22,1,.36,1);
  --morph:cubic-bezier(.65,0,.35,1);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1c1c1f;
  --page:#101012;
  --ink:#ededed;
  --ink-strong:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --shadow:0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.3);
  --pop:0 0 0 1px var(--border),0 16px 32px -12px rgba(0,0,0,.6);
  --blue:#4d8dff;
  --good:#6fd49a;
  --good-bg:rgba(95,200,138,.14);
  --bad:#ff8a80;
  --bad-bg:rgba(240,68,56,.16);
  --warn:#fbbf24;
  --warn-bg:#451a03;
  --warn-text:#fde68a;
  --button:#ededed;
  --button-ink:#101012;
  --focus:rgba(77,141,255,.8);
  --track:#34343a;
  --sel:#2f2f33;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  color:var(--muted);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
/* ---- page chrome: name left, theme toggle top-right ---- */
.page-bar{
  display:flex;align-items:center;justify-content:space-between;
  max-width:760px;margin:0 auto;padding:18px 20px 0;
}
.page-name{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.theme-toggle{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow);transition:background-color 150ms ease,transform 150ms ease;
}
.theme-toggle:hover{background:var(--subtle);transform:translateY(-1px)}
.theme-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-toggle svg{width:17px;height:17px}
.wrap{max-width:760px;margin:0 auto;padding:14px 20px 48px}
/* ================= model router card ================= */
.ui-mr{
  background:var(--surface);color:var(--muted);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  padding:18px 20px 16px;
  font-size:14px;letter-spacing:-.006em;
  font-variant-numeric:tabular-nums;
}
.ui-mr p{margin:0}
.ui-mr b{font-weight:600;color:var(--ink-strong)}
.ui-mr button{font:inherit}
.ui-mr__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-width:0}
.ui-mr__title{
  color:var(--ink-strong);font-size:15px;font-weight:600;
  min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.ui-mr__env{
  display:inline-flex;align-items:center;gap:6px;flex:0 1 auto;
  min-width:0;max-width:55%;height:24px;padding:0 9px;
  border-radius:999px;background:var(--subtle);
  box-shadow:inset 0 0 0 1px var(--border);
  color:var(--ink);font-size:12px;white-space:nowrap;
}
.ui-mr__env>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ui-mr__env>i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(47,179,106,.18)}
.ui-mr__summary{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0}
.ui-mr__cost{display:grid;gap:2px;min-width:0}
.ui-mr__label{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;line-height:20px;color:var(--muted)}
.ui-mr__quiet{color:var(--muted)}
.ui-mr__quiet::before{content:"·";margin-right:8px}
.ui-mr__delta{
  padding:0 9px;border-radius:999px;background:var(--good-bg);color:var(--good);
  font-weight:500;line-height:20px;white-space:nowrap;
}
.ui-mr__delta[data-up]{background:var(--bad-bg);color:var(--bad)}
.ui-mr__price{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.ui-mr__price>b{font-size:22px;line-height:30px;letter-spacing:-.02em;font-weight:600}
.ui-mr__price>span{font-size:12px;color:var(--muted)}
.ui-mr__tabs{display:flex;flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end;gap:2px;min-width:0}
.ui-mr__tab{
  max-width:150px;height:26px;padding:0 10px;white-space:nowrap;
  border:0;border-radius:999px;background:none;color:var(--muted);
  cursor:pointer;font-weight:500;transition:color 160ms ease,background-color 160ms ease;
}
.ui-mr__tab>span{display:block;overflow:hidden;text-overflow:ellipsis}
.ui-mr__tab:hover{color:var(--ink)}
.ui-mr__tab[aria-checked="true"]{background:var(--sel);color:var(--ink-strong)}
.ui-mr__tab:focus-visible,.ui-mr__pick-btn:focus-visible,.ui-mr__item:focus-visible,
.ui-mr__ghost:focus-visible,.ui-mr__deploy:focus-visible,.ui-mr__switch:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}
/* ---- flow diagram ---- */
.ui-mr__flow{position:relative;margin:14px 0 6px}
.ui-mr__flow>svg{position:absolute;inset:0;overflow:visible;display:block}
.ui-mr__route{transition:opacity 200ms ease}
.ui-mr__flow[data-hover] .ui-mr__route:not([data-on]),
.ui-mr__flow[data-hover] .ui-mr__ends>li:not([data-on]){opacity:.75}
.ui-mr__band{fill:none;stroke-width:2;stroke-linecap:round;transition:stroke-width 700ms var(--morph)}
.ui-mr__line{fill:none;stroke-width:1.25}
.ui-mr__end{stroke:var(--surface);stroke-width:1.5}
.ui-mr__port{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.ui-mr__pkt{stroke:none}
.ui-mr__ends{position:absolute;top:0;right:0;margin:0;padding:0;list-style:none}
.ui-mr__ends>li{
  position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;
  height:22px;font-size:12px;transition:opacity 200ms ease;
}
.ui-mr__end-name{flex:1;min-width:0;overflow:hidden;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
/* ---- deterministic 3x3 pixel-mark per model id (exactly 9 cells) ---- */
.px{
  display:inline-grid;flex:none;width:16px;height:16px;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1px;
}
.px>i{border-radius:1px;background:transparent}
.px>i[data-f]{background:var(--px-c,#888)}
.px[data-twinkle]>i[data-f]{animation:px-tw 2.6s ease-in-out infinite}
@keyframes px-tw{50%{opacity:.45}}
/* ---- routes table ---- */
.ui-mr__routes{width:100%;margin:8px 0 0;border-collapse:collapse;font-size:12px}
.ui-mr__routes th,.ui-mr__routes td{padding:0 0 0 12px;font-weight:400;text-align:right;white-space:nowrap}
.ui-mr__routes thead th{height:28px;color:var(--muted);font-size:11px}
.ui-mr__routes thead th:first-child{color:var(--ink-strong);font-size:13px;font-weight:600}
.ui-mr__routes th:first-child{width:100%;max-width:0;padding:0;text-align:left}
.ui-mr__routes tbody tr{height:32px;transition:opacity 200ms ease}
.ui-mr__routes tbody td{color:var(--ink)}
.ui-mr__routes[data-hover] tbody tr:not([data-on]){opacity:.75}
.ui-mr__model{display:flex;align-items:center;gap:8px;min-width:0}
.ui-mr__name{min-width:0;overflow:hidden;color:var(--ink);font-size:13px;text-overflow:ellipsis}
.ui-mr__share{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px}
.ui-mr__bar{width:28px;height:4px;overflow:hidden;border-radius:2px;background:var(--track)}
.ui-mr__bar>i{display:block;height:100%;border-radius:inherit;transition:width 700ms var(--morph)}
/* ---- fallback row ---- */
.ui-mr__fallback{
  display:flex;align-items:center;gap:10px;min-width:0;margin-top:10px;
  padding:8px 10px;border-radius:14px;background:var(--subtle);
  box-shadow:inset 0 0 0 1px var(--border);
}
.ui-mr__fallback>b{flex:none;color:var(--ink-strong);font-weight:600}
.ui-mr__rule{display:flex;flex:1;align-items:center;justify-content:flex-end;gap:6px;min-width:0;color:var(--muted);font-size:12px;transition:opacity 200ms ease}
.ui-mr__fallback[data-off] .ui-mr__rule{opacity:.5}
.ui-mr__switch{
  position:relative;flex:none;width:28px;height:16px;margin:0;padding:0;
  border:0;border-radius:999px;background:rgba(0,0,0,.16);cursor:pointer;
  transition:background-color 200ms ease;
}
html[data-theme="dark"] .ui-mr__switch:not([aria-checked="true"]){background:rgba(255,255,255,.18)}
.ui-mr__switch>i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform 220ms var(--ease)}
.ui-mr__switch[aria-checked="true"]{background:var(--blue)}
.ui-mr__switch[aria-checked="true"]>i{transform:translateX(12px)}
.ui-mr__pick{position:relative;display:inline-flex;min-width:0}
.ui-mr__arrow{flex:none;color:var(--muted);display:inline-flex}
.ui-mr__arrow svg{display:block}
.ui-mr__pick-btn{
  display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;
  height:26px;padding:0 8px 0 9px;border:0;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow);color:var(--ink);cursor:pointer;
}
.ui-mr__pick-btn:disabled{cursor:default}
.ui-mr__pick-btn>svg:last-child{color:var(--muted);flex:none}
.ui-mr__pick-name{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ui-mr__menu{
  position:absolute;bottom:calc(100% + 6px);left:0;z-index:5;display:grid;
  width:max-content;min-width:220px;padding:4px;border-radius:14px;
  background:var(--surface);box-shadow:var(--pop);
  animation:ui-mr-menu 160ms var(--ease) both;transform-origin:bottom left;
}
.ui-mr__menu[hidden]{display:none}
.ui-mr__menu-label{padding:4px 8px;font-size:11px;color:var(--muted)}
.ui-mr__item{
  display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;
  border:0;border-radius:8px;background:none;color:var(--ink);
  text-align:left;cursor:pointer;outline:none;
}
.ui-mr__item:hover{background:var(--sel)}
.ui-mr__item-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ui-mr__item>em{flex:none;font-style:normal;font-size:12px;color:var(--muted)}
.ui-mr__item-check{display:grid;flex:none;place-items:center;width:14px;color:var(--blue)}
/* ---- footer ---- */
.ui-mr__foot{display:flex;align-items:center;gap:8px;min-width:0;margin-top:14px}
.ui-mr__status{display:flex;flex:1;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap}
.ui-mr__status>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ui-mr__status>i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--live);transition:background-color 200ms ease}
.ui-mr__status>i[data-state="dirty"]{background:var(--warn)}
.ui-mr__status>i[data-state="busy"]{background:var(--blue);animation:ui-mr-pulse 900ms ease-in-out infinite}
.ui-mr__ghost,.ui-mr__deploy{
  display:inline-flex;flex:none;align-items:center;gap:6px;height:30px;padding:0 14px;
  border:0;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:opacity 200ms ease,background-color 160ms ease;
}
.ui-mr__ghost{background:none;color:var(--muted)}
.ui-mr__ghost:hover{background:var(--sel);color:var(--ink)}
.ui-mr__deploy{background:var(--button);color:var(--button-ink);font-weight:600}
.ui-mr__deploy[aria-disabled="true"]{opacity:.35;cursor:default}
.ui-mr__spinner{animation:ui-mr-spin 800ms linear infinite}
/* ---- rolling numbers ---- */
.ui-mr__roll{display:inline-grid;vertical-align:bottom;overflow:hidden;justify-items:end}
.ui-mr__price .ui-mr__roll{justify-items:start}
.ui-mr__roll>span{grid-area:1/1;white-space:nowrap}
.ui-mr__roll>span[data-in]{animation:ui-mr-roll-in 460ms var(--morph) both}
.ui-mr__roll>span[data-out]{animation:ui-mr-roll-out 460ms var(--morph) both}
@keyframes ui-mr-roll-in{from{opacity:0;transform:translateY(70%);filter:blur(2px)}}
@keyframes ui-mr-roll-out{to{opacity:0;transform:translateY(-70%);filter:blur(2px)}}
@keyframes ui-mr-menu{from{opacity:0;transform:translateY(4px) scale(.97)}}
@keyframes ui-mr-spin{to{transform:rotate(360deg)}}
@keyframes ui-mr-pulse{50%{opacity:.35}}
@media (max-width:520px){
  .ui-mr__summary{flex-direction:column}
  .ui-mr__lat{display:none}
}
@media (max-width:420px){
  .ui-mr__pick-name{display:none}
  .ui-mr__menu{right:0;left:auto;transform-origin:bottom right}
}
@media (prefers-reduced-motion:reduce){
  .ui-mr *,.ui-mr *::before,.ui-mr *::after{animation:none!important;transition:none!important}
}
</style>

<header class="page-bar">
  <span class="page-name">model-router</span>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme">

  </button>
</header>
<main class="wrap">
  <section class="ui-mr" aria-label="Model router" id="mrRoot">

      <span class="ui-mr__env" id="mrEnv"><i aria-hidden="true"></i><span>chat-prod</span></span>

    </div>
    <div class="ui-mr__foot">
      <p class="ui-mr__status"><i id="mrDot" data-state="live" aria-hidden="true"></i><span id="mrStatus"></span></p>
      <span id="mrRevertSlot"></span>
      <button class="ui-mr__deploy" id="mrDeploy" type="button" aria-disabled="true"></button>
    </div>
  </section>
</main>

(function(){

var MODELS = [

  { id:"gpt",   name:"GPT-5.5",         provider:"OpenAI",    p95:1.34, cost:0.0048, color:"#e8b000" },
  { id:"flash", name:"Gemini 3 Flash",  provider:"Google",    p95:0.64, cost:0.0007, color:"#5fc88a" },
  { id:"grok",  name:"Grok 5 Fast",     provider:"xAI",       p95:1.09, cost:0.0019, color:"#0190fe" }
];
var STRATS = [
  { id:"cost",     label:"Cost",     shares:{ opus:6,  gpt:21, flash:49, grok:24 } },
  { id:"balanced", label:"Balanced", shares:{ opus:17, gpt:42, flash:27, grok:14 } },
  { id:"quality",  label:"Quality",  shares:{ opus:58, gpt:30, flash:8,  grok:4  } }

function stratById(id){ for (var i=0;i<STRATS.length;i++) if (STRATS[i].id===id) return STRATS[i]; return null; }

  var t = 0;

      deployedFlag = false;

      update();
      if (ui.deploy && ui.deploy.focus) ui.deploy.focus();
    });
    ui.revertSlot.appendChild(g);
  }
  while (ui.deploy.firstChild) ui.deploy.removeChild(ui.deploy.firstChild);
  if (deploying){
    var sp = mk("span"); sp.innerHTML = SPIN_SVG; ui.deploy.appendChild(sp);
    ui.deploy.appendChild(DOC.createTextNode("Deploying"));
  } else if (!dirty && deployedFlag){
    var ck = mk("span"); ck.innerHTML = CHECK_SVG; ui.deploy.appendChild(ck);
    ui.deploy.appendChild(DOC.createTextNode("Deployed"));
  } else {
    ui.deploy.appendChild(DOC.createTextNode("Deploy policy"));
  }
  ui.deploy.setAttribute("aria-disabled", (!dirty || deploying) ? "true" : "false");
}
function deploy(){
  if (!isDirty() || deploying) return;
  deploying = true;
  renderFoot();
  var wait = reducedMotion() ? 0 : DEPLOY_MS;
  W.setTimeout(function(){
    livePolicy = clone(draft);
    liveVersion += 1;
    deploying = false;
    deployedFlag = true;
    update();
  }, wait);
}
/* ============ state transitions (only place that re-renders) ============ */
function setDraft(patch){
  if (patch.strategy) draft.strategy = patch.strategy;
  deployedFlag = false;
  closeMenu();
  update();
}
function update(){
  renderTabs();
  renderSummary();
  renderFlowShares();
  renderTable();
  renderFallback();
  renderFoot();
}
/* ============ theme ============ */
function initTheme(){
  var t = $("themeToggle"); if (!t) return;
  var moon = $("themeIconMoon"), sun = $("themeIconSun");
  function apply(theme){
    DOC.documentElement.setAttribute("data-theme", theme);
    var dark = theme === "dark";
    if (moon) moon.style.display = dark ? "none" : "";
    if (sun) sun.style.display = dark ? "" : "none";
    t.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  }
  var initial = "light";
  try{
    if (W.matchMedia && W.matchMedia("(prefers-color-scheme: dark)").matches) initial = "dark";
  }catch(e){}
  DOC.documentElement.setAttribute("data-theme", initial);
  apply(initial);
  t.addEventListener("click", function(){
    apply(DOC.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
}
/* ============ boot ============ */
function boot(){
  refs();
  initTheme();
  buildTabs();
  buildFlow();
  ensurePackets();
  buildTable();
  buildFallback();
  if (ui.deploy) ui.deploy.addEventListener("click", deploy);
  update();
  try{
    if (W.ResizeObserver && ui.flow){
      var ro = new W.ResizeObserver(function(){ layoutFlow(); });
      ro.observe(ui.flow);
    } else if (W.addEventListener){
      W.addEventListener("resize", function(){ layoutFlow(); });
    }
  }catch(e){}
  try{
    if (W.requestAnimationFrame) W.requestAnimationFrame(function(ts){ lastFrame = ts || 0; W.requestAnimationFrame(loop); });
  }catch(e){}
}
/* expose internals for the headless harness (harmless in browsers) */
try{
  W.__mr = {
    MODELS:MODELS, STRATS:STRATS,
    get draft(){ return draft; }, get live(){ return livePolicy; },
    get version(){ return liveVersion; }, get deploying(){ return deploying; },
    get hover(){ return hoverId; }, get packets(){ return packets; },
    setDraft:setDraft, deploy:deploy, setHover:setHover,
    step:stepPackets, update:update, norm:normShares, blended:blended,
    money:money, pxBits:pxBits, ui:ui
  };
}catch(e){}
if (DOC && DOC.readyState === "loading" && DOC.addEventListener){
  DOC.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
})();
</script>
