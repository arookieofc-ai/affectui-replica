function scen(i){return SCEN[i];}
function availScopes(risk){return SCOPES.filter(function(s){return s!=="always"||risk!=="destructive";});}
function scopeLabel(s){return s==="once"?"Just once":s==="timed"?fmtDur(DUR):"Always";}
function allowLabel(s){return s==="once"?"Allow once":s==="timed"?"Allow for "+fmtDur(DUR):"Always allow";}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function later(fn,ms){timers.push(setTimeout(function(){if(auto)fn();},ms));}
function takeOver(){if(!auto)return;auto=false;clearTimers();
  noteEl.textContent="Manual mode — you are in control. Press “Replay demo” for autoplay.";
  paintNav();}
/* ---------- theme ---------- */
var themeBtn=document.getElementById("themeBtn");
function setTheme(t){document.documentElement.setAttribute("data-theme",t);
  themeBtn.textContent=t==="dark"?"☾":"◐";themeBtn.setAttribute("aria-label","Switch to "+(t==="dark"?"light":"dark")+" mode");
  try{localStorage.setItem("pr-theme",t);}catch(e){}}
(function initTheme(){var t=null;try{t=localStorage.getItem("pr-theme");}catch(e){}
  if(!t)t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  setTheme(t);})();
themeBtn.addEventListener("click",function(){setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");});
/* capture trusted input early: stop autoplay like the original */
document.addEventListener("pointerdown",function(e){if(e.isTrusted)takeOver();},true);
document.addEventListener("keydown",function(e){if(e.isTrusted&&(e.key==="Enter"||e.key==="Escape"))takeOver();},true);
/* global keys: Enter -> Allow, Escape -> Deny for the open pending run.
   Mirrors the original card onKeyDown (Enter allow unless on BUTTON, Escape
   always denies) but also works when focus is outside the card (e.g. body),
   which the card-only handler can't reach. Guarded so native BUTTON Enter
   clicks still win and decided runs are untouched. */
document.addEventListener("keydown",function(e){
  if(!e||(e.key!=="Enter"&&e.key!=="Escape"))return;
  var cur=runs[runs.length-1];
  if(!cur||cur.decision)return;
  var t=e.target&&e.target.tagName;
  if(e.key==="Enter"){
    if(t==="BUTTON"||t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
    if(e.preventDefault)e.preventDefault();
    takeOver();decide(cur,true);
  }else{
    if(e.preventDefault)e.preventDefault();
    takeOver();decide(cur,false);
  }
});
/* ---------- card builders (built once per state change, never in tick) ---------- */
function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function pxMark(id){
  var w=el("span","px");w.style.setProperty("--pxc",pxColor(id));
  w.setAttribute("aria-hidden","true");
  var c=pxCells(id);
  for(var i=0;i<9;i++){var s=el("i");if(c[i])s.className="on";w.appendChild(s);}
  return w;
}
function metaHtml(it){
  if(it.add!=null)return '<span class="add">+'+it.add+'</span> <span class="del">−'+it.del+'</span>';
  if(it.meta!=null)return String(it.meta).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  return "";
}
function isExpired(run,now){var d=run.decision;return !!(d&&d.allow&&d.until!=null&&now>=d.until);}
/* Build (or rebuild on state change only) one run card */
function buildCard(run){
  var sc=scen(run.req), now=shown, d=run.decision, exp=isExpired(run,now);
  var state=d?(exp?"expired":(d.allow?"allowed":"denied")):"pending";
  var card=el("div","ui-pr");
  card.setAttribute("data-risk",sc.risk);card.setAttribute("data-state",state);
  if(run!==runs[runs.length-1])card.setAttribute("data-past","");
  var wrap=el("div","ui-pr__card");
  card.appendChild(wrap);
  if(!d){
    var ask=el("div","ui-pr__ask");
    ask.setAttribute("role","dialog");ask.setAttribute("aria-label",sc.agent.name+" requests permission to "+sc.action);
    var body=el("div","ui-pr__body"+(sc.preview.length?"":" no-preview"));
    var head=el("div","ui-pr__head");
    head.appendChild(pxMark(sc.agent.name));
    var hg=el("span","ui-pr__heading");
    var title=el("span","ui-pr__title");
    var b1=document.createElement("b");b1.textContent=sc.agent.name;
    var b2=document.createElement("b");b2.textContent=sc.action;
    title.appendChild(b1);title.appendChild(document.createTextNode(" wants to "));title.appendChild(b2);
    hg.appendChild(title);
    var sub=el("span","ui-pr__sub");sub.title=sc.target||sc.agent.model;
    var tool=el("span","tool",GLYPH[sc.tool]||GLYPH.code);
    var st=el("span","ui-pr__sub-text");st.textContent=sc.target||sc.agent.model;
    sub.appendChild(tool);sub.appendChild(st);hg.appendChild(sub);
    head.appendChild(hg);
    if(sc.risk!=="safe"){
      var risk=el("span","ui-pr__risk"+(sc.risk==="destructive"?" destructive":""));
      risk.innerHTML=(sc.risk==="destructive"?GLYPH.gem:GLYPH.warn)+"<span>"+(sc.risk==="destructive"?"Destructive":"Risky")+"</span>";
      head.appendChild(risk);
    }
    body.appendChild(head);
    if(sc.reason){var why=el("p","ui-pr__why");why.textContent=sc.reason;body.appendChild(why);}
    if(sc.preview.length){
      var pv=el("section","ui-pr__preview");
      var lab=el("h4","ui-pr__label");
      var lt=el("span","ui-pr__label-text");lt.textContent=sc.previewTitle;
      var ct=el("span","ui-pr__count");ct.textContent=String(sc.preview.length);
      lab.appendChild(lt);lab.appendChild(ct);pv.appendChild(lab);
      var list=el("ul","ui-pr__list"+(run.open?" open":""));
      var vis=run.open?sc.preview:sc.preview.slice(0,LIMIT);
      vis.forEach(function(it,idx){
        var li=el("li","ui-pr__item");li.style.animationDelay=Math.min(idx,12)*40+"ms";
        li.appendChild(el("span","ui-pr__item-icon",GLYPH[it.icon]||GLYPH.file));
        var lb=el("span","ui-pr__item-label");lb.textContent=it.label;lb.title=it.label;
        li.appendChild(lb);
        var mh=metaHtml(it);
        if(mh){var mm=el("span","ui-pr__item-meta",mh);li.appendChild(mm);}
        list.appendChild(li);
      });
      pv.appendChild(list);
      var hidden=sc.preview.length-vis.length;
      if(hidden>0||run.open){
        if(sc.preview.length>LIMIT){
          var more=el("button","ui-pr__more");
          more.type="button";more.setAttribute("aria-expanded",run.open?"true":"false");
          more.textContent=run.open?"Show less":hidden+" more";
          more.addEventListener("click",function(){run.open=!run.open;refresh(false);});
          pv.appendChild(more);
        }
      }
      body.appendChild(pv);
    }
    var ans=el("div","ui-pr__answer");
    var scopes=availScopes(sc.risk);
    if(!scopes.includes(run.scope))run.scope=scopes[0];
    if(scopes.length>1){
      var rg=el("div","ui-pr__scopes");rg.setAttribute("role","radiogroup");rg.setAttribute("aria-label","How long");
      var btnByScope={};
      scopes.forEach(function(s){
        var b=el("button","ui-pr__scope");b.type="button";b.setAttribute("role","radio");
        b.setAttribute("aria-checked",s===run.scope?"true":"false");
        b.setAttribute("data-scope",s);b.tabIndex=s===run.scope?0:-1;b.textContent=scopeLabel(s);
        btnByScope[s]=b;
        b.addEventListener("click",function(){run.scope=s;refresh(false);});
        b.addEventListener("keydown",function(e){
          var dlt=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;if(!dlt)return;
          e.preventDefault();
          var nx=scopes[(scopes.indexOf(run.scope)+dlt+scopes.length)%scopes.length];
          run.scope=nx;refresh(false);
          if(btnByScope[nx]&&btnByScope[nx].focus)btnByScope[nx].focus();
        });
        rg.appendChild(b);
      });
      ans.appendChild(rg);
    }
    if(sc.risk==="destructive"&&SCOPES.includes("always")&&scopes.indexOf("always")===-1){
      var hint=el("span","ui-pr__hint");hint.textContent="Destructive actions can’t be allowed for always";ans.appendChild(hint);
    }
    var btns=el("div","ui-pr__buttons");
    var deny=el("button","ui-pr__btn");deny.type="button";
    var denyT=el("span");denyT.textContent="Deny";deny.appendChild(denyT);
    deny.appendChild(el("kbd","ui-pr__kbd","Esc"));
    deny.addEventListener("click",function(){decide(run,false);});
    var allow=el("button","ui-pr__btn ui-pr__btn--primary");allow.type="button";
    var allowT=el("span","ui-pr__btn-label");allowT.textContent=allowLabel(run.scope);allow.appendChild(allowT);
    allow.appendChild(el("kbd","ui-pr__kbd","↵"));
    allow.addEventListener("click",function(){decide(run,true);});
    btns.appendChild(deny);btns.appendChild(allow);ans.appendChild(btns);
    body.appendChild(ans);
    ask.appendChild(body);
    ask.tabIndex=0;
    ask.addEventListener("keydown",function(e){
      if(run.decision)return;
      var t=e.target&&e.target.tagName;
      if(e.key==="Enter"&&t!=="BUTTON"){if(e.preventDefault)e.preventDefault();decide(run,true);}
      else if(e.key==="Escape"){if(e.preventDefault)e.preventDefault();decide(run,false);}
    });
    wrap.appendChild(ask);
  }else{
    var kind=exp?"expired":(d.allow?"allowed":"denied");
    var res=el("div","ui-pr__result");res.setAttribute("data-kind",kind);res.setAttribute("role","status");
    var ic=el("span","ui-pr__result-icon",kind==="allowed"?GLYPH.ok:kind==="denied"?GLYPH.no:GLYPH.clock);
    res.appendChild(ic);
    var tx=el("span","ui-pr__result-text");
    var hd=el("span","ui-pr__result-head");
    var headTxt=exp?"Access expired":d.allow?(d.scope==="once"?"Allowed once":d.scope==="timed"?timeAllowed(d):"Always allowed"):"Denied";
    hd.textContent=headTxt+" ";
    var act=el("span","ui-pr__result-act");act.textContent="· "+sc.action;hd.appendChild(act);
    hd.title=headTxt+" · "+sc.action;
    tx.appendChild(hd);
    var note=el("span","ui-pr__result-note");note.setAttribute("data-note","");
    tx.appendChild(note);res.appendChild(tx);
    var ghost=el("button","ui-pr__ghost");ghost.type="button";
    var showDrain=d.allow&&!exp&&d.scope!=="once";
    ghost.textContent=showDrain?"Revoke":(exp?"Ask again":"Change");
    ghost.addEventListener("click",function(){run.decision=null;run.open=false;refresh(false);});
    res.appendChild(ghost);
    if(d.allow&&d.scope==="timed"&&d.until!=null&&!exp){
      var drain=el("span","ui-pr__drain");drain.setAttribute("aria-hidden","true");
      var fill=el("span");drain.appendChild(fill);res.appendChild(drain);
      run._drain=fill;
    }else{run._drain=null;}
    wrap.appendChild(res);
    run._note=note;
    paintNote(run,now);
  }
  return card;
}
function timeAllowed(d){
  if(d.until==null||d.at==null)return "Allowed";
  var mins=Math.round((d.until-d.at)/MIN);
  return mins>0?"Allowed for "+fmtDur(mins):"Allowed";
}
function noteText(run,now){
  var sc=scen(run.req),d=run.decision,L=sc.agent.name;
  if(!d)return "";
  if(!d.allow)return L+" was told and won’t do it";
  if(isExpired(run,now))return L+" will ask again";
  if(d.scope==="timed"){
    if(d.until==null)return "No end time given";
    return fmtLeft(d.until-now)+" · until "+fmtTime(d.until,now);
  }
  if(d.scope==="once")return "At "+fmtTime(d.at,now)+" · it won’t carry over";
  return L+" won’t ask for this again";
}
function paintNote(run,now){
  if(run._note)run._note.textContent=noteText(run,now);
  if(run._note)run._note.title=noteText(run,now);
  if(run._drain&&run.decision&&run.decision.until!=null){
    var total=run.decision.until-run.decision.at,left=run.decision.until-now;
    var f=total>0?Math.max(0,Math.min(1,left/total)):0;
    run._drain.style.transform="scaleX("+f+")";
  }
}
/* ---------- decisions ---------- */
function decide(run,ok){
  var at=shown;
  run.decision={allow:ok,scope:run.scope,at:at,until:run.scope==="timed"?at+HOUR*1:void 0};
  refresh(false);
}
/* ---------- render: only on state change ---------- */
function refresh(rebuildNav){
  runsEl.innerHTML="";
  runs.forEach(function(r){runsEl.appendChild(buildCard(r));});
  var cur=runs[runs.length-1],sc=scen(cur.req);
  var pending=runs.filter(function(r){return !r.decision;}).length;
  reqEl.textContent=pending?pending+" requesting":"all decided";
  if(rebuildNav!==false)paintNav();
}
function paintNav(){
  navEl.innerHTML="";
  SCEN.forEach(function(sc,i){
    var b=document.createElement("button");
    b.className="nav-pill";b.type="button";
    b.textContent=sc.agent.name+" · "+sc.action;
    if(i===runs[runs.length-1].req)b.setAttribute("aria-current","true");
    /* open on pointerdown capture so a real click can't be lost across rebuild */
    b.addEventListener("pointerdown",function(){goScenario(i);},true);
    b.addEventListener("mousedown",function(){goScenario(i);},true);
    b.addEventListener("click",function(){goScenario(i);});
    b.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();goScenario(i);}});
    navEl.appendChild(b);
  });
  var rp=document.createElement("button");
  rp.className="nav-pill ghost";rp.type="button";rp.textContent=auto?"❚❚ pause demo":"▶ replay demo";
  rp.addEventListener("pointerdown",function(){replay();},true);
  rp.addEventListener("click",function(){replay();});
  navEl.appendChild(rp);
}
var going=false;
function goScenario(i){
  if(going&&runs[runs.length-1].req===i&&!runs[runs.length-1].decision)return;
  going=true;takeOver();
  clearTimers();
  runs=[{key:nextKey++,req:i,scope:"once",decision:null,open:false}];
  shown=Date.now();realT=Date.now();refresh();going=false;
}
function replay(){
  clearTimers();auto=true;going=false;
  runs=[{key:nextKey++,req:0,scope:"once",decision:null,open:false}];
  shown=Date.now();realT=Date.now();
  noteEl.textContent="Live demo — auto-plays each request. Click anywhere or decide to take over.";
  refresh();schedule();
}
/* ---------- autoplay (original timings: scope 1500ms, decide 2900ms, next 4700ms) ---------- */
function schedule(){
  var run=runs[runs.length-1],sc=scen(run.req),play=sc.play;
  if(play.scope!=="once")later(function(){run.scope=play.scope;refresh(false);},1500);
  later(function(){
    var at=shown;
    run.decision={allow:play.allow,scope:play.scope,at:at,until:play.scope==="timed"?at+36e5:void 0};
    refresh(false);
  },2900);
  later(function(){
    var nx=(run.req+1)%SCEN.length;
    if(nx===0){shown=Date.now();realT=Date.now();}
    runs.push({key:nextKey++,req:nx,scope:"once",decision:null,open:false});
    if(runs.length>2)runs=runs.slice(-2);
    refresh();schedule();
  },4700);
}
/* ---------- clock: 100ms tick, targeted updates only (no rebuild) ---------- */
setInterval(function(){
  var now=Date.now(),dt=now-realT;realT=now;
  var anyTimed=runs.some(function(r){return r.decision&&r.decision.allow&&r.decision.scope==="timed"&&r.decision.until>shown;});
  shown+=(anyTimed?SPEED:1)*dt;
  var changed=false;
  runs.forEach(function(r){
    if(r.decision&&r.decision.allow&&r.decision.scope==="timed"&&r.decision.until!=null){
      paintNote(r,shown);
      if(shown>=r.decision.until){changed=true;}
    }
  });
  if(changed)refresh(false); /* expired flip: rebuild once, outside the per-tick path otherwise */
},100);
refresh();schedule();
/* expose for headless harness */
window.__pr={get runs(){return runs;},SCEN:SCEN,get shown(){return shown;},decide:decide,schedule:schedule,
  fmtDur:fmtDur,fmtLeft:fmtLeft,fmtTime:fmtTime,pxCells:pxCells,
  get auto(){return auto;},takeOver:takeOver,replay:replay,goScenario:goScenario};
})();
</script>
</body>
</html>
