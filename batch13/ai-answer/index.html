<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Answer — affectUI replica</title>
<style>
/* ---- design tokens ---- */
:root, [data-theme="light"]{
  --page:#fafaf9; --surface:#ffffff; --ink:#171717; --text:#3f3f46;
  --muted:#78716c; --faint:#b8b2ac; --subtle:#f5f5f4; --chip:#f4f4f5;
  --chip-hover:#e9e9ea; --hover:#e4e4e5; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --shadow-card:0 0 0 1px var(--border), 0 1px 2px rgba(0,0,0,.04);
  --shadow-pop:0 0 0 1px var(--border), 0 12px 32px -10px rgba(0,0,0,.20), 0 2px 6px rgba(0,0,0,.04);
  --accent:#0190fe; --accent-soft:#e8f4ff;
  --lit:#171717; --lit-text:#ffffff; --lit-ring:#cfcfd3;
  --ok:#1e8a4f; --focus:rgba(0,96,226,.7);
  --amber:#92400e; --amber-bg:#fef3c7; --amber-line:#f59e0b;
  --shine:rgba(255,255,255,.85);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --ink:#ededed; --text:#c9c9ce;
  --muted:#a1a1aa; --faint:#63636b; --subtle:#26262a; --chip:#232326;
  --chip-hover:#2c2c31; --hover:#222225; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  --shadow-card:0 0 0 1px var(--border), 0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 0 0 1px var(--border), 0 16px 40px -10px rgba(0,0,0,.6);
  --accent:#4fb0fe; --accent-soft:#0e2a44;
  --lit:#ededed; --lit-text:#19191b; --lit-ring:#4a4a50;
  --ok:#5fc88a; --focus:rgba(77,141,255,.8);
  --amber:#fde68a; --amber-bg:#451a03; --amber-line:#fbbf24;
  --shine:rgba(255,255,255,.9);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--text);
  font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  transition:background-color 200ms ease, color 200ms ease;
}
/* ---- page header: project + working count + source count ---- */
.page-head{
  display:flex; align-items:center; gap:12px;
  max-width:720px; margin:0 auto; padding:18px 20px 6px;
}
.brand{display:flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:var(--ink); letter-spacing:-.01em}
.brand-mark{width:11px; height:11px; border-radius:3px;
  background:linear-gradient(135deg, var(--accent), #7dc5fe);
  box-shadow:0 0 0 3px var(--accent-soft)}
.head-meta{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); min-width:0;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.head-meta .sep{color:var(--faint)}
.phase-dot{width:8px; height:8px; border-radius:50%; background:var(--amber-line); flex:none}
.phase-dot[data-state="writing"]{background:var(--accent); animation:pulse 1s ease-in-out infinite}
.phase-dot[data-state="done"]{background:var(--ok); animation:none}
@keyframes pulse{50%{transform:scale(.65); opacity:.5}}
.theme-toggle{
  margin-left:auto; flex:none; display:grid; place-items:center;
  width:34px; height:34px; border-radius:999px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);
  cursor:pointer; transition:background-color 160ms ease, transform 160ms ease;
}
.theme-toggle:hover{background:var(--chip-hover); transform:translateY(-1px)}
.theme-toggle:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.theme-toggle svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
/* ---- layout ---- */
.wrap{max-width:720px; margin:0 auto; padding:10px 20px 40px}
.demo-note{font-size:12.5px; color:var(--muted); margin:2px 0 12px}
.q-switch{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px}
.q-switch button{
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  border-radius:999px; padding:5px 12px; font:inherit; font-size:12.5px; cursor:pointer;
  transition:all 160ms ease; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
.q-switch button:hover{color:var(--ink); border-color:var(--faint)}
.q-switch button[aria-current="true"]{background:var(--ink); border-color:var(--ink); color:var(--page)}
.q-switch button:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
/* ---- answer card ---- */
.ai{position:relative; display:grid; width:100%; max-width:640px; font-size:14px; line-height:1.5; color:var(--text)}
.ai button{margin:0; padding:0; border:0; background:none; font:inherit; color:inherit; cursor:pointer}
.ai svg{display:block; flex:none}
.ai button:focus-visible, .ai a:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.ai__tray{padding:4px; border-radius:calc(var(--radius-lg) + 4px); background:var(--subtle); transition:background-color 200ms ease}
.ai__card{background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); overflow:hidden}
.ai__inner{padding:22px 24px 20px}
.ai__q{margin:0 0 16px; font-size:18px; font-weight:600; line-height:1.35; letter-spacing:-.012em; color:var(--ink); overflow-wrap:anywhere}
/* sources */
.ai__sources{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)) auto; gap:8px}
.ai__src-wrap{display:flex; min-width:0}
.ai__src{
  display:flex; flex:1; flex-direction:column; gap:6px; min-width:0;
  padding:10px 12px 11px; border-radius:calc(var(--radius-lg) - 4px);
  background:var(--chip); color:inherit; text-decoration:none;
  transition:background-color 160ms ease, box-shadow 200ms ease, transform 160ms ease;
  animation:card-in 460ms var(--ease) both;
}
a.ai__src:hover{background:var(--chip-hover); transform:translateY(-1px)}
.ai__src[data-lit]{box-shadow:inset 0 0 0 1.5px var(--lit-ring)}
.ai__site{display:flex; align-items:center; gap:6px; min-width:0; font-size:12px; color:var(--muted)}
.ai__fav{
  display:grid; place-items:center; flex:none; width:16px; height:16px;
  border-radius:4px; font-size:10px; font-weight:700; color:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.08);
}
.ai__site-name{flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.ai__num{flex:none; font-size:11px; font-variant-numeric:tabular-nums; color:var(--faint)}
.ai__title{
  overflow-wrap:anywhere; display:-webkit-box; overflow:hidden;
  -webkit-line-clamp:2; -webkit-box-orient:vertical;
  font-size:12.5px; line-height:1.4; color:var(--ink);
}
.ai__rest{justify-content:space-between; min-width:52px; cursor:default}
.ai__rest-count{font-size:12.5px; font-weight:600; line-height:1.4; font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap}
.ai__rest-count [data-narrow]{display:none}
.ai__rest-label{font-size:12px; color:var(--muted)}
/* label row */
.ai__label{display:flex; align-items:center; gap:8px; margin:20px 0 10px; font-size:13px; font-weight:500; color:var(--ink)}
.ai__label-text{position:relative; animation:fade-in 320ms var(--ease) both}
.ai[data-phase="reading"] .ai__label-text, .ai[data-phase="writing"] .ai__label-text{color:var(--muted)}
.ai__label-text.shimmer::after{
  content:attr(data-text); content:attr(data-text) / "";
  position:absolute; inset:0; white-space:nowrap; color:transparent;
  background:linear-gradient(90deg, transparent 38%, var(--shine) 50%, transparent 62%) 100% 0 / 300% 100% no-repeat;
  -webkit-background-clip:text; background-clip:text;
  animation:sweep 1.6s linear infinite; pointer-events:none;
}
/* goo mark */
.ai__mark{width:27px; height:24px; overflow:visible; flex:none}
.ai__mark-body{fill:url(#aiBody)}
.ai__mark-eye{fill:#fff}
.ai__mark-pupil{fill:#0b3b66}
[data-theme="dark"] .ai__mark-eye{fill:#eaf4ff}
.ai__eyes{animation:look 7s ease-in-out infinite}
.ai[data-phase="reading"] .ai__eyes{animation:scan 1.4s ease-in-out infinite}
.ai[data-phase="writing"] .ai__eyes{animation:follow 1.9s cubic-bezier(.45,0,.55,1) infinite}
.ai__lid{transform-box:fill-box; transform-origin:center; animation:blink 7s ease-in-out infinite}
@keyframes look{0%,26%{transform:none}32%,44%{transform:translate(-2.5px,.5px)}50%,62%{transform:translate(2.5px,-.5px)}68%,100%{transform:none}}
@keyframes scan{0%,100%{transform:translate(-2.5px,.5px)}50%{transform:translate(2.5px,.5px)}}
@keyframes follow{0%{transform:translate(-2px,1px)}82%{transform:translate(2px,1px)}100%{transform:translate(-2px,1px)}}
@keyframes blink{0%,16%,21%,100%{transform:none}18.5%{transform:scaleY(.12)}}
/* answer */
.ai__answer{font-size:15px; line-height:1.65; overflow-wrap:anywhere; min-height:24px}
.ai__answer p{margin:0 0 12px}
.ai__answer ul{margin:0 0 12px; padding:0 0 0 20px}
.ai__answer li{margin:0 0 6px; padding-left:2px}
.ai__answer li::marker{color:var(--faint)}
.ai__answer > :last-child{margin-bottom:0}
.ai__empty{color:var(--muted)}
.ai__w{animation:word-in 420ms var(--ease) both}
.ai__w[data-bold]{font-weight:600; color:var(--ink)}
.ai__caret{display:inline-block; width:8px; height:8px; margin-left:4px; border-radius:50%; background:var(--ink); vertical-align:.05em; animation:pulse 1s ease-in-out infinite}
.ai__cite{
  display:inline-flex; max-width:100%; align-items:center; gap:3px;
  height:20px; margin:0 1px 0 3px; padding:0 7px;
  border-radius:calc(var(--radius-sm) - 1px); background:var(--chip);
  font-size:11.5px; font-weight:500; line-height:1; color:var(--muted); vertical-align:.12em;
  transition:background-color 160ms ease, color 160ms ease;
  animation:chip-in 380ms var(--ease) both;
}
.ai__cite:hover{background:var(--chip-hover); color:var(--ink)}
.ai__cite[data-lit]{background:var(--lit); color:var(--lit-text)}
.ai__cite-name{min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.ai__cite-more{flex:none; opacity:.7}
/* popover */
.ai__pop{
  position:absolute; z-index:5; display:grid; gap:2px; padding:6px;
  border-radius:calc(var(--radius-lg) - 2px); background:var(--surface); box-shadow:var(--shadow-pop);
  animation:pop-in 200ms var(--ease) both;
}
.ai__pop-item{display:grid; gap:4px; padding:8px 10px 10px; border-radius:calc(var(--radius-sm) + 2px); color:inherit; text-decoration:none; transition:background-color 140ms ease}
a.ai__pop-item:hover{background:var(--chip)}
.ai__pop-title{font-size:13px; font-weight:500; line-height:1.4; color:var(--ink); overflow-wrap:anywhere}
.ai__snippet{
  overflow-wrap:anywhere; display:-webkit-box; overflow:hidden;
  -webkit-line-clamp:3; -webkit-box-orient:vertical;
  font-size:12.5px; line-height:1.5; color:var(--muted);
}
/* follow-ups */
.ai__follow{display:grid; margin-top:20px; padding-top:14px; border-top:1px solid var(--border)}
.ai__follow-label{padding-bottom:4px; font-size:12px; font-weight:500; color:var(--faint); animation:fade-in 320ms var(--ease) both}
.ai__follow-item{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  min-height:40px; padding:8px 0; border-bottom:1px solid var(--border);
  text-align:left; color:var(--ink); animation:fade-in 380ms var(--ease) both;
}
.ai__follow-item:last-child{border-bottom:0; padding-bottom:0}
.ai__follow-item > span{min-width:0; overflow-wrap:anywhere}
.ai__follow-item svg{width:17px; height:17px; fill:none; stroke:var(--faint); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; transition:transform 220ms var(--ease), stroke 160ms ease}
.ai__follow-item:hover svg{stroke:var(--ink); transform:translateX(3px)}
/* footer */
.ai__foot{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:42px; margin-top:8px}
.ai__actions{display:flex; flex:none; gap:2px}
.ai__action{
  display:grid; place-items:center; width:32px; height:32px;
  border-radius:calc(var(--radius-sm) + 2px); color:var(--muted);
  transition:background-color 160ms ease, color 160ms ease;
  animation:fade-in 320ms var(--ease) both;
}
.ai__action:hover{background:var(--hover); color:var(--ink)}
.ai__action[aria-pressed="true"]{color:var(--ink)}
.ai__action svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.ai__action.flip svg{transform:scaleY(-1)}
.ai__action.ok svg{stroke:var(--ok); stroke-width:2.2; animation:chip-in 260ms var(--ease) both}
.ai__stop{
  display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 12px 0 10px;
  border-radius:calc(var(--radius-sm) + 2px); font-size:13px; color:var(--text);
  transition:background-color 160ms ease; animation:fade-in 260ms var(--ease) both;
}
.ai__stop:hover{background:var(--hover)}
.ai__stop-icon{width:9px; height:9px; border-radius:2px; background:var(--ink)}
.ai__status{min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:12.5px; white-space:nowrap; color:var(--muted); animation:fade-in 260ms var(--ease) both}
.ai__reasons{display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:0fr; opacity:0; transition:grid-template-rows 320ms var(--ease), opacity 200ms ease}
.ai__reasons[data-open="true"]{grid-template-rows:1fr; opacity:1}
.ai__reasons > div{display:flex; flex-wrap:wrap; gap:6px; min-height:0; overflow:hidden; padding:4px 6px 0}
.ai__reasons[data-open="true"] > div{padding-bottom:10px}
.ai__reasons button{
  min-height:30px; max-width:100%; padding:4px 11px; overflow-wrap:anywhere; text-align:start;
  border-radius:calc(var(--radius-sm) + 2px); background:var(--surface);
  box-shadow:0 0 0 1px var(--border); font-size:12.5px; color:var(--text);
  transition:color 140ms ease, box-shadow 140ms ease;
}
.ai__reasons button:hover{color:var(--ink); box-shadow:0 0 0 1px var(--faint)}
/* animations */
@keyframes card-in{from{opacity:0; transform:translateY(6px) scale(.96)}to{opacity:1; transform:none}}
@keyframes chip-in{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:none}}
@keyframes fade-in{from{opacity:0; transform:translateY(3px)}to{opacity:1; transform:none}}
@keyframes word-in{from{opacity:0; filter:blur(3px)}to{opacity:1; filter:none}}
@keyframes pop-in{from{opacity:0; transform:translateY(-4px) scale(.98)}to{opacity:1; transform:none}}
@keyframes sweep{from{background-position:100% 0}to{background-position:0% 0}}
/* responsive */
@media (max-width:520px){
  .ai__inner{padding:18px 18px 16px}
  .ai__q{font-size:16.5px}
  .ai__answer{font-size:14.5px}
  .ai__sources{grid-template-columns:repeat(2, minmax(0,1fr)) auto}
  .ai__sources > .ai__src-wrap:nth-child(3){display:none}
  .ai__rest-count [data-wide]{display:none}
  .ai__rest-count [data-narrow]{display:inline}
}
@media (prefers-reduced-motion: reduce){
  .ai *, .ai *::before, .ai *::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<header class="page-head">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>offsite-planner&nbsp;·&nbsp;AI Answer</span></div>
  <div class="head-meta" aria-hidden="true">
    <span class="phase-dot" id="phaseDot" data-state="reading"></span>
    <span id="phaseText">Reading 6 sources</span>
    <span class="sep">·</span><span>6 sources</span>
    <span class="sep">·</span><span>3 questions</span>
  </div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme">
    <svg id="iconMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5Z"/></svg>
    <svg id="iconSun" viewBox="0 0 24 24" aria-hidden="true" hidden><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
  </button>
</header>
<main class="wrap">
  <p class="demo-note">Streamed answer with sources, citations, copy, regenerate and follow-ups. Pick a question to replay the full read → write loop.</p>
  <div class="q-switch" id="qSwitch" role="group" aria-label="Demo questions"></div>
  <div id="app"></div>
</main>

/* ============ pure logic (also exercised by the test harness) ============ */
function tokenizeInline(s, nSrc){
  var toks = [], k = 0, parts = s.split(/(\*\*[^*]+\*\*|\[\d+(?:\s*,\s*\d+)*\])/g), p, m, i, ids, bold, body, words, w, prev, j;

    dn.setAttribute('aria-pressed', state.feedback === 'down' ? 'true' : 'false');
    var di = svgIcon(ICONS.up); di.setAttribute('class', 'ai__glyph'); dn.appendChild(di);
    dn.addEventListener('click', function(){ state.feedback = state.feedback === 'down' ? null : 'down'; state.thanked = null; renderFoot(); });
    acts.appendChild(cp); acts.appendChild(re); acts.appendChild(up); acts.appendChild(dn);
    foot.appendChild(acts);
  }
  var st = el('span', 'ai__status', statusText());
  st.setAttribute('aria-live', 'polite'); st.setAttribute('title', statusText());
  foot.appendChild(st);
  refs.status = st;
  refreshFoot();
}
function refreshFoot(){
  var open = state.feedback === 'down' && !state.thanked;
  refs.reasons.setAttribute('data-open', open ? 'true' : 'false');
  var btns = refs.reasons.firstChild ? refs.reasons.firstChild.childNodes : [];
  for (var i = 0; i < btns.length; i++){
    if (btns[i].setAttribute) btns[i].setAttribute('tabindex', open ? '0' : '-1');
  }
  if (refs.status){ refs.status.textContent = statusText(); refs.status.setAttribute('title', statusText()); }
  var ups = refs.foot.querySelectorAll ? [] : [];
  void ups;
}
function updateHead(){
  var pt = document.getElementById('phaseText'), pd = document.getElementById('phaseDot');
  var label = labelText(SOURCES.length);
  if (pt) pt.textContent = state.phase === 'done' ? 'Answer complete' : (state.phase === 'stopped' ? 'Stopped' : label);
  if (pd) pd.setAttribute('data-state', state.phase === 'reading' ? 'reading' : (state.phase === 'writing' ? 'writing' : 'done'));
}
/* ---- question switcher ---- */
function syncQSwitch(){
  var box = document.getElementById('qSwitch');
  if (!box) return;
  box.innerHTML = '';
  ORDER.forEach(function(k){
    var b = el('button', null, k.length > 42 ? k.slice(0, 42) + '\u2026' : k);
    b.setAttribute('type', 'button'); b.setAttribute('title', k);
    if (k === state.question) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', function(){ if (state.question !== k){ state.question = k; syncQSwitch(); startCycle(); } });
    box.appendChild(b);
  });
}
/* ---- theme ---- */
function applyTheme(t){
  if (rootEl) rootEl.setAttribute('data-theme', t);
  try { store.setItem('ai-answer-theme', t); } catch (e){}
  var moon = document.getElementById('iconMoon'), sun = document.getElementById('iconSun'), tg = document.getElementById('themeToggle');
  if (moon) moon.hidden = (t === 'dark');
  if (sun) sun.hidden = (t !== 'dark');
  if (tg) tg.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
}
function initTheme(){
  var t = null;
  try { t = store.getItem('ai-answer-theme'); } catch (e){}
  if (!t){
    try { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; } catch (e){}
  }
  applyTheme(t === 'dark' ? 'dark' : 'light');
}
/* ---- boot ---- */
function boot(){
  state.reduced = prefersReduced();
  initTheme();
  var tg = document.getElementById('themeToggle');
  if (tg) tg.addEventListener('click', function(){
    var cur = rootEl ? rootEl.getAttribute('data-theme') : 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });
  syncQSwitch();
  startCycle();
}
if (hasDoc) boot();
/* test hooks (used by the in-dir verification harness) */
try {
  if (typeof window !== 'undefined'){
    window.__ans = {
      state:state, refs:refs, SOURCES:SOURCES, ANSWERS:ANSWERS, ORDER:ORDER, REASONS:REASONS,
      parseAnswer:parseAnswer, formatElapsed:formatElapsed, readingDelay:readingDelay, plainCopy:plainCopy,
      startCycle:startCycle, stopCycle:stopCycle,
      answerText:function(){ return refs.answer ? refs.answer.textContent : ''; },
      phase:function(){ return state.phase; }
    };
  }
} catch (e){}
})();
</script>
