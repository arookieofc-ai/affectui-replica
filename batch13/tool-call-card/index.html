<style>
/* ============ design tokens ============ */
:root, html[data-theme="light"] {
  --surface: #ffffff;
  --page: #fafaf9;
  --ink: #171717;
  --text: #57534e;
  --muted: #78716c;
  --subtle: #f5f5f4;
  --border: #e7e5e4;
  --tile: #f5f5f4;
  --code: #fafafa;
  --radius-lg: 16px;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 4px 16px rgba(0, 0, 0, .05);
  --key: #171717;
  --str: #0b8576;
  --num: #b25e00;
  --lit: #8a35d6;
  --red: #c4320a;
  --red-bg: rgba(240, 68, 56, .06);
  --red-line: rgba(240, 68, 56, .18);
  --focus: rgba(0, 96, 226, .7);
  --shine: rgba(255, 255, 255, .82);
  --ring: #ffffff;
  --waiting-bg: #fef3c7;
  --waiting-text: #92400e;
  --waiting-dot: #f59e0b;
}
html[data-theme="dark"] {
  --surface: #1c1c1f;
  --page: #101012;
  --ink: #ededed;
  --text: #a1a1aa;
  --muted: #8f8f96;
  --subtle: #26262a;
  --border: #2e2e33;
  --tile: #1d1d20;
  --code: #1d1d20;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45);
  --key: #ededed;
  --str: #4fc3b4;
  --num: #f2a15c;
  --lit: #cfaef5;
  --red: #ff8a7a;
  --red-bg: rgba(255, 107, 95, .08);
  --red-line: rgba(255, 107, 95, .22);
  --focus: rgba(77, 141, 255, .8);
  --shine: rgba(255, 255, 255, .95);
  --ring: #161618;
  --waiting-bg: #451a03;
  --waiting-text: #fde68a;
  --waiting-dot: #fbbf24;
}
/* ============ base ============ */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 640px; margin: 0 auto; padding: 28px 20px 72px; }
/* ============ page header: project + working count + tool count ============ */
.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.page-head__meta {
  display: flex;
  align-items: baseline;
  gap: 7px;
  min-width: 0;
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
}
.page-head__project {
  color: var(--ink);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  overflow: hidden;
  text-overflow: ellipsis;
}
.page-head__sep { color: var(--muted); }
.page-head__working {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 500;
  color: var(--waiting-text);
  background: var(--waiting-bg);
  border-radius: 999px;
  padding: 1px 9px;
  font-variant-numeric: tabular-nums;
}
.page-head__working::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--waiting-dot);
}
.page-head__working[data-state="idle"] { color: var(--muted); background: var(--subtle); }
.page-head__working[data-state="idle"]::before { background: var(--muted); }
.theme-toggle {
  flex: none;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: color 160ms ease, background-color 160ms ease, border-color 160ms ease;
}
@media (hover: hover) and (pointer: fine) {
.theme-toggle:hover { color: var(--ink); background: var(--subtle); }
}
.theme-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.theme-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
/* ============ token-count context: thin 3px bar, right-aligned label ============ */
.context { margin: 2px 0 18px; }
.context__label {
  display: block;
  text-align: right;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-bottom: 5px;
}
.context__bar { height: 3px; border-radius: 999px; background: var(--subtle); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; }
.context__fill { height: 100%; width: 22%; border-radius: 999px; background: var(--waiting-dot); }
/* ============ chat ============ */
.chat-you {
  margin: 0 0 14px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  font-size: 14px;
}
.hint { margin: 18px 2px 0; font-size: 12.5px; color: var(--muted); }
/* ============ tool-call group ============ */
.tc-group { display: grid; }
.tc-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.tc-group__head {
  all: unset;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 9px;
  justify-self: start;
  max-width: 100%;
  min-height: 36px;
  padding: 4px 10px 4px 5px;
  border-radius: var(--radius);
  color: var(--text);
  cursor: pointer;
  transition: background-color 160ms ease, color 160ms ease;
}
@media (hover: hover) and (pointer: fine) {
.tc-group__head:hover { background: var(--subtle); color: var(--ink); }
}
.tc-group__head:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tc-group__stack { display: flex; flex: none; }
.tc-group__stack .tc-icon {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  box-shadow: inset 0 0 0 1px var(--border), 0 0 0 2px var(--ring);
  animation: tc-pop 420ms cubic-bezier(.22, 1, .36, 1) both;
}
.tc-group__stack .tc-icon + .tc-icon { margin-left: -5px; }
.tc-group__stack .tc-icon > svg { width: 13px; height: 13px; }
.tc-group__title {
  display: flex;
  align-items: baseline;
  gap: 5px;
  min-width: 0;
  white-space: nowrap;
  animation: tc-in 360ms cubic-bezier(.22, 1, .36, 1) both;
}
.tc-group__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: inherit; font-weight: 500; }
.tc-group__failed { flex: none; color: var(--red); }
.tc-group__time { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.tc-group__list { display: grid; gap: 8px; padding-top: 8px; }
/* ============ tool-call card ============ */
.tc-card {
  position: relative;
  border-radius: calc(var(--radius-lg) - 4px);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, .04);
  color: var(--text);
  font-size: 13.5px;
  line-height: 1.4;
  letter-spacing: -.006em;
}
.tc-head {
  all: unset;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  padding: 8px 10px 8px 9px;
  border-radius: calc(var(--radius-lg) - 4px);
  cursor: pointer;
  transition: background-color 160ms ease;
}
.tc-card[data-open] .tc-head { border-radius: calc(var(--radius-lg) - 4px) calc(var(--radius-lg) - 4px) 0 0; }
@media (hover: hover) and (pointer: fine) {
.tc-head:hover { background: var(--subtle); }
}
.tc-head:focus-visible, .tc-copy:focus-visible, .tc-more:focus-visible, .tc-retry:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.tc-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: var(--tile);
  box-shadow: inset 0 0 0 1px var(--border);
  color: var(--ink);
}
.tc-icon > svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.tc-main { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
.tc-name {
  flex: 0 1 auto;
  max-width: 55%;
  overflow: hidden;
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tc-summary { flex: 1 1 0; min-width: 0; overflow: hidden; color: var(--text); text-overflow: ellipsis; white-space: nowrap; }
.tc-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  color: var(--muted);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  animation: tc-in 360ms cubic-bezier(.22, 1, .36, 1) both;
}
.tc-card[data-status="error"] .tc-status { color: var(--red); }
.tc-status > svg { width: 14px; height: 14px; flex: none; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tc-spinner { animation: tc-spin 800ms linear infinite; }
.tc-spinner circle { stroke: currentColor; stroke-width: 1.6; opacity: .22; }
.tc-spinner path { stroke: var(--ink); stroke-width: 1.6; }
.tc-ok { stroke: var(--ink); stroke-width: 1.8; }
.tc-ok path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tc-draw 360ms cubic-bezier(.22, 1, .36, 1) 80ms forwards; }
.tc-err { stroke: var(--red); stroke-width: 1.5; }
.tc-chevron {
  flex: none;
  width: 14px;
  height: 14px;
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 360ms cubic-bezier(.22, 1, .36, 1);
}
.tc-card[data-open] .tc-chevron { transform: rotate(180deg); }
/* body: grid 0fr -> 1fr animation */
.tc-body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 380ms cubic-bezier(.22, 1, .36, 1), opacity 240ms ease; }
.tc-card[data-open] > .tc-body, .tc-group[data-open] > .tc-body { grid-template-rows: 1fr; opacity: 1; }
.tc-clip { min-height: 0; overflow: hidden; }
.tc-sections { display: grid; gap: 12px; padding: 12px 12px 14px; border-top: 1px solid var(--border); }
.tc-section { display: grid; gap: 6px; min-width: 0; }
.tc-section__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.tc-label { color: var(--muted); font-size: 12px; font-weight: 500; }
.tc-pending { margin: 0; color: var(--muted); font-size: 12.5px; }
.tc-copy {
  all: unset;
  position: relative;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: calc(var(--radius-sm) - 1px);
  color: var(--muted);
  cursor: pointer;
  transition: background-color 160ms ease, color 160ms ease;
}
@media (hover: hover) and (pointer: fine) {
.tc-copy:hover { background: var(--subtle); color: var(--ink); }
}
.tc-copy svg {
  position: absolute;
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: opacity 200ms ease, transform 320ms cubic-bezier(.22, 1, .36, 1), filter 200ms ease;
}
.tc-copy__done { opacity: 0; transform: scale(.6); filter: blur(2px); stroke-width: 1.7; }
.tc-copy[data-copied] { color: var(--ink); }
.tc-copy[data-copied] .tc-copy__icon { opacity: 0; transform: scale(.6); filter: blur(2px); }
.tc-copy[data-copied] .tc-copy__done { opacity: 1; transform: none; filter: none; }
.tc-code {
  position: relative;
  margin: 0;
  padding: 10px 12px;
  overflow: hidden;
  border-radius: calc(var(--radius-sm) + 1px);
  background: var(--code);
  box-shadow: inset 0 0 0 1px var(--border);
  color: var(--muted);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  tab-size: 2;
  transition: max-height 420ms cubic-bezier(.22, 1, .36, 1);
}
.tc-code code { display: block; font: inherit; }
.tc-code::after {
  content: "";
  position: absolute;
  left: 1px;
  right: 1px;
  bottom: 1px;
  height: 56px;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  background: linear-gradient(to bottom, transparent, var(--code));
  opacity: 0;
  transition: opacity 240ms ease;
  pointer-events: none;
}
.tc-code[data-capped]::after { opacity: 1; }
.tc-code[data-scroll] { overflow-y: auto; overscroll-behavior: contain; }
.tc-t-key { color: var(--key); }
.tc-t-str { color: var(--str); }
.tc-t-num { color: var(--num); }
.tc-t-lit { color: var(--lit); }
.tc-more {
  all: unset;
  justify-self: start;
  padding: 2px 4px;
  margin-left: -4px;
  border-radius: 5px;
  color: var(--text);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: color 160ms ease;
}
@media (hover: hover) and (pointer: fine) {
.tc-more:hover { color: var(--ink); }
}
.tc-error {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 10px 9px 11px;
  border-radius: calc(var(--radius-sm) + 1px);
  background: var(--red-bg);
  box-shadow: inset 0 0 0 1px var(--red-line);
}
.tc-error > .tc-err { flex: none; width: 14px; height: 14px; margin-top: 2px; fill: none; stroke-linecap: round; }
.tc-error__text {
  flex: 1;
  min-width: 0;
  max-height: 200px;
  margin: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  white-space: pre-line;
  color: var(--red);
  font-size: 13px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.tc-retry {
  all: unset;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  height: 26px;
  margin: -3px 0;
  padding: 0 10px 0 8px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, .04);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 160ms ease;
}
@media (hover: hover) and (pointer: fine) {
.tc-retry:hover { background: var(--subtle); }
}
.tc-retry svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tc-retry:active svg { transform: rotate(-60deg); transition: transform 200ms cubic-bezier(.22, 1, .36, 1); }
/* shine sweep over "Using tools…" */
.tc-shine { position: relative; }
.tc-shine::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  white-space: nowrap;
  color: transparent;
  background: linear-gradient(90deg, transparent 38%, var(--shine) 50%, transparent 62%) 100% 0 / 300% 100% no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  animation: tc-sweep 1.8s linear infinite;
  pointer-events: none;
}
@keyframes tc-in { from { opacity: 0; transform: translateY(3px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes tc-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes tc-spin { to { transform: rotate(360deg); } }
@keyframes tc-draw { to { stroke-dashoffset: 0; } }
@keyframes tc-sweep { from { background-position: 100% 0; } to { background-position: 0% 0; } }
@media (prefers-reduced-motion: reduce) {
  .tc-card *, .tc-group *, .tc-card *::after, .tc-group *::after {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
  }
  .tc-shine::after { display: none; }
  .tc-ok path { stroke-dashoffset: 0; }
}
@media (max-width: 480px) {
  .page { padding: 18px 12px 56px; }
  .tc-head { gap: 8px; }
}
@media (max-width: 440px) {
  .tc-summary { display: none; }
  .tc-name { max-width: none; }
}
</style>

  ], total: 5, cached: false };

  var FETCH_ARGS = { url: 'https://www.hubspot.com/pricing/sales', timeout_ms: 8000 };

  /* original demo timings: steps then loop restart (demo-original.js: b=[0,1500,2700,4300,5400,6700,8000], x=11500).
     Original error window is 2700->4300 (1600ms) — too short for a real mouse, so we hold/pause on error. */
  var STEP_AT = [1500, 2700, 4300, 5400, 6700, 8000];

  var ERROR_HOLD_MS = 10000;
  var CODE_CAP = 220;
  var CODE_MAX = 640;

  /* ================= helpers ================= */
  function fmtTime(ms, running) {
    if (!running && ms < 1000) return Math.max(1, Math.round(ms)) + 'ms';
    if (ms < 60000) return (Math.floor(ms / 100) / 10).toFixed(1) + 's';
    var total = Math.floor(ms / 1000);
    if (total < 3600) {
      var s = total % 60;
      return Math.floor(total / 60) + 'm ' + (s < 10 ? '0' + s : '' + s) + 's';
    }
    var h = Math.floor(total / 3600);
    if (h < 24) {
      var m = Math.floor(total / 60) % 60;
      return h + 'h ' + (m < 10 ? '0' + m : '' + m) + 'm';
    }
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  }

  function pretty(value) {
    if (typeof value === 'string') {
      var t = value.replace(/^\s+|\s+$/g, '');
      if (t.charAt(0) === '{' || t.charAt(0) === '[') {
        try { return { text: JSON.stringify(JSON.parse(t), null, 2), json: true }; } catch (e) { /* fall through */ }
      }
      return { text: value, json: false };
    }
    try {
      var j = JSON.stringify(value, null, 2);
      return (j === undefined) ? { text: String(value), json: false } : { text: j, json: true };
    } catch (e) {
      return { text: String(value), json: false };
    }
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.setAttribute('class', cls);
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      for (var k in attrs) {
        if (Object.prototype.hasOwnProperty.call(attrs, k)) n.setAttribute(k, attrs[k]);
      }
    }
    return n;
  }

  /* syntax highlight: keys / strings / numbers / literals */
  var TOK = /("(?:[^"\\]|\\.)*")(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;

      if (m[1] && m[2]) cls = 'tc-t-key';

        else pre.removeAttribute('data-scroll');

        pre.removeAttribute('data-scroll');

  function renderGroup() {
    var now = Date.now();

    /* accumulate=true: keep base across phases, freeze while idle */
    if (running && (group.clock.start === null || group.clock.start === undefined)) {
      group.clock.start = now;

      group.labelEl.setAttribute('class', running ? 'tc-group__label tc-shine' : 'tc-group__label');

      group.lastRunning = running;

      group.lastFailed = failed;
    }
    var t = '\u00B7 ' + fmtTime(groupElapsed(), running);
    if (group.lastTime !== t) {
      group.timeEl.textContent = t;
      group.lastTime = t;
    }
    var srText = running ? GROUP_RUN_LABEL
      : label + (failed > 0 ? ', ' + failed + ' failed' : '');
    if (group.sr.textContent !== srText) group.sr.textContent = srText;

    if (group.lastTotal !== total) {
      while (group.stackEl.firstElementChild) group.stackEl.removeChild(group.stackEl.firstElementChild);
      var from = Math.max(0, present.length - 3);
      for (var k = from; k < present.length; k++) {
        var tile = el('span', 'tc-icon');
        tile.appendChild(present[k].iconFn());
        group.stackEl.appendChild(tile);
      }
      group.lastTotal = total;
    }
    if (groupOpen) group.root.setAttribute('data-open', '');
    else group.root.removeAttribute('data-open');
    group.head.setAttribute('aria-expanded', groupOpen ? 'true' : 'false');
    if (groupOpen) group.body.removeAttribute('inert');
    else group.body.setAttribute('inert', '');
    var titleEl = group.head.querySelector ? group.head.querySelector('.tc-group__title') : null;
    if (titleEl) titleEl.setAttribute('data-state', running ? 'busy' : 'done');

    /* page header counts */
    var n = 0;
    for (var m = 0; m < present.length; m++) if (present[m].lastStatus === 'running') n++;
    header.working.textContent = n > 0 ? (n + ' working') : 'Idle';
    header.working.setAttribute('data-state', n > 0 ? 'working' : 'idle');
    header.tools.textContent = total === 1 ? '1 tool' : total + ' tools';
  }

  var DEFS = [
    { key: 'search', name: SEARCH_NAME, icon: iconSearch },
    { key: 'fetch', name: FETCH_NAME, icon: iconDoc },
    { key: 'deals', name: DEALS_NAME, icon: iconDb }
  ];

  function render() {
    /* add / remove / update cards in fixed order */
    for (var i = 0; i < DEFS.length; i++) {
      var def = DEFS[i];
      var st = cardState(def.key);
      var idx = -1;
      for (var j = 0; j < cards.length; j++) {
        if (cards[j].key === def.key) { idx = j; break; }
      }
      if (!st.present) {
        if (idx >= 0) {
          var gone = cards[idx];
          if (gone.root.parentNode) gone.root.parentNode.removeChild(gone.root);
          cards.splice(idx, 1);
        }
        continue;
      }
      var card = idx >= 0 ? cards[idx] : null;
      if (!card) {
        card = makeCard(def.key, def.name, def.icon);
        card.iconFn = def.icon;
        cards.push(card);
        cards.sort(function (a, b) {
          var order = { search: 0, fetch: 1, deals: 2 };
          return order[a.key] - order[b.key];
        });
      }
      card.iconFn = def.icon;
      updateCard(card, st);
    }
    /* attach in order */
    for (var k = 0; k < cards.length; k++) {
      if (cards[k].root.parentNode !== group.list) group.list.appendChild(cards[k].root);
    }
    renderGroup();
  }

  /* fast tick: only rewrites time text nodes, never rebuilds DOM */
  function tick() {
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      if (card.lastStatus === 'running') {
        paintTime(card, { status: 'running' });
      }
    }
    if (group && group.lastRunning) {
      var t = '\u00B7 ' + fmtTime(groupElapsed(), true);
      if (group.lastTime !== t) {
        group.timeEl.textContent = t;
        group.lastTime = t;
      }
    }
  }

  function clearTimers() {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
  }
  /* Pause on the error state: clear pending auto-advance timers and wait for
     Retry (or the fallback auto-recovery) so a real mouse can land on Retry. */
  function holdOnError() {
    if (errorHolding) return;
    errorHolding = true;
    clearTimers();
    timers.push(setTimeout(function () {
      resumeFromError(false);
    }, ERROR_HOLD_MS));
  }
  /* Retry (manual) or fallback (automatic) recovery: step 2 -> 3, then replay
     the remaining original gaps (1100/1300/1300/3700/7200ms) so the 11.5s loop
     choreography is preserved after the hold. */
  function resumeFromError(manual) {
    void manual;
    if (step !== 2 && !errorHolding) return;
    errorHolding = false;
    clearTimers();
    step = Math.max(step, 3);
    render();
    var gaps = [
      { to: 4, at: 1100 },   /* 5400-4300: fetch succeeds */
      { to: 5, at: 2400 },   /* 6700-4300: deals succeed */
      { to: 6, at: 3700 }    /* 8000-4300: done */
    ];
    for (var i = 0; i < gaps.length; i++) {
      (function (g) {
        timers.push(setTimeout(function () {
          if (g.to > step) { step = g.to; render(); }
          if (g.to === 6) holdCollapse();
        }, g.at));
      })(gaps[i]);
    }
    timers.push(setTimeout(function () {
      restartLoop();
    }, 7200));               /* 11500-4300: loop restarts */
  }
  function holdCollapse() {
    if (!userTouchedGroup) { groupOpen = false; renderGroup(); }
  }
  /* Fresh loop start (matches the original remount on generation change:
     clocks reset so the elapsed timer never runs past one loop). */
  function restartLoop() {
    step = 0;
    errorHolding = false;
    userTouchedGroup = false;
    groupOpen = true;
    if (group) { group.clock.base = 0; group.clock.start = null; group.lastTime = null; }
    render();
    schedule();
  }
  function schedule() {
    clearTimers();
    errorHolding = false;
    for (var i = 0; i < STEP_AT.length; i++) {
      (function (n) {
        timers.push(setTimeout(function () {
          if (n + 1 > step) {
            step = n + 1;
            render();
            if (step === 2) holdOnError();
          }
        }, STEP_AT[n]));
      })(i);
    }
    timers.push(setTimeout(function () {
      holdCollapse();
    }, STEP_AT[STEP_AT.length - 1]));
    timers.push(setTimeout(function () {
      restartLoop();
    }, LOOP_MS));
  }

  buildPage();
  render();
  schedule();
  setInterval(tick, 100);
})();
</script>
</body>
</html>
