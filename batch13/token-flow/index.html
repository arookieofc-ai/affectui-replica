*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

  font-size:14px; line-height:1.45; color:var(--ink); background:var(--page);

}
.page{max-width:880px;margin:0 auto;padding:40px 20px 64px}
.theme-toggle{
  position:fixed;top:14px;right:14px;z-index:50;
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  font:inherit;font-size:13px;box-shadow:var(--shadow);
  transition:box-shadow 150ms ease,transform 150ms ease;
}

.tfl{

.tfl-title{

}

.tfl-opt{

  font:inherit;font-size:12px;font-weight:500;line-height:26px;color:var(--muted);cursor:pointer;
  transition:background-color 160ms ease,color 160ms ease,box-shadow 160ms ease;
}
.tfl-opt:hover{color:var(--ink)}
.tfl-opt[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.05)}
.tfl-opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tfl-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.tfl-big{font-size:24px;font-weight:600;line-height:32px;letter-spacing:-.02em;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.tfl-unit{margin-left:-4px;font-size:12px;color:var(--muted)}
.tfl-other{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tfl-other::before{content:"";display:inline-block;width:1px;height:12px;margin-right:8px;background:var(--border);vertical-align:-1px}
.tfl-delta{
  align-self:center;height:22px;padding:0 9px;border-radius:999px;
  font-size:12px;font-weight:500;line-height:22px;white-space:nowrap;font-variant-numeric:tabular-nums;
  background:var(--good-bg);color:var(--good);

.tfl-delta[data-flat]{background:var(--subtle);color:var(--muted)}
.tfl-delta[data-warn]{background:var(--bad-bg);color:var(--bad)}

.tfl-mark{display:grid;flex:none;grid-template-columns:repeat(3,3px);grid-auto-rows:3px;gap:1.5px;place-content:center;width:16px;height:16px}
.tfl-mark i{border-radius:.75px;background:var(--mark,#0190fe);opacity:0}
.tfl-mark i[data-on]{opacity:1}

.tfl-scroll{min-width:0;overflow-x:auto;overflow-y:hidden;margin:0 -18px;padding:0 18px 4px;scrollbar-width:thin}
.tfl-chart{position:relative;width:760px;max-width:100%}
.tfl-svg{position:absolute;inset:0;display:block;overflow:visible}

}
.tfl-card{

.tfl-card-in{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
.tfl-card[data-dim] .tfl-card-in{opacity:.85}
.tfl-text{display:grid;flex:1 1 auto;min-width:0}
.tfl-name{min-width:0;overflow:hidden;font-size:13px;line-height:18px;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.tfl-card[data-col="1"] .tfl-name{font-weight:600}
.tfl-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;font-size:11px;line-height:16px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.tfl-sep{display:inline-block;width:1px;height:10px;margin:0 6px;background:var(--border);vertical-align:-1px}
.tfl-icon{display:grid;flex:none;place-items:center;width:18px;height:20px}
.tfl-glyph{display:block;width:16px;height:16px}
.tfl-doc{display:block;width:16px;height:20px;overflow:visible;filter:drop-shadow(0 .5px .5px rgba(0,0,0,.1))}
.tfl-logo{

  border-radius:4.5px;background:var(--surface);color:var(--muted);

}
.tfl-app:first-child{margin-left:0}
.tfl-app-more{margin-left:4px;font-size:11px;font-weight:500;color:var(--muted)}
.tfl-extra{display:flex;align-items:center;gap:8px;min-width:0;margin-top:5px}
.tfl-share{flex:1 1 auto;min-width:0;height:3px;overflow:hidden;border-radius:2px;background:var(--subtle)}
.tfl-share i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--muted));transition:width 500ms ease}
.tfl-split{display:flex;flex:1 1 auto;gap:1.5px;min-width:0;height:3px;overflow:hidden;border-radius:2px;background:var(--subtle)}
.tfl-split i{min-width:2px;opacity:.85;transition:flex-grow 500ms ease}
.tfl-per{flex:none;font-size:11px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.tfl-stack{display:grid;flex:1 1 auto;min-width:0;gap:0}
.tfl-tag{
  position:absolute;z-index:3;display:grid;max-width:260px;padding:7px 10px 8px;border-radius:8px;
  background:var(--tip);box-shadow:0 10px 24px -10px rgba(0,0,0,.4);

}
.tfl-tag[data-side="left"]{transform:translate(-100%,-50%)}
.tfl-tag-title{overflow:hidden;font-size:12px;font-weight:600;line-height:16px;color:var(--tip-ink);text-overflow:ellipsis}
.tfl-tag-meta{font-size:12px;line-height:16px;color:var(--tip-muted);font-variant-numeric:tabular-nums}
.tfl-tag-meta b{font-weight:600;color:var(--tip-ink)}
.tfl-detail{
  position:absolute;z-index:4;display:grid;gap:10px;overflow-y:auto;
  padding:0 12px 10px;border-radius:12px;background:var(--surface);color:var(--ink);
  border:1px solid var(--border);box-shadow:var(--lift);
}
.tfl-detail-head{display:flex;align-items:center;gap:8px;min-width:0;height:44px;margin:0 -12px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--subtle)}
.tfl-detail-title{min-width:0;overflow:hidden;font-size:13px;font-weight:600;line-height:20px;color:var(--ink-strong);white-space:nowrap;text-overflow:ellipsis}
.tfl-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0;padding:0}
.tfl-stats > div{padding:6px 8px;border-radius:8px;background:var(--subtle)}
.tfl-stats dt{font-size:10px;font-weight:600;line-height:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tfl-stats dd{margin:0;font-size:13px;font-weight:600;line-height:20px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.tfl-list{display:grid;gap:2px}
.tfl-list-title{font-size:10px;font-weight:500;line-height:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.tfl-list ul{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.tfl-list li{display:flex;align-items:center;gap:8px;min-width:0;height:24px;font-size:12px;line-height:16px}
.tfl-list-name{flex:1 1 auto;min-width:0;overflow:hidden;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.tfl-bar{flex:none;width:44px;height:4px;overflow:hidden;border-radius:2px;background:var(--subtle)}
.tfl-bar i{display:block;height:100%;border-radius:inherit}
.tfl-list-num{flex:none;min-width:42px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tfl-list-more{font-size:12px;line-height:16px;color:var(--muted)}
@media (max-width:640px){
  .page{padding:24px 12px 48px}
  .tfl-scroll{overflow:visible}
  .tfl-chart{width:auto}
  .tfl-svg,.tfl-cap,.tfl-wave,.tfl-tag{display:none}
  .tfl-card{position:static;width:auto !important;height:auto !important;min-height:44px;margin:0 0 8px;padding:8px 10px 8px 12px}
  .tfl-card-in{flex-wrap:wrap}
  .tfl-detail{position:static;width:auto !important;max-height:none;margin:4px 0 8px}
}
@media (prefers-reduced-motion:reduce){
  .tfl *,.tfl *::before,.tfl *::after{animation:none !important;transition:none !important}
}
</style>

    }
    if(on){ n.card.removeAttribute('data-dim'); }
    else { n.card.setAttribute('data-dim', ''); }
    if(sel && sel.type === 'node' && sel.key === n.key) n.card.setAttribute('data-on', '');
    else n.card.removeAttribute('data-on');
  });
}
function updateTag(){
  var sel = state.hover && !state.open ? state.hover : null;
  if(!sel || sel.type !== 'node'){ tag.setAttribute('hidden', ''); return; }
  var n = null, i;
  for(i = 0; i < nodes.length; i++){ if(nodes[i].key === sel.key) n = nodes[i]; }
  if(!n){ tag.setAttribute('hidden', ''); return; }
  var v = nodeVals(n), g = grandTotals();
  tag.removeAttribute('hidden');
  tagTitle.textContent = n.label;
  tagMeta.textContent = '';
  tagB1.textContent = fmtTok(v.tokens);
  tagB2.textContent = fmtCost(v.cost);
  tagMeta.appendChild(tagB1);
  tagMeta.appendChild(document.createTextNode(' tokens · '));
  tagMeta.appendChild(tagB2);
  tagMeta.appendChild(document.createTextNode(' · '+fmtPct(g.tokens > 0 ? v.tokens/g.tokens : 0)));
  var r = rects[n.key];
  var left = r.x + r.w + 10, side = 'right';
  if(r.x > CHW*0.6){ left = r.x - 10; side = 'left'; }
  tag.setAttribute('data-side', side);
  tag.style.left = left+'px';
  tag.style.top = Math.max(30, Math.min(chartH - 30, r.y + r.h/2))+'px';
}
/* ---------- detail dialog ---------- */
function toggleOpen(key){
  if(state.open === key){ state.open = null; closeDetail(); applyHighlight(); updateTag(); return; }
  state.open = key;
  openDetail(key);
  applyHighlight();
}
function openDetail(key){
  closeDetail();
  var n = null, i;
  for(i = 0; i < nodes.length; i++){ if(nodes[i].key === key) n = nodes[i]; }
  if(!n){ state.open = null; return; }
  detailKey = key;
  n.card.setAttribute('data-open', '');
  n.card.setAttribute('aria-expanded', 'true');
  var v = nodeVals(n), g = grandTotals();
  var isCost = state.unit === 'cost';
  var d = el('div', 'tfl-detail', null);
  d.setAttribute('role', 'dialog');
  d.setAttribute('aria-label', n.label+' details');
  var head = el('div', 'tfl-detail-head', null);
  head.appendChild(nodeIcon(n, false));
  var ht = el('span', 'tfl-detail-title', n.label);
  ht.setAttribute('dir', 'auto');
  head.appendChild(ht);
  d.appendChild(head);
  var stats = el('dl', 'tfl-stats', null);
  var rows = [
    ['Tokens', fmtTok(v.tokens)],
    ['Cost', fmtCost(v.cost)],
    ['Share', fmtPct((isCost ? g.cost : g.tokens) > 0 ? (isCost ? v.cost/g.cost : v.tokens/g.tokens) : 0)]
  ];
  if(n.col === 1) rows.push(['$ / 1K', fmtPerK(n.price || (v.tokens > 0 ? v.cost/v.tokens*1e6 : 0))]);
  rows.forEach(function(rw){
    var wrap = document.createElement('div');
    var dt = document.createElement('dt'); dt.textContent = rw[0];
    var dd = document.createElement('dd'); dd.textContent = rw[1];
    wrap.appendChild(dt); wrap.appendChild(dd);
    stats.appendChild(wrap);
  });
  d.appendChild(stats);
  var lists = [];
  if(n.col !== 0) lists.push({title:'From', rows:inTo[n.key].map(function(f){ return {n:f.a, t:f.dispTokens, c:f.dispCost}; })});
  if(n.col !== 2) lists.push({title:'To', rows:outOf[n.key].map(function(f){ return {n:f.b, t:f.dispTokens, c:f.dispCost}; })});
  lists.forEach(function(L){
    L.rows.sort(function(a,b){ return isCost ? b.c - a.c : b.t - a.t; });
    var box = el('div', 'tfl-list', null);
    box.appendChild(el('span', 'tfl-list-title', L.title));
    var ul = document.createElement('ul');
    var tot = 0, j;
    for(j = 0; j < L.rows.length; j++){ tot += isCost ? L.rows[j].c : L.rows[j].t; }
    L.rows.slice(0,3).forEach(function(rw){
      var val = isCost ? rw.c : rw.t;
      var li = document.createElement('li');
      li.style.setProperty('--c', rw.n.color);
      li.appendChild(nodeIcon(rw.n, false));
      var nm2 = el('span', 'tfl-list-name', rw.n.label);
      nm2.setAttribute('dir', 'auto');
      li.appendChild(nm2);
      var bar = el('span', 'tfl-bar', null);
      bar.setAttribute('aria-hidden', 'true');
      var fill = el('i', null, null);
      fill.style.width = Math.max(2, (tot > 0 ? val/tot : 0)*100)+'%';
      fill.style.background = rw.n.color;
      bar.appendChild(fill);
      li.appendChild(bar);
      li.appendChild(el('span', 'tfl-list-num', isCost ? fmtCost(val) : fmtTok(val)));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    if(L.rows.length > 3) box.appendChild(el('span', 'tfl-list-more', 'and '+(L.rows.length-3)+' more'));
    d.appendChild(box);
  });
  var r = rects[n.key];
  var wpx = Math.min(256, CHW - 16);
  var left = n.col === 0 ? r.x + r.w + 12 : n.col === 2 ? r.x - r.w - 12 - (wpx - r.w) : r.x + r.w + 12;
  if(n.col === 1 && left + wpx > CHW - 8) left = r.x - 12 - wpx;
  if(left < 4) left = 4;
  if(left + wpx > CHW - 4) left = CHW - 4 - wpx;
  var top = Math.max(4, Math.min(chartH - 60, r.y + r.h/2 - 60));
  d.style.left = Math.round(left)+'px';
  d.style.top = Math.round(top)+'px';
  d.style.width = wpx+'px';
  d.style.maxHeight = (chartH - 8)+'px';
  /* capture-phase guard so inner clicks survive */
  d.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); }, true);
  chart.appendChild(d);
  detail = d;
  state.hover = null;
  updateTag();
}
document.addEventListener('pointerdown', function(ev){
  if(!state.open || !detail) return;
  var t = ev.target;
  try{
    if(detail.contains(t)) return;
    var card = cardEls[state.open];
    if(card && (card === t || card.contains(t))) return;
  }catch(e){}
  state.open = null; closeDetail(); applyHighlight();
}, true);
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape' && state.open){
    state.open = null; closeDetail(); applyHighlight(); updateTag();
    ev.stopPropagation();
  }
});
/* ---------- keyboard nav ---------- */
function onCardKey(ev, n){
  var k = ev.key, target = null, i;
  function colList(c){ return order.filter(function(x){ return x.col === c; }); }
  if(k === 'ArrowDown' || k === 'ArrowUp'){
    var list = colList(n.col);
    var idx = list.indexOf(n) + (k === 'ArrowDown' ? 1 : -1);
    idx = Math.max(0, Math.min(list.length - 1, idx));
    target = list[idx];
  } else if(k === 'ArrowRight' || k === 'ArrowLeft'){
    var nc = Math.max(0, Math.min(2, n.col + (k === 'ArrowRight' ? 1 : -1)));
    var mine = rects[n.key].y, best = null, bd = 1e9;
    colList(nc).forEach(function(x){
      var d = Math.abs(rects[x.key].y - mine);
      if(d < bd){ bd = d; best = x; }
    });
    target = best;
  } else if(k === 'Home'){ target = order[0]; }
  else if(k === 'End'){ target = order[order.length - 1]; }
  else if(k === 'Enter' || k === ' '){ toggleOpen(n.key); markConsumed(n.key); ev.preventDefault(); return; }
  else return;
  ev.preventDefault();
  if(target && target.card && target.card.focus){ try{ target.card.focus(); }catch(e){} }
}
/* switch (unit toggle) */
function setUnit(u){
  if(state.unit === u) return;
  state.unit = u;
  var toTok = u === 'tokens';
  optTokens.setAttribute('aria-checked', toTok ? 'true' : 'false');
  optTokens.tabIndex = toTok ? 0 : -1;
  optCost.setAttribute('aria-checked', toTok ? 'false' : 'true');
  optCost.tabIndex = toTok ? -1 : 0;
  /* animate mix toward target; rAF where available, snap fallback */
  var from = state.mix, to = toTok ? 0 : 1, t0 = 0;
  try{ t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0; }catch(e){}
  function snap(){ state.mix = to; render(); }
  if(typeof requestAnimationFrame === 'undefined'){ snap(); return; }
  var tEnd = null;
  try{ tEnd = (typeof performance !== 'undefined' && performance.now) ? performance.now() + 350 : 0; }catch(e){ snap(); return; }
  function frame(now){
    var p = tEnd > t0 ? Math.min(1, Math.max(0, (now - t0)/(tEnd - t0))) : 1;
    state.mix = from + (to - from)*p;
    render();
    if(p < 1){ requestAnimationFrame(frame); }
  }
  try{ requestAnimationFrame(frame); }catch(e){ snap(); return; }
  setTimeout(function(){
    if((to === 1 && state.mix < 1) || (to === 0 && state.mix > 0)){ state.mix = to; render(); }
  }, 500);
  if(state.open) openDetail(state.open);
}
optTokens.addEventListener('click', function(){ setUnit('tokens'); });
optCost.addEventListener('click', function(){ setUnit('cost'); });
[optTokens, optCost].forEach(function(b){
  b.addEventListener('keydown', function(ev){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(ev.key) < 0) return;
    ev.preventDefault();
    var next = b === optTokens ? 'cost' : 'tokens';
    setUnit(next);
    var nb = next === 'cost' ? optCost : optTokens;
    try{ if(nb.focus) nb.focus(); }catch(e){}
  });
});
/* ---------- streaming loop ---------- */
function targetsFor(step){
  var p = step/STEPS, out = {}, i;
  for(i = 0; i < flows.length; i++){
    var f = flows[i];
    var q = clamp01((p - f.from0)/Math.max(1e-9, f.to0 - f.from0));
    var e2 = 1 - Math.pow(1 - q, 2);
    var tok = Math.round(f.tokens*e2);
    out[f.key] = {tokens:tok, cost:tok*(f.a.col === 1 ? f.a.price : f.b.price)/1e6};
  }
  return out;
}
function bandPath(f){
  var r0 = rects[f.a.key], r1 = rects[f.b.key];
  var x0 = r0.x + r0.w - 8, x1 = r1.x + 8;
  var dx = Math.max(20, (x1 - x0)*0.5);
  var w = Math.max(0.6, f.w);
  return 'M'+x0+' '+f.y0+
    'C'+(x0+dx)+' '+f.y0+' '+(x1-dx)+' '+f.y1+' '+x1+' '+f.y1+
    'L'+x1+' '+(f.y1+w)+
    'C'+(x1-dx)+' '+(f.y1+w)+' '+(x0+dx)+' '+(f.y0+w)+' '+x0+' '+(f.y0+w)+'Z';
}
function render(){
  var isCost = state.unit === 'cost';
  var mix = state.mix;
  var i, f;
  for(i = 0; i < flows.length; i++){
    f = flows[i];
    var wn = f.dispTokens/MAX_TOK, wc = f.dispCost/MAX_COST;
    var v = wn*(1-mix) + wc*mix;
    f.w = Math.max(0.4, v*22);
    if(f.dispTokens <= 0 && f.dispCost <= 0){ f.path.setAttribute('d', 'M0 0'); }
    else { f.path.setAttribute('d', bandPath(f)); }
  }
  var g = grandTotals();
  if(isCost){
    bigEl.textContent = fmtCost(g.cost);
    unitEl.textContent = 'spent';
    otherEl.textContent = fmtShort(g.tokens)+' '+(Math.round(g.tokens) === 1 ? 'token' : 'tokens');
  } else {
    bigEl.textContent = fmtShort(g.tokens);
    unitEl.textContent = Math.round(g.tokens) === 1 ? 'token' : 'tokens';
    otherEl.textContent = fmtCost(g.cost);
  }
  /* per-card numbers (text + attributes only) */
  nodes.forEach(function(n){
    var v = nodeVals(n);
    var main = isCost ? fmtCost(v.cost) : fmtTok(v.tokens);
    n.metaMain.textContent = main;
    if(n.sharePer){
      var share = (isCost ? g.cost : g.tokens) > 0 ? (isCost ? v.cost/g.cost : v.tokens/g.tokens) : 0;
      n.sharePer.textContent = fmtPct(share)+' of all';
      n.shareFill.style.width = Math.min(100, Math.max(0, share*100))+'%';
    }
    if(n.splitFills){
      var tot = 0, j;
      for(j = 0; j < n.splitFills.length; j++){ tot += isCost ? n.splitFills[j].flow.dispCost : n.splitFills[j].flow.dispTokens; }
      n.splitFills.forEach(function(s){
        var val = isCost ? s.flow.dispCost : s.flow.dispTokens;
        s.seg.style.flexGrow = String(tot > 0 ? Math.max(0.02, val/tot) : 1);
      });
      n.perK.textContent = fmtPerK(n.price || (v.tokens > 0 ? v.cost/v.tokens*1e6 : 0))+' / 1K';
    }
    n.card.setAttribute('aria-label', describeNode(n));
    n.card.setAttribute('title', n.label);
  });
  /* delta pill */
  var showPrev = isCost ? PREV.cost : PREV.tokens;
  var cur = isCost ? g.cost : g.tokens;
  deltaEl.removeAttribute('hidden');
  if(state.streaming && showPrev > 0){
    deltaEl.removeAttribute('data-warn');
    deltaEl.setAttribute('data-flat', '');
    deltaEl.textContent = 'Last run '+(isCost ? fmtCost(showPrev) : fmtTok(showPrev));
  } else if(!state.streaming && showPrev > 0){
    var d = (cur - showPrev)/showPrev;
    if(Math.abs(d) <= 0.005){
      deltaEl.removeAttribute('data-warn');
      deltaEl.setAttribute('data-flat', '');
      deltaEl.textContent = 'Same as last run';
    } else {
      deltaEl.removeAttribute('data-flat');
      var pct = Math.min(999, Math.round(Math.abs(d)*100));
      var sign = d > 0 ? '+' : '−';
      deltaEl.textContent = sign+pct+'% vs last run';
      if(d > 0.005) deltaEl.setAttribute('data-warn', '');
      else deltaEl.removeAttribute('data-warn');
    }
  } else {
    deltaEl.setAttribute('hidden', '');
  }
  chart.setAttribute('data-streaming', state.streaming ? '1' : '0');
  if(state.open) updateTag();
  else if(state.hover) updateTag();
}
function applyTargets(step){
  var t = targetsFor(step), i;
  for(i = 0; i < flows.length; i++){
    var f = flows[i];
    f.dispTokens = t[f.key].tokens;
    f.dispCost = t[f.key].cost;
  }
}
var timerId = 0;
function clearTimer(){ if(timerId){ try{ clearTimeout(timerId); }catch(e){} timerId = 0; } }
function schedule(ms){ clearTimer(); timerId = setTimeout(onTick, ms); }
function onTick(){
  timerId = 0;
  if(state.streaming){
    if(state.step < STEPS){
      state.step += 1;
      applyTargets(state.step);
      if(state.step >= STEPS){
        state.streaming = false;
        render();
        schedule(HOLD_MS);
        return;
      }
      render();
      schedule(STEP_MS);
      return;
    }
  } else {
    /* hold finished: fade, then restart loop */
    state.fading = true;
    try{ root.setAttribute('data-fading', ''); }catch(e){}
    render();
    timerId = setTimeout(function(){
      timerId = 0;
      state.fading = false;
      try{ root.removeAttribute('data-fading'); }catch(e){}
      state.step = 0;
      state.streaming = true;
      applyTargets(0);
      render();
      schedule(STEP_MS);
    }, 600);
    return;
  }
}
/* init */
applyTargets(0);
render();
try{
  var hm = document.getElementById('tflHeadMark');
  if(hm){ hm.appendChild(mark(AGENT_CELLS, true, '#0190fe')); }
}catch(e){}
if(reduced){
  state.step = STEPS;
  state.streaming = false;
  applyTargets(STEPS);
  render();
} else {
  schedule(FIRST_MS);
}
/* theme toggle */
var themeBtn = document.getElementById('themeToggle');
function paintThemeBtn(){
  var dark = false;
  try{ dark = document.documentElement.getAttribute('data-theme') === 'dark'; }catch(e){}
  try{
    themeBtn.textContent = dark ? '☀ Light' : '☾ Dark';
    themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }catch(e){}
}
if(themeBtn){
  themeBtn.addEventListener('click', function(){
    var cur = 'light';
    try{ cur = document.documentElement.getAttribute('data-theme') || 'light'; }catch(e){}
    var next = cur === 'dark' ? 'light' : 'dark';
    try{ document.documentElement.setAttribute('data-theme', next); }catch(e){}
    try{ if(window.localStorage) window.localStorage.setItem('tfl-theme', next); }catch(e){}
    paintThemeBtn();
  });
  paintThemeBtn();
}
/* test hooks */
try{
  window.__tfl = {
    state:state, flows:flows, nodes:nodes,
    fmt:{tok:fmtTok, short:fmtShort, cost:fmtCost, perK:fmtPerK, pct:fmtPct},
    setUnit:setUnit, toggleOpen:toggleOpen, setHover:setHover,
    targetsFor:targetsFor, nodeVals:nodeVals, grandTotals:grandTotals,
    tick:onTick, render:render
  };
}catch(e){}
/* default theme: original demo appearance is light; honour saved + system prefs */
try{
  var saved = null;
  if(window.localStorage) saved = window.localStorage.getItem('tfl-theme');
  var sysDark = false;
  try{ sysDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }catch(e2){}
  document.documentElement.setAttribute('data-theme', saved === 'dark' || saved === 'light' ? saved : (sysDark ? 'dark' : 'light'));
  paintThemeBtn();
}catch(e){}
})();
</script>
