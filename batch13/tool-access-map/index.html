.ui-tam__body {

}

}

.ui-tam__tool-name {

.ui-tam__panel {

.ui-tam__panel-head { display: flex; flex: none; align-items: center; gap: 8px; min-width: 0; height: 36px; }
.ui-tam__back {

}
@media (hover: hover) and (pointer: fine) {

.ui-tam__calls {
  display: grid; grid-template-columns: minmax(0,1fr); align-content: start; gap: 2px;

.ui-tam__call {

.ui-tam__call-text {

.ui-tam__code {
  flex: 0 1 auto; min-height: 34px; max-height: 40%; margin: 0; padding: 8px 10px; overflow: auto;

.ui-tam__actions { display: flex; flex: none; align-items: center; justify-content: flex-end; gap: 6px; margin-top: auto; padding-top: 4px; }
.ui-tam__invalid { margin-right: auto; font-size: 12px; color: var(--fail-fg); }
.ui-tam__btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--ink);
  transition: background-color 160ms ease, transform 160ms ease, opacity 160ms ease;

.ui-tam__btn:active:not(:disabled) { transform: scale(.97); }
.ui-tam__empty { margin: 0; padding: 28px 16px; text-align: center; color: var(--muted); }
/* narrow / responsive */
@media (max-width: 560px) {
  .ui-tam__map { position: relative; display: grid; gap: 10px; padding: 8px 0 2px; }
  .ui-tam__lines { display: none; }

@media (prefers-reduced-motion: reduce) {

<script>
(function () {
"use strict";
/* ================= helpers (pure) ================= */
function pad2(n) { return String(n).padStart(2, "0"); }
function fmtElapsed(ms) { // m()
  var t = Math.max(0, Math.round(ms / 1000));
  if (t >= 3600) return Math.floor(t / 3600) + ":" + pad2(Math.floor(t % 3600 / 60)) + ":" + pad2(t % 60);
  return Math.floor(t / 60) + ":" + pad2(t % 60);
}
function fmtDur(ms) { // m()
  if (ms === undefined || ms === null) return "";
  if (ms < 1000) return Math.max(0, Math.round(ms)) + "ms";
  if (ms < 10000) return (ms / 1000).toFixed(1) + "s";
  var s = Math.round(ms / 1000);
  if (s < 60) return s + "s";
  return Math.floor(s / 60) + "m " + pad2(s % 60) + "s";

      + (ui.editing === null

      + (sel.duration !== undefined ? '<span class="ui-tam__label-meta" data-dur="' + sel.at + ":" + sel.duration + '">' + fmtDur(sel.duration) + "</span>" : "")

      + '<div class="ui-tam__actions">'

      + '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.6 3.6A4 4 0 1 1 2 6.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M2.2 1.6v2.4h2.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'

  var empty = calls.length === 0

  return '<section class="ui-tam__panel" aria-label="Calls to ' + esc(row.tool.name) + '">'
    + '<div class="ui-tam__panel-head"><button type="button" class="ui-tam__back" data-act="back" aria-label="Back to the map">'
    + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6C15 6 9 10.4 9 12c0 1.6 6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
    + tileHtml(row.tool, 16)
    + '<span class="ui-tam__panel-name" dir="auto">' + esc(row.tool.name) + "</span>"
    + '<span class="ui-tam__panel-desc" dir="auto" title="' + esc(row.tool.desc) + '">' + esc(row.tool.desc) + "</span>"

}
function timeAttr(c) {
  if (c.status === "running" || c.duration === undefined) return "";
  return ' data-dur="' + c.at + ":" + c.duration + '"';
}
/* per-tick clock text refresh without rebuilding the DOM */
function updateClockTexts() {
  if (!root || !root.querySelectorAll) return;
  var now = BASE + sim.tick * CLOCK_STEP;
  var els = root.querySelectorAll("[data-dur]");
  for (var i = 0; i < els.length; i++) {
    (function (el) {
      var parts = el.getAttribute("data-dur").split(":");
      var at = parseFloat(parts[0]), dur = parseFloat(parts[1]);
      var call = findCallByAt(at, dur);
      if (call && call.status === "running") { el.textContent = "\u2026"; return; }
      void now;
      el.textContent = fmtDur(dur);
    })(els[i]);
  }
}
function findCallByAt() { return null; }

/* ================= events (no hover/focus re-render; open on pointerdown capture) ================= */
function wireUp() {
  if (!root || !root.querySelectorAll) return;
  var tabs = root.querySelectorAll("[data-agent]");
  for (var i = 0; i < tabs.length; i++) {
    (function (el) {
      el.addEventListener("click", function () { selectAgent(el.getAttribute("data-agent")); });
      el.addEventListener("keydown", function (ev) {
        var ids = AGENTS.map(function (a) { return a.id; });
        var idx = ids.indexOf(el.getAttribute("data-agent"));
        var j = ev.key === "ArrowRight" ? idx + 1 : ev.key === "ArrowLeft" ? idx - 1
          : ev.key === "Home" ? 0 : ev.key === "End" ? ids.length - 1 : -1;
        if (j >= 0 && j < ids.length) {
          ev.preventDefault(); selectAgent(ids[j]);

  }
  var tools = root.querySelectorAll("[data-tool]");
  for (var t = 0; t < tools.length; t++) {
    (function (el) {
      if (el.getAttribute("data-state") === "blocked") return;
      var open = function () { openTool(el.getAttribute("data-tool")); };
      el.addEventListener("pointerdown", open, true); /* capture so the real click survives */
      el.addEventListener("click", open);
    })(tools[t]);
  }
  var backs = root.querySelectorAll('[data-act="back"]');
  for (var b = 0; b < backs.length; b++) backs[b].addEventListener("click", closePanel);
  var calls = root.querySelectorAll("[data-call]");
  for (var c = 0; c < calls.length; c++) {
    (function (el) {
      el.addEventListener("click", function () { ui.selCall = el.getAttribute("data-call"); ui.editing = null; render(); });
    })(calls[c]);
  }
  var edits = root.querySelectorAll('[data-act="edit"]');
  for (var e = 0; e < edits.length; e++) edits[e].addEventListener("click", function () {
    var row = currentOpenRow(); if (!row) return;
    var sel = selectedCall(row); if (!sel) return;
    ui.editing = stringify(sel.input); render();
    var ta = root.querySelector(".ui-tam__edit"); if (ta && ta.focus) ta.focus();
  });
  var cancels = root.querySelectorAll('[data-act="cancel"]');
  for (var x = 0; x < cancels.length; x++) cancels[x].addEventListener("click", function () { ui.editing = null; render(); });
  var replays = root.querySelectorAll('[data-act="replay"]');
  for (var r = 0; r < replays.length; r++) replays[r].addEventListener("click", doReplay);
  var panel = root.querySelector(".ui-tam__panel");
  if (panel) panel.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { ev.preventDefault(); closePanel(); }
  });

  if (edit) {
    edit.addEventListener("input", function () { ui.editing = edit.value; renderKeepFocus(); });
    edit.addEventListener("keydown", function (ev) {
      if ((ev.key === "Enter" && (ev.metaKey || ev.ctrlKey))) { ev.preventDefault(); doReplay(); }
      if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); ui.editing = null; render(); }
    });
  }
}
function renderKeepFocus() {
  var v = ui.editing;
  render();
  var ta = root.querySelector(".ui-tam__edit");
  if (ta) { if (ta.focus) ta.focus(); try { ta.value = v; ta.selectionStart = ta.selectionEnd = v.length; } catch (e) {} }
}
function selectAgent(id) {
  if (id === ui.agent) return;
  ui.agent = id; ui.openTool = null; ui.selCall = null; ui.editing = null;
  render();
}
function openTool(id) {
  if (ui.openTool === id) return;
  ui.openTool = id; ui.selCall = null; ui.editing = null;
  render();
  var back = root.querySelector(".ui-tam__back");
  if (back && back.focus) back.focus();
}
function closePanel() {
  ui.openTool = null; ui.selCall = null; ui.editing = null;
  render();
}
function currentOpenRow() {
  if (!ui.openTool) return null;
  var rt = agentRuntime(agentDef(ui.agent));
  var rows = toolRows(rt);
  for (var i = 0; i < rows.length; i++) if (rows[i].tool.id === ui.openTool) return rows[i];
  return null;
}
function selectedCall(row) {
  var calls = row.calls.slice().reverse();
  for (var i = 0; i < calls.length; i++) if (calls[i].id === ui.selCall) return calls[i];
  return calls[0] || null;
}
function doReplay() {
  var row = currentOpenRow(); if (!row) return;
  var sel = selectedCall(row); if (!sel || sel.status === "running") return;
  var input;
  if (ui.editing === null) { input = sel.input; }
  else if (typeof sel.input === "string") { input = ui.editing; }
  else { try { input = JSON.parse(ui.editing); } catch (e) { return; } }
  var def = agentDef(ui.agent);
  sim.n++;
  if (!sim.calls[def.id]) sim.calls[def.id] = {};
  if (!sim.calls[def.id][row.tool.id]) sim.calls[def.id][row.tool.id] = [];
  sim.calls[def.id][row.tool.id].push({ id: "r" + sim.n, status: "running",
    input: input, output: sel.output === undefined ? { ok: true } : sel.output,
    at: BASE + sim.tick * CLOCK_STEP, left: 2, replay: true });
  ui.editing = null; ui.selCall = null;
  render();

/* ================= boot + loop ================= */
function measure() {
  var stage = root.querySelector(".ui-tam__stage");
  var w = 0;
  if (stage && stage.clientWidth) w = stage.clientWidth;
  else if (root.clientWidth) w = root.clientWidth - 12;
  ui.mapW = w > 0 ? w : 680;
}
function boot() {

  render();
  setInterval(function () {
    step();
    var rt = agentRuntime(agentDef(ui.agent));
    var rows = toolRows(rt);
    var liveW = rows.filter(function (r) { return r.state === "running"; }).length;
    if (liveW > 0) ui.lastLive = liveW;
    var sig = structuralSig(rt, rows, liveW);

}
/* test hooks */
var api = {
  fmtElapsed: fmtElapsed, fmtDur: fmtDur, plural: plural, summarizeInput: summarizeInput,
  stringify: stringify, toolState: toolState, freshSim: freshSim, step: step,
  agentRuntime: agentRuntime, toolRows: toolRows, pixelMark: pixelMark,
  get sim() { return sim; }, set sim(v) { sim = v; },
  get ui() { return ui; }, render: render, layout: layout,

})();
</script>
<script>
(function () {
"use strict";
var rootEl = document.documentElement;
var btn = document.getElementById("themeToggle");
var label = document.getElementById("themeLabel");
var moon = document.getElementById("themeIconMoon");
var sun = document.getElementById("themeIconSun");
function apply(theme) {
  rootEl.setAttribute("data-theme", theme);
  try { localStorage.setItem("tam-theme", theme); } catch (e) {}
  var dark = theme === "dark";
  label.textContent = dark ? "Light" : "Dark";
  moon.hidden = dark;
  sun.hidden = !dark;
  btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}
var start = "light"; /* default = the original demo's appearance (light) */
try {
  var saved = localStorage.getItem("tam-theme");
  if (saved === "light" || saved === "dark") start = saved;
} catch (e) {}
apply(start);
btn.addEventListener("click", function () {
  apply(rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
})();
</script>
