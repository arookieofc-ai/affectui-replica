<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Monitor — affectUI replica</title>
<style>
/* ============ DESIGN TOKENS (only hex colours live here) ============ */
:root{
  --page:#fafaf9;
  --surface:#ffffff;
  --ink:#1c1917;
  --ink-strong:#171717;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --lane:#f5f5f4;
  --border:#e7e5e4;
  --radius-lg:16px;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --shadow-pop:0 0 0 1px var(--border), 0 12px 24px -8px rgba(0,0,0,.16), 0 4px 8px -4px rgba(0,0,0,.06);
  --working:#1d4ed8;
  --working-bg:#dbeafe;
  --waiting:#f59e0b;
  --waiting-bg:#fef3c7;
  --waiting-ink:#92400e;
  --idle:#78716c;
  --idle-bg:#f5f5f4;
  --failed:#dc2626;
  --failed-bg:#fee2e2;
  --failed-ink:#991b1b;
  --success:#15803d;
  --success-bg:#dcfce7;
  --focus:rgba(37,99,235,.55);
  --seg:#e7e5e4;
  --seg-hot:#a8a29e;
  --px1:#2563eb;
  --px2:#0d9488;
  --px3:#7c3aed;
  --code-bg:#f5f5f4;
}
html[data-theme="dark"]{
  --page:#101012;
  --surface:#1c1c1f;
  --ink:#ededed;
  --ink-strong:#fafafa;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --lane:#26262a;
  --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-pop:0 0 0 1px var(--border), 0 16px 32px -8px rgba(0,0,0,.6);
  --working:#7cb3ff;
  --working-bg:rgba(124,179,255,.14);
  --waiting:#fbbf24;
  --waiting-bg:#451a03;
  --waiting-ink:#fde68a;
  --idle:#a1a1aa;
  --idle-bg:#26262a;
  --failed:#f87171;
  --failed-bg:rgba(248,113,113,.13);
  --failed-ink:#fecaca;
  --success:#4ade80;
  --success-bg:rgba(74,222,128,.13);
  --focus:rgba(124,179,255,.7);
  --seg:#2e2e33;
  --seg-hot:#71717a;
  --px1:#7cb3ff;
  --px2:#2dd4bf;
  --px3:#c4b5fd;
  --code-bg:#26262a;
}
/* ============ base (no hex below this line) ============ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:20px;
  -webkit-font-smoothing:antialiased;
  transition:background-color 200ms ease,color 200ms ease;
}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 6px}
.proj{font-size:15px;font-weight:650;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sub{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--subtle);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--working)}
.pill.live{color:var(--working);border-color:transparent;background:var(--working-bg)}
.theme-btn{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:transform 150ms ease,background-color 150ms ease}
.theme-btn:hover{background:var(--subtle)}
.theme-btn:active{transform:scale(.94)}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-btn svg{width:18px;height:18px}
.col-head{height:28px;display:flex;align-items:flex-end;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:14px 14px 12px;transition:transform 180ms ease,box-shadow 180ms ease,background-color 200ms ease;position:relative}
.card:hover{transform:translateY(-1px)}
.card:focus-within{box-shadow:var(--shadow-pop)}
.top{display:flex;align-items:center;gap:10px;min-width:0}
.pxmark{flex:none;display:grid;grid-template-columns:repeat(3,7px);grid-template-rows:repeat(3,7px);gap:2px;padding:5px;border-radius:9px;background:var(--subtle);border:1px solid var(--border)}
.pxmark i{width:7px;height:7px;border-radius:2px;background:var(--border)}
.pxmark i.on-a{background:var(--px1)}
.pxmark i.on-b{background:var(--px2)}
.pxmark i.on-c{background:var(--px3)}
.card[data-status="running"] .pxmark i.lit{animation:tw 1.6s ease-in-out infinite}
.card[data-status="running"] .pxmark i.lit:nth-child(2n){animation-delay:.35s}
.card[data-status="running"] .pxmark i.lit:nth-child(3n){animation-delay:.7s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
.who{flex:1;min-width:0;display:grid;gap:1px}
.name{font-size:15px;font-weight:650;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost{flex:none;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.state{flex:none;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--idle-bg);color:var(--idle)}
.state .sdot{width:6px;height:6px;border-radius:50%;background:currentColor;position:relative}
.card[data-status="running"] .state{background:var(--working-bg);color:var(--working)}
.card[data-status="waiting"] .state{background:var(--waiting-bg);color:var(--waiting)}
.card[data-status="finished"] .state{background:var(--success-bg);color:var(--success)}
.card[data-status="failed"] .state{background:var(--failed-bg);color:var(--failed)}
.card[data-status="cancelled"] .state{background:var(--idle-bg);color:var(--idle)}
.card[data-status="running"] .state .sdot::after,.card[data-status="waiting"] .state .sdot::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:currentColor;opacity:.5;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.7}100%{transform:scale(1.5);opacity:0}}
/* current task well */
.well{display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;margin-top:12px;padding:8px 12px 8px 8px;border-radius:12px;background:var(--lane);font-size:13px;transition:background-color 200ms ease}
.well[data-status="waiting"]{background:var(--waiting-bg)}
.tile{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.tile svg{width:14px;height:14px}
.task{flex:1;min-width:0;overflow:hidden;font-weight:550;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.card[data-status="running"] .task.shine{background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 38%,var(--muted) 50%,var(--ink) 62%,var(--ink) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.5s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
.task-quiet{font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{flex:0 1 auto;min-width:0;overflow:hidden;padding:0 7px;border-radius:var(--radius-sm);background:var(--code-bg);border:1px solid var(--border);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;line-height:22px;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
/* strip: thin segmented progress */
.strip{display:flex;gap:3px;height:3px;margin:10px 0 4px}
.strip button{flex:1 1 0;min-width:4px;height:100%;border:0;border-radius:999px;background:var(--seg);cursor:pointer;padding:0;transition:background-color 200ms ease,opacity 200ms ease}
.strip button[data-state="running"]{background:var(--working)}
.strip button[data-state="done"]{background:var(--success)}
.strip button[data-state="failed"]{background:var(--failed)}
.strip button[data-state="waiting"]{background:var(--waiting);animation:tw 1.6s ease-in-out infinite}
.strip button[data-hot]{background:var(--seg-hot)}
.card[data-pointing] .strip button:not([data-hot]),.card[data-pointing] .steprow:not([data-hot]){opacity:.75}
/* tools row: small circular icons */
.toolsrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.tools-label{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px}
.tool{position:relative;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:default}
.tool svg{width:13px;height:13px}
.tool[data-live="run"]{color:var(--working);border-color:transparent;background:var(--working-bg)}
.tool[data-live="ask"]{color:var(--waiting);border-color:transparent;background:var(--waiting-bg)}
.tool .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);display:none;background:var(--ink-strong);color:var(--page);font-size:11.5px;line-height:15px;padding:5px 8px;border-radius:8px;white-space:nowrap;z-index:5}
.tool:hover .tip,.tool:focus-visible .tip{display:block}
/* steps */
.steps{list-style:none;margin:6px -6px 0;padding:0 0 8px;display:grid;max-height:220px;overflow-y:auto}
.steprow{position:relative;display:flex;align-items:center;gap:10px;min-height:30px;padding:4px 8px;border-radius:9px;font-size:13px;transition:background-color 160ms ease,opacity 200ms ease}
.steprow:hover,.steprow[data-hot]{background:var(--lane)}
.step-hit{position:absolute;inset:0;border-radius:inherit;background:transparent;border:0;cursor:pointer;width:100%}
.step-hit:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.step-ic{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--muted);position:relative;pointer-events:none}
.step-ic svg{width:11px;height:11px}
.step-label{flex:1;min-width:0;overflow:hidden;color:var(--ink);white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.steprow[data-state="failed"] .step-label{color:var(--failed)}
.step-time{flex:none;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);pointer-events:none}
/* details popover */
.info{position:absolute;z-index:3;right:12px;left:12px;top:120px;display:grid;gap:10px;padding:12px;border-radius:calc(var(--radius-lg) - 2px);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-pop)}
.info[hidden]{display:none}
.info-head{display:flex;align-items:center;gap:10px;min-width:0}
.info-title{flex:1;min-width:0;display:grid}
.info-label{overflow:hidden;font-weight:650;line-height:18px;color:var(--ink-strong);white-space:nowrap;text-overflow:ellipsis}
.info-sub{font-size:12px;line-height:16px;color:var(--muted)}
.info-close{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.info-close:hover{background:var(--lane);color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0}
.facts>div{display:grid;gap:1px;padding:6px 8px;border-radius:9px;background:var(--lane)}
.facts dt{font-size:11px;color:var(--muted)}
.facts dd{margin:0;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.facts dd[data-state="failed"]{color:var(--failed)}
.facts dd[data-state="running"]{color:var(--working)}
.info-detail{margin:0;font-size:13px;line-height:19px;color:var(--ink)}
.info-output{display:block;overflow:hidden;padding:6px 9px;border-radius:8px;background:var(--lane);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
/* foot */
.foot{display:flex;align-items:center;gap:8px;min-height:46px;padding:10px 2px 4px;flex-wrap:wrap}
.group{display:inline-flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background-color 160ms ease,transform 160ms ease}
.btn:hover{background:var(--lane)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn-go{background:var(--ink-strong);color:var(--page);border-color:transparent}
.btn-go:hover{opacity:.86;background:var(--ink-strong)}
.btn kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;background:var(--lane);border:1px solid var(--border);font-size:11px;font-family:inherit}
.btn-go kbd{background:transparent;border-color:currentColor}
.where{flex:1;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:60px}
.clock{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.outcome{font-size:12.5px;color:var(--muted)}
.outcome strong{color:var(--success);font-weight:650}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:480px){
  .wrap{padding:14px 10px 40px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cost{display:none}
  .foot{gap:6px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div style="min-width:0">
      <div class="proj">web-app v3.2</div>
      <div class="proj-sub">
        <span class="pill"><span class="dot" aria-hidden="true"></span><span id="workPill">1 working</span></span>

    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode" title="Toggle theme">
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4 6.5 6.5 0 1 0 20 13.5z"/></svg>
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>

  <div class="col-head" aria-hidden="true">Agents</div>

        <span class="pxmark" id="pxmark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="who">
          <span class="name" id="agentName">Claude Opus 5.5</span>
          <span class="role" id="agentRole">Release agent · web-app v3.2</span>

        <span class="cost" id="cost" aria-label="Cost so far">&lt;$0.001</span>

      <div class="well" id="well" data-status="running">

      </div>

      <div class="strip" id="strip" role="list" aria-label="Step progress"></div>

      <div class="toolsrow">
        <span class="tools-label">Tools</span>
        <span class="tools" id="tools"></span>
        <span class="clock" id="clock" style="margin-left:auto">0:00</span>
      </div>

      <ol class="steps" id="steps" aria-label="Steps"></ol>

      <div class="info" id="info" role="dialog" aria-label="Step details" hidden>
        <div class="info-head">
          <span class="tile" id="infoIcon" aria-hidden="true"></span>
          <span class="info-title">
            <span class="info-label" id="infoLabel"></span>
            <span class="info-sub" id="infoSub"></span>
          </span>
          <button class="info-close" id="infoClose" type="button" aria-label="Close">✕</button>
        </div>
        <dl class="facts">
          <div><dt>Started</dt><dd id="fStarted">+0:00</dd></div>
          <div><dt>Took</dt><dd id="fTook">–</dd></div>
          <div><dt>Share</dt><dd id="fShare">–</dd></div>
          <div><dt>State</dt><dd id="fState">–</dd></div>
        </dl>
        <p class="info-detail" id="infoDetail"></p>
        <code class="info-output" id="infoOutput"></code>
      </div>

      <div class="foot">
        <span class="group" id="controls"></span>
        <span class="where" id="where"></span>
        <span class="outcome" id="outcome" hidden></span>
      </div>
      <span class="sr" aria-live="polite" id="live"></span>
    </article>
  </main>
</div>

var STATUS_LABEL={idle:"Idle",running:"Running",waiting:"Needs you",paused:"Paused",finished:"Finished",failed:"Failed",cancelled:"Cancelled"};

/* own tiny icons (clean-room, stroke style) */

 read:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 1.8h5.2L12 4.5v9.7H4z"/><path d="M9 1.8v3h3M6.2 8h3.6M6.2 10.5h3.6"/></svg>',

/* deterministic 3x3 pixel-mark from agent id */
function pixelmark(seed){
  var cells=document.getElementById("pxmark").children;
  var h=0,i;
  for(i=0;i<seed.length;i++){h=((h*31)+seed.charCodeAt(i))>>>0;}
  for(i=0;i<9&&i<cells.length;i++){
    var v=(h>>(i*2))%5;
    if(!cells[i])continue;
    if(v<3){cells[i].className="on-"+["a","b","c"][v]+(v!==2||i%2===0?" lit":"");}
    else{cells[i].className="";}
  }
}

    controlsEl.appendChild(mkBtn("Allow ","\u23CE",true,approve));
  }else if(st==="failed"){
    controlsEl.appendChild(mkBtn("Retry ","\u23CE",true,retryCurrent));
  }else if(st==="running"){
    var p=document.createElement("button");p.type="button";p.className="btn";p.innerHTML=ICONS.pause+"<span>Pause</span>";
    p.addEventListener("click",doPause);
    controlsEl.appendChild(p);
    var c=document.createElement("button");c.type="button";c.className="btn";c.innerHTML=ICONS.x+"<span>Cancel</span>";
    c.addEventListener("click",cancel);controlsEl.appendChild(c);
  }else if(st==="paused"){
    var r2=document.createElement("button");r2.type="button";r2.className="btn";r2.innerHTML=ICONS.play+"<span>Resume</span>";
    r2.addEventListener("click",doResume);
    controlsEl.appendChild(r2);
    var c2=document.createElement("button");c2.type="button";c2.className="btn";c2.innerHTML=ICONS.x+"<span>Cancel</span>";
    c2.addEventListener("click",cancel);controlsEl.appendChild(c2);
  }
  outcomeEl.hidden=true;
  if(st==="finished"){outcomeEl.hidden=false;outcomeEl.innerHTML="";var strong=document.createElement("strong");strong.textContent=OUTCOME_NOTE();outcomeEl.appendChild(strong);}
  workPill.textContent=(st==="running"||st==="waiting")?"1 working":"0 working";
  live.textContent=AGENT().name+" "+STATUS_LABEL[st]+", cost "+fmtCost(S.cost)+", elapsed "+fmtClock(showElapsed);
  lastSig=sig();
}
render();
})();
</script>
</body>
</html>
