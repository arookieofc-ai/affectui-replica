<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Overlap Map — Agent overlaps</title>
<style>
/* ============ TOKEN BLOCKS (only place colours may appear) ============ */
:root{
  --page:#fafaf9;
  --surface:#ffffff;
  --ink:#171717;
  --strong:#1c1917;
  --text:#44403c;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --fill:#f3f2f1;
  --focus:#2563eb;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-on:0 1px 2px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.09);
  --pop-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.12);
  --r-lg:16px;
  --r:10px;
  --r-sm:6px;
  --pill:999px;
  --sev-high:#dc2626;
  --sev-high-fg:#991b1b;
  --sev-high-bg:#fee2e2;
  --sev-medium:#f59e0b;
  --sev-medium-fg:#92400e;
  --sev-medium-bg:#fef3c7;
  --sev-low:#78716c;
  --sev-low-fg:#57534e;
  --sev-low-bg:#f5f5f4;
  --work:#2563eb;
  --work-bg:#eff6ff;
  --ok:#15803d;
  --ok-bg:#f0fdf4;
  --agent-0:#4d8dff;
  --agent-1:#a651f0;
  --agent-2:#14b3f0;
  --agent-3:#f28a2e;
  --agent-4:#5fc88a;
  --agent-5:#ee3e9e;
  --line-dim:rgba(120,113,108,.35);
}
html[data-theme="dark"]{
  --page:#101012;
  --surface:#1c1c1f;
  --ink:#ededed;
  --strong:#fafafa;
  --text:#d4d4d8;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --fill:#2f2f34;
  --focus:#7aa7ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  --shadow-on:0 1px 2px rgba(0,0,0,.5),0 6px 20px rgba(0,0,0,.45);
  --pop-shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.5);
  --sev-high:#ff6369;
  --sev-high-fg:#fca5a5;
  --sev-high-bg:rgba(255,99,105,.16);
  --sev-medium:#fbbf24;
  --sev-medium-fg:#fde68a;
  --sev-medium-bg:rgba(251,191,36,.14);
  --sev-low:#a1a1aa;
  --sev-low-fg:#d4d4d8;
  --sev-low-bg:rgba(161,161,170,.14);
  --work:#7aa7ff;
  --work-bg:rgba(122,167,255,.14);
  --ok:#6ee7a8;
  --ok-bg:rgba(110,231,168,.12);
  --agent-0:rgba(77,141,255,.9);
  --agent-1:rgba(166,81,240,.9);
  --agent-2:rgba(20,179,240,.9);
  --agent-3:rgba(242,138,46,.9);
  --agent-4:rgba(95,200,138,.9);
  --agent-5:rgba(238,62,158,.9);
  --line-dim:rgba(161,161,170,.35);
}
/* ============ BASE ============ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.45;
  transition:background-color 180ms ease,color 180ms ease;
}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:flex-end;margin-bottom:10px}
.theme-btn{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:var(--pill);padding:7px 12px;font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;box-shadow:var(--shadow);transition:box-shadow 160ms ease,transform 160ms ease;
}
.theme-btn:hover{box-shadow:var(--shadow-on);transform:translateY(-1px)}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-btn svg{width:16px;height:16px;display:block}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:16px;transition:box-shadow 180ms ease,border-color 180ms ease;
}
/* header: project name + counts */
.aom-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;min-width:0}
.aom-title{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:16px}
.aom-title b{
  font-size:16px;font-weight:600;color:var(--strong);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.count{
  flex:none;min-width:22px;height:20px;padding:0 8px;border-radius:var(--pill);
  background:var(--fill);color:var(--text);font-size:12px;font-weight:600;line-height:20px;
  text-align:center;font-variant-numeric:tabular-nums;
}
.aom-sub{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.aom-sub b{color:var(--text);font-weight:600}
/* severity legend / filter */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.legend button{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:var(--pill);padding:5px 11px 5px 8px;font:inherit;font-size:12.5px;font-weight:500;
  cursor:pointer;transition:box-shadow 160ms ease,border-color 160ms ease,color 160ms ease,background-color 160ms ease;
  white-space:nowrap;
}
.legend button:hover{box-shadow:var(--shadow-on);color:var(--ink)}
.legend button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.legend button[aria-pressed="true"]{color:var(--ink);border-color:var(--focus);box-shadow:var(--shadow)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--sev,var(--muted))}
.dot[data-severity="high"]{--sev:var(--sev-high)}
.dot[data-severity="medium"]{--sev:var(--sev-medium)}
.dot[data-severity="low"]{--sev:var(--sev-low)}
.legend .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
/* map */
.map-head-space{height:14px}
.map{
  position:relative;min-width:0;border:1px solid var(--border);border-radius:var(--r);
  background:var(--surface);overflow:hidden;
}
.map svg.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--line-dim);stroke-width:1.5;transition:stroke 200ms ease,opacity 200ms ease}
.wire[data-severity="high"]{stroke:var(--sev-high)}
.wire[data-severity="medium"]{stroke:var(--sev-medium)}
.wire[data-severity="low"]{stroke:var(--sev-low);stroke-dasharray:4 4}
.wire:not([data-lit]){opacity:.45}
.wire[data-lit]{opacity:1;stroke-width:2.25}
.node{
  position:absolute;z-index:1;display:flex;align-items:center;gap:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:var(--pill);padding:6px 12px 6px 9px;font:inherit;white-space:nowrap;
  box-shadow:var(--shadow);cursor:pointer;max-width:44%;
  transition:box-shadow 170ms ease,transform 170ms ease,opacity 200ms ease,border-color 170ms ease;
  transform:translateY(-50%);
}
.node:hover{box-shadow:var(--shadow-on);transform:translateY(-50%) translateY(-1px)}
.node:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.node[data-dim]{opacity:.75}
.node[aria-expanded="true"]{border-color:var(--focus)}
.node .who{
  flex:0 1 auto;min-width:0;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:600;font-size:13.5px;color:var(--strong);
}
.tool{display:inline-flex;align-items:center;gap:5px;min-width:0;color:var(--muted);font-size:12.5px}
.tool .ticon{
  flex:none;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;
  font-size:9px;font-weight:700;line-height:1;color:var(--surface);background:var(--agent-c,var(--work));
}
.tool .tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .cnt{
  flex:none;min-width:20px;height:18px;padding:0 6px;border-radius:var(--pill);
  background:var(--fill);color:var(--text);font-size:11.5px;font-weight:600;line-height:18px;text-align:center;
}
/* pixel mark 3x3 */
.mark{
  flex:none;display:grid;grid-template-columns:repeat(3,3px);grid-auto-rows:3px;gap:1.5px;
  place-content:center;width:17px;height:17px;
}
.mark i{border-radius:1px;background:var(--agent-c,var(--work));opacity:0;transition:opacity 200ms ease}
.mark i[data-on]{opacity:1}
.mark[data-busy] i[data-on]{animation:twinkle 1.4s ease-in-out infinite}
.mark[data-busy] i:not([data-on]){opacity:.18}
.mark[data-full] i{background:var(--muted)}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.mark[data-busy] i[data-on]{animation:none}}
/* conflict badges */
.badge{
  position:absolute;z-index:2;display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:var(--pill);padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;
  box-shadow:var(--shadow);cursor:pointer;white-space:nowrap;max-width:46%;
  transform:translate(-50%,-50%);
  transition:box-shadow 170ms ease,opacity 200ms ease,border-color 170ms ease;
}
.badge:hover{box-shadow:var(--shadow-on)}
.badge:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.badge[data-dim]{opacity:.75}
.badge[aria-expanded="true"]{border-color:var(--sev-c,var(--focus))}
.badge .blabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge[data-severity="high"]{--sev-c:var(--sev-high);--sev-fg:var(--sev-high-fg);--sev-bg:var(--sev-high-bg)}
.badge[data-severity="medium"]{--sev-c:var(--sev-medium);--sev-fg:var(--sev-medium-fg);--sev-bg:var(--sev-medium-bg)}
.badge[data-severity="low"]{--sev-c:var(--sev-low);--sev-fg:var(--sev-low-fg);--sev-bg:var(--sev-low-bg)}
.badge{position:absolute}
.badge::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--sev-c)}
.badge[data-severity="high"]::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:1px solid var(--sev-high);animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.badge[data-severity="high"]::after{animation:none}}
/* details */
.details{
  margin-top:12px;border:1px solid var(--border);border-radius:var(--r);
  background:var(--subtle);padding:14px;min-height:120px;
}
.details h2{margin:0 0 4px;font-size:14px;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.details .meta{margin:0 0 8px;font-size:12.5px;color:var(--text)}
.chip{
  display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:var(--pill);
  background:var(--sev-bg,var(--fill));color:var(--sev-fg,var(--text));font-size:11.5px;font-weight:600;white-space:nowrap;
}
.chip[data-severity="high"]{--sev-bg:var(--sev-high-bg);--sev-fg:var(--sev-high-fg)}
.chip[data-severity="medium"]{--sev-bg:var(--sev-medium-bg);--sev-fg:var(--sev-medium-fg)}
.chip[data-severity="low"]{--sev-bg:var(--sev-low-bg);--sev-fg:var(--sev-low-fg)}
.dtitle{margin:8px 0;font-size:14px;line-height:1.5;color:var(--ink)}
.agents{margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--border);list-style:none;display:grid;gap:8px}
.agents li{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.agents li b{flex:none;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--strong)}
.agents .note{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-size:12.5px}
.clist{margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--border);list-style:none;display:grid;gap:8px}
.clist li button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);
  padding:8px 10px;font:inherit;font-size:12.5px;cursor:pointer;
  transition:box-shadow 160ms ease,border-color 160ms ease;
}
.clist li button:hover{box-shadow:var(--shadow-on)}
.clist li button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.clist li button span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{
  display:flex;align-items:center;gap:8px;margin:12px 0 0;padding-top:10px;
  border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);
}
.sync span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin:0;padding:28px 12px 18px;font-size:13px;color:var(--muted);text-align:center}
.hint{font-size:12px;color:var(--muted);margin:10px 2px 0}
kbd{
  border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;
  background:var(--surface);padding:0 5px;font-size:11px;font-family:inherit;color:var(--text);
}
/* responsive: narrow = stacked list */
@media (max-width:560px){
  .card{padding:12px}
  .map{overflow:visible}
  .map svg.wires{display:none}
  .map-list{display:grid;gap:8px;padding:10px}
  .node,.badge{position:static;transform:none;max-width:none;width:100%}
  .badge{transform:none}
  .node .who{max-width:none}
}
.map-list{display:none}
.map[data-narrow="true"] svg.wires{display:none}
.map[data-narrow="true"] .map-list{display:grid;gap:8px;padding:10px}
.map[data-narrow="true"] .node,.map[data-narrow="true"] .badge{position:static;transform:none;max-width:none;width:100%}
.map[data-narrow="true"] .badge{transform:none}
</style>
</head>
<body>
<script>
/* default theme follows OS; stored choice overrides */
(function(){
  try{
    var s=null;
    try{s=localStorage.getItem("aom-theme");}catch(e){}
    if(s==="light"||s==="dark"){document.documentElement.setAttribute("data-theme",s);}
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches){
      document.documentElement.setAttribute("data-theme","dark");
    }else{document.documentElement.setAttribute("data-theme","light");}
  }catch(e){}
})();
</script>
<div class="wrap">
  <div class="topbar">
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Dark</span>
    </button>
  </div>

  <section class="card" aria-label="Agent overlaps">
    <div class="aom-head">
      <div class="aom-title"><b>Agent overlaps</b><span class="count" id="countBadge">8</span></div>
      <div class="tool" aria-hidden="true"><span class="tname" id="headMeta">9 agents · 8 overlaps</span></div>
    </div>
    <p class="aom-sub" id="subLine"><b>9 owners</b> have agents working right now · <b>8 overlaps</b> need a look · click a conflict for details</p>
    <ul class="legend" id="legend" aria-label="Filter by severity"></ul>
    <div class="map-head-space" aria-hidden="true"></div>
    <div class="map" id="map" data-narrow="false">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <div class="map-list" id="mapList"></div>
    </div>
    <div class="details" id="details" role="group" aria-label="Details" aria-live="polite"></div>
    <p class="sync" id="syncLine"></p>
    <p class="hint">Hover a node to trace its overlaps · click to pin details · <kbd>Esc</kbd> clears selection.</p>
  </section>
</div>

<script>
"use strict";
/* ---- Original demo data (exact values from demo-original.js) ---- */
var PEOPLE=[
  {id:"sam",name:"Sam Ortiz",note:"Moving checkout to the new API"},
  {id:"priya",name:"Priya Nair",note:"Pricing page and plan limits"},
  {id:"lena",name:"Lena Vogel",note:"Billing emails"},
  {id:"marco",name:"Marco Rossi",note:"Invoice PDFs"},
  {id:"ava",name:"Ava Chen",note:"Design tokens"},
  {id:"jonas",name:"Jonas Weber",note:"Onboarding flow"},
  {id:"noah",name:"Noah Kim",note:"Usage-based billing"},
  {id:"elif",name:"Elif Demir",note:"Billing docs"},
  {id:"tom",name:"Tom Becker",note:"Dashboard theming"}
];
var CONFLICTS=[
  {id:"c1",label:"Contradicts",title:"Priya\u2019s agent raises the Pro limit to 50 seats while Lena\u2019s keeps 25 in the emails",severity:"high",sides:[{personId:"priya",agentName:"Claude Code",harness:"claude-code"},{personId:"lena",agentName:"Codex",harness:"codex"}]},
  {id:"c2",label:"Same files",title:"Three agents are editing billing/invoice.ts at the same time",severity:"high",sides:[{personId:"sam",agentName:"Codex",harness:"codex"},{personId:"lena",agentName:"Codex",harness:"codex"},{personId:"marco",agentName:"Gemini CLI",harness:"gemini-cli"}]},
  {id:"c3",label:"Same work",title:"Sam\u2019s and Priya\u2019s agents are both building the plan comparison table",severity:"medium",sides:[{personId:"sam",agentName:"Claude Code",harness:"claude-code"},{personId:"priya",agentName:"Claude Code",harness:"claude-code"}]},
  {id:"c4",label:"Out of sync",title:"Marco\u2019s agent still uses the old price IDs Priya\u2019s agent replaced this morning",severity:"medium",sides:[{personId:"marco",agentName:"Gemini CLI",harness:"gemini-cli"},{personId:"priya",agentName:"Claude Code",harness:"claude-code"}]},
  {id:"c5",label:"Same files",title:"Sam\u2019s and Ava\u2019s agents both touched tokens/colors.css",severity:"low",sides:[{personId:"sam",agentName:"Codex",harness:"codex"},{personId:"ava",agentName:"Claude Code",harness:"claude-code"}]},
  {id:"c6",label:"Same work",title:"Noah\u2019s and Elif\u2019s agents are both writing the usage-based billing guide",severity:"medium",sides:[{personId:"noah",agentName:"Codex",harness:"codex"},{personId:"elif",agentName:"Gemini CLI",harness:"gemini-cli"}]},
  {id:"c7",label:"Contradicts",title:"Elif\u2019s agent rounds invoice totals per line while Marco\u2019s rounds once per invoice",severity:"high",sides:[{personId:"elif",agentName:"Gemini CLI",harness:"gemini-cli"},{personId:"marco",agentName:"Gemini CLI",harness:"gemini-cli"}]},
  {id:"c8",label:"Same files",title:"Tom\u2019s and Ava\u2019s agents both changed tailwind.config.ts",severity:"low",sides:[{personId:"tom",agentName:"Claude Code",harness:"claude-code"},{personId:"ava",agentName:"Claude Code",harness:"claude-code"}]}
];
var SEV_MEANING={high:"Needs a decision",medium:"Heads-up",low:"Minor"};
var HARNESS_SHORT={"claude-code":"CC","codex":"CX","gemini-cli":"G"};
var HARNESS_NAME={"claude-code":"Claude Code","codex":"Codex","gemini-cli":"Gemini CLI"};
var peopleById={};PEOPLE.forEach(function(p){peopleById[p.id]=p;});

/* unique agent nodes in first-seen order */
var AGENTS=[];
var seen={};
CONFLICTS.forEach(function(c){
  c.sides.forEach(function(s){
    var k=s.personId+"::"+s.agentName;
    if(!seen[k]){seen[k]=1;AGENTS.push({key:k,personId:s.personId,agentName:s.agentName,harness:s.harness,colorIdx:AGENTS.length%6});}
  });
});
AGENTS.forEach(function(a){
  a.conflicts=CONFLICTS.filter(function(c){
    return c.sides.some(function(s){return s.personId===a.personId&&s.agentName===a.agentName;});
  }).map(function(c){return c.id;});
});

function firstName(full){
  var m=String(full).trim().split(/\s+/).filter(function(w){return /\p{L}/u.test(w);});
  return m.length?m[0]:String(full).trim()||full;
}
/* own deterministic 3x3 mark: hash id -> 9 cells */
function markPattern(id){
  var h=0,i;
  for(i=0;i<id.length;i++){h=(h*31+id.charCodeAt(i))>>>0;}
  var cells=[],seed=h||2654435761;
  for(i=0;i<9;i++){seed=(seed*1103515245+12345)>>>0;cells.push(((seed>>16)&1)===1);}
  if(cells.filter(Boolean).length<4){cells[0]=cells[4]=cells[8]=true;}
  return cells;
}
function markHTML(id,busy,full){
  var cells=markPattern(id),h="";
  for(var i=0;i<9;i++){h+="<i"+(cells[i]?" data-on":"")+' style="animation-delay:'+((i*120)%480)+'ms"'+"></i>";}
  var extra=busy?" data-busy":"";if(full){extra+=" data-full";}
  return '<span class="mark"'+extra+' aria-hidden="true">'+h+"</span>";
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

var state={filter:"all",selectedConflict:"c1",selectedAgent:null,hover:null};
var map=document.getElementById("map"),
    wires=document.getElementById("wires"),
    list=document.getElementById("mapList"),
    details=document.getElementById("details"),
    legend=document.getElementById("legend"),
    countBadge=document.getElementById("countBadge"),
    headMeta=document.getElementById("headMeta"),
    subLine=document.getElementById("subLine"),
    syncLine=document.getElementById("syncLine");

function visibleConflicts(){
  return CONFLICTS.filter(function(c){return state.filter==="all"||c.severity===state.filter;});
}
function isLitConflict(id){
  if(state.hover&&state.hover.type==="c")return state.hover.id===id;
  if(state.hover&&state.hover.type==="a"){var a=AGENTS.filter(function(x){return x.key===state.hover.id;})[0];return a&&a.conflicts.indexOf(id)>=0;}
  if(state.selectedConflict)return state.selectedConflict===id;
  if(state.selectedAgent){var b=AGENTS.filter(function(x){return x.key===state.selectedAgent;})[0];return b&&b.conflicts.indexOf(id)>=0;}
  return true;
}
function isNearAgent(key){
  var vis=visibleConflicts().map(function(c){return c.id;});
  var a=AGENTS.filter(function(x){return x.key===key;})[0];
  if(!a)return false;
  var mine=a.conflicts.filter(function(id){return vis.indexOf(id)>=0;});
  if(!mine.length)return false;
  if(state.hover&&state.hover.type==="c")return mine.indexOf(state.hover.id)>=0;
  if(state.selectedConflict)return mine.indexOf(state.selectedConflict)>=0;
  return true;
}

function renderLegend(){
  var counts={all:CONFLICTS.length,high:0,medium:0,low:0};
  CONFLICTS.forEach(function(c){counts[c.severity]++;});
  var items=[["all","All severities",null]].concat(["high","medium","low"].map(function(s){return [s,SEV_MEANING[s],s];}));
  legend.innerHTML=items.map(function(it){
    var v=it[0],label=it[1],sev=it[2];
    var on=state.filter===v;
    var dot=sev?'<span class="dot" data-severity="'+sev+'"></span>':'<span class="dot"></span>';
    return '<li><button type="button" data-f="'+v+'" aria-pressed="'+(on?"true":"false")+'">'+dot+esc(label)+' <span class="n">'+counts[v]+'</span></button></li>';
  }).join("");
  legend.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){
      state.filter=b.getAttribute("data-f");
      if(state.selectedConflict&&!(state.filter==="all"||CONFLICTS.filter(function(c){return c.id===state.selectedConflict;})[0].severity===state.filter)){state.selectedConflict=null;}
      render();
    });
  });
}

function nodePositions(){
  var W=map.clientWidth||800;
  var narrow=W<560;
  map.setAttribute("data-narrow",narrow?"true":"false");
  /* clear old absolute nodes */
  map.querySelectorAll(".node,.badge").forEach(function(n){n.remove();});
  wires.innerHTML="";
  list.innerHTML="";
  var vis=visibleConflicts();
  if(narrow){
    var htmlA='<div style="padding:10px 10px 2px;font-size:12px;color:var(--muted);font-weight:600">Agents in overlap ('+AGENTS.length+')</div>';
    AGENTS.forEach(function(a){htmlA+=nodeInner(a,false);});
    var htmlC='<div style="padding:10px 10px 2px;font-size:12px;color:var(--muted);font-weight:600">Conflicts ('+vis.length+')</div>';
    vis.forEach(function(c){htmlC+=badgeInner(c,false);});
    list.innerHTML=htmlA+htmlC;
    bindNodes();return;
  }
  var left=AGENTS.filter(function(_,i){return i%2===0;});
  var right=AGENTS.filter(function(_,i){return i%2===1;});
  var H=Math.max(AGENTS.length*30,vis.length*52,220)+90;
  map.style.height=H+"px";
  wires.setAttribute("viewBox","0 0 100 "+H);
  var y0=52,span=Math.max(H-y0*2,120);
  function ys(n){var r=[];for(var i=0;i<n;i++){r.push(n===1?H/2:y0+span*i/(n-1));}return r;}
  var ly=ys(left.length),ry=ys(right.length),cy=ys(vis.length);
  var pos={};
  left.forEach(function(a,i){pos[a.key]={x:2,y:ly[i],side:"l"};});
  right.forEach(function(a,i){pos[a.key]={x:98,y:ry[i],side:"r"};});
  var cpos={};vis.forEach(function(c,i){cpos[c.id]={x:50,y:cy[i]};});
  /* wires */
  var paths="";
  vis.forEach(function(c){
    c.sides.forEach(function(s){
      var k=s.personId+"::"+s.agentName,p=pos[k],q=cpos[c.id];
      if(!p||!q)return;
      var x1=p.side==="l"?16:84,x2=q.x+(p.side==="l"?-7:7);
      var mx=(x1+x2)/2;
      paths+='<path class="wire" data-severity="'+c.severity+'"'+(isLitConflict(c.id)?' data-lit':'')+' d="M '+x1+' '+p.y+' C '+mx+' '+p.y+', '+mx+' '+q.y+', '+x2+' '+q.y+'"/>';
    });
  });
  wires.innerHTML=paths;
  /* agent nodes */
  AGENTS.forEach(function(a){
    var p=pos[a.key];
    var el=document.createElement("button");
    el.type="button";el.className="node";
    var near=isNearAgent(a.key);
    if(state.hover||state.selectedConflict){if(!near)el.setAttribute("data-dim","");} 
    el.style.left=p.side==="l"?"8px":"auto";
    el.style.right=p.side==="r"?"8px":"auto";
    el.style.top=p.y+"px";
    el.style.setProperty("--agent-c","var(--agent-"+a.colorIdx+")");
    if(state.selectedAgent===a.key)el.setAttribute("aria-expanded","true");else el.setAttribute("aria-expanded","false");
    var person=peopleById[a.personId];
    el.setAttribute("aria-label",person.name+"\u2019s "+a.agentName+", "+a.conflicts.length+(a.conflicts.length===1?" overlap":" overlaps"));
    el.innerHTML=markHTML(a.key,true,false)+
      '<span class="who">'+esc(firstName(person.name))+'</span>'+
      '<span class="tool"><span class="ticon" aria-hidden="true">'+esc(HARNESS_SHORT[a.harness]||"?")+'</span><span class="tname">'+esc(a.agentName)+'</span></span>'+
      '<span class="cnt">'+a.conflicts.length+'</span>';
    el.addEventListener("click",function(){
      state.selectedAgent=(state.selectedAgent===a.key?null:a.key);
      state.selectedConflict=null;
      render();
    });
    el.addEventListener("pointerenter",function(){state.hover={type:"a",id:a.key};render();});
    el.addEventListener("pointerleave",function(){state.hover=null;render();});
    el.addEventListener("focus",function(){state.hover={type:"a",id:a.key};paintLit();});
    el.addEventListener("blur",function(){state.hover=null;paintLit();});
    map.appendChild(el);
  });
  /* conflict badges */
  vis.forEach(function(c){
    var q=cpos[c.id];
    var el=document.createElement("button");
    el.type="button";el.className="badge";
    el.setAttribute("data-severity",c.severity);
    if(!isLitConflict(c.id))el.setAttribute("data-dim","");
    if(state.selectedConflict===c.id)el.setAttribute("aria-expanded","true");else el.setAttribute("aria-expanded","false");
    el.setAttribute("aria-label",c.label+" \u2013 "+c.title);
    el.style.left=q.x+"%";el.style.top=q.y+"px";
    el.innerHTML='<span class="blabel">'+esc(c.label)+'</span>';
    el.addEventListener("click",function(){
      state.selectedConflict=(state.selectedConflict===c.id?null:c.id);
      state.selectedAgent=null;
      render();
    });
    el.addEventListener("pointerenter",function(){state.hover={type:"c",id:c.id};render();});
    el.addEventListener("pointerleave",function(){state.hover=null;render();});
    el.addEventListener("focus",function(){state.hover={type:"c",id:c.id};paintLit();});
    el.addEventListener("blur",function(){state.hover=null;paintLit();});
    map.appendChild(el);
  });
}
function nodeInner(a){
  var person=peopleById[a.personId];
  var near=isNearAgent(a.key);
  return '<button type="button" class="node" data-agent="'+esc(a.key)+'"'+(near?"":" data-dim")+' aria-expanded="'+(state.selectedAgent===a.key)+'" aria-label="'+esc(person.name+"\u2019s "+a.agentName)+'" style="--agent-c:var(--agent-'+a.colorIdx+')">'+
    markHTML(a.key,true,false)+'<span class="who">'+esc(firstName(person.name))+'</span>'+
    '<span class="tool"><span class="ticon" aria-hidden="true">'+esc(HARNESS_SHORT[a.harness]||"?")+'</span><span class="tname">'+esc(a.agentName)+'</span></span>'+
    '<span class="cnt">'+a.conflicts.length+'</span></button>';
}
function badgeInner(c){
  return '<button type="button" class="badge" data-severity="'+c.severity+'" data-conflict="'+c.id+'"'+(isLitConflict(c.id)?"":" data-dim")+' aria-expanded="'+(state.selectedConflict===c.id)+'" aria-label="'+esc(c.label+" \u2013 "+c.title)+'"><span class="blabel">'+esc(c.label)+'</span></button>';
}
function bindNodes(){
  list.querySelectorAll("[data-agent]").forEach(function(el){
    el.addEventListener("click",function(){
      var k=el.getAttribute("data-agent");
      state.selectedAgent=(state.selectedAgent===k?null:k);
      state.selectedConflict=null;render();
    });
  });
  list.querySelectorAll("[data-conflict]").forEach(function(el){
    el.addEventListener("click",function(){
      var id=el.getAttribute("data-conflict");
      state.selectedConflict=(state.selectedConflict===id?null:id);
      state.selectedAgent=null;render();
    });
  });
}
function paintLit(){
  /* lightweight hover repaint without full rebuild */
  render();
}
function renderDetails(){
  var vis=visibleConflicts();
  countBadge.textContent=String(vis.length);
  headMeta.textContent=AGENTS.length+" agents \u00B7 "+vis.length+" overlaps";
  subLine.innerHTML="<b>"+PEOPLE.length+" owners</b> have agents working right now \u00B7 <b>"+CONFLICTS.length+" overlaps</b> need a look \u00B7 click a conflict for details";
  if(!vis.length){
    details.innerHTML='<h2>No overlaps for this filter</h2><p class="meta">Try another severity.</p><p class="empty">No overlaps right now \u2013 everyone\u2019s agents are in sync.</p>';
  }else if(state.selectedAgent){
    var a=AGENTS.filter(function(x){return x.key===state.selectedAgent;})[0];
    var person=peopleById[a.personId];
    var items=a.conflicts.map(function(id){return CONFLICTS.filter(function(c){return c.id===id;})[0];}).filter(Boolean)
      .filter(function(c){return state.filter==="all"||c.severity===state.filter;});
    details.innerHTML='<h2>'+esc(firstName(person.name))+"\u2019s "+esc(a.agentName)+'</h2>'+
      '<p class="meta">'+esc(person.note)+' \u00B7 '+esc(HARNESS_NAME[a.harness]||a.harness)+' \u00B7 '+a.conflicts.length+(a.conflicts.length===1?" overlap":" overlaps")+'</p>'+
      '<ul class="clist" aria-label="Overlaps">'+items.map(function(c){
        return '<li><button type="button" data-c="'+c.id+'"><span class="chip" data-severity="'+c.severity+'">'+esc(c.label)+'</span><span class="chip">'+esc(SEV_MEANING[c.severity])+'</span><span>'+esc(c.title)+'</span></button></li>';
      }).join("")+'</ul>';
  }else{
    var c=CONFLICTS.filter(function(x){return x.id===state.selectedConflict;})[0]||vis[0];
    if(!c){details.innerHTML='<p class="empty">Select a conflict.</p>';}
    else{
      details.innerHTML='<h2>'+esc(c.label)+' \u00B7 '+esc(c.id.toUpperCase())+'</h2>'+
        '<p class="meta"><span class="chip" data-severity="'+c.severity+'">'+esc(c.label)+'</span> <span style="margin-left:6px">'+esc(SEV_MEANING[c.severity])+'</span></p>'+
        '<p class="dtitle">'+esc(c.title)+'</p>'+
        '<ul class="agents" aria-label="Agents">'+c.sides.map(function(s){
          var p=peopleById[s.personId];
          var ag=AGENTS.filter(function(x){return x.personId===s.personId&&x.agentName===s.agentName;})[0];
          var ci=ag?ag.colorIdx:0;
          return '<li style="--agent-c:var(--agent-'+ci+')">'+markHTML(s.personId+s.agentName,false,false)+'<b>'+esc(firstName(p.name))+'</b>'+
            '<span class="tool"><span class="ticon" aria-hidden="true">'+esc(HARNESS_SHORT[s.harness]||"?")+'</span><span class="tname">'+esc(s.agentName)+'</span></span>'+
            '<span class="note">'+esc(p.note)+'</span></li>';
        }).join("")+'</ul>';
    }
  }
  details.querySelectorAll("[data-c]").forEach(function(b){
    b.addEventListener("click",function(){state.selectedConflict=b.getAttribute("data-c");state.selectedAgent=null;render();});
  });
  /* sync line: owners with no overlaps at all */
  var inConflict={};
  CONFLICTS.forEach(function(x){x.sides.forEach(function(s){inConflict[s.personId]=1;});});
  var synced=PEOPLE.filter(function(p){return !inConflict[p.id];});
  if(synced.length){
    var names=synced.map(function(p){return firstName(p.name);});
    var label=names.length>3?names.slice(0,2).join(", ")+" and "+(names.length-2)+" more":names.join(", ");
    syncLine.innerHTML=markHTML("person",false,true)+"<span>"+esc(label)+(synced.length===1?" is":" are")+" in sync \u2013 "+esc(synced.map(function(p){return p.note;}).join("; "))+"</span>";
  }else{syncLine.innerHTML="";}
}
function render(){
  renderLegend();
  nodePositions();
  renderDetails();
}

/* theme toggle */
var themeBtn=document.getElementById("themeBtn"),
    themeLabel=document.getElementById("themeLabel"),
    iconSun=document.getElementById("iconSun"),
    iconMoon=document.getElementById("iconMoon");
function paintTheme(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  themeLabel.textContent=dark?"Light":"Dark";
  iconSun.style.display=dark?"":"none";
  iconMoon.style.display=dark?"none":"";
  themeBtn.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
}
themeBtn.addEventListener("click",function(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  var next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("aom-theme",next);}catch(e){}
  paintTheme();
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){state.selectedConflict=null;state.selectedAgent=null;state.hover=null;render();}
});
if(window.matchMedia){
  try{
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(e){
      var s=null;try{s=localStorage.getItem("aom-theme");}catch(x){}
      if(!s){document.documentElement.setAttribute("data-theme",e.matches?"dark":"light");paintTheme();}
    });
  }catch(e){}
}
var rT=null;
window.addEventListener("resize",function(){clearTimeout(rT);rT=setTimeout(render,120);});
paintTheme();
render();
</script>
</body>
</html>
