<meta name="color-scheme" content="light dark">
<title>Sprint 24 — Breakdown Chart</title>
<style>
:root, html[data-theme="light"]{
  --surface:#ffffff; --page:#fafaf9; --ink:#1c1917; --ink-soft:#44403c;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --amber:#92400e; --amber-bg:#fef3c7; --amber-dot:#f59e0b;
  --focus:#4fb0fe; --pill:#f5f5f4;
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink-soft:#d4d4d8;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.45);
  --amber:#fde68a; --amber-bg:#451a03; --amber-dot:#fbbf24;
  --focus:#7bc4fe; --pill:#26262a;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--page)}
body{
  margin:0; background:var(--page); color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 14px}
.proj h1{font-size:16px;font-weight:650;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .meta{margin:4px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .meta strong{color:var(--ink-soft);font-weight:600}
.theme-btn{
  flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform 160ms ease, background 160ms ease;
}
.theme-btn:hover{background:var(--subtle);transform:translateY(-1px)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);padding:16px;transition:border-color 160ms ease;
}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.card-top h2{font-size:15px;font-weight:650;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-top .sub{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pickrow{display:flex;flex-wrap:wrap;gap:8px 10px;margin:12px 0 4px}
.picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.picker .plabel{font-size:12px;color:var(--muted);margin-right:2px}
.pick{
  border:1px solid var(--border);background:var(--pill);color:var(--ink-soft);
  border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:550;cursor:pointer;
  transition:background 160ms ease, border-color 160ms ease, transform 160ms ease;
}
.pick:hover{background:var(--subtle);border-color:var(--muted);transform:translateY(-1px)}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
html[data-theme="dark"] .pick[aria-pressed="true"]{background:var(--ink);color:#101012}
.readout{margin:10px 0 10px;font-size:13px;color:var(--muted);min-height:20px}
.readout strong{color:var(--ink)}
.barwrap{position:relative;padding-bottom:2px}
.bar{
  display:flex;height:44px;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--border);background:var(--subtle);
}
.seg{
  position:relative;border:0;padding:0;cursor:pointer;min-width:0;
  transition:opacity 180ms ease, filter 180ms ease;
  border-right:1px solid rgba(255,255,255,.65);
}
.seg:last-child{border-right:0}
.seg:hover{filter:brightness(1.06)}
.seg.dim{opacity:.78}
.seg.hovered{filter:brightness(1.1) saturate(1.1)}
.seg.selected{box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.seg:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;z-index:2}
.tip{
  position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--surface);
  font-size:12px;border-radius:8px;padding:7px 10px;box-shadow:var(--shadow);
  white-space:nowrap;transform:translate(-50%,-100%);transition:opacity 150ms ease;
}
html[data-theme="dark"] .tip{background:#ededed;color:#101012}
.tip .tval{font-weight:700}
.legendline{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 2px;font-size:12px;color:var(--muted)}
.legendline .li{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.18)}
table.grid{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
table.grid caption{text-align:left;font-size:12px;color:var(--muted);padding:0 0 6px}
table.grid th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);
  padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.grid th.num, table.grid td.num{text-align:right}
table.grid td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
table.grid tbody tr{cursor:pointer;transition:background 150ms ease, opacity 180ms ease}
table.grid tbody tr:hover{background:var(--subtle)}
table.grid tbody tr.hovered{background:var(--subtle)}
table.grid tbody tr.dim{opacity:.78}
table.grid tbody tr.selected{background:var(--subtle)}
.cellv{display:flex;align-items:center;gap:8px;min-width:0}
.cellv .vlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.share .track{width:90px;max-width:24vw;height:6px;border-radius:999px;background:var(--subtle);border:1px solid var(--border);overflow:hidden}
.share .fill{display:block;height:100%;border-radius:999px}
.share .pct{font-size:12px;color:var(--muted);min-width:44px;text-align:right}
.rowbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.foot .note{font-size:12px;color:var(--muted)}
.livebtn{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:background 160ms ease, transform 160ms ease;
}
.livebtn:hover{background:var(--subtle);transform:translateY(-1px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:600px){
  .wrap{padding:14px 10px 30px}
  .card{padding:12px}
  table.grid th:nth-child(3), table.grid td:nth-child(3){white-space:nowrap}
  .share .track{width:56px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div class="proj">
      <h1>Sprint 24</h1>
      <p class="meta"><strong id="hdrTasks">212 tasks</strong> &nbsp;·&nbsp; <span id="hdrPts">— points</span> &nbsp;·&nbsp; <span id="hdrDim">Status</span></p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle theme">☾</button>
  </header>

  <main class="card" aria-label="Sprint 24 breakdown">
    <div class="card-top">
      <h2>Breakdown</h2>
      <span class="sub" id="cardSub">212 records · seed 7</span>
    </div>

    <div class="pickrow">
      <div class="picker" role="group" aria-label="Dimension">
        <span class="plabel" id="dimLabel">Split by</span>
        <button class="pick" type="button" id="dim-status" data-dim="status" aria-pressed="true">Status</button>
        <button class="pick" type="button" id="dim-priority" data-dim="priority" aria-pressed="false">Priority</button>
        <button class="pick" type="button" id="dim-team" data-dim="team" aria-pressed="false">Team</button>
        <button class="pick" type="button" id="dim-type" data-dim="type" aria-pressed="false">Type</button>
      </div>
      <div class="picker" role="group" aria-label="Measure">
        <span class="plabel">Show</span>
        <button class="pick" type="button" id="ms-count" data-ms="count" aria-pressed="true">Task count</button>
        <button class="pick" type="button" id="ms-points" data-ms="points" aria-pressed="false">Story points</button>
      </div>
    </div>

    <p class="readout" id="readout" aria-live="polite"></p>

    <div class="barwrap">
      <div class="bar" id="bar" role="list" aria-label="Stacked breakdown bar"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="legendline" id="legendLine"></div>

    <table class="grid" id="grid" aria-label="Breakdown table">
      <caption id="gridCap">Tasks by status</caption>
      <thead><tr>
        <th scope="col">Value</th><th scope="col" class="num" id="colVal">Tasks</th><th scope="col" class="num">Share</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="foot">
      <span class="note" id="liveNote">Auto-tour on · hover a segment for details</span>
      <button class="livebtn" type="button" id="liveBtn" aria-pressed="true">Pause tour</button>
    </div>
  </main>
</div>

<script>
(function(){
"use strict";
/* Verbatim demo data from demo-original.js */
var STATUS_COLORS = {Backlog:"#a3a3a3",Todo:"#8f8f8f","In progress":"#7bc4fe","In review":"#a651f0",Done:"#4fb0fe",Canceled:"#c4c4c4"};
var DIMS = [
  {key:"status", label:"Status", values:["Backlog","Todo","In progress","In review","Done","Canceled"],
   colors:{Backlog:"#a3a3a3",Todo:"#8f8f8f","In progress":"#7bc4fe","In review":"#a651f0",Done:"#4fb0fe",Canceled:"#c4c4c4"}},
  {key:"priority", label:"Priority", values:["Urgent","High","Medium","Low","None"],
   colors:{Urgent:"#ee3e9e",High:"#a651f0",Medium:"#4fb0fe",Low:"#a9d9ff",None:"#dedede"}},
  {key:"team", label:"Team", values:["Design","Web","Mobile","Platform"],
   colors:{Design:"#ee3e9e",Web:"#4fb0fe",Mobile:"#a651f0",Platform:"#a9d9ff"}},
  {key:"type", label:"Type", values:["Feature","Bug","Chore"],
   colors:{Feature:"#4fb0fe",Bug:"#ee3e9e",Chore:"#d4d4d4"}}
];
var MEASURES = [
  {key:"count", label:"Task count", unit:"tasks"},
  {key:"points", label:"Story points", unit:"points", field:"points"}
];
/* Verbatim deterministic record generator (LCG seed 7, Park-Miller) */
var RECORDS = (function(){
  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function pick(vals, w){
    var total = 0, i; for(i=0;i<w.length;i++) total += w[i];
    var r = rnd() * total;
    for(i=0;i<vals.length;i++){ r -= w[i]; if(r < 0) return vals[i]; }
    return vals[vals.length-1];
  }
  var out = [], i;
  var sVals = DIMS[0].values, pVals = DIMS[1].values, tVals = DIMS[2].values, yVals = DIMS[3].values;
  for(i=0;i<212;i++){
    out.push({
      status: pick(sVals,[16,30,22,12,48,6]),
      priority: pick(pVals,[6,18,34,22,20]),
      team: pick(tVals,[18,34,22,26]),
      type: pick(yVals,[52,30,18]),
      points: pick([1,2,3,5,8],[18,30,26,18,8])
    });
  }
  return out;
})();

var MAXN = 6; /* max values across dimensions (status has 6) */
var state = {dim:"status", ms:"count", hover:null, selected:null, live:true, tourIdx:0};

var $ = function(id){ return document.getElementById(id); };
var bar=$("bar"), tip=$("tip"), readout=$("readout"), rowsEl=$("rows"),
    hdrTasks=$("hdrTasks"), hdrPts=$("hdrPts"), hdrDim=$("hdrDim"),
    gridCap=$("gridCap"), colVal=$("colVal"), legendLine=$("legendLine"),
    liveBtn=$("liveBtn"), liveNote=$("liveNote"), themeBtn=$("themeBtn"), cardSub=$("cardSub");

var segNodes=[], rowNodes=[], rowRefs=[];
var i;

function dimOf(){ for(var k=0;k<DIMS.length;k++) if(DIMS[k].key===state.dim) return DIMS[k]; return DIMS[0]; }
function msOf(){ return state.ms==="points" ? MEASURES[1] : MEASURES[0]; }
function totalPoints(){ var s=0,j; for(j=0;j<RECORDS.length;j++) s+=RECORDS[j].points; return s; }

function aggregate(){
  var d=dimOf(), out=[], j, v, m;
  for(j=0;j<d.values.length;j++){ v=d.values[j]; out.push({value:v,color:d.colors[v],count:0,points:0}); }
  for(j=0;j<RECORDS.length;j++){
    var r=RECORDS[j];
    for(m=0;m<out.length;m++) if(out[m].value===r[state.dim]){ out[m].count++; out[m].points+=r.points; break; }
  }
  var tot=0; for(m=0;m<out.length;m++) tot += (state.ms==="points"?out[m].points:out[m].count);
  for(m=0;m<out.length;m++){
    var val = state.ms==="points"?out[m].points:out[m].count;
    out[m].val=val; out[m].share = tot>0 ? val/tot : 0;
  }
  return {list:out,total:tot};
}

function fmtShare(s){ return (s*100).toFixed(1)+"%"; }

/* ---- build DOM once at init (never rebuilt) ---- */
function buildOnce(){
  var j, seg, tr, tdV, tdN, tdS, sw, lab, num, track, fill, pct, btn;
  for(j=0;j<MAXN;j++){
    seg=document.createElement("button");
    seg.setAttribute("type","button");
    seg.setAttribute("class","seg");
    seg.setAttribute("role","listitem");
    seg.setAttribute("tabindex","0");
    (function(idx){
      seg.addEventListener("pointerenter",function(){ userHover(indexValue(idx),true); });
      seg.addEventListener("mouseenter",function(){ userHover(indexValue(idx),true); });
      seg.addEventListener("mouseleave",function(){ userHover(null,true); });
      seg.addEventListener("focus",function(){ userHover(indexValue(idx),false); });
      seg.addEventListener("blur",function(){ userHover(null,false); });
      seg.addEventListener("click",function(){ toggleSelect(indexValue(idx)); });
      seg.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); toggleSelect(indexValue(ev)); }
      });
      function indexValue(ev){ return currentList[idx] ? currentList[idx].value : null; }
    })(j);
    bar.appendChild(seg);
    segNodes.push(seg);
  }
  for(j=0;j<MAXN;j++){
    (function(idx){
      tr=document.createElement("tr");
      tdV=document.createElement("td"); tdN=document.createElement("td"); tdS=document.createElement("td");
      tdN.setAttribute("class","num"); tdS.setAttribute("class","num");
      btn=document.createElement("button");
      btn.setAttribute("type","button");
      btn.setAttribute("class","rowbtn");
      sw=document.createElement("span"); sw.setAttribute("class","dot"); sw.setAttribute("aria-hidden","true");
      lab=document.createElement("span"); lab.setAttribute("class","vlabel");
      btn.appendChild(sw); btn.appendChild(lab); tdV.appendChild(btn);
      num=document.createElement("span");
      tdN.appendChild(num);
      var share=document.createElement("span"); share.setAttribute("class","share");
      track=document.createElement("span"); track.setAttribute("class","track");
      fill=document.createElement("span"); fill.setAttribute("class","fill");
      track.appendChild(fill); share.appendChild(track);
      pct=document.createElement("span"); pct.setAttribute("class","pct");
      share.appendChild(pct); tdS.appendChild(share);
      tr.appendChild(tdV); tr.appendChild(tdN); tr.appendChild(tdS);
      tr.addEventListener("pointerenter",function(){ userHover(rowVal(idx),true); });
      tr.addEventListener("mouseenter",function(){ userHover(rowVal(idx),true); });
      tr.addEventListener("mouseleave",function(){ userHover(null,true); });
      tr.addEventListener("focusin",function(){ userHover(rowVal(idx),false); });
      tr.addEventListener("focusout",function(){ userHover(null,false); });
      tr.addEventListener("click",function(){ toggleSelect(rowVal(idx)); });
      tr.setAttribute("tabindex","0");
      tr.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); toggleSelect(rowVal(idx)); }
      });
      function rowVal(ix){ return currentList[ix] ? currentList[ix].value : null; }
      rowsEl.appendChild(tr);
      rowNodes.push(tr);
      rowRefs.push({tr:tr,sw:sw,lab:lab,num:num,fill:fill,pct:pct,btn:btn});
    })(j);
  }
  var lg;
  for(j=0;j<MAXN;j++){
    lg=document.createElement("span"); lg.setAttribute("class","li");
    var d=document.createElement("span"); d.setAttribute("class","dot");
    var t=document.createElement("span");
    lg.appendChild(d); lg.appendChild(t);
    legendLine.appendChild(lg);
  }
}

var currentList=[];
var legendKids=[];

function indexValue(i){ return currentList[i] ? currentList[i].value : null; }

/* ---- in-place updates only ---- */
function refresh(){
  var agg=aggregate(); currentList=agg.list;
  var ms=msOf(), d=dimOf(), j, it;
  var unit = ms.unit;
  hdrTasks.textContent = RECORDS.length + " tasks";
  hdrPts.textContent = totalPoints() + " points";
  hdrDim.textContent = d.label;
  cardSub.textContent = RECORDS.length + " records · seed 7";
  gridCap.textContent = (ms.key==="points"?"Story points":"Tasks") + " by " + d.label.toLowerCase();
  colVal.textContent = ms.key==="points" ? "Points" : "Tasks";
  /* pickers */
  var dims=["status","priority","team","type"];
  for(j=0;j<dims.length;j++){
    var b=$("dim-"+dims[j]);
    b.setAttribute("aria-pressed", dims[j]===state.dim ? "true":"false");
  }
  $("ms-count").setAttribute("aria-pressed", state.ms==="count"?"true":"false");
  $("ms-points").setAttribute("aria-pressed", state.ms==="points"?"true":"false");
  /* segments */
  for(j=0;j<MAXN;j++){
    (function(idx){
      var seg=segNodes[idx];
      if(idx<currentList.length){
        it=currentList[idx];
        seg.hidden=false;
        seg.style.width=(it.share*100).toFixed(2)+"%";
        seg.style.background=it.color;
        seg.style.flexGrow="0"; seg.style.flexShrink="0";
        seg.setAttribute("aria-label", it.value+": "+it.val+" "+unit+" ("+fmtShare(it.share)+")");
        seg.title=it.value+" · "+it.val+" "+unit;
      } else { seg.hidden=true; }
    })(j);
  }
  /* rows */
  for(j=0;j<MAXN;j++){
    (function(idx){
      var R=rowRefs[idx];
      if(idx<currentList.length){
        it=currentList[idx];
        R.tr.hidden=false;
        R.sw.style.background=it.color;
        R.lab.textContent=it.value;
        R.num.textContent=String(it.val);
        R.fill.style.width=(it.share*100).toFixed(1)+"%";
        R.fill.style.background=it.color;
        R.pct.textContent=fmtShare(it.share);
        R.btn.setAttribute("aria-label", it.value+": "+it.val+" "+unit);
      } else { R.tr.hidden=true; }
    })(j);
  }
  /* legend */
  var kids=legendLine.childNodes;
  for(j=0;j<MAXN;j++){
    (function(idx){
      var li=kids[idx];
      if(idx<currentList.length){
        it=currentList[idx];
        li.hidden=false;
        li.childNodes[0].style.background=it.color;
        li.childNodes[1].textContent=it.value+" "+fmtShare(it.share);
      } else li.hidden=true;
    })(j);
  }
  paintHover();
  paintSelection();
  paintReadout();
}

function paintHover(){
  var j, v;
  for(j=0;j<currentList.length;j++){
    v=currentList[j].value;
    var on = state.hover===v;
    if(j<segNodes.length){
      if(on) segNodes[j].classList.add("hovered"); else segNodes[j].classList.remove("hovered");
    }
    if(j<rowNodes.length){
      if(on) rowNodes[j].classList.add("hovered"); else rowNodes[j].classList.remove("hovered");
    }
  }
  if(state.hover){
    var found=null, k;
    for(k=0;k<currentList.length;k++) if(currentList[k].value===state.hover) found=currentList[k];
    if(found){
      var ms=msOf();
      tip.hidden=false;
      tip.textContent="";
      var b1=document.createElement("span"); b1.setAttribute("class","tval");
      b1.textContent=found.value;
      var rest=document.createTextNode(" · "+found.val+" "+ms.unit+" · "+fmtShare(found.share));
      tip.appendChild(b1); tip.appendChild(rest);
      tip.style.opacity="1";
      /* position over segment centre */
      var idx=0; for(k=0;k<currentList.length;k++) if(currentList[k].value===state.hover) idx=k;
      var left=0; for(k=0;k<idx;k++) left+=currentList[k].share*100;
      left+= (currentList[idx].share*100)/2;
      tip.style.left=Math.min(92,Math.max(8,left))+"%";
      tip.style.top="0";
    } else { tip.hidden=true; }
  } else { tip.hidden=true; tip.style.opacity="0"; }
}

function paintSelection(){
  var j, v;
  var any = !!state.selected;
  for(j=0;j<currentList.length;j++){
    v=currentList[j].value;
    var dimmed = any && state.selected!==v;
    if(j<segNodes.length){
      if(dimmed) segNodes[j].classList.add("dim"); else segNodes[j].classList.remove("dim");
      if(state.selected===v) segNodes[j].classList.add("selected"); else segNodes[j].classList.remove("selected");
    }
    if(j<rowNodes.length){
      if(dimmed) rowNodes[j].classList.add("dim"); else rowNodes[j].classList.remove("dim");
      if(state.selected===v) rowNodes[j].classList.add("selected"); else rowNodes[j].classList.remove("selected");
    }
  }
}

function paintReadout(){
  var ms=msOf(), d=dimOf();
  var key = state.hover || state.selected;
  readout.textContent="";
  var s1=document.createElement("span");
  if(key){
    var f=null,k; for(k=0;k<currentList.length;k++) if(currentList[k].value===key) f=currentList[k];
    if(f){
      var a=document.createElement("strong"); a.textContent=f.value;
      var b=document.createTextNode(": "+f.val+" "+ms.unit+" · "+fmtShare(f.share)+" of "+d.label.toLowerCase()+" · ");
      var c=document.createElement("span");
      c.textContent = state.hover ? (state.selected===key ? "hovering pinned selection" : "hovering — click to pin") : "pinned — click again to unpin";
      readout.appendChild(a); readout.appendChild(b); readout.appendChild(c);
      return;
    }
  }
  var top=currentList.slice().sort(function(x,y){return y.val-x.val;})[0];
  s1.textContent = d.label+" split · "+currentList.length+" groups · "+ms.label.toLowerCase()+" total "+aggregate().total+" · top: "+top.value+" ("+fmtShare(top.share)+")";
  readout.appendChild(s1);
}

function userHover(v, pauseTour){
  if(state.hover===v) return;
  state.hover=v;
  paintHover(); paintReadout();
}
function toggleSelect(v){
  if(!v) return;
  state.selected = (state.selected===v) ? null : v;
  paintSelection(); paintReadout();
}

/* pickers (user state changes, in place) */
$("dim-status").addEventListener("click",function(){ setDim("status"); });
$("dim-priority").addEventListener("click",function(){ setDim("priority"); });
$("dim-team").addEventListener("click",function(){ setDim("team"); });
$("dim-type").addEventListener("click",function(){ setDim("type"); });
$("ms-count").addEventListener("click",function(){ setMs("count"); });
$("ms-points").addEventListener("click",function(){ setMs("points"); });
function setDim(k){ if(state.dim===k) return; state.dim=k; state.hover=null; state.selected=null; state.tourIdx=0; refresh(); }
function setMs(k){ if(state.ms===k) return; state.ms=k; state.hover=null; state.selected=null; state.tourIdx=0; refresh(); }

/* auto-tour loop: advances hover highlight, in place only */
var tourTimer=null;
function tourStep(){
  if(!state.live) return;
  if(document.hidden) return;
  if(currentList.length===0) return;
  var v=currentList[state.tourIdx % currentList.length].value;
  state.tourIdx=(state.tourIdx+1)%currentList.length;
  state.hover=v;
  paintHover(); paintReadout();
}
function setLive(on){
  state.live=on;
  liveBtn.setAttribute("aria-pressed", on?"true":"false");
  liveBtn.textContent = on ? "Pause tour" : "Resume tour";
  liveNote.textContent = on ? "Auto-tour on · hover a segment for details" : "Auto-tour paused · hover a segment for details";
}
liveBtn.addEventListener("click",function(){ setLive(!state.live); });
bar.addEventListener("pointerenter",function(){},{capture:true});
/* pause tour while user hovers, resume after */
bar.addEventListener("pointerleave",function(){},{capture:false});

/* theme toggle */
function paintTheme(){
  var t=document.documentElement.getAttribute("data-theme")||"light";
  var dark = t==="dark";
  themeBtn.textContent = dark ? "☀" : "☾";
  themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  themeBtn.setAttribute("aria-pressed", dark?"true":"false");
}
themeBtn.addEventListener("click",function(){
  var t=document.documentElement.getAttribute("data-theme")||"light";
  var nt = t==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",nt);
  try{ localStorage.setItem("breakdown-chart-theme",nt); }catch(e){}
  paintTheme();
});

/* init: build once, paint, start loop */
buildOnce();
legendKids=[];
paintTheme();
refresh();
setLive(true);
tourTimer=setInterval(tourStep,2200);
if(tourTimer && tourTimer.unref){ try{tourTimer.unref();}catch(e){} }

/* expose for harness */
try{
  window.__breakdown = {
    state:state, get list(){ return currentList; },
    segs:segNodes, rows:rowNodes,
    step:tourStep, refresh:refresh, setDim:setDim, setMs:setMs, setLive:setLive,
    timer:tourTimer
  };
}catch(e){}
})();
</script>
</body>
</html>
