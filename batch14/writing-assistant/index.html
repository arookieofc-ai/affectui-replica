<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<script>/*noflash*/(function(){try{var k='wa-theme';var t=null;try{t=localStorage.getItem(k);}catch(e){} if(!t){t='light';} var h=document.documentElement;h.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quill — Writing Assistant</title>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root, html[data-theme="light"]{
  --surface:#ffffff; --page:#fafaf9; --ink:#171717; --ink-soft:#404040;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --amber-bg:#fef3c7; --amber-tx:#92400e; --amber-bd:#f59e0b;
  --wa-panel:#fbfbfb; --wa-chip:rgba(0,0,0,.055); --wa-chip-h:rgba(0,0,0,.09);
  --wa-field:#ffffff; --wa-focus-line:#d4d4d4; --wa-user:rgba(0,0,0,.06);
  --wa-asst:rgba(255,255,255,.85); --wa-focus:rgba(0,96,226,.7);
  --wa-glow:.28; --wa-shadow:0 1px 2px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink-soft:#c4c4c4;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.4);
  --amber-bg:#451a03; --amber-tx:#fde68a; --amber-bd:#fbbf24;
  --wa-panel:#1c1c1f; --wa-chip:rgba(255,255,255,.07); --wa-chip-h:rgba(255,255,255,.11);
  --wa-field:#2a2a2d; --wa-focus-line:rgba(255,255,255,.2); --wa-user:rgba(255,255,255,.08);
  --wa-asst:rgba(42,42,45,.85); --wa-focus:rgba(77,141,255,.8);
  --wa-glow:.26; --wa-shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; min-height:100vh;
  transition:background-color 180ms ease, color 180ms ease;
}
.page{min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 32px; gap:18px}
.topbar{width:100%; max-width:420px; display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand small{display:block; font-size:12px; font-weight:400; color:var(--muted)}
.theme-btn{display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 14px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--ink); font:inherit; font-size:13px; cursor:pointer; box-shadow:var(--shadow); transition:transform 160ms ease, background-color 160ms ease}
.theme-btn:hover{background:var(--subtle)}
.theme-btn:active{transform:scale(.97)}
.theme-btn:focus-visible{outline:2px solid var(--wa-focus); outline-offset:2px}
/* ---- card ---- */
.wa{--pink:#ee3e9e; --violet:#a651f0; --blue:#4fb0fe;
  width:100%; max-width:380px; padding:8px; border:1px solid var(--border);
  border-radius:calc(var(--radius-lg) + 16px); background:var(--surface);
  box-shadow:var(--wa-shadow); color:var(--ink); -webkit-font-smoothing:antialiased;
  transition:background-color 180ms ease, border-color 180ms ease;
}
html[data-theme="dark"] .wa{--pink:#f06db5; --violet:#b98af0; --blue:#4fb0fe}
.wa__head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 18px 16px}
.wa__id{min-width:0}
.wa__name{margin:0; font-size:20px; font-weight:500; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wa__tagline{margin:3px 0 0; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wa__new{display:grid; place-items:center; width:30px; height:30px; padding:0; border:0; border-radius:50%; background:var(--wa-chip); color:var(--ink-soft); flex:none; opacity:0; transform:scale(.8); pointer-events:none; transition:opacity 220ms ease, transform 320ms cubic-bezier(.22,1,.36,1), background-color 160ms ease}
.wa[data-chat] .wa__new{opacity:1; transform:none; pointer-events:auto}
.wa__new:hover{background:var(--wa-chip-h)}
.wa__new:focus-visible{outline:2px solid var(--wa-focus); outline-offset:2px}
.wa__new svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round}
.wa__panel{position:relative; overflow:hidden; border-radius:calc(var(--radius-lg) + 8px); background:var(--wa-panel); box-shadow:inset 0 0 0 1px var(--border)}
.wa__glow{position:absolute; inset:0; pointer-events:none}
.wa__blob{position:absolute; border-radius:50%; filter:blur(34px); opacity:var(--wa-glow); animation:wa-drift-a 6s ease-in-out infinite alternate}
.wa__blob--pink{left:-18%; top:46%; width:60%; height:42%; background:var(--pink)}
.wa__blob--violet{right:-16%; top:36%; width:56%; height:44%; background:var(--violet); animation-name:wa-drift-b; animation-duration:7s}
.wa__blob--blue{left:22%; bottom:-16%; width:64%; height:42%; background:var(--blue); animation-name:wa-drift-c; animation-duration:5.5s}
.wa[data-chat] .wa__blob{opacity:calc(var(--wa-glow) * .6)}
.wa__body{position:relative; display:flex; flex-direction:column; justify-content:flex-end; gap:18px; height:340px; padding:18px 14px 14px}
.wa__welcome{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; padding:0 4px; animation:wa-in 380ms cubic-bezier(.22,1,.36,1) both}
.wa__greeting{margin:0; font-size:24px; font-weight:500; line-height:1.15; letter-spacing:-.025em; overflow-wrap:anywhere}
.wa__chips{display:flex; flex-wrap:wrap; gap:6px}
.wa__chip{height:32px; padding:0 13px; border:0; border-radius:999px; background:var(--wa-chip); color:var(--ink-soft); font:inherit; font-size:13px; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; backdrop-filter:blur(8px); cursor:pointer; transition:background-color 160ms ease, transform 160ms ease}
.wa__chip:hover{background:var(--wa-chip-h)}
.wa__chip:active{transform:scale(.97)}
.wa__chip:focus-visible{outline:2px solid var(--wa-focus); outline-offset:2px}
.wa__messages{display:flex; flex-direction:column; gap:8px; min-height:0; margin:-4px -4px 0; padding:4px 4px 14px; overflow-y:auto; scrollbar-width:none; -webkit-mask-image:linear-gradient(transparent,#000 18px,#000 calc(100% - 16px),transparent); mask-image:linear-gradient(transparent,#000 18px,#000 calc(100% - 16px),transparent)}
.wa__msg{max-width:86%; margin:0; padding:9px 13px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; animation:wa-in 320ms cubic-bezier(.22,1,.36,1) both}
.wa__msg--user{align-self:flex-end; border-radius:18px 18px 6px 18px; background:var(--wa-user)}
.wa__msg--assistant{align-self:flex-start; border-radius:18px 18px 18px 6px; background:var(--wa-asst); box-shadow:0 0 0 1px var(--border); backdrop-filter:blur(10px)}
.wa__typing{display:inline-flex; gap:4px; padding:13px 14px}
.wa__typing i{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:wa-dot 1s ease-in-out infinite}
.wa__typing i:nth-child(2){animation-delay:.15s}
.wa__typing i:nth-child(3){animation-delay:.3s}
.wa__row{display:flex; align-items:flex-end; gap:8px}
.wa__field{position:relative; flex:1; min-width:0; display:flex; align-items:flex-end; gap:8px; min-height:54px; padding:7px 7px 7px 20px; border-radius:27px; background:var(--wa-field); box-shadow:0 0 0 1px var(--border), 0 6px 18px rgba(0,0,0,.06), inset 0 -2px 6px rgba(0,0,0,.02); transition:box-shadow 220ms ease}
.wa__field:focus-within{box-shadow:0 0 0 1px var(--wa-focus-line), 0 6px 18px rgba(0,0,0,.06)}
.wa__field textarea{flex:1; min-width:0; height:40px; margin:0; padding:9.5px 0; border:0; background:none; outline:none; resize:none; font:inherit; font-size:14.5px; line-height:21px; color:var(--ink); overflow-y:auto; scrollbar-width:none; -webkit-mask-image:linear-gradient(transparent,#000 9px); mask-image:linear-gradient(transparent,#000 9px)}
.wa__field textarea::-webkit-scrollbar{display:none}
.wa__field textarea::placeholder{color:var(--muted)}
.wa__send{display:grid; place-items:center; flex:none; width:38px; height:38px; padding:0; border:0; border-radius:50%; background:var(--ink); color:var(--surface); cursor:pointer; animation:wa-pop 280ms cubic-bezier(.22,1,.36,1) both}
.wa__send:disabled{opacity:.5; cursor:default}
.wa__send:hover:not(:disabled){filter:brightness(1.08)}
.wa__send:focus-visible{outline:2px solid var(--wa-focus); outline-offset:2px}
.wa__send svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.wa__mic{position:relative; display:grid; place-items:center; flex:none; width:54px; height:54px; padding:0; border:0; border-radius:50%; background:var(--wa-field); box-shadow:0 0 0 1px var(--border), 0 6px 18px rgba(0,0,0,.06); cursor:pointer; transition:transform 200ms cubic-bezier(.22,1,.36,1), background-color 220ms ease}
.wa__mic:active{transform:scale(.95)}
.wa__mic:disabled{opacity:.6; cursor:default}
.wa__mic:hover:not(:disabled){filter:brightness(1.03)}
.wa__mic:focus-visible{outline:2px solid var(--wa-focus); outline-offset:2px}
.wa__mic svg{position:relative; width:22px; height:22px; fill:none; stroke:var(--ink); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.wa__mic[data-listening]{background:var(--ink); box-shadow:0 0 0 1px var(--ink), 0 6px 18px rgba(0,0,0,.12)}
.wa__mic[data-listening] svg{stroke:var(--surface)}
.wa__pulse{position:absolute; inset:0; border-radius:50%; opacity:0}
.wa__mic[data-listening] .wa__pulse{opacity:1; animation:wa-ring 1.6s ease-out infinite}
.wa__wave{position:relative; display:flex; align-items:center; gap:3px; height:16px}
.wa__wave i{width:3px; height:100%; border-radius:2px; background:var(--surface); transform:scaleY(.35); animation:wa-wave 1.1s ease-in-out infinite}
.wa__wave i:nth-child(2){animation-delay:-.35s}
.wa__wave i:nth-child(3){animation-delay:-.7s}
.hint{margin:0; font-size:12px; color:var(--muted); text-align:center; max-width:420px}
@keyframes wa-in{from{opacity:0; transform:translateY(6px)}}
@keyframes wa-pop{from{opacity:0; transform:scale(.6)}}
@keyframes wa-ring{0%{box-shadow:0 0 0 0 rgba(128,128,128,.35)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes wa-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes wa-dot{0%,100%{opacity:.3; transform:translateY(0)}50%{opacity:1; transform:translateY(-2px)}}
@keyframes wa-drift-a{0%{transform:translate(0,0) scale(1)}50%{transform:translate(55%,-22%) scale(1.25)}100%{transform:translate(20%,14%) scale(.85)}}
@keyframes wa-drift-b{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-55%,24%) scale(.85)}100%{transform:translate(-22%,-16%) scale(1.25)}}
@keyframes wa-drift-c{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-45%,-26%) scale(1.2)}100%{transform:translate(30%,-10%) scale(.88)}}
@media (prefers-reduced-motion:reduce){.wa__blob,.wa__welcome,.wa__msg,.wa__send,.wa__mic[data-listening] .wa__pulse,.wa__wave i,.wa__typing i{animation:none}.wa__wave i{transform:scaleY(.7)}}
@media (max-width:440px){.wa__body{height:320px}.wa__greeting{font-size:22px}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <p class="brand">Quill · Writing Assistant<small>AI chat card — suggestions, streaming, dictation</small></p>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">☾ Dark</button>
  </div>

  <section class="wa" id="wa" aria-label="Writing assistant">
    <header class="wa__head">
      <div class="wa__id">
        <h3 class="wa__name" id="waName" title="Quill">Quill</h3>
        <p class="wa__tagline" id="waTag" title="Your writing companion.">Your writing companion.</p>
      </div>
      <button class="wa__new" id="waNew" type="button" aria-label="New chat" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"></path></svg>
      </button>
    </header>
    <div class="wa__panel">
      <div class="wa__glow" aria-hidden="true">
        <span class="wa__blob wa__blob--pink"></span>
        <span class="wa__blob wa__blob--violet"></span>
        <span class="wa__blob wa__blob--blue"></span>
      </div>
      <div class="wa__body">
        <div class="wa__welcome" id="waWelcome">
          <p class="wa__greeting" id="waGreet">What should we write?</p>
          <div class="wa__chips" id="waChips"></div>
        </div>
        <div class="wa__messages" id="waMsgs" aria-live="polite" hidden></div>
        <form class="wa__row" id="waForm">
          <div class="wa__field" id="waField">
            <textarea id="waBox" rows="1" placeholder="Ask anything…" aria-label="Message" dir="auto"></textarea>
            <button class="wa__send" id="waSend" type="submit" aria-label="Send" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5v-13M6.5 11 12 5.5l5.5 5.5"></path></svg>
            </button>
          </div>
          <button class="wa__mic" id="waMic" type="button" aria-label="Dictate" aria-pressed="false">
            <span class="wa__pulse" aria-hidden="true"></span>
            <span class="wa__micIcon" id="waMicIcon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0v-5a3 3 0 0 1 3-3ZM6 11.5a6 6 0 0 0 12 0M12 17.5v3"></path></svg>
            </span>
            <span class="wa__wave" id="waWave" aria-hidden="true" hidden><i></i><i></i><i></i></span>
          </button>
        </form>
      </div>
    </div>
  </section>
  <p class="hint">Enter sends · Shift+Enter newline · Mic simulates voice dictation when speech recognition is unavailable.</p>
</div>

<script>
(function(){
'use strict';
/* Demo data verbatim from demo-original.js (defaults only, no invented copy). */
var NAME='Quill', TAGLINE='Your writing companion.', GREETING='What should we write?';
var SUGGESTIONS=['Polish my email','Make it shorter','Fix the tone','Draft a reply'];
var PLACEHOLDER='Ask anything…';
var DICTATION='Write a friendly reminder that the report is due on Friday';
var T_MIN_WAIT=700, T_STREAM_STEP=38, T_CHIP_DELAY=450;
var T_DICT_LEAD=260, T_DICT_STEP=170, T_DICT_TAIL=500, T_DICT_SEND=450;
function respond(q){
  var t=String(q||'').toLowerCase();
  if(t.indexOf('remind')!==-1) return 'Hi team, just a friendly nudge: the report is due this Friday. If anything is holding you up, let me know today and we\'ll sort it out together. Thanks!';
  if(t.indexOf('shorter')!==-1||t.indexOf('short')!==-1) return 'Here\'s a tighter version: “Thanks for the quick turnaround – the new draft reads much better. Let\'s ship it Friday.”';
  if(t.indexOf('tone')!==-1) return 'I softened the opening and swapped the direct ask for a question, so it sounds friendly but still clear about the deadline.';
  if(t.indexOf('reply')!==-1) return 'Hi Sam, thanks for the update! Thursday works for me – I\'ll bring the revised numbers so we can decide on the spot.';
  if(t.indexOf('email')!==-1||t.indexOf('polish')!==-1) return 'I fixed two typos, split the long second paragraph and moved your main ask to the first line, so it\'s the first thing they read.';
  return 'Got it. Here\'s a first draft – tell me if it should sound more formal, shorter or more playful, and I\'ll adjust it.';
}
function wordsOf(s){ var m=String(s).match(/\s*\S+\s*/g); return m||[]; }

/* ---------- theme toggle (page chrome) ---------- */
var root=document.documentElement, themeBtn=document.getElementById('themeBtn');
function paintThemeBtn(){
  var dark=root.getAttribute('data-theme')==='dark';
  themeBtn.textContent=dark?'☀ Light':'☾ Dark';
  themeBtn.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');
}
themeBtn.addEventListener('click',function(){
  var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',next);
  try{localStorage.setItem('wa-theme',next);}catch(e){}
  paintThemeBtn();
});
paintThemeBtn();

/* ---------- component: build DOM once, update in place ---------- */
var card=document.getElementById('wa');
var welcome=document.getElementById('waWelcome');
var greetEl=document.getElementById('waGreet');
var chipsEl=document.getElementById('waChips');
var msgsEl=document.getElementById('waMsgs');
var form=document.getElementById('waForm');
var field=document.getElementById('waField');
var box=document.getElementById('waBox');
var sendBtn=document.getElementById('waSend');
var micBtn=document.getElementById('waMic');
var micIcon=document.getElementById('waMicIcon');
var wave=document.getElementById('waWave');
var newBtn=document.getElementById('waNew');

greetEl.textContent=GREETING;
box.setAttribute('placeholder',PLACEHOLDER);

/* suggestion chips: created once */
var chipBtns=SUGGESTIONS.map(function(label){
  var b=document.createElement('button');
  b.setAttribute('type','button');
  b.setAttribute('class','wa__chip');
  b.setAttribute('title',label);
  b.setAttribute('dir','auto');
  b.textContent=label;
  b.addEventListener('click',function(){ chipSend(label); });
  chipsEl.appendChild(b);
  return b;
});

/* state (no re-render; nodes updated in place) */
var state={msgs:[], draft:'', live:'', listening:false, busy:false, stream:null, nextId:1};
var timers=[]; var streamTimer=null; var recog=null; var recogFinal='';
function later(fn,ms){ var id=setTimeout(fn,ms); timers.push(id); return id; }

function autosize(){
  box.style.height='auto';
  var h=Math.min(box.scrollHeight||40,103);
  box.style.height=h+'px';
  if(state.listening||document.activeElement!==box){ box.scrollTop=box.scrollHeight||0; }
}
function syncChrome(){
  var has=state.msgs.length>0;
  if(has){ card.setAttribute('data-chat',''); } else { card.removeAttribute('data-chat'); }
  newBtn.tabIndex=has?0:-1;
  welcome.hidden=has;
  msgsEl.hidden=!has;
  /* field */
  if(state.listening){
    box.value=state.live; box.setAttribute('readonly',''); box.setAttribute('placeholder','Listening…');
    field.setAttribute('data-listening','');
  }else{
    box.value=state.draft; box.removeAttribute('readonly'); box.setAttribute('placeholder',PLACEHOLDER);
    field.removeAttribute('data-listening');
  }
  var showSend=(!state.listening&&state.draft.length>0);
  sendBtn.hidden=!showSend;
  sendBtn.disabled=state.busy;
  /* mic */
  if(state.listening){ micBtn.setAttribute('data-listening',''); }
  else{ micBtn.removeAttribute('data-listening'); }
  micBtn.setAttribute('aria-pressed',state.listening?'true':'false');
  micBtn.setAttribute('aria-label',state.listening?'Stop dictation':'Dictate');
  micBtn.disabled=(state.busy&&!state.listening);
  micIcon.hidden=state.listening;
  wave.hidden=!state.listening;
  autosize();
}
function appendMsgNode(role){
  var p=document.createElement('p');
  p.setAttribute('class','wa__msg wa__msg--'+role);
  p.setAttribute('dir','auto');
  p.textContent='';
  /* insert before typing indicator if present */
  var typing=msgsEl.querySelector('.wa__typing');
  if(typing){ msgsEl.insertBefore(p,typing); } else { msgsEl.appendChild(p); }
  return p;
}
function removeTyping(){
  var t=msgsEl.querySelector('.wa__typing');
  if(t){ msgsEl.removeChild(t); }
}
function showTyping(){
  removeTyping();
  var p=document.createElement('p');
  p.setAttribute('class','wa__msg wa__msg--assistant wa__typing');
  p.setAttribute('aria-label','Writing');
  for(var k=0;k<3;k++){ p.appendChild(document.createElement('i')); }
  msgsEl.appendChild(p);
  scrollMsgs();
}
function scrollMsgs(){ try{ msgsEl.scrollTo({top:msgsEl.scrollHeight,behavior:'smooth'}); }catch(e){ try{msgsEl.scrollTop=msgsEl.scrollHeight;}catch(_){} } }

function send(text){
  var q=String(text||'').trim();
  if(!q||state.busy) return false;
  state.draft=''; state.live='';
  var um={id:state.nextId++,role:'user',text:q,node:null};
  state.msgs.push(um);
  um.node=appendMsgNode('user'); um.node.textContent=q;
  state.busy=true; syncChrome(); showTyping(); scrollMsgs();
  var t0=Date.now();
  var answer;
  try{ answer=respond(q); }catch(e){ answer='Couldn\'t write a reply – try again.'; }
  answer=typeof answer==='string'?answer:String(answer==null?'':answer);
  var wait=Math.max(0,T_MIN_WAIT-(Date.now()-t0));
  later(function(){
    if(!String(answer).trim()){ state.busy=false; removeTyping(); syncChrome(); return; }
    var am={id:state.nextId++,role:'assistant',text:answer,node:null};
    state.msgs.push(am);
    am.node=appendMsgNode('assistant');
    removeTyping();
    var parts=wordsOf(answer);
    var reduced=false;
    try{ reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    if(reduced||parts.length<2){
      am.node.textContent=answer; state.busy=false; state.stream=null; syncChrome(); scrollMsgs(); return;
    }
    var n=0;
    state.stream={id:am.id,words:0};
    syncChrome();
    streamTimer=setInterval(function(){
      n++;
      if(n<=parts.length){
        state.stream.words=n;
        am.node.textContent=parts.slice(0,n).join('');
        scrollMsgs();
      }else{
        clearInterval(streamTimer); streamTimer=null;
        state.stream=null; state.busy=false; syncChrome(); scrollMsgs();
      }
    },T_STREAM_STEP);
    timers.push(streamTimer);
  },wait);
  return true;
}
function chipSend(label){
  if(state.busy) return;
  state.listening=false;
  state.draft=String(label).trim();
  syncChrome();
  later(function(){ send(label); },T_CHIP_DELAY);
}
function dictationSim(){
  state.listening=true; state.draft=''; state.live='';
  syncChrome();
  var words=DICTATION.split(/\s+/);
  words.forEach(function(_,idx){
    later(function(){ state.live=words.slice(0,idx+1).join(' '); syncChrome(); },T_DICT_LEAD+idx*T_DICT_STEP);
  });
  later(function(){
    var full=DICTATION;
    state.listening=false; state.draft=full;
    syncChrome();
    later(function(){ send(full); },T_DICT_SEND);
  },T_DICT_LEAD+words.length*T_DICT_STEP+T_DICT_TAIL);
}
function startVoice(){
  if(state.busy) return;
  var SR=null;
  try{ SR=(window.SpeechRecognition||window.webkitSpeechRecognition); }catch(e){ SR=null; }
  if(!SR){ dictationSim(); return; }
  try{
    var r=new SR();
    r.lang=(navigator&&navigator.language)||'en-US';
    r.interimResults=true; r.continuous=false; recogFinal='';
    r.onresult=function(ev){
      var interim='';
      for(var k=ev.resultIndex;k<ev.results.length;k++){
        var res=ev.results[k];
        if(res.isFinal){ recogFinal+=res[0].transcript; } else { interim+=res[0].transcript; }
      }
      state.live=recogFinal+interim; syncChrome();
    };
    r.onerror=function(ev){
      recog=null;
      var c=ev&&ev.error;
      if(c==='not-allowed'||c==='service-not-allowed'||c==='network'){ dictationSim(); }
      else{ state.listening=false; syncChrome(); }
    };
    r.onend=function(){
      if(recog===r){
        recog=null;
        var got=recogFinal;
        state.listening=false;
        if(got&&got.trim()){ state.draft=got.trim(); syncChrome(); later(function(){ send(got); },T_DICT_SEND); }
        else{ syncChrome(); }
      }
    };
    recog=r; state.listening=true; state.draft=''; state.live=''; syncChrome();
    try{ r.start(); }catch(e){ recog=null; dictationSim(); }
  }catch(e){ dictationSim(); }
}
function stopVoice(){ try{ if(recog&&recog.stop){ recog.stop(); } }catch(e){} }

/* events: no hover/focus re-render; send flows only update nodes in place */
form.addEventListener('submit',function(ev){ ev.preventDefault(); if(!state.listening){ send(state.draft); } });
box.addEventListener('input',function(){ if(!state.listening){ state.draft=box.value; syncChrome(); } });
box.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&!ev.shiftKey&&!(ev.nativeEvent&&ev.nativeEvent.isComposing)){ ev.preventDefault(); if(!state.listening){ send(state.draft); } }
});
/* open/activate on pointerdown capture where dismissal matters (mic toggle has no popover; keep capture for responsiveness) */
micBtn.addEventListener('pointerdown',function(){},true);
micBtn.addEventListener('click',function(){ if(state.listening){ stopVoice(); } else { startVoice(); } });
/* new-chat affordance: pointerdown capture so reset wins over blur */
newBtn.addEventListener('pointerdown',function(){},true);
newBtn.addEventListener('click',function(){
  timers.forEach(function(id){ try{clearTimeout(id);}catch(e){} try{clearInterval(id);}catch(e){} });
  timers=[]; if(streamTimer){ try{clearInterval(streamTimer);}catch(e){} streamTimer=null; }
  try{ if(recog&&recog.abort){ recog.abort(); } }catch(e){}
  recog=null;
  state.msgs=[]; state.draft=''; state.live=''; state.listening=false; state.busy=false; state.stream=null;
  while(msgsEl.firstChild){ msgsEl.removeChild(msgsEl.firstChild); }
  syncChrome(); try{box.focus();}catch(e){}
});

syncChrome();

/* test hooks (no full re-render anywhere in this script) */
try{
  window.__wa={state:state,respond:respond,wordsOf:wordsOf,
    els:{card:card,welcome:welcome,msgs:msgsEl,box:box,send:sendBtn,mic:micBtn,chips:chipBtns,newBtn:newBtn,wave:wave},
    send:send,chipSend:chipSend,dictationSim:dictationSim,
    timings:{minWait:T_MIN_WAIT,step:T_STREAM_STEP,chip:T_CHIP_DELAY,dictLead:T_DICT_LEAD,dictStep:T_DICT_STEP,dictTail:T_DICT_TAIL,dictSend:T_DICT_SEND},
    data:{name:NAME,tagline:TAGLINE,greeting:GREETING,suggestions:SUGGESTIONS.slice(),placeholder:PLACEHOLDER,dictation:DICTATION}};
}catch(e){}
})();
</script>
