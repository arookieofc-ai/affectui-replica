<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Change Summary — affectUI replica</title>
<!-- /*noflash*/ : pick the theme before first paint so dark never flashes white -->
<script>/*noflash*/(function(){try{var k="affectui-change-summary-theme";var t=null;try{t=window.localStorage.getItem(k);}catch(e){}if(t!=="light"&&t!=="dark"){var mq=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");t=(mq&&mq.matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
  /* ---- design tokens (single source for both themes) ---- */
  html[data-theme="light"]{
    --page:#fafaf9; --surface:#ffffff; --tray:#f0f0f0;
    --ink:#171717; --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
    --accent:#4fb0fe;
    --good-bg:#eef9f3; --good-ink:#1e8a4f;
    --bad-bg:#fff0f0; --bad-ink:#f04438;
    --neutral-bg:#f5f5f5; --neutral-ink:#8f8f8f;
    --amber:#f59e0b; --amber-bg:#fef3c7; --amber-ink:#92400e;
    --line:rgba(0,0,0,.06);
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --page:#101012; --surface:#1c1c1f; --tray:#161618;
    --ink:#ededed; --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
    --accent:#4fb0fe;
    --good-bg:rgba(125,207,159,.18); --good-ink:#41bd74;
    --bad-bg:rgba(255,107,95,.16); --bad-ink:#ff6b5f;
    --neutral-bg:#2a2a2d; --neutral-ink:#8f8f8f;
    --amber:#fbbf24; --amber-bg:#451a03; --amber-ink:#fde68a;
    --line:rgba(255,255,255,.08);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  [hidden]{display:none !important;}

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
    transition:background-color 180ms ease, color 180ms ease;
  }

  .page{min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px;}
  .page-bar{
    width:100%; max-width:480px; display:flex; align-items:center;
    justify-content:space-between; gap:12px; margin-bottom:14px;
  }
  .page-eyebrow{font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--muted);}
  .theme-btn{
    display:inline-grid; place-items:center; width:32px; height:32px; padding:0;
    border:1px solid var(--border); border-radius:999px; background:var(--surface);
    color:var(--ink); cursor:pointer; box-shadow:var(--shadow);
    transition:transform 150ms ease, background-color 150ms ease, border-color 150ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
.theme-btn:hover{background:var(--subtle); transform:translateY(-1px);}
}
  .theme-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .theme-btn svg{display:block; width:16px; height:16px;}

  .stage{width:100%; max-width:480px;}

  /* ---- Change Summary card (mirrors the original demo's look) ---- */
  .ui-cs{
    width:100%; max-width:480px; background:var(--tray);
    padding:6px; border-radius:22px; color:var(--ink);
    border:1px solid var(--border); box-shadow:var(--shadow);
  }
  .ui-cs__head{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:11px 18px 10px; font-size:14px; line-height:20px;
  }
  .ui-cs__title{display:inline-flex; align-items:center; gap:8px; min-width:0; font-weight:500; color:var(--accent);}
  .ui-cs__icon{display:grid; place-items:center; flex:none; width:16px; height:16px; overflow:hidden;}
  .ui-cs__icon svg{display:block; width:16px; height:16px;}
  .ui-cs__title-text{min-width:0; overflow-wrap:anywhere;}
  .ui-cs__period{
    flex:0 1 auto; min-width:0; max-width:50%; overflow:hidden;
    font-size:13px; white-space:nowrap; text-overflow:ellipsis; color:var(--muted);
  }
  .ui-cs__card{
    margin:0; overflow:hidden; background:var(--surface);
    border:1px solid var(--border); border-radius:16px;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .ui-cs__row{
    display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);
    align-items:center; gap:16px; min-height:52px; padding:0 20px;
    transition:opacity 200ms ease, transform 200ms ease, background-color 140ms ease;
  }
  .ui-cs__row + .ui-cs__row{border-top:1px solid var(--line);}
  @media (hover: hover) and (pointer: fine) {
.ui-cs__row:hover{background:var(--subtle);}
}
  .ui-cs__row:focus-within{background:var(--subtle);}
  .ui-cs__row.is-queued{opacity:0; transform:translateY(4px);}
  .ui-cs__row.is-in{opacity:1; transform:none;}
  .ui-cs__label{
    overflow:hidden; font-size:14px; font-weight:500; line-height:20px;
    white-space:nowrap; text-overflow:ellipsis; overflow-wrap:anywhere; text-align:start;
  }
  .ui-cs__change{
    display:flex; align-items:center; gap:8px; min-width:0; margin:0;
    font-size:14px; line-height:20px; color:var(--muted);
  }
  .ui-cs__text{
    display:-webkit-box; overflow:hidden; white-space:pre-line; overflow-wrap:anywhere;
    text-align:start; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  }
  .ui-cs__trend{
    display:grid; place-items:center; flex:none; width:20px; height:20px; border-radius:6px;
  }
  .ui-cs__trend[data-tone="good"]{background:var(--good-bg); color:var(--good-ink);}
  .ui-cs__trend[data-tone="bad"]{background:var(--bad-bg); color:var(--bad-ink);}
  .ui-cs__trend[data-tone="neutral"]{background:var(--neutral-bg); color:var(--neutral-ink);}
  .ui-cs__trend svg{display:block; width:12px; height:12px;}

  .page-note{margin:14px 4px 0; font-size:12px; color:var(--muted); text-align:center;}

  @media (max-width:400px){
    .ui-cs__row{grid-template-columns:minmax(0,1fr); gap:4px; padding:11px 16px;}
    .ui-cs__label{white-space:normal;}
    .ui-cs__change{align-items:flex-start;}
  }
  @media (prefers-reduced-motion: reduce){
    .ui-cs__row{transition:none;}
    .ui-cs__row.is-queued{opacity:1; transform:none;}
    *{transition-duration:.01ms !important;}
  }
</style>
<style>/*polish*/html{-webkit-tap-highlight-color:transparent}body{font-variant-numeric:tabular-nums}</style></head>
<body>
<div class="page">
  <header class="page-bar">
    <span class="page-eyebrow">affectUI &middot; Change Summary</span>
    <button id="themeToggle" class="theme-btn" type="button" aria-pressed="false" aria-label="Switch to dark theme">
      <span id="iconMoon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
      <span id="iconSun" hidden="hidden" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
    </button>
  </header>
  <main class="stage">
    <section class="ui-cs" aria-label="What's changed">
      <header class="ui-cs__head">
        <span class="ui-cs__title">
          <span class="ui-cs__icon" id="csIcon"></span>
          <span class="ui-cs__title-text" dir="auto" title="What's changed">What&#8217;s changed</span>
        </span>
        <span class="ui-cs__period" dir="auto" title="This week">This week</span>
      </header>
      <dl class="ui-cs__card" id="csList"></dl>
    </section>
    <p class="page-note">Replica of the Change Summary demo &middot; four metrics, one trend per row.</p>
  </main>
</div>
<script>
(function(){
  "use strict";
  var THEME_KEY = "affectui-change-summary-theme";

  /* Verbatim demo data from the original demo. */
  var CHANGES = [
    { label: "Active users",   change: "Up 6.1% to 18.2K",         tone: "good" },
    { label: "Activation",     change: "Climbed to 41%, up 3 pts",  tone: "good" },
    { label: "Churn",          change: "Down to 2.1% from 2.6%",    tone: "good", direction: "down" },
    { label: "Support tickets", change: "Up 14% to 312",           tone: "bad",  direction: "up" }
  ];

  function svgEl(paths, size, strokeWidth){
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + size + " " + size);
    svg.setAttribute("width", String(size));
    svg.setAttribute("height", String(size));
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", String(strokeWidth));
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    for (var i = 0; i < paths.length; i++){
      var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", paths[i]);
      svg.appendChild(p);
    }
    return svg;
  }

  function trendIcon(tone, direction){
    if (tone === "neutral") return svgEl(["M3 6h6"], 12, 1.6);
    var down = direction === "down";
    return svgEl(down ? ["M6 2.5v7M3 6.5l3 3 3-3"] : ["M6 9.5v-7M3 5.5l3-3 3 3"], 12, 1.6);
  }

  /* Build the DOM exactly once. Every later update touches existing nodes in place. */
  var list = document.getElementById("csList");
  var iconSlot = document.getElementById("csIcon");
  iconSlot.appendChild(svgEl(["M2.5 4h4", "M2.5 8h8", "M6.5 12h7", "M9.5 4h1"], 16, 1.5));

  var rows = CHANGES.map(function(item, i){
    var tone = (item.tone === "good" || item.tone === "bad") ? item.tone : "neutral";
    var direction = item.direction || (tone === "bad" ? "down" : "up");

    var row = document.createElement("div");
    row.className = "ui-cs__row is-queued";
    /* Same stagger the original uses: 120ms base, +70ms per row. */
    row.style.transitionDelay = String(120 + Math.min(i, 12) * 70) + "ms";

    var label = document.createElement("dt");
    label.className = "ui-cs__label";
    label.setAttribute("dir", "auto");
    label.setAttribute("title", item.label);
    label.textContent = item.label;

    var change = document.createElement("dd");
    change.className = "ui-cs__change";

    var trend = document.createElement("span");
    trend.className = "ui-cs__trend";
    trend.setAttribute("data-tone", tone);
    trend.setAttribute("aria-hidden", "true");
    trend.appendChild(trendIcon(tone, direction));

    var text = document.createElement("span");
    text.className = "ui-cs__text";
    text.setAttribute("dir", "auto");
    text.setAttribute("title", item.change);
    text.textContent = item.change;

    change.appendChild(trend);
    change.appendChild(text);
    row.appendChild(label);
    row.appendChild(change);
    list.appendChild(row);
    return row;
  });

  /* Staggered entrance: flip classes on the nodes built above — never re-render. */
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  function reveal(row){
    row.classList.remove("is-queued");
    row.classList.add("is-in");
  }
  if (reduceMotion){
    rows.forEach(reveal);
  } else {
    rows.forEach(function(row, i){
      window.setTimeout(function(){ reveal(row); }, 120 + Math.min(i, 12) * 70);
    });
  }

  /* Theme toggle: in-place attribute + icon swap only. */
  var toggle = document.getElementById("themeToggle");
  var iconMoon = document.getElementById("iconMoon");
  var iconSun = document.getElementById("iconSun");
  function paintToggle(theme){
    var dark = theme === "dark";
    toggle.setAttribute("aria-pressed", dark ? "true" : "false");
    toggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    iconMoon.hidden = dark;
    iconSun.hidden = !dark;
  }
  function currentTheme(){
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }
  paintToggle(currentTheme());
  toggle.addEventListener("click", function(){
    var next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { window.localStorage.setItem(THEME_KEY, next); } catch (e) {}
    paintToggle(next);
  });
})();
</script>
</body>
</html>
