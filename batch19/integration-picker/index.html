<style>
:root{
  --surface:#ffffff; --page:#fafaf9; --ink:#171717; --ink2:#1c1917;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --accent:#4fb0fe; --focus:rgba(0,96,226,.7);
  --tray:#f0f0f0; --card:#ffffff; --soft:#fafafa; --line:#ececec;
  --text:#404040; --faint:#b5b5b5; --hover:#f0f0f1; --hover-soft:#f7f7f8;
  --tile-light:#ffffff; --tile-ink:#000000; --switch-off:#d9d9d9;
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --accent:#4fb0fe; --focus:rgba(77,141,255,.8);
  --tray:#111113; --card:#19191b; --soft:#151517; --line:#2a2a2e;
  --text:#c8c8cc; --faint:#5c5c63; --hover:#26262a; --hover-soft:#1f1f22;
  --tile-light:#26262a; --tile-ink:#f4f4f5; --switch-off:#3a3a3f;
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; min-height:100vh; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  display:flex; flex-direction:column; align-items:center;
  padding:56px 16px 40px;
}
.page{width:100%; max-width:680px; display:grid; gap:12px}
.topbar{display:flex; align-items:center; justify-content:flex-end; min-height:32px}
.theme-btn{
  display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 10px;
  border-radius:999px; border:1px solid var(--border); background:var(--surface);
  color:var(--muted); font:inherit; font-size:13px; cursor:pointer;
  box-shadow:var(--shadow);
}
.theme-btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.theme-btn .dot{width:7px; height:7px; border-radius:999px; background:var(--accent)}
.ip{
  --ip-tray:var(--tray); --ip-card:var(--card); --ip-soft:var(--soft); --ip-line:var(--line);
  --ip-ink:var(--ink); --ip-text:var(--text); --ip-muted:var(--muted); --ip-faint:var(--faint);
  width:100%; max-width:660px; padding:0 4px 4px; border-radius:calc(var(--radius-lg) + 4px);
  background:var(--ip-tray); color:var(--ip-text); font-size:13.5px;
  container-type:inline-size;
}
.ip-head{display:flex; align-items:center; gap:8px; height:40px; padding:0 10px 0 12px}
.ip-back{
  display:grid; place-items:center; width:26px; height:26px; margin-left:-4px;
  border:0; border-radius:8px; background:transparent; color:var(--ip-muted); cursor:pointer;
}
.ip-back svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.ip-crumb{font-size:13.5px; font-weight:500; color:var(--ip-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ip-count{margin-left:auto; font-size:12.5px; color:var(--ip-muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.ip-card{
  display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden;
  border-radius:var(--radius-lg); background:var(--ip-card);
  border:1px solid var(--ip-line); box-shadow:var(--shadow);
}
.ip-search{display:flex; align-items:center; gap:10px; height:46px; padding:0 14px; border-bottom:1px solid var(--ip-line); cursor:text}
.ip-search>svg{width:17px; height:17px; fill:none; stroke:var(--ip-muted); stroke-width:1.8; stroke-linecap:round}
.ip-search input{flex:1; min-width:0; padding:0; border:0; background:transparent; font:inherit; font-size:14px; color:var(--ip-ink); outline:none}
.ip-search input::placeholder{color:var(--ip-faint)}
.ip-search kbd{font-family:inherit; font-size:12.5px; color:var(--ip-faint)}
.ip-body{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); height:350px; min-height:0}
.ip-list{position:relative; min-height:0; padding:6px 8px 10px; overflow-y:auto; border-right:1px solid var(--ip-line); scrollbar-width:thin}
.ip-group{display:flex; flex-direction:column; gap:2px}
.ip-label{padding:10px 8px 6px; font-size:12px; font-weight:500; color:var(--ip-faint)}
.ip-pill{position:absolute; top:0; left:8px; right:8px; border-radius:10px; background:var(--hover); pointer-events:none}
.ip-item{position:relative; display:flex; align-items:center; gap:10px; height:42px; padding:0 8px; border:0; border-radius:10px; background:transparent; text-align:left; cursor:pointer; width:100%; font:inherit}
.ip-name{display:grid; min-width:0; line-height:17px}
.ip-name b{overflow:hidden; font-weight:500; color:var(--ip-ink); white-space:nowrap; text-overflow:ellipsis; text-align:start; font-size:13.5px}
.ip-name small{overflow:hidden; font-size:12.5px; color:var(--ip-muted); white-space:nowrap; text-overflow:ellipsis; text-align:start}
.ip-logo{display:grid; place-items:center; flex:none; width:28px; height:28px; border-radius:8px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.09),0 1px 2px rgba(0,0,0,.08)}
.ip-logo[data-tone="brand"]{background:var(--ip-brand,#5E6AD2); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.08)}
.ip-logo[data-tone="light"]{background:var(--tile-light); color:var(--ip-ink); box-shadow:inset 0 0 0 1px rgba(0,0,0,.09),0 1px 2px rgba(0,0,0,.08)}
.ip-logo[data-tone="ink"]{background:var(--tile-ink); color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.08)}
html[data-theme="dark"] .ip-logo[data-tone="light"]{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.4)}
html[data-theme="dark"] .ip-logo[data-tone="ink"]{background:#f4f4f5; color:#111113}
.ip-logo svg{width:14px; height:14px; display:block}
.ip-letter{font-size:13px; font-weight:600; line-height:1}
.ip-empty{margin:0; padding:18px 10px; font-size:13.5px; color:var(--ip-muted); overflow-wrap:anywhere}
.ip-empty b{font-weight:500; color:var(--ip-ink)}
.ip-empty--detail{display:grid; place-items:center; height:100%; text-align:center}
.ip-detail{display:flex; flex-direction:column; min-height:0; overflow:hidden}
.ip-art{position:relative; display:flex; flex:none; align-items:center; justify-content:center; gap:18px; height:104px; overflow:hidden; margin:8px 8px 0; border-radius:calc(var(--radius-lg) - 4px); background:var(--ip-soft); border:1px solid var(--ip-line)}
.ip-rings{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.ip-rings i{position:absolute; width:90px; aspect-ratio:1; border-radius:50%; border:1px solid rgba(0,0,0,.06)}
html[data-theme="dark"] .ip-rings i{border-color:rgba(255,255,255,.07)}
.ip-rings i:nth-child(2){width:146px}.ip-rings i:nth-child(3){width:202px}.ip-rings i:nth-child(4){opacity:0; width:90px}
.ip[data-on] .ip-rings i:nth-child(4){animation:ip-spread 2.8s cubic-bezier(.22,1,.36,1) infinite}
.ip-tile{position:relative; z-index:1; display:grid; place-items:center; width:46px; height:46px; border-radius:12px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 12px 14px -10px rgba(0,0,0,.18)}
.ip-tile svg{width:22px; height:22px; display:block}
.ip-tile--app{background:#000; color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 12px 14px -10px rgba(0,0,0,.18)}
.ip-tile--app .ip-mark{width:20px; height:20px}
.ip-tile--brand[data-tone="brand"]{background:var(--ip-brand,#5E6AD2); color:#fff}
.ip-tile--brand[data-tone="light"]{background:var(--tile-light); color:var(--ip-ink)}
.ip-tile--brand[data-tone="ink"]{background:var(--tile-ink); color:#fff}
html[data-theme="dark"] .ip-tile--brand[data-tone="ink"]{background:#f4f4f5; color:#111113}
.ip[data-swapped] .ip-tile--brand{animation:ip-swap 420ms cubic-bezier(.22,1,.36,1)}
@keyframes ip-swap{from{opacity:0; transform:translateY(6px) scale(.92); filter:blur(4px)}to{opacity:1; transform:none; filter:none}}
@keyframes ip-spread{0%{opacity:.9; transform:scale(.9)}100%{opacity:0; transform:scale(2.6)}}
.ip-link{position:relative; z-index:1; display:grid; place-items:center; width:30px; height:30px; color:var(--ip-faint)}
.ip-link svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; display:block}
.ip[data-on] .ip-link{color:var(--accent); transform:rotate(180deg)}
.ip-link{transition:color 300ms ease,transform 500ms cubic-bezier(.22,1,.36,1)}
.ip-info{display:flex; flex:1; flex-direction:column; min-height:0; overflow-y:auto; scrollbar-width:thin; padding:12px 16px 14px}
.ip[data-swapped] .ip-info{animation:ip-in 360ms cubic-bezier(.22,1,.36,1)}
@keyframes ip-in{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.ip-title{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.ip-title>div{display:grid; min-width:0}
.ip-title h3{margin:0; font-size:15px; font-weight:600; line-height:22px; letter-spacing:-.01em; color:var(--ip-ink); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow-wrap:anywhere; text-align:start}
.ip-domain{font-size:13px; color:var(--ip-muted); overflow-wrap:anywhere; min-width:0}
.ip-desc{margin:8px 0 0; font-size:13px; line-height:19px; color:var(--ip-text); overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow-wrap:anywhere; white-space:pre-line; text-align:start}
.ip-features{display:grid; gap:4px; margin:10px 0 0; padding:0; list-style:none}
.ip-features li{display:flex; align-items:flex-start; gap:7px; font-size:12.5px; line-height:18px; color:var(--ip-muted); min-width:0}
.ip-features svg{margin-top:2.5px; width:13px; height:13px; fill:none; stroke:var(--ip-faint); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; display:block; flex:none}
.ip-switch{position:relative; flex:none; width:38px; height:22px; margin-top:1px; border-radius:999px; background:var(--switch-off); border:0; cursor:pointer; padding:0}
.ip-switch::after{content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.22)}
.ip-switch[aria-checked="true"]{background:var(--accent)}
.ip-switch[aria-checked="true"]::after{transform:translateX(16px)}
.ip-switch,.ip-switch::after{transition:background-color 220ms ease,transform 260ms cubic-bezier(.22,1,.36,1)}
.ip-explore{display:inline-flex; align-items:center; justify-content:center; gap:4px; height:34px; margin-top:auto; border-radius:9px; background:var(--ip-card); border:1px solid var(--ip-line); box-shadow:0 1px 2px rgba(0,0,0,.05); font-size:13px; font-weight:500; color:var(--ip-ink); cursor:pointer; font:inherit; padding:0 12px}
.ip-explore svg{width:15px; height:15px; fill:none; stroke:var(--ip-muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block}
.ip-info>:nth-last-child(2){margin-bottom:16px}
.ip button:focus-visible,.ip input:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.theme-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.footer{font-size:12.5px; color:var(--muted); text-align:center}
@media (max-width:600px){
  .ip-body{grid-template-columns:minmax(0,1fr); height:auto}
  .ip-list{max-height:196px; border-right:0; border-bottom:1px solid var(--ip-line)}
  .ip-art{height:88px}
  .ip-detail{overflow:visible}
  .ip-count{display:none}
}
@media (max-width:420px){ .ip-features{display:none} .ip-search kbd{display:none} }
@media (hover:hover) and (pointer:fine){
  .ip-back:hover{background:rgba(0,0,0,.05); color:var(--ip-ink)}
  html[data-theme="dark"] .ip-back:hover{background:rgba(255,255,255,.06)}
  .ip-item:not([aria-selected="true"]):hover{background:var(--hover-soft)}
  .ip-explore:hover{background:var(--ip-soft); border-color:var(--border)}
  .ip-explore:hover svg{transform:translateX(2px)}
  .theme-btn:hover{border-color:var(--muted)}
  .ip-switch:hover{filter:brightness(1.05)}
}
@media (prefers-reduced-motion:reduce){ .ip *,.ip *::before,.ip *::after{animation:none!important; transition:none!important} }
</style>

function updatePill(targetBtn){
  if(!targetBtn){pill.hidden=true;return}
  pill.hidden=false;
  var y=0,h=42;
  try{
    if(typeof targetBtn.offsetTop==="number"&&targetBtn.offsetTop){y=targetBtn.offsetTop;h=targetBtn.offsetHeight||42}
    else{
      var order=[];Object.keys(btnMap).forEach(function(id){var e=btnMap[id].btn;if(!e.hidden)order.push(e)});
      var idx=order.indexOf(targetBtn);
      if(idx>=0){y=8+idx*44;var connCount=visibleGroups()[0]?visibleGroups()[0].items.length:0;if(idx>=connCount)y+=34}
    }
  }catch(e){}
  pill.style.transform="translateY("+y+"px)";pill.style.height=h+"px";
}
function refresh(){

  var cur=null;
  for(var i=0;i<flat.length;i++)if(flat[i].id===state.sel){cur=flat[i];break}
  if(!cur)cur=flat[0]||null;

  count.textContent=fmt.format(totalConn)+" of "+fmt.format(DATA.length)+" connected";
  /* list: move existing nodes, never rebuild */
  var byLabel={};groups.forEach(function(g){byLabel[g.label]=g});
  groupEls.forEach(function(ge){
    var g=byLabel[ge.label];
    if(!g){ge.root.hidden=true;return}
    ge.root.hidden=false;
    g.items.forEach(function(it){
      var rec=btnMap[it.id];var b=rec.btn;
      b.hidden=false;
      b.setAttribute("aria-selected",cur&&it.id===cur.id?"true":"false");
      ge.box.appendChild(b);
    });
  });
  Object.keys(btnMap).forEach(function(id){
    var inFlat=flat.some(function(f){return f.id===id});
    if(!inFlat)btnMap[id].btn.hidden=true;
  });
  if(!flat.length){
    emptyP.hidden=false;
    emptyPre.textContent="No integrations match ";
    emptyB.textContent="\u201C"+state.q+"\u201D";
  }else emptyP.hidden=true;
  /* detail */
  if(!cur){art.hidden=true;info.hidden=true;detailEmpty.hidden=false;root.removeAttribute("data-on");updatePill(null);return}

  var isOn=!!state.conn[cur.id];

  if(cur.id!==state.lastDetail){
    while(brandTile.firstChild)brandTile.removeChild(brandTile.firstChild);
    var t=toneOf(cur.tile);brandTile.setAttribute("data-tone",t);
    if(t==="brand")brandTile.style.setProperty("--ip-brand",cur.tile);else brandTile.style.removeProperty("--ip-brand");
    brandTile.appendChild(logoNode(cur));
    if(state.swapped){
      brandTile.style.animation="none";void brandTile.offsetWidth;brandTile.style.animation="";
      info.style.animation="none";void info.offsetWidth;info.style.animation="";
    }
    state.lastDetail=cur.id;
  }else{
    var tt=toneOf(cur.tile);if(brandTile.getAttribute("data-tone")!==tt){brandTile.setAttribute("data-tone",tt);if(tt==="brand")brandTile.style.setProperty("--ip-brand",cur.tile)}
  }

  }
  sw.setAttribute("aria-checked",isOn?"true":"false");

  else if(e.key==="Escape"){if(state.q){state.q="";input.value="";refresh()} }
