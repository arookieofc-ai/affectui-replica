/* ---- design tokens (spec v2/v3) ---- */
:root{

html[data-theme="dark"]{

  --muted:#a1a1aa;

  --green:#3ccb7f;
  --red:#ff6b5f;
  --amber:#fbbf24; --amber-bg:#451a03; --amber-text:#fde68a;
  --focus:rgba(77,141,255,.8);

/* ---- page ---- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  min-height:100vh; display:flex; justify-content:center;
  padding:28px 16px 64px;
  transition:background 180ms ease,color 180ms ease;
}
.page{width:100%;max-width:472px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.proj{min-width:0;flex:1}
.proj-name{font-size:15px;font-weight:600;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta b{color:var(--accent);font-weight:600}
.theme-btn{
  flex:none;width:34px;height:34px;display:grid;place-items:center;
  border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);

}
.theme-btn:hover{background:var(--subtle);transform:translateY(-1px)}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-btn svg{width:17px;height:17px}
/* ---- component tray + card ---- */
.ct{background:var(--subtle);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:4px;box-shadow:var(--shadow);container-type:inline-size}
.ct-card{background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius-lg) - 4px);
  padding:6px 4px 10px;box-shadow:var(--shadow)}
.ct-head{display:flex;align-items:center;gap:12px;min-height:36px;margin:0;padding:0 12px 2px}
.ct-switch{position:relative;display:flex;flex:1;min-width:0}
.ct-branch{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;margin:0;padding:2px 4px;
  border:0;border-radius:var(--radius-sm);background:none;font:inherit;font-weight:600;font-size:14px;color:var(--ink-strong);cursor:pointer}
.ct-branch[data-static]{cursor:default}
.ct-branch:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ct-branch-name{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ct-chev{display:grid;color:var(--muted);transition:rotate 200ms var(--ease)}
.ct-branch[aria-expanded="true"] .ct-chev{rotate:180deg}
.ct-count{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ct-menu{position:absolute;z-index:5;top:calc(100% + 4px);left:0;display:grid;width:max-content;min-width:180px;max-width:280px;
  padding:4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);
  animation:ct-menu 180ms var(--ease) both}
.ct-option{display:flex;align-items:center;gap:8px;min-width:0;min-height:30px;margin:0;padding:0 8px;border:0;border-radius:var(--radius-sm);
  background:none;font:inherit;color:var(--ink);text-align:start;cursor:pointer}
.ct-option:hover{background:var(--subtle)}
.ct-option:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ct-option-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ct-option-tick{display:grid;color:var(--accent)}
.ct-empty{padding:8px 10px 6px;font-size:12px;color:var(--muted)}
.ct-scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.ct-list{margin:0;padding:2px 0 0;list-style:none}
.ct-list[data-more]{padding-bottom:14px}
/* timeline rail */
.ct-item{position:relative;list-style:none}
.ct-item::before,.ct-item::after{content:"";position:absolute;left:calc(8px + 9px - .75px);width:1.5px;background:var(--border);
  transition:background-color 400ms ease,opacity 420ms var(--ease)}
.ct-item::before{top:0;height:calc(var(--row)/2 - 8px)}
.ct-item::after{top:calc(var(--row)/2 + 8px);bottom:0}
.ct-item:first-child::before{visibility:hidden}
.ct-item:last-child::after{visibility:hidden}
.ct-item[data-in="on"]::before,.ct-item[data-out="on"]::after{background:var(--accent)}
.ct-item[data-expanded]::after{opacity:0}
.ct-list[data-more]>.ct-item:last-child::after{visibility:visible;bottom:-14px;
  -webkit-mask:linear-gradient(#000 calc(100% - 24px),transparent);mask:linear-gradient(#000 calc(100% - 24px),transparent)}
/* rows */
.ct-row{position:relative;z-index:2;display:flex;align-items:center;width:100%;min-height:var(--row);margin:0;padding:0 8px;
  border:0;border-radius:var(--radius-sm);background:none;font:inherit;color:inherit;text-align:inherit}
button.ct-row{cursor:pointer;transition:background-color 140ms ease}
button.ct-row:hover,.ct-item[data-open]>.ct-row{background:var(--subtle)}
.ct-row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ct-marker{position:relative;display:grid;flex:none;place-items:center;width:18px;height:16px;margin-right:14px}
.ct-marker::before{content:"";position:absolute;left:1px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:background-color 300ms ease}
.ct-marker[data-kind="done"]::before{background:var(--accent-wash)}
.ct-marker svg{position:relative;display:block}
.ct-marker path,.ct-marker circle{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ct-marker[data-kind="done"] path{stroke:var(--accent);stroke-width:1.7;stroke-dasharray:1;animation:ct-draw 360ms 120ms var(--ease) both}
.ct-track{stroke:var(--accent-wash)}
.ct-arc{stroke:var(--accent);stroke-dasharray:12 28;transform-origin:8px 8px;animation:ct-spin 900ms linear infinite}
.ct-status{font-weight:500;font-size:12px;background:linear-gradient(90deg,var(--accent) 0 40%,var(--accent-wash) 50%,var(--accent) 60% 100%) 0 0/250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:ct-shine 1300ms linear infinite}
.ct-msg{flex:0 1 auto;min-width:0;margin-right:16px;overflow:hidden;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.ct-item:is([data-pending],[data-open])>.ct-row .ct-msg{color:var(--ink)}
.ct-msg[data-untitled]{color:var(--muted)!important;font-style:italic}
.ct-tag{flex:none;max-width:88px;height:18px;margin:0 10px 0 0;padding:0 6px;overflow:hidden;border-radius:var(--radius-sm);
  background:var(--subtle);font-size:11px;font-weight:500;line-height:18px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.ct-fold{display:grid;flex:none;margin-left:4px;color:var(--muted);opacity:0;transition:opacity 140ms ease}
.ct-row:is(:hover,:focus-visible) .ct-fold{opacity:1}
.ct-fold svg{rotate:-90deg;transition:rotate 200ms var(--ease)}
.ct-item[data-expanded] .ct-fold svg{rotate:0deg}
.ct-kind{flex:none;max-width:96px;height:20px;margin-left:auto;padding:0 7px;overflow:hidden;border-radius:var(--radius-sm);
  background:color-mix(in srgb,var(--ct-k) 12%,transparent);font-size:11px;font-weight:500;line-height:20px;color:var(--ct-k);
  white-space:nowrap;text-overflow:ellipsis}
.ct-kind + .ct-time{margin-left:0;padding-left:10px}
.ct-time{flex:none;width:44px;min-width:44px;margin-left:auto;padding-left:12px;overflow:hidden;font-size:12px;color:var(--muted);
  text-align:end;white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ct-time:has(.ct-status){width:auto}
/* refs + tooltip */
.ct-ref{display:inline;margin:0 1px;padding:2px 5px 2px 4px;border-radius:var(--radius-sm);background:var(--subtle);
  box-shadow:inset 0 0 0 .5px var(--border);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--muted);cursor:default}
.ct-ref:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.ct-ref svg{display:inline-block;margin-right:3px;vertical-align:-1.5px;color:var(--muted)}
.ct-tip{position:fixed;z-index:50;display:flex;align-items:center;gap:5px;max-width:320px;height:24px;margin:0;padding:0 8px 0 7px;
  border:0;border-radius:8px;background:var(--tip);color:var(--tip-ink);font-size:11px;white-space:nowrap;pointer-events:none;
  animation:ct-tip 140ms var(--ease) both}
.ct-tip-name{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500}
.ct-tip-detail{overflow:hidden;text-overflow:ellipsis;opacity:.62}
/* sub commits (merge children) */
.ct-subs{display:grid;grid-template-rows:0fr;transition:grid-template-rows 420ms var(--ease)}
.ct-subs[data-open]{grid-template-rows:1fr}
.ct-sublist{min-height:0;overflow:hidden;margin:0;padding:0;list-style:none}
.ct-sublist::before{content:"";display:block;height:2px}
.ct-sublist::after{content:"";display:block;height:14px}
.ct-sub{opacity:0;translate:0 -4px;transition:opacity 260ms ease,translate 360ms var(--ease)}
.ct-subs[data-open] .ct-sub{opacity:1;translate:0 0}
.ct-subrow{position:relative;z-index:2;display:flex;align-items:center;width:100%;gap:12px;min-height:var(--subrow);margin:0;
  padding:0 8px 0 calc(8px + 21px - 2.5px);border:0;border-radius:var(--radius-sm);background:none;font:inherit;font-size:12px;color:var(--muted);
  cursor:pointer;transition:background-color 140ms ease}
.ct-subrow:hover,.ct-sub[data-open]>.ct-subrow{background:var(--subtle)}
.ct-subrow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ct-dot{flex:none;width:5px;height:5px;margin-right:2.5px;border-radius:50%;background:var(--accent)}
.ct-sub[data-open] .ct-submsg{color:var(--ink)}
.ct-submsg{flex:0 1 auto;min-width:0;margin-right:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ct-detail{flex:none;width:30px;margin-left:auto;text-align:end;font-size:11px;color:var(--muted);white-space:nowrap}
.ct-wire{position:absolute;z-index:1;top:calc(var(--row)/2 + 8px);bottom:0;left:8px;width:28px;pointer-events:none;opacity:0;transition:opacity 420ms var(--ease)}
.ct-item[data-expanded]>.ct-wire{opacity:1}
.ct-bend{position:absolute;top:0;left:0}
.ct-bend-in{top:auto;bottom:0}
.ct-bend path{fill:none;stroke:var(--accent);stroke-width:1.5}
.ct-spine{position:absolute;top:14px;bottom:14px;left:calc(21px - .75px);width:1.5px;background:var(--accent)}
/* details */
.ct-details{display:grid;grid-template-rows:0fr;transition:grid-template-rows 360ms var(--ease)}
.ct-details[data-open]{grid-template-rows:1fr}
.ct-details-in{min-height:0;overflow:hidden}
.ct-info{display:grid;gap:2px;padding:2px 10px 12px 40px;font-size:12px;color:var(--muted);opacity:0;translate:0 -3px;
  transition:opacity 220ms ease,translate 320ms var(--ease)}
.ct-details[data-nested] .ct-info{padding-left:46px}
.ct-details[data-open] .ct-info{opacity:1;translate:0 0}
.ct-line{display:flex;align-items:center;gap:6px;min-width:0;min-height:24px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ct-by{flex:0 1 auto;min-width:0;max-width:75%;overflow:hidden;color:var(--ink);text-overflow:ellipsis}
.ct-sep{flex:none;color:var(--muted)}
.ct-date{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ct-hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted)}
.ct-copy{display:grid;flex:none;place-items:center;width:24px;height:24px;margin:0 -2px 0 -4px;padding:0;border:0;border-radius:var(--radius-sm);
  background:none;color:var(--muted);cursor:pointer;transition:background-color 140ms ease,color 140ms ease}
.ct-copy:hover{background:var(--subtle);color:var(--ink)}
.ct-copy:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.ct-copy[data-done]{color:var(--green)}
.ct-diff{display:inline-flex;flex:none;gap:6px;margin-left:2px}
.ct-add{color:var(--green)} .ct-del{color:var(--red)}
.ct-body{margin:4px 0 0;line-height:18px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}

.ct-mark{display:inline-grid;flex:none;grid-template-columns:repeat(3,3px);grid-auto-rows:3px;gap:1.5px;
  place-content:center;width:12px;height:12px;vertical-align:-1px}
.ct-mark>i{border-radius:.75px;background:var(--mark);opacity:0;transition:opacity 240ms ease}
.ct-mark>i[data-on]{opacity:1}
.ct-name{display:inline-flex;align-items:center;gap:5px;vertical-align:top}
.ct-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ct-item[data-enter]>.ct-row{animation:ct-enter 520ms var(--ease) both}
.ct-item:not([data-enter])>.ct-row{animation:ct-rise 520ms var(--ease) both;animation-delay:calc(var(--ct-i,0)*35ms)}
@keyframes ct-enter{from{opacity:0}40%{opacity:0}}
@keyframes ct-rise{from{opacity:0;translate:0 4px}}
@keyframes ct-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ct-spin{to{rotate:360deg}}
@keyframes ct-shine{from{background-position:100% 0}to{background-position:0 0}}
@keyframes ct-tip{from{opacity:0;translate:0 3px}}
@keyframes ct-menu{from{opacity:0;scale:.96;translate:0 -2px}}
@keyframes ct-pop{0%{scale:.4;opacity:0}60%{scale:1.12;opacity:1}100%{scale:1}}
.ct[data-open] .ct-item:not([data-open])>.ct-row>:not(.ct-marker),
.ct[data-open] .ct-sub:not([data-open])>.ct-subrow>:not(.ct-dot){opacity:.4}
.ct-row>:not(.ct-marker),.ct-subrow>:not(.ct-dot){transition:opacity 260ms ease}
@media (max-width:340px){.ct-tag{display:none}}
@media (hover:none) and (pointer:coarse){
  :root{--row:40px;--subrow:28px}
  .ct-fold{opacity:1}
  .ct-copy{width:36px;height:36px;margin-block:-6px}
}
@media (prefers-reduced-motion:reduce){
  .ct *,.ct *::before,.ct *::after{animation:none!important;transition:none!important}
  .ct-status{color:var(--accent);background:none}
}
.hint{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}
</style>

      wire.innerHTML = '<svg class="ct-bend" viewBox="0 0 28 14" width="28" height="14" aria-hidden="true"><path d="M9 0 C9 8 21 6 21 14"/></svg>' +
        '<span class="ct-spine"></span>' +
        '<svg class="ct-bend ct-bend-in" viewBox="0 0 28 14" width="28" height="14" aria-hidden="true"><path d="M21 0 C21 8 9 6 9 14"/></svg>';
      li.appendChild(wire);
      var subs = el("div", "ct-subs");
      if (isExpanded) subs.setAttribute("data-open", "");
      if (!isExpanded) subs.setAttribute("inert", "");
      var sublist = el("ul", "ct-sublist");
      sublist.setAttribute("aria-label", stripTicks(c.message));
      kids.forEach(function (s, si) {
        var sOpen = state.openId === s.id;
        var sub = el("li", "ct-sub");
        if (sOpen) sub.setAttribute("data-open", "");
        var srow = el("button", "ct-subrow");
        srow.type = "button";
        srow.setAttribute("data-ct-row", "");
        srow.title = s.author.name + (s.coAuthor ? " with " + s.coAuthor.name : "");
        srow.setAttribute("aria-expanded", String(sOpen));
        srow.setAttribute("aria-controls", rowId + "-" + si);
        srow.addEventListener("click", function () {
          state.openId = sOpen ? null : s.id;
          render();
        });
        srow.addEventListener("keydown", function (ev) { rowKeyHandler(ev, s, false, sOpen, false); });
        srow.appendChild(el("span", "ct-dot"));
        var sm = el("span", "ct-submsg");
        sm.title = stripTicks(s.message) || "No message";
        var sb = el("bdi");
        if (s.message) sb.appendChild(renderMessage(s.message));
        else sb.textContent = "No message";
        sm.appendChild(sb);
        srow.appendChild(sm);
        srow.appendChild(el("span", "ct-sr", " \u2013 " + srow.title));
        var sk = kindPill(s.kind);
        if (sk) srow.appendChild(sk);
        srow.appendChild(el("span", "ct-detail", relTime(s.time, now, "now")));
        sub.appendChild(srow);
        sub.appendChild(detailsBox(s, sOpen, true, rowId + "-" + si));
        sublist.appendChild(sub);
      });
      subs.appendChild(sublist);
      li.appendChild(subs);
    } else if (!c.pending) {
      li.appendChild(detailsBox(c, isOpen, false, rowId));
    }
    listEl.appendChild(li);
  });
  prevIds = commits.map(function (c) { return c.id; });
}

/* ---------- live loop (original timings) ---------- */
var loopTimer = null;
function scheduleLoop() {
  if (loopTimer) clearTimeout(loopTimer);
  if (reducedMotion()) {
    state.step = LOOP_STEPS.length - 1;
    render();
    return;
  }
  loopTimer = setTimeout(function () {
    if (state.branch === "main" && !state.openId && !state.paused) {
      if (state.step === LOOP_STEPS.length - 1) {
        state.step = 0; state.cycle++;
        state.seenLive = {};
      } else {
        state.step++;
      }
      render();
    }
    scheduleLoop();
  }, LOOP_STEPS[state.step][2]);
}

/* refresh relative times every 30s (original cadence) */
setInterval(function () { render(); }, 30000);

/* pause the loop while focus is inside (original: focus pauses live updates) */
document.addEventListener("focusin", function (ev) {
  if (ctRoot.contains(ev.target)) state.paused = true;
});
document.addEventListener("focusout", function (ev) {
  if (!ctRoot.contains(ev.relatedTarget)) state.paused = false;
});
document.addEventListener("pointerdown", function (ev) {
  if (!branchWrap.contains(ev.target) && state.menuOpen) {
    state.menuOpen = false; paintBranchPicker();
  }
});

/* ---------- theme toggle ---------- */
var themeBtn = $("#themeBtn"), themeIcon = $("#themeIcon");
var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
var MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function paintTheme() {
  var dark = document.documentElement.getAttribute("data-theme") === "dark";
  themeIcon.innerHTML = dark ? SUN : MOON;
  themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}
themeBtn.addEventListener("click", function () {
  var root = document.documentElement;
  root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  paintTheme();
});
(function initTheme() {
  var root = document.documentElement;
  try {
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      root.setAttribute("data-theme", "dark");
    }
  } catch (e) {}
  paintTheme();
})();

/* expose a hook for the headless harness */
window.__ct = {
  state: state,
  commits: visibleCommits,
  advance: function () {
    state.step = (state.step + 1) % LOOP_STEPS.length;
    render();
  },
  render: render,
  relTime: relTime,
  pixelBits: pixelBits
};

render();
scheduleLoop();
</script>
</body>
