<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/*noflash*/(function(){try{var k="logo-cluster-theme";var t=null;try{t=localStorage.getItem(k)}catch(e){}if(!t){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<meta name="color-scheme" content="light dark">
<title>Logo Cluster — affectUI replica</title>
<style>
:root{
  --surface:#ffffff;
  --page:#fafaf9;
  --ink:#171717;
  --ink-soft:#1c1917;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --radius-lg:16px;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --good:#16a34a;
  --warn:#f59e0b; --warn-bg:#fef3c7; --warn-ink:#92400e;
}
html[data-theme="dark"]{
  --surface:#1c1c1f;
  --page:#101012;
  --ink:#ededed;
  --ink-soft:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);
  --warn:#fbbf24; --warn-bg:#451a03; --warn-ink:#fde68a;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  min-height:100vh; display:flex; justify-content:center; padding:28px 16px;
}
.card{
  width:100%; max-width:560px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px 16px 12px;
}
.head{display:flex; align-items:flex-start; gap:12px}
.title{font-size:15px; font-weight:650; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.meta{font-size:12.5px; color:var(--muted); margin:2px 0 0}
.spacer{flex:1}
.iconbtn{
  appearance:none; border:1px solid var(--border); background:var(--subtle); color:var(--ink);
  border-radius:999px; min-width:34px; height:34px; padding:0 10px; font-size:15px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
  transition:transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
}
.iconbtn:focus-visible{outline:2px solid var(--warn); outline-offset:2px}
.controls{display:flex; gap:8px; margin:12px 0 4px; flex-wrap:wrap}
.btn{
  appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:7px 14px 7px 12px; font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px;
  transition:transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
}
.btn:focus-visible{outline:2px solid var(--warn); outline-offset:2px}
.btn .tri{font-size:10px; transform:translateX(1px)}
.stage{
  background:var(--subtle); border:1px solid var(--border);
  border-radius:var(--radius); padding:26px 12px; margin-top:10px;
  display:flex; justify-content:center;
}
/* ---- cluster (own implementation of the described behaviour) ---- */
.cluster{
  --bub:#ffffff; --mid:#ffffff; --ring:rgba(0,0,0,.06);
  --sh:0 1px 2px rgba(0,0,0,.05),0 8px 20px -8px rgba(0,0,0,.12);
  --sh-hi:0 2px 4px rgba(0,0,0,.06),0 14px 28px -10px rgba(0,0,0,.18);
  --cink:#171717;
  --pop:cubic-bezier(.34,1.56,.64,1);
  --orbit:48s;
  container-type:inline-size; width:100%; max-width:420px; aspect-ratio:1;
}
html[data-theme="dark"] .cluster{
  --bub:#232326; --mid:#2a2a2e; --ring:rgba(255,255,255,.08);
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 20px -8px rgba(0,0,0,.6);
  --sh-hi:0 2px 4px rgba(0,0,0,.45),0 14px 28px -10px rgba(0,0,0,.7);
  --cink:#ededed;
}
.cframe{--u:calc(100cqw / 320); position:relative; width:100%; height:100%}
.cmid{
  position:absolute; left:50%; top:50%; z-index:1;
  display:grid; place-items:center;
  width:calc(132 * var(--u)); height:calc(132 * var(--u));
  translate:-50% -50%; border-radius:50%;
  background:var(--mid); box-shadow:0 0 0 1px var(--ring),var(--sh);
  color:var(--cink); opacity:0; scale:.6;
}
.cmid svg{width:36%; height:auto; display:block}
.cluster[data-on] .cmid{animation:cmid-in 420ms var(--pop) both}
.corbit{position:absolute; inset:0}
.cluster[data-on] .corbit{animation:cspin var(--orbit) linear .8s infinite}
.cbub{
  position:absolute; left:50%; top:50%;
  width:calc(1 * var(--u) * var(--sz)); height:calc(1 * var(--u) * var(--sz));
  margin:calc(-.5 * var(--u) * var(--sz)) 0 0 calc(-.5 * var(--u) * var(--sz));
  opacity:0; translate:0 0; scale:.3;
}
.cluster[data-on] .cbub{animation:cout 520ms var(--pop) var(--dl) both}
.cface{
  display:grid; place-items:center; width:100%; height:100%; border-radius:50%;
  background:var(--bub); box-shadow:0 0 0 1px var(--ring),var(--sh);
  outline:1px solid rgba(0,0,0,.10); outline-offset:-1px;
  transition:scale 260ms var(--pop),box-shadow 260ms ease;
}
html[data-theme="dark"] .cface{outline-color:rgba(255,255,255,.10)}
.cluster[data-on] .cface{animation:cspin var(--orbit) linear .8s infinite reverse}
.cface svg{width:52%; height:52%; display:block}
.cluster[data-held] .corbit,.cluster[data-held] .cface{animation-play-state:paused}
.cbub[data-ink="auto"]{color:var(--cink)}
@keyframes cmid-in{to{opacity:1; scale:1}}
@keyframes cout{
  0%{opacity:0; translate:0 0; scale:.3}
  25%{opacity:1}
  100%{opacity:1; translate:calc(1 * var(--u) * var(--px)) calc(1 * var(--u) * var(--py)); scale:1}
}
@keyframes cspin{to{rotate:360deg}}
.status{font-size:12.5px; color:var(--muted); margin:10px 2px 0; min-height:18px}
.legend{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px; padding:0; list-style:none}
.legend li{
  font-size:12px; color:var(--ink-soft); background:var(--subtle);
  border:1px solid var(--border); border-radius:999px; padding:3px 10px 3px 8px;
  display:inline-flex; align-items:center; gap:6px; max-width:100%;
}
.legend li span.n{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dot{width:10px; height:10px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.note{font-size:12.5px; color:var(--muted); margin:8px 2px 2px}
@media (prefers-reduced-motion:reduce){
  .cluster .cmid,.cluster .cbub,.cluster .cface,.cluster .corbit{animation:none !important; opacity:1 !important; scale:1 !important}
  .cluster .cface{transition:none}
  .cluster .cbub{translate:calc(1 * var(--u) * var(--px)) calc(1 * var(--u) * var(--py))}
}
@media (hover:hover) and (pointer:fine){
  .iconbtn:hover{transform:translateY(-1px); box-shadow:var(--shadow)}
  .btn:hover{transform:translateY(-1px); box-shadow:var(--shadow)}
  .cface:hover{scale:1.12; box-shadow:0 0 0 1px var(--ring),var(--sh-hi)}
}
@media (max-width:480px){ .stage{padding:14px 4px} }
</style>
</head>
<body>
<main class="card" aria-labelledby="t">
  <div class="head">
    <div>
      <h1 class="title" id="t">Logo Cluster</h1>
      <p class="meta" id="sub">Central mark on a white disc with company logos bouncing out and settling around.</p>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
  </div>
  <div class="controls">
    <button class="btn" id="replayBtn" type="button"><span class="tri">▶</span> Replay entrance</button>
    <button class="btn" id="pauseBtn" type="button" aria-pressed="false"><span class="tri">❚❚</span> <span id="pauseLabel">Pause orbit</span></button>
  </div>
  <div class="stage">
    <div class="cluster" id="cluster" role="img" aria-label="The affectUI mark with company logos bouncing out around it">
      <div class="cframe" id="frame" aria-hidden="true">
        <div class="corbit" id="orbit"></div>
        <span class="cmid" id="mid"></span>
      </div>
    </div>
  </div>
  <p class="status" id="status" role="status" aria-live="polite">Preparing cluster…</p>
  <ul class="legend" id="legend"></ul>
  <p class="note">Illustration · Card illustrations · Free · Hover a logo to lift it · Scrolls pause off-screen.</p>
</main>
<script>
(function(){
"use strict";
var THEME_KEY="logo-cluster-theme";
var root=document.documentElement;
/* Demo data verbatim from the demo chunk: [name, x, y, size] in 320-unit space. */
var ITEMS=[
  ["Notion",-29,-97,56],
  ["Spotify",82,-67,48],
  ["Stripe",96,-14,72],
  ["Google Calendar",53,86,60],
  ["Linear",-63,70,42],
  ["GitHub",-120,66,60],
  ["Figma",-93,-1,72]
];
/* Brand colours verbatim from the demo chunk (currentColor = page ink). */
var COLORS={
  "Notion":"currentColor","Spotify":"#1ED760","Stripe":"#635BFF",
  "Google Calendar":"#4285F4","Linear":"#5E6AD2","GitHub":"currentColor","Figma":"#F24E1E"
};
/* Short glyph per logo — own simple letter marks (clean-room; not copied paths). */
var GLYPH={"Notion":"N","Spotify":"S","Stripe":"S","Google Calendar":"G","Linear":"L","GitHub":"G","Figma":"F"};
var NS="http://www.w3.org/2000/svg";
var cluster=document.getElementById("cluster");
var orbit=document.getElementById("orbit");
var frame=document.getElementById("frame");
var mid=document.getElementById("mid");
var statusEl=document.getElementById("status");
var legend=document.getElementById("legend");
var themeBtn=document.getElementById("themeBtn");
var replayBtn=document.getElementById("replayBtn");
var pauseBtn=document.getElementById("pauseBtn");
var pauseLabel=document.getElementById("pauseLabel");
var bubbles=[]; var startedAt=0; var landed=0; var rafId=0; var spinDeg=0; var lastTick=0;
function el(tag,cls){var d=document.createElement(tag); if(cls)d.className=cls; return d;}
function svgMark(letter,color){
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 24 24");
  var t=document.createElementNS(NS,"text");
  t.setAttribute("x","12"); t.setAttribute("y","16.5");
  t.setAttribute("text-anchor","middle"); t.setAttribute("font-size","13");
  t.setAttribute("font-weight","700"); t.setAttribute("font-family","system-ui,sans-serif");
  t.setAttribute("fill",color==="currentColor"?"currentColor":color);
  t.textContent=letter;
  svg.appendChild(t);
  return svg;
}
function midMark(){
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 100 76");
  function rect(x,y,w,h,r){var e=document.createElementNS(NS,"rect");e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("width",w);e.setAttribute("height",h);e.setAttribute("rx",r);e.setAttribute("fill","currentColor");return e;}
  svg.appendChild(rect(0,0,100,20,5));
  svg.appendChild(rect(0,28,58,20,5));
  svg.appendChild(rect(0,56,100,20,5));
  return svg;
}
/* Build once at init. Timers only touch text/attributes of existing nodes. */
function build(){
  mid.appendChild(midMark());
  for(var k=0;k<ITEMS.length;k++){
    (function(idx){
      var name=ITEMS[idx][0], x=ITEMS[idx][1], y=ITEMS[idx][2], sz=ITEMS[idx][3];
      var c=COLORS[name]||"currentColor";
      var b=el("span","cbub");
      b.setAttribute("data-name",name);
      b.style.setProperty("--px",String(x));
      b.style.setProperty("--py",String(y));
      b.style.setProperty("--sz",String(sz));
      b.style.setProperty("--dl",(0.18+idx*0.045).toFixed(3)+"s");
      if(c==="currentColor"){b.setAttribute("data-ink","auto");}
      else{b.style.color=c;}
      var f=el("span","cface");
      f.appendChild(svgMark(GLYPH[name]||name.charAt(0),c));
      f.setAttribute("title",name);
      b.appendChild(f);
      orbit.appendChild(b);
      bubbles.push(b);
      var li=document.createElement("li");
      var dot=document.createElement("i"); dot.className="dot";
      dot.style.background=(c==="currentColor"?"var(--muted)":c);
      var nm=document.createElement("span"); nm.className="n"; nm.textContent=name;
      li.appendChild(dot); li.appendChild(nm);
      legend.appendChild(li);
    })(k);
  }
}
function fmt(n){return String(n);}
function tick(ts){
  if(!startedAt)startedAt=ts;
  if(!lastTick)lastTick=ts;
  var dt=(ts-lastTick)/1000; lastTick=ts;
  if(!cluster.hasAttribute("data-held")){spinDeg=(spinDeg+dt*(360/48))%360;}
  var done=Math.min(bubbles.length,Math.floor((ts-startedAt-180)/45)+1);
  if(done<0)done=0;
  if(done!==landed){
    landed=done;
    statusEl.textContent=fmt(landed)+" / "+fmt(bubbles.length)+" logos landed · orbit "+fmt(Math.round(spinDeg))+"°";
  }else if(landed>=bubbles.length){
    var deg=fmt(Math.round(spinDeg));
    var cur=fmt(landed)+" / "+fmt(bubbles.length)+" logos landed · orbit "+deg+"°";
    if(statusEl.textContent!==cur)statusEl.textContent=cur;
  }
  rafId=requestAnimationFrame(tick);
}
function show(){
  startedAt=0; landed=-1; lastTick=0;
  statusEl.textContent="0 / "+bubbles.length+" logos landed · orbit 0°";
  cluster.setAttribute("data-on","");
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(tick);
}
function replay(){
  /* In-place restart: same nodes, just re-trigger CSS animations. */
  cluster.removeAttribute("data-on");
  void cluster.offsetWidth;
  show();
}
function setTheme(t){
  root.setAttribute("data-theme",t);
  try{localStorage.setItem(THEME_KEY,t);}catch(e){}
  themeBtn.setAttribute("aria-label",(t==="dark"?"Switch to light mode":"Switch to dark mode"));
}
replayBtn.addEventListener("click",replay);
pauseBtn.addEventListener("click",function(){
  var held=cluster.hasAttribute("data-held");
  if(held){cluster.removeAttribute("data-held"); pauseBtn.setAttribute("aria-pressed","false"); pauseLabel.textContent="Pause orbit";}
  else{cluster.setAttribute("data-held",""); pauseBtn.setAttribute("aria-pressed","true"); pauseLabel.textContent="Resume orbit";}
});
themeBtn.addEventListener("click",function(){
  setTheme(root.getAttribute("data-theme")==="dark"?"light":"dark");
});
if("IntersectionObserver" in window){
  var io=new IntersectionObserver(function(entries){
    for(var i=0;i<entries.length;i++){
      if(entries[i].isIntersecting){cluster.removeAttribute("data-held");}
      else{cluster.setAttribute("data-held","");}
    }
  },{threshold:0.35});
  io.observe(cluster);
}
build();
setTheme(root.getAttribute("data-theme")||"light");
requestAnimationFrame(function(){show();});
window.__cluster={items:ITEMS,colors:COLORS,get bubbles(){return bubbles;},statusEl:statusEl,cluster:cluster,replay:replay,setTheme:setTheme,orbit:orbit};
})();
</script>
</body>
</html>
