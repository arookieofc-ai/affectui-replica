<style>
:root{color-scheme:light dark}
html{-webkit-tap-highlight-color:transparent}
html[data-theme="light"]{

--accent:#2563eb;--accent-soft:#eff6ff;
--amber:#f59e0b;--amber-bg:#fef3c7;--amber-tx:#92400e;
--ok:#16a34a;--fail:#dc2626;--line:#82BCFF;
--avatar-ring:rgba(0,0,0,.08);
}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--ink2:#ededed;--muted:#a1a1aa;--subtle:#26262a;--border:#2e2e33;
--r-lg:16px;--r:10px;--r-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.45);
--shadow-lg:0 2px 8px rgba(0,0,0,.55),0 14px 36px rgba(0,0,0,.5);
--accent:#60a5fa;--accent-soft:#17233a;
--amber:#fbbf24;--amber-bg:#451a03;--amber-tx:#fde68a;
--ok:#4ade80;--fail:#f87171;--line:#5b9cf5;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

}
[hidden]{display:none!important}
.page{max-width:1120px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.titlewrap h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.counts{font-size:12.5px;color:var(--muted);white-space:nowrap}

.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--subtle);border:1px solid var(--border);border-radius:999px;padding:7px 12px 7px 10px;cursor:pointer;transition:transform 150ms ease,box-shadow 150ms ease,background 150ms ease}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn{width:34px;height:34px;padding:6px 6px 6px 4px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.context{display:flex;align-items:center;gap:10px;margin:12px 2px 10px}
.bar{position:relative;flex:1;height:3px;background:var(--subtle);border-radius:999px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:999px}
.ctxlabel{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phaselabel,.clock{font-size:12px;color:var(--muted);white-space:nowrap}

.scene{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.scene-inner{position:relative;aspect-ratio:2312/1644;width:100%}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle 2px at 2px 2px,var(--border) 99%,transparent 100%);background-size:22px 22px;opacity:.7;pointer-events:none}
.edge-svg{position:absolute;inset:0;width:100%;height:100%}
.edge{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;opacity:0;transition:opacity 200ms ease}
.edge.on{opacity:1}
.edge.draw{stroke-dasharray:12 10}
.edge.solid{stroke-dasharray:none}
.edge.hl{stroke-width:7}
.edgedot{fill:var(--surface);stroke:var(--line);stroke-width:5;opacity:0;transition:opacity 200ms ease}
.edgedot.on{opacity:1}
.hand{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--accent);opacity:0;transform:translate(0,0) scale(1);transition:opacity 200ms ease;box-shadow:var(--shadow-lg);z-index:5;pointer-events:none}

.card{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:12px 14px 14px;min-width:0;opacity:0;transform:translateY(10px);transition:opacity 200ms ease,transform 200ms ease,box-shadow 150ms ease;cursor:pointer}
.card.on{opacity:1;transform:none}
.card.settled{transform:none}
.card.hl{box-shadow:var(--shadow-lg)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card h2{font-size:14px;margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{margin:3px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pill{display:inline-flex;align-items:center;background:var(--amber-bg);color:var(--amber-tx);border:1px solid var(--border);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap}
html[data-theme="light"] .pill{border-color:#FFEBB9}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.tool{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none;border:1px solid var(--border);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}

.avatars{display:flex;align-items:center}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-left:-7px;border:2px solid var(--surface);box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
html[data-theme="dark"] .avatar{box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}

.avatar.k{background:#FDE8E8;color:#9f1239}

html[data-theme="dark"] .avatar.p{background:#2E2653;color:#c4b5fd}
html[data-theme="dark"] .avatar.k{background:#59274B;color:#f9a8d4}

.vline{width:1px;align-self:stretch;background:var(--border);min-height:18px}

.detail{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(520px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:14px 16px 16px;z-index:40}

});
el.addEventListener("mouseenter",function(){hlLinks(d.kind,true);});
el.addEventListener("mouseleave",function(){hlLinks(d.kind,false);});
el.addEventListener("focus",function(){hlLinks(d.kind,true);});
el.addEventListener("blur",function(){hlLinks(d.kind,false);});
scene.appendChild(el);
cards[d.id]=el;
return el;
}
var LINKS={client:["e-client-task","d-client-task"],task:["e-client-task","d-client-task","e-task-notes","d-task-notes","e-task-roles","e-sub","e-addon"],notes:["e-task-notes","d-task-notes"],roles:["e-task-roles","e-roles-pm","d-roles-pm"],pm:["e-roles-pm","d-roles-pm"],ux:[],subs:["e-addon"],sub1:["e-sub"]};
function hlLinks(kind,on){
var ids=LINKS[kind]||[];
ids.forEach(function(id){
var el=edges[id];
if(!el)return;
var c=el.getAttribute("class")||"";
var hasOn=c.indexOf("on")>=0;
setEdge(id,hasOn,on);
});
var map={client:"c-client",task:"c-task",notes:"c-notes",roles:"c-roles",pm:"c-pm",ux:"c-ux",subs:"c-subs",sub1:"c-sub1"};
Object.keys(map).forEach(function(k){
var n=cards[map[k]];
if(!n)return;
if(on&&(LINKS[kind]||[]).some(function(id){return (LINKS[k]||[]).indexOf(id)>=0;})){n.classList.add("hl");}
else{n.classList.remove("hl");}
});
}
var workingEl=document.getElementById("workingCount");
var phaseEl=document.getElementById("phaseLabel");
var clockEl=document.getElementById("clock");
var fillEl=document.getElementById("ctxFill");
var loopEl=document.getElementById("loopLabel");
var hand=document.getElementById("hand");
var detail=document.getElementById("detail");
var detailTitle=document.getElementById("detailTitle");
var detailSub=document.getElementById("detailSub");
var detailExtra=document.getElementById("detailExtra");
var detailClose=document.getElementById("detailClose");
function onCardPress(ev){var id=this.getAttribute("id");var d=null;for(var i=0;i<DATA.cards.length;i++){if(DATA.cards[i].id===id){d=DATA.cards[i];break;}}if(d)openDetail(d);}
function openDetail(d){
detailTitle.textContent=d.title;
detailSub.textContent=d.sub?d.sub+" — "+d.extra:d.extra;
detailExtra.textContent="Unify · Web Design · "+d.extra;
detail.hidden=false;
}
function closeDetail(){detail.hidden=true;}
detailClose.addEventListener("pointerdown",function(ev){ev.stopPropagation();closeDetail();},{capture:true});
detailClose.addEventListener("click",function(ev){closeDetail();});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!detail.hidden){closeDetail();}});
scene.addEventListener("pointerdown",function(ev){if(!detail.hidden&&!detail.contains(ev.target)){closeDetail();}},{capture:true});
DATA.cards.forEach(buildCard);
var timers=[];
var startT=Date.now();
var loopN=1;
var LOOP_MS=7500;
function later(ms,fn){var id=setTimeout(fn,ms);timers.push(id);return id;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];if(window.__pfTick){clearInterval(window.__pfTick);window.__pfTick=null;}}
function setStatus(id,txt,cls){
var el=cards[id];
if(!el)return;
var s=el.querySelector(".status");
if(!s)return;
if(s.textContent!==txt)s.textContent=txt;
var want="status "+cls;
if(s.getAttribute("class")!==want)s.setAttribute("class",want);
}
function show(id,status){
var el=cards[id];
if(!el)return;
if(!el.classList.contains("on"))el.classList.add("on");
if(status)setStatus(id,status==="done"?"done":status,status==="done"?"idle":status);
}
function setWorking(n){
var t=n+" working";
if(workingEl.textContent!==t)workingEl.textContent=t;
}
function setPhase(n,total){
var t="Step "+n+" / "+total;
if(phaseEl.textContent!==t)phaseEl.textContent=t;
}
function startClock(){
startT=Date.now();
if(window.__pfTick)clearInterval(window.__pfTick);
window.__pfTick=setInterval(function(){
var e=(Date.now()-startT)/1000;
var s="T+"+(e<10?"0":"")+e.toFixed(1)+"s";
if(clockEl.textContent!==s)clockEl.textContent=s;
var p=Math.min(100,(Date.now()-startT)/LOOP_MS*100);
fillEl.style.width=p.toFixed(1)+"%";
},100);
}
function reset(){
Object.keys(cards).forEach(function(k){
var el=cards[k];
el.classList.remove("on");el.classList.remove("settled");el.classList.remove("hl");
});
Object.keys(edges).forEach(function(k){setEdge(k,false,false);});
hand.setAttribute("class","hand");
hand.style.left="36%";hand.style.top="42%";
Object.keys(cards).forEach(function(k){setStatus(k,"idle","idle");});
setWorking(1);setPhase(1,8);
}
function play(){
clearTimers();
reset();
startClock();
loopEl.textContent="Loop "+loopN+" · playing";
later(0,function(){show("c-client","working");setStatus("c-client","working","working");setWorking(1);setPhase(1,8);});
later(450,function(){setEdge("d-client-task",true,false);});
later(600,function(){setEdge("e-client-task",true,false);});
later(850,function(){show("c-task","working");setStatus("c-client","done","idle");setStatus("c-task","working","working");setWorking(2);setPhase(2,8);});
later(1300,function(){setEdge("d-task-notes",true,false);});
later(1500,function(){setEdge("e-task-notes",true,false);setEdge("e-task-roles",true,false);});
later(1750,function(){show("c-notes","working");setStatus("c-notes","working","working");setPhase(3,8);});
later(1800,function(){show("c-roles","idle");setStatus("c-roles","idle","idle");});
later(2100,function(){show("c-pm","working");setStatus("c-pm","working","working");setWorking(3);setPhase(4,8);});
later(2500,function(){setEdge("d-roles-pm",true,false);});
later(2650,function(){setEdge("e-roles-pm",true,false);});
later(2900,function(){show("c-ux","working");setStatus("c-ux","working","working");setWorking(2);setPhase(5,8);});
later(3400,function(){
show("c-subs","working");show("c-sub1","working");
setStatus("c-subs","working","working");setStatus("c-sub1","working","working");
setEdge("e-addon",true,false);setEdge("e-sub",true,false);
hand.setAttribute("class","hand on");
hand.style.left="30%";hand.style.top="55%";
setWorking(3);setPhase(6,8);
});
later(4050,function(){setPhase(7,8);});
later(4180,function(){
cards["c-subs"].classList.add("settled");cards["c-sub1"].classList.add("settled");
hand.setAttribute("class","hand on");
});
later(4630,function(){hand.setAttribute("class","hand away");});
later(5050,function(){setEdge("e-sub",true,false);});
later(6000,function(){
["c-client","c-task","c-notes","c-pm","c-ux","c-subs","c-sub1"].forEach(function(id){setStatus(id,"done","idle");});
setStatus("c-roles","idle","idle");
setWorking(2);setPhase(8,8);
loopEl.textContent="Loop "+loopN+" · complete";
});
later(LOOP_MS,function(){loopN++;play();});
}
var toggle=document.getElementById("themeToggle");
function syncToggle(){
var cur=document.documentElement.getAttribute("data-theme")||"light";
toggle.textContent=cur==="dark"?"☀":"☾";
toggle.setAttribute("aria-label",cur==="dark"?"Switch to light theme":"Switch to dark theme");
}
toggle.addEventListener("pointerdown",function(ev){},{capture:true});
toggle.addEventListener("click",function(){
var cur=document.documentElement.getAttribute("data-theme")||"light";
var nxt=cur==="dark"?"light":"dark";
document.documentElement.setAttribute("data-theme",nxt);
try{localStorage.setItem("pf-theme",nxt);}catch(e){}
syncToggle();
});
document.getElementById("replayBtn").addEventListener("click",function(){loopN++;play();});
syncToggle();
play();
window.__pf={play:play,reset:reset,cards:cards,edges:edges,DATA:DATA,get phase(){return phaseEl.textContent;},get loop(){return loopN;}};
})();
</script>
</body>
</html>
