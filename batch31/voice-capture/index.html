<style>
:root{
  --page:#fafaf9; --surface:#ffffff; --ink:#1c1917; --muted:#78716c;
  --subtle:#f5f5f4; --border:#e7e5e4;
  --r-lg:16px; --r:10px; --r-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --accent:#0190fe;
  --vcp-panel:#ffffff; --vcp-well:rgba(0,0,0,.03);
  --vcp-ink:rgba(0,0,0,.82); --vcp-muted:rgba(0,0,0,.4);
  --vcp-bar:rgba(0,0,0,.72); --vcp-key:rgba(0,0,0,.045);
  --vcp-line:rgba(0,0,0,.08); --vcp-rec:#e5484d;
  --vcp-blue:#0190fe; --vcp-purple:#a651f0; --vcp-pink:#ee3e9e;
  --vcp-shadow:0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04),0 12px 32px -14px rgba(0,0,0,.12);
}
html[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --ink:#ededed; --muted:#a1a1aa;
  --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --vcp-panel:#161618; --vcp-well:rgba(255,255,255,.035);
  --vcp-ink:rgba(255,255,255,.86); --vcp-muted:rgba(255,255,255,.4);
  --vcp-bar:rgba(255,255,255,.8); --vcp-key:rgba(255,255,255,.06);
  --vcp-line:rgba(255,255,255,.1);
  --vcp-blue:#4fb0fe; --vcp-purple:#b98af0; --vcp-pink:#f06db5;
  --vcp-shadow:0 0 0 .5px rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.5);
}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:760px; margin:0 auto; padding:20px 16px 48px}
.page-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 16px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow);
}
.page-title{font-size:16px; font-weight:650; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.page-sub{display:flex; align-items:center; gap:8px; margin-top:2px; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.live-dot{width:7px; height:7px; border-radius:50%; background:var(--vcp-rec); flex:none; animation:blink 1.6s ease-in-out infinite}
.count-pill{display:inline-block; padding:1px 9px; border-radius:999px; background:var(--subtle); border:1px solid var(--border); font-size:12px; color:var(--muted)}
.theme-btn{
  flex:none; display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; margin-left:2px; padding:6px 6px;
  background:var(--subtle); color:var(--ink);
  border:1px solid var(--border); border-radius:999px; cursor:pointer;
  transition:transform 160ms ease,background 160ms ease,border-color 160ms ease;
}
.theme-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.theme-btn svg{display:block; width:18px; height:18px}
.demo-card{
  margin-top:12px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow);
  padding:16px; overflow:hidden;
}
.demo-stage{display:flex; justify-content:center; overflow:hidden; border-radius:var(--r); background:var(--page); border:1px solid var(--border); padding:8px}
.demo-status{margin:12px 2px 0; font-size:12.5px; color:var(--muted)}
.demo-status strong{color:var(--ink); font-weight:600}
.hint-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.hint{font-size:12px; color:var(--muted)}
.hint kbd{display:inline-grid; place-items:center; min-width:16px; height:16px; padding:0 4px; border-radius:4px; background:var(--subtle); border:1px solid var(--border); font:inherit; font-size:10.5px; color:var(--muted)}

/* ---- Voice Capture replica (clean-room) ---- */
.vcp{
  --pad:6px; --well-r:14px; --panel-r:20px; /* concentric: 14 + 6 = 20 */
  position:relative; box-sizing:border-box; display:inline-block;
  width:420px; max-width:100%; overflow:hidden; padding:32px 0 76px 32px;
  font-size:12px; line-height:16px; text-align:left; color:var(--vcp-ink);
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 110px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 calc(100% - 110px),transparent 100%);
}
.vcp *,.vcp *::before,.vcp *::after{box-sizing:border-box}
.vcp-stack{position:relative; width:fit-content; max-width:100%}
.vcp-under{position:absolute; z-index:0; top:55%; right:-24px; bottom:-68px; left:-24px; pointer-events:none;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 35%);
  mask-image:linear-gradient(180deg,transparent,#000 35%)}
.vcp-glow{position:absolute; inset:16px 36px 44px; border-radius:40px; filter:blur(28px); opacity:.5;
  background:
    radial-gradient(40% 70% at 18% 50%,var(--vcp-blue),transparent 70%),
    radial-gradient(40% 70% at 52% 45%,var(--vcp-purple),transparent 70%),
    radial-gradient(40% 70% at 86% 40%,var(--vcp-pink),transparent 70%);
  animation:drift 9s ease-in-out infinite alternate}
html[data-theme="dark"] .vcp-glow{opacity:.36}
.vcp-panel{position:relative; z-index:1; display:grid; gap:2px; width:480px; max-width:calc(100vw - 120px); padding:var(--pad) var(--pad) 2px; border-radius:var(--panel-r); background:var(--vcp-panel); box-shadow:var(--vcp-shadow)}
.vcp-well{position:relative; height:80px; overflow:hidden; border-radius:var(--well-r); background:var(--vcp-well)}
.vcp-voice{position:absolute; inset:0; display:block; width:100%; height:100%; color:var(--vcp-bar)}
.vcp-foot{display:flex; align-items:center; gap:12px; height:36px; padding:0 10px; white-space:nowrap}
.vcp-rec{display:inline-flex; align-items:center; gap:6px; min-width:40px; font-weight:500; color:var(--vcp-ink); font-variant-numeric:tabular-nums}
.vcp-dot{width:6px; height:6px; border-radius:50%; background:var(--vcp-rec); animation:blink 1.6s ease-in-out infinite; flex:none}
.vcp-sep{width:1px; height:12px; background:var(--vcp-line); flex:none}
.vcp-act{display:inline-flex; align-items:center; gap:4px; font-weight:450; color:var(--vcp-ink); background:none; border:0; padding:4px 2px; font:inherit; font-size:12px; line-height:16px; cursor:pointer; border-radius:4px}
.vcp-act-quiet{color:var(--vcp-muted)}
.vcp-act kbd{display:inline-grid; place-items:center; min-width:16px; height:16px; padding:0 4px; border-radius:4px; background:var(--vcp-key); font:inherit; font-size:10.5px; color:var(--vcp-muted)}
.vcp-act kbd:first-of-type{margin-left:2px}
.vcp-act:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.vcp[data-still] .vcp-dot,.vcp[data-still] .vcp-glow{animation:none}
@keyframes blink{50%{opacity:.35}}
@keyframes drift{to{transform:translateX(12px) scale(1.04)}}
@media (prefers-reduced-motion: reduce){
  .vcp *,.vcp *::before,.vcp *::after{animation:none !important; transition:none !important}
  .live-dot{animation:none}
}
@media (hover: hover) and (pointer: fine){
  .theme-btn:hover{background:var(--border); transform:translateY(-1px)}
  .demo-card:hover{box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08)}
  .vcp-act:hover{text-decoration:underline; text-underline-offset:2px}
}
@media (max-width:600px){
  .page{padding:12px 10px 32px}
  .vcp{padding:24px 0 56px 16px}
  .vcp-panel{max-width:calc(100vw - 60px)}
  .page-sub{white-space:normal}
}
</style>

<body>
<div class="page">
  <header class="page-head">
    <div style="min-width:0">
      <div class="page-title">Voice Capture</div>
      <div class="page-sub"><span class="live-dot" aria-hidden="true"></span><span id="headCount">1 capturing</span><span class="count-pill">dictation panel</span></div>
    </div>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="Switch to dark theme">
      <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    </button>
  </header>

  <main>
    <section class="demo-card" aria-label="Voice capture demo">
      <div class="demo-stage">
        <div class="vcp" id="vcp">
          <div class="vcp-stack">
            <span class="vcp-under" aria-hidden="true"><span class="vcp-glow" id="vcpGlow"></span></span>
            <div class="vcp-panel" role="region" aria-label="Dictation voice capture">
              <div class="vcp-well"><canvas class="vcp-voice" id="vcpCanvas" aria-hidden="true"></canvas></div>
              <div class="vcp-foot">
                <span class="vcp-rec"><span class="vcp-dot" id="vcpDot" aria-hidden="true"></span><span id="vcpTime">0:07</span></span>
                <span class="vcp-sep" aria-hidden="true"></span>
                <button class="vcp-act" id="vcpDone" type="button">Done <kbd>⌥</kbd><kbd>Space</kbd></button>
                <button class="vcp-act vcp-act-quiet" id="vcpCancel" type="button">Cancel <kbd>Esc</kbd></button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="demo-status" id="vcpStatus">Status: <strong id="vcpState">Listening…</strong> — thin bars rise and fall while time ticks.</p>
      <div class="hint-row">
        <span class="hint">Press <kbd>⌥</kbd> + <kbd>Space</kbd> for Done, <kbd>Esc</kbd> for Cancel.</span>
        <span class="hint" id="vcpNote">Timer starts at 0:07 and ticks every second.</span>
      </div>
    </section>
  </main>
</div>
