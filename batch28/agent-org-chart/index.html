function makeTab(id){ cards.forEach(function(c,k){ c.setAttribute("tabindex",k===id?"0":"-1"); }); }
function refreshAria(){

var st=node.kind==="agent"?effStatus(id):null;
if(st) card.setAttribute("data-status",st); else card.removeAttribute("data-status");

else{ var tools=node.tools||[]; if(tools.length) label+=" uses "+tools.join(", "); var out=escalations.filter(function(e){return e.from===id;}); if(out.length) label+=" "+out.length+" request waiting"; }

function updateHeader(){

var st=node.kind==="agent"?effStatus(id):null;
if(st){ if(card.getAttribute("data-status")!==st) card.setAttribute("data-status",st); if(meta.statusEl){ if(meta.statusEl.getAttribute("data-status")!==st) meta.statusEl.setAttribute("data-status",st); var label=st.charAt(0).toUpperCase()+st.slice(1); if(meta.statusEl.textContent!==label) meta.statusEl.textContent=label; } }

}
}
});

}

var activeId=null, openId=null;

edgeEls.forEach(function(p,id){ var e=cards.get(id); var par=parentOf.get(id); if(activeId&&(chain.has(id)&&chain.has(par))) p.setAttribute("data-on",""); else p.removeAttribute("data-on"); });

}

pop.appendChild(head);
var related=escalations.filter(function(e){ return e.from===id||escTarget(e)===id; });

var facts=el("dl","facts");
function fact(k,v){ var w=el("div",""); var dt=el("dt",""); dt.appendChild(txt(k)); var dd=el("dd",""); dd.setAttribute("dir","auto"); if(typeof v==="string") dd.appendChild(txt(v)); else dd.appendChild(v); w.appendChild(dt); w.appendChild(dd); facts.appendChild(w); }
var par=parentOf.get(id)?byId.get(parentOf.get(id)):null;

if(owner&&(!par||owner.id!==par.id)){ var s1=el("span",""); s1.appendChild(txt(owner.name)); fact("Owner",s1); }

}else if(par){ var s3=el("span",""); s3.appendChild(txt(par.name)); fact("Reports to",s3); }
if(facts.childNodes.length) pop.appendChild(facts);

(node.tools||[]).slice(0,8).forEach(function(t){ var li=document.createElement("li"); var tile=el("span","tile"); tile.appendChild(txt(String(t).charAt(0).toUpperCase())); li.appendChild(tile); var sp=el("span","pop-item"); sp.setAttribute("dir","auto"); sp.appendChild(txt(t)); li.appendChild(sp); ul.appendChild(li); });
pop.appendChild(ul);
}
var owned=node.kind==="person"?agentsOwned(id):(children.get(id)||[]).filter(function(c){return c.kind==="agent";});
if(owned.length){
var lb2=el("span","pop-label"); lb2.appendChild(txt(node.kind==="person"?("Owns "+owned.length+" "+(owned.length===1?"agent":"agents")):(owned.length+" "+(owned.length===1?"sub-agent":"sub-agents")))); pop.appendChild(lb2);
var ul2=el("ul","pop-list");
owned.slice(0,5).forEach(function(o){ var li=document.createElement("li"); li.appendChild(makeMini(o.id,colorOf.get(o.id))); var sp=el("span","pop-item"); sp.setAttribute("dir","auto"); sp.appendChild(txt(o.name)); li.appendChild(sp); var st2=el("span","status"); var s2=effStatus(o.id); st2.setAttribute("data-status",s2); st2.appendChild(txt(s2.charAt(0).toUpperCase()+s2.slice(1))); li.appendChild(st2); ul2.appendChild(li); });
pop.appendChild(ul2);
}

if(related.length){ try{ var pb=pop.querySelector("[data-primary]"); if(pb) pb.focus(); }catch(e){} }

function positionPop(id){
try{
var card=cards.get(id); if(!card||!pop) return;
var cr=card.getBoundingClientRect?card.getBoundingClientRect():null;
var chr=chart.getBoundingClientRect?chart.getBoundingClientRect():null;
if(!cr||!chr||!cr.width) { pop.style.setProperty("left","16px"); pop.style.setProperty("top","70px"); return; }
var pw=284, ph=pop.offsetHeight||260;
var left=cr.left-chr.left+(cr.width/2)-(pw/2);
left=Math.max(8,Math.min(chr.width-pw-8,left));
var below=cr.bottom-chr.top+8, above=cr.top-chr.top-ph-8;
var useAbove=(chr.height-below)<ph&&(above>=0);
pop.style.setProperty("left",Math.round(left)+"px");
pop.style.setProperty("top",Math.round(useAbove?above:below)+"px");
pop.setAttribute("data-side",useAbove?"above":"below");
}catch(e){}
}
function closePop(refocus){ if(!openId) return; var id=openId; openId=null; pop.setAttribute("hidden",""); pop.removeAttribute("data-for"); refreshAria(); if(refocus&&cards.get(id)){ try{cards.get(id).focus();}catch(e){} } }
function resolve(escId){
var e=null; for(var i=0;i<escalations.length;i++) if(escalations[i].id===escId) e=escalations[i];
if(!e) return;
escalations=escalations.filter(function(x){return x.id!==escId;});
statuses[e.from]="working";
announce(((byId.get(e.from)||{}).name||"Agent")+" resolved");
sync();
if(openId) openPop(openId,false);
}
function announce(msg){ if(live.textContent!==msg) live.textContent=msg; }
function sync(){ updateHeader(); updateCards(); drawEdges(); }
function drawEdges(){
try{
if(!lines||!lines.setAttribute) return;
while(lines.firstChild) lines.removeChild(lines.firstChild);
edgeEls.clear();
var r=chart.getBoundingClientRect?chart.getBoundingClientRect():null;
if(!r) return;
var narrow=false; try{ narrow=chart.getAttribute("data-mode")==="list"; }catch(e){}
if(narrow) return;
cards.forEach(function(card,id){
var p=parentOf.get(id); if(!p) return;
var pc=cards.get(p); if(!pc||!pc.getBoundingClientRect) return;
var a=pc.getBoundingClientRect(), b=card.getBoundingClientRect();
if(!a.width||!b.width) return;
var x1=a.left-r.left+a.width/2, y1=a.top-r.top+a.height;
var x2=b.left-r.left+b.width/2, y2=b.top-r.top;
var my=(y1+y2)/2;
var d="M"+x1+","+y1+" L"+x1+","+my+" L"+x2+","+my+" L"+x2+","+y2;
var NS="http://www.w3.org/2000/svg";
var path=document.createElementNS(NS,"path");
path.setAttribute("class","edge");
path.setAttribute("d",d);
lines.appendChild(path);
edgeEls.set(id,path);
});
var w=r.width||800, h=r.height||400;
lines.setAttribute("width",String(w)); lines.setAttribute("height",String(h));
lines.setAttribute("viewBox","0 0 "+w+" "+h);
}catch(e){}
}
function onKey(ev,node){
var ids=order.slice(); var i=ids.indexOf(node.id);
var kids=(children.get(node.id)||[]); var firstKid=kids.length?kids[0].id:null;
var par=parentOf.get(node.id);
var sibs=par?children.get(par):roots; var si=sibs.indexOf(node);
var treeMode=true; try{treeMode=chart.getAttribute("data-mode")!=="list";}catch(e){}
var target=null;
if(ev.key===(treeMode?"ArrowUp":"ArrowLeft")) target=par;
else if(ev.key===(treeMode?"ArrowDown":"ArrowRight")) target=firstKid;
else if(ev.key===(treeMode?"ArrowLeft":"ArrowUp")) target=sibs[si-1]?sibs[si-1].id:(treeMode?null:ids[i-1]);
else if(ev.key===(treeMode?"ArrowRight":"ArrowDown")) target=sibs[si+1]?sibs[si+1].id:(treeMode?null:ids[i+1]);
else if(ev.key==="Home") target=ids[0];
else if(ev.key==="End") target=ids[ids.length-1];
else if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); openPop(node.id,true); return; }
else if(ev.key==="Escape"){ if(openId){ev.preventDefault(); closePop(true);} return; }
else return;
ev.preventDefault(); if(target&&cards.get(target)){ makeTab(target); try{cards.get(target).focus();}catch(e){} setActive(target); }
}
var stepIdx=0, timer=null;
function step(){
var s=STEPS[stepIdx%STEPS.length]; stepIdx=(stepIdx+1)%STEPS.length;
if(s.reset){ Object.keys(INITIAL).forEach(function(k){statuses[k]=INITIAL[k];}); escalations=[]; }
if(s.status){ Object.keys(s.status).forEach(function(k){statuses[k]=s.status[k];}); }
if(s.add){ escalations.push({id:s.add.id+"-"+Date.now(),from:s.add.from,label:s.add.label}); var e2=escalations[escalations.length-1]; var tgt=escTarget(e2)?byId.get(escTarget(e2)):null; announce(((byId.get(e2.from)||{}).name||"An agent")+" asks "+(tgt?tgt.name:"owner")+(e2.label?": "+e2.label:"")); }
if(s.drop){ escalations=escalations.filter(function(x){return x.id.indexOf(s.drop+"-")!==0&&x.id!==s.drop;}); }
sync();
if(openId) openPop(openId,false);
}
function loop(){
if(reduced) return;
if(timer) try{clearTimeout(timer);}catch(e){}
var s=STEPS[stepIdx%STEPS.length];
timer=setTimeout(function(){ step(); loop(); },s.wait);
}
document.addEventListener("pointerdown",function(ev){ try{ if(openId&&pop&&!pop.contains(ev.target)){ var c=null; try{c=ev.target.closest?ev.target.closest(".card"):null;}catch(e){} if(!c) closePop(false); } }catch(e){} },{capture:true});
document.addEventListener("keydown",function(ev){ if(ev.key==="Escape"&&openId){ closePop(true); } });
function fit(){
try{
var w=chart.clientWidth||900;
var mode=w<560?"list":"tree";
if(chart.getAttribute("data-mode")!==mode){ chart.setAttribute("data-mode",mode); drawEdges(); }
}catch(e){}
var ids=order.slice();
}
try{ if(window.ResizeObserver){ var ro=new ResizeObserver(function(){ fit(); drawEdges(); }); ro.observe(chart); } }catch(e){}
try{ window.addEventListener("resize",function(){ drawEdges(); }); }catch(e){}
themeBtn.addEventListener("click",function(){ try{ var cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",cur); try{localStorage.setItem("aoc-theme",cur);}catch(e){} updateHeader(); }catch(e){} });
buildTree(); updateHeader(); updateCards(); fit(); drawEdges(); loop();
window.__aoc={nodes:byId,statuses:statuses,escalations:function(){return escalations;},cards:cards,steps:STEPS,step:step,sync:sync,openPop:openPop,closePop:closePop,setActive:setActive,resolve:resolve,getActive:function(){return activeId;},getOpen:function(){return openId;}};
})();
