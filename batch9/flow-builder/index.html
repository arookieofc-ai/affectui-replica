<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboard new signups · flow-builder</title>
<style>
:root{
  --page:#fafaf9; --surface:#ffffff; --ink:#171717; --ink2:#1c1917;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-pop:0 12px 32px -8px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);
  --work:#0284c7; --work-bg:#e0f2fe; --work-fg:#0c4a6e;
  --ok:#15803d; --ok-bg:#dcfce7; --ok-fg:#166534;
  --wait:#f59e0b; --wait-bg:#fef3c7; --wait-fg:#92400e;
  --idle:#78716c; --idle-bg:#f5f5f4; --idle-fg:#57534e;
  --fail:#dc2626; --fail-bg:#fee2e2; --fail-fg:#991b1b;
  --link:#0284c7; --focus:#2563eb; --mark:#2563eb;
  --card-w:264px;
}
html[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --ink:#ededed; --ink2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.4);
  --shadow-pop:0 12px 32px -8px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5);
  --work:#38bdf8; --work-bg:rgba(56,189,248,.14); --work-fg:#bae6fd;
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.13); --ok-fg:#bbf7d0;
  --wait:#fbbf24; --wait-bg:#451a03; --wait-fg:#fde68a;
  --idle:#a1a1aa; --idle-bg:#26262a; --idle-fg:#d4d4d8;
  --fail:#f87171; --fail-bg:rgba(248,113,113,.14); --fail-fg:#fecaca;
  --link:#4fb0fe; --focus:#6ea8fe; --mark:#6ea8fe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; justify-content:center; padding:20px 12px 40px;
}
.page{width:100%; max-width:860px}
.pagebar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px}
.crumb{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.theme-btn{display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 12px;
  border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; box-shadow:var(--shadow);
  transition:background 150ms ease,transform 150ms ease}
.theme-btn:hover{background:var(--subtle)}
.theme-btn:active{transform:scale(.96)}
.theme-btn:focus-visible,.fb-run:focus-visible,.fb-card:focus-visible,.fb-plus:focus-visible,
.fb-item-btn:focus-visible,.fb-undo:focus-visible,.fb-remove:focus-visible,.fb-start:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
/* ---- component ---- */
.fb{position:relative; display:flex; flex-direction:column; width:100%;
  background:transparent; color:var(--muted); font-size:13px}
.fb-head{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px; margin-bottom:6px}
.fb-name{display:flex; align-items:baseline; gap:8px; min-width:0}
.fb-name h3{margin:0; font-size:15px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fb-name .count{flex:none; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.fb-run{display:inline-flex; flex:none; align-items:center; gap:6px; height:30px; padding:0 14px;
  border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  font-size:13px; font-weight:600; cursor:pointer; box-shadow:var(--shadow);
  transition:background 150ms ease,opacity 150ms ease,transform 150ms ease}
.fb-run:hover:not(:disabled){background:var(--subtle)}
.fb-run:active:not(:disabled){transform:scale(.97)}
.fb-run.solid{background:var(--ink); color:var(--page); border-color:transparent}
.fb-run.solid:hover:not(:disabled){opacity:.88; background:var(--ink)}
.fb-run:disabled{opacity:.45; cursor:default}
.fb-canvas{position:relative; overflow:auto; overscroll-behavior:contain; scrollbar-width:none;
  cursor:grab; border:1px solid var(--border); border-radius:var(--radius-lg);
  background:var(--surface); box-shadow:var(--shadow); max-height:760px}
.fb-canvas::-webkit-scrollbar{display:none}
.fb-canvas.panning{cursor:grabbing; user-select:none}
.fb-flow{display:flex; flex-direction:column; align-items:center; width:max-content; min-width:100%; padding:28px 16px 30px}
.fb-item{display:flex; flex-direction:column; align-items:center}
.fb-step{position:relative; width:var(--card-w); transition:opacity 200ms ease; animation:fb-in 380ms ease both}
.fb-selecting .fb-step:not([data-selected]){opacity:.78}
.fb-card{display:block; width:100%; text-align:start; cursor:pointer; font:inherit; color:inherit;
  background:var(--subtle); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:4px; transition:transform 150ms ease,box-shadow 150ms ease}
.fb-card:hover{box-shadow:var(--shadow)}
.fb-card:active{transform:scale(.985)}
.fb-step[data-selected] .fb-card{box-shadow:0 0 0 2px var(--link)}
.fb-face{position:relative; display:grid; gap:7px; min-height:92px; padding:10px 10px 12px;
  background:var(--surface); border-radius:calc(var(--radius-lg) - 4px); overflow:hidden}
.fb-top{display:flex; align-items:center; gap:8px; min-width:0; min-height:30px}
.fb-tile{display:grid; flex:none; place-items:center; width:26px; height:26px; border-radius:8px;
  background:var(--surface); border:1px solid var(--border); color:var(--ink)}
.fb-step[data-kind="trigger"] .fb-tile{background:var(--ink); color:var(--page); border-color:transparent}
.fb-text{display:grid; flex:1; min-width:0}
.fb-title{font-weight:600; font-size:14px; line-height:17px; color:var(--ink);
  white-space:normal; overflow:visible; overflow-wrap:break-word}
.fb-detail{font-size:12px; line-height:15px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fb-tag{display:inline-flex; flex:none; align-self:start; align-items:center; gap:4px; height:19px; padding:0 7px;
  border-radius:999px; background:var(--idle-bg); color:var(--idle-fg);
  font-size:11px; font-weight:600; line-height:18px; white-space:nowrap}
.fb-tag[data-tone="running"]{background:var(--work-bg); color:var(--work-fg)}
.fb-tag[data-tone="done"]{background:var(--ok-bg); color:var(--ok-fg)}
.fb-tag[data-tone="failed"]{background:var(--fail-bg); color:var(--fail-fg)}
.fb-tag[data-tone="wait"]{background:var(--wait-bg); color:var(--wait-fg)}
.fb-spin{width:10px; height:10px; border-radius:50%; flex:none;
  border:1.5px solid currentColor; border-top-color:transparent; animation:fb-turn 700ms linear infinite; opacity:.9}
.fb-act{font-size:12.5px; line-height:17px; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fb-step[data-status="failed"] .fb-act{color:var(--fail-fg)}
.fb-act.live{background:linear-gradient(90deg,var(--muted) 0 35%,var(--ink) 50%,var(--muted) 65% 100%);
  background-size:260% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:fb-shine 2s linear infinite}
.fb-meter-row{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; height:14px}
.fb-meter{position:relative; overflow:hidden; height:3px; border-radius:2px; background:var(--border)}
.fb-meter i{position:absolute; inset:0; border-radius:inherit; background:var(--link);
  transform:scaleX(0); transform-origin:left; transition:transform 500ms ease}
.fb-meter[data-tone="running"] i{transform:none;
  background:linear-gradient(90deg,transparent,var(--link) 50%,transparent);
  background-size:50% 100%; background-repeat:no-repeat; animation:fb-sweep 1.1s ease-in-out infinite}
.fb-meter[data-tone="done"] i{transform:none; opacity:.75}
.fb-meter[data-tone="failed"] i{transform:none; background:var(--fail)}
.fb-num{min-width:30px; font-size:11px; color:var(--muted); text-align:end; font-variant-numeric:tabular-nums}
.fb-step[data-status="skipped"]{opacity:.78}
.fb-step[data-status="skipped"] .fb-card{background:transparent}
.fb-step[data-status="skipped"] .fb-face{background:transparent; border:1px dashed var(--border)}
.fb-step[data-status="skipped"] .fb-tile{background:transparent}
/* connectors */
.fb-link{position:relative; display:grid; place-items:center; width:24px; height:46px}
.fb-link::before{content:""; position:absolute; top:0; bottom:0; left:50%; width:1.5px; margin-left:-.75px;
  border-radius:1px; background:var(--link); opacity:.55; transform-origin:top; animation:fb-draw 350ms ease both}
.fb-link.end{height:38px; align-items:end}
.fb-link.skipped::before{background:repeating-linear-gradient(var(--link) 0 3px,transparent 3px 6px); opacity:.5}
.fb-link.run::after{content:""; position:absolute; top:0; left:50%; width:1.5px; height:16px; margin-left:-.75px;
  background:linear-gradient(transparent,var(--link)); animation:fb-drop 1s ease-in-out infinite}
.fb-dot{position:absolute; top:-3px; left:50%; width:7px; height:7px; margin-left:-3.5px; border-radius:50%;
  background:var(--surface); border:1.5px solid var(--link)}
.fb-plus{position:relative; z-index:1; display:grid; place-items:center; width:22px; height:22px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border); color:var(--muted); cursor:pointer;
  box-shadow:var(--shadow); transition:transform 150ms ease,color 150ms ease; font-size:14px; line-height:1}
.fb-plus:hover:not(:disabled),.fb-plus[aria-expanded="true"]{transform:scale(1.15) rotate(90deg); color:var(--work); border-color:var(--link)}
.fb-plus:disabled{opacity:0; cursor:default}
/* fork */
.fb-fork{position:relative; padding-top:16px; display:flex; flex-direction:column; align-items:center}
.fb-fork::before{content:""; position:absolute; top:0; left:50%; width:1.5px; height:16px; margin-left:-.75px; background:var(--link); opacity:.55}
.fb-lanes{display:flex; align-items:flex-start}
.fb-lane{position:relative; display:flex; flex-direction:column; align-items:center; padding:20px 14px 0}
.fb-lane::before,.fb-lane::after{content:""; position:absolute; top:0; height:18px; border:0 solid var(--link); opacity:.55}
.fb-lane::before{left:0; right:50%; border-top-width:1.5px}
.fb-lane::after{left:calc(50% - .75px); right:0; border-top-width:1.5px; border-left-width:1.5px}
.fb-lane:first-child::before{display:none}
.fb-lane:first-child::after{border-top-left-radius:10px}
.fb-lane:last-child::after{display:none}
.fb-lane:last-child:not(:first-child)::before{right:calc(50% - .75px); border-right-width:1.5px; border-top-right-radius:10px}
.fb-lane[data-skipped]{opacity:.78}
.fb-lane[data-skipped] .fb-path{text-decoration:line-through}
.fb-path{position:relative; z-index:1; max-width:calc(var(--card-w) - 48px); padding:1px 9px; border-radius:999px;
  background:var(--work-bg); color:var(--work-fg); font-size:12px; font-weight:600; line-height:18px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px}
/* footer */
.fb-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:34px; margin-top:6px; font-size:12.5px; color:var(--muted)}
.fb-note{display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; white-space:nowrap}
.fb-note b{color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis}
.fb-pill{flex:none; padding:0 8px; border-radius:999px; font-size:11px; line-height:19px; font-weight:600}
.fb-pill[data-tone="info"]{background:var(--work-bg); color:var(--work-fg)}
.fb-pill[data-tone="ok"]{background:var(--ok-bg); color:var(--ok-fg)}
.fb-pill[data-tone="alert"]{background:var(--fail-bg); color:var(--fail-fg)}
.fb-note kbd{display:inline-block; min-width:18px; padding:0 4px; border-radius:4px; background:var(--surface);
  border:1px solid var(--border); font:inherit; font-size:11px; line-height:16px; text-align:center}
.fb-undo{display:inline-flex; flex:none; align-items:center; gap:5px; height:28px; padding:0 12px;
  border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  font-size:12.5px; font-weight:600; cursor:pointer; box-shadow:var(--shadow)}
.fb-undo:hover{background:var(--subtle)}
.fb-remove{position:absolute; top:-9px; right:-9px; z-index:2; display:grid; place-items:center;
  width:22px; height:22px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
  color:var(--muted); cursor:pointer; box-shadow:var(--shadow-pop); font-size:12px}
.fb-remove:hover{color:var(--fail)}
/* empty start */
.fb-start{display:flex; align-items:center; gap:10px; width:var(--card-w); min-height:64px; padding:10px 12px;
  border-radius:var(--radius-lg); border:1.5px dashed var(--border); background:transparent; color:var(--muted);
  font:inherit; text-align:start; cursor:pointer}
.fb-start:hover{background:var(--surface); border-color:var(--link)}
.fb-start .fb-title{color:var(--ink)}
/* menu */
.fb-menu{position:absolute; z-index:30; display:grid; width:min(250px,calc(100% - 16px)); max-height:300px; overflow-y:auto;
  padding:4px; border-radius:14px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-pop);
  animation:fb-pop 160ms ease both}
.fb-item-btn{display:flex; align-items:center; gap:10px; min-height:42px; padding:5px 8px; border-radius:8px;
  background:none; border:0; font:inherit; text-align:start; cursor:pointer; color:var(--ink); width:100%}
.fb-item-btn:hover,.fb-item-btn:focus-visible{background:var(--subtle)}
.fb-mi{display:grid; flex:none; place-items:center; width:26px; height:26px; border-radius:8px;
  background:var(--surface); border:1px solid var(--border); color:var(--ink); font-size:13px}
.fb-mt{display:grid; min-width:0}
.fb-mt>span{overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.fb-mt>span:first-child{font-size:13.5px; color:var(--ink); font-weight:600}
.fb-mt>span:last-child{font-size:11.5px; color:var(--muted)}
/* pixel mark: exactly 9 cells */
.fb-mark{display:grid; grid-template-columns:repeat(3,3px); grid-auto-rows:3px; gap:1.5px;
  place-content:center; width:16px; height:16px; flex:none}
.fb-mark i{border-radius:.75px; background:var(--mark); opacity:0; transition:opacity 200ms ease}
.fb-mark i.on{opacity:1}
.fb-mark.busy i{animation:fb-pixel 1.2s ease-in-out infinite}
.fb-mark.busy i:not(.on){opacity:.18}
.fb-svg{width:14px; height:14px; flex:none}
@keyframes fb-pixel{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes fb-turn{to{transform:rotate(360deg)}}
@keyframes fb-sweep{from{background-position:-100% 0}to{background-position:200% 0}}
@keyframes fb-shine{from{background-position:100% 0}to{background-position:0 0}}
@keyframes fb-in{from{opacity:0; transform:translateY(8px) scale(.97)}}
@keyframes fb-draw{from{transform:scaleY(0)}}
@keyframes fb-pop{from{opacity:0; transform:scale(.96) translateY(-3px)}}
@keyframes fb-drop{0%{transform:translateY(-14px); opacity:0}25%{opacity:1}100%{transform:translateY(44px); opacity:0}}
@media (max-width:560px){
  .fb{--card-w:100%}
  .fb-step{width:min(100%,320px)}
  .fb-lanes{flex-direction:column; align-items:stretch; width:100%}
  .fb-lane{padding:14px 0 0}
  .fb-lane::before,.fb-lane::after{display:none}
  .fb-path{max-width:100%}
  body{padding:12px 8px 32px}
}
@media (prefers-reduced-motion:reduce){
  .fb *,.fb *::before,.fb *::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div class="page">
  <div class="pagebar">
    <span class="crumb">flow-builder · clean-room replica</span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">◐ <span id="themeLbl">Dark</span></button>
  </div>
  <section class="fb" id="fb" aria-label="Onboard new signups"></section>
</div>
<script>
(function(){
"use strict";
/* ===== exact demo data extracted from demo-original.js (own re-encoding) ===== */
var DEMO = [
  {id:"signup", kind:"trigger", icon:"form", title:"New signup", detail:"Signup form", note:"Someone signs up on the website"},
  {id:"research", kind:"agent", title:"Research the company", detail:"Claude · web search", note:"Reads their site, finds size and industry"},
  {id:"size", kind:"branch", title:"Company size", detail:"employees > 200", paths:[
    {id:"enterprise", label:"Enterprise", steps:[
      {id:"ping", kind:"action", icon:"slack", title:"Tell sales", detail:"Slack · #new-accounts", note:"Posts the company brief for sales"},
      {id:"deal", kind:"action", icon:"database", title:"Create deal", detail:"CRM · Inbound pipeline", note:"Adds a deal with the research attached"}
    ]},
    {id:"self", label:"Self-serve", steps:[
      {id:"welcome", kind:"action", icon:"mail", title:"Send welcome email", detail:"Gmail · from Flo", note:"A personal welcome, written from the research"},
      {id:"wait", kind:"wait", title:"Wait", detail:"2 days", note:"Gives them time to look around"},
      {id:"tips", kind:"action", icon:"mail", title:"Send tips email", detail:"Gmail · 3 quick wins", note:"Three things worth trying first"}
    ]}
  ]}
];
/* add-step templates (from demo-original ie/ae) */
var TEMPLATES = [
  {kind:"agent", title:"Ask an agent", detail:"Reads, sorts, writes", note:"Tell it what to do in a sentence"},
  {kind:"action", icon:"mail", title:"Send email", detail:"Gmail", note:"Sends one email"},
  {kind:"action", icon:"slack", title:"Post message", detail:"Slack", note:"Posts to a channel"},
  {kind:"action", icon:"database", title:"Update record", detail:"Database", note:"Changes one row"},
  {kind:"action", icon:"http", title:"HTTP request", detail:"Any API", note:"Calls a URL and keeps the answer"},
  {kind:"branch", title:"If / else", detail:"Split into two paths", paths:["Yes","No"]},
  {kind:"wait", title:"Wait", detail:"1 hour", note:"Holds, then carries on"}
];
var TRIGGERS = [
  {kind:"trigger", icon:"webhook", title:"Webhook", detail:"When a request comes in"},
  {kind:"trigger", icon:"schedule", title:"Schedule", detail:"Every day at 9:00"},
  {kind:"trigger", icon:"form", title:"Form submitted", detail:"When someone fills in a form"}
];
var KIND_LABEL = {trigger:"Trigger", action:"Action", agent:"Agent", branch:"If / else", wait:"Wait"};
var STEP_MS = {agent:1700, wait:1000}; /* else 650 */
var START_DELAY = 300, STEP_GAP = 120, AUTO_DELAY = 1200;
function stepMs(n){ return n.kind==="agent" ? 1700 : n.kind==="wait" ? 1000 : 650; }
/* traversal order: follow second path (index min(1,len-1)), skip the others — matches original */
function flatAll(steps){
  var out=[];
  (function walk(list){ for (var k=0;k<list.length;k++){ var n=list[k]; out.push(n);
    (n.paths||[]).forEach(function(p){ walk(p.steps||[]); }); } })(steps||[]);
  return out;
}
function buildSequence(steps){
  var seq=[];
  (function walk(list){
    for (var k=0;k<list.length;k++){
      var r=list[k], paths=r.paths||[];
      var active = paths.length ? paths[Math.min(1,paths.length-1)] : null;
      var skip = paths.filter(function(p){return p!==active;}).reduce(function(a,p){
        a.push(p.id); (p.steps||[]).forEach(function(s){a.push(s.id);}); return a; },[]);
      seq.push({id:r.id, ms:stepMs(r), skip:skip});
      if (active) walk(active.steps||[]);
    }
  })(steps||[]);
  return seq;
}
/* deterministic 3x3 pixel-mark pattern per id (own hash, >=5 cells on) */
var PIX_DELAYS=[0,120,240,120,240,360,240,360,480];
function pixelPattern(id){
  var h=0, i, k;
  for (i=0;i<id.length;i++){ h=((h*31)+id.charCodeAt(i))>>>0; }
  for (var att=0; att<64; att++){
    var bits=[], n=0, x=(h ^ (att*2654435761))>>>0;
    for (k=0;k<9;k++){ var b=((x>>((k*5+att*3)%24))&3)!==0 ? 1 : (((x>>(k+att))&1)); bits.push(b?1:0); if(b)n++; }
    if (n>=5) return bits;
  }
  return [1,0,1,0,1,0,1,0,1];
}
function fmtDur(ms){
  var s=ms/1000;
  if (s<10) return s.toFixed(1)+"s";
  if (s<60) return Math.round(s)+"s";
  return Math.floor(s/60)+"m "+String(Math.round(s%60)).padStart(2,"0")+"s";
}
function plural(n,w){ return n.toLocaleString()+" "+w+(n===1?"":"s"); }
/* tiny stroke icons (own drawings) */
var ICONS={

  var up=below<mh&&above>below;
  state.menu={lane:lane,index:idx,x:x,y:up?(r.top-host.top-6):(r.bottom-host.top+6),up:up,
    max:Math.max(120,Math.min(mh,up?above:below)),label:label,isTrigger:!!isTrigger};
  render();
}
function closeMenu(refocus){ state.menu=null; render(); if(refocus&&refocus.focus){try{refocus.focus({preventScroll:true});}catch(e){}} }
var lastPointerOpener=null;
rootEl.addEventListener("pointerdown",function(e){
  var plus=e.target&&e.target.closest?e.target.closest("[data-plus]"):null;
  if(plus && !plus.disabled){
    /* capture-phase-equivalent: handle on pointerdown before any rebuild can eat the click */
    e.preventDefault();
    lastPointerOpener=plus;
    var lane=plus.getAttribute("data-lane"), idx=+plus.getAttribute("data-index");
    var empty=(lane==="root"&&state.steps.length===0);
    if(state.menu&&state.menu.lane===lane&&state.menu.index===idx){ closeMenu(null); return; }
    openMenu(lane,idx,plus.getAttribute("aria-label")||"Add a step",plus,empty);
    return;
  }
  if(state.menu){
    var inMenu=e.target&&e.target.closest?e.target.closest("[data-menu]"):null;
    if(!inMenu) closeMenu(null);
  }
},true);
rootEl.addEventListener("click",function(e){
  var t=e.target;
  var q=function(s){ return t&&t.closest?t.closest(s):null; };
  var plus=q("[data-plus]");
  if(plus && !plus.disabled){
    if(lastPointerOpener===plus){ lastPointerOpener=null; return; } /* already opened on pointerdown (mouse) */
    var lane=plus.getAttribute("data-lane"), idx=+plus.getAttribute("data-index");
    var empty=(lane==="root"&&state.steps.length===0);
    if(state.menu&&state.menu.lane===lane&&state.menu.index===idx){ closeMenu(null); return; }
    openMenu(lane,idx,plus.getAttribute("aria-label")||"Add a step",plus,empty);
    return;
  }
  lastPointerOpener=null;
  var add=q("[data-add]");
  if(add && state.menu){
    var m=state.menu, items=m.isTrigger?TRIGGERS:TEMPLATES;
    var tpl=items[+add.getAttribute("data-add")];
    state.menu=null; render();
    if(tpl) insertAt(m.lane,m.index,tpl);
    return;
  }
  if(q("[data-run]")){ run(); return; }
  if(q("[data-stop]")){ stopRun(); return; }
  if(q("[data-undo]")){ undo(); return; }
  var rem=q("[data-remove]");
  if(rem){ removeStep(rem.getAttribute("data-remove")); return; }
  var card=q("[data-card]");
  if(card){
    var id=card.getAttribute("data-card");
    state.selected=(state.selected===id?null:id); render();
    return;
  }
});
/* keyboard */
rootEl.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(state.menu){ e.preventDefault(); e.stopPropagation(); closeMenu(null); return; }
    if(state.selected&&!isRunning()){ state.selected=null; render(); }
    return;
  }
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&state.undo.length&&!isRunning()){
    e.preventDefault(); undo(); return;
  }
  var card=e.target&&e.target.closest?e.target.closest("[data-card]"):null;
  if(card){
    var id=card.getAttribute("data-card");
    var cards=[].slice.call(rootEl.querySelectorAll("[data-card]"));
    var i=cards.indexOf(card);
    if(e.altKey&&(e.key==="ArrowUp"||e.key==="ArrowDown")){ e.preventDefault(); if(!isRunning()) moveStep(id,e.key==="ArrowUp"?-1:1); return; }
    if(e.key==="ArrowDown"){ e.preventDefault(); var n=cards[Math.min(cards.length-1,i+1)]; if(n)n.focus(); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); var p=cards[Math.max(0,i-1)]; if(p)p.focus(); return; }
    if(e.key==="Home"){ e.preventDefault(); if(cards[0])cards[0].focus(); return; }
    if(e.key==="End"){ e.preventDefault(); if(cards[cards.length-1])cards[cards.length-1].focus(); return; }
    if((e.key==="Delete"||e.key==="Backspace")&&!isRunning()){ e.preventDefault(); removeStep(id); return; }
  }
  if(state.menu&&(e.target.closest("[data-menu]")||e.target.closest("[data-plus]"))){
    var items=[].slice.call(rootEl.querySelectorAll("[data-menu] [role=menuitem]"));
    var at=items.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){ e.preventDefault(); (items[(at+1+items.length)%items.length]||items[0]).focus(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); (items[(at-1+items.length)%items.length]||items[items.length-1]).focus(); }
    else if(e.key==="Home"){ e.preventDefault(); if(items[0])items[0].focus(); }
    else if(e.key==="End"){ e.preventDefault(); if(items[items.length-1])items[items.length-1].focus(); }
    else if(e.key==="Tab"){ closeMenu(null); }
  }
});
/* canvas pan (drag); plain click on empty canvas deselects */
(function(){
  var drag=null;
  rootEl.addEventListener("pointerdown",function(e){
    var cv=e.target&&e.target.closest?e.target.closest("[data-canvas]"):null;
    if(!cv) return;
    if(e.button!==0||e.pointerType==="touch") return;
    if(e.target.closest("button")) return;
    drag={x:e.clientX,y:e.clientY,l:cv.scrollLeft,t:cv.scrollTop,cv:cv,moved:false};
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
  });
  rootEl.addEventListener("pointermove",function(e){
    if(!drag) return;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    drag.cv.scrollLeft=drag.l-dx; drag.cv.scrollTop=drag.t-dy;
  });
  function end(e){
    if(!drag) return;
    var wasDrag=drag.moved; drag=null;
    if(!wasDrag && state.selected && !(e.target.closest&&e.target.closest("button"))){ state.selected=null; render(); }
  }
  rootEl.addEventListener("pointerup",end);
  rootEl.addEventListener("pointercancel",function(){drag=null;});
})();
/* theme */
var themeBtn=document.getElementById("themeBtn"), themeLbl=document.getElementById("themeLbl");
function paintTheme(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  themeLbl.textContent=dark?"Light":"Dark";
  themeBtn.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
}
themeBtn.addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next=cur==="dark"?"light":"dark";
  try{localStorage.setItem("fb-theme",next);}catch(e){}
  document.documentElement.setAttribute("data-theme",next);
  paintTheme();
});
(function initTheme(){
  var saved=null; try{saved=localStorage.getItem("fb-theme");}catch(e){}
  var theme=saved||((window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");
  document.documentElement.setAttribute("data-theme",theme);
  paintTheme();
})();
/* expose pure logic for the headless harness */
window.__fb={DEMO:DEMO,TEMPLATES:TEMPLATES,TRIGGERS:TRIGGERS,stepMs:stepMs,
  buildSequence:buildSequence,flatAll:flatAll,pixelPattern:pixelPattern,fmtDur:fmtDur,
  AUTO_DELAY:AUTO_DELAY,START_DELAY:START_DELAY,STEP_GAP:STEP_GAP};
/* boot */
render();
requestAnimationFrame(function(){
  var cv=rootEl.querySelector("[data-canvas]");
  if(cv) cv.scrollLeft=(cv.scrollWidth-cv.clientWidth)/2;
});
if(reduced){
  var all=flatAll(state.steps);
  all.forEach(function(n){ state.status[n.id]="done"; });
  ["enterprise","ping","deal"].forEach(function(k){ state.status[k]="skipped"; });
  state.endTimes={}; render();
} else {
  timers.push(setTimeout(run,AUTO_DELAY));
}
})();
</script>
