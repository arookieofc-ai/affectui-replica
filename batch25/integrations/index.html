<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>/*noflash*/(function(){try{var k='ui-integrations-theme';var s=null;try{s=localStorage.getItem(k);}catch(e){}var d=s||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',d);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<title>Integrations — App directory</title>
<style>
:root{color-scheme:light dark}
html[data-theme="light"]{
--surface:#ffffff;--page:#fafaf9;--ink:#1c1917;--text:#44403c;--muted:#78716c;--faint:#a8a29e;
--subtle:#f5f5f4;--border:#e7e5e4;--line-strong:#d6d3d1;--chip:#efefec;--card:#ffffff;--panel:#fafaf9;
--on-ink:#ffffff;--ink-hover:#44403c;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--card-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--amber:#92400e;--amber-bg:#fef3c7;--amber-dot:#f59e0b;--blue:#2563eb;--green:#15803d;--red:#dc2626;
}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--text:#d4d4d8;--muted:#a1a1aa;--faint:#63636b;
--subtle:#26262a;--border:#2e2e33;--line-strong:#3f3f46;--chip:#26262a;--card:#1c1c1f;--panel:#101012;
--on-ink:#101012;--ink-hover:#d4d4d8;--shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.45);
--card-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
--amber:#fde68a;--amber-bg:#451a03;--amber-dot:#fbbf24;--blue:#60a5fa;--green:#4ade80;--red:#f87171;
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;
background:var(--page);color:var(--ink);font-variant-numeric:tabular-nums;transition:background-color 180ms ease,color 180ms ease}
.page{width:min(957px,calc(100% - 64px));margin:0 auto;padding:40px 0 64px}
.page-head{display:flex;align-items:flex-start;gap:12px}
.page-head .titles{flex:1;min-width:0}
h1{margin:0;font-size:22px;line-height:28px;font-weight:650;letter-spacing:-.01em}
.sub{margin:6px 0 0;font-size:13.5px;line-height:19px;color:var(--muted)}
.theme-btn{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:999px;
background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),var(--card-shadow);border:0;cursor:pointer;
transition:box-shadow 160ms ease,background-color 160ms ease,transform 160ms ease;font-size:16px;line-height:1;padding-bottom:2px}
html[data-theme="dark"] .theme-btn{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),var(--card-shadow)}
.theme-btn:focus-visible,.seg button:focus-visible,.add:focus-visible,.more:focus-visible,
.search input:focus-visible,.req-btn:focus-visible,.req-pop input:focus-visible,.req-pop .send:focus-visible,.empty-action:focus-visible{
outline:2px solid var(--blue);outline-offset:2px}
.toolbar{position:sticky;top:0;z-index:5;margin:14px -16px 0;padding:26px 16px 12px;background:var(--panel);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:32px;background:linear-gradient(to bottom,var(--panel),transparent);pointer-events:none}
.seg{display:inline-flex;background:var(--subtle);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:550;
padding:6px 13px 5px;border-radius:999px;cursor:pointer;transition:background-color 160ms ease,color 160ms ease;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
html[data-theme="dark"] .seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.4)}
.toolbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search input{width:254px;max-width:38vw;height:34px;border-radius:9px;border:1px solid var(--border);
background:var(--card);color:var(--ink);padding:0 12px;font:inherit;font-size:13px;box-shadow:none;transition:border-color 160ms ease,box-shadow 160ms ease}
.search input::placeholder{color:var(--faint)}
.req-anchor{position:relative}
.req-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px 1px 11px;border-radius:9px;border:1px solid var(--border);
background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:550;cursor:pointer;box-shadow:var(--card-shadow);
transition:box-shadow 160ms ease,background-color 160ms ease}
.req-btn .plus{font-size:15px;line-height:1;transform:translateY(-.5px)}
.req-pop{position:absolute;right:0;top:calc(100% + 8px);width:260px;padding:14px;border-radius:12px;background:var(--card);
box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.14);z-index:20}
html[data-theme="dark"] .req-pop{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 12px 32px rgba(0,0,0,.6)}
.req-pop form{display:grid;gap:6px}
.req-pop b{font-size:13px;font-weight:600;color:var(--ink)}
.req-pop .hint{font-size:12.5px;color:var(--muted)}
.req-pop input{margin:6px 0 4px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--subtle);
color:var(--ink);padding:0 10px;font:inherit;font-size:13px}
.req-pop .send{height:32px;border-radius:8px;border:0;background:var(--ink);color:var(--on-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;
transition:background-color 160ms ease,opacity 160ms ease;padding-bottom:1px}
.req-pop .send:disabled{opacity:.45;cursor:default}
.sect{margin-top:38px}
.sect + .sect{margin-top:46px}
.sect-title{margin:0;font-size:15px;line-height:20px;font-weight:550;color:var(--ink);min-height:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;margin-top:12px;padding-bottom:4px}
.row{display:flex;align-items:center;gap:12px;min-height:58px;margin:0 -8px;padding:7px 8px;border-radius:12px;
transition:background-color 140ms ease}
.logo{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:var(--card);
color:var(--ink);font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),var(--card-shadow)}
html[data-theme="dark"] .logo{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),var(--card-shadow)}
.logo.tiled{color:#fff}
.row-text{display:grid;gap:2px;flex:1;min-width:0}
.row-name{display:flex;align-items:center;gap:5px;min-width:0;font-size:14px;line-height:19px;font-weight:550;color:var(--ink)}
.row-label{overflow:hidden;min-width:0;white-space:nowrap;text-overflow:ellipsis}
.badge{display:grid;place-items:center;flex:none;color:var(--faint);font-size:11px;width:16px;height:16px}
.row-desc{overflow:hidden;font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.add{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:8px;background:var(--card);
color:var(--text);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),var(--card-shadow);border:0;cursor:pointer;
transition:box-shadow 140ms ease,background-color 160ms ease,color 160ms ease}
html[data-theme="dark"] .add{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),var(--card-shadow)}
.add .glyph{font-size:15px;line-height:1;transform:translateX(.5px);padding-bottom:2px}
.add .glyph.check{font-size:13px}
.add[data-state="on"]{background:var(--ink);color:var(--on-ink);box-shadow:none}
.add[data-state="busy"]{color:var(--muted);pointer-events:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--blue);
animation:rot 700ms linear infinite;display:block}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.add .glyph.pop{animation:pop 260ms ease}
.more{display:inline-flex;align-items:center;gap:10px;max-width:100%;margin-top:8px;padding:4px 10px 4px 4px;
border-radius:10px;border:0;background:transparent;font:inherit;font-size:13px;color:var(--text);cursor:pointer;transition:background-color 140ms ease}
.more-logos{display:flex;padding:3px;border-radius:9px;background:var(--card);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),var(--card-shadow)}
html[data-theme="dark"] .more-logos{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),var(--card-shadow)}
.more-logos .logo{width:20px;height:20px;border-radius:6px;font-size:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
html[data-theme="dark"] .more-logos .logo{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.more-logos .logo + .logo{margin-left:3px}
.more .arrow{color:var(--faint);font-size:14px}
.empty{margin-top:24px;border-radius:var(--radius-lg);background:var(--card);padding:28px 24px;text-align:center;
box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),var(--card-shadow)}
html[data-theme="dark"] .empty{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),var(--card-shadow)}
.empty h2{margin:0;font-size:15px;font-weight:600}
.empty p{margin:8px 0 14px;font-size:13px;color:var(--muted)}
.empty-action{height:32px;padding:0 14px 1px;border-radius:999px;border:1px solid var(--border);background:var(--subtle);
color:var(--ink);font:inherit;font-size:13px;font-weight:550;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--on-ink);
font-size:13px;font-weight:550;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity 180ms ease,transform 180ms ease;z-index:50;max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rise{animation:rise 320ms ease both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:900px){.page{width:calc(100% - 48px)}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){
.page{width:calc(100% - 32px);padding:52px 0 48px}
.toolbar{margin:8px -12px 0;padding:18px 12px 10px}
.toolbar-right{display:contents}
.req-anchor{margin-left:auto}
.sect{margin-top:30px}.sect + .sect{margin-top:36px}
.more{flex-wrap:wrap;text-align:left}
.search input{width:100%}
}
@media (hover: hover) and (pointer: fine){
.row:hover{background:var(--subtle)}
.add:hover{box-shadow:0 0 0 1px var(--line-strong),var(--shadow);color:var(--ink)}
.add[data-state="on"]:hover{background:var(--ink-hover);color:var(--on-ink)}
.more:hover{background:var(--chip)}
.theme-btn:hover{transform:translateY(-1px)}
.req-btn:hover{box-shadow:0 0 0 1px var(--line-strong),var(--shadow)}
.empty-action:hover{background:var(--chip)}
.seg button:hover{color:var(--ink)}
}
</style>
</head>
<body>
<div class="page">
<header class="page-head">
<div class="titles">
<h1>Integrations</h1>
<p class="sub">Connect the tools your team already uses and work with them right in the chat.</p>
</div>
<button class="theme-btn" id="themeToggle" type="button" aria-label="Switch to dark mode">☀</button>
</header>
<div class="toolbar" id="toolbar">
<div class="seg" role="group" aria-label="Filter integrations">
<button type="button" id="segAll" aria-pressed="true">All</button>
<button type="button" id="segConn" aria-pressed="false">Connected</button>
<button type="button" id="segAvail" aria-pressed="false">Available</button>
</div>
<div class="toolbar-right">
<div class="search"><input id="search" type="search" placeholder="Search integrations" aria-label="Search integrations" autocomplete="off"></div>
<div class="req-anchor" id="reqAnchor">
<button class="req-btn" id="reqBtn" type="button" aria-expanded="false" aria-haspopup="dialog"><span class="plus" aria-hidden="true">+</span> Request</button>
<div class="req-pop" id="reqPop" role="dialog" aria-label="Request an integration" hidden>
<form id="reqForm">
<b>Request an integration</b>
<span class="hint">Which tool should we add next?</span>
<input id="reqInput" type="text" placeholder="e.g. Pipedrive" aria-label="Tool name" autocomplete="off">
<button class="send" id="reqSend" type="submit" disabled>Send request</button>
</form>
</div>
</div>
</div>
</div>
<main id="list"></main>
<div class="empty" id="empty" hidden>
<h2 id="emptyTitle">No integrations found</h2>
<p id="emptyText"></p>
<button class="empty-action" id="emptyAction" type="button">Clear search</button>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
"use strict";
var APPS=[
{id:"slack",name:"Slack",vendor:"Slack",description:"Get alerts in your channels and act on them without leaving the conversation.",tile:null,fg:null,essential:true,connected:true},
{id:"notion",name:"Notion",vendor:"Notion",description:"Turn records into pages and keep project docs in sync both ways.",tile:null,fg:null,essential:true,connected:false},
{id:"linear",name:"Linear",vendor:"Linear",description:"Create issues from customer feedback and track them to release.",tile:"#5E6AD2",fg:"#ffffff",essential:true,connected:false},
{id:"figma",name:"Figma",vendor:"Figma",description:"Preview designs inline and link frames to the work they belong to.",tile:null,fg:null,essential:true,connected:false},
{id:"github",name:"GitHub",vendor:"GitHub",description:"Link pull requests and see deploy status next to every task.",tile:"#171717",fg:"#ffffff",essential:true,connected:false},
{id:"stripe",name:"Stripe",vendor:"Stripe",description:"Sync customers, invoices and subscriptions in real time.",tile:"#635BFF",fg:"#ffffff",essential:true,connected:false},
{id:"zapier",name:"Zapier",vendor:"Zapier",description:"Connect 6,000 apps with no-code workflows and triggers.",tile:"#FF4F00",fg:"#ffffff",essential:true,connected:false},
{id:"hubspot",name:"HubSpot",vendor:"HubSpot",description:"Keep contacts, companies and deals matched across both tools.",tile:null,fg:"#FF7A59",essential:false,connected:false},
{id:"zoom",name:"Zoom",vendor:"Zoom",description:"Start meetings from any record and save the recording link.",tile:"#0B5CFF",fg:"#ffffff",essential:false,connected:false},
{id:"discord",name:"Discord",vendor:"Discord",description:"Post updates to community channels when something ships.",tile:"#5865F2",fg:"#ffffff",essential:false,connected:false},
{id:"intercom",name:"Intercom",vendor:"Intercom",description:"See conversations next to the customer and reply from one place.",tile:"#1F8DED",fg:"#ffffff",essential:false,connected:false},
{id:"calendly",name:"Calendly",vendor:"Calendly",description:"Log booked meetings and the answers people gave when booking.",tile:"#006BFF",fg:"#ffffff",essential:false,connected:false},
{id:"typeform",name:"Typeform",vendor:"Typeform",description:"Create records from form answers the moment they come in.",tile:"#262627",fg:"#ffffff",essential:false,connected:false},
{id:"dropbox",name:"Dropbox",vendor:"Dropbox",description:"Attach files from Dropbox and keep shared folders linked.",tile:null,fg:"#0061FF",essential:false,connected:false},
{id:"google-drive",name:"Google Drive",vendor:"Google",description:"Pick files from Drive and preview them without downloading.",tile:null,fg:"#1FA463",essential:false,connected:false},
{id:"google-calendar",name:"Google Calendar",vendor:"Google",description:"See upcoming meetings with every contact in one timeline.",tile:null,fg:"#4285F4",essential:false,connected:false},
{id:"google-analytics",name:"Google Analytics",vendor:"Google",description:"Attribute signups to the campaigns and pages that brought them.",tile:null,fg:"#E37400",essential:false,connected:false},
{id:"make",name:"Make",vendor:"Make",description:"Build visual multi-step automations with branches and filters.",tile:"#6D00CC",fg:"#ffffff",essential:false,connected:false},
{id:"mixpanel",name:"Mixpanel",vendor:"Mixpanel",description:"Send product events and build reports from real usage.",tile:"#7856FF",fg:"#ffffff",essential:false,connected:false},
{id:"paddle",name:"Paddle",vendor:"Paddle",description:"Handle checkout, tax and subscriptions as merchant of record.",tile:"#FDDD35",fg:"#1c1917",essential:false,connected:false},
{id:"jira",name:"Jira",vendor:"Atlassian",description:"Sync issues, statuses and assignees with your Jira projects.",tile:null,fg:"#0052CC",essential:false,connected:false},
{id:"airtable",name:"Airtable",vendor:"Airtable",description:"Mirror bases as tables and keep fields in sync automatically.",tile:null,fg:"#18BFFF",essential:false,connected:false}
];
var byId={};APPS.forEach(function(a){byId[a.id]=a;});
var SECTIONS=[
{title:"Popular",items:["slack","notion","linear","figma","github","hubspot"],more:["stripe","zapier","airtable","jira"]},
{title:"Google",items:["google-drive","google-calendar","google-analytics"],more:[]},
{title:"Communication",items:["zoom","discord","intercom","calendly","typeform","dropbox"],more:["mixpanel","make","paddle"]}
];
function moreLabel(ids){var names=ids.map(function(id){return byId[id].name;});
if(names.length===1)return names[0];
if(names.length===2)return names[0]+" and "+names[1];
return names[0]+", "+names[1]+" and "+(names.length-2)+" more";}
function $(id){return document.getElementById(id);}
var listEl=$("list"),emptyEl=$("empty"),emptyTitle=$("emptyTitle"),emptyText=$("emptyText"),emptyAction=$("emptyAction"),
searchInput=$("search"),segAll=$("segAll"),segConn=$("segConn"),segAvail=$("segAvail"),
reqBtn=$("reqBtn"),reqPop=$("reqPop"),reqForm=$("reqForm"),reqInput=$("reqInput"),reqSend=$("reqSend"),
toastEl=$("toast"),themeBtn=$("themeToggle"),reqAnchor=$("reqAnchor");
var connected=new Set();APPS.forEach(function(a){if(a.connected)connected.add(a.id);});
var busy=new Set(),expanded=new Set(),filter="All",query="",toastTimer=null;
var rowRefs={},secRefs={};
function el(tag,cls){var d=document.createElement(tag);if(cls)d.className=cls;return d;}
function matches(app){
var isConn=connected.has(app.id);
var ok=filter==="All"||((filter==="Connected")===isConn);
if(!ok)return false;
var q=query.trim().toLowerCase();
if(!q)return true;
return (app.name+" "+app.vendor+" "+app.description).toLowerCase().indexOf(q)!==-1;
}
function isFiltering(){return filter!=="All"||query.trim()!=="";}
function paintButton(app){
var r=rowRefs[app.id];if(!r)return;
var btn=r.btn,icon=r.icon;
if(busy.has(app.id)){
btn.setAttribute("data-state","busy");
btn.setAttribute("aria-label","Connecting "+app.name);
btn.title="Connecting\u2026";
icon.className="spin";icon.textContent="";
}else if(connected.has(app.id)){
btn.setAttribute("data-state","on");
btn.setAttribute("aria-label","Disconnect "+app.name);
btn.title="Connected \u2013 click to disconnect";
icon.className="glyph check pop";icon.textContent="\u2713";
}else{
btn.setAttribute("data-state","off");
btn.setAttribute("aria-label","Connect "+app.name);
btn.title="Connect";
icon.className="glyph pop";icon.textContent="+";
}
}
function toast(msg){
toastEl.textContent=msg;
toastEl.hidden=false;
toastEl.classList.add("show");
if(toastTimer)clearTimeout(toastTimer);
toastTimer=setTimeout(function(){toastEl.classList.remove("show");toastEl.hidden=true;},2600);
}
function buildOnce(){
SECTIONS.forEach(function(sec){
var s=el("section","sect");s.setAttribute("data-title",sec.title);
var h=el("h2","sect-title");h.textContent=sec.title;s.appendChild(h);
var grid=el("div","grid");s.appendChild(grid);
sec.items.concat(sec.more).forEach(function(id,idx){
var app=byId[id];if(!app)return;
var row=el("div","row");row.setAttribute("data-id",id);
var logo=el("span","logo"+(app.tile?" tiled":""));
if(app.tile){logo.style.background=app.tile;}
if(app.fg&&!app.tile){logo.style.color=app.fg;}
if(app.fg&&app.tile){logo.style.color=app.fg;}
logo.textContent=app.name.charAt(0).toUpperCase();
logo.setAttribute("aria-hidden","true");
row.appendChild(logo);
var txt=el("span","row-text");
var nm=el("span","row-name");
var lb=el("span","row-label");lb.textContent=app.name;lb.title=app.name;nm.appendChild(lb);
if(app.essential){var bd=el("span","badge");bd.title="Official";bd.textContent="\u2713";nm.appendChild(bd);}
txt.appendChild(nm);
var ds=el("span","row-desc");ds.textContent=app.description;ds.title=app.description;txt.appendChild(ds);
row.appendChild(txt);
var btn=el("button","add");btn.type="button";
var icon=el("span","glyph");btn.appendChild(icon);
(function(aid){btn.addEventListener("click",function(){toggle(aid);});})(id);
row.appendChild(btn);
grid.appendChild(row);
rowRefs[id]={row:row,btn:btn,icon:icon,sec:sec.title,isMore:sec.more.indexOf(id)!==-1};
paintButton(app);
});
var moreBtn=null,moreLabelEl=null;
if(sec.more.length>0){
moreBtn=el("button","more");moreBtn.type="button";
var logos=el("span","more-logos");logos.setAttribute("aria-hidden","true");
sec.more.slice(0,3).forEach(function(id){
var a=byId[id];var m=el("span","logo"+(a.tile?" tiled":""));
if(a.tile)m.style.background=a.tile;
if(a.fg&&!a.tile)m.style.color=a.fg;
if(a.fg&&a.tile)m.style.color=a.fg;
m.textContent=a.name.charAt(0).toUpperCase();logos.appendChild(m);
});
moreBtn.appendChild(logos);
moreLabelEl=el("span","more-label");moreLabelEl.textContent=moreLabel(sec.more);moreBtn.appendChild(moreLabelEl);
var ar=el("span","arrow");ar.textContent="\u2192";ar.setAttribute("aria-hidden","true");moreBtn.appendChild(ar);
moreBtn.setAttribute("aria-label","Show "+moreLabel(sec.more));
(function(t){moreBtn.addEventListener("click",function(){expanded.add(t);update();});})(sec.title);
s.appendChild(moreBtn);
}
listEl.appendChild(s);
secRefs[sec.title]={sec:s,grid:grid,moreBtn:moreBtn,def:sec};
});
}
function update(){
var filtering=isFiltering();
var any=false;
SECTIONS.forEach(function(sec){
var ref=secRefs[sec.title];
var vis=0;
sec.items.forEach(function(id){
var r=rowRefs[id];if(!r)return;
var v=matches(byId[id]);
r.row.style.display=v?"":"none";
if(v)vis++;
});
sec.more.forEach(function(id){
var r=rowRefs[id];if(!r)return;
var v=(filtering||expanded.has(sec.title))&&matches(byId[id]);
r.row.style.display=v?"":"none";
if(v)vis++;
});
ref.sec.style.display=vis>0?"":"none";
if(vis>0)any=true;
if(ref.moreBtn)ref.moreBtn.style.display=(!filtering&&!expanded.has(sec.title))?"":"none";
});
segAll.setAttribute("aria-pressed",filter==="All"?"true":"false");
segConn.setAttribute("aria-pressed",filter==="Connected"?"true":"false");
segAvail.setAttribute("aria-pressed",filter==="Available"?"true":"false");
if(!any){
emptyEl.hidden=false;
var q=query.trim();
if(q){
emptyTitle.textContent="No integrations found";
emptyText.textContent="Nothing matches \u201C"+query.trim()+"\u201D \u2013 try another name, or ask us to add it.";
emptyAction.textContent="Clear search";
emptyAction.onclick=function(){searchInput.value="";query="";update();searchInput.focus();};
}else if(filter==="Connected"){
emptyTitle.textContent="Nothing connected yet";
emptyText.textContent="Connect a tool from All and it shows up here.";
emptyAction.textContent="Browse integrations";
emptyAction.onclick=function(){filter="All";update();};
}else{
emptyTitle.textContent="Everything is connected";
emptyText.textContent="Every tool in the directory is connected already.";
emptyAction.textContent="Browse all";
emptyAction.onclick=function(){filter="All";update();};
}
}else{
emptyEl.hidden=true;
}
}
function refreshRow(id){paintButton(byId[id]);}
function toggle(id){
if(busy.has(id))return;
var app=byId[id];if(!app)return;
if(connected.has(id)){
connected.delete(id);refreshRow(id);toast(app.name+" disconnected");update();
}else{
busy.add(id);refreshRow(id);
setTimeout(function(){
busy.delete(id);connected.add(id);refreshRow(id);toast(app.name+" connected");update();
},900);
}
}
function setFilter(f){filter=f;update();}
function setQuery(q){query=q;if(searchInput&&searchInput.value!==q)searchInput.value=q;update();}
function expand(t){expanded.add(t);update();}
var THEME_KEY="ui-integrations-theme";
function applyTheme(t){
document.documentElement.setAttribute("data-theme",t);
try{localStorage.setItem(THEME_KEY,t);}catch(e){}
if(themeBtn){
var ic=t==="dark"?"\u263E":"\u2600";
themeBtn.textContent=ic;
themeBtn.setAttribute("aria-label",t==="dark"?"Switch to light mode":"Switch to dark mode");
}
}
buildOnce();
update();
searchInput.addEventListener("input",function(){query=searchInput.value;update();});
segAll.addEventListener("click",function(){setFilter("All");});
segConn.addEventListener("click",function(){setFilter("Connected");});
segAvail.addEventListener("click",function(){setFilter("Available");});
reqBtn.addEventListener("click",function(){
var open=reqPop.hidden;
reqPop.hidden=!open;
reqBtn.setAttribute("aria-expanded",open?"true":"false");
if(open){reqInput.focus();}
});
reqInput.addEventListener("input",function(){reqSend.disabled=!reqInput.value.trim();});
reqForm.addEventListener("submit",function(e){
e.preventDefault();
var v=reqInput.value.trim();
if(!v)return;
reqPop.hidden=true;reqBtn.setAttribute("aria-expanded","false");
reqInput.value="";reqSend.disabled=true;
toast("Request sent \u2013 thanks!");
reqBtn.focus();
});
document.addEventListener("keydown",function(e){
if(e.key==="Escape"&&!reqPop.hidden){reqPop.hidden=true;reqBtn.setAttribute("aria-expanded","false");reqBtn.focus();}
});
themeBtn.addEventListener("click",function(){
var cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
applyTheme(cur);
});
(function syncTheme(){
var cur=document.documentElement.getAttribute("data-theme")||"light";
applyTheme(cur);
})();
if(typeof window!=="undefined"){
window.__test={rows:rowRefs,secs:secRefs,update:update,setFilter:setFilter,setQuery:setQuery,toggle:toggle,expand:expand,
applyTheme:applyTheme,getState:function(){return{filter:filter,query:query,connected:Array.from(connected),busy:Array.from(busy),expanded:Array.from(expanded)};}};
}
})();
</script>
</body>
</html>
