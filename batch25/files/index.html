<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>/*noflash*/(function(){try{var k='aui-files-theme';var t=null;try{t=localStorage.getItem(k)}catch(e){}if(!t){try{t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}if(!t)t='light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Files — Folders Overview</title>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root{
  --surface:#ffffff;
  --page:#fafaf9;
  --ink:#171717;
  --ink-2:#1c1917;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --radius-lg:16px;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-hover:0 2px 4px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  --accent:#0a7aff;
  --accent-ink:#ffffff;
  --folder-top:#00a1ff;
  --folder-body:#3cc7ff;
  --doc-bg:#eef4ff;
  --doc-ink:#2f5fd0;
  --pdf-bg:#fef2f2;
  --pdf-ink:#c2410c;
  --xls-bg:#ecfdf5;
  --xls-ink:#047857;
  --focus:#0a7aff;
  --img-outline:rgba(0,0,0,.1);
}
html[data-theme="dark"]{
  --surface:#1c1c1f;
  --page:#101012;
  --ink:#ededed;
  --ink-2:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-hover:0 2px 6px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.45);
  --accent:#3b9dff;
  --accent-ink:#0b0b0d;
  --doc-bg:#1e2a4a;
  --doc-ink:#9db8ff;
  --pdf-bg:#3a1f1a;
  --pdf-ink:#fca5a5;
  --xls-bg:#12332a;
  --xls-ink:#6ee7b7;
  --img-outline:rgba(255,255,255,.1);
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  line-height:1.45;
  background:var(--page);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:1120px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:26px;height:26px;border-radius:8px;flex:none;
  background:var(--subtle);
  border:1px solid var(--border);
  display:grid;place-items:center;
  color:var(--muted);font-weight:700;font-size:13px;
}
.brand-name{font-weight:650;font-size:14px;white-space:nowrap}
.brand-nav{
  display:flex;gap:4px;margin-left:8px;
  background:var(--subtle);border-radius:999px;padding:3px;
}
.brand-nav a{
  text-decoration:none;font-size:12.5px;color:var(--muted);
  padding:5px 11px;border-radius:999px;white-space:nowrap;
}
.brand-nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.theme-btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 11px 6px 9px;font-size:12.5px;cursor:pointer;
  transition:box-shadow 160ms ease,transform 160ms ease;
}
.theme-btn svg{width:15px;height:15px;flex:none}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.page{max-width:1120px;margin:0 auto;padding:24px 20px 56px}
.page-title{font-size:20px;line-height:28px;margin:0;font-weight:650;letter-spacing:-.01em}
.page-sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.page-sub a{color:var(--accent)}
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  padding:14px 14px 14px;
  margin-top:18px;
}
.panel-head{display:grid;gap:10px}
.title-row{display:flex;align-items:center;gap:8px}
.title-row h2{font-size:15px;margin:0;font-weight:650}
.count-pill{
  font-size:12px;color:var(--muted);background:var(--subtle);
  border:1px solid var(--border);border-radius:999px;padding:1px 8px;min-width:26px;text-align:center;
}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.controls-left{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;background:var(--subtle);border:1px solid var(--border);border-radius:999px;padding:2px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--muted);font-size:12.5px;
  padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  font-size:12.5px;border-radius:8px;padding:7px 11px 7px 9px;cursor:pointer;
  transition:box-shadow 160ms ease,transform 160ms ease;
}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
html[data-theme="dark"] .btn.primary{background:var(--ink);color:#101012;border-color:var(--ink)}
.btn.secondary{background:var(--surface)}
.btn.sm{font-size:12.5px;padding:6px 10px 6px 8px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn svg{width:15px;height:15px;flex:none}
.sort-btn{min-width:64px;justify-content:center}
.view-toggle{display:inline-flex;background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.view-toggle button{border:0;background:transparent;border-radius:6px;padding:5px 7px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.view-toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.view-toggle svg{width:15px;height:15px;display:block}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap svg{position:absolute;left:8px;width:14px;height:14px;color:var(--muted);pointer-events:none}
.search-wrap input{
  width:172px;max-width:100%;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:7px 8px 7px 28px;font-size:12.5px;
}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.filter-wrap{position:relative}
.popover{
  position:absolute;top:calc(100% + 6px);right:0;z-index:30;min-width:180px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-hover);padding:8px;
}
.popover h3{margin:2px 4px 6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.check-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:6px;font-size:13px;cursor:pointer}
.check-row input{accent-color:var(--accent)}
.folders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:14px}
.folder-card{
  display:flex;align-items:center;gap:12px;height:56px;
  padding:0 14px 0 10px;
  border-radius:var(--radius);
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit;
  transition:box-shadow 160ms ease,transform 160ms ease;
}
.folders[data-view="list"]{grid-template-columns:minmax(0,1fr);gap:6px}
.folders[data-view="list"] .folder-card{height:48px}
.folder-mark{flex:none;width:28px;height:28px}
.folder-text{display:grid;min-width:0;flex:1}
.folder-text b{overflow:hidden;font-size:13px;line-height:20px;font-weight:550;white-space:nowrap;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta svg{width:12px;height:12px;flex:none}
.templates{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.tpl{
  width:200px;max-width:100%;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  transition:box-shadow 160ms ease,transform 160ms ease;
}
.tpl-preview{
  height:86px;display:grid;place-items:center;position:relative;
  background:var(--subtle);
  box-shadow:inset 0 0 0 1px var(--img-outline);
  border-bottom:1px solid var(--border);
}
.tpl-badge{font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:6px}
.tpl-badge[data-type="DOC"]{background:var(--doc-bg);color:var(--doc-ink)}
.tpl-badge[data-type="PDF"]{background:var(--pdf-bg);color:var(--pdf-ink)}
.tpl-badge[data-type="XLS"]{background:var(--xls-bg);color:var(--xls-ink)}
.tpl-body{padding:10px 12px 11px}
.tpl-name{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-meta{margin-top:3px;display:flex;align-items:center;gap:0;min-width:0;font-size:12px;color:var(--muted)}
.tpl-meta .clip{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.tpl-access{display:inline-flex;flex:none;align-items:center;gap:4px;white-space:nowrap}
.tpl-access::before{content:"·";margin:0 5px;color:var(--muted)}
.tpl-access svg{width:12px;height:12px}
.empty{
  margin-top:14px;border:1px dashed var(--border);border-radius:var(--radius);
  padding:28px 18px;text-align:center;background:var(--surface);
}
.empty h3{margin:0 0 6px;font-size:14px}
.empty p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.skel-wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:14px}
.skel{
  height:56px;border-radius:var(--radius);background:var(--subtle);
  border:1px solid var(--border);padding:10px 12px;display:flex;gap:10px;align-items:center;
}
.skel i{display:block;background:var(--border);border-radius:6px}
.skel-bar{flex:1;display:grid;gap:6px}
.skel-bar i{height:8px;border-radius:4px}
.shimmer{position:relative;overflow:hidden}
.shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(128,128,128,.18),transparent);animation:sh 1.4s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--page);font-size:13px;
  padding:9px 14px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity 180ms ease,transform 180ms ease;z-index:50;max-width:min(92vw,480px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:860px){
  .folders{grid-template-columns:repeat(2,minmax(0,1fr))}
  .skel-wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .controls-right{margin-left:0}
}
@media (max-width:520px){
  .folders{grid-template-columns:minmax(0,1fr);gap:8px}
  .skel-wrap{grid-template-columns:minmax(0,1fr)}
  .search-wrap input{width:100%}
  .search-wrap{flex:1;min-width:160px}
  .tpl{width:100%}
}
@media (hover: hover) and (pointer: fine){
  .folder-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
  .folder-card:hover .folder-mark{transform:translateY(-1px) scale(1.04)}
  .tpl:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
  .btn:hover{box-shadow:var(--shadow-hover)}
  .theme-btn:hover{box-shadow:var(--shadow-hover)}
  .seg button:hover{color:var(--ink)}
  .view-toggle button:hover{color:var(--ink)}
  .brand-nav a:hover{color:var(--ink)}
  .check-row:hover{background:var(--subtle)}
}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span class="brand-name">Files</span>
      <nav class="brand-nav" aria-label="Primary">
        <a href="#" aria-current="page">Folders</a>
        <a href="#templates">Templates</a>
      </nav>
    </div>
    <span class="spacer"></span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme">
      <svg id="themeIconMoon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 9.2A5.7 5.7 0 0 1 6.8 2.5a.6.6 0 0 0-.75-.75A7 7 0 1 0 14.25 10a.6.6 0 0 0-.75-.8Z" fill="currentColor"/></svg>
      <svg id="themeIconSun" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span id="themeLabel">Theme</span>
    </button>
  </div>
</header>
<main class="page">
  <h1 class="page-title">Files</h1>
  <p class="page-sub">See files you recently used in chats and manage files saved in folders. <a href="#learn-more">Learn more</a></p>

  <section class="panel" aria-labelledby="foldersTitle">
    <div class="panel-head">
      <div class="title-row">
        <h2 id="foldersTitle">Folders</h2>
        <span class="count-pill" id="folderCount">4</span>
      </div>
      <div class="controls">
        <div class="controls-left" role="tablist" aria-label="Folder access">
          <div class="seg" id="folderTabs">
            <button type="button" role="tab" data-tab="All" aria-selected="true">All</button>
            <button type="button" role="tab" data-tab="Shared" aria-selected="false">Shared</button>
            <button type="button" role="tab" data-tab="Private" aria-selected="false">Private</button>
          </div>
        </div>
        <div class="controls-right">
          <button class="btn sm sort-btn" id="folderSort" type="button" aria-label="Sort folders by name">A–Z ↓</button>
          <div class="view-toggle" role="group" aria-label="Folder view">
            <button type="button" id="viewGrid" aria-pressed="true" aria-label="Grid view"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="5.2" height="5.2" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="9.3" y="1.5" width="5.2" height="5.2" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9.3" width="5.2" height="5.2" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="9.3" y="9.3" width="5.2" height="5.2" rx="1.2" stroke="currentColor" stroke-width="1.4"/></svg></button>
            <button type="button" id="viewList" aria-pressed="false" aria-label="List view"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          </div>
          <span class="search-wrap">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7.2" cy="7.2" r="4.4" stroke="currentColor" stroke-width="1.5"/><path d="m10.8 10.8 2.7 2.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="folderSearch" type="search" placeholder="Search folders..." aria-label="Search folders" autocomplete="off">
          </span>
          <button class="btn sm primary" id="createFolder" type="button"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Create folder</span></button>
        </div>
      </div>
    </div>
    <div class="skel-wrap" id="folderSkel" hidden>
      <div class="skel shimmer" aria-hidden="true"><i style="width:26px;height:22px"></i><span class="skel-bar"><i style="width:60%"></i><i style="width:40%"></i></span></div>
      <div class="skel shimmer" aria-hidden="true"><i style="width:26px;height:22px"></i><span class="skel-bar"><i style="width:45%"></i><i style="width:40%"></i></span></div>
      <div class="skel shimmer" aria-hidden="true"><i style="width:26px;height:22px"></i><span class="skel-bar"><i style="width:70%"></i><i style="width:40%"></i></span></div>
      <div class="skel shimmer" aria-hidden="true"><i style="width:26px;height:22px"></i><span class="skel-bar"><i style="width:52%"></i><i style="width:40%"></i></span></div>
    </div>
    <div class="folders" id="folderGrid" data-view="grid"></div>
    <div class="empty" id="folderEmpty" hidden>
      <h3 id="folderEmptyTitle">No folders found</h3>
      <p id="folderEmptyText">Try another search.</p>
      <span id="folderEmptyAction"></span>
    </div>
  </section>

  <section class="panel" id="templates" aria-labelledby="tplTitle">
    <div class="panel-head">
      <div class="title-row">
        <h2 id="tplTitle">File templates</h2>
        <span class="count-pill" id="tplCount">4</span>
      </div>
      <div class="controls">
        <div class="controls-left">
          <div class="seg" id="tplTabs">
            <button type="button" role="tab" data-tab="All" aria-selected="true">All</button>
            <button type="button" role="tab" data-tab="Mine" aria-selected="false">Mine</button>
            <button type="button" role="tab" data-tab="Shared" aria-selected="false">Shared with me</button>
          </div>
        </div>
        <div class="controls-right">
          <span class="filter-wrap">
            <button class="btn sm" id="typeBtn" type="button" aria-haspopup="true" aria-expanded="false"><span>Type</span><span class="count-pill" id="typeCount" hidden>0</span></button>
            <span class="popover" id="typePop" hidden>
              <h3>Type</h3>
              <label class="check-row"><input type="checkbox" value="DOC"><span>Document</span></label>
              <label class="check-row"><input type="checkbox" value="PDF"><span>PDF</span></label>
              <label class="check-row"><input type="checkbox" value="XLS"><span>Spreadsheet</span></label>
            </span>
          </span>
          <button class="btn sm sort-btn" id="tplSort" type="button" aria-label="Sort templates by name">A–Z ↓</button>
          <span class="search-wrap">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7.2" cy="7.2" r="4.4" stroke="currentColor" stroke-width="1.5"/><path d="m10.8 10.8 2.7 2.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="tplSearch" type="search" placeholder="Search templates..." aria-label="Search templates" autocomplete="off">
          </span>
          <button class="btn sm secondary" id="addTpl" type="button"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Add template</span></button>
        </div>
      </div>
    </div>
    <div class="templates" id="tplGrid"></div>
    <div class="empty" id="tplEmpty" hidden>
      <h3 id="tplEmptyTitle">No templates found</h3>
      <p id="tplEmptyText">Try another tab, type or search.</p>
      <span id="tplEmptyAction"></span>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  {name:'Brand-Guidelines',type:'PDF',owner:'Jonas Weber',shared:true},
  {name:'Campaign-Budget',type:'XLS',owner:'Jonas Weber',shared:true},
  {name:'Weekly-Report',type:'XLS',owner:'Alex Morgan',shared:false}
];
var state={folderTab:'All',folderSort:'asc',folderView:'grid',folderQuery:'',tplTab:'All',tplTypes:[],tplSort:'asc',tplQuery:''};
var folderItems=FOLDERS.slice();
var tplItems=TEMPLATES.slice();
var folderNodes=[];
var tplNodes=[];
var $=function(id){return document.getElementById(id)};
var folderGrid=$('folderGrid'),tplGrid=$('tplGrid');
var folderCount=$('folderCount'),tplCount=$('tplCount');
var folderEmpty=$('folderEmpty'),tplEmpty=$('tplEmpty');
var folderEmptyTitle=$('folderEmptyTitle'),folderEmptyText=$('folderEmptyText');
var tplEmptyTitle=$('tplEmptyTitle'),tplEmptyText=$('tplEmptyText');
var toast=$('toast'),toastTimer=null;

function el(tag,cls){var n=document.createElement(tag);if(cls)n.className=cls;return n}
function svgIcon(kind){
  var NS='http://www.w3.org/2000/svg';
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 16 16');
  s.setAttribute('aria-hidden','true');
  s.setAttribute('width','12');s.setAttribute('height','12');
  var p=document.createElementNS(NS,'path');
  if(kind==='shared'){p.setAttribute('d','M8 5.5a2 2 0 1 0 0 .01M4.5 6.5 8 5.2l3.5 1.3M4.5 6.5v5h7v-5M4.5 6.5 2.8 7.2v4.3h10.4V7.2L11.5 6.5');}
  else{p.setAttribute('d','M8 7.2V12M5.5 9.5 8 12l2.5-2.5M3 3.5h10v9H3z');}
  p.setAttribute('fill','none');p.setAttribute('stroke','currentColor');
  p.setAttribute('stroke-width','1.3');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
  s.appendChild(p);return s;
}
function folderMark(){
  var NS='http://www.w3.org/2000/svg';
  var s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 32 32');s.setAttribute('aria-hidden','true');
  s.setAttribute('class','folder-mark');
  var back=document.createElementNS(NS,'path');
  back.setAttribute('d','M3 9.5c0-2 1.6-3.5 3.5-3.5H12l2.2 2.8h9.3c2 0 3.5 1.6 3.5 3.5v1H3v-3.8Z');
  back.setAttribute('fill','#00A1FF');
  var body=document.createElementNS(NS,'rect');
  body.setAttribute('x','2');body.setAttribute('y','11');body.setAttribute('width','28');body.setAttribute('height','15');
  body.setAttribute('rx','3.5');body.setAttribute('fill','#3CC7FF');
  s.appendChild(back);s.appendChild(body);return s;
}
function matchQ(name,q){return name.toLowerCase().indexOf(q.trim().toLowerCase())!==-1}
function cmpName(dir){return function(a,b){var r=a.name.localeCompare(b.name);return dir==='asc'?r:-r}}
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove('show')},1800);
}
function buildFolderCard(item){
  var b=el('button','folder-card');b.type='button';
  b.appendChild(folderMark());
  var txt=el('span','folder-text');
  var nm=el('b');nm.title=item.name;nm.textContent=item.name;
  var meta=el('span','meta');
  meta.appendChild(svgIcon(item.access==='Shared'?'shared':'lock'));
  var lab=el('span');lab.textContent=item.access+' · '+item.files.length+' '+(item.files.length===1?'file':'files');
  meta.appendChild(lab);
  txt.appendChild(nm);txt.appendChild(meta);
  b.appendChild(txt);
  b.addEventListener('click',function(){showToast('Opened folder “'+item.name+'”')});
  return {item:item,node:b,nameNode:nm,metaNode:lab};
}
function buildTplCard(item){
  var card=el('div','tpl');card.title=item.name;
  var prev=el('div','tpl-preview');
  var badge=el('span','tpl-badge');badge.setAttribute('data-type',item.type);badge.textContent=item.type;
  prev.appendChild(badge);card.appendChild(prev);
  var body=el('div','tpl-body');
  var nm=el('div','tpl-name');nm.textContent=item.name;
  var meta=el('div','tpl-meta');
  var left=el('span','clip');left.textContent=(TYPE_LABEL[item.type]||item.type)+' · '+item.owner;
  var right=el('span','tpl-access');
  right.appendChild(svgIcon(item.shared?'shared':'lock'));
  var rl=el('span');rl.textContent=item.shared?'Shared':'Private';right.appendChild(rl);
  meta.appendChild(left);meta.appendChild(right);
  body.appendChild(nm);body.appendChild(meta);card.appendChild(body);
  return {item:item,node:card,nameNode:nm,leftNode:left,rightNode:rl,badgeNode:badge};
}
function filteredFolders(){
  var q=state.folderQuery;
  var list=folderItems.filter(function(f){
    if(state.folderTab!=='All'&&f.access!==state.folderTab)return false;
    if(q&&!matchQ(f.name,q))return false;
    return true;
  });
  list.sort(cmpName(state.folderSort));
  return list;
}
function filteredTpls(){
  var q=state.tplQuery;
  var list=tplItems.filter(function(t){
    if(state.tplTab==='Mine'&&t.owner!==CURRENT_USER)return false;
    if(state.tplTab==='Shared'&&t.owner===CURRENT_USER)return false;
    if(state.tplTypes.length&&state.tplTypes.indexOf(t.type)===-1)return false;
    if(q&&!matchQ(t.name,q))return false;
    return true;
  });
  list.sort(cmpName(state.tplSort));
  return list;
}
function updateFolders(){
  var vis=filteredFolders();
  var visSet={};
  var i;for(i=0;i<vis.length;i++)visSet[vis[i].name+'|'+vis[i].access]=true;
  for(i=0;i<folderNodes.length;i++){
    var rec=folderNodes[i];
    var key=rec.item.name+'|'+rec.item.access;
    var show=!!visSet[key];
    if(rec.node.hidden===show)rec.node.hidden=!show;
  }
  for(i=0;i<vis.length;i++){
    var found=null,j;
    for(j=0;j<folderNodes.length;j++){if(folderNodes[j].item===vis[i]){found=folderNodes[j];break}}
    if(found)folderGrid.appendChild(found.node);
  }
  folderGrid.setAttribute('data-view',state.folderView);
  folderCount.textContent=String(vis.length);
  var sortBtn=$('folderSort');
  var lbl=state.folderSort==='asc'?'A–Z ↓':'Z–A ↑';
  if(sortBtn.firstChild)sortBtn.textContent=lbl;else sortBtn.textContent=lbl;
  $('viewGrid').setAttribute('aria-pressed',state.folderView==='grid'?'true':'false');
  $('viewList').setAttribute('aria-pressed',state.folderView==='list'?'true':'false');
  var tabs=$('folderTabs').children;
  for(i=0;i<tabs.length;i++)tabs[i].setAttribute('aria-selected',tabs[i].getAttribute('data-tab')===state.folderTab?'true':'false');
  if(vis.length===0){
    folderGrid.hidden=true;folderEmpty.hidden=false;
    if(folderItems.length===0){
      folderEmptyTitle.textContent='No folders yet';
      folderEmptyText.textContent='Folders keep the files you work on in chats together. Create one to get started.';
    }else{
      folderEmptyTitle.textContent='No folders found';
      folderEmptyText.textContent=state.folderQuery?('Nothing matches “'+state.folderQuery+'”.'):('There are no '+state.folderTab.toLowerCase()+' folders yet.');
    }
  }else{folderGrid.hidden=false;folderEmpty.hidden=true}
}
function updateTpls(){
  var vis=filteredTpls();
  var visSet={};
  var i;for(i=0;i<vis.length;i++)visSet[vis[i].name+'|'+vis[i].owner+'|'+vis[i].type]=true;
  for(i=0;i<tplNodes.length;i++){
    var rec=tplNodes[i];
    var key=rec.item.name+'|'+rec.item.owner+'|'+rec.item.type;
    var show=!!visSet[key];
    if(rec.node.hidden===show)rec.node.hidden=!show;
  }
  for(i=0;i<vis.length;i++){
    var found=null,j;
    for(j=0;j<tplNodes.length;j++){if(tplNodes[j].item===vis[i]){found=tplNodes[j];break}}
    if(found)tplGrid.appendChild(found.node);
  }
  tplCount.textContent=String(vis.length);
  var sb=$('tplSort');sb.textContent=state.tplSort==='asc'?'A–Z ↓':'Z–A ↑';
  var tabs=$('tplTabs').children;
  for(i=0;i<tabs.length;i++)tabs[i].setAttribute('aria-selected',tabs[i].getAttribute('data-tab')===state.tplTab?'true':'false');
  var tc=$('typeCount');
  if(state.tplTypes.length){tc.hidden=false;tc.textContent=String(state.tplTypes.length)}
  else{tc.hidden=true}
  if(vis.length===0){
    tplGrid.hidden=true;tplEmpty.hidden=false;
    if(tplItems.length===0){
      tplEmptyTitle.textContent='No templates yet';
      tplEmptyText.textContent='Templates are documents your team starts from again and again. Add the first one here.';
    }else{
      tplEmptyTitle.textContent='No templates found';
      tplEmptyText.textContent='Try another tab, type or search.';
    }
  }else{tplGrid.hidden=false;tplEmpty.hidden=true}
}
function initTheme(){
  var btn=$('themeBtn'),moon=$('themeIconMoon'),sun=$('themeIconSun'),lab=$('themeLabel');
  function paint(){
    var t=document.documentElement.getAttribute('data-theme')||'light';
    moon.hidden=(t==='dark');sun.hidden=(t!=='dark');
    lab.textContent=(t==='dark'?'Dark':'Light');
    btn.setAttribute('aria-label','Switch to '+(t==='dark'?'light':'dark')+' theme (now '+t+')');
  }
  paint();
  btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',cur);
    try{localStorage.setItem('aui-files-theme',cur)}catch(e){}
    paint();
  });
  window.__themePaint=paint;
}
function init(){
  var i;
  for(i=0;i<folderItems.length;i++){var r=buildFolderCard(folderItems[i]);folderNodes.push(r);folderGrid.appendChild(r.node)}
  for(i=0;i<tplItems.length;i++){var t=buildTplCard(tplItems[i]);tplNodes.push(t);tplGrid.appendChild(t.node)}
  $('folderTabs').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!b)return;state.folderTab=b.getAttribute('data-tab');updateFolders();
  });
  $('folderTabs').addEventListener('keydown',function(e){
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
    var btns=Array.prototype.slice.call($('folderTabs').children);
    var idx=btns.indexOf(document.activeElement);
    if(idx===-1)return;e.preventDefault();
    var n=e.key==='ArrowRight'?(idx+1)%btns.length:(idx-1+btns.length)%btns.length;
    btns[n].focus();state.folderTab=btns[n].getAttribute('data-tab');updateFolders();
  });
  $('tplTabs').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button'):null;
    if(!b)return;state.tplTab=b.getAttribute('data-tab');updateTpls();
  });
  $('folderSort').addEventListener('click',function(){state.folderSort=state.folderSort==='asc'?'desc':'asc';updateFolders()});
  $('tplSort').addEventListener('click',function(){state.tplSort=state.tplSort==='asc'?'desc':'asc';updateTpls()});
  $('viewGrid').addEventListener('click',function(){state.folderView='grid';updateFolders()});
  $('viewList').addEventListener('click',function(){state.folderView='list';updateFolders()});
  $('folderSearch').addEventListener('input',function(e){state.folderQuery=e.target.value;updateFolders()});
  $('folderSearch').addEventListener('keydown',function(e){if(e.key==='Escape'){e.target.value='';state.folderQuery='';updateFolders()}});
  $('tplSearch').addEventListener('input',function(e){state.tplQuery=e.target.value;updateTpls()});
  $('tplSearch').addEventListener('keydown',function(e){if(e.key==='Escape'){e.target.value='';state.tplQuery='';updateTpls()}});
  $('createFolder').addEventListener('click',function(){
    var names={};var k;for(k=0;k<folderItems.length;k++)names[folderItems[k].name]=true;
    var t='Untitled folder',n=2;while(names[t]){t='Untitled folder '+n;n++}
    var item={name:t,access:'Private',files:[]};
    folderItems.push(item);
    var rec=buildFolderCard(item);folderNodes.push(rec);folderGrid.appendChild(rec.node);
    state.folderTab='All';state.folderQuery='';$('folderSearch').value='';
    updateFolders();showToast('Created folder “'+t+'”');
  });
  $('addTpl').addEventListener('click',function(){
    var names={};var k;for(k=0;k<tplItems.length;k++)names[tplItems[k].name]=true;
    var t='Untitled',n=2;while(names[t]){t='Untitled-'+n;n++}
    var item={name:t,type:'DOC',owner:CURRENT_USER,shared:false};
    tplItems.push(item);
    var rec=buildTplCard(item);tplNodes.push(rec);tplGrid.appendChild(rec.node);
    state.tplTab='All';state.tplTypes=[];state.tplQuery='';
    $('tplSearch').value='';
    var boxes=$('typePop').querySelectorAll('input[type="checkbox"]');
    for(k=0;k<boxes.length;k++)boxes[k].checked=false;
    updateTpls();showToast('Added template “'+t+'”');
  });
  var typeBtn=$('typeBtn'),typePop=$('typePop');
  typeBtn.addEventListener('click',function(){
    var open=typePop.hidden;
    typePop.hidden=!open;
    typeBtn.setAttribute('aria-expanded',open?'true':'false');
  });
  document.addEventListener('click',function(e){
    if(typePop.hidden)return;
    if(e.target===typeBtn||typeBtn.contains(e.target)||typePop.contains(e.target))return;
    typePop.hidden=true;typeBtn.setAttribute('aria-expanded','false');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&!typePop.hidden){typePop.hidden=true;typeBtn.setAttribute('aria-expanded','false');typeBtn.focus()}
  });
  typePop.addEventListener('change',function(){
    var boxes=typePop.querySelectorAll('input[type="checkbox"]');
    var sel=[];var k;for(k=0;k<boxes.length;k++){if(boxes[k].checked)sel.push(boxes[k].value)}
    state.tplTypes=sel;updateTpls();
  });
  initTheme();
  updateFolders();updateTpls();
  window.__filesTest={state:state,folderItems:folderItems,tplItems:tplItems,folderNodes:folderNodes,tplNodes:tplNodes,updateFolders:updateFolders,updateTpls:updateTpls};
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
</body>
</html>
