<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Email Draft — Renewal agent</title>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<script>/*noflash*/
(function(){try{var k="email-draft-theme";var s=null;try{s=localStorage.getItem(k)}catch(e){}var t=s;if(!t){try{t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){t="light"}}if(t!=="light"&&t!=="dark")t="light";document.documentElement.setAttribute("data-theme",t)}catch(e){}})();
</script>
<style>
:root, html[data-theme="light"]{
  --surface:#ffffff; --page:#fafaf9; --ink:#171717; --ink2:#1c1917;
  --text:#404040; --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --tray:#f0efed; --chip:#f5f5f4; --chip-line:#e7e5e4; --hover:#f5f5f4;
  --warn:#b25e09; --warn-bg:#fef3c7; --warn-ink:#92400e;
  --ok:#1e8a4f; --ok-bg:#e6f5ec;
  --btn-top:#323137; --btn-bottom:#201e25; --btn-ring:#0d0d0d; --btn-text:#ffffff;
  --focus:rgba(0,96,226,.7);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --pop-shadow:0 0 0 1px #e7e5e4,0 10px 30px rgba(0,0,0,.10);
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink2:#ededed;
  --text:#c9c9cf; --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --tray:#161618; --chip:#2a2a2d; --chip-line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.06);
  --warn:#fbbf24; --warn-bg:#451a03; --warn-ink:#fde68a;
  --ok:#7dcf9f; --ok-bg:rgba(125,207,159,.14);
  --btn-top:#f4f4f5; --btn-bottom:#e4e4e7; --btn-ring:rgba(0,0,0,.6); --btn-text:#121213;
  --focus:rgba(77,141,255,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --pop-shadow:0 0 0 1px rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.5);
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center; padding:28px 16px 48px;
}
.page{width:100%; max-width:560px; display:grid; gap:12px}
.page-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.page-title{font-size:13px; color:var(--muted); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.theme-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; padding:0 0 0 0; padding-right:2px;
  border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  box-shadow:var(--shadow); transition:background-color 160ms ease,transform 160ms ease;
}
.theme-btn:active{transform:scale(.96)}
.theme-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.ed{
  width:100%; max-width:520px; margin:0 auto; padding:6px;
  border-radius:20px; background:var(--tray);
  border:1px solid var(--border); box-shadow:var(--shadow); color:var(--ink);
}
.ed-record{display:grid; gap:2px; padding:8px 10px 10px}
.ed-ref{display:flex; align-items:center; gap:8px; min-width:0}
.ed-id{flex:0 1 auto; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:15px; font-weight:600; letter-spacing:-.01em}
.ed-status{flex:0 100 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 8px; border-radius:7px; background:var(--warn-bg); color:var(--warn-ink); font-size:12.5px; font-weight:500}
.ed-amount{flex:none; margin-left:auto; white-space:nowrap; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums}
.ed-account{font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.ed-outer{position:relative}
.ed-card{border:1px solid var(--border); border-radius:16px; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.06); transition:opacity 220ms ease}
.ed-card[data-sending]{opacity:.7; pointer-events:none}
.ed-meta{display:flex; min-width:0; align-items:center; justify-content:space-between; gap:12px; margin:0 14px; padding:12px 0 11px; border-bottom:1px solid var(--border)}
.ed-to{position:relative; display:flex; align-items:center; gap:6px; min-width:0}
.ed-to-label{font-size:13px; color:var(--muted)}
.ed svg{width:15px; height:15px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.ed-recip{display:inline-flex; align-items:center; gap:4px; min-width:0; height:26px; padding:0 4px 0 8px; border:0; border-radius:7px; background:var(--chip); box-shadow:inset 0 0 0 1px var(--chip-line); font-size:13px; white-space:nowrap; overflow:hidden; transition:background-color 160ms ease; color:var(--ink); font:inherit}
.ed-recip svg{width:14px; height:14px; color:var(--muted); transition:transform 220ms cubic-bezier(.22,1,.36,1)}
.ed-recip[aria-expanded="true"] svg{transform:rotate(180deg)}
.ed-name{min-width:0; overflow:hidden; text-overflow:ellipsis}
.ed-email{flex:0 100 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--muted)}
.ed-menu{position:absolute; top:calc(100% + 6px); left:18px; z-index:5; display:grid; gap:2px; min-width:250px; max-width:280px; max-height:288px; overflow-y:auto; overscroll-behavior:contain; margin:0; padding:5px; list-style:none; border-radius:12px; background:var(--surface); box-shadow:var(--pop-shadow)}
.ed-menu button{display:flex; align-items:center; gap:10px; width:100%; padding:7px 8px; border:0; border-radius:7px; background:none; text-align:left; font-size:13px; color:var(--ink); font:inherit}
.ed-avatar{display:grid; place-items:center; width:26px; height:26px; flex:none; border-radius:50%; background:var(--chip); box-shadow:inset 0 0 0 1px var(--chip-line); font-size:10.5px; font-weight:600; color:var(--text)}
.ed-mtext{display:grid; flex:1; min-width:0; overflow-wrap:anywhere}
.ed-mtext small{font-size:12px; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.ed-tick{margin-left:auto}
.ed-side{display:flex; align-items:center; min-width:0; flex:0 1 auto}
.ed-file{display:inline-flex; align-items:center; gap:5px; min-width:0; flex:0 1 auto; max-width:100%; font-size:13px; color:var(--muted); white-space:nowrap}
.ed-file>svg{flex:none}
.ed-fname{min-width:0; flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ed-fremove{flex:none; width:20px; height:20px; padding:0; display:grid; place-items:center; border:0; border-radius:5px; background:none; color:var(--muted)}
.ed-fremove svg{width:13px; height:13px}
.ed-attach{display:inline-flex; min-width:0; gap:4px; padding:3px 6px; padding-left:4px; border:0; border-radius:7px; background:none; font-size:13px; white-space:nowrap; color:var(--muted); font:inherit}
.ed-body{padding:12px 14px 4px}
.ed-text{margin:-4px -6px; padding:4px 6px; border-radius:8px; font-size:15px; line-height:1.6; color:var(--text); white-space:pre-line; overflow-wrap:anywhere; cursor:text; transition:background-color 160ms ease}
.ed-text a{color:var(--text); text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:4px}
.ed-edit{display:block; width:calc(100% + 12px); margin:-4px -6px; padding:4px 6px; border:0; border-radius:8px; background:var(--hover); box-shadow:inset 0 0 0 1px var(--border); outline:none; resize:none; overflow:hidden; font:inherit; font-size:15px; line-height:1.6; color:var(--ink)}
.ed-actions{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 10px 10px 14px}
.ed-tones{display:flex; flex-wrap:wrap; align-items:center; gap:2px; min-width:0}
.ed-tones button{display:inline-flex; align-items:center; height:28px; padding:0 9px; border:0; border-radius:7px; background:none; font-size:12.5px; color:var(--muted); font:inherit; transition:background-color 160ms ease,color 160ms ease}
.ed-tones button[aria-pressed="true"]{background:var(--chip); color:var(--ink); box-shadow:inset 0 0 0 1px var(--chip-line)}
.ed-editbtn{width:28px; padding:0; justify-content:center; margin-left:4px}
.ed-btns{display:flex; gap:8px; margin-left:auto}
.ed-discard,.ed-send{display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px; padding-left:12px; border:0; border-radius:10px; font-size:14px; font-weight:500; font:inherit; transition:background-color 160ms ease,transform 160ms ease,filter 160ms ease}
.ed-discard{background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); color:var(--text)}
.ed-send{background:linear-gradient(180deg,var(--btn-top),var(--btn-bottom)); box-shadow:0 0 0 1px var(--btn-ring),inset 0 1px 0 rgba(255,255,255,.12); color:var(--btn-text)}
.ed-discard:active,.ed-send:active{transform:scale(.98)}
.ed-spin{width:13px; height:13px; border:1.8px solid rgba(128,128,128,.4); border-top-color:currentColor; border-radius:50%; animation:ed-spin 700ms linear infinite}
@keyframes ed-spin{to{transform:rotate(360deg)}}
@keyframes ed-in{from{opacity:0; transform:translateY(4px) scale(.99)}}
@keyframes ed-fade{from{opacity:0}}
@keyframes ed-menu{from{opacity:0; transform:scale(.96) translateY(-4px)}}
.ed-card{animation:ed-in 320ms cubic-bezier(.22,1,.36,1) both}
.ed-receipt{animation:ed-in 320ms cubic-bezier(.22,1,.36,1) both}
.ed-menu{animation:ed-menu 200ms cubic-bezier(.22,1,.36,1) both}
.ed-receipt{display:flex; align-items:center; gap:10px; padding:12px 10px 12px 12px; border:1px solid var(--border); border-radius:16px; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.06); font-size:14px; color:var(--text)}
.ed-receipt b{font-weight:500; color:var(--ink)}
.ed-ricon{display:grid; place-items:center; width:26px; height:26px; flex:none; border-radius:50%; background:var(--chip); color:var(--muted)}
.ed-ricon[data-tone="ok"]{background:var(--ok-bg); color:var(--ok)}
.ed-rtext{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ed-undo{padding:4px 8px; border:0; border-radius:7px; background:none; font-size:13px; font-weight:500; color:var(--ink); font:inherit; transition:background-color 160ms ease}
.ed-foot{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 10px 6px}
.ed-agent{min-width:0; overflow-wrap:anywhere; font-size:14px; color:var(--ink)}
.ed-badge{flex:none; white-space:nowrap; padding:2px 8px; border-radius:7px; font-size:12.5px; font-weight:500; animation:ed-fade 260ms ease both}
.ed-badge[data-tone="ok"]{background:var(--ok-bg); color:var(--ok)}
.ed-badge[data-tone="muted"]{background:var(--subtle); color:var(--muted)}
.ed-hint{margin-left:auto; font-size:12px; color:var(--muted)}
.ed-recip:focus-visible, .ed-menu button:focus-visible, .ed-attach:focus-visible, .ed-fremove:focus-visible, .ed-tones button:focus-visible, .ed-discard:focus-visible, .ed-send:focus-visible, .ed-undo:focus-visible, .ed-text:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.ed-edit:focus-visible{outline:none}
img{outline:1px solid rgba(0,0,0,.1); outline-offset:-1px}
html[data-theme="dark"] img{outline-color:rgba(255,255,255,.1)}
@media (max-width:480px){
  .ed-email,.ed-hint{display:none}
  .page{padding:0}
  body{padding:16px 10px 32px}
}
@media (prefers-reduced-motion:reduce){
  .ed-card,.ed-receipt,.ed-text,.ed-badge,.ed-menu{animation:none}
  .ed-spin{animation-duration:1400ms}
}
@media (hover: hover) and (pointer: fine){
  .ed-recip:hover{background:var(--hover)}
  .ed-menu button:hover{background:var(--hover)}
  .ed-fremove:hover{background:var(--hover); color:var(--ink)}
  .ed-attach:hover{background:var(--hover); color:var(--ink)}
  .ed-text:hover{background:var(--hover)}
  .ed-text a:hover{color:var(--ink)}
  .ed-tones button:hover{color:var(--ink)}
  .ed-discard:hover{background:var(--hover)}
  .ed-send:hover{filter:brightness(1.12)}
  html[data-theme="dark"] .ed-send:hover{filter:brightness(1.04)}
  .ed-undo:hover{background:var(--hover)}
  .theme-btn:hover{background:var(--hover)}
}
</style>
</head>
<body>
<div class="page">
  <div class="page-top">
    <span class="page-title">Email Draft · Renewal agent</span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">☾</button>
  </div>
  <div id="edRoot"></div>
  <div class="page-title" style="text-align:center">Agent-written email for review with recipient, tone, inline editing, and send controls.</div>
</div>
<script>
(function(){
"use strict";
var CONTACTS=[
  {name:"Jonas Weber",email:"jonas@northwind.io"},
  {name:"Lena Hart",email:"lena@northwind.io"},
  {name:"Finance team",email:"billing@northwind.io"}
];
var DATA={reference:"SUB-1182",account:"Northwind Logistics",amount:"$8,900",status:"Renews in 5 days",agent:"Renewal agent",attachment:"Renewal-quote.pdf",linkLabel:"Review quote",linkHref:"#"};
function firstName(c){var p=String(c.name||"").trim().split(/\s+/).filter(Boolean);return p[0]||"";}
function initials(name){return String(name||"").trim().split(/\s+/).map(function(w){var m=w.match(/[\p{L}\p{N}]/u);return m?m[0]:"";}).join("").slice(0,2).toUpperCase();}
function escReg(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function toneBody(id,c){
  if(id==="short")return "Hi "+firstName(c)+", your Growth plan renews on October 9 ($8,900/year). Quote for changes:";
  if(id==="formal")return "Dear "+String(c.name||"")+", this is a reminder that your Growth subscription is scheduled to renew on October 9 at $8,900 per year. Should you wish to adjust seats or billing, please review the attached quote:";
  return "Hi "+firstName(c)+", a heads-up that your Growth plan renews on October 9 for $8,900 a year. If you'd like to add seats or switch to monthly billing, you can review the quote here:";
}
var TONES=[{id:"friendly",label:"Friendly"},{id:"short",label:"Short"},{id:"formal",label:"Formal"}];
var state={recipient:CONTACTS[0],attachment:DATA.attachment,toneId:"friendly",custom:null,editing:false,menuOpen:false,phase:"draft"};
var sendTimer=null;
var els={};
function svgEl(pathD,w){
  var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 24 24"); svg.setAttribute("aria-hidden","true");
  var p=document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",pathD);
  svg.appendChild(p); return svg;
}
function el(tag,cls,text){var n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=text; return n;}
function currentBody(){return toneBody(state.toneId,state.recipient);}
function shownBody(){return state.custom!=null?state.custom:currentBody();}
// ---- build once ----
function build(){
  var root=document.getElementById("edRoot");
  var tray=el("div","ed"); els.tray=tray;
  var rec=el("div","ed-record");
  var refRow=el("div","ed-ref");
  els.refId=el("span","ed-id",DATA.reference); els.refId.title=DATA.reference;
  els.status=el("span","ed-status",DATA.status); els.status.title=DATA.status; els.status.setAttribute("dir","auto");
  els.amount=el("span","ed-amount",DATA.amount);
  refRow.appendChild(els.refId); refRow.appendChild(els.status); refRow.appendChild(els.amount);
  els.account=el("span","ed-account",DATA.account); els.account.setAttribute("dir","auto");
  rec.appendChild(refRow); rec.appendChild(els.account); tray.appendChild(rec);
  var outer=el("div","ed-outer"); els.outer=outer;
  var inner=el("div","ed-inner"); outer.appendChild(inner); tray.appendChild(outer);
  // card
  var card=el("div","ed-card"); els.card=card;
  var meta=el("div","ed-meta");
  var to=el("div","ed-to"); els.toWrap=to;
  to.appendChild(el("span","ed-to-label","to"));
  var rb=el("button","ed-recip"); rb.type="button"; rb.setAttribute("aria-haspopup","listbox"); rb.setAttribute("aria-expanded","false");
  els.recipBtn=rb;
  els.rname=el("span","ed-name"); els.rname.setAttribute("dir","auto");
  els.remail=el("span","ed-email");
  var chev=svgEl("m7 10 5 5 5-5");
  rb.appendChild(els.rname); rb.appendChild(els.remail); rb.appendChild(chev);
  rb.addEventListener("click",function(){setMenu(!state.menuOpen);});
  to.appendChild(rb);
  els.menu=el("ul","ed-menu"); els.menu.setAttribute("role","listbox"); els.menu.setAttribute("aria-label","Recipient");
  els.menuItems=[];
  CONTACTS.forEach(function(c,idx){
    var li=document.createElement("li");
    var b=document.createElement("button"); b.type="button"; b.setAttribute("role","option");
    var av=el("span","ed-avatar",initials(c.name)); av.setAttribute("aria-hidden","true");
    var mt=el("span","ed-mtext"); mt.setAttribute("dir","auto");
    var nm=document.createElement("span"); nm.textContent=c.name;
    var sm=document.createElement("small"); sm.textContent=c.email;
    mt.appendChild(nm); mt.appendChild(sm);
    var tick=svgEl("m6 12.5 4 4 8-9"); tick.setAttribute("class","ed-tick");
    b.appendChild(av); b.appendChild(mt); b.appendChild(tick);
    (function(contact){b.addEventListener("click",function(){pickRecipient(contact);});})(c);
    li.appendChild(b); els.menu.appendChild(li);
    els.menuItems.push({contact:c,btn:b,tick:tick});
  });
  els.menu.style.display="none";
  to.appendChild(els.menu);
  meta.appendChild(to);
  // file side
  var side=el("div","ed-side"); els.side=side;
  var file=el("span","ed-file"); els.file=file;
  var clip=svgEl("m15.5 7.5-6.4 6.4a1.8 1.8 0 0 0 2.5 2.5l6.7-6.7a3.5 3.5 0 0 0-5-5l-6.9 6.9a5.2 5.2 0 0 0 7.4 7.4l6-6");
  els.fname=el("span","ed-fname");
  var rm=document.createElement("button"); rm.type="button"; els.fremove=rm;
  rm.appendChild(svgEl("M7 7l10 10M17 7 7 17"));
  rm.addEventListener("click",function(){state.attachment=null; renderAttachment();});
  file.appendChild(clip); file.appendChild(els.fname); file.appendChild(rm);
  var attach=document.createElement("button"); attach.type="button"; attach.className="ed-attach"; els.attach=attach;
  var plus=svgEl("M12 6v12M6 12h12");
  els.attachLabel=el("span","ed-fname");
  attach.appendChild(plus); attach.appendChild(els.attachLabel);
  attach.addEventListener("click",function(){state.attachment=DATA.attachment; renderAttachment();});
  side.appendChild(file); side.appendChild(attach);
  meta.appendChild(side);
  card.appendChild(meta);
  // body
  var body=el("div","ed-body"); els.body=body;
  var p=el("p","ed-text"); p.title="Click to edit"; p.setAttribute("dir","auto"); p.tabIndex=0; els.text=p;
  els.textBody=el("span","ed-textbody"); els.textBody.className="ed-textbody";
  els.link=document.createElement("a"); els.link.href=DATA.linkHref; els.link.textContent=DATA.linkLabel;
  els.link.addEventListener("click",function(e){e.stopPropagation(); e.preventDefault();});
  var sp=document.createTextNode(" ");
  p.appendChild(els.textBody); p.appendChild(sp); p.appendChild(els.link);
  p.addEventListener("click",function(){startEdit();});
  p.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault(); startEdit();}});
  var ta=document.createElement("textarea"); ta.className="ed-edit"; ta.setAttribute("dir","auto"); ta.setAttribute("aria-label","Email text"); els.edit=ta;
  ta.style.display="none";
  ta.addEventListener("input",function(){state.custom=ta.value; renderBodyTextOnly();});
  ta.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault(); send();}
    else if(e.key==="Escape"){e.preventDefault(); stopEdit();}
  });
  ta.addEventListener("blur",function(){stopEdit();});
  body.appendChild(p); body.appendChild(ta); card.appendChild(body);
  // actions
  var acts=el("div","ed-actions");
  var tones=el("div","ed-tones"); tones.setAttribute("role","group"); tones.setAttribute("aria-label","Tone"); els.tonesWrap=tones;
  els.toneBtns={};
  TONES.forEach(function(t){
    var b=document.createElement("button"); b.type="button"; b.textContent=t.label;
    b.addEventListener("click",function(){pickTone(t.id);});
    tones.appendChild(b); els.toneBtns[t.id]=b;
  });
  var eb=document.createElement("button"); eb.type="button"; eb.className="ed-editbtn"; eb.setAttribute("aria-label","Edit text"); els.editBtn=eb;
  eb.appendChild(svgEl("M14.5 5.5 18.5 9.5M5 19l1-4L15.5 5.5l4 4L10 19l-5 0Z"));
  eb.addEventListener("click",function(){ if(state.editing){stopEdit();} else {startEdit();} });
  tones.appendChild(eb); acts.appendChild(tones);
  var btns=el("div","ed-btns");
  var dis=document.createElement("button"); dis.type="button"; dis.className="ed-discard"; dis.textContent="Discard"; els.discard=dis;
  dis.addEventListener("click",discard);
  var snd=document.createElement("button"); snd.type="button"; snd.className="ed-send"; els.send=snd;
  els.spin=el("span","ed-spin"); els.spin.setAttribute("aria-hidden","true"); els.spin.style.display="none";
  els.sendLabel=el("span","ed-sendlabel","Send email");
  snd.appendChild(els.spin); snd.appendChild(els.sendLabel);
  snd.addEventListener("click",send);
  btns.appendChild(dis); btns.appendChild(snd); acts.appendChild(btns);
  card.appendChild(acts);
  inner.appendChild(card);
  // receipt
  var rc=el("div","ed-receipt"); rc.setAttribute("role","status"); rc.style.display="none"; els.receipt=rc;
  els.ricon=el("span","ed-ricon"); els.ricon.setAttribute("aria-hidden","true"); els.ricon.setAttribute("data-tone","ok");
  els.riconSvgOk=svgEl("m6 12.5 4 4 8-9"); els.riconSvgNo=svgEl("M7 7l10 10M17 7 7 17");
  els.ricon.appendChild(els.riconSvgOk);
  els.rtext=el("span","ed-rtext");
  els.rtextPre=document.createTextNode(""); els.rtextBold=el("b"); els.rtextPost=document.createTextNode("");
  els.rtext.appendChild(els.rtextPre); els.rtext.appendChild(els.rtextBold); els.rtext.appendChild(els.rtextPost);
  els.undo=document.createElement("button"); els.undo.type="button"; els.undo.className="ed-undo"; els.undo.textContent="Undo";
  els.undo.addEventListener("click",undo);
  rc.appendChild(els.ricon); rc.appendChild(els.rtext); rc.appendChild(els.undo);
  inner.appendChild(rc);
  // foot
  var foot=el("div","ed-foot");
  els.agent=el("span","ed-agent",DATA.agent); els.agent.title=DATA.agent;
  els.badge=el("span","ed-badge","Ready for review"); els.badge.setAttribute("data-tone","ok");
  els.hint=el("span","ed-hint","⌘ Enter to send");
  foot.appendChild(els.agent); foot.appendChild(els.badge); foot.appendChild(els.hint);
  tray.appendChild(foot);
  root.appendChild(tray);
  document.addEventListener("pointerdown",function(e){ if(state.menuOpen&&els.toWrap&&!els.toWrap.contains(e.target)){setMenu(false);} });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&state.menuOpen){setMenu(false);} });
  renderAll();
  try{
    var ta2=els.edit; ta2.value=shownBody();
    if(window.__emailDraftTest)window.__emailDraftTest.ready=true;
  }catch(e){}
}
function renderAll(){renderRecipient(); renderAttachment(); renderBody(); renderTones(); renderButtons(); renderReceipt(); renderBadge();}
function renderRecipient(){
  var c=state.recipient;
  els.rname.textContent=c.name;
  els.remail.textContent="("+c.email+")";
  els.recipBtn.title=c.name+" <"+c.email+">";
  els.recipBtn.setAttribute("aria-expanded",state.menuOpen?"true":"false");
  els.menu.style.display=state.menuOpen?"grid":"none";
  els.menuItems.forEach(function(it){
    var sel=it.contact.email===c.email;
    it.btn.setAttribute("aria-selected",sel?"true":"false");
    it.tick.style.display=sel?"":"none";
  });
}
function renderAttachment(){
  var has=!!state.attachment;
  els.file.style.display=has?"inline-flex":"none";
  els.attach.style.display=(!has&&DATA.attachment)?"inline-flex":"none";
  if(has){els.fname.textContent=state.attachment; els.fname.title=state.attachment; els.fremove.setAttribute("aria-label","Remove "+state.attachment);}
  else {els.attachLabel.textContent="Attach "+DATA.attachment; els.attachLabel.title=DATA.attachment;}
  renderReceipt();
}
function renderBodyTextOnly(){
  els.textBody.textContent=shownBody();
  if(state.editing&&document.activeElement!==els.edit){/* keep focus */}
  renderTones();
}
function renderBody(){
  var g=shownBody();
  els.textBody.textContent=g;
  if(state.editing){
    els.text.style.display="none"; els.edit.style.display="block";
    if(els.edit.value!== (state.custom!=null?state.custom:""))els.edit.value=(state.custom!=null?state.custom:"");
    autoresize();
  }else{
    els.edit.style.display="none"; els.text.style.display="";
  }
  renderTones();
}
function autoresize(){try{var ta=els.edit; ta.style.height="auto"; var h=ta.scrollHeight; if(h)ta.style.height=h+"px";}catch(e){}}
function renderTones(){
  TONES.forEach(function(t){
    var b=els.toneBtns[t.id];
    b.setAttribute("aria-pressed",(state.toneId===t.id&&state.custom===null)?"true":"false");
  });
  els.editBtn.setAttribute("aria-pressed",state.editing?"true":"false");
}
function renderButtons(){
  var sending=state.phase==="sending";
  els.discard.disabled=sending;
  els.send.disabled=sending||!state.recipient.email;
  els.spin.style.display=sending?"":"none";
  els.sendLabel.textContent=sending?"Sending":"Send email";
  if(sending)els.card.setAttribute("data-sending",""); else els.card.removeAttribute("data-sending");
}
function renderReceipt(){
  var isDraft=state.phase==="draft"||state.phase==="sending";
  els.card.style.display=isDraft?"":"none";
  els.receipt.style.display=isDraft?"none":"flex";
  if(!isDraft){
    var sent=state.phase==="sent";
    // swap icon in place: reuse nodes, toggle display
    var hasOk=els.ricon.firstChild===els.riconSvgOk;
    if(sent&&!hasOk){els.ricon.removeChild(els.ricon.firstChild); els.ricon.appendChild(els.riconSvgOk);}
    if(!sent&&hasOk){els.ricon.removeChild(els.ricon.firstChild); els.ricon.appendChild(els.riconSvgNo);}
    els.ricon.setAttribute("data-tone",sent?"ok":"muted");
    if(sent){
      els.rtextPre.textContent="Sent to ";
      els.rtextBold.textContent=state.recipient.name; els.rtextBold.setAttribute("dir","auto");
      els.rtextPost.textContent=state.attachment?(" with "+state.attachment):"";
      els.rtextBold.style.display=""; els.rtextPre.textContent="Sent to ";
    }else{
      els.rtextPre.textContent="Draft discarded"; els.rtextBold.textContent=""; els.rtextPost.textContent="";
    }
  }
}
function renderBadge(){
  var t="Ready for review",tone="ok";
  if(state.phase==="sent"){t="Sent"; tone="ok";}
  else if(state.phase==="discarded"){t="Discarded"; tone="muted";}
  // update in place without replacing node
  if(els.badge.textContent!==t)els.badge.textContent=t;
  els.badge.setAttribute("data-tone",tone);
  var showHint=(state.phase==="draft"||state.phase==="sending");
  els.hint.style.display=showHint?"":"none";
}
function setMenu(open){state.menuOpen=open; renderRecipient();}
function startEdit(){
  if(state.phase!=="draft"&&state.phase!=="sending")return;
  if(state.custom===null)state.custom=shownBody();
  state.editing=true; renderBody(); renderTones();
  try{els.edit.focus(); els.edit.setSelectionRange(els.edit.value.length,els.edit.value.length);}catch(e){}
}
function stopEdit(){state.editing=false; renderBody();}
function pickTone(id){
  if(id!==state.toneId||state.custom!==null){
    state.toneId=id; state.custom=null; state.editing=false; renderBody(); renderButtons();
  }
}
function pickRecipient(nc){
  var old=state.recipient;
  state.recipient=nc; setMenu(false);
  if(state.custom!==null){
    var oldFull=String(old.name||"").trim(), oldFirst=firstName(old);
    var parts=[];
    if(oldFull)parts.push(escReg(oldFull));
    if(oldFirst)parts.push("\\b"+escReg(oldFirst)+"\\b");
    if(parts.length){
      try{
        var re=new RegExp(parts.join("|"),"g");
        state.custom=String(state.custom).replace(re,function(m){return m===oldFull?String(nc.name||"").trim():firstName(nc);});
      }catch(e){}
    }
  }
  renderRecipient(); renderBodyTextOnly(); renderButtons(); renderReceipt();
}
function send(){
  if(state.phase!=="draft"||!state.recipient.email)return;
  state.editing=false; state.phase="sending"; renderBody(); renderButtons(); renderBadge(); renderReceipt();
  if(sendTimer)clearTimeout(sendTimer);
  sendTimer=setTimeout(function(){
    state.phase="sent"; renderButtons(); renderReceipt(); renderBadge(); sendTimer=null;
  },900);
}
function discard(){state.editing=false; state.phase="discarded"; renderBody(); renderButtons(); renderReceipt(); renderBadge();}
function undo(){state.phase="draft"; if(sendTimer){clearTimeout(sendTimer); sendTimer=null;} renderButtons(); renderReceipt(); renderBadge(); renderBody();}
// theme
function initTheme(){
  var btn=document.getElementById("themeBtn");
  function paint(){
    var cur=document.documentElement.getAttribute("data-theme")||"light";
    btn.textContent=(cur==="dark"?"☀":"☾");
    btn.setAttribute("aria-label",cur==="dark"?"Switch to light theme":"Switch to dark theme");
  }
  btn.addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme")||"light";
    var nxt=cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",nxt);
    try{localStorage.setItem("email-draft-theme",nxt);}catch(e){}
    paint();
  });
  paint();
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){build(); initTheme();});}
else{build(); initTheme();}
window.__emailDraft={state:state,els:function(){return els;},actions:{startEdit:startEdit,stopEdit:stopEdit,pickTone:pickTone,pickRecipient:pickRecipient,send:send,discard:discard,undo:undo,setMenu:setMenu},contacts:CONTACTS};
})();
</script>
</body>
</html>
