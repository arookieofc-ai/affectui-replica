<html lang="en" data-theme="light">
<head><script>/*noflash*/(function(){try{var t=null;var k="awb-theme";t=localStorage.getItem(k);if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script><style>/*noflash*/html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style><meta name="color-scheme" content="light dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent workbench — affectUI replica</title>
<style>
/* ---- Design tokens (single source of truth for colour) ---- */
html[data-theme="light"]{
  --surface:#ffffff; --page:#fafaf9; --ink:#1c1917; --ink-soft:rgba(28,25,23,.88);
  --muted:#57534e; --faint:#716a66; --subtle:#f5f5f4; --border:#e7e5e4; --edge:#e7e5e4;
  --tag:#f0efed; --blue:#0060e2; --blue-bg:rgba(0,96,226,.07); --wire:rgba(0,96,226,.22);
  --ok:#147a3a; --ok-bg:rgba(21,128,61,.10); --amber:#92400e; --amber-bg:#fef3c7; --amber-line:#f59e0b;
  --red:#b91c1c; --red-bg:rgba(185,28,28,.08);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-hover:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  --mark:rgba(0,96,226,.78); --focus:rgba(0,96,226,.7);
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink-soft:rgba(237,237,237,.9);
  --muted:#a1a1aa; --faint:#97979e; --subtle:#26262a; --border:#2e2e33; --edge:#34343a;
  --tag:#2b2b30; --blue:#8ab4ff; --blue-bg:rgba(138,180,255,.13); --wire:rgba(138,180,255,.30);
  --ok:#4ade80; --ok-bg:rgba(74,222,128,.13); --amber:#fde68a; --amber-bg:#451a03; --amber-line:#fbbf24;
  --red:#f87171; --red-bg:rgba(248,113,113,.12);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.35);
  --shadow-hover:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --mark:rgba(138,180,255,.85); --focus:rgba(138,180,255,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--muted);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.page{max-width:1060px;margin:0 auto;padding:28px 24px 64px}
/* ---- Page header (live status derived from demo state, no invented data) ---- */
.page-head{display:flex;align-items:flex-start;gap:16px;margin:0 0 6px}
.page-head .titles{flex:1;min-width:0}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.page-head h1{margin:0;font-size:20px;line-height:1.25;color:var(--ink);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-head .sub{margin:4px 0 0;font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-btn{
  flex:none;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;
  border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);
  font:inherit;font-size:13px;font-weight:550;cursor:pointer;box-shadow:var(--shadow);
  transition:box-shadow 160ms ease,transform 160ms ease,background-color 160ms ease;
}
.theme-btn:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-btn svg{width:15px;height:15px}
/* column labels: reserved space above cards, never overlapping */
.col-labels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1.1fr);column-gap:36px;margin:18px 0 8px}
.col-labels span{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- Workbench stage ---- */
.wb{position:relative}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1.1fr);grid-template-areas:"user agent files" "tools tools tools";column-gap:36px;row-gap:44px;align-items:start}
.wires{position:absolute;inset:0;z-index:0;overflow:visible;pointer-events:none}
.wires path.wire{fill:none;stroke:var(--wire);stroke-width:1.25;stroke-linecap:round;transition:stroke 300ms ease}
.wires path.wire.on{stroke:var(--blue)}
.wires circle.port{fill:var(--surface);stroke:var(--wire);stroke-width:1.5;transition:stroke 300ms ease}
.wires circle.port.on{stroke:var(--blue)}
.wires circle.pulse{fill:none;stroke:var(--blue);stroke-width:2;stroke-opacity:.35}
.card{position:relative;z-index:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);transition:box-shadow 180ms ease,transform 180ms ease,border-color 180ms ease}
.card:hover{box-shadow:var(--shadow-hover)}
.card.open{z-index:6;box-shadow:var(--shadow-hover)}
.hit{position:absolute;inset:0;z-index:1;margin:0;padding:0;border:0;border-radius:inherit;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* pixel-mark: deterministic 3x3 identity grid, exactly 9 cells */
.mark{display:grid;grid-template-columns:repeat(3,3px);grid-auto-rows:3px;gap:1.5px;place-content:center;width:16px;height:16px;flex:none}
.mark i{border-radius:.75px;background:var(--mark);opacity:0}
.mark i.lit{opacity:1}
.mark.person i{background:var(--ink-soft)}
.mark.busy i{animation:pix 1.2s ease-in-out infinite both}
.mark.busy i:not(.lit){opacity:.16}
@keyframes pix{0%,100%{opacity:1}50%{opacity:.2}}
.avatar{display:grid;flex:none;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--border)}
.avatar.photo{overflow:hidden;border-radius:50%;padding:0}
.avatar.photo img{display:block;width:100%;height:100%;object-fit:cover}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.name{min-width:0;overflow:hidden;font-weight:600;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
/* user card */
.user-card{grid-area:user;display:grid;gap:10px;padding:12px 14px 14px}
.msg{padding:8px 10px;border-radius:4px 12px 12px 12px;background:var(--subtle);border:1px solid var(--border);color:var(--ink-soft);overflow-wrap:anywhere}
.msg span{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:4}
/* agent card */
.agent-card{grid-area:agent;display:grid;gap:10px;padding:12px 14px 16px}
.agent-head{display:flex;align-items:center;gap:8px;min-width:0}
.agent-who{display:grid;flex:1;min-width:0;line-height:16px}
.agent-who>*{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.agent-who .sub{font-size:12px;color:var(--faint)}
.pill{display:inline-flex;flex:none;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:600;white-space:nowrap}
.pill.done{gap:5px;background:var(--ok-bg);color:var(--ok)}
.pill svg{width:12px;height:12px;flex:none}
.pill.idle{background:var(--tag);color:var(--faint)}
.spin{width:12px;height:12px;flex:none;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;opacity:.45;animation:rot 800ms linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.work{display:grid;grid-template-rows:repeat(3,24px);margin:0;padding:6px 10px;border-radius:10px;background:var(--subtle);border:1px solid var(--border);list-style:none;align-content:start}
.step{display:flex;align-items:center;gap:8px;min-width:0;color:var(--faint);animation:rise 320ms ease both}
.step.live{color:var(--ink-soft)}
.step .blank{color:transparent;user-select:none}
@keyframes rise{from{opacity:0;transform:translateY(-8px)}}
.step-ic{display:grid;flex:none;place-items:center;width:16px;height:16px;color:var(--ok)}
.step-ic svg{width:13px;height:13px}
.step-tx{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.shine{background:linear-gradient(90deg,var(--faint) 0 35%,var(--ink) 50%,var(--faint) 65% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.step-logo{display:grid;flex:none;place-items:center;width:16px;height:16px}
.step-logo svg{width:14px;height:14px}
/* files card */
.files-card{grid-area:files;display:grid;gap:8px;padding:12px 10px 10px;align-content:start}
.files-head{display:flex;align-items:center;gap:10px;min-width:0;padding:0 4px}
.folder{display:grid;flex:none;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.folder svg{width:18px;height:15px}
.files-title{display:grid;flex:1;min-width:0;line-height:16px}
.files-title b{font-size:13.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files-title span{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-list{display:grid;margin:0;padding:0;list-style:none}
.file-row{position:relative}
.fbtn{display:flex;align-items:center;gap:8px;width:100%;min-width:0;min-height:30px;margin:0;padding:2px 4px;border:0;border-radius:8px;background:none;font:inherit;color:inherit;text-align:inherit;cursor:pointer;transition:background-color 160ms ease}
.fbtn:hover,.fbtn[aria-expanded="true"]{background:var(--tag)}
.fbtn:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.fbtn.hot{background:var(--blue-bg)}
.flogo{display:grid;flex:none;place-items:center;width:16px;height:16px}
.flogo svg{width:15px;height:15px}
.fname{flex:1;min-width:0;overflow:hidden;color:var(--ink-soft);white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.fmeta{flex:none;font-size:12px;color:var(--faint)}
.fmore{display:flex;align-items:center;min-height:28px;padding-left:28px;color:var(--faint);font-size:12px}
/* tools */
.tools-head{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.tools{grid-area:tools;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0;padding:0;list-style:none}
.tool-card{display:grid;gap:10px;padding:12px 14px 14px}
.tool-head{display:flex;align-items:center;gap:10px;min-width:0}
.tlogo{display:grid;flex:none;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.tlogo svg{width:17px;height:17px}
.tool-who{display:grid;flex:1;min-width:0;line-height:16px}
.tool-who>*{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tool-who b{color:var(--ink);font-weight:600;font-size:13.5px}
.tool-who span{font-size:12px;color:var(--faint)}
.tag{flex:none;align-self:start;padding:0 8px;border-radius:999px;background:var(--tag);color:var(--faint);font-size:11px;font-weight:600;line-height:19px;transition:background-color 180ms ease,color 180ms ease;white-space:nowrap}
.tag[data-s="on"]{background:var(--blue-bg);color:var(--blue)}
.tag[data-s="used"]{background:var(--ok-bg);color:var(--ok)}
.tool-last{display:flex;align-items:baseline;gap:8px;min-width:0;min-height:20px;margin:0;font-size:12px}
.tool-last .what{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.tool-last .when{flex:none;color:var(--faint)}
/* popovers */
.pop{--py:-4px;position:absolute;top:calc(100% + 8px);left:0;z-index:8;display:grid;gap:10px;width:100%;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-hover);color:var(--muted);transform-origin:top center;animation:pop .18s ease both}
.pop.above{--py:4px;top:auto;bottom:calc(100% + 8px);transform-origin:bottom center}
.pop.leaving{pointer-events:none;animation:popout .13s ease-in both}
@keyframes pop{from{opacity:0;transform:translateY(var(--py)) scale(.97)}}
@keyframes popout{to{opacity:0;transform:translateY(var(--py)) scale(.98)}}
.file-row .pop{top:calc(100% + 6px);right:-10px;left:-10px;width:auto}
/* top-level layer: file/agent/tool popovers are portalled to <body> so they
   paint above every card (old bug: file pop lived inside the files-card
   stacking context, z-index 1, so the later Drive tool card covered its bottom) */
.pop[data-layer="top"]{position:fixed;top:auto;bottom:auto;left:auto;right:auto;z-index:50;width:280px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto}
.pop-head{display:flex;align-items:center;gap:10px;min-width:0;padding:0 2px}
.pop-who{display:grid;flex:1;min-width:0;line-height:16px}
.pop-who>*{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pop-who b{color:var(--ink)}
.pop-who span{font-size:12px;color:var(--faint)}
.facts{display:grid;margin:0;padding:4px 10px;border-radius:10px;background:var(--subtle);border:1px solid var(--border);font-size:12px;line-height:24px}
.facts>div{display:flex;gap:16px;min-width:0}
.facts dt{flex:none;color:var(--faint)}
.facts dd{flex:1;min-width:0;margin:0;overflow:hidden;color:var(--ink-soft);text-align:right;white-space:nowrap;text-overflow:ellipsis}
.pop-run{display:grid;gap:2px;padding:0 2px}
.pop-label{font-size:12px;line-height:18px;color:var(--faint)}
.pop-steps{display:grid;margin:0;padding:0;list-style:none}
.pop-steps li{display:flex;align-items:center;gap:8px;min-width:0;min-height:24px;font-size:12px}
.pop-steps li span:last-child{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pop-none{font-size:12px;line-height:24px;color:var(--faint)}
/* footer */
.foot{margin:26px 0 0;font-size:12.5px;color:var(--faint)}
.wb[data-fading="1"] .stage{opacity:.35;transition:opacity .4s ease}
.stage{transition:opacity .25s ease}
/* responsive: narrow = stacked list, wires hidden */
@media (max-width:720px){
  .page{padding:20px 16px 48px}
  .col-labels{display:none}
  .stage{grid-template-columns:minmax(0,1fr);grid-template-areas:"user" "agent" "files" "tools";row-gap:12px}
  .tools{grid-template-columns:minmax(0,1fr);gap:12px}
  .wires{display:none}
  .page-head h1{white-space:normal}
  .page-head .sub{white-space:normal}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .shine{background:none;-webkit-text-fill-color:currentColor}
  .wires .pulse{display:none}
}
</style>
</head>
<body>
<div class="page">
  <header class="page-head">
    <div class="titles">
      <p class="eyebrow">Agent workbench</p>
      <h1 id="pg-title">Assistant &middot; Q4 budget for Marc</h1>
      <p class="sub" id="pg-status">Idle &middot; 1 agent &middot; 3 tools &middot; 3 files</p>
    </div>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch to dark theme">
      <svg id="theme-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/></svg>
      <span id="theme-tx">Dark</span>
    </button>
  </header>

  <div class="col-labels" aria-hidden="true"><span>Requester</span><span>Agent</span><span>Files</span></div>

  <main class="wb" id="wb">
    <div class="stage" id="stage">
      <svg class="wires" id="wires" aria-hidden="true"></svg>

      <section class="card user-card" id="card-user" aria-label="Requester">
        <div class="who">
          <span class="avatar" id="u-avatar"></span>
          <span class="name" dir="auto" id="u-name"></span>
        </div>
        <p class="msg"><span dir="auto" id="u-msg"></span></p>
      </section>

      <section class="card agent-card" id="card-agent" aria-label="Agent">
        <button class="hit" id="hit-agent" type="button" aria-expanded="false" aria-controls="pop-agent"></button>
        <div class="agent-head">
          <span id="a-mark"></span>
          <span class="agent-who"><b dir="auto" id="a-name"></b><span class="sub" dir="auto" id="a-sub"></span></span>
          <span class="pill" id="a-pill"></span>
        </div>
        <ol class="work" id="a-work" aria-live="polite" aria-label="What it does"></ol>
      </section>

      <section class="card files-card" id="card-files" aria-label="Uploaded files">
        <div class="files-head">
          <span class="folder" id="folder-ic"></span>
          <span class="files-title"><b>Uploaded files</b><span id="files-count"></span></span>
        </div>
        <ul class="file-list" id="file-list"></ul>
      </section>

      <ul class="tools" id="tools"></ul>
    </div>
    <div class="tools-head" style="display:none"></div>
    <p class="foot" id="foot">Live demo &mdash; loops every few seconds. Select any card to see details. Hover pauses the loop.</p>
  </main>
</div>

<script>

  { id:'s2', text:'Reading budget-q4.xlsx', at:'files', reading:'budget', ms:2000 },

  { id:'s4', text:'Booking Tue 10:30 \u2013 11:00', at:'calendar', ms:1600 },
  { id:'s5', text:'Sharing budget-q4.xlsx with Marc', at:'drive', ms:1800 },
  { id:'s6', text:'Sending the invite to Marc', at:'gmail', ms:2000 }
];
var START_DELAY = 600, HOLD_DONE = 3600, FADE_MS = 400;
/* pixel-cell delays from the original (row-major 3x3) */
var CELL_DELAYS = [0,120,240,120,240,360,240,360,480];

/* ============ tiny DOM helpers ============ */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function svgEl(tag, attrs){
  var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
var SVGNS = 'http://www.w3.org/2000/svg';

/* ============ deterministic 3x3 pixel-mark (my own hash; always exactly 9 cells) ============ */
function markPattern(id){
  var h = 0, s = String(id), i, x, bits = [];
  for(i=0;i<s.length;i++) h = ((h*31) + s.charCodeAt(i)) >>> 0;
  x = (h || 0x9e3779b9) >>> 0;
  for(i=0;i<9;i++){
    x ^= (x << 13) >>> 0; x >>>= 0; x ^= (x >>> 17); x ^= (x << 5) >>> 0; x >>>= 0;
    bits.push(((x >>> (i % 8)) ^ (x >>> ((i*3+1) % 16))) & 1);
  }
  var on = 0, j;
  for(j=0;j<9;j++) if(bits[j]) on++;
  for(j=0;j<9 && on<5;j+=2){ if(!bits[j]){ bits[j]=1; on++; } } /* guarantee >=5 lit */
  return bits;
}
function pixelMark(id, opts){

/* ============ demo engine (injectable scheduler so tests can fast-forward) ============ */
function createEngine(o){
  var steps = o.steps, set = o.set, clear = o.clear, tick = o.tick, paused = o.isPaused || function(){return false;};
  var timers = [], count = 0, fading = false, run = 0, started = false;
  function later(fn, ms){ var id = set(fn, ms); timers.push(id); return id; }
  /* restart helper: waits out hover/focus pauses in 500ms slices (as in the original) */
  function scheduleRestart(at){
    later(function go(){
      if(paused()){ later(go, 500); return; }
      fading = true; tick(snapshot());
      later(function(){ count = 0; fading = false; run++; tick(snapshot()); runRound(); }, o.fadeMs);
    }, at);
  }
  function runRound(){
    var n = 0; /* continuing on the same clock: steps follow immediately after reset */
    steps.forEach(function(s, i){
      (function(idx, at){ later(function(){ count = idx+1; tick(snapshot()); }, at); })(i, n);
      n += s.ms;
    });
    later(function(){ count = steps.length + 1; tick(snapshot()); }, n);
    scheduleRestart(n + o.holdMs);
  }
  function start(){
    if(started) return; started = true;
    var n = o.startDelay;
    steps.forEach(function(s, i){
      (function(idx, at){ later(function(){ count = idx+1; tick(snapshot()); }, at); })(i, n);
      n += s.ms;
    });
    later(function(){ count = steps.length + 1; tick(snapshot()); }, n);
    scheduleRestart(n + o.holdMs);
  }
  function snapshot(){
    var vis = steps.slice(0, Math.min(count, steps.length)).map(function(s, idx, arr){
      return { id:s.id, text:s.text, at:s.at, reading:s.reading,
               running: idx===count-1 && count<=steps.length };
    });
    return { count:count, run:run, fading:fading, done:count>steps.length, visible:vis,
             current: count<=steps.length ? steps[count-1] : null };
  }
  return { start:start, snapshot:snapshot,
    destroy:function(){ timers.forEach(function(id){ if(id!=null) try{clear(id);}catch(e){} }); timers = []; } };
}

/* ============ app ============ */
function pastVerb(text){
  return text.replace(/^Checking/,'Checked').replace(/^Booking/,'Booked')
             .replace(/^Sharing/,'Shared').replace(/^Sending/,'Sent');
}
function toolState(toolId, vis, done){
  var cur = null, lastDone = null, i;
  for(i=0;i<vis.length;i++){ if(vis[i].at===toolId){ if(vis[i].running && !done) cur = vis[i]; else lastDone = vis[i]; } }
  if(cur) return { s:'on', cur:cur, last:lastDone };
  if(lastDone) return { s:'used', cur:null, last:lastDone };
  return { s:'ready', cur:null, last:null };
}
/* Pure popover placement (testable): given a trigger rect, pop size,
   viewport and card rects, return {left, top, above} for a pop that stays
   inside the viewport and avoids overlapping any card when possible. */
function popPlacement(trig, popSize, vp, cards){
  var w = Math.max(200, Math.min(popSize.w, vp.w - 16));
  var h = Math.min(popSize.h, vp.h - 16);
  var left = Math.max(8, Math.min(trig.left, vp.w - w - 8));
  function hits(t, l){
    var r = {left:l, top:t, right:l + w, bottom:t + h};
    if(r.top < 8 || r.bottom > vp.h - 8) return true;
    for(var i=0;i<cards.length;i++){
      var c = cards[i];
      if(r.left < c.right && r.right > c.left && r.top < c.bottom && r.bottom > c.top) return true;
    }
    return false;
  }
  var belowTop = trig.bottom + 8, aboveTop = trig.top - h - 8;
  var belowHits = hits(belowTop, left);
  var aboveHits = (aboveTop < 8) || hits(Math.max(8, aboveTop), left);
  if(!belowHits) return {left:left, top:belowTop, above:false, w:w, h:h};
  if(!aboveHits) return {left:left, top:Math.max(8, aboveTop), above:true, w:w, h:h};
  if(aboveTop >= 8) return {left:left, top:Math.max(8, aboveTop), above:true, w:w, h:h};
  return {left:left, top:Math.max(8, Math.min(belowTop, vp.h - h - 8)), above:false, w:w, h:h};
}

  /* Top-level popover layer: position a portalled pop next to its trigger,
     flipped above when below-space is blocked, clamped inside the viewport,
     and steered clear of card rects so no card can cover the pop's bottom. */
  function popHeight(pop){
    try{
      if(pop.offsetHeight) return pop.offsetHeight;
      var r = pop.getBoundingClientRect ? pop.getBoundingClientRect() : null;
      if(r && r.height) return r.height;
    }catch(e){}
    return 180;
  }
  function cardRects(excludePop){
    var out = [];
    try{
      var nodes = document.querySelectorAll ? document.querySelectorAll('.card, .file-row') : [];
      for(var i=0;i<nodes.length;i++){
        var n = nodes[i];
        if(excludePop && (n === excludePop || (n.contains && n.contains(excludePop)))) continue;
        if(n.getBoundingClientRect){
          var r = n.getBoundingClientRect();
          if(r && (r.width || r.height)) out.push({left:r.left, top:r.top, right:r.right, bottom:r.bottom});
        }
      }
    }catch(e){}
    return out;

  function placePop(pop, trigger){
    try{
      var r = trigger.getBoundingClientRect ? trigger.getBoundingClientRect() : null;
      if(!r || (!r.width && !r.height && !r.top && !r.bottom && !r.left && !r.right)) return;
      var vw = (window.innerWidth || (document.documentElement && document.documentElement.clientWidth) || 1024);
      var vh = (window.innerHeight || (document.documentElement && document.documentElement.clientHeight) || 768);
      var w = r.width || 280;
      try{
        var host = document.getElementById('card-files');
        if(host && host.getBoundingClientRect){
          var hr = host.getBoundingClientRect();
          if(hr && hr.width && hr.width < vw) w = Math.min(hr.width, vw - 16);
        }
      }catch(e){}
      var ph = popHeight(pop);
      var p = popPlacement(
        {left:r.left, top:r.top, right:r.right, bottom:r.bottom},
        {w:w, h:ph}, {w:vw, h:vh}, cardRects(pop));
      pop.style.width = p.w + 'px';
      if(p.h < ph) pop.style.maxHeight = p.h + 'px';
      pop.style.left = p.left + 'px';
      pop.style.top = p.top + 'px';
      if(p.above) pop.classList.add('above'); else pop.classList.remove('above');
    }catch(e){}
  }
  function repositionOpen(){

  function togglePop(kind, id){
    if(open && open.kind===kind && open.id===id){ closePop(); return; }
    closePop();
    var card, trigger, headKids = [], facts = [], extra = null, side = 'below';
    if(kind==='agent'){
      card = document.getElementById('card-agent'); trigger = document.getElementById('hit-agent');

      extra = run; side = 'below';

    }else{
      var tc = null; toolCards.forEach(function(c){ if(c.t.id===id) tc = c; });
      if(!tc) return;
      card = tc.card; trigger = tc.hit;
      var tl = el('span','tlogo'); tl.appendChild(logoFor(tc.t.id)); headKids.push(tl);
      var tw = el('span','pop-who');
      var tb = el('b',null,tc.t.name); tb.dir='auto'; tw.appendChild(tb);
      if(tc.t.scope){ var ts = el('span',null,tc.t.scope); ts.dir='auto'; tw.appendChild(ts); }
      headKids.push(tw);
      var st = toolState(tc.t.id, lastVis, lastDone);
      var tt = el('span','tag', st.s==='on'?'Calling':st.s==='used'?'Used':'Ready');
      tt.setAttribute('data-s', st.s); headKids.push(tt);
      facts = tc.t.details;
      var tr = el('div','pop-run');
      tr.appendChild(el('p','pop-label','This request'));
      var steps2 = lastVis.filter(function(s){return s.at===tc.t.id;}).slice(-3).reverse();
      if(steps2.length){
        var ol2 = el('ol','pop-steps');
        steps2.forEach(function(s){ ol2.appendChild(stepLi(s, s.running && !lastDone)); });
        tr.appendChild(ol2);
      }else{ tr.appendChild(el('p','pop-none','Not called yet')); }

    pop.setAttribute('aria-label', (kind==='agent'?AGENT.name:kind==='file'?findFile(id).name:findTool(id).name) + ' \u2013 details');
    if(side==='above') pop.classList.add('above');

    pop.appendChild(ph);

    if(extra) pop.appendChild(extra);
    pop.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    /* portal to a top-level layer so no later card can paint over the pop */
    pop.setAttribute('data-layer','top');
    (document.body || card).appendChild(pop);
    placePop(pop, trigger);
    card.classList.add('open');
    trigger.setAttribute('aria-expanded','true');
    trigger.setAttribute('aria-controls', pop.id);
    open = { kind:kind, id:id, pop:pop, card:card, trigger:trigger };

    if(!repositionOpen._wired){
      repositionOpen._wired = true;
      try{
        if(window.addEventListener){
          window.addEventListener('resize', repositionOpen);
          window.addEventListener('scroll', repositionOpen, true);
        }
      }catch(e){}
    }
  }
  function findFile(id){ for(var i=0;i<FILES.length;i++) if(FILES[i].id===id) return FILES[i]; return FILES[0]; }

  /* ---- render from engine state ---- */
  var lastVis = [], lastDone = false, currentRunning = null;
  function doneCount(){ return lastVis.filter(function(s){return !s.running;}).length; }
  function usedCount(){
    var seen = {}, n = 0;
    lastVis.forEach(function(s){ if(!s.running && s.at!=='user' && s.at!=='files' && !seen[s.at]){ seen[s.at]=1; n++; } });
    return n;
  }
  function isReading(fid){ return !!currentRunning && currentRunning.at==='files' && currentRunning.reading===fid && !lastDone; }
  function render(st){
    lastVis = st.visible; lastDone = st.done;
    currentRunning = st.done ? null : (st.visible.length ? st.visible[st.visible.length-1] : null);
    if(currentRunning && !currentRunning.running) currentRunning = null;
    root.setAttribute('data-fading', st.fading ? '1' : '0');
    /* agent mark */
    while(aMarkSlot.firstChild) aMarkSlot.removeChild(aMarkSlot.firstChild);
    aMarkSlot.appendChild(pixelMark(AGENT.id, {busy:!!currentRunning}));
    /* pill */
    pill.className = 'pill' + (st.done ? ' done' : (!st.visible.length ? ' idle' : ''));
    while(pill.firstChild) pill.removeChild(pill.firstChild);
    if(st.done){ pill.appendChild(checkIcon()); pill.appendChild(document.createTextNode('Done')); }
    else if(currentRunning){ var sp = el('span','spin'); pill.appendChild(sp); pill.appendChild(document.createTextNode('Working')); }
    else { pill.appendChild(document.createTextNode('Idle')); }
    /* work rows: fixed 3 slots, newest first */
    while(work.firstChild) work.removeChild(work.firstChild);
    var rows = st.visible.slice(-3).reverse();
    for(var i=0;i<3;i++){
      (function(idx){
        var li = el('li','step');
        var s = rows[idx];
        if(!s){
          if(idx===0 && !st.visible.length){ li.appendChild(el('span','step-ic')); li.appendChild(el('span','step-tx','Waiting for a request')); }
          else { li.appendChild(el('span','blank','\u00A0')); }
          work.appendChild(li); return;
        }
        var live = s.running && !st.done;
        if(live) li.setAttribute('data-live','');
        var ic = el('span','step-ic');
        if(live) ic.appendChild(el('span','spin')); else ic.appendChild(checkIcon());
        li.appendChild(ic);
        var tx = el('span', live ? 'step-tx shine' : 'step-tx', live ? s.text : pastVerb(s.text));
        if(!live && !st.done && idx>0){ /* completed earlier step: plain past text */ }
        tx.dir = 'auto'; li.appendChild(tx);
        var lg = el('span','step-logo');
        var toolIds = {}; TOOLS.forEach(function(t){toolIds[t.id]=1;});
        if(s.at==='files') lg.appendChild(folderIcon());
        else if(toolIds[s.at]) lg.appendChild(logoFor(s.at));
        else if(live && s.at==='user') lg.appendChild(pixelMark('person:'+USER.name,{person:true}));
        li.appendChild(lg);
        work.appendChild(li);
      })(i);
    }
    /* files: reading highlight */
    fileRows.forEach(function(r){
      var hot = isReading(r.f.id);
      r.btn.classList.toggle('hot', hot);
      r.tag.style.display = hot ? '' : 'none';
    });
    /* tools */
    toolCards.forEach(function(c){
      var z = toolState(c.t.id, st.visible, st.done);
      c.tag.textContent = z.s==='on' ? 'Calling' : z.s==='used' ? 'Used' : 'Ready';
      c.tag.setAttribute('data-s', z.s);
      c.card.classList.toggle('on', z.s==='on');
      while(c.last.firstChild) c.last.removeChild(c.last.firstChild);
      if(z.s==='on' && z.cur){
        c.last.appendChild(el('span','shine', z.cur.text));
      }else{
        /* last completed step for this tool (past tense + "Just now"), else the seeded text */
        var doneStep = null, k;
        for(k=st.visible.length-1;k>=0;k--){ if(st.visible[k].at===c.t.id && !st.visible[k].running){ doneStep = st.visible[k]; break; } }
        var label = doneStep ? pastVerb(doneStep.text) : c.t.last;
        var when = doneStep ? 'Just now' : c.t.when;
        var w = el('span','what', label); w.dir='auto'; w.title = label; c.last.appendChild(w);
        c.last.appendChild(el('span','when', when));
      }
    });
    /* header status */
    var status;
    if(st.done) status = 'Done \u00B7 1 agent \u00B7 ' + TOOLS.length + ' tools \u00B7 ' + FILES.length + ' files';
    else if(currentRunning) status = 'Working \u00B7 step ' + st.count + ' of ' + STEPS.length + ' \u00B7 1 agent \u00B7 ' + TOOLS.length + ' tools';
    else status = 'Idle \u00B7 1 agent \u00B7 ' + TOOLS.length + ' tools \u00B7 ' + FILES.length + ' files';
    statusEl.textContent = status;
    /* wires active endpoint */
    paintWires(st);
    /* refresh open popover (live tags inside) */
    if(open){
      var k2 = open.kind, id2 = open.id;
      var trig = open.trigger;
      closePopSilent();
      openPopFresh(k2, id2, trig);
    }
  }
  function closePopSilent(){
    if(!open) return;
    var o = open; open = null;
    o.card.classList.remove('open');
    o.trigger.setAttribute('aria-expanded','false');
    o.trigger.removeAttribute('aria-controls');
    if(o.pop.parentNode) o.pop.parentNode.removeChild(o.pop);
  }
  function openPopFresh(kind, id, trig){
    /* re-open without animation fuss by delegating to toggle (open is null now) */
    togglePop(kind, id);
  }

  /* ---- wires (SVG overlay; skipped when layout is unavailable) ---- */
  var wirePaths = [], wirePorts = [], wirePulse = null, wireActive = {};
  function midTop(r2, stage){ return [r2.left + r2.width/2 - stage.left, r2.top - stage.top]; }
  function midLeft(r2, stage){ return [r2.left - stage.left, r2.top + r2.height/2 - stage.top]; }
  function midRight(r2, stage){ return [r2.right - stage.left, r2.top + r2.height/2 - stage.top]; }
  function midBottom(r2, stage){ return [r2.left + r2.width/2 - stage.left, r2.bottom - stage.top]; }
  function layoutWires(){
    try{
      while(wires.firstChild) wires.removeChild(wires.firstChild);
      wirePaths = []; wirePorts = [];
      if(!wires.clientWidth && !stage.clientWidth) return;
      if(window.matchMedia && window.matchMedia('(max-width: 720px)').matches) return;
      var sr = stage.getBoundingClientRect();
      if(!sr.width) return;
      function R(id){ var n = document.getElementById(id); return n ? n.getBoundingClientRect() : null; }
      var u = R('card-user'), a = R('card-agent'), f = R('card-files');
      if(!u || !a || !f) return;
      var defs = [
        { id:'user', a:midRight(u,sr), b:midLeft(a,sr) },
        { id:'files', a:midRight(a,sr), b:midLeft(f,sr) }
      ];
      toolCards.forEach(function(c){
        var tr = c.card.getBoundingClientRect();
        defs.push({ id:c.t.id, a:midBottom(a,sr), b:midTop(tr,sr), drop:true });
      });
      defs.forEach(function(d){
        var p, x1=d.a[0], y1=d.a[1], x2=d.b[0], y2=d.b[1];
        if(d.drop){
          var trunk = Math.min(y1 + 26, y2 - 14);
          p = 'M' + x1 + ' ' + y1 + 'V' + trunk + 'H' + x2 + 'V' + y2;
        }else{
          var mx = (x1+x2)/2;
          p = 'M' + x1 + ' ' + y1 + 'C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
        }
        var path = svgEl('path',{d:p, 'class':'wire'});
        path.setAttribute('data-wire', d.id);
        wires.appendChild(path); wirePaths.push(path);
        [d.a, d.b].forEach(function(pt){
          var c = svgEl('circle',{cx:pt[0], cy:pt[1], r:3.25, 'class':'port'});
          c.setAttribute('data-wire', d.id);
          wires.appendChild(c); wirePorts.push(c);
        });
      });
      var r = stage.getBoundingClientRect();
      wires.setAttribute('viewBox', '0 0 ' + (r.width||1) + ' ' + (r.height||1));
      wires.style.width = '100%'; wires.style.height = '100%';
      paintWires(lastState || {current:null, done:false, visible:[]});
    }catch(e){ /* layout unavailable (e.g. test stub): skip wires */ }
  }
  var lastState = null;
  function paintWires(st){
    lastState = st;
    if(!wirePaths.length) return;
    var active = (!st.done && st.current) ? st.current.at : null;
    if(st.done) active = '__done__';
    wirePaths.forEach(function(p){
      var on = p.getAttribute('data-wire')===active;
      if(on) p.classList.add('on'); else p.classList.remove('on');
    });
    wirePorts.forEach(function(c){
      var on = c.getAttribute('data-wire')===active;
      if(on) c.classList.add('on'); else c.classList.remove('on');
    });
    if(wirePulse && wirePulse.parentNode) wirePulse.parentNode.removeChild(wirePulse);
    wirePulse = null;
    if(active && active!=='__done__'){
      for(var i=0;i<wirePaths.length;i++){
        if(wirePaths[i].getAttribute('data-wire')===active){
          try{
            var dot = svgEl('circle',{r:3, 'class':'pulse'});
            var m = svgEl('animateMotion',{dur:'1.1s', repeatCount:'indefinite', path:wirePaths[i].getAttribute('d')});
            dot.appendChild(m); wires.appendChild(dot); wirePulse = dot;
          }catch(e){}
          break;
        }
      }
    }
  }
  var rsz = null;
  if(window.addEventListener) window.addEventListener('resize', function(){
    if(rsz) return;
    if(window.requestAnimationFrame) rsz = window.requestAnimationFrame(function(){ rsz=null; layoutWires(); });
    else layoutWires();
  });

  /* ---- engine wiring ---- */
  var sched = (scope && scope.sched) ? scope.sched : {
    set:function(fn,ms){ return setTimeout(fn,ms); },
    clear:function(id){ clearTimeout(id); }
  };
  var engine = createEngine({
    steps:STEPS, startDelay:START_DELAY, holdMs:HOLD_DONE, fadeMs:FADE_MS,
    set:sched.set, clear:sched.clear, tick:render,
    isPaused:function(){
      if(hover) return true;
      try{ if(root.contains(document.activeElement)) return true; }catch(e){}
      return false;
    }
  });
  render(engine.snapshot());
  layoutWires();
  engine.start();
  if(window.addEventListener) window.addEventListener('load', layoutWires);

  return { engine:engine, render:render, togglePop:togglePop,
    refs:{ work:work, pill:pill, toolCards:toolCards, fileRows:fileRows, aMarkSlot:aMarkSlot } };
}

/* ============ theme toggle ============ */
(function theme(){
  if(typeof document==='undefined') return;
  var btn = document.getElementById('theme-btn');
  var tx = document.getElementById('theme-tx');
  var ic = document.getElementById('theme-ic');
  var SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/>';
  var MOON = '<path d="M20 13.2A8 8 0 0 1 10.8 4a6.8 6.8 0 1 0 9.2 9.2Z"/>';
  function paint(){
    var dark = document.documentElement.getAttribute('data-theme')==='dark';
    tx.textContent = dark ? 'Light' : 'Dark';
    ic.innerHTML = dark ? SUN : MOON;
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }
  var stored = null;
  try{ stored = window.localStorage ? window.localStorage.getItem('awb-theme') : null; }catch(e){}
  if(stored==='dark' || stored==='light'){
    document.documentElement.setAttribute('data-theme', stored);
  }else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    document.documentElement.setAttribute('data-theme','dark');
  }
  paint();
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ if(window.localStorage) window.localStorage.setItem('awb-theme', next); }catch(e){}
    paint();
  });
})();

/* ============ boot (skipped when there is no DOM, e.g. node harness) ============ */
var __api = null;
if(typeof document!=='undefined' && document.getElementById && document.getElementById('wb')){
  if(document.readyState==='loading' && document.addEventListener){
    document.addEventListener('DOMContentLoaded', function(){ __api = init(); });
  }else{ __api = init(); }
}
if(typeof window!=='undefined') window.__awb = { init:init, createEngine:createEngine, markPattern:markPattern, popPlacement:popPlacement,
  STEPS:STEPS, TOOLS:TOOLS, FILES:FILES, USER:USER, AGENT:AGENT,
  get api(){ return __api; } };
if(typeof globalThis!=='undefined') globalThis.__awb = (typeof window!=='undefined' && window.__awb) || { init:init, createEngine:createEngine, markPattern:markPattern, popPlacement:popPlacement, STEPS:STEPS, TOOLS:TOOLS, FILES:FILES, USER:USER, AGENT:AGENT };
})();
