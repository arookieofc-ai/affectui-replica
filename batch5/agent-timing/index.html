<style>

  --atg-amber-bg: #451a03;

:root {

/* ============ page ============ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--muted);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  min-height: 100vh;
  transition: background 150ms ease, color 150ms ease;
}
.page {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 20px 40px;
}
.page-bar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 12px;
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 34px;
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  box-shadow: var(--shadow);

}
@media (hover: hover) and (pointer: fine) {
.icon-btn:hover { transform: translateY(-1px); }
}
.icon-btn:focus-visible { outline: 2px solid var(--atg-focus); outline-offset: 2px; }
.icon-btn svg { width: 16px; height: 16px; flex: none; }
.sr-only {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
/* ============ component card ============ */
.atg {
  background: var(--subtle);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius-lg) + 4px);
  padding: 4px;
  font-size: 13px;
}
.atg-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-height: 20px;
  padding: 9px 12px 11px;
}
.atg-title {
  flex: 1 1 0;
  min-width: min(140px, 100%);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink-strong);
}
.atg-sum {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-left: auto;
  font-size: 13px;
  line-height: 18px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.atg-sum b { font-weight: 600; color: var(--ink); }
.atg-wait {
  min-height: 22px;
  padding: 0 9px;
  border-radius: 999px;

  color: var(--atg-amber-text);
  font-size: 12px;
  font-weight: 600;
  line-height: 22px;
}
.atg-time { min-width: 34px; font-weight: 600; color: var(--ink); text-align: right; }
.atg-ctl {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  transition: color 150ms ease, transform 150ms ease;
}
@media (hover: hover) and (pointer: fine) {
.atg-ctl:hover { color: var(--ink); transform: translateY(-1px); }
}
.atg-ctl:focus-visible { outline: 2px solid var(--atg-focus); outline-offset: 2px; }
.atg-grid {
  padding: 16px 18px 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr);
  grid-template-rows: auto 26px;
}
/* ============ names column ============ */
.atg-names {
  margin: 0;
  padding: 0 16px 0 0 !important;
  list-style: none;
  display: grid;
}
.atg-who {
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  grid-template-rows: 18px 17px;
  column-gap: 8px;
  align-content: start;
  min-width: 0;
  height: 64px;
  padding-top: 15px;
}
/* deterministic 3x3 pixel-mark per agent id — exactly 9 cells */
.atg-mark {
  display: grid;
  grid-template-columns: repeat(3, 3px);
  grid-auto-rows: 3px;
  gap: 1.5px;
  place-content: center;
  width: 16px;
  height: 16px;
  align-self: center;
}
.atg-mark i {
  display: block;
  width: 3px;
  height: 3px;
  border-radius: 0.75px;
  background: var(--mark-c, var(--atg-blue));
  opacity: 0;
}
.atg-mark i.on { opacity: 1; }
.atg-mark.busy i.on { animation: atg-pixel 1.2s ease-in-out infinite both; }
.atg-name {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 18px;
  color: var(--ink);
}
.atg-status {
  grid-column: 2;
  justify-self: start;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  height: 17px;
  margin-top: 1px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--pill-bg, var(--atg-idle-bg));
  font-size: 11px;
  font-weight: 600;
  line-height: 17px;
  color: var(--pill-fg, var(--muted));
}
.atg-status:empty { display: none; }

.atg-plot {
  position: relative;
  isolation: isolate;
  min-width: 0;
  min-height: 64px;
}
.atg-gridline {
  position: absolute;
  top: 0;
  bottom: -4px;
  width: 1px;
  margin-left: -0.5px;
  background: var(--atg-grid);
  pointer-events: none;
}
.atg-base {
  position: absolute;
  left: 0;
  height: 1.5px;
  margin-top: -0.75px;
  background: var(--atg-track);
  pointer-events: none;
}
.atg-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  margin: 0;
  font-size: 12px;
  color: var(--muted);
}
.atg-svg {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
  overflow: visible;
  pointer-events: none;
}
.atg-seg { transition: opacity 200ms ease; }
.atg-seg.dim { opacity: 0.75; }
.atg-line {
  fill: none;
  stroke: var(--seg-c);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.atg-seg[data-state="waiting"] .atg-line { stroke-dasharray: 3 3; }
.atg-area { fill: var(--seg-c); opacity: 0.10; }
.atg-dot { fill: var(--seg-c); stroke: var(--surface); stroke-width: 1.5; }
.atg-pulse {
  fill: var(--seg-c);
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: atg-pulse 1.8s var(--atg-ease) infinite;
}
.atg-steps { position: absolute; inset: 0; z-index: 2; margin: 0; padding: 0; list-style: none; }
.atg-step {
  position: absolute;
  border-radius: 4px 4px 0 0;
  outline: none;
  cursor: default;
}
.atg-step:focus-visible { outline: 2px solid var(--atg-focus); outline-offset: 2px; }
.atg-step-label {
  position: absolute;
  top: 6px;
  right: 6px;
  left: 7px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 11.5px;
  font-weight: 600;
  line-height: 15px;
  color: var(--seg-c);
  pointer-events: none;
  transition: opacity 200ms ease;
}
.atg-step[data-state="thinking"] .atg-step-label { font-weight: 500; color: var(--muted); }
.atg-step-label.dim { opacity: 0.75; }
.atg-hand {
  position: absolute;
  z-index: 1;
  border-radius: 4px;
  outline: none;
  cursor: default;
  transition: opacity 200ms ease;
}
.atg-hand:focus-visible { outline: 2px solid var(--atg-focus); outline-offset: 2px; }
.atg-hand.dim { opacity: 0.75; }
.atg-hand-svg { position: absolute; inset: 0; overflow: visible; }
.atg-hand-wire {
  fill: none;
  stroke: var(--hand-c);
  opacity: 0.7;
  stroke-width: 1.5;
  stroke-dasharray: 4 3;
  stroke-linecap: butt;
}
.atg-hand-dot { fill: var(--hand-c); stroke: var(--surface); stroke-width: 1.5; }
.atg-now {
  position: absolute;
  top: 0;
  bottom: -6px;
  z-index: 3;
  width: 1.5px;
  margin-left: -0.75px;
  background: var(--atg-blue);
  pointer-events: none;
}
.atg-axis { position: relative; height: 26px; grid-column: 2; }
.atg-tick {
  position: absolute;
  top: 6px;
  font-size: 11.5px;
  line-height: 16px;
  color: var(--atg-faint);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  translate: -50% 0;
}
.atg-tick.edge-start { translate: 0 0; }
.atg-tick.edge-end { translate: -100% 0; }
.atg-tick.gone { opacity: 0; }
.atg-now-pill {
  position: absolute;
  top: 5px;
  z-index: 2;
  height: 20px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--atg-blue-solid);
  color: var(--on-blue);
  font-size: 11.5px;
  font-weight: 600;
  line-height: 20px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  translate: -50% 0;
}
/* ============ tooltip ============ */
.atg-tip {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 5;
  display: grid;
  gap: 3px;
  width: max-content;
  min-width: 170px;
  max-width: min(270px, 100%);
  padding: 10px 14px 11px;
  border: 1px solid var(--border);
  border-radius: calc(var(--radius-lg) - 2px);
  background: var(--surface);
  box-shadow: var(--shadow-pop);
  pointer-events: none;
  animation: atg-tip 160ms var(--atg-ease) both;
}
.atg-tip[hidden] { display: none; }
.atg-tip-head {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 19px;
  color: var(--ink);
}
.atg-tip-head bdi { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.atg-tip-to { flex: none; font-weight: 400; color: var(--muted); }
.atg-tip-state {
  flex: none;
  margin-left: auto;
  height: 20px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--atg-idle-bg);
  font-size: 12px;
  font-weight: 600;
  line-height: 20px;
  color: var(--tip-c, var(--muted));
}
.atg-tip-state[data-state="waiting"] { background: var(--atg-amber-bg); color: var(--atg-amber-text); }
.atg-tip-label { font-size: 13px; line-height: 18px; color: var(--muted); overflow-wrap: anywhere; }
.atg-tip-meta { font-size: 12.5px; line-height: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* ============ responsive: narrow = stacked/list ============ */
@media (max-width: 560px) {
  .atg-grid { grid-template-columns: 32px minmax(0, 1fr); padding: 12px 12px 6px 10px; }
  .atg-names { padding-right: 12px !important; }
  .atg-who { grid-template-columns: 16px; }
  .atg-name, .atg-status { display: none; }
  .atg-sum { flex-basis: 100%; margin-left: 0; }
  .atg-time { margin-left: auto; }
}
@keyframes atg-pixel { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
@keyframes atg-pulse { 0% { opacity: 0.45; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
@keyframes atg-tip { from { opacity: 0; transform: translateY(3px) scale(0.97); } }
@media (prefers-reduced-motion: reduce) {
  .atg *, .atg *::before, .atg *::after { animation: none !important; transition: none !important; }
  .atg-pulse { display: none; }
}
.hint { margin: 12px 4px 0; font-size: 12.5px; color: var(--muted); }
.hint kbd {
  display: inline-block;
  padding: 0 5px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--surface);
  font-family: inherit;
  font-size: 11.5px;
  color: var(--ink);
}
</style>

      var dimAttr = (activeKey() && activeKey() !== k2) ? " dim" : "";
      var lbl = (sg.label || (sg.state === "waiting" ? "Waiting on you" : "")) ;
      html += '<li class="atg-step" data-key="' + esc(k2) + '" data-state="' + sg.state + '"' +
        ' tabindex="' + (isTabStop(k2) ? "0" : "-1") + '"' +
        ' role="button" aria-label="' + esc(segAria(sg, D, span)) + '"' +
        ' style="--seg-c:' + esc(col2) + ";left:" + fnum(lp.x0) + "px;width:" + fnum(wpx) +
        "px;top:" + fnum(g.yEff - 3) + "px;height:" + fnum(g.base - g.yEff + 3) + 'px">' +
        ((lbl && wpx > 40) ? '<span class="atg-step-label' + dimAttr + '" aria-hidden="true">' + esc(lbl) + "</span>" : "") +
        "</li>";
    });
    /* handoff wires */
    model.hands.forEach(function (hh, idx) {
      var r1 = model.rowOf[hh.from], r2 = model.rowOf[hh.to];
      var y1 = r1 * ROW_H + BASE_Y, y2 = r2 * ROW_H + BASE_Y;
      var top = Math.min(y1, y2), hhH = Math.abs(y2 - y1);
      var down = r2 > r1;
      var yA = down ? 4 : 4 + hhH, yB = down ? 4 + hhH : 4;
      var prog = (D === null) ? 1 : Math.min(1, Math.max(0, (D - hh.at) / HAND_T));
      var k3 = "h:" + hh.id;
      var dot = prog >= 1 ? '<circle class="atg-hand-dot" cx="5" cy="' + fnum(yB) + '" r="2.5"/>' : "";
      html += '<li class="atg-hand' + ((activeKey() && activeKey() !== k3) ? " dim" : "") + '" data-key="' + esc(k3) + '"' +
        ' tabindex="' + (isTabStop(k3) ? "0" : "-1") + '"' +
        ' role="button" aria-label="' + esc(handAria(hh)) + '"' +
        ' style="--hand-c:' + esc(colorOf(hh.from)) + ";left:" + fnum(X(hh.at, span) - 5) +
        "px;top:" + fnum(top - 4) + "px;width:10px;height:" + fnum(hhH + 8) + 'px">' +
        '<svg class="atg-hand-svg" width="10" height="' + fnum(hhH + 8) + '" aria-hidden="true">' +
        '<path class="atg-hand-wire" d="M 5 ' + fnum(yA) + " L 5 " + fnum(yB) + '"' +
        ' style="stroke-dasharray:' + fnum(prog) + ' 1" pathLength="1"/>' + dot + "</svg></li>";
    });
    html += "</ul>";
    if (D !== null) {
      html += '<span class="atg-now" style="left:' + fnum(X(D, span)) + 'px" aria-hidden="true"></span>';
    }
    if (PARTICIPANTS.length === 0) html += '<p class="atg-empty">No participants yet</p>';
    else if (model.vis.length === 0 && model.hands.length === 0) html += '<p class="atg-empty">Nothing happened yet</p>';
    layersEl.innerHTML = html;

    bindSteps();
    renderTip(model);
  }

  /* roving tabindex: first item is the tab stop unless focus is elsewhere */
  var focusKey = null;
  function orderedKeys(model) {
    var items = [];
    model.vis.forEach(function (sg) { items.push({ key: "s:" + sg.id, row: model.rowOf[sg.who], at: sg.start }); });
    model.hands.forEach(function (hh) {
      items.push({ key: "h:" + hh.id,
        row: Math.min(model.rowOf[hh.from], model.rowOf[hh.to]), at: hh.at });
    });
    return items;
  }
  var lastModel = null;
  function isTabStop(k2) {
    if (focusKey) return focusKey === k2;
    if (!lastModel) return false;
    var all = orderedKeys(lastModel);
    return all.length ? all[0].key === k2 : false;
  }
  function bindSteps() {
    var els = layersEl.querySelectorAll("[data-key]");
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        if (el.__atgBound) return;
        el.__atgBound = true;
        el.addEventListener("mouseenter", function () { hoverKey = el.getAttribute("data-key"); refresh(); });
        el.addEventListener("mouseleave", function () {
          if (hoverKey === el.getAttribute("data-key")) hoverKey = null;
          refresh();
        });
        el.addEventListener("focus", function () {
          focusKey = el.getAttribute("data-key");
          try {
            if (el.matches && el.matches(":focus-visible")) pinnedKey = focusKey;
          } catch (e) { pinnedKey = focusKey; }
          refresh();
        });
        el.addEventListener("blur", function () { pinnedKey = null; refresh(); });
        el.addEventListener("click", function () {
          var k2 = el.getAttribute("data-key");
          pinnedKey = (pinnedKey === k2) ? null : k2;
          if (pinnedKey) focusKey = k2;
          refresh();
        });
        el.addEventListener("keydown", onKey);
      })(els[i]);
    }
  }
  function onKey(e) {
    var cur = e.currentTarget ? e.currentTarget.getAttribute("data-key") : null;
    if (!cur || !lastModel) return;
    var items = orderedKeys(lastModel);
    var byRow = {};
    items.forEach(function (it) { (byRow[it.row] = byRow[it.row] || []).push(it); });
    Object.keys(byRow).forEach(function (r) {
      byRow[r].sort(function (a, b) { return a.at - b.at; });
    });
    function curItem() {
      for (var i = 0; i < items.length; i++) if (items[i].key === cur) return items[i];
      return null;
    }
    var me = curItem(), next = null, k2;
    if (!me) return;
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      var row = byRow[me.row] || [], idx = row.indexOf(me);
      next = row[idx + (e.key === "ArrowRight" ? 1 : -1)] || null;
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      var rows = Object.keys(byRow).map(Number).sort(function (a, b) { return a - b; });
      var ri = rows.indexOf(me.row) + (e.key === "ArrowDown" ? 1 : -1);
      if (rows[ri] !== undefined) {
        var cand = byRow[rows[ri]];
        next = cand.slice().sort(function (a, b) {
          return Math.abs(a.at - me.at) - Math.abs(b.at - me.at);
        })[0] || null;
      }
    } else if (e.key === "Home" || e.key === "End") {
      var r2 = (byRow[me.row] || []);
      next = e.key === "Home" ? r2[0] : r2[r2.length - 1];
    } else if (e.key === "Escape") {
      if (pinnedKey) { pinnedKey = null; refresh(); }
      else if (e.currentTarget && e.currentTarget.blur) e.currentTarget.blur();
      e.preventDefault();
      return;
    } else return;
    e.preventDefault();
    if (next) {
      pinnedKey = next.key; focusKey = next.key;
      var sel = layersEl.querySelector('[data-key="' + next.key + '"]');
      if (sel && sel.focus) { try { sel.focus(); } catch (err) {} }
      refresh();
    }
  }

  /* ----- tooltip ----- */
  function renderTip(model) {
    var k2 = activeKey();
    if (!k2) { tipEl.hidden = true; tipAnchor = null; return; }
    var D = model.D, span = model.span, html = "", cx = 0, cy = 0, col = "";
    if (k2.charAt(0) === "s") {
      var sg = null, i;
      for (i = 0; i < model.vis.length; i++) if ("s:" + model.vis[i].id === k2) sg = model.vis[i];
      if (!sg) { tipEl.hidden = true; return; }
      var g = model.geo[sg.id];
      var lp = linePath(g, function (tt) { return X(tt, span); });
      col = sg.state === "waiting" ? "var(--atg-amber)" : colorOf(sg.who);
      cx = (lp.x0 + lp.x1) / 2; cy = g.yEff;
      var info = stateLabel(sg, D, span);
      html = '<span class="atg-tip-head" style="--mark-c:' + esc(colorOf(sg.who)) + '">' +
        markHTML(sg.who, sg.who === "you", false) +
        "<bdi>" + esc(participantName(sg.who)) + "</bdi>" +
        '<span class="atg-tip-state" data-state="' + sg.state + '"' +
        ' style="--tip-c:' + esc(col) + '">' + esc(STATE_NAMES[sg.state]) + "</span></span>" +
        (sg.label ? '<span class="atg-tip-label" dir="auto">' + esc(sg.label) + "</span>" : "") +
        '<span class="atg-tip-meta">' + esc(info.range) + " · " + esc(info.dur) + "</span>";
    } else {
      var hh = null, j;
      for (j = 0; j < model.hands.length; j++) if ("h:" + model.hands[j].id === k2) hh = model.hands[j];
      if (!hh) { tipEl.hidden = true; return; }
      col = colorOf(hh.from);
      cx = X(hh.at, span);
      var rA = model.rowOf[hh.from], rB = model.rowOf[hh.to];
      cy = Math.min(rA, rB) * ROW_H + 20;
      html = '<span class="atg-tip-head"><bdi>' + esc(participantName(hh.from)) + "</bdi>" +
        '<span class="atg-tip-to" aria-hidden="true">→</span><bdi>' +
        esc(participantName(hh.to)) + "</bdi></span>" +
        (hh.label ? '<span class="atg-tip-label" dir="auto">' + esc(hh.label) + "</span>" : "") +
        '<span class="atg-tip-meta">Handed over at ' + esc(fmtClock(hh.at)) + "</span>";
    }
    if (tipAnchor !== k2) { tipEl.innerHTML = html; tipAnchor = k2; }
    else if (tipEl.innerHTML !== html) tipEl.innerHTML = html;
    tipEl.hidden = false;
    tipEl.style.setProperty("--tip-c", col);
    /* position: above the anchor when room, else below; clamped to the plot */
    var tw = tipEl.offsetWidth || 220, th = tipEl.offsetHeight || 90;
    var left = cx - tw / 2, top = cy - 4 - th - 8;
    if (top < -plotEl.offsetTop - 4 && cy + 12 + th < H_PLOT(model) + 30) top = cy + 12;
    if (left < 0) left = 0;
    if (left + tw > W) left = Math.max(0, W - tw);
    tipEl.style.left = fnum(left) + "px";
    tipEl.style.top = fnum(top) + "px";
  }
  function H_PLOT(model) { return PARTICIPANTS.length * ROW_H; }

  /* ----- main loop ----- */
  function currentNow() { return (simT >= DURATION) ? null : simT; }
  function refresh() {
    lastModel = buildModel(currentNow());
    render(lastModel);
  }
  function frame(ts) {
    if (lastTs < 0) lastTs = ts;
    var dt = Math.min(0.25, Math.max(0, (ts - lastTs) / 1000));
    lastTs = ts;
    if (!userPause && !focusPause && !reduced) {
      simT += dt * SPEED;
      if (simT >= LOOP_AT) { simT = 0; pinnedKey = null; hoverKey = null; focusKey = null; }
    }
    refresh();
    if (typeof window.requestAnimationFrame === "function") {
      window.requestAnimationFrame(frame);
    }
  }

  /* ----- controls ----- */
  pauseBtn.addEventListener("click", function () {
    userPause = !userPause;
    pauseBtn.setAttribute("aria-pressed", userPause ? "true" : "false");
    pauseBtn.setAttribute("aria-label", userPause ? "Resume the run" : "Pause the run");
    pauseBtn.textContent = userPause ? "▶" : "❚❚";
  });
  replayBtn.addEventListener("click", function () {
    simT = 0; pinnedKey = null; hoverKey = null;
    refresh();
  });
  rootEl.addEventListener("focusin", function (e) {
    try {
      if (e.target instanceof HTMLElement && e.target.matches(":focus-visible")) focusPause = true;
    } catch (err) { focusPause = true; }
  });
  rootEl.addEventListener("focusout", function (e) {
    if (!rootEl.contains(e.relatedTarget)) focusPause = false;
  });
  document.addEventListener("visibilitychange", function () { lastTs = -1; });

  /* ----- theme toggle ----- */
  function syncThemeBtn() {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
    document.getElementById("themeLabel").textContent = dark ? "Light" : "Dark";
    document.getElementById("themeIconMoon").hidden = dark;
    document.getElementById("themeIconSun").hidden = !dark;
  }
  themeBtn.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("atg-theme", next); } catch (e) {}
    syncThemeBtn();
  });
  syncThemeBtn();

  /* test hooks (also used by the DOM-stub harness) */
  window.__atg = {
    seek: function (sec) { simT = sec; lastTs = -1; refresh(); },
    now: function () { return currentNow(); },
    model: function () { return lastModel; },
    setWidth: function (w) { W = w; lastStruct = ""; refresh(); },
    hover: function (k2) { hoverKey = k2; refresh(); },
    pin: function (k2) { pinnedKey = k2; focusKey = k2; refresh(); },
    mark: pixelCells,
    fmtClock: fmtClock,
    fmtDur: fmtDur,
    layersHTML: function () { return layersEl.innerHTML; },
    namesHTML: function () { return namesEl.innerHTML; },
    timeText: function () { return timeEl.textContent; },
    tipHTML: function () { return tipEl.hidden ? "" : tipEl.innerHTML; }
  };

  if (!reduced && typeof window.requestAnimationFrame === "function") {
    window.requestAnimationFrame(frame);
  } else {
    refresh();
  }
})();
</script>
</body>
</html>
