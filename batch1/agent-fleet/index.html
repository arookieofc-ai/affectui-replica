<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Fleet — affectUI replica</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e8eaef;
  --blue:#2563eb; --blue-bg:#eff6ff; --green:#16a34a; --green-bg:#dcfce7;
  --amber:#b45309; --amber-bg:#fef3c7; --amber-dot:#f59e0b;
  --slate:#64748b; --slate-bg:#f1f5f9; --purple:#7c3aed; --radius:16px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.45}
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.brand b{display:block;font-size:15px}.brand span{color:var(--muted);font-size:12px}
.live{margin-left:6px;font-size:11px;font-weight:700;color:#047857;background:#d1fae5;
  border:1px solid #a7f3d0;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.spacer{flex:1}
.search{border:1px solid var(--line);background:#f9fafb;border-radius:10px;padding:8px 12px;min-width:200px;font-size:13px;outline:none}
.search:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-bg)}
.filters{display:flex;gap:6px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:#374151}
.filters button[aria-pressed="true"]{background:#111827;color:#fff;border-color:#111827}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.board{display:flex;gap:18px;align-items:flex-start}
.cards{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-width:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;cursor:pointer;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;width:100%;font:inherit;color:inherit}
.card:hover{transform:translateY(-2px);border-color:#c7d2fe}
.card:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px}
.card[aria-expanded="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg),var(--shadow)}
.card.dim{opacity:.38;filter:saturate(.6)}
.card-top{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#fff;font-size:15px;flex:none}
.a1{background:linear-gradient(135deg,#0ea5e9,#2563eb)}.a2{background:linear-gradient(135deg,#10b981,#059669)}.a3{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
.card-top b{font-size:14px;display:block}.card-top small{color:var(--muted)}
.pill{margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.working{color:#15803d;background:var(--green-bg);border-color:#bbf7d0}
.pill.waiting{color:var(--amber);background:var(--amber-bg);border-color:#fde68a}
.pill.idle{color:#475569;background:var(--slate-bg);border-color:#e2e8f0}
.pill.mixed{color:#1d4ed8;background:var(--blue-bg);border-color:#bfdbfe}
.counts{display:flex;gap:8px;margin:12px 0 10px;flex-wrap:wrap}
.count{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px}
.count b{font-size:13px}
.bar{height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden;display:flex;margin:4px 0 10px}
.bar span{display:block;height:100%}
.bar .w{background:#22c55e}.bar .p{background:var(--amber-dot)}.bar .i{background:#cbd5e1}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:baseline}
.cost-row{display:flex;align-items:baseline;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.cost-row b{font-size:16px}.cost-row small{color:var(--muted)}
.view{margin-top:10px;width:100%;border:1px solid var(--line);background:#f9fafb;border-radius:10px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;color:#1f2937}
.card[aria-expanded="true"] .view{background:#111827;color:#fff;border-color:#111827}
/* tree panel */
.panel{width:390px;flex:none;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.panel-head h2{margin:0;font-size:15px}.panel-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1}
.x:hover{background:#f3f4f6}
.panel-empty{padding:34px 22px;text-align:center;color:var(--muted)}
.panel-empty .big{font-size:30px;margin-bottom:8px}
.panel-body{padding:12px 14px;overflow:auto}
.panel-actions{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fafafa}
.panel-actions button{flex:1;border-radius:10px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff}
.panel-actions .primary{background:#111827;color:#fff;border-color:#111827}
.root{display:flex;gap:10px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.root b{font-size:13px}.root small{color:var(--muted);display:block}
.tree{list-style:none;margin:0;padding:0 0 0 14px;position:relative}
.tree::before{content:"";position:absolute;left:5px;top:6px;bottom:12px;width:2px;background:#e5e7eb;border-radius:2px}
.node{position:relative;margin:8px 0}
.node::before{content:"";position:absolute;left:-16px;top:22px;width:14px;height:2px;background:#e5e7eb}
.node-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.node-card:hover,.node-card.hl{border-color:#93c5fd;box-shadow:0 0 0 3px var(--blue-bg)}
.node-card:focus-visible{outline:3px solid #bfdbfe}
.node-card.open{border-color:var(--blue)}
.nrow{display:flex;align-items:center;gap:8px}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}
.sdot.working{background:#22c55e;box-shadow:0 0 0 4px #dcfce7}
.sdot.waiting{background:var(--amber-dot);box-shadow:0 0 0 4px #fef3c7;animation:pulse 1.4s infinite}
.sdot.idle{background:#cbd5e1;box-shadow:0 0 0 4px #f1f5f9}
.nrow b{font-size:13px}.nrow .model{margin-left:auto;font-size:11px;color:var(--muted);background:#f3f4f6;border-radius:6px;padding:2px 6px}
.task{font-size:12px;color:#374151;margin:6px 0}
.tools{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.tools code{font-size:11px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;padding:1px 6px;color:#374151}
.nmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.prog{height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:99px;transition:width .6s}
.detail{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px;color:#374151;display:none}
.node-card.open .detail{display:block}
.detail li{margin:3px 0}
.st{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:99px}
.st.working{background:var(--green-bg);color:#15803d}.st.waiting{background:var(--amber-bg);color:var(--amber)}.st.idle{background:var(--slate-bg);color:#475569}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:14px}
kbd{border:1px solid #d1d5db;border-bottom-width:2px;border-radius:6px;padding:0 5px;font-size:11px;background:#fff;font-family:inherit}
@media (max-width:1020px){
  .board{flex-direction:column}.panel{width:100%;position:static;max-height:none}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:700px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">≋</div>
    <div class="brand"><b>Agent Fleet</b><span>affectUI replica · clean-room demo</span></div>
    <span class="live"><i></i><span id="liveLabel">live · ticking</span></span>
    <div class="spacer"></div>
    <div class="filters" role="group" aria-label="Status filter">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="working" aria-pressed="false">Working</button>
      <button data-f="waiting" aria-pressed="false">Waiting</button>
      <button data-f="idle" aria-pressed="false">Idle</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search fleets / agents…" aria-label="Search fleets or agents">
  </div>
</header>

<div class="wrap">
  <section class="stats" aria-label="Fleet totals">
    <div class="stat"><small>Fleets</small><b id="sFleets">3</b><em>side by side</em></div>
    <div class="stat"><small>Sub-agents</small><b id="sSubs">12</b><em id="sBreak">—</em></div>
    <div class="stat"><small>Open tasks</small><b id="sTasks">—</b><em>across all fleets</em></div>
    <div class="stat"><small>Cost today</small><b id="sCost">—</b><em>simulated live</em></div>
  </section>

  <main class="board">
    <section class="cards" id="cards" aria-label="Fleet agents"></section>
    <aside class="panel" id="panel" aria-label="Fleet tree panel" aria-live="polite"></aside>
  </main>

  <p class="foot">Click a card to open its tree on the right — opening another folds the last one back. <kbd>←</kbd><kbd>→</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close.</p>
</div>

<script>
const FLEETS = [
  { id:"support", name:"Support Fleet", short:"SU", cls:"a1", model:"gpt-4o-mini · crew-3",
    desc:"Inbox triage, answers & escalations", cost:4.82,
    subs:[
      {name:"Triage Agent", model:"gpt-4o-mini", status:"working", task:"Classifying 6 new tickets by intent", tools:["zendesk","classify","priority"], cost:1.42, prog:64, steps:["fetch inbox (done)","score intent (running)","route to queue (queued)"]},
      {name:"FAQ Resolver", model:"gpt-4o-mini", status:"working", task:"Drafting replies for 3 billing questions", tools:["kb-search","draft"], cost:1.10, prog:45, steps:["kb lookup (done)","draft reply (running)","cite sources (queued)"]},
      {name:"Escalation Handler", model:"gpt-4o", status:"waiting", task:"Waiting on human approval for refund #4821", tools:["refund-api","approve-gate"], cost:1.85, prog:80, steps:["prepare case (done)","await approval (waiting)","issue refund (queued)"]},
      {name:"CSAT Follower", model:"haiku-3.5", status:"idle", task:"Idle — last sweep rated 4.8/5", tools:["survey","summarize"], cost:0.45, prog:100, steps:["send surveys (done)","tally scores (done)"]}
    ]},
  { id:"sales", name:"Sales Fleet", short:"SA", cls:"a2", model:"gpt-4o · crew-2",
    desc:"Qualify, outreach & follow-up", cost:3.15,
    subs:[
      {name:"Lead Qualifier", model:"gpt-4o-mini", status:"working", task:"Scoring 12 inbound leads", tools:["crm","enrich","score"], cost:0.95, prog:52, steps:["enrich domains (running)","score fit (running)"]},
      {name:"Outreach Writer", model:"gpt-4o", status:"waiting", task:"Waiting for prospect reply · 4 drafts ready", tools:["gmail","sequences"], cost:1.60, prog:70, steps:["draft 4 mails (done)","await reply (waiting)"]},
      {name:"Deal Closer", model:"gpt-4o", status:"idle", task:"Idle — 2 proposals delivered", tools:["crm","proposal"], cost:0.60, prog:100, steps:["build proposal (done)","send (done)"]}
    ]},
  { id:"ops", name:"Ops Fleet", short:"OP", cls:"a3", model:"sonnet-3.5 · crew-4",
    desc:"Schedule, inventory & incidents", cost:6.40,
    subs:[
      {name:"Scheduler", model:"haiku-3.5", status:"working", task:"Re-planning 8 delivery routes", tools:["calendar","ortools"], cost:0.90, prog:38, steps:["load orders (done)","optimize (running)"]},
      {name:"Inventory Watcher", model:"haiku-3.5", status:"working", task:"Reconciling 214 SKUs", tools:["warehouse-api","alerts"], cost:1.10, prog:57, steps:["scan skus (running)","flag low stock (queued)"]},
      {name:"Invoice Reconciler", model:"gpt-4o-mini", status:"waiting", task:"Waiting on vendor CSV for March", tools:["stripe","sheets"], cost:1.30, prog:66, steps:["pull stripe (done)","await csv (waiting)"]},
      {name:"Incident Responder", model:"gpt-4o", status:"working", task:"Mitigating latency spike eu-west", tools:["pagerduty","logs","rollback"], cost:2.40, prog:29, steps:["triage logs (running)","draft rollback (queued)"]},
      {name:"Report Builder", model:"haiku-3.5", status:"idle", task:"Idle — weekly ops digest sent", tools:["bigquery","charts"], cost:0.70, prog:100, steps:["query (done)","render (done)"]}
    ]}
];
let selected = null;      // fleet id whose tree is open on the right
let openNode = null;      // sub-agent name expanded inside tree
let filter = "all", query = "";
let paused = false;

const $cards = document.getElementById("cards");
const $panel = document.getElementById("panel");

function fleetStatus(f){
  const s = f.subs.map(x=>x.status);
  if(s.every(v=>v==="working")) return "working";
  if(s.every(v=>v==="idle")) return "idle";
  if(s.includes("waiting")) return "waiting";
  return "mixed";
}
function counts(f){
  const w=f.subs.filter(x=>x.status==="working").length,
        p=f.subs.filter(x=>x.status==="waiting").length,
        i=f.subs.filter(x=>x.status==="idle").length;
  return {w,p,i,tasks:f.subs.filter(x=>x.status!=="idle").length};
}
function pillFor(st){
  const label = st==="mixed" ? "active mix" : st;
  return `<span class="pill ${st}">${label}</span>`;
}
function matchFilter(f){
  if(query){
    const q=query.toLowerCase();
    const hit = f.name.toLowerCase().includes(q) ||
      f.subs.some(s=>(s.name+" "+s.task+" "+s.tools.join(" ")).toLowerCase().includes(q));
    if(!hit) return "dim";
  }
  if(filter!=="all" && !f.subs.some(s=>s.status===filter)) return "dim";
  return "";
}

function renderCards(){
  $cards.innerHTML = FLEETS.map((f,idx)=>{
    const c=counts(f), st=fleetStatus(f), n=f.subs.length;
    const tot=c.w+c.p+c.i;
    const pw=Math.round(c.w/tot*100), pp=Math.round(c.p/tot*100);
    const isOpen = selected===f.id;
    return `<button class="card ${matchFilter(f)}" data-id="${f.id}" aria-expanded="${isOpen}" data-idx="${idx}"
      aria-label="${f.name}, ${n} sub-agents, status ${st}. Activate to ${isOpen?"close":"open"} tree panel.">
      <div class="card-top"><span class="avatar ${f.cls}">${f.short}</span>
        <span><b>${f.name}</b><small>${f.model}</small></span>${pillFor(st)}</div>
      <div class="counts"><span class="count"><b>${n}</b> sub-agents</span>
        <span class="count"><b>${c.tasks}</b> open tasks</span>
        <span class="count"><b>${c.w}</b> working</span></div>
      <div class="bar" aria-hidden="true"><span class="w" style="width:${pw}%"></span><span class="p" style="width:${pp}%"></span><span class="i" style="flex:1"></span></div>
      <div class="legend"><span><span class="dot" style="background:#22c55e"></span>${c.w} working</span>
        <span><span class="dot" style="background:var(--amber-dot)"></span>${c.p} waiting</span>
        <span><span class="dot" style="background:#cbd5e1"></span>${c.i} idle</span></div>
      <div class="cost-row"><small>cost today · ${f.desc}</small><b>$${f.cost.toFixed(2)}</b></div>
      <span class="view">${isOpen?"▾ Fold back into card":"▸ View tree on the right"}</span>
    </button>`;
  }).join("");
  $cards.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click",()=>toggle(el.dataset.id));
    el.addEventListener("keydown",e=>{
      const cards=[...$cards.querySelectorAll(".card")];
      const i=cards.indexOf(el);
      if(e.key==="ArrowRight"){(cards[i+1]||cards[0]).focus();e.preventDefault();}
      if(e.key==="ArrowLeft"){(cards[i-1]||cards[cards.length-1]).focus();e.preventDefault();}
      if(e.key==="Escape"){selected=null;openNode=null;sync();el.focus();}
    });
  });
}

function renderPanel(){
  if(!selected){
    $panel.innerHTML = `<div class="panel-empty"><div class="big">🌳</div>
      <b>No fleet expanded</b><p>Select any fleet card to open<br>its sub-agent tree here.<br>The previous tree folds back automatically.</p></div>`;
    return;
  }
  const f = FLEETS.find(x=>x.id===selected);
  const c = counts(f);
  const nodes = f.subs.filter(s=>{
    if(!query) return true;
    const q=query.toLowerCase();
    return (s.name+" "+s.task+" "+s.tools.join(" ")).toLowerCase().includes(q);
  });
  $panel.innerHTML = `
    <div class="panel-head"><span class="avatar ${f.cls}">${f.short}</span>
      <span><h2>${f.name} — tree</h2><p>${f.subs.length} sub-agents · ${c.w} working · ${c.p} waiting · $${f.cost.toFixed(2)} today</p></span>
      <button class="x" id="closeP" aria-label="Close tree panel (Esc)">✕</button></div>
    <div class="panel-body">
      <div class="root"><span class="sdot ${c.p?"waiting":"working"}"></span>
        <span><b>${f.name} root</b><small>${f.model} · orchestrator</small></span>
        <span class="model">${f.subs.length} children</span></div>
      <ul class="tree">
      ${nodes.map(s=>`
        <li class="node"><div class="node-card ${openNode===s.name?"open hl":""}" tabindex="0" role="button"
            aria-expanded="${openNode===s.name}" data-node="${s.name}" aria-label="${s.name}, ${s.status}">
          <div class="nrow"><span class="sdot ${s.status}"></span><b>${s.name}</b>
            <span class="st ${s.status}">${s.status}</span><span class="model">${s.model}</span></div>
          <div class="task">${s.task}</div>
          <div class="tools">${s.tools.map(t=>`<code>${t}</code>`).join("")}</div>
          <div class="nmeta"><span>$${s.cost.toFixed(2)} today</span><span>${s.prog}%</span></div>
          <div class="prog"><i style="width:${s.prog}%"></i></div>
          <ul class="detail">${s.steps.map(x=>`<li>${x}</li>`).join("")}</ul>
        </div></li>`).join("") || "<li>No sub-agents match search.</li>"}
      </ul>
    </div>
    <div class="panel-actions">
      <button id="pauseB">${paused?"▶ Resume ticks":"⏸ Pause ticks"}</button>
      <button class="primary" id="foldB">Fold back into card</button>
    </div>`;
  document.getElementById("closeP").onclick = ()=>{selected=null;openNode=null;sync();};
  document.getElementById("foldB").onclick = ()=>{selected=null;openNode=null;sync();};
  document.getElementById("pauseB").onclick = (e)=>{paused=!paused;
    document.getElementById("liveLabel").textContent = paused?"paused":"live · ticking"; sync(); };
  // hover chain highlight: highlight root + hovered node
  const rootEl = $panel.querySelector(".root");
  $panel.querySelectorAll(".node-card").forEach(n=>{
    const on=()=>{rootEl.style.borderColor="#93c5fd";rootEl.style.boxShadow="0 0 0 3px var(--blue-bg)";};
    const off=()=>{rootEl.style.borderColor="";rootEl.style.boxShadow="";};
    n.addEventListener("mouseenter",on); n.addEventListener("mouseleave",off);
    n.addEventListener("focus",on); n.addEventListener("blur",off);
    const flip=()=>{openNode = openNode===n.dataset.node?null:n.dataset.node; renderPanel(); keepFocus(n.dataset.node);};
    n.addEventListener("click",flip);
    n.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){flip();e.preventDefault();}
      if(e.key==="Escape"){selected=null;openNode=null;sync();}
    });
  });
}
function keepFocus(name){
  const el = $panel.querySelector(`[data-node="${CSS.escape(name)}"]`);
  if(el) el.focus({preventScroll:true});
}
function renderStats(){
  const subs = FLEETS.flatMap(f=>f.subs);
  document.getElementById("sSubs").textContent = subs.length;
  document.getElementById("sBreak").textContent =
    `${subs.filter(s=>s.status==="working").length} working · ${subs.filter(s=>s.status==="waiting").length} waiting · ${subs.filter(s=>s.status==="idle").length} idle`;
  document.getElementById("sTasks").textContent = subs.filter(s=>s.status!=="idle").length;
  document.getElementById("sCost").textContent = "$"+FLEETS.reduce((a,f)=>a+f.cost,0).toFixed(2);
}
function sync(){renderCards();renderPanel();renderStats();}
function toggle(id){
  // one open at a time: opening another folds the last one back
  if(selected===id){selected=null;openNode=null;}
  else{selected=id;openNode=null;}
  sync();
  const el=$cards.querySelector(`[data-id="${id}"]`);
  if(el&&selected) document.getElementById("panel").querySelector(".x")?.focus({preventScroll:true});
}
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); filter=b.dataset.f; renderCards();
});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();renderCards();renderPanel();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&selected){selected=null;openNode=null;sync();}
});
// live simulation: progress + occasional status flips + cost creep
setInterval(()=>{
  if(paused||document.hidden) return;
  const f = FLEETS[Math.floor(Math.random()*FLEETS.length)];
  const s = f.subs[Math.floor(Math.random()*f.subs.length)];
  if(s.status!=="idle") s.prog=Math.min(100,s.prog+Math.ceil(Math.random()*9));
  if(s.prog>=100){
    s.status="idle"; s.prog=100; s.task="Idle — batch complete, awaiting work";
  } else if(Math.random()<0.12){
    s.status = s.status==="working"?"waiting":s.status==="waiting"?"working":"working";
    if(s.status==="waiting") s.task="Waiting on external input · "+s.tools[0];
    if(s.status==="working") s.task=s.task.replace(/^Waiting on external input · /,"").replace(/^Idle — /,"Resumed — ");
  }
  const delta = s.status==="working"?0.01+Math.random()*0.04:0.002;
  s.cost+=delta; f.cost+=delta;
  sync();
},2600);
sync();
</script>
