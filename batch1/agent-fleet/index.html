<style>

  --subtle:#f5f5f4;

  --accent-bg:#eff6ff;
  --accent-border:#bfdbfe;
  --focus:#2563eb;
  --working:#15803d;
  --working-bg:#dcfce7;
  --working-border:#bbf7d0;
  --working-dot:#16a34a;
  --waiting:#92400e;
  --waiting-bg:#fef3c7;
  --waiting-border:#fde68a;
  --waiting-dot:#f59e0b;
  --idle:#57534e;
  --idle-bg:#f5f5f4;
  --idle-border:#e7e5e4;

}
[data-theme="dark"]{
  color-scheme: dark;
  --surface:#1c1c1f;
  --page:#101012;
  --ink:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 28px rgba(0,0,0,.5);
  --accent:#60a5fa;
  --accent-bg:#1e2a45;
  --accent-border:#334155;
  --focus:#93c5fd;
  --working:#4ade80;
  --working-bg:#052e16;
  --working-border:#14532d;
  --working-dot:#22c55e;
  --waiting:#fde68a;
  --waiting-bg:#451a03;
  --waiting-border:#92400e;
  --waiting-dot:#fbbf24;
  --idle:#d4d4d8;
  --idle-bg:#27272a;
  --idle-border:#3f3f46;

  --mixed:#93c5fd;

  --av2a:#10b981; --av2b:#059669;

  --prog-a:#60a5fa; --prog-b:#93c5fd;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;transition:background-color .18s ease,color .18s ease}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:var(--radius);background:var(--accent);color:var(--surface);
  display:flex;align-items:center;justify-content:center;font-weight:800}
.brand b{display:block;font-size:15px}.brand span{color:var(--muted);font-size:12px}
.live{margin-left:6px;font-size:11px;font-weight:700;color:var(--live-text);background:var(--live-bg);
  border:1px solid var(--live-border);padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--live-dot);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.spacer{flex:1}
.search{border:1px solid var(--border);background:var(--subtle);color:var(--ink);border-radius:var(--radius);padding:8px 12px;min-width:200px;font-size:13px;outline:none;transition:border-color .15s ease,box-shadow .15s ease,background-color .15s ease}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-bg)}
.filters{display:flex;gap:6px}
.filters button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink);transition:background-color .15s ease,border-color .15s ease,transform .15s ease}
.filters button:hover{border-color:var(--accent);transform:translateY(-1px)}
.filters button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.theme-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:border-color .15s ease,transform .15s ease,background-color .15s ease}
.theme-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.board{display:flex;gap:14px;align-items:flex-start}
.cards{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);padding:14px 10px 12px;cursor:pointer;position:relative;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;text-align:left;width:100%;font:inherit;color:inherit}
.card:hover{transform:translateY(-2px);border-color:var(--accent-border)}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg),var(--shadow);padding-bottom:14px}
.card.dim{opacity:.45;filter:saturate(.6)}
.card-top{display:flex;align-items:center;gap:6px;min-width:0}
.avatar{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--surface);font-size:12px;flex:none}
.a1{background:linear-gradient(135deg,var(--av1a),var(--av1b))}
.a2{background:linear-gradient(135deg,var(--av2a),var(--av2b))}
.a3{background:linear-gradient(135deg,var(--av3a),var(--av3b))}
.card-title{min-width:0;flex:1 1 auto;overflow:visible}
.card-top b{font-size:13px;display:block;font-weight:600;white-space:nowrap;overflow:visible;line-height:1.3}
.card-top small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:visible;word-break:keep-all;line-height:1.3}
.pill{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap;flex:none}
.pill.working{color:var(--working);background:var(--working-bg);border-color:var(--working-border)}
.pill.waiting{color:var(--waiting);background:var(--waiting-bg);border-color:var(--waiting-border)}
.pill.idle{color:var(--idle);background:var(--idle-bg);border-color:var(--idle-border)}
.pill.mixed{color:var(--mixed);background:var(--mixed-bg);border-color:var(--mixed-border)}
.counts{display:flex;gap:8px;margin:12px 0 10px;flex-wrap:wrap}
.count{background:var(--subtle);border:1px solid var(--border);color:var(--ink);border-radius:var(--radius);padding:6px 10px;font-size:12px}
.count b{font-size:13px}
.bar{height:8px;background:var(--track);border-radius:999px;overflow:hidden;display:flex;margin:4px 0 10px}
.bar span{display:block;height:100%}
.bar .w{background:var(--working-dot)}.bar .p{background:var(--waiting-dot)}.bar .i{background:var(--idle-dot)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:baseline}
.dot.dw{background:var(--working-dot)}.dot.dp{background:var(--waiting-dot)}.dot.di{background:var(--idle-dot)}
.cost-row{display:block;border-top:1px dashed var(--border);padding-top:10px;margin-top:4px}
.cost-desc{display:block;color:var(--muted);font-size:12px;line-height:1.4;overflow-wrap:break-word}
.cost-amount{display:block;text-align:right;font-size:16px;margin-top:2px;line-height:1.3}
.view{display:block;margin-top:12px;width:100%;box-sizing:border-box;text-align:center;border:1px solid var(--border);background:var(--subtle);border-radius:var(--radius);padding:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);transition:background-color .15s ease,border-color .15s ease}
.view:hover{border-color:var(--accent)}
.card[aria-expanded="true"] .view{background:var(--ink);color:var(--page);border-color:var(--ink)}
.panel{width:300px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.panel-head h2{margin:0;font-size:15px;font-weight:600}.panel-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.x{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1;transition:background-color .15s ease,border-color .15s ease}
.x:hover{background:var(--subtle);border-color:var(--accent)}
.x:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.panel-empty{padding:34px 22px;text-align:center;color:var(--muted)}
.panel-empty .big{font-size:30px;margin-bottom:8px}
.panel-body{padding:12px 14px;overflow:auto}
.panel-actions{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--subtle)}
.panel-actions button{flex:1;border-radius:var(--radius);padding:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink);transition:border-color .15s ease,transform .15s ease}
.panel-actions button:hover{border-color:var(--accent);transform:translateY(-1px)}
.panel-actions button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.panel-actions .primary{background:var(--ink);color:var(--page);border-color:var(--ink)}
.root{display:flex;gap:10px;align-items:center;background:var(--subtle);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:6px;transition:border-color .15s ease,box-shadow .15s ease}
.root b{font-size:13px}.root small{color:var(--muted);display:block}
.tree{list-style:none;margin:0;padding:0 0 0 14px;position:relative}
.tree::before{content:"";position:absolute;left:5px;top:6px;bottom:12px;width:2px;background:var(--border);border-radius:2px}
.node{position:relative;margin:8px 0}
.node::before{content:"";position:absolute;left:-16px;top:22px;width:14px;height:2px;background:var(--border)}
.node-card{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
.node-card:hover,.node-card.hl{border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-bg)}
.node-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.node-card.open{border-color:var(--accent)}
.nrow{display:flex;align-items:center;gap:8px}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}
.sdot.working{background:var(--working-dot);box-shadow:0 0 0 4px var(--working-bg)}
.sdot.waiting{background:var(--waiting-dot);box-shadow:0 0 0 4px var(--waiting-bg);animation:pulse 1.4s infinite}
.sdot.idle{background:var(--idle-dot);box-shadow:0 0 0 4px var(--idle-bg)}
.nrow b{font-size:13px}.nrow .model{margin-left:auto;font-size:11px;color:var(--muted);background:var(--subtle);border:1px solid var(--border);border-radius:6px;padding:2px 6px}
.task{font-size:12px;color:var(--ink);margin:6px 0}
.task-sub{color:var(--muted)}
.tools{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.tools code{font-size:11px;background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--muted)}
.nmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.prog{height:6px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--prog-a),var(--prog-b));border-radius:999px;transition:width .6s ease}
.detail{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;font-size:12px;color:var(--muted);display:none}
.node-card.open .detail{display:block}
.detail li{margin:3px 0}
.st{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:999px}
.st.working{background:var(--working-bg);color:var(--working)}
.st.waiting{background:var(--waiting-bg);color:var(--waiting)}
.st.idle{background:var(--idle-bg);color:var(--idle)}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:14px}
.foot .hint{white-space:nowrap}
.foot .hint kbd{margin-right:5px}
kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:0 5px;margin:0 1px;font-size:11px;background:var(--surface);color:var(--ink);font-family:inherit}
@media (max-width:1020px){
  .board{flex-direction:column}.panel{width:100%;position:static;max-height:none}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:700px){.cards{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" aria-hidden="true">≋</div>
    <div class="brand"><b>Agent Fleet</b><span>affectUI replica · clean-room demo</span></div>
    <span class="live"><i></i><span id="liveLabel">live · ticking</span></span>
    <div class="spacer"></div>
    <div class="filters" role="group" aria-label="Status filter">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="working" aria-pressed="false">Working</button>
      <button data-f="waiting" aria-pressed="false">Waiting</button>
      <button data-f="idle" aria-pressed="false">Idle</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search fleets / agents…" aria-label="Search fleets or agents">
    <button class="theme-btn" id="themeBtn" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle light / dark">☾</button>
  </div>
</header>

<div class="wrap">
  <section class="stats" aria-label="Fleet totals">
    <div class="stat"><small>Fleets</small><b id="sFleets">3</b><em>side by side</em></div>
    <div class="stat"><small>Sub-agents</small><b id="sSubs">9</b><em id="sBreak">—</em></div>
    <div class="stat"><small>Open tasks</small><b id="sTasks">—</b><em>across all fleets</em></div>
    <div class="stat"><small>Cost today</small><b id="sCost">—</b><em>simulated live</em></div>
  </section>

  <main class="board">
    <section class="cards" id="cards" aria-label="Fleet agents"></section>
    <aside class="panel" id="panel" aria-label="Fleet tree panel" aria-live="polite"></aside>
  </main>

  <p class="foot">Click a card to open its tree on the right — opening another folds the last one back. <span class="hint"><kbd>←</kbd> <kbd>→</kbd> <span>move</span></span> · <span class="hint"><kbd>Enter</kbd> <span>open</span></span> · <span class="hint"><kbd>Esc</kbd> <span>close</span></span>.</p>
</div>

<script>
const FLEETS = [
  { id:"launch", name:"Launch Lead", short:"LA", cls:"a1", model:"sonnet · crew-4",
    desc:"Research → write → code → test", cost:5.10,
    subs:[
      {name:"Researcher", model:"sonnet", status:"working", task:"Surveying launch comps and pricing", tools:["web-search","docs"], cost:1.20, prog:64, steps:["collect comps (done)","score pricing (running)","write brief (queued)"]},
      {name:"Writer", model:"sonnet", status:"working", task:"Drafting launch post and changelog", tools:["draft","style-guide"], cost:1.05, prog:45, steps:["outline (done)","draft post (running)","proofread (queued)"]},
      {name:"Coder", model:"opus", status:"waiting", task:"Waiting on review for checkout patch", tools:["repo","tests"], cost:1.90, prog:80, steps:["implement patch (done)","await review (waiting)","merge (queued)"]},
      {name:"Tester", model:"haiku", status:"idle", task:"Idle — regression suite passed 212/212", tools:["qa","snapshots"], cost:0.95, prog:100, steps:["run suite (done)","file report (done)"]}
    ]},
  { id:"support", name:"Support Lead", short:"SU", cls:"a2", model:"sonnet · crew-4",
    desc:"Triage, billing, bugs & escalation", cost:4.82,
    subs:[
      {name:"Triage", model:"haiku", status:"working", task:"Classifying 6 new tickets by intent", tools:["inbox","classify"], cost:1.42, prog:58, steps:["fetch inbox (done)","score intent (running)","route queue (queued)"]},
      {name:"Billing", model:"sonnet", status:"waiting", task:"Waiting on approval for refund #4821", tools:["refund-api","approve-gate"], cost:1.55, prog:72, steps:["prepare case (done)","await approval (waiting)","issue refund (queued)"]},
      {name:"Bug reports", model:"sonnet", status:"working", task:"Reproducing 3 crash reports on canary", tools:["logs","repro"], cost:1.30, prog:41, steps:["triage logs (running)","write repro (running)","file issue (queued)"]},
      {name:"Escalation", model:"opus", status:"idle", task:"Idle — on-call, no open escalations", tools:["pagerduty","runbook"], cost:0.55, prog:100, steps:["watch queue (done)","handoff notes (done)"]}
    ]},
  { id:"release", name:"Release Manager", short:"RM", cls:"a3", model:"haiku · crew-1",
    desc:"Cut release + publish notes", cost:1.20,
    subs:[
      {name:"Changelog", model:"haiku", status:"working", task:"Compiling v2.4 notes from 18 commits", tools:["git-log","publish"], cost:1.20, prog:52, steps:["collect commits (done)","draft notes (running)","publish page (queued)"]}
    ]}
];
let selected = null;
let openNode = null;
let filter = "all", query = "";
let paused = false;

const $cards = document.getElementById("cards");
const $panel = document.getElementById("panel");
const $themeBtn = document.getElementById("themeBtn");

function currentTheme(){return document.documentElement.getAttribute("data-theme")||"light";}
function paintThemeBtn(){
  const t=currentTheme();
  const dark=t==="dark";
  $themeBtn.textContent=dark?"☀":"☾";
  $themeBtn.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
  $themeBtn.setAttribute("aria-pressed",dark?"true":"false");
  $themeBtn.title=dark?"Switch to light":"Switch to dark";
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("fleet-theme",t)}catch(e){}
  paintThemeBtn();
}
$themeBtn.addEventListener("click",()=>{setTheme(currentTheme()==="dark"?"light":"dark");});
paintThemeBtn();
try{
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",e=>{
      var stored=null;try{stored=localStorage.getItem("fleet-theme")}catch(err){}
      if(!stored)setTheme(e.matches?"dark":"light");
    });
  }
}catch(e){}

function fleetStatus(f){
  const s = f.subs.map(x=>x.status);
  if(s.every(v=>v==="working")) return "working";
  if(s.every(v=>v==="idle")) return "idle";
  if(s.includes("waiting")) return "waiting";
  return "mixed";
}
function counts(f){
  const w=f.subs.filter(x=>x.status==="working").length,
        p=f.subs.filter(x=>x.status==="waiting").length,
        i=f.subs.filter(x=>x.status==="idle").length;
  return {w,p,i,tasks:f.subs.filter(x=>x.status!=="idle").length};
}
function pillFor(st){
  const label = st==="mixed" ? "active mix" : st;
  return `<span class="pill ${st}">${label}</span>`;
}
function matchFilter(f){
  if(query){
    const q=query.toLowerCase();
    const hit = f.name.toLowerCase().includes(q) ||
      f.subs.some(s=>(s.name+" "+s.task+" "+s.tools.join(" ")).toLowerCase().includes(q));
    if(!hit) return "dim";
  }
  if(filter!=="all" && !f.subs.some(s=>s.status===filter)) return "dim";
  return "";
}

function renderCards(){
  $cards.innerHTML = FLEETS.map((f,idx)=>{
    const c=counts(f), st=fleetStatus(f), n=f.subs.length;
    const tot=c.w+c.p+c.i||1;
    const pw=Math.round(c.w/tot*100), pp=Math.round(c.p/tot*100);
    const isOpen = selected===f.id;
    return `<button class="card ${matchFilter(f)}" data-id="${f.id}" aria-expanded="${isOpen}" data-idx="${idx}"
      aria-label="${f.name}, ${n} sub-agents, status ${st}. Activate to ${isOpen?"close":"open"} tree panel.">
      <div class="card-top"><span class="avatar ${f.cls}">${f.short}</span>
        <span class="card-title"><b>${f.name}</b><small>${f.model}</small></span>${pillFor(st)}</div>
      <div class="counts"><span class="count"><b>${n}</b> sub-agents</span>
        <span class="count"><b>${c.tasks}</b> open tasks</span>
        <span class="count"><b>${c.w}</b> working</span></div>
      <div class="bar" aria-hidden="true"><span class="w" style="width:${pw}%"></span><span class="p" style="width:${pp}%"></span><span class="i" style="flex:1"></span></div>
      <div class="legend"><span><span class="dot dw"></span>${c.w} working</span>
        <span><span class="dot dp"></span>${c.p} waiting</span>
        <span><span class="dot di"></span>${c.i} idle</span></div>
      <div class="cost-row"><small class="cost-desc">${f.desc}</small><b class="cost-amount">$${f.cost.toFixed(2)}</b></div>
      <span class="view">${isOpen?"▾ Fold back into card":"▸ View tree on the right"}</span>
    </button>`;
  }).join("");
  $cards.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click",()=>toggle(el.dataset.id));
    el.addEventListener("keydown",e=>{
      const cards=[...$cards.querySelectorAll(".card")];
      const i=cards.indexOf(el);
      if(e.key==="ArrowRight"){(cards[i+1]||cards[0]).focus();e.preventDefault();}
      if(e.key==="ArrowLeft"){(cards[i-1]||cards[cards.length-1]).focus();e.preventDefault();}
      if(e.key==="Escape"){selected=null;openNode=null;sync();el.focus();}
    });
  });
}

function renderPanel(){
  if(!selected){
    $panel.innerHTML = `<div class="panel-empty"><div class="big">🌳</div>
      <b>No fleet expanded</b><p>Select any fleet card to open<br>its sub-agent tree here.<br>The previous tree folds back automatically.</p></div>`;
    return;
  }
  const f = FLEETS.find(x=>x.id===selected);
  const c = counts(f);
  const nodes = f.subs.filter(s=>{
    if(!query) return true;
    const q=query.toLowerCase();
    return (s.name+" "+s.task+" "+s.tools.join(" ")).toLowerCase().includes(q);
  });
  $panel.innerHTML = `
    <div class="panel-head"><span class="avatar ${f.cls}">${f.short}</span>
      <span><h2>${f.name} — tree</h2><p>${f.subs.length} sub-agents · ${c.w} working · ${c.p} waiting · $${f.cost.toFixed(2)} today</p></span>
      <button class="x" id="closeP" aria-label="Close tree panel (Esc)">✕</button></div>
    <div class="panel-body">
      <div class="root" id="rootRow"><span class="sdot ${c.p?"waiting":"working"}"></span>
        <span><b>${f.name} root</b><small>${f.model} · orchestrator</small></span>
        <span class="model">${f.subs.length} children</span></div>
      <ul class="tree">
      ${nodes.map(s=>`
        <li class="node"><div class="node-card ${openNode===s.name?"open hl":""}" tabindex="0" role="button"
            aria-expanded="${openNode===s.name}" data-node="${s.name}" aria-label="${s.name}, ${s.status}">
          <div class="nrow"><span class="sdot ${s.status}"></span><b>${s.name}</b>
            <span class="st ${s.status}">${s.status}</span><span class="model">${s.model}</span></div>
          <div class="task">${s.task}</div>
          <div class="tools">${s.tools.map(t=>`<code>${t}</code>`).join("")}</div>
          <div class="nmeta"><span>$${s.cost.toFixed(2)} today</span><span>${s.prog}%</span></div>
          <div class="prog"><i style="width:${s.prog}%"></i></div>
          <ul class="detail">${s.steps.map(x=>`<li>${x}</li>`).join("")}</ul>
        </div></li>`).join("") || "<li>No sub-agents match search.</li>"}
      </ul>
    </div>
    <div class="panel-actions">
      <button id="pauseB">${paused?"▶ Resume ticks":"⏸ Pause ticks"}</button>
      <button class="primary" id="foldB">Fold back into card</button>
    </div>`;
  document.getElementById("closeP").onclick = ()=>{selected=null;openNode=null;sync();};
  document.getElementById("foldB").onclick = ()=>{selected=null;openNode=null;sync();};
  document.getElementById("pauseB").onclick = ()=>{paused=!paused;
    document.getElementById("liveLabel").textContent = paused?"paused":"live · ticking"; sync(); };
  const rootEl = $panel.querySelector("#rootRow");
  $panel.querySelectorAll(".node-card").forEach(n=>{
    const on=()=>{rootEl.style.borderColor="var(--accent-border)";rootEl.style.boxShadow="0 0 0 3px var(--accent-bg)";};
    const off=()=>{rootEl.style.borderColor="";rootEl.style.boxShadow="";};
    n.addEventListener("mouseenter",on); n.addEventListener("mouseleave",off);
    n.addEventListener("focus",on); n.addEventListener("blur",off);
    const flip=()=>{openNode = openNode===n.dataset.node?null:n.dataset.node; renderPanel(); keepFocus(n.dataset.node);};
    n.addEventListener("click",flip);
    n.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){flip();e.preventDefault();}
      if(e.key==="Escape"){selected=null;openNode=null;sync();}
    });
  });
}
function keepFocus(name){
  const el = $panel.querySelector(`[data-node="${CSS.escape(name)}"]`);
  if(el) el.focus({preventScroll:true});
}
function renderStats(){
  const subs = FLEETS.flatMap(f=>f.subs);
  document.getElementById("sSubs").textContent = subs.length;
  document.getElementById("sBreak").textContent =
    `${subs.filter(s=>s.status==="working").length} working · ${subs.filter(s=>s.status==="waiting").length} waiting · ${subs.filter(s=>s.status==="idle").length} idle`;
  document.getElementById("sTasks").textContent = subs.filter(s=>s.status!=="idle").length;
  document.getElementById("sCost").textContent = "$"+FLEETS.reduce((a,f)=>a+f.cost,0).toFixed(2);
}
function sync(){renderCards();renderPanel();renderStats();}
function toggle(id){
  if(selected===id){selected=null;openNode=null;}
  else{selected=id;openNode=null;}
  sync();
  if(selected){const x=document.getElementById("panel").querySelector(".x");if(x)x.focus({preventScroll:true});}
}
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); filter=b.dataset.f; renderCards();
});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();renderCards();renderPanel();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&selected){selected=null;openNode=null;sync();}
});
setInterval(()=>{
  if(paused||document.hidden) return;
  const f = FLEETS[Math.floor(Math.random()*FLEETS.length)];
  const s = f.subs[Math.floor(Math.random()*f.subs.length)];
  if(s.status!=="idle") s.prog=Math.min(100,s.prog+Math.ceil(Math.random()*9));
  if(s.prog>=100){
    s.status="idle"; s.prog=100; s.task="Idle — batch complete, awaiting work";
  } else if(Math.random()<0.12){
    s.status = s.status==="working"?"waiting":s.status==="waiting"?"working":"working";
    if(s.status==="waiting") s.task="Waiting on external input · "+s.tools[0];
    if(s.status==="working") s.task=s.task.replace(/^Waiting on external input · /,"").replace(/^Idle — /,"Resumed — ");
  }
  const delta = s.status==="working"?0.01+Math.random()*0.04:0.002;
  s.cost+=delta; f.cost+=delta;
  sync();
},2600);
sync();
</script>
</body>
</html>
