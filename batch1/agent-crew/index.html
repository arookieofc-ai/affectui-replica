<style>
:root,
html[data-theme="dark"]{

html[data-theme="light"]{

  --idle-bg:#e7e5e4;
  --idle-dot:#a8a29e;
  --accent:#2563eb;
  --tool-bg:#f5f5f4;
  --tool-border:#e7e5e4;
  --tool-ink:#44403c;
  --branch-1:#8b5cf6;
  --branch-2:#0284c7;
  --branch-3:#16a34a;

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:18px 20px 48px}
/* header */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 4px 16px}
.folder{width:30px;height:30px;border-radius:8px;background:var(--subtle);border:1px solid var(--border);display:grid;place-items:center;flex:none}
.title{font-size:15px;font-weight:650;color:var(--ink-strong);display:flex;align-items:center;gap:6px}
.title .chev{color:var(--muted);font-size:12px}
.counts{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.counts .working-n{color:var(--working-dot);font-weight:650}
.counts .total-n{color:var(--muted)}
.theme-toggle{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font-size:16px;cursor:pointer;transition:background var(--ease),transform var(--ease)}
.theme-toggle:hover{background:var(--subtle);transform:translateY(-1px)}
.theme-toggle:focus-visible,.card:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tree */
#tree{position:relative;background:transparent;padding:8px 0 10px}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#wires path.link{fill:none;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;transition:opacity var(--ease)}
#wires circle.joint{stroke:none}
#wires circle.packet{stroke:none}
.col-stack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.lead-slot{display:flex;justify-content:center}
.main-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:56px;align-items:start}
.col{display:flex;flex-direction:column;align-items:stretch;gap:20px;position:relative}
.sub-col{display:flex;flex-direction:column;gap:14px;margin-top:44px;position:relative}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 13px 11px;box-shadow:var(--shadow);cursor:pointer;position:relative;text-align:left;width:100%;font:inherit;color:inherit;transition:transform var(--ease),box-shadow var(--ease),border-color var(--ease),opacity var(--ease)}
.card:hover{transform:translateY(-2px);border-color:var(--wire)}
.card.sub{padding:10px 11px 9px;border-radius:var(--radius-sm)}
#tree.chain .card{opacity:.45}
#tree.chain .card.hot{opacity:1}
.top-line{display:flex;align-items:center;gap:8px}
.pix{width:18px;height:18px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1px;flex:none}
.pix i{display:block;width:100%;height:100%;border-radius:1px;background:transparent}
.pix i.on{background:var(--agent,var(--accent))}
.card[data-status="working"] .pix i.on{animation:twinkle 1.8s infinite}
.card[data-status="working"] .pix i.on:nth-child(2n){animation-delay:.3s}
.card[data-status="working"] .pix i.on:nth-child(3n){animation-delay:.7s}
.card[data-status="working"] .pix i.on:nth-child(4n){animation-delay:1.1s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
.name{font-weight:700;font-size:15px;color:var(--ink-strong);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.sub .name{font-size:13.5px}
.pill{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px 3px 8px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;flex:none}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.working{background:var(--working-bg);color:var(--working-text);border-color:var(--working-text)}
.pill.working i{animation:pulse 1.6s infinite;background:var(--working-dot)}
.pill.idle{background:var(--idle-bg);color:var(--idle-text);border-color:var(--border)}
.pill.idle i{background:var(--idle-dot)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.model{font-size:12px;color:var(--muted);margin:3px 0 0 26px}
.task{font-size:13px;color:var(--ink);margin:9px 0 0 0;line-height:1.4}
.card.sub .task{font-size:12px;margin-top:7px}
.handoff{font-size:12px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handoff b{color:var(--muted);font-weight:600}
.ctx{margin-top:10px}
.ctx-label{text-align:right;font-size:12px;color:var(--muted);margin-bottom:5px;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--bar-track);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--agent,var(--accent));transition:width .8s ease}
.tools{margin-top:10px;display:flex;gap:6px}
.card.sub .tools{margin-top:8px}
.tool{width:22px;height:22px;border-radius:50%;background:var(--tool-bg);border:1px solid var(--tool-border);color:var(--tool-ink);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.tool svg{width:12px;height:12px;display:block}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,94vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(105%);transition:transform 200ms ease;display:flex;flex-direction:column;z-index:30;color:var(--ink)}
.drawer.open{transform:none}
.d-head{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.d-top{display:flex;align-items:center;gap:8px}
.d-top h2{margin:0;font-size:15px;color:var(--ink-strong)}
.x{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
.x:hover{background:var(--subtle)}
.d-body{padding:14px 16px;overflow:auto;flex:1}
.sec{margin-bottom:14px}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 7px}
.sec p{font-size:13px;line-height:1.55;margin:0;background:var(--subtle);border:1px solid var(--border);border-radius:10px;padding:9px 11px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kv div{background:var(--subtle);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.kv b{font-size:13px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.log li{background:var(--subtle);border:1px solid var(--border);border-radius:10px;padding:7px 10px;line-height:1.45}
.log time{color:var(--muted);font-size:11px;display:block}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink-strong);color:var(--page);font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all 200ms ease;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
@media (max-width:760px){
  .main-row{grid-template-columns:1fr;margin-top:28px;gap:18px}
  .sub-col{margin-top:14px}
  .lead-slot .card{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
var AGENTS=[
 {id:"lead",name:"Lead",model:"Claude Opus",status:"working",task:"Delegating",cur:44000,max:200000,tools:["gh"],handoff:"Coordinating the fix — Researcher reading report",key:"lead"},
 {id:"researcher",name:"Researcher",model:"Claude Sonnet",status:"working",task:"Reading the bug report",cur:32000,max:200000,tools:["gh","globe"],handoff:"↩ Lead · Find where empty cart crashes checkout",key:"researcher"},
 {id:"coder",name:"Coder",model:"Claude Sonnet",status:"idle",task:"Waiting for work",cur:12000,max:200000,tools:["gh"],handoff:"Idle — waiting for Researcher findings",key:"coder"},
 {id:"reviewer",name:"Reviewer",model:"Claude Opus",status:"idle",task:"Waiting for work",cur:6000,max:200000,tools:["gh"],handoff:"Idle — waiting for Coder diff",key:"reviewer"},
 {id:"websearch",name:"Web search",model:"Claude Haiku",status:"idle",task:"Waiting for work",cur:1000,max:64000,tools:["globe"],handoff:"Idle — child of Researcher",key:"websearch",parent:"researcher",sub:true},
 {id:"linter",name:"Linter",model:"Claude Haiku",status:"idle",task:"Waiting for work",cur:960,max:32000,tools:["lint"],handoff:"Idle — child of Coder",key:"linter",parent:"coder",sub:true},
 {id:"testrunner",name:"Test runner",model:"Claude Haiku",status:"idle",task:"Waiting for work",cur:3000,max:64000,tools:["test"],handoff:"Idle — child of Coder",key:"testrunner",parent:"coder",sub:true},
 {id:"docswriter",name:"Docs writer",model:"Claude Haiku",status:"idle",task:"Waiting for work",cur:6000,max:128000,tools:["docs"],handoff:"Idle — child of Reviewer",key:"docswriter",parent:"reviewer",sub:true}
];
var LINKS=[["lead","researcher"],["lead","coder"],["lead","reviewer"],["researcher","websearch"],["coder","linter"],["coder","testrunner"],["reviewer","docswriter"]];
var BRANCH={researcher:"var(--branch-1)",coder:"var(--branch-2)",reviewer:"var(--branch-3)",websearch:"var(--branch-1)",linter:"var(--branch-2)",testrunner:"var(--branch-2)",docswriter:"var(--branch-3)"};
var $=function(s){return document.querySelector(s);};
var tree=$("#tree"),svg=$("#wires");
function fmt(n){if(n>=1000){var k=n/1000;return (Math.round(k*10)/10).toString().replace(/\.0$/,"")+"k";}return ""+n;}
function ctxLabel(a){return fmt(a.cur)+" / "+fmt(a.max);}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function pixHTML(id){var h=hashStr(id),s="";for(var i=0;i<9;i++){var on=((h>>(i%12))^(h>>(i+7)))&1;if(i===4)on=1;if(((h>>i)&3)===3)on=1;s+='<i class="'+(on?"on":"")+'"></i>';}return s;}
function toolIcon(t){
 if(t==="gh")return '<span class="tool" title="GitHub"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a6.5 6.5 0 0 0-2 12.7c.3 0 .4-.1.4-.3v-1c-1.7.4-2-1-2-1-.3-.7-.7-.9-.7-.9-.5-.4 0-.1 0-.1.6 0 .9.6.9.6.5.9 1.4.6 1.7.5.1-.4.2-.6.4-.8-1.4-.2-2.9-.7-2.9-3.1 0-.7.2-1.2.7-1.7-.1-.2-.3-.8.1-1.6 0 0 .6-.2 1.9.6a6.4 6.4 0 0 1 3.4 0c1.3-.8 1.9-.6 1.9-.6.4.8.2 1.4.1 1.6.5.5.7 1 .7 1.7 0 2.4-1.5 2.9-2.9 3.1.2.2.4.6.4 1.1v1.7c0 .2.1.3.4.3A6.5 6.5 0 0 0 8 1.5Z"/></svg></span>';
 if(t==="globe")return '<span class="tool" title="Web">○</span>';
 if(t==="lint")return '<span class="tool" title="Lint">≡</span>';
 if(t==="test")return '<span class="tool" title="Tests">✓</span>';
 return '<span class="tool" title="Docs">✎</span>';
}
function byId(id){return AGENTS.filter(function(a){return a.id===id;})[0];}
function cardEl(a){
 var b=document.createElement("button");
 b.className="card"+(a.sub?" sub":"");
 b.dataset.id=a.id;b.dataset.status=a.status;
 b.style.setProperty("--agent","var(--c-"+a.key+")");
 b.setAttribute("aria-label",a.name+", "+a.model+", "+a.status+", "+a.task+", context "+ctxLabel(a));
 var handoff=(a.id==="researcher")?'<div class="handoff">'+a.handoff+'</div>':"";
 b.innerHTML='<span class="top-line"><span class="pix" aria-hidden="true">'+pixHTML(a.id)+'</span><span class="name">'+a.name+'</span><span class="pill '+a.status+'"><i></i>'+a.status+'</span></span>'+
 '<div class="model">'+a.model+'</div>'+
 '<div class="task">'+a.task+'</div>'+handoff+
 '<div class="ctx"><div class="ctx-label" data-ctx>'+ctxLabel(a)+'</div><div class="bar"><i data-bar style="width:'+(a.cur/a.max*100).toFixed(1)+'%"></i></div></div>'+
 '<div class="tools">'+a.tools.map(toolIcon).join("")+'</div>';
 b.addEventListener("click",function(){openDrawer(a.id);});
 b.addEventListener("mouseenter",function(){trace(a.id,true);});

 b.addEventListener("focus",function(){trace(a.id,true);});

 return b;
}
function render(){
 var leadSlot=$("#leadSlot");leadSlot.innerHTML="";
 var lead=cardEl(byId("lead"));lead.style.width="min(300px,80vw)";leadSlot.appendChild(lead);
 var row=$("#mainRow");row.innerHTML="";
 ["researcher","coder","reviewer"].forEach(function(pid){
  var col=document.createElement("div");col.className="col";
  col.appendChild(cardEl(byId(pid)));
  var subs=document.createElement("div");subs.className="sub-col";
  AGENTS.filter(function(a){return a.parent===pid;}).forEach(function(s){subs.appendChild(cardEl(s));});
  col.appendChild(subs);row.appendChild(col);
 });

 if(selectedId)fillDrawer(selectedId);
}
function updateCounts(){var w=AGENTS.filter(function(a){return a.status==="working";}).length;$("#workingN").textContent=w+" working";}
function elCenter(el){var tr=tree.getBoundingClientRect(),r=el.getBoundingClientRect();return {x:r.left-tr.left+r.width/2,yTop:r.top-tr.top,yBot:r.top-tr.top+r.height};}
function drawWires(){
 svg.innerHTML="";
 var W=tree.offsetWidth,H=tree.offsetHeight;
 svg.setAttribute("viewBox","0 0 "+W+" "+H);
 LINKS.forEach(function(l){
  var p=tree.querySelector('[data-id="'+l[0]+'"]'),c=tree.querySelector('[data-id="'+l[1]+'"]');
  if(!p||!c)return;
  var A=elCenter(p),B=elCenter(c);
  var sx=A.x,sy=A.yBot,tx=B.x,ty=B.yTop;
  var mid=(sy+ty)/2;
  var d="M "+sx+" "+sy+" V "+mid+" H "+tx+" V "+ty;
  var path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",d);path.setAttribute("class","link");
  path.style.stroke=BRANCH[l[1]];path.dataset.link=l[1];
  svg.appendChild(path);
  var j1=document.createElementNS("http://www.w3.org/2000/svg","circle");
  j1.setAttribute("cx",tx);j1.setAttribute("cy",ty-2);j1.setAttribute("r",2.5);j1.setAttribute("class","joint");j1.style.fill=BRANCH[l[1]];j1.dataset.link=l[1];
  svg.appendChild(j1);
  var j0=document.createElementNS("http://www.w3.org/2000/svg","circle");
  j0.setAttribute("cx",sx);j0.setAttribute("cy",sy+1);j0.setAttribute("r",2);j0.setAttribute("class","joint");j0.style.fill=BRANCH[l[1]];j0.dataset.link=l[1];
  svg.appendChild(j0);
 });
}
function trace(id,on){
 if(!on){tree.classList.remove("chain");tree.querySelectorAll(".hot").forEach(function(e){e.classList.remove("hot");});return;}
 tree.classList.add("chain");
 var chain=new Set([id]);
 LINKS.forEach(function(l){if(l[1]===id)chain.add(l[0]);if(l[0]===id)chain.add(l[1]);});
 if(byId(id)&&byId(id).parent)chain.add(byId(id).parent);
 tree.querySelectorAll(".card").forEach(function(c){c.classList.toggle("hot",chain.has(c.dataset.id));});
 svg.querySelectorAll("path,circle").forEach(function(p){p.classList.toggle("hot",p.dataset.link===id||chain.has(p.dataset.link));});
 if(!on)return;
 svg.querySelectorAll("path.link").forEach(function(p){p.style.opacity=(p.dataset.link===id||chain.has(p.dataset.link))?"1":".2";});
 svg.querySelectorAll("circle.joint").forEach(function(p){p.style.opacity=(p.dataset.link===id||chain.has(p.dataset.link))?"1":".2";});
}
/* handoff light */
var linkIdx=0;
function flyPacket(){
 var narrow=window.matchMedia("(max-width:760px)").matches;
 var paths=[].slice.call(svg.querySelectorAll("path.link"));
 if(!paths.length||document.hidden)return;
 var path=paths[linkIdx%paths.length];linkIdx++;
 var len=200;try{len=path.getTotalLength();}catch(e){}
 var c=document.createElementNS("http://www.w3.org/2000/svg","circle");
 c.setAttribute("r","3.5");c.setAttribute("class","packet");
 c.style.fill="var(--ink-strong)";c.style.filter="drop-shadow(0 0 5px "+path.style.stroke+")";
 svg.appendChild(c);
 var t0=performance.now(),dur=1200;
 (function step(t){var k=Math.min(1,(t-t0)/dur);try{var pt=path.getPointAtLength(len*k);c.setAttribute("cx",pt.x);c.setAttribute("cy",pt.y);}catch(e){}
  if(k<1)requestAnimationFrame(step);else{c.remove();
   var tid=path.dataset.link,a=byId(tid);
   if(a&&a.status==="idle"&&Math.random()<.15){a.status="working";render();}
   else if(a){var el=tree.querySelector('[data-id="'+tid+'"]');if(el){el.style.borderColor=BRANCH[tid]||"var(--accent)";setTimeout(function(){el.style.borderColor="";},700);}}
  }})(t0);
}
setInterval(flyPacket,2600);
/* context tick */
setInterval(function(){
 AGENTS.forEach(function(a){if(a.status!=="working")return;a.cur=Math.min(a.max-200,a.cur+Math.round(a.max*0.0006+Math.random()*40));});
 tree.querySelectorAll(".card").forEach(function(el){
  var a=byId(el.dataset.id);if(!a)return;
  var lab=el.querySelector("[data-ctx]");if(lab)lab.textContent=ctxLabel(a);
  var bar=el.querySelector("[data-bar]");if(bar)bar.style.width=(a.cur/a.max*100).toFixed(1)+"%";
 });
 if(selectedId)fillDrawer(selectedId,true);
},2500);
/* theme */
var themeBtn=$("#themeToggle");
function curTheme(){return document.documentElement.getAttribute("data-theme")||"dark";}
function paintTheme(){var d=curTheme()==="dark";themeBtn.textContent=d?"☀️":"🌙";themeBtn.setAttribute("aria-label",d?"Switch to light mode":"Switch to dark mode");}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("agent-crew-theme",t);}catch(e){}paintTheme();requestAnimationFrame(drawWires);}
themeBtn.addEventListener("click",function(){setTheme(curTheme()==="dark"?"light":"dark");});
paintTheme();
/* drawer */
var drawer=$("#drawer"),scrim=$("#scrim"),selectedId=null;
function openDrawer(id){selectedId=id;fillDrawer(id);drawer.classList.add("open");scrim.classList.add("open");$("#closeBtn").focus();}
function closeDrawer(){drawer.classList.remove("open");scrim.classList.remove("open");selectedId=null;}
function fillDrawer(id,soft){
 var a=byId(id);if(!a)return;
 $("#dPix").innerHTML=pixHTML(a.id);$("#dPix").style.setProperty("--agent","var(--c-"+a.key+")");
 $("#dName").textContent=a.name;$("#dModel").textContent=a.model;
 var p=$("#dPill");p.className="pill "+a.status;$("#dPillT").textContent=a.status;
 $("#dTask").textContent=a.task;
 $("#dCtx").textContent=ctxLabel(a);$("#dLim").textContent=fmt(a.max);$("#dPct").textContent=(a.cur/a.max*100).toFixed(1)+"%";
 $("#dTools").textContent=a.tools.join(" · ")+ " — circular tool icons on card";
 $("#dHand").textContent=a.handoff;
 var log=$("#dLog");log.innerHTML="";
 [["Session started","Fix the checkout crash"],["Status",a.status+" · "+a.task],["Context",ctxLabel(a)+" full"]].forEach(function(e){var li=document.createElement("li");li.innerHTML="<time>"+e[0]+"</time>"+e[1];log.appendChild(li);});
}
$("#closeBtn").onclick=closeDrawer;scrim.onclick=closeDrawer;
document.addEventListener("keydown",function(e){
 if(e.key==="Escape")closeDrawer();
 if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
  if(!drawer.classList.contains("open"))return;
  var ids=AGENTS.map(function(a){return a.id;});
  var i=ids.indexOf(selectedId);
  i=(i+(e.key==="ArrowRight"?1:-1)+ids.length)%ids.length;
  openDrawer(ids[i]);
 }
 if(e.key==="Enter"&&document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains("card")){openDrawer(document.activeElement.dataset.id);}
});
window.addEventListener("resize",drawWires);
render();
</script>
</body>
</html>
