function doAsk(a,b,q){var ans=drillTrend(a,b);addTurn({role:"user",text:q,quote:labelFor(a,b)+" \u00b7 "+money(sum(TREND.current.slice(a,b+1)))});clearPop();pushAnswer(ans)}
}
function askDrill(turn,idx){var ans=drillSplit(turn.split.groups,turn.split.title,idx);var g=turn.split.groups[idx];var gsum=sum(g.parts.map(function(p){return p.value}));addTurn({role:"user",text:"Tell me about "+g.name,quote:g.name+" \u00b7 "+money(gsum/1e3)});pushAnswer(ans)}
var pending=false;
function addTurn(t){turns.push(t);var n=userNode(t);thread.appendChild(n);state.lastUser=t;updateCounts();return n}
function pushAnswer(ans){
pending=true;updateCounts(true);
var sh=answerShell();sh.mark.setAttribute("data-busy","");thread.appendChild(sh.root);
var th=el("span","thinking","Reading your usage\u2026");sh.body.appendChild(th);
if(liveNote){liveNote.textContent="Working on it"}
var delay=reduced()?0:700;
setTimeout(function(){
sh.body.removeChild(th);sh.mark.removeAttribute("data-busy");
if(reduced()){turns.push(ans);renderAnswerBody(sh.body,ans,ask);pending=false;updateCounts();state.asked[ans.text]=sh;return}
var words=ans.text.split(" ");var p=el("p","atext","");sh.body.appendChild(p);var i=0;
function step(){if(i<words.length){p.textContent=words.slice(0,i+1).join(" ");i++;setTimeout(step,18)}else{sh.body.removeChild(p);turns.push(ans);renderAnswerBody(sh.body,ans,ask);pending=false;updateCounts();state.asked[ans.text]=sh}}
step();
},delay);
}
function ask(q,sel,quote){
if(pending){return}
if(sel){var a2=drillTrend(sel.from,sel.to);addTurn({role:"user",text:q,quote:sel.label+" \u00b7 "+sel.detail});pushAnswer(a2);return}
var key=(q||"").trim();var ans=ANSWERS[key]||FALLBACK;
addTurn({role:"user",text:key||"Hello",quote:quote||null});
pushAnswer(ans);
}
function updateCounts(thinking){var n=turns.filter(function(t){return t.role==="assistant"}).length;if(workCount){workCount.textContent=(thinking||pending?"1 working \u00b7 ":"")+n+" answers"}}
function init(){
thread=document.getElementById("thread");composerInput=document.getElementById("composerInput");liveNote=document.getElementById("liveNote");workCount=document.getElementById("workCount");themeBtn=document.getElementById("themeBtn");iconMoon=document.getElementById("themeIconMoon");iconSun=document.getElementById("themeIconSun");
var stored=null;try{stored=localStorage.getItem(THEME_KEY)}catch(e){}if(stored==="light"||stored==="dark"){setTheme(stored,false)}else{try{if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches){setTheme("dark",false)}else{setTheme("light",false)}}catch(e){setTheme("light",false)}}
if(themeBtn){themeBtn.addEventListener("click",function(){setTheme(state.theme==="dark"?"light":"dark",true)})}
var s=document.getElementById("sendBtn");function send(){var v=composerInput.value;if(!v||!v.trim()||pending){return}composerInput.value="";ask(v.trim())}
if(s){s.addEventListener("click",send)}
if(composerInput){composerInput.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}})}
for(var i=0;i<TURNS_SEED.length;i++){var t=TURNS_SEED[i];turns.push(t);if(t.role==="user"){thread.appendChild(userNode(t))}else{var sh=answerShell();(function(sh,t){renderAnswerBody(sh.body,t,ask);state.asked[t.text]=sh})(sh,t);thread.appendChild(sh.root)}}
updateCounts();
try{window.__spend={ask:ask,setLever:function(id,v){planState[id]=v;refreshPlan()},getPlan:function(){return planCalc(planState)},state:state,turns:turns,setTheme:setTheme,drillTrend:drillTrend,drillSplit:function(i){return drillSplit(PROVIDERS,"November",i)},nodes:{thread:thread,composer:composerInput,proj:document.getElementById("projName")}}}catch(e){}
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init)}else{init()}
})();
</script>
</body>
