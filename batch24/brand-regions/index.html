var bg2=svgEl("path",{d:"M250 260 Q300 250 330 300 Q320 370 280 400 Q240 360 250 260 Z",class:"land"});svg.appendChild(bg2);
var bg3=svgEl("path",{d:"M440 90 Q500 70 540 110 Q550 160 500 180 Q440 170 440 90 Z",class:"land"});svg.appendChild(bg3);
var bg4=svgEl("path",{d:"M470 200 Q520 190 540 240 Q520 310 480 300 Q450 250 470 200 Z",class:"land"});svg.appendChild(bg4);
var bg5=svgEl("path",{d:"M560 90 Q700 60 840 100 Q880 160 800 220 Q680 240 580 190 Q540 130 560 90 Z",class:"land"});svg.appendChild(bg5);

var tip=el("div","tip");tip.hidden=true;tip.setAttribute("role","status");

var tipName=el("b",null,"");tipHead.appendChild(tipName);
var tipDate=el("span",null,"");tipHead.appendChild(tipDate);
tip.appendChild(tipHead);
var dl=document.createElement("dl");tip.appendChild(dl);
ui.tipRows={};
MEASURES.forEach(function(m){
var wrap=document.createElement("div");
var dt=document.createElement("dt");dt.textContent=m.long;wrap.appendChild(dt);
var dd=document.createElement("dd");dd.className="num";dd.textContent="";wrap.appendChild(dd);
dl.appendChild(wrap);ui.tipRows[m.id]={_wrap:wrap,_dd:dd};
});
stage.appendChild(tip);ui.tip=tip;ui.tipName=tipName;ui.tipDate=tipDate;ui.tipFlag=tipFlag;
var legend=el("div","legend");legend.setAttribute("aria-hidden","true");
legend.appendChild(el("span",null,"Low"));
var li=el("i",null,"");legend.appendChild(li);
var lmax=el("span","num","");legend.appendChild(lmax);ui.legendMax=lmax;
stage.appendChild(legend);
mapEl.appendChild(stage);card.appendChild(mapEl);
var side=el("div","side");
var mseg=el("div","seg seg--full");mseg.setAttribute("role","radiogroup");mseg.setAttribute("aria-label","Measure");
ui.measureBtns=[];
MEASURES.forEach(function(m){
var b=el("button",null,m.label);b.setAttribute("role","radio");b.setAttribute("type","button");b._id=m.id;
b.setAttribute("aria-checked",m.id===state.measure?"true":"false");b.tabIndex=m.id===state.measure?0:-1;
b.addEventListener("click",function(){setMeasure(m.id);});
mseg.appendChild(b);ui.measureBtns.push(b);
});
mseg.addEventListener("keydown",function(e){
var ids=MEASURES.map(function(m){return m.id;});var idx=ids.indexOf(state.measure);var ni=null;
if(e.key==="ArrowRight")ni=(idx+1)%ids.length;else if(e.key==="ArrowLeft")ni=(idx-1+ids.length)%ids.length;
if(ni!=null){e.preventDefault();setMeasure(ids[ni]);ui.measureBtns[ni].focus();}
});
side.appendChild(mseg);
var listWrap=el("div","list");
var headRow=el("div","row row--head");headRow.setAttribute("aria-hidden","true");
headRow.appendChild(el("span",null,"Region"));
var headVal=el("span",null,measureLong());headRow.appendChild(headVal);ui.listHeadVal=headVal;
listWrap.appendChild(headRow);
var ul=el("ul",null,"");ul.setAttribute("aria-label","Regions by "+measureLong().toLowerCase());ui.listEl=ul;ui.listUlLabel=ul;
ul.addEventListener("keydown",function(e){
var t=e.key==="ArrowDown"?1:e.key==="ArrowUp"?-1:0;
if(!t&&e.key!=="Home"&&e.key!=="End")return;
var btns=[];for(var i=0;i<ul.children.length;i++){var b2=ul.children[i].firstChild;if(b2)btns.push(b2);}
if(!btns.length)return;
var cur=document.activeElement;var idx=btns.indexOf(cur);var ni2=null;
if(e.key==="Home")ni2=0;else if(e.key==="End")ni2=btns.length-1;else ni2=Math.max(0,Math.min(btns.length-1,idx+t));
var tgt=btns[ni2];if(tgt){e.preventDefault();for(var j=0;j<btns.length;j++)btns[j].tabIndex=btns[j]===tgt?0:-1;tgt.focus();}
});
REGIONS.forEach(function(r){
var li2=el("li",null,"");
var b=el("button","row");b.setAttribute("type","button");b.tabIndex=-1;
var nm=el("span","row__name");
var fl=el("span","flag",r.emoji);nm.appendChild(fl);
var nn=el("span",null,r.name);nn.setAttribute("dir","auto");nn.setAttribute("title",r.name);nm.appendChild(nn);
b.appendChild(nm);
var nums=el("span","row__nums");
var vv=el("span","num","");nums.appendChild(vv);
var dd2=el("span","num delta","");nums.appendChild(dd2);
b.appendChild(nums);
b.addEventListener("pointerenter",function(){setHover(r.id);});
b.addEventListener("pointerleave",function(){setHover(null);});
b.addEventListener("focus",function(){setHover(r.id);});
b.addEventListener("blur",function(){setHover(null);});
b.addEventListener("click",function(){var z=ZOOM_BY[r.id]||"world";setZoom(state.zoom===z?"world":z);});
li2.appendChild(b);ul.appendChild(li2);
refs.rows.set(r.id,{_li:li2,_btn:b,_val:vv,_delta:dd2});
});
listWrap.appendChild(ul);side.appendChild(listWrap);card.appendChild(side);root.appendChild(card);
var toast=el("div","toast");toast.hidden=true;toast.setAttribute("role","status");root.appendChild(toast);ui.toast=toast;
var menuLayer=el("div",null,"");menuLayer.style.position="relative";root.appendChild(menuLayer);ui.menuLayer=menuLayer;ui.openMenu=null;
function closeMenus(){if(ui.openMenu){ui.menuLayer.removeChild(ui.openMenu);ui.openMenu=null;for(var k in ui.filterBtns)ui.filterBtns[k].setAttribute("aria-expanded","false");cfgBtn.setAttribute("aria-expanded","false");}}
function toggleMenu(key,anchor){
if(ui.openMenu&&ui.openMenu._key===key){closeMenus();return;}
closeMenus();
var m=el("div","menu");m._key=key;m.setAttribute("role","menu");
function item(label,checked,fn,desc){
var b=el("button",null,"");b.setAttribute("role","menuitemcheckbox");b.setAttribute("aria-checked",checked?"true":"false");b.setAttribute("type","button");
var box=el("span",null,checked?"\u2611 ":"\u2610 ");b.appendChild(box);
b.appendChild(el("span",null,label));
if(desc)b.appendChild(el("span",null,""));
b.addEventListener("click",function(){fn();});
m.appendChild(b);return b;
}
if(key==="__chart"){
VIEWS.forEach(function(v){
var b2=el("button",null,"");b2.setAttribute("type","button");b2.appendChild(el("span",null,(state.zoom===v.id?"\u25CF ":"\u25CB ")+v.label));
b2.addEventListener("click",function(){setZoom(v.id);closeMenus();});
m.appendChild(b2);
});
var dv=el("div","div");m.appendChild(dv);
var sh=el("button",null,"");sh.setAttribute("type","button");
sh.appendChild(el("span",null,(state.shading?"\u25CF ":"\u25CB ")+(state.shading?"Shading on":"Shading off")));
sh.addEventListener("click",function(){state.shading=!state.shading;refreshMap();closeMenus();});
m.appendChild(sh);
}else if(key==="__more"){
var o1=el("button",null,"Export CSV");o1.setAttribute("type","button");o1.addEventListener("click",function(){closeMenus();showToast("regions.csv downloaded");try{var rows=currentRows();var csv="region,"+state.measure+",delta\n"+rows.map(function(r){return '"'+r.name+'",'+r[state.measure].toFixed(1)+","+r.change[state.measure].toFixed(1);}).join("\n");var blob=new Blob([csv],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="regions.csv";document.body.appendChild(a);a.click();setTimeout(function(){try{document.body.removeChild(a);}catch(e){}},100);}catch(e){}});m.appendChild(o1);
var o2=el("button",null,"Copy link");o2.setAttribute("type","button");o2.addEventListener("click",function(){closeMenus();showToast("Link copied");});m.appendChild(o2);
var dv2=el("div","div");m.appendChild(dv2);
var o3=el("button",null,"Report settings");o3.setAttribute("type","button");o3.addEventListener("click",function(){closeMenus();showToast("Report settings open here");});m.appendChild(o3);
}else{
var def=null;for(var i=0;i<FILTER_DEFS.length;i++)if(FILTER_DEFS[i].key===key)def=FILTER_DEFS[i];
def.options.forEach(function(opt){
var cur=state.filters[key].indexOf(opt)>=0;
item(opt,cur,function(){
var arr=state.filters[key];var ix=arr.indexOf(opt);
if(ix>=0)arr.splice(ix,1);else arr.push(opt);
refreshCounts();refreshList();closeMenus();
});
});
if(state.filters[key].length){var dv3=el("div","div");m.appendChild(dv3);var cl=el("button",null,"Clear");cl.setAttribute("type","button");cl.addEventListener("click",function(){state.filters[key]=[];refreshCounts();refreshList();closeMenus();});m.appendChild(cl);}
}
ui.menuLayer.appendChild(m);ui.openMenu=m;anchor.setAttribute("aria-expanded","true");
}
moreBtn.addEventListener("click",function(){toggleMenu("__more",moreBtn);});
document.addEventListener("click",function(e){if(ui.openMenu&&e.target!==ui.openMenu&&!ui.openMenu.contains(e.target))closeMenus();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMenus();});
app.appendChild(root);ui.root=root;
var initTheme="light";try{initTheme=localStorage.getItem("br-regions-theme")||document.documentElement.getAttribute("data-theme")||"light";}catch(e){}
setTheme(initTheme==="dark"?"dark":"light");
refreshTabs();refreshPeriod();refreshMeasure();refreshCounts();refreshList();
if(ui.tabBtns.length&&refs.rows.size){
var firstId=currentRows()[0].id;var firstBtn=refs.rows.get(firstId)._btn;firstBtn.tabIndex=0;
}
window.__brTest={state:state,refs:refs,ui:ui,setMeasure:setMeasure,setPeriod:setPeriod,setZoom:setZoom,setHover:setHover,setTheme:setTheme,setTab:function(t){state.tab=t;refreshTabs();},setFilter:function(k,v){state.filters[k]=v.slice();refreshCounts();refreshList();},rows:function(){return Array.from(refs.rows.values()).map(function(o){return o._btn;});},paths:function(){return Array.from(refs.paths.values());},visibleText:function(){function txt(n){if(!n)return "";if(n.hidden)return "";if(n.style&&n.style.display==="none")return "";var s=n._text||"";if(n.children)for(var i=0;i<n.children.length;i++)s+=" "+txt(n.children[i]);return s;}return txt(ui.root);}};
}

})();
