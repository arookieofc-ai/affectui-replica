<style>
:root{color-scheme:light dark}
html{-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
:root,html[data-theme="light"]{
--surface:#ffffff;--page:#fafaf9;--ink:#171717;--ink-strong:#1c1917;--muted:#78716c;--subtle:#f5f5f4;--border:#e7e5e4;
--radius-lg:16px;--radius:10px;--radius-sm:6px;

}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--ink-strong:#ededed;--muted:#a1a1aa;--subtle:#26262a;--border:#2e2e33;
--shadow:0 1px 2px rgba(0,0,0,.45),0 4px 16px rgba(0,0,0,.45);
--shadow-lift:0 2px 6px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
--amber:#fbbf24;--amber-bg:#451a03;--amber-text:#fde68a;
--blue:#3CC7FF;--blue-soft:#0c3547;--blue-ink:#bae6fd;
--pdf-bg:#451a1a;--pdf-ink:#fecaca;
--doc-bg:#0c3547;--doc-ink:#bae6fd;
--xls-bg:#052e1b;--xls-ink:#bbf7d0;
--focus:#7db4ff;--preview-line:rgba(255,255,255,.10);
--skel:#2e2e33;--skel-hi:#26262a;
}
body{font-variant-numeric:tabular-nums}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.shell{max-width:1060px;margin:0 auto;padding:0 20px 64px}
.topbar{display:flex;align-items:center;justify-content:flex-end;height:52px}
.theme-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px 7px 10px;font-size:13px;cursor:pointer;transition:box-shadow 160ms ease,border-color 160ms ease,transform 160ms ease}
.theme-btn .ticon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;margin-right:-2px}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.crumbs{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;background:var(--page);font-size:13px;color:var(--muted);border-bottom:1px solid var(--border)}
.crumbs button{color:inherit;text-decoration:none;background:none;border:0;padding:6px 4px;font-size:13px;cursor:pointer;border-radius:6px}
.crumbs i{font-style:normal;color:var(--muted);opacity:.6}
.crumbs [aria-current]{overflow:hidden;min-width:0;font-weight:500;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.page{padding-top:12px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px 8px 6px 6px;border-radius:8px}
.back svg{flex:none}
.back:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.folder-head{display:flex;align-items:center;gap:12px;margin-top:22px}
.folder-mark{flex:none;align-self:flex-start;width:26px;height:26px;margin:3px -2px 0 0}
.page-title{flex:1 1 0;min-width:0;margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink-strong);overflow-wrap:anywhere;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;padding:8px 14px 8px 12px;cursor:pointer;transition:box-shadow 160ms ease,border-color 160ms ease,transform 160ms ease,background 160ms ease}
.btn .bicon{display:inline-flex;margin-left:-2px}
.btn-primary{background:var(--ink-strong);border-color:var(--ink-strong);color:var(--page)}
html[data-theme="dark"] .btn-primary{background:var(--ink);border-color:var(--ink);color:#101012}
.btn-secondary{background:var(--surface)}
.btn-ghost{border-color:transparent;background:transparent;padding:8px 10px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lift);padding:6px;z-index:20}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;font-size:13px;color:var(--ink);cursor:pointer}
.menu button.danger{color:#dc2626}
html[data-theme="dark"] .menu button.danger{color:#f87171}
.menu button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;transition:box-shadow 160ms ease,color 160ms ease,border-color 160ms ease}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.tab:focus-visible,.tab-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.demo-row .pill{border:1px solid var(--border);background:var(--subtle);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.demo-row .pill[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-text)}
.count{margin-top:14px;font-size:12.5px;color:var(--muted)}
.file-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.file-card{width:208px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:10px;cursor:pointer;transition:box-shadow 180ms ease,transform 180ms ease,border-color 180ms ease;animation:rise .38s ease both;animation-delay:calc(var(--i,0)*45ms)}
.file-card[hidden]{display:none}
.file-card.selected{border-color:var(--focus)}
.file-preview{position:relative;height:112px;border-radius:6px;background:var(--subtle);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px var(--preview-line)}
.file-preview .big{font-size:22px;font-weight:700;letter-spacing:.02em}
.file-badge{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:3px 8px}
.badge-DOC{background:var(--doc-bg);color:var(--doc-ink)}
.badge-PDF{background:var(--pdf-bg);color:var(--pdf-ink)}
.badge-XLS{background:var(--xls-bg);color:var(--xls-ink)}
.file-name{margin:10px 2px 0;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{margin:2px 2px 2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.empty{margin-top:20px;padding:48px 24px 56px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);text-align:center}
.empty[hidden]{display:none}
.empty-icon{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;background:var(--subtle);display:flex;align-items:center;justify-content:center;color:var(--muted);box-shadow:inset 0 0 0 1px var(--preview-line)}
.empty h2{margin:0 0 8px;font-size:15px}
.empty p{margin:0 auto 16px;max-width:420px;font-size:13px;color:var(--muted)}
.skel-grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.skel-grid[hidden]{display:none}
.skel{width:208px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:10px;pointer-events:none}
.skel-prev{height:112px;border-radius:6px;background:linear-gradient(100deg,var(--skel) 30%,var(--skel-hi) 50%,var(--skel) 70%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;box-shadow:inset 0 0 0 1px var(--preview-line)}
.skel-name{height:20px;display:flex;align-items:center;margin-top:8px}
.skel-meta{height:16px;display:flex;align-items:center}
.skel-bar{border-radius:4px;background:var(--skel)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink-strong);color:var(--page);font-size:13px;border-radius:999px;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity 180ms ease,transform 180ms ease;z-index:50;max-width:min(92vw,480px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="dark"] .toast{background:var(--ink);color:#101012}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:180% 0}to{background-position:-20% 0}}
@media (max-width:900px){.shell{padding:0 16px 56px}}
@media (max-width:600px){
.shell{padding:0 12px 48px}
.folder-head{flex-wrap:wrap;row-gap:14px;margin-top:18px}
.head-actions{width:100%;margin-left:0}
.file-grid,.skel-grid{gap:10px}
.file-card,.skel{width:100%}
.empty{padding:36px 18px 40px}
}
@media (hover: hover) and (pointer: fine){
.crumbs button:hover{color:var(--ink)}
.back:hover{color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.theme-btn:hover{border-color:var(--muted)}
.tab:hover{color:var(--ink)}
.file-card:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.menu button:hover{background:var(--subtle)}
.icon-btn:hover{background:var(--subtle);color:var(--ink)}
.demo-row .pill:hover{border-color:var(--muted)}
}
</style>
</head>

<script>
(function(){
"use strict";
var FOLDERS=[
{name:"Q3 Campaign",files:[
{name:"Campaign-Brief",type:"DOC",edited:"2 hours ago"},
{name:"Launch-Plan",type:"PDF",edited:"Yesterday"},
{name:"Media-Budget",type:"XLS",edited:"Yesterday"},
{name:"Ad-Copy",type:"DOC",edited:"3 days ago"},
{name:"Results-Q2",type:"XLS",edited:"Last week"}]},
{name:"Brand assets",files:[
{name:"Brand-Guidelines",type:"PDF",edited:"4 days ago"},
{name:"Tone-of-Voice",type:"DOC",edited:"Last week"},
{name:"Logo-Usage",type:"PDF",edited:"2 weeks ago"}]},
{name:"Hiring",files:[
{name:"Job-Description",type:"DOC",edited:"Today"},
{name:"Candidates",type:"XLS",edited:"Yesterday"},
{name:"Interview-Guide",type:"PDF",edited:"5 days ago"},
{name:"Offer-Template",type:"DOC",edited:"Last month"}]},
{name:"Research",files:[
{name:"Market-Study",type:"PDF",edited:"3 days ago"},
{name:"Survey-Results",type:"XLS",edited:"Last week"}]}
];
var THEME_KEY="affectui-folder-theme";
var state={folder:"Q3 Campaign",uploads:{},loading:false,empty:false,selected:null};
function $(id){return document.getElementById(id);}
var els={};
els.root=document.documentElement;
els.themeBtn=$("themeBtn");els.themeIcon=$("themeIcon");els.themeLabel=$("themeLabel");
els.crumbCurrent=$("crumbCurrent");els.crumbFiles=$("crumbFiles");els.backBtn=$("backBtn");
els.title=$("folderTitle");els.moreBtn=$("moreBtn");els.moreMenu=$("moreMenu");
els.menuRename=$("menuRename");els.menuCopy=$("menuCopy");els.menuDelete=$("menuDelete");
els.shareBtn=$("shareBtn");els.uploadBtn=$("uploadBtn");els.fileInput=$("fileInput");
els.tabs=$("folderTabs");els.loadingPill=$("loadingPill");els.emptyPill=$("emptyPill");
els.count=$("fileCount");els.grid=$("fileGrid");els.skel=$("skelGrid");
els.empty=$("emptyState");els.emptyBtn=$("emptyBtn");
els.toast=$("toast");els.toastText=$("toastText");
var pool=[];
var tabNodes=[];
var toastTimer=null;
function currentFolder(){for(var i=0;i<FOLDERS.length;i++){if(FOLDERS[i].name===state.folder)return FOLDERS[i];}return FOLDERS[0];}
function visibleFiles(){var base=currentFolder().files;var up=state.uploads[state.folder]||[];if(state.empty)return [];return up.concat(base);}
function showToast(msg){els.toastText.textContent=msg;els.toast.classList.add("show");if(toastTimer){try{clearTimeout(toastTimer);}catch(e){}}toastTimer=setTimeout(function(){els.toast.classList.remove("show");},2200);}
function setTheme(mode){els.root.setAttribute("data-theme",mode);try{els.root.dataset.theme=mode;}catch(e){}try{localStorage.setItem(THEME_KEY,mode);}catch(e){}els.themeIcon.textContent=(mode==="dark")?"\u2600":"\u263E";els.themeLabel.textContent=(mode==="dark")?"Light":"Dark";}
function getTheme(){var t=null;try{t=els.root.getAttribute("data-theme");}catch(e){}return (t==="dark")?"dark":"light";}
function typeGlyph(t){if(t==="PDF")return "PDF";if(t==="XLS")return "XLS";return "DOC";}
function fileMetaText(f){var ed=(f.edited||"").trim();if(ed)return f.type+" \u00B7 "+ed;return f.type;}
function ensureCard(i){
if(pool[i])return pool[i];
var card=document.createElement("div");
card.className="file-card";card.setAttribute("tabindex","0");card.setAttribute("role","button");
var prev=document.createElement("div");prev.className="file-preview";
var badge=document.createElement("span");badge.className="file-badge badge-DOC";
var big=document.createElement("span");big.className="big";
prev.appendChild(badge);prev.appendChild(big);
var nm=document.createElement("div");nm.className="file-name";
var mt=document.createElement("div");mt.className="file-meta";
card.appendChild(prev);card.appendChild(nm);card.appendChild(mt);
(function(idx){
card.addEventListener("click",function(){selectFile(idx);});
card.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){try{ev.preventDefault();}catch(e){}selectFile(idx);}});
})(i);
els.grid.appendChild(card);
var rec={root:card,prev:prev,badge:badge,big:big,name:nm,meta:mt,file:null};
pool[i]=rec;return rec;
}
function selectFile(idx){
var rec=pool[idx];if(!rec||!rec.file)return;
for(var i=0;i<pool.length;i++){if(pool[i])pool[i].root.classList.remove("selected");}
rec.root.classList.add("selected");state.selected=rec.file.name;
showToast("Opened "+rec.file.name);
}
function updateGridInPlace(){
var files=visibleFiles();
for(var i=0;i<files.length;i++){ensureCard(i);}
for(var k=0;k<pool.length;k++){
var rec=pool[k];if(!rec)continue;
if(state.loading){rec.root.hidden=true;continue;}
if(k<files.length&&!state.empty){
var f=files[k];
rec.file=f;
rec.root.hidden=false;
rec.root.title=f.name;
rec.root.style.setProperty("--i",String(k));
rec.root.classList.toggle("selected",state.selected===f.name);
rec.badge.textContent=f.type;
rec.badge.className="file-badge badge-"+f.type;
rec.big.textContent=typeGlyph(f.type);
rec.name.textContent=f.name;
rec.name.title=f.name;
rec.meta.textContent=fileMetaText(f);
}else{rec.root.hidden=true;rec.file=null;}
}
var showGrid=(!state.loading&&!state.empty&&files.length>0);
els.grid.hidden=!showGrid;
els.empty.hidden=!( !state.loading&& (state.empty||files.length===0) );
els.skel.hidden=!state.loading;
var label=state.loading?"Loading files":(files.length===1?"1 file":files.length+" files");
els.count.textContent=label;
}
function updateChromeInPlace(){
var cur=currentFolder();
els.title.textContent=cur.name;els.title.title=cur.name;
els.crumbCurrent.textContent=cur.name;els.crumbCurrent.title=cur.name;
document.title=cur.name+" \u2014 Files";
for(var i=0;i<tabNodes.length;i++){
var b=tabNodes[i];
var on=(b.getAttribute("data-folder")===cur.name);
b.setAttribute("aria-selected",on?"true":"false");
}
els.loadingPill.setAttribute("aria-pressed",state.loading?"true":"false");
els.emptyPill.setAttribute("aria-pressed",state.empty?"true":"false");
}
function refresh(){updateChromeInPlace();updateGridInPlace();}
function switchFolder(name){state.folder=name;state.selected=null;state.loading=false;state.empty=false;refresh();}
function setLoading(v){state.loading=!!v;refresh();}
function setEmpty(v){state.empty=!!v;refresh();}
function classify(name){if(/\.(xlsx?|csv|numbers)$/i.test(name))return "XLS";if(/\.pdf$/i.test(name))return "PDF";return "DOC";}
function stripExt(n){return String(n).replace(/\.[^.]+$/,"");}
function addUploads(list){
if(!list||!list.length)return 0;
var arr=state.uploads[state.folder]||[];
var made=[];
for(var i=0;i<list.length;i++){var raw=list[i];var nm=raw.name?stripExt(raw.name):("Untitled "+(arr.length+made.length+1));var tp=raw.type||classify(raw.name||"");made.push({name:nm,type:tp,edited:"Just now"});}
state.uploads[state.folder]=made.concat(arr);
state.empty=false;state.loading=false;refresh();
return made.length;
}
function buildTabs(){
for(var i=0;i<FOLDERS.length;i++){
(function(fd){
var b=document.createElement("button");
b.className="tab";b.type="button";b.setAttribute("role","tab");
b.setAttribute("data-folder",fd.name);b.textContent=fd.name;
b.addEventListener("click",function(){switchFolder(fd.name);});
els.tabs.appendChild(b);tabNodes.push(b);
})(FOLDERS[i]);
}
}
function buildSkel(){
var widths=[112,92,120,76,104];
for(var i=0;i<widths.length;i++){
var s=document.createElement("div");s.className="skel";
var p=document.createElement("div");p.className="skel-prev";
var n=document.createElement("div");n.className="skel-name";
var m=document.createElement("div");m.className="skel-meta";
var b1=document.createElement("span");b1.className="skel-bar";
b1.style.width=widths[i]+"px";b1.style.height="10px";
var b2=document.createElement("span");b2.className="skel-bar";
b2.style.width=(i%2?"96px":"120px");b2.style.height="8px";
n.appendChild(b1);m.appendChild(b2);
s.appendChild(p);s.appendChild(n);s.appendChild(m);
els.skel.appendChild(s);
}
}
function closeMenu(){els.moreMenu.hidden=true;els.moreBtn.setAttribute("aria-expanded","false");}
function toggleMenu(){var open=els.moreMenu.hidden;els.moreMenu.hidden=!open;els.moreBtn.setAttribute("aria-expanded",open?"true":"false");}
function copyLink(){
var href="";try{href=window.location?window.location.href:"";}catch(e){}
try{if(navigator.clipboard&&navigator.clipboard.writeText)href&&navigator.clipboard.writeText(href);}catch(e){}
showToast("Link copied");
}
function init(){
buildTabs();buildSkel();
refresh();
var stored=null;try{stored=localStorage.getItem(THEME_KEY);}catch(e){}
var cur=getTheme();
if(stored==="light"||stored==="dark"){if(stored!==cur)setTheme(stored);else{els.themeIcon.textContent=(cur==="dark")?"\u2600":"\u263E";els.themeLabel.textContent=(cur==="dark")?"Light":"Dark";}}
else{els.themeIcon.textContent=(cur==="dark")?"\u2600":"\u263E";els.themeLabel.textContent=(cur==="dark")?"Light":"Dark";}
els.themeBtn.addEventListener("click",function(){setTheme(getTheme()==="dark"?"light":"dark");});
els.crumbFiles.addEventListener("click",function(){showToast("Back to Files");});
els.backBtn.addEventListener("click",function(){showToast("Back to Files");});
els.moreBtn.addEventListener("click",function(ev){try{ev.stopPropagation();}catch(e){}toggleMenu();});
els.menuRename.addEventListener("click",function(){closeMenu();showToast("Rename is coming soon");});
els.menuCopy.addEventListener("click",function(){closeMenu();copyLink();});
els.menuDelete.addEventListener("click",function(){closeMenu();showToast("Folder deleted");});
els.shareBtn.addEventListener("click",function(){copyLink();});
els.uploadBtn.addEventListener("click",function(){try{els.fileInput.click();}catch(e){showToast("Choose files to upload");}});
try{els.fileInput.addEventListener("change",function(ev){
var fl=ev.target&&ev.target.files;if(!fl||!fl.length)return;
var arr=[];for(var i=0;i<fl.length;i++)arr.push({name:fl[i].name});
var n=addUploads(arr);showToast(n+(n===1?" file":" files")+" uploaded");
try{ev.target.value="";}catch(e){}
});}catch(e){}
els.loadingPill.addEventListener("click",function(){setLoading(!state.loading);});
els.emptyPill.addEventListener("click",function(){setEmpty(!state.empty);});
els.emptyBtn.addEventListener("click",function(){showToast("Work in folder");});
document.addEventListener("click",function(ev){if(!els.moreMenu.hidden){var t=null;try{t=ev.target;}catch(e){}if(t!==els.moreBtn&&t!==els.moreMenu)closeMenu();}});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeMenu();});
try{window.__folderApp={state:state,switchFolder:switchFolder,setLoading:setLoading,setEmpty:setEmpty,addUploads:addUploads,setTheme:setTheme,getTheme:getTheme,refresh:refresh,pool:function(){return pool;},visibleFiles:visibleFiles,
visibleText:function(){var parts=[];function walk(n){if(!n)return;if(n.hidden)return;if(n.textContent!==undefined&&(!n.children||!n.children.length)){var s=String(n.textContent||"").trim();if(s)parts.push(s);}var ch=n.children||[];for(var i=0;i<ch.length;i++)walk(ch[i]);}
try{walk(document.body);}catch(e){}return parts.join("\n");}};}catch(e){}
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init);}else{init();}
})();
</script>
</body>
</html>
