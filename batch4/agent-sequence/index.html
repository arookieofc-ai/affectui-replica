}
function laneX(i,n){return "calc(var(--g,40px) + (100% - var(--g,40px)) * "+((i+0.5)/n)+")";}
function spanX(a,b,n){return {left:"calc(var(--g,40px) + (100% - var(--g,40px)) * "+(a/n)+")",
  width:"calc((100% - var(--g,40px)) * "+((b-a)/n)+")"};}

/* ============ app ============ */
var reduceMotion=false;
try{reduceMotion=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}catch(e){}
var state={shown:0,paused:false,hover:false,focus:false,card:null,focusIdx:-1,loops:0,selMsg:null,selAgent:null};
var ORDER=orderOf(PARTICIPANTS);
var COLORS=colorMap(PARTICIPANTS);
var BYID={};PARTICIPANTS.forEach(function(p){BYID[p.id]=p;});
var root=document.getElementById("app")||document.body;
var shell,barTitle,barSum,scrollEl,canvasEl,headsEl,bodyEl,listEl,liveEl,cardEl,playBtn;
var timers=[];

function el(tag,cls,text){
  var d=document.createElement(tag);
  if(cls)d.className=cls;
  if(text!==undefined&&text!==null)d.textContent=text;
  return d;
}
function later(fn,ms){var t=window.setTimeout(fn,ms);timers.push(t);return t;}
function clearTimers(){timers.forEach(function(t){window.clearTimeout(t);});timers=[];}

function build(){
  shell=el("div","page");
  var bar=el("div","page-bar");
  var hwrap=el("div",null);
  var h=el("h1",null,"Agent Sequence");
  var k=el("p","kind","affectUI Pro \u00b7 interactive replica (clean-room)");
  hwrap.appendChild(h);hwrap.appendChild(k);
  var ctrls=el("div","controls");
  playBtn=el("button","btn","Pause");
  playBtn.setAttribute("aria-pressed","false");
  playBtn.setAttribute("aria-label","Pause the replay");
  playBtn.addEventListener("click",function(){
    state.paused=!state.paused;
    playBtn.textContent=state.paused?"Play":"Pause";
    playBtn.setAttribute("aria-pressed",state.paused?"true":"false");
    playBtn.setAttribute("aria-label",state.paused?"Resume the replay":"Pause the replay");
    if(!state.paused) schedule();
  });
  var replay=el("button","btn","Replay");
  replay.setAttribute("aria-label","Replay from the start");
  replay.addEventListener("click",function(){restart();});
  var theme=el("button","btn","\u263E Dark");
  theme.setAttribute("aria-label","Switch to dark theme");
  theme.addEventListener("click",function(){
    var html=document.documentElement;
    var dark=html.getAttribute("data-theme")!=="dark";
    html.setAttribute("data-theme",dark?"dark":"light");
    theme.textContent=dark?"\u2600 Light":"\u263E Dark";
    theme.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
  });
  ctrls.appendChild(playBtn);ctrls.appendChild(replay);ctrls.appendChild(theme);
  bar.appendChild(hwrap);bar.appendChild(ctrls);
  shell.appendChild(bar);

  var sec=el("section","asq");
  sec.setAttribute("aria-label","Agent sequence diagram");
  var barTop=el("div","asq__bar");
  barTitle=el("p","asq__title",TITLE);
  barTitle.setAttribute("title",TITLE);
  barSum=el("p","asq__sum");
  barTop.appendChild(barTitle);barTop.appendChild(barSum);
  scrollEl=el("div","asq__scroll");
  scrollEl.setAttribute("tabindex","0");
  scrollEl.setAttribute("aria-label","Scrollable sequence diagram");
  canvasEl=el("div","asq__canvas");
  canvasEl.style.setProperty("--n",String(PARTICIPANTS.length));
  headsEl=el("div","asq__heads");
  bodyEl=el("div","asq__body");
  listEl=el("ol","asq__list");
  listEl.setAttribute("aria-label","Messages");
  bodyEl.appendChild(listEl);
  canvasEl.appendChild(headsEl);canvasEl.appendChild(bodyEl);
  scrollEl.appendChild(canvasEl);
  sec.appendChild(barTop);sec.appendChild(scrollEl);
  cardEl=el("div","card");
  cardEl.setAttribute("hidden","");
  cardEl.setAttribute("role","dialog");
  sec.appendChild(cardEl);
  liveEl=el("span","sr");
  liveEl.setAttribute("aria-live","polite");
  sec.appendChild(liveEl);
  var hint=el("p","hint","Hover a message or agent for details \u2014 click to pin. Arrow keys move between messages, Enter opens details, Esc closes.");
  sec.appendChild(hint);
  sec.addEventListener("pointerenter",function(){state.hover=true;});
  sec.addEventListener("pointerleave",function(){state.hover=false;});
  sec.addEventListener("focusin",function(){state.focus=true;});
  sec.addEventListener("focusout",function(){state.focus=false;});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&state.card){closeCard(true);}
  });
  shell.appendChild(sec);
  root.appendChild(shell);
}

function makeMark(p,busy){
  var s=el("span","mark");
  var bits=(p.kind==="person")? [1,1,1,1,1,1,1,1,1] : markBits(p.id);
  if(busy&&p.kind!=="person")s.setAttribute("data-busy","");
  if(p.kind==="person")s.setAttribute("data-person","");
  s.style.setProperty("--c",COLORS[p.id]);
  for(var i=0;i<9;i++){
    var c=el("i",null);
    if(bits[i])c.setAttribute("data-on","");
    if(busy&&p.kind!=="person")c.style.setProperty("animation-delay",TWINKLE[i]+"ms");
    s.appendChild(c);
  }
  return s;
}
function makeTool(p){
  var s=el("span","tooldisc",(p.mono||p.name.slice(0,2)).toUpperCase());
  s.setAttribute("title",p.name);
  return s;
}
function headChip(p,i,n,openActs,running){
  var b=el("button","head");
  b.setAttribute("type","button");
  b.style.left=laneX(i,n);
  b.style.maxWidth="calc((100% - var(--g,40px))/"+n+" - 6px)";
  b.setAttribute("title",p.name);
  b.setAttribute("aria-haspopup","dialog");
  var isOpen=state.card==="agent"&&state.selAgent===p.id;
  if(isOpen)b.setAttribute("data-open","");
  b.setAttribute("aria-expanded",isOpen?"true":"false");
  var working=openActs.indexOf(p.id)>=0&&running;
  if(p.kind==="tool")b.appendChild(makeTool(p));
  else b.appendChild(makeMark(p,working));
  var nm=el("span","nm",p.name);
  b.appendChild(nm);
  b.addEventListener("click",function(){
    if(state.card==="agent"&&state.selAgent===p.id)closeCard(false);
    else{state.selMsg=null;state.selAgent=p.id;openCard();}
  });
  return b;
}
function render(){
  var msgs=MESSAGES.slice(0,state.shown);
  var n=PARTICIPANTS.length;
  var L=layout(msgs,ORDER);
  var acts=activations(L.rows,COLORS,BYID);
  var running=state.shown<MESSAGES.length;
  var openActs=acts.filter(function(a){return a.bottom===null;}).map(function(a){return a.pid;});
  /* heads */
  while(headsEl.firstChild)headsEl.removeChild(headsEl.firstChild);
  for(var i=0;i<n;i++)headsEl.appendChild(headChip(PARTICIPANTS[i],i,n,openActs,running));
  /* clear body extras (keep list) */
  var kids=[];
  for(var kc=0;kc<bodyEl.children.length;kc++)kids.push(bodyEl.children[kc]);
  for(var k=0;k<kids.length;k++){if(kids[k]!==listEl)bodyEl.removeChild(kids[k]);}
  while(listEl.firstChild)listEl.removeChild(listEl.firstChild);
  var H=Math.max(L.height,56)+16;
  bodyEl.style.height=H+"px";
  /* lifelines */
  for(var t=0;t<n;t++){
    var lf=el("i","life");
    lf.style.left=laneX(t,n);lf.style.top="0px";lf.style.height=H+"px";
    lf.setAttribute("aria-hidden","true");
    bodyEl.appendChild(lf);
  }
  /* frames */
  L.frames.forEach(function(f){
    var d=el("span","frame");
    d.style.top=f.top+"px";d.style.height=(f.bottom-f.top)+"px";
    var w=((f.hi-f.lo)/n);
    d.style.left="calc(var(--g,40px) + (100% - var(--g,40px)) * "+((f.lo+0.5)/n)+" - 22px)";
    d.style.width="min(calc((100% - var(--g,40px)) * "+w+" + "+(f.selfAtHi?"50%":"44px")+"), calc(100% - var(--g,40px) - (100% - var(--g,40px)) * "+((f.lo+0.5)/n)+" + 20px))";
    d.setAttribute("aria-hidden","true");
    d.appendChild(el("b",null,f.label));
    bodyEl.appendChild(d);
  });
  /* activations */
  acts.forEach(function(a){
    var d=el("span","busy");
    d.style.setProperty("--c",a.color);
    d.style.left="calc("+laneX(a.lane,n)+" - 3px + "+(a.depth*4)+"px)";
    d.style.top=a.top+"px";
    d.style.height=((a.bottom===null?H+4:a.bottom)-a.top)+"px";
    if(a.bottom===null&&running)d.setAttribute("data-open","");
    d.setAttribute("aria-hidden","true");
    bodyEl.appendChild(d);
  });
  /* messages */
  var dimSet=selectedSet();
  L.rows.forEach(function(r,idx){
    listEl.appendChild(renderRow(r,idx,dimSet));
  });
  renderSummary(L,openActs,running,msgs);
  if(state.card)paintCard();
}
function renderSummary(L,openActs,running,msgs){
  while(barSum.firstChild)barSum.removeChild(barSum.firstChild);
  var total=MESSAGES.length;
  if(running&&openActs.length){
    var rw=el("span","run",openActs.length+(openActs.length===1?" working":" working"));
    barSum.appendChild(rw);
  }else if(!running){
    var fails=MESSAGES.filter(function(m){return m.status==="failed";}).length;
    if(fails)barSum.appendChild(el("span","fail",fails+(fails===1?" failure":" failures")));
  }
  var agents=PARTICIPANTS.filter(function(p){return p.kind!=="person";}).length;
  barSum.appendChild(el("span",null,state.shown+" of "+total+" messages"));
  barSum.appendChild(el("span",null,agents+" agents"));
  if(msgs.length)barSum.appendChild(el("span",null,fmtClock(msgs[msgs.length-1].at)));
  else barSum.appendChild(el("span",null,"0:00"));
  var last=MESSAGES[state.shown-1];
  liveEl.textContent=last?((BYID[last.from]?BYID[last.from].name:last.from)+" to "+(BYID[last.to]?BYID[last.to].name:last.to)+": "+last.label):"";
}
/* ---- player ---- */
function restart(){
  state.shown=0;state.loops=0;state.selMsg=null;state.selAgent=null;state.card=null;
  state.focusIdx=-1;state.paused=false;
  playBtn.textContent="Pause";playBtn.setAttribute("aria-pressed","false");
  cardEl.setAttribute("hidden","");
  render();schedule();
}
function schedule(){
  clearTimers();
  if(state.paused)return;
  if(reduceMotion){
    if(state.shown<MESSAGES.length){state.shown=MESSAGES.length;render();}
    return;
  }
  if(state.shown<MESSAGES.length){
    var wait=REVEAL[state.shown]||800;
    later(function(){
      if(state.paused)return;
      if(state.focus||state.hover){schedule();return;}
      state.shown++;
      render();
      schedule();
    },wait);
  }else{
    later(function(){
      if(state.paused)return;
      if(state.hover||state.focus||state.card){schedule();return;}
      shell.querySelector(".asq").setAttribute("data-fading","");
      later(function(){
        var sec=shell.querySelector(".asq");
        if(sec)sec.removeAttribute("data-fading");
        state.shown=0;state.loops++;
        render();
        schedule();
      },400);
    },HOLD);
  }
}
function selectedSet(){
  if(!state.selMsg)return null;
  var m=null,i;
  for(i=0;i<MESSAGES.length;i++){if(MESSAGES[i].id===state.selMsg){m=MESSAGES[i];break;}}
  if(!m)return null;
  var s={};
  s[m.id]=true;
  if(m.replyTo)s[m.replyTo]=true;
  for(i=0;i<MESSAGES.length;i++){if(MESSAGES[i].replyTo===m.id)s[MESSAGES[i].id]=true;}
  return s;
}
function renderRow(r,idx,dimSet){
  var m=r.m,n=PARTICIPANTS.length;
  var li=document.createElement("li");
  li.className="msg";
  li.setAttribute("data-mid",m.id);
  li.style.top=r.top+"px";
  li.style.height=(r.self?SELF_H:ROW_H)+"px";
  li.style.setProperty("--c",COLORS[m.from]);
  li.setAttribute("tabindex",idx===state.focusIdx?"0":"-1");
  if(m.kind==="reply")li.setAttribute("data-reply","");
  if(m.status)li.setAttribute("data-state",m.status);
  if(dimSet&&!dimSet[m.id])li.setAttribute("data-dim","");
  if(r.self)li.setAttribute("data-self","");
  if(state.card==="msg"&&state.selMsg===m.id)li.setAttribute("data-open","");
  var lbl=m.label+(m.status==="failed"?", failed":"")+(m.status==="waiting"?", waiting for you":"")+", "+fmtClock(m.at);
  li.setAttribute("aria-label",(BYID[m.from]?BYID[m.from].name:m.from)+(r.self?" (note)":" to "+(BYID[m.to]?BYID[m.to].name:m.to))+": "+lbl);
  var t=el("span","time",fmtClock(m.at));
  li.appendChild(t);
  if(r.self){
    var loop=el("span","loop");
    loop.style.left="calc("+laneX(r.a,n)+" + 4px)";
    loop.setAttribute("aria-hidden","true");
    li.appendChild(loop);
    var lab=el("span","label label--self");
    lab.style.left="calc("+laneX(r.a,n)+" + 30px)";
    var tag0=el("span","tag",m.label);
    tag0.setAttribute("title",m.label);
    lab.appendChild(tag0);
    li.appendChild(lab);
  }else{
    var lo=Math.min(r.a,r.b),hi=Math.max(r.a,r.b);
    var lab2=el("span","label");
    lab2.style.left="calc(var(--g,40px) + (100% - var(--g,40px)) * "+(lo/n)+")";
    lab2.style.width="calc((100% - var(--g,40px)) * "+((hi-lo+1)/n)+")";
    var tag=el("span","tag",m.label);
    tag.setAttribute("title",m.label);
    lab2.appendChild(tag);
    li.appendChild(lab2);
    var ar=el("span","arrow");
    var ax=spanX(lo+0.5,hi+0.5,n);
    ar.style.left="calc("+ax.left+" + 4px)";
    ar.style.width="calc("+ax.width+" - 8px)";
    if(r.b<r.a)ar.setAttribute("data-left","");
    ar.setAttribute("aria-hidden","true");
    ar.appendChild(el("i","line"));
    if(m.status==="failed")ar.appendChild(el("span","hd-x","\u00d7"));
    else ar.appendChild(el("span","hd"));
    li.appendChild(ar);
  }
  var dot=el("span","dot");
  dot.style.left="calc("+laneX(r.b,n)+(r.self?"+ 5px":(r.b<r.a?" - 4px":" + 4px"))+")";
  dot.style.top=(r.self?30:ACT_TOP-2)+"px";
  dot.setAttribute("aria-hidden","true");
  li.appendChild(dot);
  li.addEventListener("click",function(){
    state.focusIdx=idx;
    if(state.card==="msg"&&state.selMsg===m.id){closeCard(false);}
    else{state.selMsg=m.id;state.selAgent=null;openCard();}
  });
  li.addEventListener("keydown",function(e){onRowKey(e,idx,m);});
  li.addEventListener("focus",function(){state.focusIdx=idx;});
  return li;
}
function onRowKey(e,idx,m){
  var max=state.shown-1,k=e.key,nm=null;
  if(k==="ArrowDown")nm=Math.min(max,idx+1);
  else if(k==="ArrowUp")nm=Math.max(0,idx-1);
  else if(k==="Home")nm=0;
  else if(k==="End")nm=max;
  else if(k==="Enter"||k===" "){e.preventDefault();state.selMsg=m.id;state.selAgent=null;openCard();return;}
  else if(k==="Escape"){if(state.card)closeCard(true);return;}
  else return;
  e.preventDefault();
  if(nm===null||nm<0)return;
  state.focusIdx=nm;
  var rows=listEl.querySelectorAll(".msg");
  if(rows[nm]&&rows[nm].focus)rows[nm].focus();
}
/* ---- detail card ---- */
function closeCard(refocus){
  var ret=state.card==="msg"?state.selMsg:(state.card==="agent"?state.selAgent:null);
  state.card=null;state.selMsg=null;state.selAgent=null;
  cardEl.setAttribute("hidden","");
  render();
  if(refocus){
    if(ret){
      var rows=listEl.querySelectorAll(".msg");
      for(var i=0;i<rows.length;i++){
        if(rows[i].getAttribute("data-mid")===ret&&rows[i].focus){rows[i].focus();break;}
      }
    }
    if(playBtn&&playBtn.focus&&!ret)playBtn.focus();
  }
}
function openCard(){
  var kind=state.selMsg?"msg":(state.selAgent?"agent":null);
  state.card=kind;
  if(!kind){cardEl.setAttribute("hidden","");render();return;}
  render();
  var btn=cardEl.querySelector(".card-close");
  if(btn&&btn.focus)btn.focus();
}
function paintCard(){
  var kind=state.card;
  if(!kind){cardEl.setAttribute("hidden","");return;}
  while(cardEl.firstChild)cardEl.removeChild(cardEl.firstChild);
  if(kind==="msg")cardEl.appendChild(cardMsg());
  else cardEl.appendChild(cardAgent());
  cardEl.removeAttribute("hidden");
  cardEl.setAttribute("aria-label",kind==="msg"?"Message details":"Participant details");
  /* position: below the row, pinned right; uses only layout numbers */
  var top=54;
  if(kind==="msg"){
    for(var i=0;i<MESSAGES.length&&i<state.shown;i++){
      if(MESSAGES[i].id===state.selMsg){top=54+layout(MESSAGES.slice(0,state.shown),ORDER).rows[i].top+ROW_H+6;break;}
    }
  }
  cardEl.style.top=top+"px";
  cardEl.style.right="12px";
}
function cardShell(){
  var w=el("div",null);
  var top=el("div","card-top");
  w.appendChild(top);
  return {wrap:w,top:top};
}
function closeBtn(){
  var b=el("button","card-close","\u00d7");
  b.setAttribute("type","button");
  b.setAttribute("aria-label","Close details");
  b.addEventListener("click",function(){closeCard(true);});
  return b;
}
function cardMsg(){
  var m=null,i;
  for(i=0;i<MESSAGES.length;i++){if(MESSAGES[i].id===state.selMsg)m=MESSAGES[i];}
  if(!m)return el("div",null);
  var w=cardShell(),from=BYID[m.from],to=BYID[m.to];
  var route=el("span","card-route");
  if(from.kind==="tool")route.appendChild(makeTool(from));else route.appendChild(makeMark(from,false));
  route.appendChild(el("span","card-who",from.name));
  if(from.id!==to.id){
    var arrow=el("span","card-to","\u2192");
    arrow.setAttribute("aria-label","to");
    route.appendChild(arrow);
    if(to.kind==="tool")route.appendChild(makeTool(to));else route.appendChild(makeMark(to,false));
    route.appendChild(el("span","card-who",to.name));
  }
  w.top.appendChild(route);
  w.top.appendChild(closeBtn());
  var col=COLORS[m.from];
  var lab=el("p","card-label",m.label);
  lab.style.setProperty("--c",col);
  w.wrap.appendChild(lab);
  var tags=el("p","card-tags");
  var self=from.id===to.id;
  tags.appendChild(el("span","chip",self?"Note":(m.kind==="reply"?"Reply":"Call")));
  if(m.status==="failed"){var f=el("span","chip","Failed");f.setAttribute("data-tone","fail");tags.appendChild(f);}
  if(m.status==="waiting"){var wq=el("span","chip","Needs you");wq.setAttribute("data-tone","wait");tags.appendChild(wq);}
  if(m.frame){var fr=el("span","chip",m.frame);fr.setAttribute("data-tone","frame");tags.appendChild(fr);}
  w.wrap.appendChild(tags);
  if(m.detail)w.wrap.appendChild(el("pre","card-detail",m.detail));
  var when="Sent "+fmtClock(m.at);
  var rel=null;
  if(m.kind==="reply"&&m.replyTo){
    var prev=null;
    for(i=0;i<MESSAGES.length;i++){if(MESSAGES[i].id===m.replyTo)prev=MESSAGES[i];}
    if(prev)rel="Took "+fmtDur(m.at-prev.at);
  }else if(!self&&m.from!==m.to){
    var ans=null;
    for(i=0;i<MESSAGES.length;i++){if(MESSAGES[i].replyTo===m.id)ans=MESSAGES[i];}
    if(ans)rel="Answered in "+fmtDur(ans.at-m.at);
    else if(state.shown<MESSAGES.length)rel="Waiting for the reply";
  }
  var meta=el("p","card-meta");
  meta.appendChild(el("span",null,when));
  if(rel)meta.appendChild(el("span",null,rel));
  w.wrap.appendChild(meta);
  w.wrap.style.setProperty("--c",col);
  return w.wrap;
}
function cardAgent(){
  var p=BYID[state.selAgent];
  if(!p)return el("div",null);
  var w=cardShell();
  w.top.appendChild(makeMark(p,true));
  var nm=el("p","card-name",p.name);
  nm.setAttribute("title",p.name);
  w.top.appendChild(nm);
  w.top.appendChild(closeBtn());
  var tags=el("p","card-tags");
  tags.appendChild(el("span","chip",p.kind==="person"?"Person":(p.kind==="tool"?"Tool":"Agent")));
  if(p.kind!=="person"){
    var msgs=MESSAGES.slice(0,state.shown);
    var L=layout(msgs,ORDER);
    var acts=activations(L.rows,COLORS,BYID);
    var busy=acts.some(function(a){return a.pid===p.id&&a.bottom===null;});
    var st=el("span","chip",busy?"Working":"Idle");
    if(busy)st.setAttribute("data-tone","run");
    tags.appendChild(st);
  }
  if(p.model){
    var mc=el("span","chip",p.model);
    mc.setAttribute("title",p.model);
    tags.appendChild(mc);
  }
  w.wrap.appendChild(tags);
  if(p.description)w.wrap.appendChild(el("p","card-text",p.description));
  var sent=0,got=0,i;
  for(i=0;i<state.shown;i++){
    var m=MESSAGES[i];
    if(m.from===p.id&&m.to!==p.id)sent++;
    if(m.to===p.id&&m.from!==p.id)got++;
  }
  var stats=el("dl","card-stats");
  function stat(k,v){var d=el("div",null);d.appendChild(el("dt",null,k));d.appendChild(el("dd",null,String(v)));stats.appendChild(d);}
  stat("Sent",sent);
  stat("Received",got);
  if(p.kind!=="person"){
    var msgs2=MESSAGES.slice(0,state.shown);
    var L2=layout(msgs2,ORDER);
    var acts2=activations(L2.rows,COLORS,BYID);
    var calls=acts2.filter(function(a){return a.pid===p.id;}).length;
    var busyMs=0,byId2={};
    msgs2.forEach(function(x){byId2[x.id]=x;});
    var lastAt=msgs2.length?msgs2[msgs2.length-1].at:0;
    acts2.forEach(function(a){
      if(a.pid!==p.id)return;
      var call=byId2[a.key];
      if(!call||!isFinite(call.at))return;
      var endAt=lastAt;
      for(var q=0;q<msgs2.length;q++){
        if(msgs2[q].replyTo===call.id){endAt=msgs2[q].at;break;}
      }
      busyMs+=Math.max(0,endAt-call.at);
    });
    stat(p.kind==="tool"?"Calls":"Tasks",calls);
    if(busyMs>0)stat("Busy",fmtDur(busyMs));
  }
  w.wrap.appendChild(stats);
  return w.wrap;
}
/* ---- boot ---- */
function boot(){
  /* default theme follows the original demo (light); toggle overrides */
  try{
    var dark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    if(dark)document.documentElement.setAttribute("data-theme","dark");
  }catch(e){}
  build();
  render();
  schedule();
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",boot);
}else{
  boot();
}
/* test hooks (no behaviour change) */
window.__asq={
  data:{participants:PARTICIPANTS,messages:MESSAGES,reveal:REVEAL,hold:HOLD},
  fmtClock:fmtClock,fmtDur:fmtDur,markBits:markBits,layout:layout,
  activations:activations,orderOf:orderOf,colorMap:colorMap,
  state:function(){return {shown:state.shown,total:MESSAGES.length,loops:state.loops,paused:state.paused,card:state.card};},
  rowCount:function(){return listEl?listEl.querySelectorAll(".msg").length:0;},
  markCells:function(){
    var out=[],marks=shell.querySelectorAll(".mark");
    for(var i=0;i<marks.length;i++){
      var cells=0;
      for(var j=0;j<marks[i].children.length;j++){
        if(marks[i].children[j].tagName==="I")cells++;
      }
      out.push(cells);
    }
    return out;
  },
  restart:restart
};
})();
</script>
