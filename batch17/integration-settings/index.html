<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>/*noflash*/(function(){try{var k='int-settings-theme';var t=null;try{t=localStorage.getItem(k);}catch(e){} if(!t){try{if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){t='dark';}else{t='light';}}catch(e){t='light';}} document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<meta name="color-scheme" content="light dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopify store — Integration Settings</title>
<style>
:root, html[data-theme="light"]{
  --page:#fafaf9; --surface:#ffffff; --ink:#1c1917; --ink-2:#171717;
  --muted:#78716c; --subtle:#f5f5f4; --tray:#efeeec; --border:#e7e5e4;
  --card:#ffffff; --line:#f0eeeb; --field:#ffffff; --raised:#ffffff; --raised-hover:#f7f6f4;
  --well:#f5f4f2; --well-hover:#edebe8; --hover:rgba(0,0,0,.05);
  --menu:#ffffff; --menu-hover:#f5f5f4; --menu-search:#f5f5f4;
  --accent:#4fb0fe; --accent-ink:#1d6fd1; --focus:rgba(0,96,226,.7);
  --ok:#1e8a4f; --ok-soft:#f3faf6; --ok-ring:#d0eddc;
  --danger:#dc2626; --danger-soft:#fef2f2;
  --amber:#f59e0b; --amber-bg:#fef3c7; --amber-text:#92400e;
  --placeholder:#b5b2ad; --ring:#e2e0dc; --ring-strong:#d4d1cb;
  --track:#d4d4d4; --switch-off:#d9d9d9; --brand:#7AB55C;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --shadow-pop:0 0 0 1px var(--border), 0 14px 36px -10px rgba(0,0,0,.22);
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --ink:#ededed; --ink-2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --tray:#161618; --border:#2e2e33;
  --card:#232326; --line:rgba(255,255,255,.08); --field:#2a2a2d; --raised:#2a2a2d; --raised-hover:#313135;
  --well:#2a2a2d; --well-hover:#313135; --hover:rgba(255,255,255,.06);
  --menu:#2a2a2d; --menu-hover:#313135; --menu-search:#1f1f21;
  --accent:#4fb0fe; --accent-ink:#4fb0fe; --focus:rgba(77,141,255,.8);
  --ok:#3fb971; --ok-soft:rgba(125,207,159,.14); --ok-ring:rgba(125,207,159,.3);
  --danger:#ff6b5f; --danger-soft:rgba(255,107,95,.12);
  --amber:#fbbf24; --amber-bg:#451a03; --amber-text:#fde68a;
  --placeholder:#6b6b70; --ring:rgba(255,255,255,.08); --ring-strong:rgba(255,255,255,.14);
  --track:rgba(255,255,255,.14); --switch-off:#3a3a3e;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-pop:0 0 0 1px rgba(255,255,255,.1), 0 14px 36px -10px rgba(0,0,0,.55);
}
[hidden]{display:none !important}
*{box-sizing:border-box}
html{background:var(--page)}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.page{max-width:600px; margin:0 auto; padding:20px 16px 48px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:2px 2px 12px}
.topbar-title{font-size:13px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; color:var(--muted)}
.theme-toggle{
  display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px;
  border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--ink);
  font:inherit; font-size:13px; cursor:pointer; box-shadow:var(--shadow);
  transition:background-color 150ms ease, transform 150ms ease;
}
.theme-toggle:hover{background:var(--raised-hover)}
.theme-toggle:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.theme-toggle .tt-icon{font-size:14px; line-height:1}
/* ---- component ---- */
.int-card{
  width:100%; max-width:560px; margin:0 auto; background:var(--tray);
  padding:6px; border-radius:calc(var(--radius-lg) + 6px);
  border:1px solid var(--border); box-shadow:var(--shadow); color:var(--ink);
}
.int-head{display:flex; align-items:center; gap:14px; padding:14px 16px 14px 14px}
.int-logo{
  display:grid; place-items:center; flex:none; width:40px; height:40px;
  border-radius:11px; background:var(--raised); overflow:hidden;
  border:1px solid var(--border); box-shadow:0 1px 2px rgba(0,0,0,.04);
  font-size:16px; font-weight:600; color:var(--ink);
}
.int-who{display:grid; flex:1; min-width:0}
.int-name{display:flex; align-items:center; gap:8px; min-width:0; font-size:15px; font-weight:500; line-height:22px}
.int-name-text{min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.int-count{
  flex:none; padding:0 6px; border-radius:6px; background:var(--raised);
  border:1px solid var(--ring); font-size:11.5px; font-weight:500; line-height:18px;
  font-variant-numeric:tabular-nums; color:var(--ink);
}
.int-meta{overflow:hidden; font-size:13px; line-height:19px; white-space:nowrap; text-overflow:ellipsis; color:var(--muted)}
.int-switch{
  position:relative; flex:none; width:40px; height:24px; padding:0; border:0;
  border-radius:999px; background:var(--switch-off); cursor:pointer;
  transition:background-color 200ms ease;
}
.int-switch:hover{filter:brightness(.97)}
.int-switch:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.int-knob{
  position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.18);
  transition:transform 200ms var(--ease); display:block;
}
.int-switch[aria-checked="true"]{background:var(--accent)}
.int-switch[aria-checked="true"] .int-knob{transform:translateX(16px)}
.int-fold{display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:0fr; opacity:0; transition:grid-template-rows 420ms var(--ease), opacity 260ms ease}
.int-fold[data-open]{grid-template-rows:1fr; opacity:1}
.int-fold-inner{min-width:0; min-height:0; overflow:hidden}
.int-fold[data-open] .int-fold-inner{overflow:visible}
.int-body{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:0 1px 2px rgba(0,0,0,.06)}
.int-section{padding:16px 18px 18px}
.int-section + .int-section{border-top:1px solid var(--line)}
.int-label{display:block; margin:0 0 8px; font-size:14px; font-weight:500; line-height:20px}
/* key */
.int-generate{
  display:flex; align-items:center; justify-content:space-between; width:100%; height:42px;
  padding:0 14px; border:0; border-radius:calc(var(--radius) + 1px);
  background:var(--well); color:var(--muted); font:inherit; font-size:14px; text-align:left; cursor:pointer;
  transition:background-color 160ms ease, color 160ms ease;
}
.int-generate:hover:not(:disabled){background:var(--well-hover); color:var(--ink)}
.int-generate:disabled{cursor:progress}
.int-generate .gen-left{display:flex; align-items:center; gap:10px}
.int-keyrow{
  display:flex; align-items:center; gap:4px; height:42px; padding:0 6px 0 14px;
  border-radius:calc(var(--radius) + 1px); background:var(--well);
}
.int-keyrow[data-new]{background:var(--ok-soft); box-shadow:inset 0 0 0 1px var(--ok-ring)}
.int-keycode{
  flex:1; min-width:0; overflow:hidden; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px; white-space:nowrap; text-overflow:ellipsis; color:var(--ink);
}
.int-mini{
  display:grid; place-items:center; flex:none; width:30px; height:30px; padding:0; border:0;
  border-radius:7px; background:transparent; color:var(--muted); cursor:pointer;
  transition:background-color 140ms ease, color 140ms ease;
}
.int-mini:hover{background:var(--hover); color:var(--ink)}
.int-mini:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.int-regen{
  display:grid; place-items:center; min-width:92px; height:30px; margin-left:2px; padding:0 10px;
  border:1px solid var(--border); border-radius:7px; background:var(--raised);
  font:inherit; font-size:12.5px; font-weight:500; cursor:pointer; color:var(--ink);
}
.int-regen:hover:not(:disabled){background:var(--raised-hover)}
.int-regen:disabled{cursor:progress; opacity:.7}
.int-note{margin:8px 0 0; font-size:12.5px; color:var(--ok)}
/* site field */
.int-field{
  display:flex; align-items:center; gap:4px; width:100%; height:42px; padding:0 14px;
  border:0; border-radius:calc(var(--radius) + 1px); background:var(--field);
  box-shadow:0 0 0 1px var(--ring), 0 1px 2px rgba(0,0,0,.03);
  transition:box-shadow 160ms ease; text-align:left; font:inherit;
}
button.int-field{cursor:pointer}
button.int-field:hover{box-shadow:0 0 0 1px var(--ring-strong), 0 1px 2px rgba(0,0,0,.03)}
.int-field:focus-within{box-shadow:0 0 0 1px var(--muted), 0 1px 2px rgba(0,0,0,.03)}
.int-field[data-invalid]{box-shadow:0 0 0 1px var(--danger), 0 0 0 4px rgba(220,38,38,.1)}
html[data-theme="dark"] .int-field[data-invalid]{box-shadow:0 0 0 1px var(--danger), 0 0 0 4px rgba(255,107,95,.16)}
.int-prefix{font-size:14px; color:var(--placeholder); flex:none}
.int-input{flex:1; min-width:0; height:100%; border:0; outline:none; background:transparent; font:inherit; font-size:14px; color:var(--ink)}
.int-input::placeholder{color:var(--placeholder)}
.int-ok{display:grid; color:var(--ok); flex:none}
.int-hint{margin:8px 0 0; font-size:13px; line-height:18px; color:var(--muted); overflow-wrap:anywhere}
.int-hint[data-error]{color:var(--danger)}
/* zone */
.int-zone{position:relative}
.int-zone-value{min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:14px}
.int-zone-btn{justify-content:space-between; gap:8px}
.int-zone-btn .chev{flex:none; color:var(--muted)}
.int-menu{
  position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:10; padding:6px;
  border-radius:calc(var(--radius-lg) - 2px); background:var(--menu); box-shadow:var(--shadow-pop);
  border:1px solid var(--border);
}
.int-menu-search{
  width:100%; height:34px; margin-bottom:4px; padding:0 10px; border:0; border-radius:9px;
  outline:none; background:var(--menu-search); font:inherit; font-size:13px; color:var(--ink);
}
.int-menu-search::placeholder{color:var(--placeholder)}
.int-menu-list{display:grid; gap:2px; max-height:200px; overflow-y:auto; scrollbar-width:thin}
.int-option{
  display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:32px;
  padding:4px 10px; border:0; border-radius:7px; background:transparent;
  font:inherit; font-size:13px; text-align:left; cursor:pointer; color:var(--ink);
}
.int-option:hover{background:var(--menu-hover)}
.int-option[aria-selected="true"]{color:var(--accent-ink); font-weight:500}
.int-option .opt-check{flex:none; display:grid}
.int-menu-empty{margin:0; padding:12px 10px; font-size:13px; color:var(--muted)}
/* save bar */
.int-save{display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:0fr; transition:grid-template-rows 360ms var(--ease)}
.int-save[data-open]{grid-template-rows:1fr}
.int-save-inner{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:0; overflow:hidden; padding:0 8px 0 18px; font-size:13px; color:var(--ink)}
.int-save[data-open] .int-save-inner{padding-top:8px; padding-bottom:8px}
.int-save-actions{display:flex; gap:6px}
.int-btn{
  height:32px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--raised); font:inherit; font-size:13px; font-weight:500; cursor:pointer; color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.04); transition:background-color 150ms ease;
}
.int-btn:hover{background:var(--raised-hover)}
.int-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.int-btn--primary{background:linear-gradient(#323137,#201e25); border-color:#0d0d0d; color:#fff; box-shadow:0 2px 4px rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.12)}
.int-btn--primary:hover{background:linear-gradient(#3b3a41,#26242b)}
.int-btn--primary:disabled{opacity:.5; cursor:default}
html[data-theme="dark"] .int-btn--primary{background:linear-gradient(#f4f4f5,#e4e4e7); border-color:rgba(0,0,0,.6); color:#121213}
html[data-theme="dark"] .int-btn--primary:hover{background:linear-gradient(#ffffff,#ececef)}
.int-spinner{width:14px; height:14px; border:1.5px solid var(--track); border-top-color:var(--ink); border-radius:50%; animation:int-spin 700ms linear infinite; display:inline-block}
@keyframes int-spin{to{transform:rotate(360deg)}}
@keyframes int-in{from{opacity:0; transform:translateY(2px)}}
@keyframes int-drop{from{opacity:0; transform:translateY(-4px) scale(.98)}}
.int-anim-in{animation:int-in 240ms var(--ease)}
.int-menu{animation:int-drop 180ms var(--ease)}
button:focus-visible, input:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.int-field input:focus-visible, .int-menu-search:focus-visible{outline:none}
@media (prefers-reduced-motion: reduce){
  .int-fold,.int-save,.int-switch,.int-knob{transition:none}
  .int-menu,.int-anim-in{animation:none}
  .int-spinner{animation-duration:1400ms}
}
@media (max-width:480px){ .page{padding:12px 10px 40px} .int-head{padding:12px} .int-section{padding:14px} }
.page-foot{margin:14px 4px 0; font-size:12px; color:var(--muted)}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <span class="topbar-title">Integration Settings</span>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme"><span class="tt-icon" id="themeIcon" aria-hidden="true">☾</span><span id="themeLabel">Dark</span></button>
  </div>
  <div id="app"></div>
  <p class="page-foot">Demo replica — settings card for a connected service with switch, API key, address and save bar. No network calls.</p>
</div>
<script>
(function(){
"use strict";
var SERVICE_NAME = "Shopify store";
var SERVICE_COUNT = 128;
var SERVICE_META = "Connected on March 4, 2026 at 09:12";
var SITE_HINT = "Your store\u2019s primary domain from Settings \u203A Domains";
var DEFAULT_SITE = "lumen-studio.com";
var DEFAULT_TZ = "(GMT +01:00) Berlin";
var ZONES = [
  "(GMT \u221208:00) Los Angeles",
  "(GMT \u221205:00) New York",
  "(GMT \u221203:00) S\u00E3o Paulo",
  "(GMT +00:00) London",
  "(GMT +01:00) Berlin",
  "(GMT +01:00) Amsterdam",
  "(GMT +01:00) Warsaw",
  "(GMT +02:00) Athens",
  "(GMT +04:00) Dubai",
  "(GMT +05:30) Mumbai",
  "(GMT +08:00) Singapore",
  "(GMT +09:00) Tokyo",
  "(GMT +10:00) Sydney"
];
var DOMAIN_RE = /^(?!-)[\p{L}\p{N}-]+(\.[\p{L}\p{N}-]+)*\.\p{L}{2,}$/iu;
var ERR_TEXT = "That doesn\u2019t look like a domain \u2013 try something like yourstore.com";
var PAUSED_TEXT = "Paused \u2013 no data is synced";

function stripProtocol(v){ return String(v == null ? "" : v).replace(/^https?:\/\//i, ""); }
function normaliseSite(v){
  var s = String(v == null ? "" : v).trim();
  s = s.replace(/^https?:\/\//i, "");
  s = s.replace(/\/+$/, "");
  return s;
}
function firstInitial(name){
  try{
    var m = String(name).match(/[\p{L}\p{N}]/u);
    return m ? m[0].toUpperCase() : "?";
  }catch(e){ return String(name).charAt(0).toUpperCase() || "?"; }
}
function maskedKey(k){
  if(!k) return "";
  if(k.length < 16) return "\u2022".repeat(14);
  return k.slice(0, 8) + "\u2022".repeat(14) + k.slice(-4);
}
function randomKey(){
  var bytes = new Uint8Array(16);
  try{
    if(window.crypto && window.crypto.getRandomValues){ window.crypto.getRandomValues(bytes); }
    else { for(var i=0;i<16;i++) bytes[i] = Math.floor(Math.random()*256); }
  }catch(e){ for(var j=0;j<16;j++) bytes[j] = Math.floor(Math.random()*256); }
  var hex = "";
  for(var k=0;k<bytes.length;k++){ var h = bytes[k].toString(16); if(h.length<2) h = "0"+h; hex += h; }
  return "sk_live_" + hex;
}

/* ---------- theme toggle (page-level) ---------- */
var THEME_KEY = "int-settings-theme";
function currentTheme(){ return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
var themeToggle = document.getElementById("themeToggle");
var themeIcon = document.getElementById("themeIcon");
var themeLabel = document.getElementById("themeLabel");
function paintThemeButton(){
  var t = currentTheme();
  if(t === "dark"){ themeToggle.setAttribute("aria-label", "Switch to light theme"); themeIcon.textContent = "\u2600"; themeLabel.textContent = "Light"; }
  else { themeToggle.setAttribute("aria-label", "Switch to dark theme"); themeIcon.textContent = "\u262A"; themeLabel.textContent = "Dark"; }
}
if(themeToggle){
  paintThemeButton();
  themeToggle.addEventListener("click", function(){
    var next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
    paintThemeButton();
  });
}

/* ---------- component state ---------- */
var saved = { enabled:true, siteUrl:DEFAULT_SITE, timeZone:DEFAULT_TZ, apiKey:null };
var draft = { enabled:true, siteUrl:DEFAULT_SITE, timeZone:DEFAULT_TZ, apiKey:null };
var ui = { busy:false, saving:false, showFull:false, copied:false, menuOpen:false, filter:"" };
var copyTimer = null;

/* ---------- helpers to build DOM (once) ---------- */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.setAttribute("class", cls);
  if(text != null) n.textContent = text;
  return n;
}
function svgIcon(kind, size){
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("width", String(size || 16));
  svg.setAttribute("height", String(size || 16));
  svg.setAttribute("aria-hidden", "true");
  var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  if(kind === "check"){ p.setAttribute("d", "m3.5 8.5 3 3 6-7"); svg.setAttribute("fill","none"); svg.setAttribute("stroke","currentColor"); svg.setAttribute("stroke-width","1.4"); svg.setAttribute("stroke-linecap","round"); svg.setAttribute("stroke-linejoin","round"); }
  else if(kind === "copy"){ p.setAttribute("d", "M5.5 5.5V3.5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M3.5 5.5h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"); svg.setAttribute("fill","none"); svg.setAttribute("stroke","currentColor"); svg.setAttribute("stroke-width","1.4"); svg.setAttribute("stroke-linecap","round"); svg.setAttribute("stroke-linejoin","round"); }
  else if(kind === "copied"){ p.setAttribute("d", "m3.5 8.5 3 3 6-7"); svg.setAttribute("fill","none"); svg.setAttribute("stroke","currentColor"); svg.setAttribute("stroke-width","1.4"); svg.setAttribute("stroke-linecap","round"); svg.setAttribute("stroke-linejoin","round"); }
  else if(kind === "eye"){ p.setAttribute("d", "M2 8s2.2-4.5 6-4.5S14 8 14 8s-2.2 4.5-6 4.5S2 8 2 8ZM8 9.8a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Z"); svg.setAttribute("fill","none"); svg.setAttribute("stroke","currentColor"); svg.setAttribute("stroke-width","1.4"); svg.setAttribute("stroke-linecap","round"); svg.setAttribute("stroke-linejoin","round"); }
  else if(kind === "eyeoff"){ p.setAttribute("d", "M2 8s2.2-4.5 6-4.5S14 8 14 8s-2.2 4.5-6 4.5S2 8 2 8ZM2.5 2.5l11 11"); svg.setAttribute("fill","none"); svg.setAttribute("stroke","currentColor"); svg.setAttribute("stroke-width","1.4"); svg.setAttribute("stroke-linecap","round"); svg.setAttribute("stroke-linejoin","round"); }
  else if(kind === "key"){ p.setAttribute("d", "M10.5 1.5a4 4 0 0 0-3.86 5.05L1.8 11.4a1 1 0 0 0-.3.7v1.9a.5.5 0 0 0 .5.5h1.9a.5.5 0 0 0 .5-.5V13h1v-1h1v-1l.95-.95A4 4 0 1 0 10.5 1.5Zm1 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"); svg.setAttribute("fill","currentColor"); svg.setAttribute("stroke","none"); }
  svg.appendChild(p);
  return svg;
}
function brandMark(){
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "22");
  svg.setAttribute("height", "22");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("fill", "#7AB55C");
  var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", "M7 8h10l-1 12H8L7 8Zm2.5 0a2.5 2.5 0 0 1 5 0h-5Z");
  var p2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p2.setAttribute("d", "M9.5 8a2.5 2.5 0 0 1 5 0");
  p2.setAttribute("fill", "none");
  p2.setAttribute("stroke", "#7AB55C");
  p2.setAttribute("stroke-width", "1.6");
  svg.appendChild(p);
  return svg;
}
function clockIcon(){
  var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("width", "16");
  svg.setAttribute("height", "16");
  svg.setAttribute("aria-hidden", "true");
  var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  c.setAttribute("cx", "8"); c.setAttribute("cy", "8"); c.setAttribute("r", "6.5");
  c.setAttribute("fill", "var(--muted)");
  var hands = document.createElementNS("http://www.w3.org/2000/svg", "path");
  hands.setAttribute("d", "M8 4.5V8h3");
  hands.setAttribute("fill", "none");
  hands.setAttribute("stroke", "var(--field)");
  hands.setAttribute("stroke-width", "1.5");
  hands.setAttribute("stroke-linecap", "round");
  hands.setAttribute("stroke-linejoin", "round");
  svg.appendChild(c); svg.appendChild(hands);
  return svg;
}

/* ---------- in-place render functions (DOM built once; timers only touch text/class/attrs) ---------- */
function isDirty(){
  return draft.siteUrl !== saved.siteUrl || draft.timeZone !== saved.timeZone || draft.apiKey !== saved.apiKey;
}
function currentClean(){ return normaliseSite(draft.siteUrl); }
function currentValid(){ var r = currentClean(); return r === "" || DOMAIN_RE.test(r); }

function renderHead(){
  switchBtn.setAttribute("aria-checked", draft.enabled ? "true" : "false");
  if(draft.enabled){ fold.setAttribute("data-open", ""); metaEl.textContent = SERVICE_META; metaEl.setAttribute("title", SERVICE_META); }
  else { fold.removeAttribute("data-open"); metaEl.textContent = PAUSED_TEXT; metaEl.removeAttribute("title"); }
  try{ fold.toggleAttribute("inert", !draft.enabled); }catch(e){ if(!draft.enabled) fold.setAttribute("inert",""); else fold.removeAttribute("inert"); }
}
function renderKey(){
  var has = !!draft.apiKey;
  genBtn.hidden = has;
  keyRow.hidden = !has;
  if(!has){
    genText.textContent = ui.busy ? "Generating\u2026" : "Generate a new API key";
    genBtn.disabled = ui.busy;
    genSpinHost.textContent = "";
    while(genSpinHost.firstChild) genSpinHost.removeChild(genSpinHost.firstChild);
    if(ui.busy){ var s = el("span", "int-spinner"); s.setAttribute("aria-hidden","true"); genSpinHost.appendChild(s); }
    noteEl.hidden = true;
  } else {
    keyCode.textContent = ui.showFull ? draft.apiKey : maskedKey(draft.apiKey);
    if(ui.showFull) keyRow.setAttribute("data-new", ""); else keyRow.removeAttribute("data-new");
    eyeBtn.setAttribute("aria-label", ui.showFull ? "Hide key" : "Show key");
    while(eyeBtn.firstChild) eyeBtn.removeChild(eyeBtn.firstChild);
    eyeBtn.appendChild(svgIcon(ui.showFull ? "eyeoff" : "eye", 15));
    while(copyBtn.firstChild) copyBtn.removeChild(copyBtn.firstChild);
    copyBtn.appendChild(svgIcon(ui.copied ? "copied" : "copy", 15));
    while(regenBtn.firstChild) regenBtn.removeChild(regenBtn.firstChild);
    if(ui.busy){ var s2 = el("span", "int-spinner"); s2.setAttribute("aria-hidden","true"); regenBtn.appendChild(s2); regenBtn.disabled = true; }
    else { regenBtn.textContent = "Regenerate"; regenBtn.disabled = false; }
    if(ui.showFull){
      noteEl.hidden = false;
      noteEl.textContent = ui.copied ? "Copied to the clipboard." : "Copy it now \u2013 it is shown in full only once.";
    } else noteEl.hidden = true;
  }
}
function renderSite(){
  if(document.activeElement !== siteInput && siteInput.value !== draft.siteUrl) siteInput.value = draft.siteUrl;
  var r = currentClean();
  var valid = currentValid();
  if(!valid) field.setAttribute("data-invalid", ""); else field.removeAttribute("data-invalid");
  siteInput.setAttribute("aria-invalid", valid ? "false" : "true");
  var showOk = r !== "" && valid;
  okWrap.hidden = !showOk;
  if(!okWrap.hidden && !okWrap.classList.contains("int-anim-in")){ okWrap.setAttribute("class", "int-ok int-anim-in"); }
  if(valid){ hintEl.removeAttribute("data-error"); hintEl.textContent = SITE_HINT; }
  else { hintEl.setAttribute("data-error", ""); hintEl.textContent = ERR_TEXT; }
}
function renderZone(){
  zoneValue.textContent = draft.timeZone;
  zoneValue.setAttribute("title", draft.timeZone);
  zoneBtn.setAttribute("aria-expanded", ui.menuOpen ? "true" : "false");
  menu.hidden = !ui.menuOpen;
  if(!ui.menuOpen) return;
  var q = ui.filter.trim().toLowerCase();
  var visible = 0;
  optionBtns.forEach(function(b){
    var z = b.getAttribute("data-zone");
    var hit = q === "" || z.toLowerCase().indexOf(q) !== -1;
    b.hidden = !hit;
    if(hit) visible++;
    var sel = z === draft.timeZone;
    b.setAttribute("aria-selected", sel ? "true" : "false");
    var chk = b.querySelector ? null : null;
    var checkHost = b.childNodes && b.childNodes[1];
    if(checkHost){
      while(checkHost.firstChild) checkHost.removeChild(checkHost.firstChild);
      if(sel) checkHost.appendChild(svgIcon("check", 14));
    }
  });
  emptyMsg.hidden = visible !== 0;
}
function renderSave(){
  var dirty = isDirty();
  if(dirty) saveBar.setAttribute("data-open", ""); else saveBar.removeAttribute("data-open");
  try{ saveBar.toggleAttribute("inert", !dirty); }catch(e){ if(!dirty) saveBar.setAttribute("inert",""); else saveBar.removeAttribute("inert"); }
  var valid = currentValid();
  saveBtn.disabled = !valid || ui.saving;
  saveBtn.textContent = ui.saving ? "Saving\u2026" : "Save";
}
function renderAll(){ renderHead(); renderKey(); renderSite(); renderZone(); renderSave(); }

/* ---------- actions ---------- */
function doGenerate(){
  if(ui.busy) return;
  ui.busy = true; renderKey();
  window.setTimeout(function(){
    var k = randomKey();
    draft.apiKey = k; ui.showFull = true; ui.copied = false; ui.busy = false;
    renderKey(); renderSave();
  }, 700);
}
function doCopy(){
  if(!draft.apiKey) return;
  function done(){
    ui.copied = true; renderKey();
    if(copyTimer) window.clearTimeout(copyTimer);
    copyTimer = window.setTimeout(function(){ ui.copied = false; renderKey(); }, 1400);
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      var p = navigator.clipboard.writeText(draft.apiKey);
      if(p && p.then) p.then(done, done); else done();
    } else done();
  }catch(e){ done(); }
}
function openMenu(){
  if(!draft.enabled || ui.menuOpen) return;
  ui.menuOpen = true; ui.filter = ""; searchInput.value = "";
  renderZone();
  try{ searchInput.focus({preventScroll:true}); }catch(e){ try{searchInput.focus();}catch(_){} }
}
function closeMenu(){ if(!ui.menuOpen) return; ui.menuOpen = false; renderZone(); try{ zoneBtn.focus({preventScroll:true}); }catch(e){} }

/* ---------- events (bound once) ---------- */
switchBtn.addEventListener("click", function(){
  var next = !draft.enabled;
  draft.enabled = next;
  saved.enabled = next;
  try{ if(typeof window.__onToggle === "function") window.__onToggle(next); }catch(e){}
  renderHead(); renderSave();
  if(!next) closeMenu();
});
genBtn.addEventListener("click", doGenerate);
regenBtn.addEventListener("click", doGenerate);
eyeBtn.addEventListener("click", function(){ ui.showFull = !ui.showFull; renderKey(); });
copyBtn.addEventListener("click", doCopy);
siteInput.addEventListener("input", function(){
  draft.siteUrl = stripProtocol(siteInput.value);
  if(siteInput.value !== draft.siteUrl) siteInput.value = draft.siteUrl;
  renderSite(); renderSave();
});
/* Open popover on pointerdown/mousedown capture so real clicks survive outside-close */
function zoneToggleCapture(e){
  if(e && e.button != null && e.button !== 0 && e.type !== "click") return;
  if(ui.menuOpen){ /* let window-capture close? no: inside click keeps open; toggle closed */ }
  e.stopPropagation();
  if(ui.menuOpen) closeMenu(); else openMenu();
  if(e.cancelable && e.type === "mousedown") e.preventDefault();
}
zoneBtn.addEventListener("pointerdown", zoneToggleCapture, true);
zoneBtn.addEventListener("mousedown", function(e){
  if(typeof window.PointerEvent !== "undefined" && e instanceof window.PointerEvent) return;
  zoneToggleCapture(e);
}, true);
zoneBtn.addEventListener("click", function(e){
  /* keyboard activation (no pointer) toggles; pointer clicks already handled on pointerdown */
  if(e.detail === 0){ if(ui.menuOpen) closeMenu(); else openMenu(); }
});
window.addEventListener("pointerdown", function(e){
  if(!ui.menuOpen) return;
  try{ if(zone.contains(e.target)) return; }catch(_){ return; }
  closeMenu();
}, true);
window.addEventListener("mousedown", function(e){
  if(!ui.menuOpen) return;
  if(typeof window.PointerEvent !== "undefined") return;
  try{ if(zone.contains(e.target)) return; }catch(_){ return; }
  closeMenu();
}, true);
window.addEventListener("keydown", function(e){
  if(e.key === "Escape" && ui.menuOpen){ e.stopPropagation(); closeMenu(); }
});
searchInput.addEventListener("input", function(){ ui.filter = searchInput.value; renderZone(); });
optionBtns.forEach(function(b){
  b.addEventListener("click", function(){
    draft.timeZone = b.getAttribute("data-zone");
    ui.menuOpen = false;
    renderZone(); renderSave();
    try{ zoneBtn.focus({preventScroll:true}); }catch(e){ try{zoneBtn.focus();}catch(_){} }
  });
});
discardBtn.addEventListener("click", function(){
  draft.siteUrl = saved.siteUrl; draft.timeZone = saved.timeZone; draft.apiKey = saved.apiKey;
  ui.copied = false;
  renderKey(); renderSite(); renderZone(); renderSave();
});
saveBtn.addEventListener("click", function(){
  if(!currentValid() || ui.saving) return;
  ui.saving = true; renderSave();
  var payload = { enabled:draft.enabled, siteUrl:currentClean(), timeZone:draft.timeZone, apiKey:draft.apiKey };
  window.setTimeout(function(){
    draft.siteUrl = payload.siteUrl;
    saved.siteUrl = payload.siteUrl; saved.timeZone = payload.timeZone; saved.apiKey = payload.apiKey; saved.enabled = payload.enabled;
    ui.saving = false;
    renderSite(); renderZone(); renderSave();
  }, 450);
});

renderAll();

/* test hooks (no behaviour change) */
try{
  window.__integration = {
    els:{ section:section, head:head, logo:logo, nameText:nameText, count:count, metaEl:metaEl,
      switchBtn:switchBtn, fold:fold, genBtn:genBtn, genText:genText, keyRow:keyRow, keyCode:keyCode,
      eyeBtn:eyeBtn, copyBtn:copyBtn, regenBtn:regenBtn, noteEl:noteEl,
      siteInput:siteInput, field:field, hintEl:hintEl, okWrap:okWrap,
      zoneBtn:zoneBtn, zoneValue:zoneValue, menu:menu, searchInput:searchInput, listBox:listBox,
      optionBtns:optionBtns, emptyMsg:emptyMsg, saveBar:saveBar, saveBtn:saveBtn, discardBtn:discardBtn,
      themeToggle:themeToggle },
    get saved(){ return saved; },
    get draft(){ return draft; },
    get ui(){ return ui; },
    actions:{ generate:doGenerate, copy:doCopy, openMenu:openMenu, closeMenu:closeMenu, renderAll:renderAll }
  };
}catch(e){}
})();
</script>
