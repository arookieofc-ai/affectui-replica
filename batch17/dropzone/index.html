metaText=fmtProg(file.size*file.progress,file.size)+" \u00b7 "+left;
}
if(row.metaText!==metaText&&st!=="error"&&st!=="done"){row.metaText=metaText;while(row.metaEl.firstChild)row.metaEl.removeChild(row.metaEl.firstChild);if(st==="uploading"){var a=document.createTextNode(fmtProg(file.size*file.progress,file.size));row.metaEl.appendChild(a);var d=document.createElement("span");d.setAttribute("class","ui-dz__dot");d.textContent="\u00b7";row.metaEl.appendChild(d);var b=document.createTextNode(file.progress<0.04?"starting":fmtLeft((1-file.progress)*(now()-file.startedAt)/Math.max(0.05,file.progress)/1000));row.metaEl.appendChild(b);}}
if(st==="done"){var ds=fmtSize(file.size);if(row.metaText!==ds){row.metaText=ds;while(row.metaEl.firstChild)row.metaEl.removeChild(row.metaEl.firstChild);row.metaEl.appendChild(document.createTextNode(ds));}}
if(st==="error"){var em=file.error||"Upload failed";if(row.metaText!==("E:"+em)){row.metaText="E:"+em;while(row.metaEl.firstChild)row.metaEl.removeChild(row.metaEl.firstChild);var es=document.createElement("span");es.setAttribute("class","ui-dz__error");try{es.setAttribute("dir","auto");}catch(e){}es.textContent=em;row.metaEl.appendChild(es);}}
var showBar=(st!=="done")&&(st!=="error"||!!file.retryable);
if(showBar&&row.barWrap.hasAttribute("data-hidden"))row.barWrap.removeAttribute("data-hidden");
if(!showBar&&!row.barWrap.hasAttribute("data-hidden"))row.barWrap.setAttribute("data-hidden","true");
var pct=Math.round(clamp01(file.progress)*100);
if(row.barNow!==pct){row.barNow=pct;try{row.barWrap.setAttribute("aria-valuenow",String(pct));}catch(e){}try{row.barWrap.setAttribute("aria-label",file.name+" upload");}catch(e){}}
var tx="scaleX("+clamp01(file.progress)+")";
if(row.barTx!==tx){row.barTx=tx;row.barFill.style.transform=tx;}
var wantRetry=(st==="error"&&!!file.retryable);
if(wantRetry&&row.retryBtn.hasAttribute("hidden"))row.retryBtn.removeAttribute("hidden");
if(!wantRetry&&!row.retryBtn.hasAttribute("hidden"))row.retryBtn.setAttribute("hidden","");
try{row.retryBtn.setAttribute("aria-label","Retry "+file.name);}catch(e){}
try{row.removeBtn.setAttribute("aria-label","Remove "+file.name);}catch(e){}
}
function createRow(file){
var li=document.createElement("li");li.setAttribute("class","ui-dz__row");li.setAttribute("data-status",file.status);
var inner=document.createElement("div");inner.setAttribute("class","ui-dz__row-inner");li.appendChild(inner);
inner.appendChild(badge(file.name,false));
var info=document.createElement("div");info.setAttribute("class","ui-dz__info");inner.appendChild(info);
var line=document.createElement("div");line.setAttribute("class","ui-dz__line");info.appendChild(line);
var nm=document.createElement("span");nm.setAttribute("class","ui-dz__name");try{nm.setAttribute("dir","auto");}catch(e){}nm.textContent=file.name;try{nm.setAttribute("title",file.name);}catch(e){}line.appendChild(nm);
var doneWrap=document.createElement("span");doneWrap.setAttribute("class","ui-dz__done");try{doneWrap.setAttribute("aria-label","Uploaded");}catch(e){}doneWrap.appendChild(glyph(ICONS.check));doneWrap.setAttribute("hidden","");line.appendChild(doneWrap);
var meta=document.createElement("div");meta.setAttribute("class","ui-dz__meta");info.appendChild(meta);
var bar=document.createElement("div");bar.setAttribute("class","ui-dz__bar");try{bar.setAttribute("role","progressbar");}catch(e){}try{bar.setAttribute("aria-label",file.name+" upload");bar.setAttribute("aria-valuemin","0");bar.setAttribute("aria-valuemax","100");bar.setAttribute("aria-valuenow","0");}catch(e){}info.appendChild(bar);
var fill=document.createElement("span");fill.style.transform="scaleX(0)";bar.appendChild(fill);
var acts=document.createElement("div");acts.setAttribute("class","ui-dz__actions");inner.appendChild(acts);
var retry=document.createElement("button");retry.setAttribute("type","button");retry.setAttribute("class","ui-dz__icon-btn");try{retry.setAttribute("aria-label","Retry "+file.name);}catch(e){}retry.appendChild(glyph(ICONS.retry));retry.setAttribute("hidden","");acts.appendChild(retry);
var rem=document.createElement("button");rem.setAttribute("type","button");rem.setAttribute("class","ui-dz__icon-btn");try{rem.setAttribute("aria-label","Remove "+file.name);}catch(e){}rem.appendChild(glyph(ICONS.close));acts.appendChild(rem);
retry.addEventListener("click",function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();doRetry(file.id);});
rem.addEventListener("click",function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();doRemove(file.id);});
var row={li:li,nameEl:nm,headEl:null,tailEl:null,isSplit:null,doneWrap:doneWrap,metaEl:meta,metaText:null,barWrap:bar,barFill:fill,barNow:-1,barTx:null,retryBtn:retry,removeBtn:rem,fid:file.id};
patchRow(row,file);
return row;
}
var rows={};
function syncList(){
var seen={};
for(var i=0;i<files.length;i++){var f=files[i];seen[f.id]=1;var r=rows[f.id];if(!r){r=createRow(f);rows[f.id]=r;list.appendChild(r.li);}else{patchRow(r,f);}}
for(var k in rows){if(!seen[k]){var n=rows[k].li;try{if(n.parentNode===list)list.removeChild(n);}catch(e){}delete rows[k];}}
}
var lastFoot="", lastTitle="", lastHdr="";
function syncChrome(){
var vis=files.filter(function(f){return !f.removing;});
var up=vis.filter(function(f){return f.status==="uploading";});
var dn=vis.filter(function(f){return f.status==="done";});
var er=vis.filter(function(f){return f.status==="error";});
var footText, showClear=false;
if(!vis.length){footText="No files yet";}
else if(up.length){
var tot=0,got=0;for(var i=0;i<up.length;i++){tot+=up[i].size;got+=up[i].size*up[i].progress;}
footText="Uploading "+numFmt.format(up.length)+" of "+numFmt.format(vis.length)+" \u00b7 "+fmtProg(got,tot);
}else{
showClear=(dn.length>0||er.length>0);
if(er.length){footText=numFmt.format(dn.length)+" of "+numFmt.format(vis.length)+" uploaded";}
else{footText=numFmt.format(dn.length)+" "+(dn.length===1?"file":"files")+" uploaded";}
}
if(lastFoot!==footText){lastFoot=footText;while(foot.firstChild)foot.removeChild(foot.firstChild);
if(!vis.length){foot.textContent=footText;}
else if(up.length){foot.textContent=footText;}
else{var s=document.createElement("span");s.setAttribute("class","ui-dz__summary-done");var ic=glyph(er.length?ICONS.alert:ICONS.check,er.length?"ui-dz__warn":"ui-dz__ok");s.appendChild(ic);s.appendChild(document.createTextNode(footText));foot.appendChild(s);}
}
var showC=(!up.length&&(dn.length>0||er.length>0));
if(showC&&clearBtn.hasAttribute("hidden"))clearBtn.removeAttribute("hidden");
if(!showC&&!clearBtn.hasAttribute("hidden"))clearBtn.setAttribute("hidden","");
var titleText=dragCount>0?("Release to upload "+(dragCount===1?"1 file":numFmt.format(dragCount)+" files")):"idle-browse";
if(lastTitle!==titleText){lastTitle=titleText;
if(dragCount>0){while(titleEl.firstChild)titleEl.removeChild(titleEl.firstChild);titleEl.appendChild(document.createTextNode(titleText));try{area.setAttribute("data-dragging","true");}catch(e){}}
else{try{area.removeAttribute("data-dragging");}catch(e){}if(!mouseSpan||!mouseSpan.parentNode){while(titleEl.firstChild)titleEl.removeChild(titleEl.firstChild);if(mouseSpan&&touchSpan){titleEl.appendChild(mouseSpan);titleEl.appendChild(touchSpan);}else{titleEl.textContent="Drop files here or browse";}}}}
var hdr=footText;
if(lastHdr!==hdr){lastHdr=hdr;hdrCounts.textContent=hdr;if(hdrDot){if(up.length){if(hdrDot.getAttribute("class")!=="dotlive")hdrDot.setAttribute("class","dotlive");}else{if(hdrDot.getAttribute("class")!=="dotlive idle")hdrDot.setAttribute("class","dotlive idle");}}}
}
function render(){syncList();syncChrome();}
function addEntry(info){
var name=info.name||"file", size=clampSize(info.size);
var ext=extOf(name);
var allowed=ACCEPT.map(function(s){return s.replace(/^\./,"").toLowerCase();});
var err=null;
if(allowed.length&&allowed.indexOf(ext)<0){err=ext?("."+ext+" files aren't supported"):"This file type isn't supported";}
else if(size>MAX_SIZE){err="Too large \u2013 max "+fmtSize(MAX_SIZE);}
var f={id:nid(),name:name,size:size,status:err?"error":"uploading",progress:0,error:err||undefined,retryable:false,failAt:info.failAt,startedAt:now(),duration:durationFor(size),removing:false};
files.push(f);
if(err){setLive(name+": "+err);}else{setLive("");}
render();
return f;
}
function doRetry(id){
for(var i=0;i<files.length;i++){if(files[i].id===id){files[i].status="uploading";files[i].progress=0;files[i].error=undefined;files[i].retryable=false;files[i].failAt=undefined;files[i].startedAt=now();setLive("");}}
render();
}
function doRemove(id){
for(var i=0;i<files.length;i++){if(files[i].id===id){files[i].removing=true;}}
render();
(function(rid){setTimeout(function(){files=files.filter(function(f){return f.id!==rid;});render();},480);})(id);
}
function doClear(){
var ids=files.filter(function(f){return f.status!=="uploading";}).map(function(f){return f.id;});
for(var i=0;i<files.length;i++){if(ids.indexOf(files[i].id)>=0)files[i].removing=true;}
render();
for(var j=0;j<ids.length;j++){(function(rid){setTimeout(function(){files=files.filter(function(f){return f.id!==rid;});render();},480);})(ids[j]);}
}
clearBtn.addEventListener("click",function(){doClear();});
area.addEventListener("click",function(){try{fileInput.click();}catch(e){}});
fileInput.addEventListener("change",function(){try{if(fileInput.files&&fileInput.files.length){for(var i=0;i<fileInput.files.length;i++){var fl=fileInput.files[i];addEntry({name:fl.name,size:fl.size});}fileInput.value="";}}catch(e){}});
var dragDepth=0;
function hasFiles(e){try{return Array.prototype.indexOf.call(e.dataTransfer.types,"Files")>=0;}catch(x){return true;}}
area.addEventListener("dragenter",function(e){if(!hasFiles(e))return;try{e.preventDefault();}catch(x){}dragDepth+=1;try{dragCount=Math.max(1,(e.dataTransfer&&e.dataTransfer.items&&e.dataTransfer.items.length)||1);}catch(x){dragCount=1;}render();});
area.addEventListener("dragover",function(e){if(!hasFiles(e))return;try{e.preventDefault();e.dataTransfer.dropEffect="copy";}catch(x){}});
area.addEventListener("dragleave",function(){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth){dragCount=0;render();}});
area.addEventListener("drop",function(e){try{if(!hasFiles(e))return;e.preventDefault();}catch(x){}dragDepth=0;dragCount=0;try{var fs=e.dataTransfer.files;for(var i=0;i<fs.length;i++){addEntry({name:fs[i].name,size:fs[i].size});}}catch(x){}render();});
var tickId=setInterval(function(){
var t=now(), changed=false;
for(var i=0;i<files.length;i++){var f=files[i];if(f.status!=="uploading")continue;
var n=Math.min(1,(t-f.startedAt)/f.duration);
var r=n<1?n*(0.92+Math.random()*0.08):1;r=Math.max(f.progress,r);
if(f.failAt!==undefined&&r>=f.failAt){f.progress=f.failAt;f.status="error";f.error="Connection lost";f.retryable=true;setLive(f.name+": upload failed");changed=true;}
else if(r>=1){f.progress=1;f.status="done";setLive(f.name+" uploaded");changed=true;}
else{if(r!==f.progress){f.progress=r;changed=true;}}
}
if(changed)render();else if(files.some(function(f){return f.status==="uploading";})){syncList();syncChrome();}
},90);
var clockId=setInterval(function(){
var anyUp=false;for(var i=0;i<files.length;i++){if(files[i].status==="uploading")anyUp=true;}
if(anyUp){syncList();syncChrome();}
},500);
setTimeout(function(){dragCount=SEED.length;render();},700);
setTimeout(function(){dragCount=0;for(var i=0;i<SEED.length;i++){(function(idx){setTimeout(function(){addEntry(SEED[idx]);},idx*140);})(i);}},1900);
function paintThemeBtn(){
var cur="light";try{cur=document.documentElement.getAttribute("data-theme")||"light";}catch(e){}
while(themeBtn.firstChild)themeBtn.removeChild(themeBtn.firstChild);
var ic=glyph(cur==="dark"?ICONS.sun:ICONS.moon);themeBtn.appendChild(ic);
try{themeBtn.setAttribute("aria-label",cur==="dark"?"Switch to light mode":"Switch to dark mode");themeBtn.setAttribute("aria-pressed",cur==="dark"?"true":"false");themeBtn.setAttribute("title","Toggle theme (current: "+cur+")");}catch(e){}
}
themeBtn.addEventListener("click",function(){
var cur="light";try{cur=document.documentElement.getAttribute("data-theme")||"light";}catch(e){}
var nxt=cur==="dark"?"light":"dark";
try{document.documentElement.setAttribute("data-theme",nxt);}catch(e){}
try{localStorage.setItem("affectui-dropzone-theme",nxt);}catch(e){}
paintThemeBtn();
});
themeBtn.addEventListener("pointerdown",function(){},{capture:true});
paintThemeBtn();
render();
try{window.__dz={get files(){return files;},addEntry:addEntry,doRetry:doRetry,doRemove:doRemove,doClear:doClear,fmtSize:fmtSize,HINT:HINT,SEED:SEED};}catch(e){}
})();
</script>
</body>
