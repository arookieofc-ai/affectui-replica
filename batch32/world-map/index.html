<meta name="color-scheme" content="light dark">
<title>World Map — Continental Highlight</title>
<style>
:root{
  --page:#fafaf9; --surface:#ffffff; --ink:#171717; --ink-2:#1c1917;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --menu-shadow:0 6px 12px rgba(0,0,0,.08),0 1px 2.5px rgba(0,0,0,.05);
  --focus-ring:#a8b5ff;
  --land:#E8E8E8; --focus-fill:#ffffff; --focus-stroke:#E2E2E2;
  --trigger-bg:#ffffff; --trigger-border:#e5e5e5; --trigger-ink:#171717;
  --panel-bg:#ffffff; --panel-border:#e5e5e5; --fill-bg:#f5f5f5; --option-ink:#171717;
  --chevron-ink:#737373;
  --shine-1:#FFA0AB; --shine-2:#FFB89E; --shine-3:#C8A8E5; --shine-4:#A8B5FF;
}
html[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --ink:#ededed; --ink-2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --menu-shadow:0 6px 12px rgba(0,0,0,.4),0 1px 2.5px rgba(0,0,0,.35);
  --land:#2a2a2d; --focus-fill:#46464c; --focus-stroke:rgba(255,255,255,.12);
  --trigger-bg:#232326; --trigger-border:rgba(255,255,255,.08); --trigger-ink:#ededed;
  --panel-bg:#232326; --panel-border:rgba(255,255,255,.08); --fill-bg:#2a2a2d; --option-ink:#ededed;
  --chevron-ink:#8f8f8f;
}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:920px;margin:0 auto;padding:20px 20px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand-name{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-btn{
  flex:none;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;
  border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-sm);font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;
}
.theme-btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.theme-btn svg{width:14px;height:14px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);padding:14px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.card-title{font-size:13px;font-weight:600}
.card-sub{font-size:12.5px;color:var(--muted)}
.stage{
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--page);overflow:hidden;
}
/* ---- component ---- */
.ui-wm{--ui-wm-ease:cubic-bezier(.22,1,.36,1);position:relative;width:100%;aspect-ratio:540/242}
.ui-wm-map,.ui-wm-art{position:absolute;inset:0;display:block;width:100%;height:100%}
.ui-wm-art{outline:none}
.ui-wm-band{animation:ui-wm-travel 14s linear infinite}
.ui-wm-band--1{animation-delay:-.42s}
.ui-wm-band--2{animation-delay:-.84s}
@keyframes ui-wm-travel{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
.ui-wm-layer{transform-box:view-box}
.ui-wm-layer[data-phase="enter"]{animation:ui-wm-in 520ms var(--ui-wm-ease) both}
.ui-wm-layer[data-phase="exit"]{animation:ui-wm-out 320ms cubic-bezier(.4,0,1,1) both}
@keyframes ui-wm-in{from{opacity:0;transform:scale(.94)}}
@keyframes ui-wm-out{to{opacity:0}}
.ui-wm-switch{position:absolute;top:0;left:0;z-index:1;padding:12px;transform:scale(var(--ui-wm-s,1));transform-origin:0 0}
.ui-wm-trigger{
  display:flex;align-items:center;gap:4px;height:28px;margin:0;padding:0 8px 0 12px;
  border:1px solid var(--trigger-border);border-radius:999px;background:var(--trigger-bg);
  box-shadow:var(--shadow-sm);color:var(--trigger-ink);
  font:inherit;font-size:13px;font-weight:500;line-height:1;white-space:nowrap;cursor:pointer;
  transition:transform 160ms var(--ui-wm-ease);
}
.ui-wm-trigger:active{transform:scale(.96)}
.ui-wm-trigger:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.ui-wm-chevron{width:14px;height:14px;transition:transform 220ms var(--ui-wm-ease)}
.ui-wm-trigger[aria-expanded="true"] .ui-wm-chevron{transform:rotate(180deg)}
.ui-wm-menu{--morph:420ms cubic-bezier(.32,.72,0,1);position:absolute;top:calc(12px + 28px + 6px);left:12px;width:172px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.08)) drop-shadow(0 1px 2.5px rgba(0,0,0,.05));transition:visibility 0s linear 0s}
html[data-theme="dark"] .ui-wm-menu{filter:drop-shadow(0 6px 12px rgba(0,0,0,.4)) drop-shadow(0 1px 2.5px rgba(0,0,0,.35))}
.ui-wm-menu[data-open="false"]{visibility:hidden;pointer-events:none;transition:visibility 0s linear 300ms}
.ui-wm-panel{
  position:relative;box-sizing:border-box;display:flex;flex-direction:column;padding:5px;
  background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:16px;outline:none;
  clip-path:inset(0 0 0 0 round 16px);transition:clip-path var(--morph);
}
.ui-wm-menu[data-open="false"] .ui-wm-panel{clip-path:inset(0 calc(100% - var(--from-w,28px)) calc(100% - var(--from-h,28px)) 0 round calc(var(--from-h,28px)/2));transition:clip-path 300ms cubic-bezier(.4,0,.2,1)}
.ui-wm-panel>*{transition:opacity 220ms ease-out 110ms,transform 380ms var(--ui-wm-ease) 60ms}
.ui-wm-menu[data-open="false"] .ui-wm-panel>*{opacity:0;transition:opacity 120ms ease-in}
.ui-wm-menu[data-open="false"] .ui-wm-option{transform:translateY(-4px)}
.ui-wm-fill{position:absolute;top:0;left:5px;right:5px;border-radius:10px;background:var(--fill-bg);pointer-events:none;transition:transform 190ms cubic-bezier(.25,1,.3,1),height 190ms cubic-bezier(.25,1,.3,1),opacity 160ms ease-out}
.ui-wm-fill[data-glide="false"]{transition:opacity 160ms ease-out}
.ui-wm-option{position:relative;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:10px;color:var(--option-ink);font-size:13px;font-weight:500;line-height:18px;cursor:pointer}
.ui-wm-option-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-wm-check{flex:none;width:15px;height:15px;opacity:0;transform:scale(.6);transition:opacity 160ms ease-out,transform 260ms cubic-bezier(.34,1.5,.64,1)}
.ui-wm-option[aria-selected="true"] .ui-wm-check{opacity:1;transform:none}
.hint{margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
kbd{font:inherit;font-size:11.5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){
  .ui-wm-band,.ui-wm-layer{animation:none !important}
  .ui-wm-layer[data-phase="exit"]{display:none}
  .ui-wm-panel,.ui-wm-panel>*,.ui-wm-fill,.ui-wm-check,.ui-wm-chevron{transition:none !important}
}
@media (hover:hover) and (pointer:fine){
  .theme-btn:hover{transform:translateY(-1px)}
  .ui-wm-trigger:hover{filter:brightness(.98)}
  .ui-wm-option:hover{background:transparent}
  .card:hover{box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07)}
}
@media (max-width:640px){
  .page{padding:14px 12px 28px}
  .brand-meta{display:none}
  .card{padding:10px}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <span class="brand-name">World Map</span>
      <span class="brand-meta" id="brandMeta">Europe highlighted · 6 continents</span>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v1.5M12 19.5V21M4.6 4.6l1.1 1.1M18.3 18.3l1.1 1.1M3 12h1.5M19.5 12H21M4.6 19.4l1.1-1.1M18.3 5.7l1.1-1.1"/><circle cx="12" cy="12" r="4.2"/></svg>
      <span id="themeLabel">Dark</span>
    </button>
  </div>
  <div class="card">
    <div class="card-head">
      <span class="card-title" id="cardTitle">World map with Europe highlighted</span>
      <span class="card-sub">pastel coastline · switchable</span>
    </div>
    <div class="stage">
      <div class="ui-wm" id="wmRoot" style="--ui-wm-s:1"></div>
    </div>
    <p class="hint">Pick a continent from the pill menu. Keys: <kbd>↓</kbd><kbd>↑</kbd> open · <kbd>Enter</kbd> select · <kbd>Esc</kbd> close.</p>
  </div>
</div>
<script>
(function(){

  {value:"europe",name:"Europe"},
  {value:"africa",name:"Africa"},
  {value:"asia",name:"Asia"},
  {value:"oceania",name:"Oceania"}

var CENTERS={

  "europe":[302,36],"africa":[296,121],"asia":[385,56],"oceania":[462,185]

/* Clean-room simplified silhouettes (own paths, same placement/centres as demo). */

"south-america":"M158 118 L182 112 L198 122 L204 142 L196 164 L186 186 L176 204 L164 208 L154 190 L146 168 L142 146 L148 128 Z",
"europe":"M262 28 L286 20 L308 22 L322 32 L318 48 L306 58 L288 62 L270 58 L258 46 Z",
"africa":"M270 78 L296 72 L316 80 L322 100 L318 124 L310 148 L300 170 L288 178 L276 168 L266 146 L260 120 L262 96 Z",
"asia":"M330 24 L360 16 L395 18 L430 26 L460 38 L470 56 L462 74 L444 88 L420 94 L396 96 L372 88 L348 74 L332 56 Z",

var SVGNS="http://www.w3.org/2000/svg";
var current="europe";
var layerKey=0;
var layers=[];
var hlIndex=2;
var menuOpen=false;
var fillArmed=false;
var root, mapBox, svgEl, layersG, triggerBtn, triggerName, menuBox, panelEl, fillEl, optionEls=[], cardTitle, brandMeta;

  document.documentElement.setAttribute("data-theme",t);
  var btn=document.getElementById("themeBtn"),lab=document.getElementById("themeLabel");
  if(lab)lab.textContent=(t==="dark"?"Light":"Dark");
  if(btn)btn.setAttribute("aria-label",t==="dark"?"Switch to light theme":"Switch to dark theme");

function buildStatic(){
  root=document.getElementById("wmRoot");
  cardTitle=document.getElementById("cardTitle");
  brandMeta=document.getElementById("brandMeta");
  mapBox=document.createElement("div");
  mapBox.setAttribute("class","ui-wm-map");
  mapBox.setAttribute("role","img");
  mapBox.setAttribute("aria-label","World map with Europe highlighted");
  root.appendChild(mapBox);
  svgEl=svgEl_("svg",{viewBox:"0 0 540 242","class":"ui-wm-art","aria-hidden":"true"});
  mapBox.appendChild(svgEl);
  var uid="wm0";
  var defs=svgEl_("defs",null);

  var stops=[["0%","#FFA0AB"],["33%","#FFB89E"],["66%","#C8A8E5"],["100%","#A8B5FF"]];
  for(var si=0;si<stops.length;si++){grad.appendChild(svgEl_("stop",{offset:stops[si][0],"stop-color":stops[si][1]}));}
  defs.appendChild(grad);
  defs.appendChild(svgEl_("filter",{id:uid+"-blur",x:"-20%",y:"-20%",width:"140%",height:"140%"}))
    .appendChild(svgEl_("feGaussianBlur",{stdDeviation:"4"}));

  land.setAttribute("fill","#E8E8E8");

  land.setAttribute("stroke-width","0.5");
  land.setAttribute("stroke-linejoin","round");
  for(var li=0;li<CONTINENTS.length;li++){

  svgEl.appendChild(land);
  layersG=svgEl_("g",null);
  layersG.setAttribute("class","ui-wm-layers");
  svgEl.appendChild(layersG);
  svgEl._uid=uid;
  // switcher
  var sw=document.createElement("div");
  sw.setAttribute("class","ui-wm-switch");
  root.appendChild(sw);
  triggerBtn=document.createElement("button");
  triggerBtn.setAttribute("type","button");
  triggerBtn.setAttribute("class","ui-wm-trigger");
  triggerBtn.setAttribute("aria-haspopup","listbox");
  triggerBtn.setAttribute("aria-expanded","false");
  triggerBtn.setAttribute("aria-controls","wm-list");
  triggerBtn.setAttribute("aria-label","Continent: Europe");
  triggerName=document.createElement("span");
  triggerName.textContent="Europe";
  triggerBtn.appendChild(triggerName);
  var chev=svgEl_("svg",{viewBox:"0 0 24 24",fill:"none","aria-hidden":"true"});
  chev.setAttribute("class","ui-wm-chevron");
  var cp=svgEl_("path",{d:"M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"});
  cp.setAttribute("class","ui-wm-chevron-ink");

  sw.appendChild(triggerBtn);

      nm.setAttribute("class","ui-wm-option-name");
      nm.textContent=CONTINENTS[idx].name;
      opt.appendChild(nm);

      panelEl.appendChild(opt);
      optionEls.push(opt);

  wireEvents();
  updateScale();
}
function makeLayerNode(continent,phase,key,uid){
  var d=GEO[continent];
  var c=CENTERS[continent]||[270,121];

  g.setAttribute("data-phase",phase);
  g.style.transformOrigin=c[0]+"px "+c[1]+"px";

  var mask=svgEl_("mask",{id:uid+"-"+key+"-outside",maskUnits:"userSpaceOnUse",x:"0",y:"0",width:"540",height:"242"});
  mask.appendChild(svgEl_("rect",{x:"0",y:"0",width:"540",height:"242",fill:"#FFFFFF"}));

  var focus=svgEl_("path",{d:d,filter:"url(#"+uid+"-shadow)"});
  focus.setAttribute("class","ui-wm-focus");
  focus.setAttribute("fill","#FFFFFF");
  focus.setAttribute("stroke","#E2E2E2");
  focus.setAttribute("stroke-width","0.5");
  focus.setAttribute("stroke-linejoin","round");
  g.appendChild(focus);
  var band=svgEl_("g",{fill:"none",stroke:"url(#"+uid+"-shine)","stroke-linecap":"round","stroke-linejoin":"round"});

  var b2=svgEl_("path",{d:d,pathLength:"1000","stroke-width":"1.4","stroke-dasharray":"200 800",opacity:"0.32"});
  b2.setAttribute("class","ui-wm-band");

function addLayer(continent,phase){

  layersG.appendChild(node);
  layers.push({key:layerKey,continent:continent,phase:phase,node:node});
  layerKey++;

function selectContinent(value,focusTrigger){
  if(value===current){
    if(focusTrigger)closeMenu(true);
    return;
  }
  current=value;
  var nm=nameOf(value);
  triggerName.textContent=nm;
  triggerBtn.setAttribute("aria-label","Continent: "+nm);
  mapBox.setAttribute("aria-label","World map with "+nm+" highlighted");
  if(cardTitle)cardTitle.textContent="World map with "+nm+" highlighted";
  if(brandMeta)brandMeta.textContent=nm+" highlighted · 6 continents";
  for(var i=0;i<optionEls.length;i++){
    optionEls[i].setAttribute("aria-selected",CONTINENTS[i].value===value?"true":"false");
  }

    layers[li].phase="exit";
    layers[li].node.setAttribute("data-phase","exit");
  }
  addLayer(value,"enter");

    for(var k=layers.length-1;k>=0;k--){
      if(layers[k].phase==="exit"){
        if(layers[k].node.parentNode===layersG)layersG.removeChild(layers[k].node);
        layers.splice(k,1);

function paintTriggerSize(){
  try{

}
function paintFill(){

    var n=optionEls[hlIndex];
    if(!n){fillEl.style.opacity="0";return;}
    var y=n.offsetTop||0,h=n.offsetHeight||0;
    // stub-safe fallback: estimate row height when layout is 0
    if(!h)h=32;
    if(!y)y=5+hlIndex*h;
    fillEl.style.transform="translateY("+y+"px)";
    fillEl.style.height=h+"px";
    fillEl.style.opacity=fillArmed?"1":"0";
    fillEl.setAttribute("data-glide",fillArmed?"true":"false");
    panelEl.setAttribute("aria-activedescendant","wm-opt-"+hlIndex);
  }catch(e){}
}
function openMenu(){
  hlIndex=indexOfVal(current);
  fillArmed=false;
  menuOpen=true;
  triggerBtn.setAttribute("aria-expanded","true");
  menuBox.setAttribute("data-open","true");
  try{menuBox.inert=false;}catch(e){}
  paintTriggerSize();
  paintFill();
  try{panelEl.focus({preventScroll:true});}catch(e){try{panelEl.focus();}catch(_){}}
}
function closeMenu(focusTrigger){
  if(!menuOpen){if(focusTrigger){try{triggerBtn.focus();}catch(e){}}return;}
  menuOpen=false;
  fillArmed=false;
  triggerBtn.setAttribute("aria-expanded","false");
  menuBox.setAttribute("data-open","false");
  try{menuBox.inert=true;}catch(e){}
  paintFill();
  if(focusTrigger){try{triggerBtn.focus();}catch(e){}}
}
function wireEvents(){
  triggerBtn.addEventListener("click",function(){if(menuOpen)closeMenu(false);else openMenu();});
  /* pointerdown capture on trigger keeps menu open race-free */
  triggerBtn.addEventListener("pointerdown",function(){},true);
  triggerBtn.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!menuOpen)openMenu();}
  });
  panelEl.addEventListener("keydown",function(e){
    var last=CONTINENTS.length-1,handled=true;
    if(e.key==="ArrowDown")hlIndex=Math.min(last,hlIndex+1);
    else if(e.key==="ArrowUp")hlIndex=Math.max(0,hlIndex-1);
    else if(e.key==="Home")hlIndex=0;
    else if(e.key==="End")hlIndex=last;
    else if(e.key==="Enter"||e.key===" "){selectContinent(CONTINENTS[hlIndex].value,true);}
    else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeMenu(true);}
    else if(e.key==="Tab"){closeMenu(false);}
    else handled=false;
    if(handled&&e.key!=="Escape"&&e.key!=="Tab"&&e.key!=="Enter"&&e.key!==" "){e.preventDefault();fillArmed=true;paintFill();}
    else if(e.key==="Enter"||e.key===" "){e.preventDefault();}
  });
  panelEl.addEventListener("pointerleave",function(){fillArmed=false;paintFill();});
  document.addEventListener("pointerdown",function(e){
    if(!menuOpen)return;
    var t=e.target;
    try{
      if(panelEl.contains(t)||triggerBtn.contains(t))return;
    }catch(_){return;}
    closeMenu(false);
  },true);
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&menuOpen)closeMenu(true);});
  if(typeof ResizeObserver!=="undefined"){
    try{
      var ro=new ResizeObserver(function(){updateScale();});
      ro.observe(root);
    }catch(e){}
  }
  try{window.addEventListener("resize",updateScale);}catch(e){}
}
function updateScale(){
  try{
    var w=root.clientWidth||540,h=root.clientHeight||0;
    if(!h)h=Math.round(w*242/540);
    var s=Math.min(1,Math.max(.62,Math.min(w/540,h/260)));
    root.style.setProperty("--ui-wm-s",s.toFixed(3));
  }catch(e){}
}
/* expose for harness (in-place checks) */
window.__wm={
  get current(){return current;},
  get layers(){return layers;},
  get menuOpen(){return menuOpen;},
  select:selectContinent,open:openMenu,close:closeMenu,
  continents:CONTINENTS,
  get root(){return root;},get trigger(){return triggerBtn;},
  get options(){return optionEls;},get panel(){return panelEl;},
  get mapBox(){return mapBox;},get title(){return cardTitle;}
};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",buildStatic);
else buildStatic();
var tb=document.getElementById("themeBtn");
if(tb)tb.addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
  setTheme(cur==="dark"?"light":"dark",true);
});
try{
  var initT=document.documentElement.getAttribute("data-theme")||"light";
  var lab=document.getElementById("themeLabel");
  if(lab)lab.textContent=(initT==="dark"?"Light":"Dark");
  var btn=document.getElementById("themeBtn");
  if(btn)btn.setAttribute("aria-label",initT==="dark"?"Switch to light theme":"Switch to dark theme");
}catch(e){}
})();
</script>
