<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<script>/*noflash*/(function(){try{var k="blur-crossfade-theme";var s=null;try{s=localStorage.getItem(k)}catch(e){}var m=false;try{m=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches}catch(e){}var t=s||(m?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<title>Blur Crossfade — Release 2.4</title>
<style>
:root{
  --page:#fafaf9; --surface:#ffffff; --ink:#1c1917; --ink-soft:#44403c;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --shadow-up:0 2px 4px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --accent:#2563eb; --accent-ink:#ffffff;
  --ok-bg:#dcfce7; --ok-text:#166534; --ok-dot:#16a34a;
  --info-bg:#dbeafe; --info-text:#1d4ed8; --info-dot:#2563eb;
  --warn-bg:#fef3c7; --warn-text:#92400e; --warn-dot:#f59e0b;
  --img-outline:rgba(0,0,0,.1);
}
html[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --ink:#ededed; --ink-soft:#d4d4d8;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-up:0 2px 6px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.45);
  --accent:#60a5fa; --accent-ink:#0b1220;
  --ok-bg:#052e16; --ok-text:#bbf7d0; --ok-dot:#22c55e;
  --info-bg:#172554; --info-text:#bfdbfe; --info-dot:#60a5fa;
  --warn-bg:#451a03; --warn-text:#fde68a; --warn-dot:#fbbf24;
  --img-outline:rgba(255,255,255,.1);
}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:14px; line-height:1.5; color:var(--ink); background:var(--page);
  font-variant-numeric:tabular-nums;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:28px 16px 48px;
}
.topbar{
  width:100%; max-width:640px; display:flex; align-items:center; justify-content:space-between;
  gap:12px; margin-bottom:16px;
}
.proj{display:flex; flex-direction:column; gap:2px; min-width:0}
.proj-name{font-size:15px; font-weight:650; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.proj-meta{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:7px; white-space:nowrap}
.dot-live{width:7px; height:7px; border-radius:999px; background:var(--warn-dot); flex:none}
.dot-live[data-idle="true"]{background:var(--ok-dot)}
.theme-toggle{
  appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  width:36px; height:36px; border-radius:999px; cursor:pointer; font-size:16px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; padding:0 0 1px 0;
  box-shadow:var(--shadow); transition:transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
  flex:none;
}
.theme-toggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
main{width:100%; max-width:640px; display:flex; flex-direction:column; gap:12px}
.card__preview{display:flex; flex-direction:column; gap:12px}
.bxd-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:12px;
}
.bxd-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.bxd-meta{display:flex; flex-direction:column; gap:2px; min-width:0}
.bxd-title{font-size:15.5px; font-weight:650; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bxd-sub{font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bxd-primary{
  appearance:none; border:1px solid transparent; background:var(--ink); color:var(--page);
  border-radius:999px; padding:8px 16px 8px 14px; font-size:13.5px; font-weight:600; cursor:pointer;
  min-width:118px; min-height:36px; display:inline-flex; align-items:center; justify-content:center;
  transition:transform 160ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
  box-shadow:var(--shadow); flex:none;
}
html[data-theme="dark"] .bxd-primary{background:var(--ink); color:#101012}
.bxd-primary[data-status="busy"]{background:var(--subtle); color:var(--ink); border-color:var(--border)}
.bxd-primary[data-status="done"]{background:var(--ok-bg); color:var(--ok-text); border-color:var(--border)}
.bxd-primary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.bxd-btn{display:inline-flex; align-items:center; gap:8px; white-space:nowrap}
.bxd-spin{
  width:14px; height:14px; border-radius:999px; flex:none;
  border:2px solid var(--border); border-top-color:var(--ink);
  animation:bxd-rot .8s linear infinite;
}
@keyframes bxd-rot{to{transform:rotate(360deg)}}
.bxd-check{flex:none; display:inline-flex}
.bxd-panel{
  background:var(--subtle); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 14px; min-height:76px;
}
.bxd-note{display:flex; align-items:flex-start; gap:10px}
.bxd-note p{margin:2px 0 0; font-size:13.5px; color:var(--ink-soft)}
.bxd-tag{
  font-size:11.5px; font-weight:700; letter-spacing:.02em; border-radius:999px; padding:3px 10px;
  white-space:nowrap; flex:none; margin-top:1px; border:1px solid var(--border);
}
.bxd-tag[data-kind="Shipped"]{background:var(--ok-bg); color:var(--ok-text)}
.bxd-tag[data-kind="Improved"]{background:var(--info-bg); color:var(--info-text)}
.bxd-tag[data-kind="Fixed"]{background:var(--warn-bg); color:var(--warn-text)}
.bxd-foot{display:flex; align-items:center; justify-content:space-between; gap:12px}
.bxd-dots{display:inline-flex; align-items:center; gap:6px}
.bxd-dots i{
  width:7px; height:7px; border-radius:999px; background:var(--border);
  font-size:0; line-height:0; font-style:normal; overflow:hidden; text-indent:-999px;
  transition:background 160ms ease, width 160ms ease;
}
.bxd-dots i[data-on]{background:var(--muted); width:20px}
.bxd-chip{
  appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:7px 16px 7px 14px; font-size:13px; font-weight:600; cursor:pointer;
  transition:transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
}
.bxd-chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.hint{font-size:12.5px; color:var(--muted); margin:2px 2px 0}
/* ---- blur-crossfade primitive (clean-room) ---- */
.ui-bx{
  --ui-bx-duration:420ms; --ui-bx-blur:10px;
  --ui-bx-ease:cubic-bezier(0.22, 1, 0.36, 1);
  position:relative; display:block;
}
.ui-bx--both{display:inline-block; vertical-align:top}
.ui-bx[data-busy]{overflow:hidden}
.ui-bx__layer{display:block}
.ui-bx--both > .ui-bx__layer{width:max-content; max-width:100%}
.ui-bx__layer--out{position:absolute; top:0; left:0; pointer-events:none}
.ui-bx--height > .ui-bx__layer--out, .ui-bx--none > .ui-bx__layer--out{right:0}
.ui-bx--both > .ui-bx__layer--out{left:50%; translate:-50% 0}
.ui-bx--both > .ui-bx__layer--in{margin-left:50%; translate:-50% 0}
.ui-bx__layer--in{animation:ui-bx-in var(--ui-bx-duration) var(--ui-bx-ease) both}
.ui-bx__layer--out{animation:ui-bx-out calc(var(--ui-bx-duration) * 0.8) ease-in both}
@keyframes ui-bx-in{from{opacity:0; filter:blur(var(--ui-bx-blur)); transform:scale(.98)}to{opacity:1; filter:blur(0); transform:scale(1)}}
@keyframes ui-bx-out{from{opacity:1; filter:blur(0); transform:scale(1)}to{opacity:0; filter:blur(var(--ui-bx-blur)); transform:scale(1.02)}}
@media (prefers-reduced-motion: reduce){
  .ui-bx__layer--in, .ui-bx__layer--out{animation:none}
  .ui-bx__layer--out{display:none}
  .bxd-spin{animation:none}
}
img{outline:1px solid var(--img-outline); outline-offset:-1px}
@media (max-width:560px){
  body{padding:18px 12px 36px}
  .bxd-head{flex-direction:column; align-items:stretch}
  .bxd-primary{width:100%}
  .bxd-panel{min-height:0}
}
@media (hover: hover) and (pointer: fine){
  .theme-toggle:hover{transform:translateY(-1px); box-shadow:var(--shadow-up)}
  .bxd-primary:hover{transform:translateY(-1px); box-shadow:var(--shadow-up)}
  .bxd-chip:hover{transform:translateY(-1px); box-shadow:var(--shadow-up); background:var(--subtle)}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="proj">
    <span class="proj-name">Release 2.4</span>
    <span class="proj-meta"><span class="dot-live" id="workDot" data-idle="true"></span><span id="workCount">0 working · 3 changes</span></span>
  </div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">&#9789;</button>
</header>
<main>
  <div class="card__preview">
    <div id="demo-mount"></div>
  </div>
  <p class="hint">Content swaps with a soft blur while the box glides to the next size. Publishing runs 1.5s, then settles; notes advance with Next or automatically.</p>
</main>
<script>
(function(){
"use strict";
var NOTES=[
  {tag:"Shipped",text:"Dark mode is live for everyone."},
  {tag:"Improved",text:"Search now looks through comments and attachments too, and results show up while you type \u2013 no more waiting for the full page."},
  {tag:"Fixed",text:"Exports keep their column order, even with hidden fields in between."}
];
var DUR_PANEL=420, BLUR_PANEL=10, DUR_BTN=380, BLUR_BTN=6;
var NS="http://www.w3.org/2000/svg";
function reduced(){try{return typeof window!=="undefined"&&window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}}
function safeH(el){try{return el&&typeof el.offsetHeight==="number"?el.offsetHeight:(el&&el.getBoundingClientRect?el.getBoundingClientRect().height:0)}catch(e){return 0}}
function safeW(el){try{return el&&typeof el.offsetWidth==="number"?el.offsetWidth:(el&&el.getBoundingClientRect?el.getBoundingClientRect().width:0)}catch(e){return 0}}

var R={note:0,status:"idle",tick:0,timers:[],built:false};
function crossfade(root,live,apply,opt){
  var duration=opt.duration,morph=opt.morph||"height";
  if(reduced()||duration<=0){apply();return}
  var oldH=safeH(root),oldW=safeW(root);
  var ghost=null;

    ghost=live.cloneNode(true);
    ghost.removeAttribute("id");
    ghost.setAttribute("class","ui-bx__layer ui-bx__layer--out");
    ghost.setAttribute("aria-hidden","true");
    try{ghost.setAttribute("inert","")}catch(e){}
    var dups=ghost.querySelectorAll?ghost.querySelectorAll("[id]"):[];
    for(var k=0;k<dups.length;k++){try{dups[k].removeAttribute("id")}catch(e){}}
    root.appendChild(ghost);
  }catch(e){ghost=null}
  apply();
  try{
    if(morph!=="none"&&(oldH||safeH(root))){
      var newH=safeH(root),newW=safeW(root);

        root.setAttribute("data-busy","");
        root.style.transition="none";
        root.style.height=oldH+"px";
        if(morph==="both"&&oldW&&newW)root.style.width=oldW+"px";
        void root.offsetHeight;
        var ease="cubic-bezier(0.22, 1, 0.36, 1)";
        root.style.transition=morph==="both"
          ?"height "+duration+"ms "+ease+", width "+duration+"ms "+ease
          :"height "+duration+"ms "+ease;
        root.style.height=newH+"px";
        if(morph==="both"&&oldW&&newW)root.style.width=newW+"px";
      }else if(ghost){root.setAttribute("data-busy","")}
      else{root.setAttribute("data-busy","")}
    }else if(ghost){root.setAttribute("data-busy","")}
    live.setAttribute("class",live.getAttribute("class").replace("ui-bx__layer--in","").trim()+" ui-bx__layer--in");
  }catch(e){}
  var done=false;
  var fin=function(){if(done)return;done=true;
    try{if(ghost&&ghost.parentNode===root)root.removeChild(ghost)}catch(e){try{if(ghost)ghost.remove()}catch(_){}}
    try{root.style.height="";root.style.width="";root.style.transition="";root.removeAttribute("data-busy")}catch(e){}
  };
  R.timers.push(window.setTimeout(fin,duration+30));
}
function build(){
  if(R.built)return R.refs;R.built=true;
  var mount=document.getElementById("demo-mount");
  var card=el("div","bxd-card",mount);
  var head=el("div","bxd-head",card);
  var meta=el("div","bxd-meta",head);
  var title=el("span","bxd-title",meta);title.appendChild(txt("Release 2.4"));
  var sub=el("span","bxd-sub",meta);sub.appendChild(txt("3 changes \u00B7 draft"));
  var primary=document.createElement("button");
  primary.setAttribute("type","button");
  primary.setAttribute("class","bxd-primary");
  primary.setAttribute("data-status","idle");
  primary.setAttribute("aria-live","polite");
  head.appendChild(primary);
  var btnBx=el("span","ui-bx ui-bx--both",primary);
  btnBx.style.setProperty("--ui-bx-duration",DUR_BTN+"ms");
  btnBx.style.setProperty("--ui-bx-blur",BLUR_BTN+"px");
  var btnLive=el("span","ui-bx__layer ui-bx__layer--in",btnBx);
  var btnContent=el("span","bxd-btn",btnLive);
  var iconSlot=el("span",null,btnContent);
  var spinner=el("span","bxd-spin",iconSlot);
  spinner.setAttribute("aria-hidden","true");spinner.hidden=true;
  var checkWrap=el("span","bxd-check",iconSlot);
  var svg=document.createElementNS?document.createElementNS(NS,"svg"):document.createElement("svg");
  svg.setAttribute("class","bxd-check-svg");
  svg.setAttribute("viewBox","0 0 16 16");
  svg.setAttribute("width","14");svg.setAttribute("height","14");
  svg.setAttribute("fill","none");svg.setAttribute("stroke","currentColor");
  svg.setAttribute("stroke-width","1.8");svg.setAttribute("stroke-linecap","round");
  svg.setAttribute("stroke-linejoin","round");svg.setAttribute("aria-hidden","true");
  var path=document.createElementNS?document.createElementNS(NS,"path"):document.createElement("path");
  path.setAttribute("d","M3.5 8.5l3 3 6-7");
  svg.appendChild(path);checkWrap.appendChild(svg);checkWrap.hidden=true;
  var btnLabel=el("span",null,btnContent);btnLabel.appendChild(txt("Publish"));
  var panel=el("div","bxd-panel",card);
  var panelBx=el("div","ui-bx ui-bx--height",panel);
  panelBx.style.setProperty("--ui-bx-duration",DUR_PANEL+"ms");
  panelBx.style.setProperty("--ui-bx-blur",BLUR_PANEL+"px");
  var panelLive=el("div","ui-bx__layer ui-bx__layer--in",panelBx);
  var note=el("div","bxd-note",panelLive);
  var tag=el("span","bxd-tag",note);tag.setAttribute("data-kind","Shipped");tag.appendChild(txt("Shipped"));
  var p=document.createElement("p");note.appendChild(p);
  var body=el("span",null,p);body.appendChild(txt(NOTES[0].text));
  var foot=el("div","bxd-foot",card);
  var dots=el("span","bxd-dots",foot);dots.setAttribute("aria-hidden","true");
  var dotEls=[];
  for(var i=0;i<NOTES.length;i++){
    var d=el("i",null,dots);d.appendChild(txt(String(i)));
    if(i===0)d.setAttribute("data-on","");dotEls.push(d);
  }
  var next=document.createElement("button");
  next.setAttribute("type","button");next.setAttribute("class","bxd-chip");
  next.appendChild(txt("Next"));foot.appendChild(next);
  var refs={mount:mount,card:card,head:head,primary:primary,btnBx:btnBx,btnLive:btnLive,
    btnContent:btnContent,spinner:spinner,checkWrap:checkWrap,btnLabel:btnLabel,
    panel:panel,panelBx:panelBx,panelLive:panelLive,note:note,tag:tag,body:body,
    dots:dots,dotEls:dotEls,next:next,title:title,sub:sub};
  R.refs=refs;
  primary.addEventListener("click",onPublish);
  next.addEventListener("click",function(){renderNote((R.note+1)%NOTES.length,true)});
  return refs;
}
function paintStatus(next,animate){
  var refs=R.refs;if(!refs)return;
  if(R.status===next&&refs.primary.getAttribute("data-status")===next)return;
  var apply=function(){
    R.status=next;
    refs.primary.setAttribute("data-status",next);
    refs.spinner.hidden=(next!=="busy");
    refs.checkWrap.hidden=(next!=="done");
    var label=next==="idle"?"Publish":(next==="busy"?"Publishing\u2026":"Published");
    while(refs.btnLabel.firstChild)refs.btnLabel.removeChild(refs.btnLabel.firstChild);
    refs.btnLabel.appendChild(txt(label));
    var wc=document.getElementById("workCount");
    var wd=document.getElementById("workDot");
    var s=(next==="busy"?"1 working":"0 working")+" \u00B7 3 changes";
    if(wc){while(wc.firstChild)wc.removeChild(wc.firstChild);wc.appendChild(txt(s))}
    if(wd)wd.setAttribute("data-idle",next==="busy"?"false":"true");
  };
  if(animate===false){apply();return}
  crossfade(refs.btnBx,refs.btnLive,apply,{duration:DUR_BTN,morph:"both"});
}
function renderStatus(next,animate){paintStatus(next,animate)}
function renderNote(i,animate){
  var refs=R.refs;if(!refs)return;
  i=((i%NOTES.length)+NOTES.length)%NOTES.length;
  if(i===R.note){
    var cur=NOTES[i];
    var sameTag=refs.tag.getAttribute("data-kind")===cur.tag;
    var sameBody=refs.body.textContent===cur.text;
    if(sameTag&&sameBody&&refs.dotEls[i]&&refs.dotEls[i].hasAttribute("data-on"))return;
  }
  var apply=function(){
    R.note=i;var n=NOTES[i];
    refs.tag.setAttribute("data-kind",n.tag);
    while(refs.tag.firstChild)refs.tag.removeChild(refs.tag.firstChild);
    refs.tag.appendChild(txt(n.tag));
    while(refs.body.firstChild)refs.body.removeChild(refs.body.firstChild);
    refs.body.appendChild(txt(n.text));
    for(var k=0;k<refs.dotEls.length;k++){
      if(k===i)refs.dotEls[k].setAttribute("data-on","");
      else refs.dotEls[k].removeAttribute("data-on");
    }
  };
  if(animate===false){apply();return}
  crossfade(refs.panelBx,refs.panelLive,apply,{duration:DUR_PANEL,morph:"height"});
}
function onPublish(){
  if(R.status!=="idle")return;
  paintStatus("busy",true);
  R.timers.push(window.setTimeout(function(){paintStatus("done",true)},1500));
  R.timers.push(window.setTimeout(function(){paintStatus("idle",true)},3600));
}
function cycle(s){return s==="idle"?"busy":(s==="busy"?"done":"idle")}
function startLoop(){
  var refs=R.refs;if(!refs)return;
  var preview=null;
  try{preview=refs.card.closest?refs.card.closest(".card__preview"):null}catch(e){preview=null}
  if(!preview){
    try{preview=document.querySelector?document.querySelector(".card__preview"):null}catch(e){preview=null}
  }
  if(!preview)return null;
  var id=window.setInterval(function(){
    R.tick++;
    if(R.tick%2===1)renderNote((R.note+1)%NOTES.length,true);
    else paintStatus(cycle(R.status),true);
  },1300);
  return id;
}
function wireTheme(){
  var btn=null;try{btn=document.getElementById("themeToggle")}catch(e){}
  if(!btn)return;
  var label=function(){var d=document.documentElement.getAttribute("data-theme");return d==="dark"?"\u263E":"\u2609"};
  var paint=function(){try{while(btn.firstChild)btn.removeChild(btn.firstChild);btn.appendChild(txt(label()))}catch(e){}};
  paint();
  btn.addEventListener("click",function(){
    var cur="light";
    try{cur=document.documentElement.getAttribute("data-theme")||"light"}catch(e){}
    var nx=cur==="dark"?"light":"dark";
    try{document.documentElement.setAttribute("data-theme",nx)}catch(e){}
    try{localStorage.setItem("blur-crossfade-theme",nx)}catch(e){}
    paint();
  });
  try{
    var obs=null;
    if(typeof MutationObserver!=="undefined"){
      obs=new MutationObserver(function(){paint()});
      obs.observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
    }
  }catch(e){}
}
function init(){
  build();wireTheme();
  var loopId=startLoop();
  try{
    window.__bxTest={refs:R.refs,get note(){return R.note},get status(){return R.status},
      renderNote:function(i,a){return renderNote(i,a)},renderStatus:function(s,a){return renderStatus(s,a)},
      publish:function(){return onPublish()},loopId:loopId,NOTES:NOTES};
  }catch(e){}
  var clear=function(){for(var i=0;i<R.timers.length;i++){try{window.clearTimeout(R.timers[i])}catch(e){}}try{if(loopId)window.clearInterval(loopId)}catch(e){}};
  try{if(typeof window!=="undefined"&&window.addEventListener)window.addEventListener("beforeunload",clear)}catch(e){}
  return R.refs;
}
if(typeof document!=="undefined"){
  if(document.readyState&&document.readyState!=="loading")init();
  else if(document.addEventListener)document.addEventListener("DOMContentLoaded",init);
  else init();
}
})();
</script>
</body>
</html>
