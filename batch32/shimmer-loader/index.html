<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<!-- /*noflash*/ -->
<script>/*noflash*/try{(function(){var k="affectui-shimmer-loader-theme";var t=null;try{t=localStorage.getItem(k)}catch(e){}if(!t){try{if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches){t="dark"}else{t="light"}}catch(e){t="light"}}if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t)}else{document.documentElement.setAttribute("data-theme","light")}})()}catch(e){}</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Shimmer Loader — affectUI replica</title>
<style>
:root, html[data-theme="light"]{
  --surface:#ffffff;
  --page:#fafaf9;
  --ink:#171717;
  --ink-soft:#1c1917;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --radius-lg:16px;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --shadow-lift:0 2px 4px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --amber-bg:#fef3c7;
  --amber-text:#92400e;
  --amber-dot:#f59e0b;
  --green-bg:#dcfce7;
  --green-text:#166534;
  --green-dot:#16a34a;
  --focus:#2563eb;
  --btn-bg:#ffffff;
  --btn-border:#e7e5e4;
  --btn-ink:#1c1917;
  --avatar-bg:#e7e5e4;
  --avatar-ink:#57534e;
  --ui-shm-base:#ececec;
  --ui-shm-glow:rgba(255,255,255,0.9);
  --ui-shm-text:#a3a3a3;
  --ui-shm-text-glow:#ffffff;
  --ui-shm-dur:2.2s;
}
html[data-theme="dark"]{
  --surface:#1c1c1f;
  --page:#101012;
  --ink:#ededed;
  --ink-soft:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.45);
  --amber-bg:#451a03;
  --amber-text:#fde68a;
  --amber-dot:#fbbf24;
  --green-bg:#052e16;
  --green-text:#bbf7d0;
  --green-dot:#22c55e;
  --focus:#93c5fd;
  --btn-bg:#26262a;
  --btn-border:#2e2e33;
  --btn-ink:#ededed;
  --avatar-bg:#2e2e33;
  --avatar-ink:#d4d4d8;
  --ui-shm-base:#2f2f33;
  --ui-shm-glow:rgba(255,255,255,0.08);
  --ui-shm-text:#6e6e73;
  --ui-shm-text-glow:#f5f5f5;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:14px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  transition:background 180ms ease, color 180ms ease;
}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.page-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin:4px 0 16px;
}
.title h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-0.01em;color:var(--ink)}
.title p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.head-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* status pill: fully rounded */
.status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;white-space:nowrap;
  border-radius:999px;padding:4px 10px;
  border:1px solid var(--border);
  background:var(--amber-bg);color:var(--amber-text);border-color:transparent;
}
.status[data-state="ready"]{background:var(--green-bg);color:var(--green-text)}
.status .dot{width:7px;height:7px;border-radius:999px;background:var(--amber-dot);flex-shrink:0}
.status[data-state="ready"] .dot{background:var(--green-dot)}
.icon-btn{
  appearance:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:999px;
  background:var(--btn-bg);color:var(--btn-ink);
  border:1px solid var(--btn-border);
  font-size:15px;line-height:1;
  padding:0 0 1px 0;
  transition:transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease, background 150ms ease;
}
.icon-btn:focus-visible, .shd-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}

/* Demo card: elevation via shadow, structure via 1px border */
.demo{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg); /* outer 16 */
  box-shadow:var(--shadow);
  padding:16px;
  transition:box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
}
.shd-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.shd-btn{
  appearance:none;cursor:pointer;flex-shrink:0;
  font:inherit;font-size:13px;font-weight:600;
  color:var(--btn-ink);background:var(--btn-bg);
  border:1px solid var(--btn-border);border-radius:999px;
  padding:6px 12px 6px 10px; /* optical: icon side ~2px less */
  transition:box-shadow 150ms ease, border-color 150ms ease, transform 150ms ease, background 150ms ease;
}
.shd-card{margin:0}
/* skeleton rows */
.shd-row{display:flex;align-items:center;gap:12px}
.shd-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.shd-lines{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.shd-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
/* loaded rows reuse same layout so the swap keeps geometry */
.shd-avatar{
  width:36px;height:36px;border-radius:999px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--avatar-bg);color:var(--avatar-ink);
  font-size:12px;font-weight:700;letter-spacing:.02em;
}
.shd-name{display:block;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shd-sub{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shd-text{margin:12px 0 0;font-size:14px;color:var(--ink)}
.shd-tile{display:block;height:56px;border-radius:var(--radius); /* inner 10 < outer 16: concentric */}

/* ---- shimmer primitives (observed behaviour, clean-room rewrite) ---- */
.ui-shm{
  display:block;
  flex:0 1 auto;
  min-width:0;
  width:100%;
  height:12px;
  max-width:100%;
  border-radius:6px;
  background-color:var(--ui-shm-base);
  background-image:linear-gradient(100deg, transparent 0%, transparent 30%, var(--ui-shm-glow) 50%, transparent 70%, transparent 100%);
  background-size:150vw 100%;
  background-repeat:repeat-x;
  background-attachment:fixed;
  animation:ui-shm-sweep var(--ui-shm-dur) linear infinite;
}
@keyframes ui-shm-sweep{from{background-position:-50vw 0}to{background-position:100vw 0}}
.ui-shm-text{
  display:inline-block;
  color:var(--ui-shm-text);
  background-image:linear-gradient(90deg, var(--ui-shm-text) 0%, var(--ui-shm-text) 40%, var(--ui-shm-text-glow) 50%, var(--ui-shm-text) 60%, var(--ui-shm-text) 100%);
  background-size:300% 100%;
  background-position:100% 0;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:ui-shm-text var(--ui-shm-text-dur,2s) linear infinite;
}
@keyframes ui-shm-text{from{background-position:100% 0}to{background-position:0% 0}}
.shd-label{font-size:14px;font-weight:600;--ui-shm-text-dur:2s}
.note{margin:12px 2px 0;font-size:12px;color:var(--muted)}
.note code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:12px}

@media (prefers-reduced-motion: reduce){
  .ui-shm{animation:none;background-image:none}
  .ui-shm-text{animation:none;background-image:none;-webkit-text-fill-color:currentColor}
}
@media (max-width:480px){
  .shd-tiles{grid-template-columns:1fr}
  .wrap{padding:16px 12px 40px}
}
/* v5: hover only on precise pointers */
@media (hover: hover) and (pointer: fine){
  .demo:hover{box-shadow:var(--shadow-lift)}
  .shd-btn:hover{border-color:var(--muted);transform:translateY(-1px)}
  .icon-btn:hover{border-color:var(--muted);transform:translateY(-1px)}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div class="title">
      <h1>Shimmer Loader</h1>
      <p>Skeleton blocks sharing one soft light sweep, plus shimmering Thinking text.</p>
    </div>
    <div class="head-actions">
      <span class="status" id="statusPill" data-state="loading" role="status"><span class="dot" aria-hidden="true"></span><span id="statusText">Loading</span></span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Toggle theme">◐</button>
    </div>
  </header>

  <main class="demo" id="demo">
    <div class="shd-top">
      <span class="ui-shm-text shd-label" id="thinkLabel">Generating summary…</span>
      <button class="shd-btn" id="reloadBtn" type="button">↻&nbsp;Reload</button>
    </div>
    <div class="shd-card" id="card" aria-busy="true">
      <div id="skelView">
        <div class="shd-row">
          <span class="ui-shm" aria-hidden="true" style="width:36px;height:36px;border-radius:50%;flex-shrink:0"></span>
          <div class="shd-meta">
            <span class="ui-shm" aria-hidden="true" style="width:96px;height:10px;border-radius:5px"></span>
            <span class="ui-shm" aria-hidden="true" style="width:64px;height:8px;border-radius:4px"></span>
          </div>
        </div>
        <div class="shd-lines">
          <span class="ui-shm" aria-hidden="true" style="height:10px;border-radius:5px"></span>
          <span class="ui-shm" aria-hidden="true" style="width:72%;height:10px;border-radius:5px"></span>
        </div>
        <div class="shd-tiles" id="skelTiles">
          <span class="ui-shm" aria-hidden="true" style="height:56px;border-radius:10px"></span>
          <span class="ui-shm" aria-hidden="true" style="height:56px;border-radius:10px"></span>
          <span class="ui-shm" aria-hidden="true" style="height:56px;border-radius:10px"></span>
        </div>
      </div>
      <div id="loadedView" hidden>
        <div class="shd-row">
          <span class="shd-avatar" aria-hidden="true">MC</span>
          <div class="shd-meta">
            <span class="shd-name">Maya Chen</span>
            <span class="shd-sub">Product design · 2h</span>
          </div>
        </div>
        <p class="shd-text">New onboarding flow is live – activation is up 18% in the first week.</p>
        <div class="shd-tiles" id="loadedTiles">
          <span class="shd-tile" style="background:linear-gradient(135deg, #ffd6a8, #ff9f6b)"></span>
          <span class="shd-tile" style="background:linear-gradient(135deg, #c7d7ff, #8aa7ff)"></span>
          <span class="shd-tile" style="background:linear-gradient(135deg, #cdeccf, #7fcf9a)"></span>
        </div>
      </div>
    </div>
  </main>
  <p class="note mono" id="loopNote">loop: 2500ms loading · 3200ms loaded · reload restarts the sweep</p>
</div>

<script>
(function(){
  "use strict";
  var LOADING_MS = 2500, LOADED_MS = 3200, STORE_KEY = "affectui-shimmer-loader-theme";
  var root = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");
  var card = document.getElementById("card");
  var skelView = document.getElementById("skelView");
  var loadedView = document.getElementById("loadedView");
  var statusPill = document.getElementById("statusPill");
  var statusText = document.getElementById("statusText");
  var reloadBtn = document.getElementById("reloadBtn");
  var thinkLabel = document.getElementById("thinkLabel");

  function currentTheme(){ return root.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  function paintThemeBtn(){
    var dark = currentTheme() === "dark";
    themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
    themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    themeBtn.textContent = dark ? "☀" : "◐";
  }
  function setTheme(t){
    root.setAttribute("data-theme", t);
    try{ localStorage.setItem(STORE_KEY, t); }catch(e){}
    paintThemeBtn();
  }
  // honour stored override on init (noflash already applied it pre-paint; re-sync button only)
  try{
    var stored = localStorage.getItem(STORE_KEY);
    if(stored === "dark" || stored === "light"){ root.setAttribute("data-theme", stored); }
  }catch(e){}
  paintThemeBtn();
  // pointerdown capture so the toggle wins even if a later click is swallowed; click does the work
  themeBtn.addEventListener("pointerdown", function(){}, true);
  themeBtn.addEventListener("click", function(){
    setTheme(currentTheme() === "dark" ? "light" : "dark");
  });

  var loading = true;
  var cycle = 0;
  var timer = null;

  // IN-PLACE updates only: toggle hidden/attrs/text on existing nodes. No innerHTML here.
  function setLoading(v){
    loading = v;
    card.setAttribute("aria-busy", v ? "true" : "false");
    skelView.hidden = !v;
    loadedView.hidden = v;
    statusPill.setAttribute("data-state", v ? "loading" : "ready");
    statusText.textContent = v ? "Loading" : "Ready";
  }

  function schedule(){
    if(timer !== null){ clearTimeout(timer); timer = null; }
    timer = setTimeout(function(){
      timer = null;
      setLoading(!loading);
      cycle += 1;
      schedule();
    }, loading ? LOADING_MS : LOADED_MS);
  }

  // capture pointerdown so a real click still survives even with fast state churn
  reloadBtn.addEventListener("pointerdown", function(){}, true);
  reloadBtn.addEventListener("mousedown", function(){}, true);
  reloadBtn.addEventListener("click", function(){
    cycle += 1;
    setLoading(true);
    schedule();
  });

  setLoading(true);
  schedule();

  // hook for the in-dir DOM-stub harness (does not affect UI)
  try{
    window.__shimmer = {
      get loading(){ return loading; },
      get cycle(){ return cycle; },
      setLoading: setLoading,
      nodes: {
        card: card, skelView: skelView, loadedView: loadedView,
        statusPill: statusPill, statusText: statusText,
        thinkLabel: thinkLabel, reloadBtn: reloadBtn, themeBtn: themeBtn
      },
      timings: { loadingMs: LOADING_MS, loadedMs: LOADED_MS }
    };
  }catch(e){}
})();
</script>
</body>
</html>
