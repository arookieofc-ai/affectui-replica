<style>
:root{
  --page:#fafaf9; --surface:#ffffff; --ink:#171717; --ink-2:#1c1917;
  --muted:#78716c; --text:#57534e; --faint:#a8a29e;
  --subtle:#f5f5f4; --wash:rgba(23,23,23,.05); --border:#e7e5e4;
  --track:#ebebeb; --thumb:#ffffff;
  --accent:#0284c7; --accent-soft:#eef7ff;
  --featured-line:rgba(2,132,199,.32); --featured-glow:rgba(2,132,199,.08);
  --cta:#171717; --cta-hover:#2a2a2a; --on-cta:#fdfdfd;
  --tile:#ffffff; --tile-line:rgba(23,23,23,.1); --tile-filled:rgba(0,0,0,.06);
  --focus:rgba(0,96,226,.7);
  --r-lg:16px; --r:10px; --r-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --thumb-shadow:0 0 0 1px rgba(23,23,23,.06),0 1px 3px rgba(23,23,23,.1);
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --ink:#ededed; --ink-2:#ededed;
  --muted:#a1a1aa; --text:#c4c4c4; --faint:#6b6b70;
  --subtle:#26262a; --wash:rgba(255,255,255,.06); --border:#2e2e33;
  --track:rgba(255,255,255,.06); --thumb:#313135;
  --accent:#4fb0fe; --accent-soft:rgba(79,176,254,.16);
  --featured-line:rgba(79,176,254,.45); --featured-glow:rgba(79,176,254,.14);
  --cta:#ededed; --cta-hover:#ffffff; --on-cta:#121213;
  --tile:#2a2a2d; --tile-line:rgba(255,255,255,.08); --tile-filled:rgba(255,255,255,.1);
  --focus:rgba(77,141,255,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);
  --thumb-shadow:0 0 0 1px rgba(255,255,255,.08),0 1px 3px rgba(0,0,0,.45);
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:20px; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.page{min-height:100vh}
.topbar{display:flex;justify-content:flex-end;padding:12px 16px 0}
.theme-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;padding:0;border-radius:999px;cursor:pointer;
  background:var(--surface);color:var(--text);
  box-shadow:inset 0 0 0 1px var(--border);
  border:0;transition:transform 160ms ease,background-color 160ms ease;
}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.theme-btn svg{display:block}
.pp{width:100%;padding:36px 16px 56px;background:var(--page);color:var(--ink)}
.pp__head{text-align:center;max-width:640px;margin:0 auto}
.pp__title{margin:0;font-size:20px;font-weight:600;line-height:26px;letter-spacing:-.02em}
.pp__subtitle{margin:6px 0 0;font-size:16px;line-height:22px;color:var(--muted)}
.pp__switch{
  position:relative;display:grid;grid-template-columns:1fr 1fr;width:max-content;
  margin:20px auto 0;padding:3px;border-radius:var(--r);background:var(--track);
}
.pp__thumb{
  position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);
  border-radius:calc(var(--r) - 2px);background:var(--thumb);box-shadow:var(--thumb-shadow);
  transition:transform 380ms var(--ease);
}
.pp__switch[data-billing="yearly"] .pp__thumb{transform:translateX(100%)}
.pp__option{
  position:relative;min-width:68px;height:30px;padding:0 12px;cursor:pointer;
  border:0;border-radius:calc(var(--r) - 2px);background:none;font:inherit;
  font-size:14px;line-height:20px;color:var(--muted);transition:color 240ms ease;
}
.pp__option[aria-checked="true"]{color:var(--ink)}
.pp__option:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pp__empty{margin:24px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.pp__plans{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;
  max-width:1168px;margin:24px auto 0;
}
.pp__card{
  padding:16px;background:var(--surface);
  border:1px solid var(--border);border-radius:calc(var(--r-lg) - 2px);
  box-shadow:var(--shadow);transition:transform 180ms ease,box-shadow 180ms ease;
}
.pp__card[data-featured]{border-color:var(--featured-line);box-shadow:0 0 0 3px var(--featured-glow),var(--shadow)}
.pp__name{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:16px;font-weight:500;line-height:22px;letter-spacing:-.008em;color:var(--text)}
.pp__clip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp__planname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp__badge{flex:none;max-width:45%;padding:1px 8px;border-radius:999px;background:var(--accent-soft);font-size:12px;font-weight:500;line-height:18px;color:var(--accent)}
.pp__price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;margin:0 0 10px;line-height:20px}
.pp__amount{display:inline-flex;font-size:20px;font-weight:600;letter-spacing:-.028em}
.pp__digit{display:inline-block;animation:pp-roll 520ms var(--ease) both}
.pp__per{font-size:14px;font-weight:500;color:var(--text)}
.pp__rule{height:1px;margin:0 0 16px;border:0;background:var(--border)}
.pp__limits{display:grid;gap:12px;margin:0 0 16px;padding:0;list-style:none}
.pp__limits li{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;line-height:20px}
.pp__limit-label{display:flex;min-width:0;align-items:center;gap:8px;font-weight:500;color:var(--text)}
.pp__icon{display:grid;flex:none;place-items:center;color:var(--text)}
.pp__icon svg{display:block}
.pp__limit-label-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp__limit-value{flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;letter-spacing:-.014em}
.pp__cta{
  display:grid;place-items:center;width:100%;height:28px;padding:0;cursor:pointer;
  border:0;border-radius:calc(var(--r) - 2px);background:var(--cta);color:var(--on-cta);
  box-shadow:0 0 0 1px var(--cta),0 1px 3px rgba(0,0,0,.08);
  font:inherit;font-size:14px;font-weight:500;line-height:20px;
  transition:background-color 160ms ease,transform 160ms ease;
}
.pp__cta > span{max-width:100%;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp__cta:active{transform:scale(.99)}
.pp__cta:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pp__toggle{
  display:flex;align-items:center;gap:4px;width:max-content;height:24px;margin:8px auto 0;
  padding:0 6px 0 8px;border:0;border-radius:calc(var(--r-sm) + 1px);cursor:pointer;
  background:none;color:var(--text);font:inherit;font-size:13px;font-weight:500;line-height:18px;
  transition:background-color 160ms ease;
}
.pp__toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pp__chevron{transition:transform 320ms var(--ease)}
.pp__toggle[aria-expanded="false"] .pp__chevron{transform:rotate(180deg)}
.pp__details{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 460ms var(--ease),opacity 280ms ease}
.pp__details[data-open]{grid-template-rows:1fr;opacity:1}
.pp__details-inner{min-height:0;overflow:hidden;padding-top:16px}
.pp__section-head,.pp__section-sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pp__eyebrow{flex:none;font-size:12px;font-weight:500;line-height:12px;text-transform:uppercase;color:var(--text)}
.pp__chip{padding:2px 6px;border-radius:calc(var(--r-sm) - 1px);background:var(--wash);font-size:13px;font-weight:500;line-height:18px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.pp__section-sub{margin-top:10px;font-size:12px;font-weight:500;line-height:18px;color:var(--text)}
.pp__tag{flex:none;padding:0 6px;border-radius:calc(var(--r-sm) - 1px);background:var(--accent-soft);color:var(--accent)}
.pp__apps{display:grid;grid-template-columns:repeat(7,minmax(0,28px));gap:8px;margin-top:8px}
.pp__app{
  position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:7px;
  background:var(--tile);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--tile-line),inset 0 0 0 1px rgba(0,0,0,.1);
  font-size:11px;font-weight:700;line-height:1;
}
html[data-theme="dark"] .pp__app{box-shadow:inset 0 0 0 1px var(--tile-line),inset 0 0 0 1px rgba(255,255,255,.1)}
.pp__app[data-filled]{box-shadow:inset 0 0 0 1px var(--tile-filled)}
.pp__features{display:grid;gap:8px;margin:20px 0 0;padding:0;list-style:none}
.pp__features li{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:500;line-height:20px;color:var(--faint)}
.pp__features li[data-included]{color:var(--ink)}
.pp__mark{flex:none;margin-top:2px;color:var(--faint)}
.pp__features li[data-included] .pp__mark{color:var(--text)}
.pp__feature{min-width:0;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes pp-roll{from{opacity:0;transform:translateY(40%);filter:blur(2px)}}
@media (pointer:coarse){.pp__option{height:36px}.pp__cta{height:36px}.pp__toggle{height:36px}}
@media (max-width:860px){.pp__plans{grid-template-columns:minmax(0,1fr);max-width:420px}}
@media (prefers-reduced-motion:reduce){.pp__thumb,.pp__details,.pp__chevron{transition:none}.pp__digit{animation:none}}
@media (hover:hover) and (pointer:fine){
  .pp__card:hover{transform:translateY(-1px)}
  .pp__cta:hover{background:var(--cta-hover)}
  .pp__toggle:hover{background:var(--wash)}
  .theme-btn:hover{transform:translateY(-1px)}
}
</style>
</head>

}

  while(amountEl.firstChild)amountEl.removeChild(amountEl.firstChild);

      price.appendChild(amount);
      if(txt!=null){
        var per=document.createElement("span");per.setAttribute("class","pp__per");per.textContent="/per month";
        price.appendChild(per);
      }
      card.appendChild(price);
      refs.amounts.push(amount);
      var rule=document.createElement("hr");rule.setAttribute("class","pp__rule");card.appendChild(rule);
      var ul=document.createElement("ul");ul.setAttribute("class","pp__limits");
      for(var li=0;li<plan.limits.length;li++){
        (function(lim){
          var row=document.createElement("li");
          var lab=document.createElement("span");lab.setAttribute("class","pp__limit-label");
          var ic=document.createElement("span");ic.setAttribute("class","pp__icon");ic.appendChild(svgIcon(lim.kind));
          lab.appendChild(ic);
          var lt=document.createElement("span");lt.setAttribute("class","pp__limit-label-text");lt.textContent=lim.label;lt.title=lim.label;
          lab.appendChild(lt);
          row.appendChild(lab);
          var val=document.createElement("span");val.setAttribute("class","pp__limit-value pp__clip");val.textContent=lim.value;
          val.addEventListener("pointerenter",function(){clipTitle(val)});
          row.appendChild(val);
          ul.appendChild(row);
        })(plan.limits[li]);
      }
      card.appendChild(ul);
      var cta=document.createElement("button");
      cta.setAttribute("type","button");cta.setAttribute("class","pp__cta");
      var ctaIn=document.createElement("span");ctaIn.setAttribute("class","pp__clip");ctaIn.textContent=plan.cta||"Start free trial";
      ctaIn.addEventListener("pointerenter",function(){clipTitle(ctaIn)});
      cta.appendChild(ctaIn);
      cta.addEventListener("click",function(){
        if(refs.live)refs.live.textContent=plan.name+" · "+state.billing+" billing — trial started";
      });
      card.appendChild(cta);
      var tg=document.createElement("button");
      tg.setAttribute("type","button");tg.setAttribute("class","pp__toggle");
      tg.setAttribute("aria-expanded",state.open?"true":"false");
      var tgTx=document.createElement("span");tgTx.textContent=state.open?"Hide details":"Show details";
      tg.appendChild(tgTx);tg.appendChild(chevron());
      tg.addEventListener("click",function(){setOpen(!state.open)});
      card.appendChild(tg);
      refs.toggles.push(tg);refs.toggleLabels.push(tgTx);
      var det=document.createElement("div");det.setAttribute("class","pp__details");
      if(state.open)det.setAttribute("data-open","");
      try{if(!state.open)det.setAttribute("inert","")}catch(e){}
      var inner=document.createElement("div");inner.setAttribute("class","pp__details-inner");
      var rule2=document.createElement("hr");rule2.setAttribute("class","pp__rule");inner.appendChild(rule2);
      var head=document.createElement("div");head.setAttribute("class","pp__section-head");
      var eb=document.createElement("span");eb.setAttribute("class","pp__eyebrow");eb.textContent="Integrations";
      head.appendChild(eb);
      var chip=document.createElement("span");chip.setAttribute("class","pp__chip pp__clip");chip.textContent=plan.sync;
      chip.addEventListener("pointerenter",function(){clipTitle(chip)});
      head.appendChild(chip);
      inner.appendChild(head);
      var sub=document.createElement("div");sub.setAttribute("class","pp__section-sub");
      var tag=document.createElement("span");tag.setAttribute("class","pp__tag");tag.textContent="Native sync";
      sub.appendChild(tag);
      var n=Math.min(plan.pick,APPS.length);
      if(n>0){
        var cnt=document.createElement("span");cnt.textContent="Choose "+n+" of "+APPS.length;
        sub.appendChild(cnt);
      }
      inner.appendChild(sub);
      var apps=document.createElement("div");apps.setAttribute("class","pp__apps");
      for(var ai=0;ai<APPS.length;ai++){
        (function(app){
          var t=document.createElement("span");
          t.setAttribute("class","pp__app");t.setAttribute("role","img");
          t.setAttribute("aria-label",app.name);t.title=app.name;t.textContent=app.glyph;
          if(app.background){t.setAttribute("data-filled","");try{t.style.background=app.background;if(app.light)t.style.color="#ffffff"}catch(e){}}
          apps.appendChild(t);
        })(APPS[ai]);
      }
      inner.appendChild(apps);
      if(plan.features.length){
        var fl=document.createElement("ul");fl.setAttribute("class","pp__features");
        for(var fi=0;fi<plan.features.length;fi++){
          (function(ft){
            var row=document.createElement("li");
            if(ft.included)row.setAttribute("data-included","");
            row.appendChild(markIcon(!!ft.included));
            var f=document.createElement("span");f.setAttribute("class","pp__feature");f.textContent=ft.label;
            row.appendChild(f);
            var s=document.createElement("span");s.setAttribute("class","sr");s.textContent=ft.included?"(included)":"(not included)";
            row.appendChild(s);
            fl.appendChild(row);
          })(plan.features[fi]);
        }
        inner.appendChild(fl);
      }
      det.appendChild(inner);
      card.appendChild(det);
      refs.details.push(det);
      host.appendChild(card);
      refs.cards.push(card);
    })(PLANS[pi]);
  }
}
function currentTheme(){
  return document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
}
function paintTheme(){
  var dark=currentTheme()==="dark";
  var btn=document.getElementById("themeBtn");
  var moon=document.getElementById("themeIconMoon"),sun=document.getElementById("themeIconSun");
  if(moon&&sun){moon.style.display=dark?"none":"";sun.style.display=dark?"":"none"}
  if(btn){
    btn.setAttribute("aria-pressed",dark?"true":"false");
    btn.setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
  }
}
function init(){
  refs.switchBox=document.getElementById("ppSwitch");
  refs.live=document.getElementById("ppLive");
  var opts=refs.switchBox.querySelectorAll('[data-period]');
  refs.options=[];
  for(var i=0;i<opts.length;i++)refs.options.push(opts[i]);
  for(var k=0;k<refs.options.length;k++){
    (function(btn){
      var period=btn.getAttribute("data-period");
      btn.addEventListener("click",function(){setBilling(period,false)});
      btn.addEventListener("keydown",function(ev){
        var key=ev.key||"";
        var target=null;
        if(key==="Home")target="monthly";
        else if(key==="End")target="yearly";
        else if(key==="ArrowLeft"||key==="ArrowRight"||key==="ArrowUp"||key==="ArrowDown")target=(state.billing==="monthly")?"yearly":"monthly";
        if(target){
          if(ev.preventDefault)ev.preventDefault();
          if(target!==state.billing)setBilling(target,false);
          if(opts&&opts.focus)setBillingFocus(target);
        }
      });
    })(refs.options[k]);
  }
  buildPlans();
  setBilling(state.billing,false);
  setOpen(state.open);
  paintTheme();
  var tb=document.getElementById("themeBtn");
  if(tb)tb.addEventListener("click",function(){
    var next=currentTheme()==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem(THEME_KEY,next)}catch(e){}
    paintTheme();
  });
  try{
    var mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
    if(mq&&mq.addEventListener)mq.addEventListener("change",function(){
      var stored=null;try{stored=localStorage.getItem(THEME_KEY)}catch(e){}
      if(stored)return;
      document.documentElement.setAttribute("data-theme",mq.matches?"dark":"light");
      paintTheme();
    });
  }catch(e){}
}
function setBillingFocus(period){
  for(var i=0;i<refs.options.length;i++){
    if(refs.options[i].getAttribute("data-period")===period){try{refs.options[i].focus()}catch(e){}break}
  }
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",init)}else{init()}
window.__pp={state:state,refs:refs,setBilling:setBilling,setOpen:setOpen,formatPrice:formatPrice};
})();
</script>
</body>
</html>
