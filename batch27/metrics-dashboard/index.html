<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrics Dashboard — Sales overview</title>
<meta name="color-scheme" content="light dark">
<script>/*noflash*/(function(){try{var k="md-theme";var s=null;try{s=localStorage.getItem(k)}catch(e){}var t=s;if(!t||(t!=="light"&&t!=="dark")){try{t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){t="light"}}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<style>
:root{
  --page:#fafaf9; --surface:#ffffff; --tray:#f0efed; --ink:#1c1917; --text:#44403c;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4; --card-line:#e7e5e4; --line:#ececec;
  --accent:#2f9df0; --accent-soft:#f3f6ff; --thumb:#ffffff; --chip:#ffffff;
  --focus:rgba(0,96,226,.7); --good:#15803d; --good-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --ease:cubic-bezier(.65,0,.25,1); --spring:cubic-bezier(.34,1.3,.64,1);
}
html[data-theme="dark"]{
  --page:#101012; --surface:#1c1c1f; --tray:#161618; --ink:#ededed; --text:#c4c4c4;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33; --card-line:rgba(255,255,255,.08); --line:rgba(255,255,255,.07);
  --accent:#4fb0fe; --accent-soft:rgba(79,176,254,.12); --thumb:#313135; --chip:#2a2a2d;
  --focus:rgba(77,141,255,.8); --good:#4ade80; --good-bg:rgba(74,222,128,.12); --bad:#f87171; --bad-bg:rgba(248,113,113,.12);
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
html{-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums;
}
img{box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
html[data-theme="dark"] img{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.page{max-width:880px; margin:24px auto 40px; padding:0 16px}
.page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:0 0 12px}
.page-head h1{margin:0; font-size:16px; font-weight:650; letter-spacing:-.01em}
.page-head p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}
.theme-btn{display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 12px 0 10px;
  border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text);
  font-size:13px; font-weight:550; cursor:pointer; box-shadow:var(--shadow); transition:transform 160ms ease, background-color 160ms ease}
.theme-btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
/* concentric radius: outer 22 = inner 16 + padding 6 */
.dash{background:var(--tray); border-radius:22px; padding:0 6px 6px}
.dash-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 8px 12px 14px}
.dash-heading{display:flex; flex-direction:column; gap:1px; min-width:0}
.dash-title,.dash-site{overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.dash-title{font-size:15px; font-weight:650; letter-spacing:-.01em}
.dash-site{font-size:12.5px; color:var(--muted)}
.dash-actions{display:flex; flex:none; align-items:center; gap:8px}
.seg{position:relative; display:grid; padding:3px; border-radius:var(--radius); background:var(--subtle)}
.seg-range{grid-template-columns:repeat(3,64px)}
.seg-thumb{position:absolute; top:3px; left:3px; width:64px; height:calc(100% - 6px);
  border-radius:calc(var(--radius) - 3px); background:var(--thumb);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04); transition:transform 420ms var(--spring)}
.seg button{position:relative; height:28px; padding:0; border:0; border-radius:calc(var(--radius) - 3px);
  background:none; font-size:12.5px; font-weight:550; color:var(--muted); cursor:pointer; transition:color 200ms ease}
.seg button[aria-checked="true"]{color:var(--ink)}
.seg button:focus-visible,.export-btn:focus-visible,.kpi:focus-visible,.theme-btn:focus-visible,.kind button:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.export-btn{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px 0 10px;
  border:1px solid var(--card-line); border-radius:var(--radius); background:var(--chip); color:var(--text);
  font-size:13px; font-weight:550; cursor:pointer; box-shadow:var(--shadow); transition:background-color 160ms ease, transform 160ms ease}
.export-btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
/* inner card 16 + padding 6 = outer 22 (concentric) */
.dash-card{overflow:hidden; border:1px solid var(--card-line); border-radius:var(--radius-lg); background:var(--surface); box-shadow:var(--shadow)}
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-bottom:6px}
.kpi{position:relative; text-align:left; min-width:0; padding:12px 12px 11px; border:1px solid var(--card-line);
  border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); cursor:pointer;
  transition:transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease; font:inherit; color:inherit}
.kpi[aria-selected="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.kpi-label{display:block; font-size:12.5px; color:var(--muted); overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.kpi-value{display:block; margin-top:2px; font-size:19px; font-weight:650; letter-spacing:-.01em; font-variant-numeric:tabular-nums; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.kpi-delta{display:inline-flex; align-items:center; gap:4px; margin-top:4px; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
.kpi-delta.good{background:var(--good-bg); color:var(--good)}
.kpi-delta.bad{background:var(--bad-bg); color:var(--bad)}
.kpi-delta.flat{background:var(--subtle); color:var(--muted)}
.chart-sec{padding:16px 18px; border-bottom:1px solid var(--line)}
.chart-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; margin-bottom:14px}
.legend{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:550; color:var(--text)}
.legend i{width:14px; height:2.5px; border-radius:2px; background:var(--accent)}
.chart-tools{display:flex; align-items:center; gap:14px}
.kind{position:relative; display:grid; grid-template-columns:30px 30px; padding:2px; border-radius:calc(var(--radius) - 1px); background:var(--subtle)}
.kind-thumb{position:absolute; top:2px; left:2px; width:30px; height:calc(100% - 4px); border-radius:calc(var(--radius) - 3px);
  background:var(--thumb); box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04); transition:transform 380ms var(--spring)}
.kind button{position:relative; display:grid; place-items:center; height:24px; padding:0; border:0; background:none; color:var(--muted); cursor:pointer; transition:color 200ms ease}
.kind button[aria-checked="true"]{color:var(--ink)}
.kind svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kind circle{fill:var(--thumb)}
.compare{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none}
.compare input{position:absolute; opacity:0; pointer-events:none}
.switch{position:relative; width:28px; height:16px; border-radius:999px; background:#d9d9d9; transition:background-color 200ms ease; flex:none}
html[data-theme="dark"] .switch{background:#3a3a3e}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform 300ms var(--spring)}
.compare input:checked + .switch{background:var(--accent)}
.compare input:checked + .switch::after{transform:translateX(12px)}
.compare input:focus-visible + .switch{outline:2px solid var(--focus); outline-offset:2px}
.chart-box{position:relative}
.chart-box svg{display:block; width:100%; height:200px}
.tip{position:absolute; z-index:2; min-width:130px; max-width:220px; padding:8px 10px; border:1px solid var(--border);
  border-radius:var(--radius-sm); background:var(--surface); box-shadow:var(--shadow); font-size:12px; pointer-events:none}
.tip-title{display:block; color:var(--muted); margin-bottom:2px}
.tip-val{display:block; font-weight:650; font-size:13.5px; font-variant-numeric:tabular-nums}
.tip-prev{display:block; color:var(--muted); font-variant-numeric:tabular-nums}
.chart-empty{margin:0; padding:18px 4px; font-size:13px; color:var(--muted)}
.lists{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.list{min-width:0; padding:14px 12px 12px}
.list + .list{border-left:1px solid var(--line)}
.list-head{display:flex; justify-content:space-between; padding:0 8px 8px; font-size:12.5px; font-weight:550}
.list-head span + span{font-weight:400; color:var(--muted)}
.list ul{display:grid; grid-template-columns:minmax(0,1fr); gap:2px; margin:0; padding:0; list-style:none}
.row{position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:32px;
  padding:6px 8px; font-size:13px; line-height:20px}
.row-bar{position:absolute; left:0; top:0; bottom:0; border-radius:8px; background:var(--accent-soft); transition:width 600ms var(--ease)}
.row-name{position:relative; min-width:0; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow-wrap:anywhere; color:var(--text)}
.row-value{position:relative; flex:none; font-variant-numeric:tabular-nums; color:var(--ink)}
.list-empty{margin:0; padding:6px 8px 8px; font-size:13px; color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr}
  .lists{grid-template-columns:minmax(0,1fr)}
  .list + .list{border-left:0; border-top:1px solid var(--line)}
  .compare{font-size:0; gap:0}
  .compare::after{content:"Compare"; font-size:12.5px; margin-left:8px}
}
@media (max-width:460px){
  .dash-bar{flex-wrap:wrap; padding:12px 4px 12px 10px}
  .dash-actions{width:100%}
  .seg-range{flex:1; grid-template-columns:repeat(3,1fr)}
  .seg-thumb{width:calc((100% - 6px) / 3)}
  .chart-sec{padding:14px 12px 10px}
  .chart-box svg{height:168px}
}
@media (pointer:coarse){
  .seg button{height:30px}
  .export-btn{height:36px}
  .kind{grid-template-columns:34px 34px}
  .kind-thumb{width:34px}
  .kind button{height:32px}
  .compare{min-height:36px}
  .switch{width:36px; height:20px}
  .switch::after{width:16px; height:16px}
  .compare input:checked + .switch::after{transform:translateX(16px)}
  .row{min-height:36px; padding-top:8px; padding-bottom:8px}
}
@media (prefers-reduced-motion:reduce){
  .seg-thumb,.kind-thumb,.row-bar,.switch::after{transition:none}
}
@media (hover:hover) and (pointer:fine){
  .kpi:hover{transform:translateY(-1px)}
  .export-btn:hover{background:var(--subtle)}
  .theme-btn:hover{background:var(--subtle)}
  .seg button:hover{color:var(--ink)}
  .kind button:hover{color:var(--ink)}
  .row:hover .row-name{color:var(--ink)}
}
</style>
</head>
<body>
<div class="page">
  <header class="page-head">
    <div>
      <h1>Metrics Dashboard</h1>
      <p>Analytics &middot; Sales overview</p>
    </div>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="Switch to dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true" id="themeIcon"><path d="M12 4a8 8 0 1 0 8 8 6.5 6.5 0 0 1-8-8Z"/></svg>
      <span id="themeLabel">Dark</span>
    </button>
  </header>
  <div id="app"></div>
  <p style="font-size:12px;color:var(--muted);margin:12px 4px 0">Demo data is seeded (180 days). Ranges: Week / Month / Quarter. Select a KPI to switch the trend metric.</p>
</div>
<script>
(function(){
"use strict";
/* demo data verbatim: ranges, metrics, products, channels */
var RANGES=[{key:"7d",label:"Week",days:7},{key:"30d",label:"Month",days:30},{key:"90d",label:"Quarter",days:90}];
var METRICS=[
  {key:"revenue",label:"Revenue",kind:"money",zoom:false,goodWhen:"up"},
  {key:"orders",label:"Orders",kind:"count",zoom:false,goodWhen:"up"},
  {key:"aov",label:"Avg. order",kind:"money",zoom:true,goodWhen:"up"},
  {key:"refunds",label:"Refund rate",kind:"rate",zoom:true,goodWhen:"down"}
];
var PRODUCTS=[
  {name:"Linen overshirt",share:0.22},{name:"Everyday tote",share:0.16},
  {name:"Merino crew",share:0.13},{name:"Canvas sneaker",share:0.09},{name:"Wool beanie",share:0.06}
];
var CHANNELS=[
  {name:"Online store",share:0.46},{name:"Instagram",share:0.21},
  {name:"Marketplace",share:0.14},{name:"Wholesale",share:0.11},{name:"Pop-up",share:0.05}
];
var TITLE="Sales", SITE="Northwind Store", CURRENCY="USD";

/* seeded daily series: same LCG + weekday + drift as demo */
function genDaily(){
  var seed=7;
  function rnd(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }
  var base=new Date(); base.setHours(12,0,0,0);
  var out=[];
  for(var r=0;r<180;r++){
    var d=new Date(base); d.setDate(base.getDate()-(179-r));
    var a=92+r*0.32;
    var dow=[1.22,0.82,0.86,0.9,0.96,1.1,1.3][d.getDay()];
    var s=Math.round(a*dow*(0.88+rnd()*0.24));
    var price=61+r*0.03+(rnd()-0.5)*8;
    var refunded=Math.round(s*(0.026-r*0.00003+(rnd()-0.5)*0.012));
    if(refunded<0) refunded=0;
    out.push({date:d,revenue:Math.round(s*price),orders:s,refunded:refunded});
  }
  return out;
}
var DAILY=genDaily();
function num(v){ return Number.isFinite(v)?v:0; }
function sumRows(rows,key){
  var rev=0,ord=0,ref=0,i;
  for(i=0;i<rows.length;i++){ rev+=num(rows[i].revenue); ord+=num(rows[i].orders); ref+=num(rows[i].refunded); }
  if(key==="revenue") return rev;
  if(key==="orders") return ord;
  if(key==="aov") return ord?rev/ord:0;
  return ord?ref/ord*100:0;
}
function fmtDay(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function fmtTip(d){ return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function bucketize(rows,days,key){
  var cur=rows.slice(-days), prev=rows.slice(-days*2,-days);
  var step=days>31?7:1, out=[], i;
  for(i=0;i<cur.length;i+=step){
    var c=cur.slice(i,i+step), p=prev.slice(i,i+step), dt=c[0].date;
    out.push({
      label:fmtDay(dt),
      tip:step>1?("Week of "+fmtDay(dt)):fmtTip(dt),
      value:sumRows(c,key),
      previous:p.length?sumRows(p,key):null
    });
  }
  return {points:out, cur:cur, prev:prev};
}
/* formatters (Intl cache mirrors demo behaviour) */
var fmtCache=new Map();
function fmts(cur){
  var f=fmtCache.get(cur);
  if(!f){
    function mk(o){ try{ return new Intl.NumberFormat("en-US",Object.assign({style:"currency",currency:cur},o)); }catch(e){ return new Intl.NumberFormat("en-US",Object.assign({style:"currency",currency:"USD"},o)); } }
    f={
      money:mk({minimumFractionDigits:0,maximumFractionDigits:0}),
      cents:mk({minimumFractionDigits:2,maximumFractionDigits:2}),
      count:new Intl.NumberFormat("en-US",{maximumFractionDigits:0}),
      tick:new Intl.NumberFormat("en-US",{notation:"compact",maximumFractionDigits:1}),
      moneyTick:mk({notation:"compact",maximumFractionDigits:1,minimumFractionDigits:0}),
      short:new Intl.NumberFormat("en-US",{notation:"compact",maximumFractionDigits:2}),
      moneyShort:mk({notation:"compact",maximumFractionDigits:2,minimumFractionDigits:0})
    };
    fmtCache.set(cur,f);
  }
  return f;
}
var fmt1=new Intl.NumberFormat("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
function fmtFull(key,v){
  if(!Number.isFinite(v)) return "—";
  var F=fmts(CURRENCY);
  if(key==="refunds") return v.toFixed(1)+"%";
  if(key==="aov") return F.cents.format(v);
  if(key==="revenue") return F.money.format(Math.round(v));
  return F.count.format(Math.round(v));
}
function fmtCompact(key,v){
  var F=fmts(CURRENCY);
  if(key==="orders") return F.short.format(v);
  return F.moneyShort.format(v);
}
function fmtAxis(key,v){
  var F=fmts(CURRENCY);
  var r=Math.abs(v)<10?(Math.round(v*10)/10):Math.round(v);
  if(key==="refunds") return F.tick.format(r)+"%";
  if(key==="revenue"||key==="aov") return F.moneyTick.format(r);
  return F.tick.format(r);
}
function isLarge(key,v){ return key!=="refunds"&&Math.abs(v)>=1000000; }
function kpiText(key,v){ return isLarge(key,v)?fmtCompact(key,v):fmtFull(key,v); }

/* state */
var state={range:"30d",metric:"revenue",compare:false,chartType:"line",exported:false};
function rangeDef(){ for(var i=0;i<RANGES.length;i++) if(RANGES[i].key===state.range) return RANGES[i]; return RANGES[1]; }
function metricDef(){ for(var i=0;i<METRICS.length;i++) if(METRICS[i].key===state.metric) return METRICS[i]; return METRICS[0]; }

/* tiny dom helpers (no full re-render anywhere) */
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function svgEl(tag){ return document.createElementNS("http://www.w3.org/2000/svg",tag); }
function setChecked(btn,on){ btn.setAttribute("aria-checked",on?"true":"false"); btn.tabIndex=on?0:-1; }

var els={};
var rafKpi=0, rafList=[];
var displayed={kpi:{},prod:[],chan:[]};
function prefersReduced(){ try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }

function build(){
  var mount=null;
  try{ mount=document.getElementById("app"); }catch(e){ mount=null; }
  if(!mount) mount=document.body;
  var dash=el("div","dash"); dash.setAttribute("role","region"); dash.setAttribute("aria-label","Sales metrics dashboard");
  /* top bar */
  var bar=el("div","dash-bar");
  var head=el("div","dash-heading");
  var title=el("span","dash-title",TITLE); title.title=TITLE;
  var site=el("span","dash-site"); site.title=SITE;
  head.appendChild(title); head.appendChild(site);
  els.site=site;
  var actions=el("div","dash-actions");
  var seg=el("div","seg seg-range"); seg.setAttribute("role","radiogroup"); seg.setAttribute("aria-label","Period");
  var thumb=el("span","seg-thumb"); thumb.setAttribute("aria-hidden","true");
  seg.appendChild(thumb); els.rangeThumb=thumb; els.rangeBtns=[];
  RANGES.forEach(function(r,i){
    var b=el("button",null,r.label);
    b.type="button"; b.setAttribute("role","radio"); b.setAttribute("data-range",r.key);
    setChecked(b,state.range===r.key);
    b.addEventListener("click",function(){ setRange(r.key); });
    seg.appendChild(b); els.rangeBtns.push(b);
  });
  seg.addEventListener("keydown",function(e){ groupKeys(e,RANGES.map(function(r){return r.key;}),state.range,setRange,els.rangeBtns); });
  var exp=el("button","export-btn");
  exp.type="button";
  var svg=svgEl("svg"); svg.setAttribute("viewBox","0 0 24 24"); svg.setAttribute("aria-hidden","true");
  var path=svgEl("path");
  path.setAttribute("d","M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14");
  path.setAttribute("fill","none"); path.setAttribute("stroke","currentColor");
  path.setAttribute("stroke-width","1.8"); path.setAttribute("stroke-linecap","round"); path.setAttribute("stroke-linejoin","round");
  svg.appendChild(path);
  var lab=el("span",null,"Export"); lab.setAttribute("aria-live","polite");
  exp.appendChild(svg); exp.appendChild(lab);
  exp.addEventListener("click",doExport);
  els.exportBtn=exp; els.exportLabel=lab; els.exportIcon=path;
  actions.appendChild(seg); actions.appendChild(exp);
  bar.appendChild(head); bar.appendChild(actions);
  dash.appendChild(bar);
  /* card */
  var card=el("div","dash-card");
  var kpis=el("div","kpis"); kpis.setAttribute("role","tablist"); kpis.setAttribute("aria-label","Metric");
  els.kpiCards=[];
  METRICS.forEach(function(m){
    var b=el("button","kpi");
    b.type="button"; b.setAttribute("role","tab"); b.setAttribute("id","md-tab-"+m.key);
    b.setAttribute("aria-selected",state.metric===m.key?"true":"false");
    b.tabIndex=state.metric===m.key?0:-1;
    var l=el("span","kpi-label",m.label);
    var v=el("span","kpi-value","—");
    var d=el("span","kpi-delta flat","—");
    b.appendChild(l); b.appendChild(v); b.appendChild(d);
    b.addEventListener("click",function(){ setMetric(m.key); });
    kpis.appendChild(b);
    els.kpiCards.push({key:m.key,root:b,label:l,val:v,delta:d});
    displayed.kpi[m.key]=NaN;
  });

function groupKeys(e,keys,cur,setter,btns){
  var i=keys.indexOf(cur), n=keys.length, j=-1;
  if(e.key==="ArrowRight"||e.key==="ArrowDown") j=(i+1)%n;
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp") j=(i-1+n)%n;
  else if(e.key==="Home") j=0;
  else if(e.key==="End") j=n-1;
  if(j<0) return;
  if(e.preventDefault) e.preventDefault();
  setter(keys[j]);

function setRange(k){ if(state.range===k) return; state.range=k; refresh(true); }
function setMetric(k){ if(state.metric===k) return; state.metric=k; refresh(true); }
function setChartType(k){ if(state.chartType===k) return; state.chartType=k; refresh(false); }
function setCompare(on){ state.compare=!!on; if(els.compareInput.checked!==state.compare) els.compareInput.checked=state.compare; refresh(false); }
function doExport(){
  if(state.exported) return;
  state.exported=true;
  els.exportLabel.textContent="Exported";
  els.exportIcon.setAttribute("d","m5 12.5 4.5 4.5L19 7.5");
  window.setTimeout(function(){
    state.exported=false;
    els.exportLabel.textContent="Export";
    els.exportIcon.setAttribute("d","M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14");
  },1600);
}
var lastData=null;
function currentData(){
  var rd=rangeDef(), md=metricDef();
  var b=bucketize(DAILY,rd.days,md.key);
  return {rd:rd,md:md,pts:b.points,cur:b.cur,prev:b.prev,total:sumRows(b.cur,"revenue")};
}
function refresh(animated){
  var d=currentData(); lastData=d;
  /* header */
  els.site.textContent=SITE+" · Last "+d.rd.days+" days";
  els.site.title=SITE+" · Last "+d.rd.days+" days";
  var qi=RANGES.indexOf(d.rd);
  els.rangeBtns.forEach(function(b,i){ setChecked(b,i===qi); });
  els.rangeThumb.style.transform="translateX("+(qi*100)+"%)";
  els.legendLabel.textContent=d.md.label;
  setChecked(els.kindBtns[0],state.chartType==="line");
  setChecked(els.kindBtns[1],state.chartType==="bars");
  els.kindThumb.style.transform=state.chartType==="bars"?"translateX(100%)":"";
  if(els.compareInput.checked!==state.compare) els.compareInput.checked=state.compare;
  /* kpis */
  var hasPrev=d.prev.length>0&&d.prev.length===d.cur.length;
  els.kpiCards.forEach(function(c){
    var m=null, i;
    for(i=0;i<METRICS.length;i++) if(METRICS[i].key===c.key) m=METRICS[i];
    var cur=sumRows(d.cur,c.key);
    var prv=hasPrev?sumRows(d.prev,c.key):null;
    var rate=m.kind==="rate";
    var delta=(prv===null||(!rate&&prv===0))?null:(rate?(cur-prv):((cur-prv)/prv*100));
    var sel=c.key===state.metric;
    c.root.setAttribute("aria-selected",sel?"true":"false");
    c.root.tabIndex=sel?0:-1;
    c.label.textContent=m.label;
    animateKpi(c,cur);
    var txt="—", cls="kpi-delta flat", arrow="";
    if(delta!==null&&Number.isFinite(delta)){
      if(Math.abs(delta)<0.0005) delta=0;
      if(rate){ txt=(delta>=0?"+":"")+fmt1.format(delta)+" pts"; }
      else{ txt=(delta>=0?"+":"")+delta.toFixed(1)+"%"; }
      var good=m.goodWhen==="down"?delta<=0.0005:delta>=-0.0005;
      var bad=m.goodWhen==="down"?delta>0.0005:delta<-0.0005;
      if(Math.abs(delta)<0.05){ cls="kpi-delta flat"; }
      else if(good&&!bad){ cls="kpi-delta good"; }
      else{ cls="kpi-delta bad"; }
      arrow=delta>0.05?"↑":(delta<-0.05?"↓":"");
      if(arrow) txt=arrow+" "+txt;
    }
    if(c.delta.textContent!==txt) c.delta.textContent=txt;
    if(c.delta.className!==cls) c.delta.className=cls;

function animateKpi(c,target){
  var key=c.key;
  var from=displayed.kpi[key];
  if(!Number.isFinite(from)) from=target;
  displayed.kpi[key]=target;
  if(prefersReduced()||Math.abs(target-from)<1e-9){ c.val.textContent=kpiText(key,target); return; }
  try{ if(rafKpi) window.cancelAnimationFrame(rafKpi); }catch(e){}
  var t0=null, dur=500, start=from;
  function frame(t){
    if(t0===null) t0=t;
    var p=Math.min(1,(t-t0)/dur), e2=1-Math.pow(1-p,3);
    var v=start+(target-start)*e2;
    c.val.textContent=kpiText(key,v);
    if(p<1){ rafKpi=window.requestAnimationFrame(frame); }
  }
  /* animate only the selected card to avoid timer churn; others set directly */
  if(key===state.metric){ rafKpi=window.requestAnimationFrame(frame); }
  else{ c.val.textContent=kpiText(key,target); }
}
function updateChart(d){
  var pts=d.pts, n=pts.length, md=d.md;
  var W=600,H=200,padL=46,padR=10,padT=10,padB=26;
  var iw=W-padL-padR, ih=H-padT-padB, base=H-padB;
  els.chartSvg.setAttribute("viewBox","0 0 "+W+" "+H);
  els.chartSvg.setAttribute("aria-label",md.label+" over the last "+d.rd.days+" days");
  if(!n){ els.chartEmpty.style.display=""; return; }
  els.chartEmpty.style.display="none";
  var vals=pts.map(function(p){return p.value;});
  var prevs=state.compare?pts.map(function(p){return p.previous;}).filter(function(v){return v!==null&&Number.isFinite(v);}):[];
  var all=vals.concat(prevs);
  var mx=all.length?Math.max.apply(null,all):1, mn=all.length?Math.min.apply(null,all):0;
  var yMin=md.zoom?(mn-(mx-mn)*0.25):0;
  if(!md.zoom) yMin=0;
  if(yMin<0&&(md.key==="revenue"||md.key==="orders")) yMin=0;
  var yMax=mx+(mx-yMin)*0.08;
  if(!(yMax>yMin)){ yMax=yMin+1; }
  function X(i){ return n===1?(padL+iw/2):(padL+i/(n-1)*iw); }
  function Y(v){ return padT+ih-((v-yMin)/(yMax-yMin))*ih; }
  var t;
  for(t=0;t<4;t++){
    var tv=yMin+(yMax-yMin)*t/3;
    var yy=Y(tv);
    els.gridLines[t].setAttribute("x1",padL); els.gridLines[t].setAttribute("x2",W-padR);
    els.gridLines[t].setAttribute("y1",yy); els.gridLines[t].setAttribute("y2",yy);
    els.gridLines[t].style.display="";
    els.gridLabels[t].setAttribute("x",2); els.gridLabels[t].setAttribute("y",yy+3.5);
    var nt=fmtAxis(md.key,tv);
    if(els.gridLabels[t].textContent!==nt) els.gridLabels[t].textContent=nt;
    els.gridLabels[t].style.display="";
  }
  var i, sx;
  var show=6;
  for(i=0;i<30;i++){
    var on=i<n;
    var xt=els.xLabels[i], br=els.bars[i], dt=els.dots[i];
    if(!on){ xt.style.display="none"; br.style.display="none"; dt.style.display="none"; continue; }
    var showLabel=n<=8?true:(i%(Math.ceil(n/show))===0||i===n-1);
    if(showLabel){
      xt.style.display="";
      xt.setAttribute("x",X(i)); xt.setAttribute("y",H-8);
      if(xt.textContent!==pts[i].label) xt.textContent=pts[i].label;
    } else xt.style.display="none";
    var bw=n>1?(iw/n*0.55):28;
    if(state.chartType==="bars"){
      br.style.display="";
      var bh=Math.max(0,base-Y(pts[i].value));
      br.setAttribute("x",X(i)-bw/2); br.setAttribute("y",base-bh);
      br.setAttribute("width",bw); br.setAttribute("height",bh);
      dt.style.display="none";
    } else {
      br.style.display="none";
      dt.style.display="";
      dt.setAttribute("cx",X(i)); dt.setAttribute("cy",Y(pts[i].value));
    }
    dt.setAttribute("aria-label",pts[i].tip+": "+fmtFull(md.key,pts[i].value));
  }
  var dLine="", dArea="";
  for(i=0;i<n;i++){
    sx=X(i); var sy=Y(pts[i].value);
    dLine+=(i===0?"M":"L")+sx.toFixed(1)+" "+sy.toFixed(1);
    dArea+=(i===0?("M"+sx.toFixed(1)+" "+base+"L"+sx.toFixed(1)+" "+sy.toFixed(1)):("L"+sx.toFixed(1)+" "+sy.toFixed(1)));
  }
  dArea+="L"+X(n-1).toFixed(1)+" "+base+"Z";
  els.linePath.setAttribute("d",dLine);
  els.areaPath.setAttribute("d",dArea);
  els.linePath.style.display=state.chartType==="line"?"":"none";
  els.areaPath.style.display=state.chartType==="line"?"":"none";
  els.barsG.style.display=state.chartType==="bars"?"":"none";
  els.dotsG.style.display=state.chartType==="line"?"":"none";
  if(state.compare&&prevs.length){
    var dp="";
    for(i=0;i<n;i++){
      var pv=pts[i].previous;
      if(pv===null||!Number.isFinite(pv)) continue;
      sx=X(i);
      dp+=(dp===""?"M":"L")+sx.toFixed(1)+" "+Y(pv).toFixed(1);
    }
    els.prevPath.setAttribute("d",dp);
    els.prevPath.style.display="";
  } else els.prevPath.style.display="none";

}
function updateLists(d,animated){
  var maxP=0.0001, maxC=0.0001, i;
  for(i=0;i<PRODUCTS.length;i++) maxP=Math.max(maxP,PRODUCTS[i].share);
  for(i=0;i<CHANNELS.length;i++) maxC=Math.max(maxC,CHANNELS[i].share);
  for(i=0;i<PRODUCTS.length;i++){
    (function(idx){
      var row=els.prodRows[idx], target=d.total*PRODUCTS[idx].share;
      var w=Math.min(100,Math.max(0,PRODUCTS[idx].share/maxP*100));
      row.bar.style.width=w+"%";
      if(row.name.textContent!==PRODUCTS[idx].name) row.name.textContent=PRODUCTS[idx].name;
      tweenVal(row.val,displayed.prod,idx,target);
    })(i);
  }
  for(i=0;i<CHANNELS.length;i++){
    (function(idx){
      var row=els.chanRows[idx], target=d.total*CHANNELS[idx].share;
      var w=Math.min(100,Math.max(0,CHANNELS[idx].share/maxC*100));
      row.bar.style.width=w+"%";
      if(row.name.textContent!==CHANNELS[idx].name) row.name.textContent=CHANNELS[idx].name;
      tweenVal(row.val,displayed.chan,idx,target);
    })(i);
  }
}
function tweenVal(node,store,idx,target){
  var from=store[idx];
  if(!Number.isFinite(from)) from=target;
  store[idx]=target;
  if(prefersReduced()||from===target){ node.textContent=fmtFull("revenue",target); return; }
  var t0=null, dur=450, start=from;
  function frame(t){
    if(t0===null) t0=t;
    var p=Math.min(1,(t-t0)/dur), e2=1-Math.pow(1-p,3);
    node.textContent=fmtFull("revenue",start+(target-start)*e2);
    if(p<1) window.requestAnimationFrame(frame);
  }
  node.textContent=fmtFull("revenue",from);
  try{ window.requestAnimationFrame(frame); }catch(e){ node.textContent=fmtFull("revenue",target); }
}
/* tooltip (in-place only) */
var tipIdx=-1;
function showTip(i){
  if(!lastData||i<0||i>=lastData.pts.length) return;
  tipIdx=i;
  var p=lastData.pts[i], md=lastData.md;
  els.tipT.textContent=p.tip;
  els.tipV.textContent=md.label+": "+fmtFull(md.key,p.value);
  els.tipP.textContent=(state.compare&&p.previous!==null)?("Previous: "+fmtFull(md.key,p.previous)):"";
  els.tipP.style.display=(state.compare&&p.previous!==null)?"":"none";
  els.tip.style.display="";
  try{
    var r=els.chartSvg.getBoundingClientRect?els.chartSvg.getBoundingClientRect():null;
    if(r&&r.width){
      var frac=lastData.pts.length===1?0.5:i/(lastData.pts.length-1);
      els.tip.style.left=Math.min(70,Math.max(0,frac*100))+"%";
      els.tip.style.top="0px";
    }
  }catch(e){}
}
function hideTip(){ tipIdx=-1; if(els.tip) els.tip.style.display="none"; }
/* theme */
var THEME_KEY="md-theme";
function themeInit(){
  var t=null;
  try{ t=localStorage.getItem(THEME_KEY); }catch(e){}
  if(t!=="light"&&t!=="dark"){
    try{ t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"; }catch(e){ t="light"; }
  }
  applyTheme(t,false);
}
function applyTheme(t,save){
  document.documentElement.setAttribute("data-theme",t);
  var btn=null,lab=null;
  try{ btn=document.getElementById("themeToggle"); lab=document.getElementById("themeLabel"); }catch(e){}
  if(lab) lab.textContent=t==="dark"?"Light":"Dark";
  if(btn) btn.setAttribute("aria-label",t==="dark"?"Switch to light theme":"Switch to dark theme");
  if(save){ try{ localStorage.setItem(THEME_KEY,t); }catch(e){} }
}
function toggleTheme(){
  var cur="light";
  try{ cur=document.documentElement.getAttribute("data-theme")||"light"; }catch(e){}
  applyTheme(cur==="dark"?"light":"dark",true);
}
try{
  build();
  refresh(false);
  /* settle animated text synchronously for first paint + tests */
  (function(){
    var d=lastData; if(!d) return;
    els.kpiCards.forEach(function(c){
      var cur=sumRows(d.cur,c.key);
      displayed.kpi[c.key]=cur;
      c.val.textContent=kpiText(c.key,cur);

    els.chanRows.forEach(function(r,i){ var v=d.total*CHANNELS[i].share; displayed.chan[i]=v; r.val.textContent=fmtFull("revenue",v); });
  })();
  themeInit();
  try{
    var tb=document.getElementById("themeToggle");
    if(tb) tb.addEventListener("click",toggleTheme);
  }catch(e){}
  window.__md={state:state,els:els,setRange:setRange,setMetric:setMetric,setChartType:setChartType,
    setCompare:setCompare,toggleTheme:toggleTheme,refresh:refresh,showTip:showTip,
    data:function(){return lastData;},RANGES:RANGES,METRICS:METRICS,PRODUCTS:PRODUCTS,CHANNELS:CHANNELS};
}catch(err){
  try{ window.__mdError=String(err&&err.stack||err); }catch(e){}
}
