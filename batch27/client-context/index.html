<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<script>/*noflash*/(function(){try{var k='client-context-theme';var t=null;try{t=localStorage.getItem(k)}catch(e){}if(!t){try{if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){t='dark'}else{t='light'}}catch(e){t='light'}}document.documentElement.setAttribute('data-theme',t||'light')}catch(e){}})();</script>
<title>Client Context — affectUI replica</title>
<style>
:root{
  --surface:#ffffff; --page:#fafaf9; --ink:#171717; --ink2:#1c1917;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --pop:0 0 0 1px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.10);
  --accent:#0190fe; --accent-soft:rgba(1,144,254,.10);
  --good:#1e8a4f; --bad:#c21f78;
  --amber:#f59e0b; --amber-bg:#fef3c7; --amber-tx:#92400e;
  --focus:rgba(0,96,226,.7);
  --thumb:#ffffff; --track:rgba(0,0,0,.05);
  --btn-top:#323137; --btn-bot:#201e25; --btn-ring:#0d0d0d; --btn-tx:#ffffff;
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --pop:0 0 0 1px rgba(255,255,255,.06),0 16px 40px rgba(0,0,0,.5);
  --accent:#4fb0fe; --accent-soft:rgba(79,176,254,.16);
  --good:#5fc88a; --bad:#ff8a7a;
  --amber:#fbbf24; --amber-bg:#451a03; --amber-tx:#fde68a;
  --focus:rgba(77,141,255,.8);
  --thumb:#313135; --track:rgba(255,255,255,.06);
  --btn-top:#f4f4f5; --btn-bot:#e4e4e7; --btn-ring:rgba(0,0,0,.6); --btn-tx:#121213;
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5;
  font-variant-numeric:tabular-nums;
}
.page{max-width:960px;margin:0 auto;padding:20px 16px 48px}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.page-top h1{font-size:16px;margin:0;letter-spacing:-.01em}
.page-top p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.theme-btn{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.cx{background:var(--subtle);border-radius:calc(var(--radius-lg) + 8px);padding:0 6px 6px;box-shadow:var(--shadow);border:1px solid var(--border);container-type:inline-size;width:100%}
.cx-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 10px 14px 12px}
.cx-who{display:flex;align-items:center;gap:12px;min-width:0}
.cx-mark{display:grid;place-items:center;flex:none;border-radius:30%;font-weight:650;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);outline:1px solid rgba(0,0,0,.10);outline-offset:-1px}
html[data-theme="dark"] .cx-mark{box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);outline-color:rgba(255,255,255,.10)}
.cx-who-tx{display:grid;gap:2px;min-width:0}
.cx-name{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-actions{display:flex;align-items:center;gap:8px;flex:none}
.cx-chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;color:var(--ink);font-family:inherit}
.cx-chip:disabled{opacity:.6;cursor:default}
.cx-chip[data-active]{border-color:var(--accent);color:var(--accent)}
.cx-sync-dot{width:7px;height:7px;border-radius:50%;background:#29be6d;box-shadow:0 0 0 3px rgba(95,200,138,.18);flex:none}
.cx-sync-dot[data-state="syncing"]{background:var(--amber)}
.cx-spin{display:grid;color:var(--muted)}
.cx-spin[data-on] svg{animation:cxspin .9s linear infinite}
@keyframes cxspin{to{transform:rotate(360deg)}}
.cx-ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cx-pop{position:relative}
.cx-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:5;min-width:230px;max-width:320px;padding:5px;border-radius:calc(var(--radius-lg) - 2px);background:var(--surface);border:1px solid var(--border);box-shadow:var(--pop)}
.cx-menu--end{left:auto;right:0}
.cx-mi{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px 0 8px;border:0;border-radius:calc(var(--radius-sm) + 2px);background:transparent;text-align:left;cursor:pointer;color:var(--ink);font:inherit;font-size:13px}
.cx-mi-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-mi-count{color:var(--muted)}
.cx-mi-check{display:grid;width:15px;color:var(--accent)}
.cx-sep{height:1px;margin:5px 4px;background:var(--border)}
.cx-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}
.cx-kpi{display:grid;gap:10px;min-width:0;padding:14px 16px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.cx-kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),var(--shadow)}
.cx-kpi-l{font-size:12.5px;color:var(--ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-kpi-r{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.cx-kpi-v{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.cx-spark{flex:none;width:56px;height:22px;overflow:visible}
.cx-spark[data-wide]{width:84px}
.cx-spark path{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:cxdraw .7s ease forwards}
.cx-spark circle{opacity:0;animation:cxfade .24s ease forwards}
@keyframes cxdraw{to{stroke-dashoffset:0}}
@keyframes cxfade{to{opacity:1}}
.cx-card{border-radius:calc(var(--radius-lg) + 4px);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.cx-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.cx-seg{position:relative;display:grid;grid-template-columns:repeat(4,84px);padding:3px;border-radius:var(--radius);background:var(--track);border:1px solid var(--border)}
.cx-thumb{position:absolute;top:3px;left:3px;width:84px;height:calc(100% - 6px);border-radius:calc(var(--radius) - 3px);background:var(--thumb);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);transform:translateX(calc(var(--i,0)*100%));transition:transform 420ms cubic-bezier(.34,1.3,.64,1)}
.cx-seg button{position:relative;height:28px;padding:0 0 0 0;border:0;border-radius:calc(var(--radius) - 3px);background:none;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit}
.cx-seg button[aria-selected="true"]{color:var(--ink)}
.cx-tools{display:flex;align-items:center;gap:8px}
.cx-search{display:flex;align-items:center;gap:8px;width:220px;min-height:34px;padding:0 8px 0 11px;border-radius:var(--radius);background:var(--subtle);border:1px solid var(--border);color:var(--muted)}
.cx-search input{flex:1;min-width:0;height:100%;min-height:32px;border:0;outline:none;background:transparent;color:var(--ink);font:inherit}
.cx-search input::placeholder{color:var(--muted)}
.cx-clear{display:grid;place-items:center;width:20px;height:20px;padding:0;border:0;border-radius:4px;background:transparent;color:var(--muted);cursor:pointer}
.cx-panel{padding:22px 24px 26px}
.cx-compose{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:start}
.cx-ava{display:block;flex:none;border-radius:50%;object-fit:cover;background:var(--subtle);outline:1px solid rgba(0,0,0,.10);outline-offset:-1px}
html[data-theme="dark"] .cx-ava{outline-color:rgba(255,255,255,.10)}
.cx-ava--init{display:grid;place-items:center;color:var(--muted);font-weight:600}
.cx-box{position:relative;border-radius:calc(var(--radius-lg) - 2px);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.cx-box textarea{display:block;width:100%;min-height:62px;padding:12px 14px 4px;border:0;outline:none;resize:vertical;background:transparent;color:var(--ink);font:inherit;line-height:1.55}
.cx-box textarea::placeholder{color:var(--muted)}
.cx-sug{position:absolute;left:10px;top:calc(100% - 40px);z-index:4;min-width:220px;padding:5px;border-radius:calc(var(--radius-lg) - 4px);background:var(--surface);border:1px solid var(--border);box-shadow:var(--pop);list-style:none;margin:0}
.cx-files{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 2px}
.cx-fchip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 4px 0 8px;border-radius:8px;background:var(--subtle);border:1px solid var(--border);font-size:12px;max-width:100%}
.cx-fchip button{display:grid;place-items:center;width:20px;height:20px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px}
.cx-fname{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cx-bbar{display:flex;align-items:center;gap:8px;padding:8px 10px 10px}
.cx-ibtn{display:grid;place-items:center;width:30px;height:30px;padding:0 2px 0 0;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
.cx-ibtn:disabled{opacity:.4;cursor:default}
.cx-hint{display:inline-flex;gap:3px;margin-left:auto}
.cx-hint kbd{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:4px;background:var(--subtle);border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:11px}
.cx-primary{min-height:32px;padding:0 14px 0 12px;border:0;border-radius:calc(var(--radius) - 1px);background:linear-gradient(var(--btn-top),var(--btn-bot));box-shadow:0 0 0 1px var(--btn-ring),inset 0 1px 0 rgba(255,255,255,.14);color:var(--btn-tx);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit}
.cx-primary:disabled{opacity:.35;cursor:default}
.cx-tl{position:relative;margin:28px 0 0;padding:0;list-style:none}
.cx-tl::before{content:"";position:absolute;left:13.5px;top:14px;bottom:14px;width:1px;background:var(--border)}
.cx-item{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding-bottom:26px}
.cx-item:last-child{padding-bottom:0}
.cx-node{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.cx-line{display:flex;align-items:flex-start;gap:8px;min-height:20px;line-height:20px;color:var(--muted)}
.cx-line strong{color:var(--ink);font-weight:500}
.cx-main-tx{flex:1;min-width:0;overflow-wrap:anywhere}
.cx-when{flex:none;white-space:nowrap}
.cx-when::before{content:"·";margin-right:8px}
.cx-x{display:grid;place-items:center;flex:none;width:22px;height:22px;margin:-1px 0 0 auto;padding:0;border:0;border-radius:4px;background:transparent;color:var(--muted);opacity:0;cursor:pointer}
.cx-item:focus-within .cx-x,.cx-x:focus-visible{opacity:1}
.cx-note{margin-top:10px;padding:12px 14px;border-radius:calc(var(--radius-lg) - 4px);background:var(--subtle);border:1px solid var(--border);line-height:1.6;overflow-wrap:anywhere}
.cx-ref{display:inline;padding:0;border:0;background:none;color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;font:inherit}
button.cx-ref{cursor:pointer;text-align:left}
.cx-m{display:inline-flex;align-items:center;gap:4px;margin:0 1px;padding:0 6px 0 4px;border:0;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer;font:inherit;font-size:12.5px;max-width:100%}
.cx-m span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cx-file-ic{display:inline-block;width:12px;height:14px;margin:0 4px 0 2px;vertical-align:-2px}
.cx-empty{margin-top:28px;padding:22px;border-radius:calc(var(--radius-lg) - 2px);background:var(--subtle);border:1px solid var(--border);color:var(--muted);text-align:center}
.cx-empty--flush{margin-top:0}
.cx-list{overflow:hidden;border-radius:calc(var(--radius-lg) - 2px);border:1px solid var(--border);list-style:none;margin:0;padding:0}
.cx-list>li+li{border-top:1px solid var(--border)}
.cx-row{display:flex;align-items:center;gap:14px;min-height:66px;padding:12px 16px}
.cx-row-main{display:grid;gap:3px;flex:1;min-width:0;text-align:left}
.cx-row-main strong{overflow:hidden;font-weight:500;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}
.cx-row-main span{color:var(--muted);font-size:12.5px}
.cx-ric{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:var(--subtle);border:1px solid var(--border);color:var(--muted)}
.cx-rhead{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 16px;border:0;background:transparent;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.cx-chev{display:grid;color:var(--muted);transition:transform 300ms ease}
.cx-report[data-open] .cx-chev{transform:rotate(180deg)}
.cx-rbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows 320ms ease}
.cx-report[data-open] .cx-rbody{grid-template-rows:1fr}
.cx-rbody>div{overflow:hidden;padding:0 16px 0 62px}
.cx-rbody p{line-height:1.6;overflow-wrap:anywhere;margin:0 0 4px}
.cx-racts{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 18px}
.cx-fin button{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 16px;border:0;background:transparent;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.cx-dot{flex:none;width:8px;height:8px;border-radius:50%}
.cx-fin-v{display:grid;justify-items:end;gap:3px;min-width:84px;text-align:right}
.cx-fin-v strong{font-size:14px;font-weight:600}
.cx-fin-v span{font-size:12px;font-weight:500}
.cx-fin-v [data-trend="up"]{color:var(--good)}
.cx-fin-v [data-trend="down"]{color:var(--bad)}
.cx-tgl{position:relative;flex:none;width:36px;height:22px;padding:0;border:0;border-radius:999px;background:var(--border);cursor:pointer}
.cx-tgl span{position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.cx-tgl[aria-checked="true"]{background:var(--accent)}
.cx-tgl[aria-checked="true"] span{transform:translateX(14px)}
.cx-create{display:flex;gap:6px;padding:3px}
.cx-create input{flex:1;min-width:0;min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--subtle);color:var(--ink);font:inherit;outline:none}
.cx-plus{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--subtle);border:1px solid var(--border)}
button:focus-visible,.cx-chip:focus-visible,.cx-kpi:focus-visible,.cx-mi:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
mark{border-radius:3px;background:var(--accent-soft);color:inherit}
@media (hover: hover) and (pointer: fine){
  .theme-btn:hover{border-color:var(--muted)}
  .cx-chip:hover:not(:disabled){background:var(--subtle)}
  .cx-kpi:hover{border-color:var(--muted)}
  .cx-mi:hover,.cx-mi[aria-selected="true"]{background:var(--subtle)}
  .cx-clear:hover{background:var(--subtle);color:var(--ink)}
  .cx-ibtn:hover:not(:disabled){background:var(--subtle);color:var(--ink)}
  .cx-fchip button:hover{background:var(--subtle);color:var(--ink)}
  .cx-item:hover .cx-x{opacity:1}
  .cx-x:hover{background:var(--subtle);color:var(--bad)}
  button.cx-ref:hover{text-decoration-color:currentColor}
  .cx-m:hover{background:var(--subtle)}
  .cx-rhead:hover{background:var(--subtle)}
  .cx-fin button:hover{background:var(--subtle)}
}
@media (max-width:680px){
  .cx-head{flex-wrap:wrap}
  .cx-actions{width:100%}
  .cx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cx-bar{flex-direction:column;align-items:stretch}
  .cx-seg{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cx-thumb{width:calc((100% - 6px)/4)}
  .cx-tools{width:100%}
  .cx-search{flex:1;width:auto}
  .cx-panel{padding:18px 16px 20px}
  .cx-hint{display:none}
  .cx-rbody>div{padding-left:16px}
  .cx-fin .cx-spark{display:none}
}
@media (prefers-reduced-motion:reduce){
  .cx *,.cx *::before,.cx *::after{animation-duration:1ms !important;transition-duration:1ms !important}
}
</style>
</head>
<body>
<div class="page">
  <div class="page-top">
    <div>
      <h1>Client Context</h1>
      <p>Client workspace with live numbers, shared timeline, notes, files, switching.</p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle theme">◐ Theme</button>
  </div>
  <div id="app"></div>
</div>
