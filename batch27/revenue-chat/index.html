<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Revenue Chat — Q3 revenue review</title>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<script>/*noflash*/(function(){try{var k='rcb-theme';var s=null;try{s=localStorage.getItem(k)}catch(e){}var m=false;try{m=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches}catch(e){}var t=s||(m?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
:root{
  --surface:#ffffff; --page:#fafaf9; --ink:#171717; --ink2:#1c1917;
  --muted:#78716c; --subtle:#f5f5f4; --border:#e7e5e4;
  --radius-lg:16px; --radius:10px; --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 12px 32px -10px rgba(0,0,0,.25);
  --blue:#0190fe; --blue-soft:rgba(1,144,254,.10); --blue-line:rgba(1,144,254,.55);
  --violet:#a651f0; --teal:#13b3a0; --amber-t:#e8b000; --pink:#ee3e9e;
  --good:#1e7a47; --bad:#d72400; --amber:#f59e0b; --amber-bg:#fef3c7; --amber-tx:#92400e;
  --focus:rgba(0,96,226,.7);
  --card:var(--surface); --chip:var(--subtle); --hover:rgba(0,0,0,.04);
  --line:var(--border); --line-strong:rgba(0,0,0,.12); --edge:rgba(0,0,0,.09);
  --txt:rgba(0,0,0,.70); --faint:rgba(0,0,0,.36); --ph:rgba(0,0,0,.34);
  --ease:cubic-bezier(.23,1,.32,1);
}
html[data-theme="dark"]{
  --surface:#1c1c1f; --page:#101012; --ink:#ededed; --ink2:#ededed;
  --muted:#a1a1aa; --subtle:#26262a; --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 12px 32px -10px rgba(0,0,0,.6);
  --blue:#4fb0fe; --blue-soft:rgba(79,176,254,.12); --blue-line:rgba(79,176,254,.6);
  --violet:#b98af0; --teal:#4fc3b4; --amber-t:#e6c24d;
  --good:#7dcf9f; --bad:#ff8a7a;
  --amber:#fbbf24; --amber-bg:#451a03; --amber-tx:#fde68a;
  --focus:rgba(77,141,255,.8);
  --card:var(--surface); --chip:var(--subtle); --hover:rgba(255,255,255,.05);
  --line:var(--border); --line-strong:rgba(255,255,255,.14); --edge:rgba(255,255,255,.09);
  --txt:rgba(255,255,255,.74); --faint:rgba(255,255,255,.38); --ph:rgba(255,255,255,.36);
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button{margin:0;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
input:focus-visible{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--page) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{width:min(880px,calc(100% - 48px));margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 0}
.proj{display:flex;align-items:center;gap:10px;min-width:0}
.proj-mark{display:grid;grid-template-columns:repeat(3,3px);grid-auto-rows:3px;gap:1.5px;place-content:center;width:16px;height:16px;flex:none}
.proj-mark i{border-radius:.75px;background:var(--blue);opacity:1}
.proj-mark i.off{opacity:.18}
.proj-mark.working i{animation:pix 1.2s ease-in-out infinite both}
.proj-mark.working i:nth-child(2){animation-delay:.12s}.proj-mark.working i:nth-child(3){animation-delay:.24s}
.proj-mark.working i:nth-child(4){animation-delay:.12s}.proj-mark.working i:nth-child(6){animation-delay:.36s}
.proj-mark.working i:nth-child(7){animation-delay:.24s}.proj-mark.working i:nth-child(8){animation-delay:.36s}
.proj-mark.working i:nth-child(9){animation-delay:.48s}
@keyframes pix{0%,100%{opacity:1}50%{opacity:.2}}
.proj h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count-pill{font-size:12px;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 9px 2px;white-space:nowrap}
.count-pill b{color:var(--ink);font-weight:600}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.theme-btn{display:grid;place-items:center;width:32px;height:30px;padding-right:2px;border:1px solid var(--line);border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--muted)}
.theme-btn .moon{display:none}
html[data-theme="dark"] .theme-btn .sun{display:none}
html[data-theme="dark"] .theme-btn .moon{display:block}
/* thread */
.thread{flex:1;min-height:0;overflow-y:auto}
.col{width:min(760px,calc(100% - 48px));margin:0 auto;padding:32px 0 24px}
.turns{display:flex;flex-direction:column;gap:28px}
.colhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 -8px;font-size:12px;color:var(--muted);min-height:18px}
.colhead .ctx{margin-left:auto}
/* start card */
.start{display:grid;min-height:46vh;place-items:center}
.start-card{text-align:center;max-width:520px;padding:28px 24px 26px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.start-card h2{margin:6px 0 6px;font-size:16px;font-weight:600}
.start-card p{margin:0 0 4px;font-size:13.5px;color:var(--txt)}
.start-kicker{font-size:12px;color:var(--muted)}
/* user */
.urow{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ubub{align-self:flex-end;max-width:80%;margin:0;padding:9px 14px;border-radius:var(--radius-lg);background:var(--chip);border:1px solid var(--line);font-size:14px;line-height:21px;color:var(--ink);overflow-wrap:anywhere;animation:rise 320ms var(--ease) both}
.quote{display:inline-flex;align-items:center;gap:6px;max-width:80%;margin:0;padding:3px 10px 3px 8px;border-radius:8px;border:1px solid var(--line);border-left:none;box-shadow:inset 2px 0 0 var(--blue);background:var(--blue-soft);font-size:12.5px;line-height:18px;color:var(--txt);animation:rise 320ms var(--ease) both}
.quote svg{flex:none;color:var(--blue)}
/* answer */
.ans{display:flex;gap:12px;min-width:0}
.mark{display:grid;flex:none;grid-template-columns:repeat(3,3px);grid-auto-rows:3px;gap:1.5px;place-content:center;width:16px;height:16px;margin-top:3px}
.mark i{border-radius:.75px;background:rgba(0,96,226,.78);opacity:0}
html[data-theme="dark"] .mark i{background:rgba(77,141,255,.85)}
.mark i.on{opacity:1}
.mark.busy i{animation:pix 1.2s ease-in-out infinite both}
.mark.busy i:not(.on){opacity:.16}
.abody{display:grid;flex:1;gap:16px;min-width:0}
.atext{margin:0;font-size:14px;line-height:22px;color:var(--ink);overflow-wrap:anywhere}
.caret{display:inline-block;width:7px;height:14px;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--blue);animation:blink 900ms steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinkrow{display:flex;align-items:center;gap:12px}
.thinking{font-size:13px;background:linear-gradient(90deg,var(--muted) 0%,var(--muted) 40%,var(--ink) 50%,var(--muted) 60%,var(--muted) 100%) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.6s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.out{display:grid;gap:16px;min-width:0}
.out>.kpis,.out>.fig,.out>.splitwrap{margin-left:-28px}
.out:has(>.kpis,.fig,.splitwrap)>.foot,.out:has(>.kpis,.fig,.splitwrap)>.next{margin-left:-28px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0}
.kpi{display:grid;gap:2px;min-width:0;padding:12px 14px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:rise 420ms var(--ease) both}
.kpi-l{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{overflow:hidden;font-size:20px;font-weight:600;line-height:28px;white-space:nowrap;text-overflow:ellipsis}
.kpi-c{font-size:12px;line-height:16px;color:var(--bad)}
.kpi-c.good{color:var(--good)}
.fig{display:grid;gap:10px;margin:0;padding:14px 14px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);animation:rise 420ms var(--ease) 120ms both}
.fig-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:3px;border-radius:2px;background:var(--blue)}
.sw.dash{background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 5px)}
.chartbox{position:relative}
svg.chart{display:block;width:100%;height:190px;outline:none;border-radius:8px}
.hint{margin:0;font-size:12px;color:var(--faint)}
.hint .touch{display:none}
.fig:focus-within .hint .keys{display:inline}
.hint .keys{display:none}
/* split bars */
.splitwrap{display:grid;gap:8px;animation:rise 420ms var(--ease) 120ms both;margin:0}
.splitcard{padding:14px 14px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.split-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end;min-height:170px}
.bcol{display:grid;gap:6px;justify-items:center;min-width:0;border-radius:10px;padding:6px 4px 2px}
.bcol .stack{display:flex;flex-direction:column-reverse;width:min(64px,80%);border-radius:8px;overflow:hidden;outline:1px solid rgba(0,0,0,.06);outline-offset:-1px}
html[data-theme="dark"] .bcol .stack{outline-color:rgba(255,255,255,.10)}
.bcol .seg{display:block;width:100%}
.bcol .blab{font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bcol .bval{font-size:12px;color:var(--muted)}
.split-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.split-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
/* pick + ask */
.askable{position:relative}
.pick{position:absolute;z-index:1;background:var(--blue-soft);box-shadow:inset 1px 0 0 var(--blue-line),inset -1px 0 0 var(--blue-line);pointer-events:none}
.pick.bar{border-radius:10px;background:none;box-shadow:0 0 0 1.5px var(--blue)}
.askpop{position:absolute;z-index:5;display:grid;width:280px;max-width:70vw;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translate(-50%,calc(-100% - 10px));animation:askin 200ms var(--ease) both}
@keyframes askin{from{opacity:0;transform:translate(-50%,calc(-100% - 4px)) scale(.97)}}
.askpop form{display:flex;align-items:center;height:44px}
.askpop input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:13px;color:var(--ink)}
.askpop input::placeholder{color:var(--ph)}
/* foot */
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.srcs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.src{padding:0 7px;border-radius:6px;background:var(--chip);border:1px solid var(--line);font-size:12px;line-height:20px;color:var(--txt)}
.acts{display:flex;gap:2px;margin-left:auto}
.icobtn{position:relative;display:grid;place-items:center;width:28px;height:28px;padding-left:0;border-radius:7px;color:var(--muted);transition:background-color 150ms ease,color 150ms ease}
.icobtn.on{color:var(--good)}
.icobtn::after{content:attr(data-tip);position:absolute;z-index:3;top:calc(100% + 6px);left:50%;padding:3px 7px;border-radius:6px;background:var(--ink);font-size:12px;line-height:16px;color:var(--card);white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-2px);transition:opacity 120ms ease,transform 120ms ease}
.icobtn:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.next{display:flex;flex-wrap:wrap;gap:6px}
.next button{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:30px;padding:5px 8px 5px 12px;line-height:20px;overflow-wrap:anywhere;border-radius:9px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;color:var(--txt);text-align:left;transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease;animation:rise 360ms var(--ease) 300ms both}
.next button .arr{flex:none;color:var(--faint);font-size:13px;transform:translateX(1px)}
/* composer */
.composer{width:min(760px,calc(100% - 48px));margin:0 auto 20px}
.cbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.cbar input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:14px;color:var(--ink)}
.cbar input::placeholder{color:var(--ph)}
.sendbtn{display:grid;place-items:center;width:32px;height:32px;padding-right:2px;flex:none;border-radius:50%;background:var(--blue);color:#fff;font-size:16px;line-height:1}
.sendbtn:disabled{opacity:.45;cursor:default}
.cfoot{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;color:var(--faint)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
.skel{display:flex;align-items:center;gap:10px}
/* responsive */
@media (max-width:560px){
  .topbar-in{width:calc(100% - 24px)}
  .col,.composer{width:calc(100% - 24px)}
  .col{padding-top:20px}
  .ans{gap:0}
  .ans>.mark{display:none}
  .out>.kpis,.out>.fig,.out>.splitwrap{margin-left:0}
  .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .kpi:first-child:nth-last-child(3){grid-column:1/-1}
  .fig{padding:12px 10px 8px}
  .proj .meta{display:none}
}
@media (hover:none) and (pointer:coarse){
  .hint .mouse{display:none}
  .hint .touch{display:inline}
  .askpop input{font-size:16px}
}
@media (pointer:coarse){.next button{min-height:36px}.icobtn{width:36px;height:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v5: hover only on fine pointers */
@media (hover:hover) and (pointer:fine){
  .theme-btn:hover{color:var(--ink);border-color:var(--line-strong)}
  .icobtn:hover{background:var(--hover);color:var(--ink)}
  .icobtn:hover::after{opacity:1;transform:translate(-50%,0);transition-delay:400ms}
  .next button:hover{border-color:var(--line-strong);color:var(--ink)}
  .bcol:hover{background:var(--hover)}
  .sendbtn:not(:disabled):hover{filter:brightness(1.07)}
}
</style>
</head>
<body>
<div class="sr" aria-live="polite" id="live"></div>
<header class="topbar">
  <div class="topbar-in">
    <div class="proj">
      <span class="proj-mark" id="projMark" aria-hidden="true"><i></i><i class="off"></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i></i></span>

      </button>
    </div>
  </div>
</header>
<main class="thread" id="thread"><div class="col" id="col">
  <p class="colhead" id="colhead"><span>Revenue answers with charts</span><span class="ctx">44k / 200k</span></p>
  <div class="turns" id="turns"></div>

    </div>
  </div>
</div></main>
<div class="composer"><div class="cbar">
  <input id="composerInput" type="text" placeholder="Ask about revenue, customers or plans…" aria-label="Ask about revenue, customers or plans" enterkeyhint="send" dir="auto">
  <button class="sendbtn" id="sendBtn" type="button" aria-label="Send">↑</button>
</div><div class="cfoot"><span>Charts answer from Stripe + HubSpot</span><span>Enter to send</span></div></div>

  return [{label:"Revenue",values:chart.actual.concat(chart.forecast.slice(1).map(function(){return null;})),color:"var(--blue)",dash:null},
    {label:"Forecast",values:chart.actual.slice(0,-1).map(function(){return null;}).concat(chart.forecast),color:"var(--blue)",dash:true},
    {label:"Target",values:chart.labels.map(function(){return chart.target;}),color:"var(--good)",dash:"dot"}];
}
function linePath(vals,w,h,pad,max,min){

  return {d:d,pts:pts};
}

  cbox.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&sh.ask){ev.preventDefault();ev.stopPropagation();closeAsk(sh);sh.sel=null;start=null;return;}
    if(ev.key!=="Enter")return;ev.preventDefault();
    if(start==null){var anchor=sh.sel?sh.sel.from:0;if(turn.chart.kind==="trend"&&turn.chart.mark)anchor=turn.chart.mark.at;start=anchor;sh.sel={from:start,to:start};setPick(sh,fracRectLine(start,start,n),false);}
    else commit(start,sh.sel?sh.sel.to:start);});
  cbox.addEventListener("keyup",function(){});
  if(svg){svg.addEventListener("keydown",function(ev){
    if(start==null)return;
    if(ev.key==="ArrowLeft"||ev.key==="ArrowRight"){ev.preventDefault();var d=ev.key==="ArrowLeft"?-1:1;var t=Math.max(0,Math.min(n-1,(sh.sel?sh.sel.to:start)+d));sh.sel={from:Math.min(start,t),to:Math.max(start,t)};setPick(sh,fracRectLine(sh.sel.from,sh.sel.to,n),false);}});}
  document.addEventListener("pointerdown",function(ev){if(sh.ask&&!sh.ask.contains(ev.target)&&!cbox.contains(ev.target))closeAsk(sh);});
}
function wireSplitAsk(sh,turn){
  sh.askable.addEventListener("click",function(ev){
    var col=ev.target&&ev.target.closest?ev.target.closest(".bcol"):null;if(!col||!sh.askable.contains(col))return;
    var gi=parseInt(col.getAttribute("data-gi"),10)||0;sh.sel={from:gi,to:gi};
    var inf=selInfo(turn.chart,gi,gi);
    try{var ar=col.getBoundingClientRect?col.getBoundingClientRect():null;var hr=sh.askable.getBoundingClientRect?sh.askable.getBoundingClientRect():null;var cx=20+gi*20,L=gi*22+4;}catch(e){var cx2=20, L2=4;}
    openAsk(sh,turn,{label:inf.label,detail:inf.detail},{left:gi*22+4,top:2,width:16,height:70,cx:20+gi*20},true);
  });
  sh.askable.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&sh.ask){ev.preventDefault();ev.stopPropagation();closeAsk(sh);}});
}
/* typing: in-place text node updates only */
function typeInto(sh,turn,done){
  var words=turn.text.split(" ");sh.words=words;sh.turn=turn;
  var delay=reduced()?0:28;var i=sh.typed=0;sh.tn.nodeValue="";sh.caret.style.display="";sh.out.hidden=true;sh.mark.classList.add("busy");
  if(sh.timer){try{window.clearTimeout(sh.timer);}catch(e){}sh.timer=0;}
  function step(){
    if(i>=words.length){sh.caret.style.display="none";sh.mark.classList.remove("busy");sh.out.hidden=false;live.textContent="";try{thread.scrollTo({top:thread.scrollHeight,behavior:"auto"});}catch(e){}if(done)done();return;}
    i++;sh.typed=i;
    sh.tn.nodeValue=words.slice(0,i).join(" ");
    try{thread.scrollTo({top:thread.scrollHeight,behavior:"auto"});}catch(e){}
    sh.timer=window.setTimeout(step,delay);
  }
  if(delay===0){sh.tn.nodeValue=turn.text;sh.typed=words.length;sh.caret.style.display="none";sh.mark.classList.remove("busy");sh.out.hidden=false;if(done)done();return;}
  sh.timer=window.setTimeout(step,delay);
}
function replay(sh,turn){fillStatic(sh,turn);typeInto(sh,turn,null);}
function copyText(t){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(function(){});}catch(e){}live.textContent="Copied";window.setTimeout(function(){if(live.textContent==="Copied")live.textContent="";},1400);}
function downloadChart(sh,turn){try{var svg=sh.askable?sh.askable.querySelector("svg"):null;var s=svg?new XMLSerializer().serializeToString(svg):("<svg xmlns='http://www.w3.org/2000/svg'/>");var blob=new Blob([s],{type:"image/svg+xml"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="revenue-chart.svg";document.body.appendChild(a);a.click();window.setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}if(a.parentNode)a.parentNode.removeChild(a);},400);}catch(e){}}
/* turns */
function addUser(text,quote){var w=el("div","urow");if(quote)w.appendChild(el("p","quote",quote));var b=el("p","ubub",text);b.setAttribute("dir","auto");w.appendChild(b);turnsHost.insertBefore(w,thinkRow);turnSeq.push({kind:"user",el:w});setCount();try{thread.scrollTo({top:thread.scrollHeight,behavior:"smooth"});}catch(e){}return w;}
function addAnswer(turn,liveId){var sh=buildAnswerShell();turnsHost.insertBefore(sh.art,thinkRow);fillStatic(sh,turn);turnSeq.push({kind:"ans",el:sh.art,sh:sh,turn:turn});setCount();typeInto(sh,turn,function(){try{thread.scrollTo({top:thread.scrollHeight,behavior:"smooth"});}catch(e){}});if(liveId!=null){try{var h=document.getElementById("live");}catch(e){}}return sh;}
var C={"Split it by region":null,"Forecast Q4":null};
function answerFor(q,quote){
  var t=(q||"").trim();
  if(quote&&quote.chart)return drill(quote.chart,quote.from,quote.to,quote.label,quote.detail);
  if(t==="Split it by region")return {text:B_TEXT,chart:{kind:"split",title:B_TITLE,previous:B_PREV,since:B_SINCE,groups:B_GROUPS},caption:B_CAP,sources:B_SRC,next:B_NEXT};
  if(t==="Forecast Q4")return {text:X_TEXT,kpis:X_KPIS,chart:{kind:"forecast",labels:X_LABELS,actual:X_ACT,forecast:X_FC,target:X_TGT},caption:X_CAP,sources:X_SRC,next:X_NEXT};
  if(t==="How did revenue develop last quarter?")return {text:A1_TEXT,kpis:A1_KPIS,chart:{kind:"trend",labels:A1_LABELS,current:A1_CUR,previous:A1_PREV,mark:A1_MARK},caption:A1_CAP,sources:A1_SRC,next:A1_NEXT};
  return {text:FALLBACK,next:["Split it by region","Forecast Q4"]};
}
var sendSeq=0;
function send(text,quote){
  var t=(text||"").trim();if(!t||busy)return;setBusy(true);
  var qtxt=quote?quote.label+" \u00B7 "+quote.detail:null;
  addUser(t,qtxt);
  try{startWrap.hidden=true;}catch(e){startWrap.style.display="none";}
  var wait=reduced()?0:1400;
  window.setTimeout(function(){
    var ans=answerFor(t,quote);setBusy(false);addAnswer(ans,null);
  },wait);
}
/* start chips */
["How did revenue develop last quarter?","Split it by region","Forecast Q4"].forEach(function(q){
  var b=el("button",null);b.type="button";var sp=el("span",null,q);b.appendChild(sp);b.appendChild(el("span","arr","\u2197"));
  b.addEventListener("click",function(){
    if(q==="How did revenue develop last quarter?"&&turnSeq.length===0){
      setBusy(true);addUser(q,null);try{startWrap.hidden=true;}catch(e){startWrap.style.display="none";}
      var wait=reduced()?0:1400;window.setTimeout(function(){setBusy(false);addAnswer(answerFor(q,null),null);},wait);
    }else send(q,null);});
  startNext.appendChild(b);});
/* composer */
function submitComposer(){var v=input.value;if(!v.trim()||busy)return;input.value="";send(v,null);}
sendBtn.addEventListener("click",submitComposer);
input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submitComposer();}});
input.addEventListener("input",function(){sendBtn.disabled=!input.value.trim();});
sendBtn.disabled=true;
/* theme */
function curTheme(){try{return document.documentElement.getAttribute("data-theme")||"light";}catch(e){return "light";}}
function setTheme(t){try{document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("rcb-theme",t);}catch(e){}themeBtn.setAttribute("aria-label",t==="dark"?"Switch to light theme":"Switch to dark theme");var f=turnSeq.map(function(x){return x;});f.forEach(function(en){if(en.kind==="ans"&&en.sh.turn&&en.sh.turn.chart&&en.sh.turn.chart.kind!=="split"){var cb=en.sh.askable?en.sh.askable.querySelector(".chartbox"):null;if(cb)renderLineChart(cb,en.sh.turn.chart,en.sh.turn.caption);}});}catch(e){}}
themeBtn.addEventListener("click",function(){setTheme(curTheme()==="dark"?"light":"dark");});
try{themeBtn.setAttribute("aria-label",curTheme()==="dark"?"Switch to light theme":"Switch to dark theme");}catch(e){}
/* expose for harness */
try{window.__rcb={send:send,answerFor:answerFor,turns:function(){return turnSeq;},root:turnsHost,setTheme:setTheme,curTheme:curTheme,start:startWrap,selInfo:selInfo};}catch(e){}
/* seed nothing: start screen stays until user asks */
})();
