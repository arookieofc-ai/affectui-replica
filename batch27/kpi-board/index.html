<style>
:root{color-scheme:light dark}
html{-webkit-tap-highlight-color:transparent}
html[data-theme="light"]{
--surface:#ffffff;--page:#fafaf9;--ink:#171717;--ink2:#1c1917;--muted:#78716c;--subtle:#f5f5f4;--border:#e7e5e4;
--kb-card:#ffffff;--kb-line:#e7e5e4;--kb-ink:#171717;--kb-text:#44403c;--kb-muted:#78716c;--kb-well:#f5f5f4;
--kb-accent:#0284c7;--kb-accent-line:#0ea5e9;--kb-soft:#a9d9ff;--kb-good:#15803d;--kb-bad:#b91c1c;
--kb-focus:rgba(2,132,199,.55);--kb-amber-t:#92400e;--kb-amber-bg:#fef3c7;--kb-amber-b:#f59e0b;
--kb-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);--kb-pop:0 10px 28px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--ink2:#ededed;--muted:#a1a1aa;--subtle:#26262a;--border:#2e2e33;
--kb-card:#1c1c1f;--kb-line:#2e2e33;--kb-ink:#ededed;--kb-text:#c9c9cf;--kb-muted:#a1a1aa;--kb-well:#26262a;
--kb-accent:#4fb0fe;--kb-accent-line:#4fb0fe;--kb-soft:#0070d6;--kb-good:#5fc88a;--kb-bad:#ff8a7a;
--kb-focus:rgba(77,141,255,.8);--kb-amber-t:#fde68a;--kb-amber-bg:#451a03;--kb-amber-b:#fbbf24;
--kb-shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--kb-pop:0 12px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--kb-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.page{max-width:980px;margin:0 auto;padding:20px 16px 40px}
.kb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;container-type:inline-size;min-width:0}
.kb-bar{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:12px;min-height:30px;margin-bottom:4px}
.kb-heading{flex:1;min-width:0;margin:0;font-size:17px;line-height:24px;letter-spacing:-.01em;color:var(--kb-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-controls{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.kb-card{grid-column:span 2;display:flex;flex-direction:column;min-width:0;padding:16px;border:1px solid var(--kb-line);border-radius:20px;background:var(--kb-card);box-shadow:var(--kb-shadow);animation:kb-rise 620ms cubic-bezier(.32,.72,.24,1) both}
.kb-card[data-n="0"]{animation-delay:0ms}.kb-card[data-n="1"]{animation-delay:60ms}.kb-card[data-n="2"]{animation-delay:120ms}.kb-card[data-n="3"]{animation-delay:180ms}.kb-card[data-n="4"]{animation-delay:240ms}
.kb-wide{grid-column:span 4}
.kb-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0}
.kb-row--top{align-items:center;min-height:40px;margin-bottom:12px}
.kb-label{font-size:13px;color:var(--kb-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-focus-label{font-size:12.5px;color:var(--kb-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-figure{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:4px;font-variant-numeric:tabular-nums}
.kb-figure b{font-size:24px;line-height:30px;letter-spacing:-.02em;color:var(--kb-ink);font-weight:600}
.kb-figure--small b{font-size:19px;line-height:26px}
.kb-change{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--kb-bad);font-variant-numeric:tabular-nums}
.kb-change[data-good]{color:var(--kb-good)}
.kb-change svg{flex:none}
.kb-vs{display:inline-flex;align-items:baseline;gap:5px;min-width:0;max-width:100%;font-size:13px;color:var(--kb-muted);white-space:nowrap}
.kb-vs-text{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kb-vs .kb-change{font-size:13px}
.kb-chart{margin-top:10px;min-height:56px;min-width:0;overflow:hidden;max-width:100%}
.kb-chart svg{display:block;width:100%;max-width:100%;height:auto;overflow:hidden}
.kb-area{min-height:150px}
.kb-legend{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-top:12px;font-size:12.5px;color:var(--kb-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.kb-legend b{margin-right:6px;font-weight:500;color:var(--kb-accent)}
.kb-legend b[data-soft]{color:var(--kb-soft)}
html[data-theme="light"] .kb-legend b[data-soft]{color:#6aa9d6}
.kb-product{display:flex;align-items:center;gap:10px;min-width:0} /* optical nudge: icon side tighter */
.kb-product b{font-size:14.5px;font-weight:500;color:var(--kb-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-note{color:var(--kb-muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-pair{display:grid;min-width:0}
.kb-pair>*{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kb-icon{display:grid;place-items:center;width:36px;height:36px;flex:none;border:1px solid var(--kb-line);border-radius:10px;color:var(--kb-text);background:var(--kb-card);box-shadow:0 1px 1px rgba(0,0,0,.04);margin-right:-2px}
.kb-pick{position:relative;flex:0 1 auto;min-width:0;max-width:60%}
.kb-wide .kb-pick{max-width:220px}
.kb-pick-btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 7px 0 11px;border:1px solid var(--kb-line);border-radius:8px;background:var(--kb-card);box-shadow:0 1px 1px rgba(0,0,0,.04);font-size:12.5px;color:var(--kb-ink);white-space:nowrap;max-width:100%;transition:border-color 160ms ease,background-color 160ms ease}
.kb-pick-btn>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kb-pick-btn svg{flex:none;color:var(--kb-muted);transition:transform 240ms cubic-bezier(.32,.72,.24,1)}
.kb-pick[data-open] .kb-pick-btn svg{transform:rotate(180deg)}
.kb-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:10;min-width:max(100%,148px);max-width:min(320px,86vw);margin:0;padding:4px;border:1px solid var(--kb-line);border-radius:10px;background:var(--kb-card);box-shadow:var(--kb-pop);list-style:none;transform-origin:100% 0;animation:kb-menu 200ms cubic-bezier(.32,.72,.24,1) both}
.kb-menu[hidden]{display:none}
.kb-opt{display:flex;align-items:center;justify-content:space-between;gap:14px;height:30px;padding:0 8px 0 9px;border-radius:6px;font-size:12.5px;color:var(--kb-text);white-space:nowrap;cursor:pointer}
.kb-opt[data-active]{background:var(--kb-well);color:var(--kb-ink)}
.kb-opt[aria-selected="true"]{font-weight:500;color:var(--kb-ink)}
.kb-opt svg{flex:none;color:var(--kb-accent);visibility:hidden}
.kb-opt[aria-selected="true"] svg{visibility:visible}
.kb-opt>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kb-setup{display:inline-flex;flex:0 1 auto;min-width:0;max-width:50%;align-items:center;gap:6px;height:30px;padding:0 9px 0 11px;border:1px solid var(--kb-line);border-radius:8px;background:var(--kb-card);font-size:12.5px;color:var(--kb-ink);white-space:nowrap;transition:border-color 160ms ease,background-color 160ms ease}
.kb-setup svg{flex:none;color:var(--kb-muted)}
.kb-setup>span{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kb-action{height:34px;margin-top:16px;border:1px solid var(--kb-line);border-radius:8px;background:var(--kb-card);box-shadow:0 1px 2px rgba(0,0,0,.05);font-size:13px;font-weight:500;color:var(--kb-ink);padding:0 12px;min-width:0;transition:background-color 160ms ease}
.kb-action>span{display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kb-theme{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--kb-line);border-radius:999px;background:var(--kb-card);color:var(--kb-ink);transition:border-color 160ms ease,background-color 160ms ease}
.kb-theme:focus-visible,.kb-pick-btn:focus-visible,.kb-setup:focus-visible,.kb-action:focus-visible,.kb-trend:focus-visible{outline:2px solid var(--kb-focus);outline-offset:2px}
.kb-trend{display:grid;min-height:64px;margin-top:12px;border-radius:6px;min-width:0;overflow:hidden;max-width:100%}
.kb-trend:focus-visible{outline:2px solid var(--kb-focus);outline-offset:2px}
/*targeted-fix 2026-11-27: (1) date-range fits full text in top bar; (2) sales ticks spread full axis; (3) pro sparkline clipped inside card light+dark*/
.kb-trend svg{display:block;width:100%;max-width:100%;height:auto;overflow:hidden}
.kb-controls .kb-pick{flex:0 0 auto;min-width:max-content;max-width:none}
.kb-controls .kb-pick-btn{max-width:none;flex:0 0 auto}
.kb-area+.kb-legend{display:flex;justify-content:space-between;width:100%;max-width:100%;gap:8px}
.kb-area+.kb-legend>span{flex:0 0 auto;min-width:0}
.kb-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kb-toast{min-height:20px;font-size:12.5px;color:var(--kb-muted);margin-top:8px}
.kb-foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;color:var(--kb-muted)}
@keyframes kb-rise{from{opacity:0;transform:translateY(8px)}}
@keyframes kb-menu{from{opacity:0;transform:translateY(-4px) scale(.97)}}
@media (max-width:820px){.kb-wide,.kb-card{grid-column:span 6}.kb-wide{grid-column:span 6}}
@media (max-width:600px){.kb{gap:8px}.kb-card{grid-column:span 6}.kb-row--top{flex-wrap:wrap}}
@media (pointer:coarse){.kb-pick-btn,.kb-setup{height:36px}.kb-opt{height:38px}.kb-action{height:40px}}
@media (prefers-reduced-motion:reduce){.kb-card,.kb-menu{animation:none !important;transition:none !important}}
@media (hover:hover) and (pointer:fine){
.kb-card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.07)}
.kb-pick-btn:hover{border-color:#c9c9cf;background:var(--kb-well)}
html[data-theme="dark"] .kb-pick-btn:hover{border-color:#45454c}
.kb-setup:hover{background:var(--kb-well);border-color:#c9c9cf}
.kb-action:hover{background:var(--kb-well)}
.kb-theme:hover{background:var(--kb-well);border-color:#c9c9cf}
.kb-opt:hover{background:var(--kb-well)}
}
</style>

function idxFromEvent(e){try{var rect=R.fcSvg.getBoundingClientRect?R.fcSvg.getBoundingClientRect():{left:0,width:300};var w=(rect&&rect.width)||300;var x=(e.clientX-(rect?rect.left:0));if(!Number.isFinite(x))return null;var L=cur().focus.values.length;var i=Math.round(x/w*(L-1));if(i<0)i=0;if(i>=L)i=L-1;return i;}catch(err){return null;}}
function moveFocus(d){var L=cur().focus.values.length;var i=state.focusIdx===null?(d>0?0:L-1):state.focusIdx+d;if(i<0)i=0;if(i>=L)i=L-1;setFocusIdx(i);}
var timer=null;
function targets(){

return{revenue:sum(d.stats[0].values),emails:sum(d.stats[1].values),refunds:sum(d.stats[2].values),overview:sum(o.current),focus:state.focusIdx===null?sum(d.focus.values):d.focus.values[state.focusIdx],ovPrev:sum(o.previous),fcPrev:d.focus.previous};

function paintStatic(){
var d=cur(),o=ovSeries();
R.stats.forEach(function(s,i){var st=d.stats[i];s.id=st.id;s.label.textContent=st.label;s.label.title=st.label;s.svg.setAttribute('aria-label',st.label+', by day');s.path.setAttribute('d',sparkD(st.values,300,56,6));});

R.ovPrevV.textContent=ovP;R.ovCurV.textContent=fmtCount(targets().focus)===''?ovT:ovT;
R.ovPrevPath.setAttribute('d',areaD(o.previous,600,190,8));
R.ovCurPath.setAttribute('d',sparkD(o.current,600,190,8));
var Lbl=d.overview.labels||[];R.tickA.textContent=Lbl[0]||'';R.tickB.textContent=Lbl[Math.floor(Lbl.length/2)]||'';R.tickC.textContent=Lbl[Lbl.length-1]||'';

function animProxy(k,v){return v;}
function paintChanges(){
var d=cur();
R.stats.forEach(function(s,i){var st=d.stats[i];var tot=sum(st.values);var ch=pct(tot,st.previous);
while(s.changeWrap.firstChild)s.changeWrap.removeChild(s.changeWrap.firstChild);
if(ch===undefined||!Number.isFinite(ch)){s.changeWrap.appendChild(document.createTextNode(''));return;}
var good=st.lowerIsBetter?ch<=0:ch>=0;var badge=changeBadge(ch>=0,good,fmtPct(ch,0)+'%');
s.changeWrap.appendChild(badge);});
while(R.ovVs.firstChild)R.ovVs.removeChild(R.ovVs.firstChild);
var o=ovSeries();var chO=pct(sum(o.current),sum(o.previous));
if(chO!==undefined&&Number.isFinite(chO)){var b=changeBadge(chO>=0,chO>=0,fmtPct(chO,0)+'%');R.ovVs.appendChild(b);var t=el('span','kb-vs-text',COMPARE);t.title=COMPARE;R.ovVs.appendChild(document.createTextNode(' '));R.ovVs.appendChild(t);}

if(chF!==undefined&&Number.isFinite(chF)){R.fcVs.appendChild(changeBadge(chF>=0,chF>=0,fmtPct(chF,0)+'%'));R.fcVs.appendChild(document.createTextNode(' '));var t2=el('span','kb-vs-text',COMPARE);t2.title=COMPARE;R.fcVs.appendChild(t2);}}
else{var lb=d.focus.labels[state.focusIdx]||'';var lbe=el('span','kb-vs-text',lb);lbe.title=lb;R.fcVs.appendChild(lbe);}

function paintFocusSel(){
var d=cur();var vals=d.focus.values;var L=vals.length;var i=state.focusIdx;
if(i===null||i<0||i>=L){R.fcDot.setAttribute('visibility','hidden');R.ovDot.setAttribute('visibility','hidden');R.fcSr.textContent='';}
else{var dx=(6+ (288)*i/(L-1)).toFixed(1);var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);if(max===min)max=min+1;var dy=(6+52*(1-(vals[i]-min)/(max-min))).toFixed(1);

}
function paintNumbers(){
var t=targets();
R.stats[0].value.textContent=fmtMoney(state.displayed.revenue);
R.stats[1].value.textContent=fmtCount(state.displayed.emails);
R.stats[2].value.textContent=fmtCount(state.displayed.refunds);
R.ovValue.textContent=fmtMoney(state.displayed.overview);
var d=cur();var unit=d.focus.unit?' '+d.focus.unit:'';
var fv=state.displayed.focus;
if(state.focusIdx===null){R.fcValue.textContent=fmtCount(fv)+unit;}
else{var one=d.focus.unit||'';if(Math.round(fv)===1)one=d.focus.unitOne||one.replace(/s$/,'');R.fcValue.textContent=fmtCount(fv)+(one?' '+one:'');}
R.ovPrevV.textContent=fmtMoney(t.ovPrev);R.ovCurV.textContent=fmtMoney(t.overview);
R.fcPrevV.textContent=fmtCount(d.focus.previous);R.fcCurV.textContent=fmtCount(sum(d.focus.values));
}
function animate(){
var to=targets();
var from={revenue:state.displayed.revenue||0,emails:state.displayed.emails||0,refunds:state.displayed.refunds||0,overview:state.displayed.overview||0,focus:state.displayed.focus||0};
if(reduced()){state.displayed={revenue:to.revenue,emails:to.emails,refunds:to.refunds,overview:to.overview,focus:to.focus};paintNumbers();return;}
var dur=760;var t0=(window.performance&&performance.now)?performance.now():Date.now();
if(state.animId&&window.cancelAnimationFrame)cancelAnimationFrame(state.animId);
function frame(now){var p=Math.min(1,((now||Date.now())-t0)/dur);var e=easeOut(p);
state.displayed={revenue:from.revenue+(to.revenue-from.revenue)*e,emails:from.emails+(to.emails-from.emails)*e,refunds:from.refunds+(to.refunds-from.refunds)*e,overview:from.overview+(to.overview-from.overview)*e,focus:from.focus+(to.focus-from.focus)*e};
paintNumbers();
if(p<1){state.animId=requestAnimationFrame(frame);}else{state.displayed={revenue:to.revenue,emails:to.emails,refunds:to.refunds,overview:to.overview,focus:to.focus};paintNumbers();}}
state.animId=requestAnimationFrame(frame);
}
function refresh(anim){paintStatic();if(anim===false){var t=targets();state.displayed={revenue:t.revenue,emails:t.emails,refunds:t.refunds,overview:t.overview,focus:t.focus};paintNumbers();}else animate();}
function setRange(id,user){if(!DEMO_DATA[id]||id===state.range&&user!==false&&state.focusIdx===null){if(DEMO_DATA[id]&&id!==state.range){}else if(id===state.range)return;}state.range=id;state.focusIdx=null;R.rangePick.set(id);refresh(true);}
function setSegment(id){state.segment=id;R.segPick.set(id);refresh(true);}
function setFocusIdx(i){state.focusIdx=(i===undefined?null:i);var t=targets();paintChanges();paintFocusSel();if(reduced()){state.displayed.focus=t.focus;paintNumbers();}else{var fromF=state.displayed.focus||0,toF=t.focus;var t0=(window.performance&&performance.now)?performance.now():Date.now();var dur=240;function fr(now){var p=Math.min(1,((now||Date.now())-t0)/dur);var e=easeOut(p);state.displayed.focus=fromF+(toF-fromF)*e;paintNumbers();if(p<1)requestAnimationFrame(fr);}requestAnimationFrame(fr);}}
function themeName(){return document.documentElement.getAttribute('data-theme')||'light';}
function syncThemeIcon(){var dark=themeName()==='dark';try{R.sun.style.display=dark?'':'none';R.moon.style.display=dark?'none':'';}catch(e){}try{R.themeBtn.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');}catch(e){}}
function toggleTheme(){var n=themeName()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('ui-kb-theme',n);}catch(e){}syncThemeIcon();}
R.themeToggle=toggleTheme;
build();
R.rangePick.set(state.range);
var t0=targets();state.displayed={revenue:0,emails:0,refunds:0,overview:0,focus:0};
paintStatic();paintNumbers();animate();
timer=setInterval(function(){if(state.interacted)return;var ids=RANGES.map(function(r){return r.id;});var i=ids.indexOf(state.range);setRange(ids[(i+1)%ids.length],false);},3600);
window.__kb={range:function(){return state.range;},setRange:function(id){mark();setRange(id,true);},segment:function(){return state.segment;},setSegment:function(id){mark();setSegment(id);},focusIndex:function(){return state.focusIdx;},setFocusIndex:function(i){mark();setFocusIdx(i);},theme:function(){return themeName();},setTheme:function(n){document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('ui-kb-theme',n);}catch(e){}syncThemeIcon();},toggleTheme:function(){mark();toggleTheme();},snapshot:function(){return{statVals:R.stats.map(function(s){return s.value;}),statPaths:R.stats.map(function(s){return s.path;}),statCards:R.stats.map(function(s){return s.card;}),statLabels:R.stats.map(function(s){return s.label;}),ovCur:R.ovCurPath,ovPrev:R.ovPrevPath,fcPath:R.fcPath,ovVal:R.ovValue,fcVal:R.fcValue,ovCard:R.ovCard,ticks:[R.tickA,R.tickB,R.tickC],rangeRoot:R.rangePick.root,segRoot:R.segPick.root,themeBtn:R.themeBtn};},stopAuto:function(){mark();}};
})();
