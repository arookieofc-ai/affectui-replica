<style>
:root{
--surface:#ffffff;--page:#fafaf9;--ink:#171717;--ink2:#1c1917;--muted:#78716c;
--subtle:#f5f5f4;--border:#e7e5e4;--overlay:#ffffff;
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--pop:0 0 0 1px #e5e5e5,0 12px 30px -8px rgba(0,0,0,.2);
--accent:#2f6bff;--accent-soft:#eef7ff;--accent-line:#cde9ff;
--amber:#f59e0b;--amber-bg:#fef3c7;--amber-ink:#92400e;
--pink:#ee3e9e;--pink-bg:#fff5f9;--pink-line:#fce1f0;--pink-ink:#c21f78;
--warn:#b25e00;--gold:#e8b000;--star:#e8b000;--red:#f04438;
--focus:rgba(0,96,226,.7);--tray:#f6f6f6;--card:#ffffff;--line:#ececec;
--txt:#404040;--ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--ink2:#ededed;--muted:#a1a1aa;
--subtle:#26262a;--border:#2e2e33;--overlay:#232326;
--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
--pop:0 0 0 1px rgba(255,255,255,.1),0 12px 30px -8px rgba(0,0,0,.6);
--accent:#4fb0fe;--accent-soft:rgba(79,176,254,.16);--accent-line:rgba(79,176,254,.45);
--amber:#fbbf24;--amber-bg:#451a03;--amber-ink:#fde68a;
--pink:#f06db5;--pink-bg:rgba(240,109,181,.14);--pink-line:rgba(240,109,181,.28);--pink-ink:#f06db5;
--warn:#e6c24d;--gold:#e6c24d;--star:#e8b000;--red:#ff6b5f;
--focus:rgba(77,141,255,.8);--tray:#161618;--card:#232326;--line:rgba(255,255,255,.08);--txt:#c4c4c4;
}
html{-webkit-tap-highlight-color:transparent}
body{font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;
-webkit-font-smoothing:antialiased}
.page{max-width:1240px;margin:0 auto;padding:20px 16px 40px}
.page-top{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.page-top .prod{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 10px;background:var(--surface)}
.page-top .sp{flex:1}
.theme-btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;transition:color 160ms ease,border-color 160ms ease,background-color 160ms ease}
.theme-btn svg{flex:none}
/* board frame: outer radius = inner radius + padding (16+4=20) */
.board{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);container-type:inline-size}
.board-top{display:flex;align-items:center;min-height:48px;padding:0 12px 0 18px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px}
.crumb-mark{display:inline-flex;align-items:flex-end;gap:2px;height:14px;margin-right:4px;flex:none}
.crumb-mark i{width:3px;border-radius:1px;background:var(--accent)}
.crumb-mark i:nth-child(1){height:6px;opacity:.45}.crumb-mark i:nth-child(2){height:10px;opacity:.7}.crumb-mark i:nth-child(3){height:14px}
.crumb{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;color:var(--muted)}
.crumb:last-child{color:var(--ink);font-weight:550;flex-shrink:0;max-width:60%}
.crumb .sep{color:var(--muted);opacity:.6;flex:none}
.clip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{position:relative;display:grid;place-items:center;width:28px;height:28px;padding:0 8px 0 6px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;transition:background-color 150ms ease,color 150ms ease;flex:none}
/* optical alignment: icon side gets ~2px less padding handled via asymmetric padding above */
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.icon-btn .fdot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.board-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 12px 0 18px}
.count{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px;white-space:nowrap;color:var(--txt)}
.count .dim{color:var(--muted)}
.tools{display:flex;flex:none;align-items:center;gap:4px}
.search{display:flex;align-items:center;gap:6px;width:clamp(96px,30cqw,170px);height:30px;margin-right:4px;padding:0 10px;border-radius:9px;background:var(--subtle);color:var(--muted);border:1px solid transparent}
.search:focus-within{background:var(--surface);border-color:var(--border)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:13px;color:var(--ink);padding:0}
.menu-wrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:8;display:grid;gap:2px;min-width:184px;max-width:260px;max-height:300px;overflow-y:auto;padding:6px 4px 4px;border-radius:12px;background:var(--overlay);box-shadow:var(--pop);border:1px solid var(--border);animation:drop 180ms var(--ease)}
.menu-title{margin:0 0 2px;padding:0 10px;font-size:11.5px;color:var(--muted)}
.menu-none{margin:0;padding:6px 10px 8px;font-size:13px;color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:13px;text-align:left;color:var(--txt);cursor:pointer}
.menu-item .tick{margin-left:auto;color:var(--accent)}
.menu-item.clear{color:var(--muted)}
.swatch{flex:none;width:8px;height:8px;border-radius:2px}
.swatch.dot{border-radius:50%}
.cols{display:grid;grid-auto-columns:minmax(224px,1fr);grid-auto-flow:column;gap:10px;padding:0 12px 12px;overflow-x:auto;scrollbar-width:thin}
.col{display:flex;flex-direction:column;min-width:0;min-height:300px;padding:4px 6px 6px;border-radius:16px;background:var(--tray)}
.col.over{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.col-head{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 4px 4px 8px}
/* reserved space above first card: head keeps fixed height, never overlapped */
.col-title{font-size:13.5px;font-weight:550}
.col-count{flex:none;font-size:12.5px;color:var(--muted)}
.col-head .icon-btn{margin-left:auto}
.st{display:grid;place-items:center;flex:none;width:15px;height:15px}
.st svg{width:15px;height:15px}
.cards{display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:6px;flex:1}
.slot{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
/* card: border for structure + layered shadow for elevation */
.card{padding:12px 12px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:grab;transition:box-shadow 160ms ease,opacity 160ms ease,transform 200ms var(--ease);animation:rise 320ms var(--ease) both}
html[data-theme="dark"] .card{box-shadow:0 1px 2px rgba(0,0,0,.4)}
.card.drag{opacity:.35;transform:scale(.98)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px}
.key{font-size:12px;color:var(--muted)}
.avatar{flex:none;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--accent-soft);font-size:9px;font-weight:700;color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
html[data-theme="dark"] .avatar{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.avatar-img{border-radius:50%;object-fit:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
html[data-theme="dark"] .avatar-img{outline-color:rgba(255,255,255,.1)}
.card-title{display:flex;gap:8px;margin:4px 0 0;font-size:13.5px;font-weight:450;line-height:19px}
.card-title .st{margin-top:2px}
.title-text{min-width:0;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3}
.title-text.untitled{color:var(--muted)}
.props{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.prop{display:inline-flex;align-items:center;gap:5px;max-width:100%;height:22px;padding:0 7px;border-radius:7px;border:1px solid var(--border);font-size:11.5px;white-space:nowrap;color:var(--txt);background:transparent}
.prop svg{flex:none;color:var(--muted)}
.prop.soon{color:var(--warn)}.prop.soon svg{color:var(--gold)}
.prop.late{color:var(--pink-ink);background:var(--pink-bg);border-color:var(--pink-line)}.prop.late svg{color:var(--pink)}
.created{margin:9px 0 0;font-size:11.5px;color:var(--muted)}
.board[data-compact] .props,.board[data-compact] .created{display:none}
.dropbar{display:block;height:3px;margin:-1px 4px;border-radius:2px;background:var(--accent);animation:grow 160ms var(--ease)}
.empty{display:grid;place-items:center;height:80px;margin:0;border:1px dashed var(--border);border-radius:12px;font-size:12.5px;color:var(--muted)}
.newform input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:12px;outline:none;background:var(--surface);font:inherit;font-size:13.5px;color:var(--ink)}
.newform input:focus{border-color:var(--accent)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:12.5px;font-weight:550;color:var(--muted);cursor:pointer}
.more .left{font-weight:400;opacity:.7}
.scrim{position:absolute;inset:0;z-index:9;background:rgba(23,23,23,.08);opacity:0;pointer-events:none;transition:opacity 200ms ease}
.scrim.open{opacity:1;pointer-events:auto}
html[data-theme="dark"] .scrim{background:rgba(0,0,0,.4)}
.panel{position:absolute;top:8px;right:8px;bottom:8px;z-index:10;display:flex;flex-direction:column;width:min(360px,calc(100% - 16px));padding:14px 16px 14px;overflow-y:auto;border-radius:16px;background:var(--overlay);border:1px solid var(--border);box-shadow:var(--pop);transform:translateX(calc(100% + 24px));transition:transform 300ms var(--ease)}
.panel.open{transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between}
.title-input{margin:8px -6px 0;padding:4px 6px;border:0;border-radius:8px;outline:none;resize:none;min-height:54px;font:inherit;font-size:16px;font-weight:600;line-height:23px;color:var(--ink);background:transparent;width:calc(100% + 12px)}
.title-input:focus{background:var(--subtle)}
.fields{display:grid;gap:6px;margin:14px 0 0}
.fields dt{margin-top:8px;font-size:12px;color:var(--muted)}
.fields dd{margin:0;min-width:0}
.choices{display:flex;flex-wrap:wrap;gap:5px}
.choice{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:28px;padding:3px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--txt);cursor:pointer;transition:background-color 150ms ease}
.choice.sel{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.panel-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:16px;font-size:12px;color:var(--muted);padding-bottom:4px}
.del{height:28px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:12.5px;color:var(--red);cursor:pointer}
.prio-on{fill:#525252}html[data-theme="dark"] .prio-on{fill:#c4c4c4}
.prio-off{fill:#d4d4d4}html[data-theme="dark"] .prio-off{fill:#4a4a4f}
.ring-track{stroke:#e0e0e0}html[data-theme="dark"] .ring-track{stroke:rgba(255,255,255,.14)}
.board button:focus-visible,.board [tabindex]:focus-visible,.theme-btn:focus-visible,.title-input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card-title,.col-title,.key{max-width:100%}
.dimmed{opacity:.75}
@keyframes rise{from{opacity:0;transform:translateY(3px)}}
@keyframes drop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
@keyframes grow{from{transform:scaleX(.6);opacity:0}}
@media (max-width:760px){.cols{grid-auto-flow:row;grid-template-columns:minmax(0,1fr);overflow-x:visible}.col{min-height:0}}
@media (prefers-reduced-motion:reduce){.card,.menu,.dropbar{animation:none}.panel,.scrim,.card{transition:none}}
@media (pointer:coarse){.icon-btn{width:36px;height:36px}.col-head{min-height:44px}.search{height:36px}.menu-item{min-height:40px}.choice,.del{min-height:36px}.more{min-height:40px}}
@media (hover:hover) and (pointer:fine){
.icon-btn:hover{background:var(--subtle);color:var(--ink)}
.icon-btn.on:hover{background:var(--accent-soft);color:var(--accent)}
.menu-item:hover{background:var(--subtle)}
.choice:hover{background:var(--subtle)}
.choice.sel:hover{background:var(--accent-soft)}
.card:hover{box-shadow:0 6px 16px -8px rgba(0,0,0,.18);transform:translateY(-1px)}
.more:hover{background:var(--subtle);color:var(--ink)}
.del:hover{background:var(--pink-bg)}
.theme-btn:hover{color:var(--ink);border-color:var(--accent)}
}
</style>

var panelBuilt=false, pKey,pTitle,pStatusBox,pPrioBox,pLabelBox,pAssBox,pFoot,pCreated,pDel;
function clearPanel(){while(panel.firstChild)panel.removeChild(panel.firstChild);panelBuilt=false}
function renderPanel(t){if(!panelBuilt){while(panel.firstChild)panel.removeChild(panel.firstChild);
var head=el("div","panel-head");pKey=el("span","key",t.key);head.appendChild(pKey);

pTitle=document.createElement("textarea");pTitle.className="title-input";pTitle.rows=2;pTitle.setAttribute("aria-label","Title");pTitle.addEventListener("input",function(){t.title=pTitle.value;var r=cardRefs[t.id];if(r){var nt2=t.title.trim()||"Untitled";if(r.title.textContent!==nt2)r.title.textContent=nt2;r.card.setAttribute("aria-label",t.key+" "+nt2)}});panel.appendChild(pTitle);
var dl=document.createElement("dl");dl.className="fields";
var dts=el("dt",null,"Status");dl.appendChild(dts);var dds=document.createElement("dd");pStatusBox=el("div","choices");pStatusBox.setAttribute("role","radiogroup");pStatusBox.setAttribute("aria-label","Status");dds.appendChild(pStatusBox);dl.appendChild(dds);
var dtp=el("dt",null,"Priority");dl.appendChild(dtp);var ddp=document.createElement("dd");pPrioBox=el("div","choices");pPrioBox.setAttribute("role","radiogroup");pPrioBox.setAttribute("aria-label","Priority");ddp.appendChild(pPrioBox);dl.appendChild(ddp);

panel.appendChild(dl);
var foot=el("div","panel-foot");pCreated=el("span");foot.appendChild(pCreated);
pDel=document.createElement("button");pDel.type="button";pDel.className="del";pDel.textContent="Delete task";pDel.addEventListener("click",function(){var id=t.id;tasks=tasks.filter(function(x){return x.id!==id});var r=cardRefs[id];if(r&&r.slot.parentNode)r.slot.parentNode.removeChild(r.slot);delete cardRefs[id];openId=null;sync()});foot.appendChild(pDel);panel.appendChild(foot);
pFoot=foot;panelBuilt=true;
pStatusBox.addEventListener("keydown",radioKeys);pPrioBox.addEventListener("keydown",radioKeys);
panel.addEventListener("keydown",function(e){if(e.key!=="Tab")return;var f=focusables(panel);if(!f.length)return;var first=f[0],last=f[f.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===panel)){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
}
if(pKey.textContent!==t.key)pKey.textContent=t.key;
if(document.activeElement!==pTitle&&pTitle.value!==t.title)pTitle.value=t.title;
syncChoiceGroup(pStatusBox,STATUSES.map(function(s){return{id:s.id,label:s.label,checked:t.status===s.id,iconNode:statusIcon(s.id,s.color)}}),function(id){t.status=id;sync()});
syncChoiceGroup(pPrioBox,[4,3,2,1,0].map(function(l){return{id:String(l),label:PRIORITIES[l],checked:t.priority===l,iconNode:prioIcon(l)}}),function(id){t.priority=parseInt(id,10);sync()});
syncToggleGroup(pLabelBox,LABELS.map(function(L){return{id:L.id,label:L.label,on:t.labels.indexOf(L.id)>=0,color:L.color}}),function(id){var ix=t.labels.indexOf(id);if(ix>=0)t.labels.splice(ix,1);else t.labels.push(id);sync()});
syncAssGroup(pAssBox,t);
var wantC=t.created?("Created "+t.created):"";if(pCreated.textContent!==wantC)pCreated.textContent=wantC;

function focusables(root){var q=root.querySelectorAll("button, textarea, input, select, a[href], [tabindex]");var out=[];for(var i=0;i<q.length;i++){var n=q[i];if(n.tabIndex>=0&&!n.disabled&&!n.hidden)out.push(n)}return out}
function radioKeys(e){if(["ArrowRight","ArrowDown","ArrowLeft","ArrowUp","Home","End"].indexOf(e.key)<0)return;var radios=e.currentTarget.querySelectorAll("[role='radio']");if(!radios.length)return;var ix=-1;for(var i=0;i<radios.length;i++)if(radios[i]===document.activeElement)ix=i;var n=radios.length;var ni=e.key==="Home"?0:(e.key==="End"?n-1:((e.key==="ArrowRight"||e.key==="ArrowDown")?(ix+1)%n:(ix-1+n)%n));e.preventDefault();if(radios[ni]){radios[ni].focus();radios[ni].click()}}
function syncChoiceGroup(box,items,onPick){while(box.firstChild)box.removeChild(box.firstChild);
for(var i=0;i<items.length;i++)(function(it,idx){var b=document.createElement("button");b.type="button";b.className="choice"+(it.checked?" sel":"");b.setAttribute("role","radio");b.setAttribute("aria-checked",it.checked?"true":"false");b.tabIndex=(it.checked||(idx===0&&!items.some(function(x){return x.checked})))?0:-1;
if(it.iconNode)b.appendChild(it.iconNode);b.appendChild(document.createTextNode(it.label));
b.addEventListener("click",function(){onPick(it.id)});box.appendChild(b)})(items[i],i)}
function syncToggleGroup(box,items,onPick){while(box.firstChild)box.removeChild(box.firstChild);
for(var i=0;i<items.length;i++)(function(it){var b=document.createElement("button");b.type="button";b.className="choice"+(it.on?" sel":"");b.setAttribute("aria-pressed",it.on?"true":"false");
var sw=el("span","swatch dot");sw.style.background=it.color;b.appendChild(sw);b.appendChild(document.createTextNode(it.label));
b.addEventListener("click",function(){onPick(it.id)});box.appendChild(b)})(items[i])}
function syncAssGroup(box,t){while(box.firstChild)box.removeChild(box.firstChild);
for(var i=0;i<PEOPLE.length;i++)(function(P){var on=t.assignee===P.id;var b=document.createElement("button");b.type="button";b.className="choice"+(on?" sel":"");b.setAttribute("aria-pressed",on?"true":"false");
b.appendChild(avatarNode(P,16));var nm=(P.name.trim().split(/\s+/)[0]||"No name");b.appendChild(document.createTextNode(nm));b.title=P.name;
b.addEventListener("click",function(){t.assignee=(t.assignee===P.id?null:P.id);sync()});box.appendChild(b)})(PEOPLE[i])}
