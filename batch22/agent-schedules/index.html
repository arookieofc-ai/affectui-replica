<meta name="color-scheme" content="light dark">
<title>Agent Schedules — Fieldwork</title>
<style>
:root{
--surface:#ffffff;--page:#fafaf9;--ink:#171717;--ink2:#1c1917;--muted:#78716c;--subtle:#f5f5f4;--border:#e7e5e4;
--radius-lg:16px;--radius:10px;--radius-sm:6px;
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--blue:#2563eb;--blue-soft:#dbeafe;
--green:#15803d;--green-soft:#dcfce7;
--amber:#92400e;--amber-bg:#fef3c7;--amber-dot:#f59e0b;
--red:#b91c1c;--red-bg:#fee2e2;
--grey:#57534e;--grey-bg:#f5f5f4;
--tone-purple:#a651f0;--tone-orange:#f28a2e;--tone-teal:#13b3a0;--tone-gray:#8a8a8a;
--img-outline:rgba(0,0,0,.1);
--focus:rgba(0,96,226,.7);
}
html[data-theme="dark"]{
--surface:#1c1c1f;--page:#101012;--ink:#ededed;--ink2:#e7e5e4;--muted:#a1a1aa;--subtle:#26262a;--border:#2e2e33;
--shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
--blue:#7fb6ff;--blue-soft:#1e3a5a;
--green:#86efac;--green-soft:#143d24;
--amber:#fde68a;--amber-bg:#451a03;--amber-dot:#fbbf24;
--red:#fca5a5;--red-bg:#450a0a;
--grey:#d4d4d8;--grey-bg:#26262a;
--tone-purple:#c4a5f5;--tone-orange:#f2a15c;--tone-teal:#4fc3b4;--tone-gray:#9a9aa0;
--img-outline:rgba(255,255,255,.1);
--focus:rgba(120,170,255,.85);
}
html{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:12px 12px 12px 18px}
.proj{flex:1;min-width:0}
.proj-name{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-title{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;padding:0;transition:background 160ms ease,transform 160ms ease}
.iconbtn:focus-visible,.row-main:focus-visible,.btn:focus-visible,.linkbtn:focus-visible,.switch:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.page{display:grid;gap:26px;margin-top:18px}
.sec{display:grid;gap:8px}
.sec-label{margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:14px 16px 14px}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.card-top b{font-weight:600;color:var(--ink)}
.chartbox{position:relative;margin-top:6px}
.chart-svg{display:block;width:100%;height:136px;overflow:visible}
.tick{font-size:11px;fill:var(--muted)}
.gridline{stroke:var(--border);stroke-width:1;opacity:.55}
.baseline{stroke:var(--border);stroke-width:1}
.areapath{fill:rgba(37,99,235,.12)}
html[data-theme="dark"] .areapath{fill:rgba(127,182,255,.14)}
.linepath{fill:none;stroke:var(--blue);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.headglow{fill:var(--blue);opacity:.18}
.headot{fill:var(--blue);stroke:var(--surface);stroke-width:1.5}
.mkline{stroke-width:1;opacity:.55}
.mkdot{stroke-width:1.5}
.say{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.say b{font-weight:600}
.say .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dotlive{flex:none;width:7px;height:7px;border-radius:999px;background:var(--blue);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.chip{position:absolute;display:inline-flex;align-items:center;gap:6px;max-width:220px;padding:3px 9px 3px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--border);box-shadow:0 6px 16px -6px rgba(0,0,0,.25);font-size:12px;white-space:nowrap;pointer-events:none;transform:translateX(10px)}
.chip.flip{transform:translateX(calc(-100% - 10px))}
.chip .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.rows{display:grid;gap:2px;margin:0 -10px;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:8px;padding-right:10px;border-radius:11px;transition:background-color 140ms ease}
.row.sel{background:var(--subtle)}
.row-main{flex:1;display:flex;align-items:center;gap:12px;min-width:0;min-height:44px;padding:0 0 0 12px;background:transparent;border:0;color:inherit;text-align:left;cursor:pointer;border-radius:11px}
.mark{width:27px;height:27px;display:grid;grid-template-columns:repeat(3,9px);grid-template-rows:repeat(3,9px);flex:none;border-radius:7px;overflow:hidden;outline:1px solid var(--img-outline);outline-offset:-1px}
.mark i{width:9px;height:9px;display:block}
.mark.live i.on{animation:tw 1.6s ease-in-out infinite}
.mark.live i.on:nth-child(2n){animation-delay:.3s}
.mark.live i.on:nth-child(3n){animation-delay:.6s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.4}}
.row-text{flex:1;display:flex;align-items:baseline;gap:10px;min-width:0}
.row-name{flex:0 1 auto;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row[data-paused="true"] .row-name{color:var(--ink);font-weight:500}
.row-cad{flex:0 100 auto;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-nextline{display:none;font-size:12px;color:var(--ink)}
.row-next{flex:none;display:flex;align-items:baseline;justify-content:flex-end;gap:6px;width:196px;font-size:13px;white-space:nowrap}
.row-rel{font-size:12px;color:var(--muted)}
.row-last{flex:none;display:flex;justify-content:flex-end;width:86px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--subtle);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.badge[data-o="needs"]{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-dot)}
.badge[data-o="failed"]{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.row-cost{flex:none;width:64px;text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.switch{position:relative;flex:none;width:30px;height:18px;border-radius:999px;border:0;background:var(--border);cursor:pointer;transition:background-color 180ms ease;padding:0}
.switch[aria-checked="true"]{background:var(--blue)}
.knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform 200ms ease}
.switch[aria-checked="true"] .knob{transform:translateX(12px)}
.detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px 16px 18px;display:grid;gap:14px}
.detail-head{display:flex;gap:10px;align-items:flex-start}
.detail-titles{display:grid;gap:2px;min-width:0}
.detail-title{margin:0;font-size:15px;font-weight:600}
.detail-sub{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px 0 10px;border-radius:6px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:filter 150ms ease,background 150ms ease;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--page);border-color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.55;cursor:default}
.prompt{margin:0;padding-left:10px;border-left:2px solid var(--border);font-size:13px;color:var(--ink)}
.prompt.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:0;border-radius:7px;background:transparent;font-size:12px;color:var(--muted);cursor:pointer}
.list{margin:0;padding:2px 12px;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.list li{display:flex;align-items:center;gap:10px;min-height:40px;font-size:13px}
.list li+li{border-top:1px solid var(--border)}
.when{color:var(--ink);white-space:nowrap}
li.skipped .when{color:var(--muted);text-decoration:line-through}
.grow{flex:1;color:var(--muted);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{margin:0;padding:2px 12px;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 0}
.hist li+li{border-top:1px solid var(--border)}
.hist-tx{flex:1;display:grid;min-width:0;font-size:12px}
.hist-sum{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-meta{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{margin:0;font-size:13px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.faint{color:var(--muted)}
@media (hover: hover) and (pointer: fine){
.iconbtn:hover{background:var(--subtle);transform:translateY(-1px)}
.row:hover{background:var(--subtle)}
.btn:hover{filter:brightness(1.04)}
.btn.dark:hover{filter:brightness(1.18)}
.linkbtn:hover{background:var(--subtle);color:var(--ink)}
}
@media (max-width:640px){
.row-cost,.row-last,.row-rel{display:none}
.row-next{width:auto}
}
@media (max-width:440px){
.row-main{min-height:56px}
.row-text{flex-direction:column;align-items:stretch;gap:0}
.row-next{display:none}
.row-nextline{display:block}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

<div class="wrap">
<header class="top">
<div class="proj"><div class="proj-name" id="projName">Fieldwork · Pro · Personal</div><div class="proj-title">Schedules</div><div class="proj-meta" id="projMeta">– / –</div></div>

</div></section>
<p class="sr" id="live" role="status" aria-live="polite"></p>
</div>
</div>

function activityAt(t){var span=10*D;var base=1.3+0.45*Math.sin((t/span)*0.7)+0.25*Math.sin((t/span)*1.9+1)+0.12*Math.sin((t/span)*4.3+2);var bump=0;for(var i=0;i<DATA.length;i++){var s=DATA[i];var dur=s.duration||8000;for(var j=0;j<s.runs.length;j++){var r=s.runs[j];if(t>=r&&t<=r+dur&&!s.paused){var p=(t-r)/dur;bump+=(3+Math.min(6,(s.cost||0.3)*1.6))*Math.sin(Math.PI*p);}}}var v=base+bump;if(v<0.2){v=0.2;}return v;}
function smooth(pts){if(!pts.length){return '';}if(pts.length===1){return 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);}var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);for(var i=1;i<pts.length;i++){var p0=pts[Math.max(0,i-2)],p1=pts[i-1],p2=pts[i],p3=pts[Math.min(pts.length-1,i+1)];var c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+='C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);}return d;}
