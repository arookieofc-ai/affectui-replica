if(dR.sd.textContent!=='')dR.sd.textContent='';
dR.ol.textContent='';dR.ul.textContent='';dR.al.textContent='';dR.dl.textContent='';
dR.hs.style.display='none';dR.hh.style.display='none';dR.ha.style.display='none';dR.hd.style.display='none';
dR.pring.textContent='';if(dR.ring){dR.ring=null;}
if(dR.pf.textContent!=='')dR.pf.textContent='';
dR.av.setAttribute('hidden','');dR.av.textContent='';
return;}
if(dR.title.textContent!==t.title)dR.title.textContent=t.title;
var sub2=(t.done?L.done+' \u00B7 '+dayLabel(t.updatedAt,state.now):statusText(t,state.now))+' \u00B7 '+relAge(t.updatedAt,state.now);
if(dR.sub.textContent!==sub2)dR.sub.textContent=sub2;
if(dR.goal.textContent!==(t.goal||''))dR.goal.textContent=t.goal||'';
var n=asksCount(t);
if(n>0){dR.needs.removeAttribute('hidden');var dc=n===1?L.decisionOne:L.decisionMany.replace('{n}',fmtN.format(n));if(dR.nc.textContent!==dc)dR.nc.textContent=dc;var q=t.asks&&t.asks[0]?t.asks[0].question:'';if(dR.nq.textContent!==q)dR.nq.textContent=q;}
else dR.needs.setAttribute('hidden','');
var s=t.steps||[];var doneN=s.filter(function(x){return x.done;}).length;
var firstOpen=s.findIndex(function(x){return !x.done;});
var st=statusText(t,state.now);
if(dR.pst.textContent!==st)dR.pst.textContent=st;
var fr=s.length?doneN+'/'+s.length+' \u00B7 '+Math.round(frac(t)*100)+'%':'';
if(dR.pf.textContent!==fr)dR.pf.textContent=fr;
if(dR.pj.textContent!==t.project)dR.pj.textContent=t.project;
if(dR.sd.textContent!==(t.started||''))dR.sd.textContent=t.started||'';
var planning=!t.done&&t.status==='planning'&&!s.length;
if(!dR.ring){dR.pring.textContent='';var nr=buildRing(frac(t),!!t.done,planning);dR.pring.appendChild(nr);dR.ring=nr;}
else updateRing(dR.ring,frac(t),!!t.done,planning);
dR.hs.style.display=s.length?'':'none';dR.ol.style.display=s.length?'':'none';
while(dR.ol.children.length>s.length)dR.ol.removeChild(dR.ol.lastChild);
for(var i=0;i<s.length;i++){var li=dR.ol.children[i];if(!li){li=el('li','step');var mk=el('span','smark','\u2713');var lb=el('span','slabel','');li.appendChild(mk);li.appendChild(lb);dR.ol.appendChild(li);}var want=s[i].done?'done':(i===firstOpen?(n>0?'you':'now'):'later');if(li.getAttribute('data-state')!==want)li.setAttribute('data-state',want);var lab=li.children[1];if(lab.textContent!==s[i].label)lab.textContent=s[i].label;var mk2=li.children[0];var mtxt=s[i].done?'\u2713':'';if(mk2.textContent!==mtxt)mk2.textContent=mtxt;var ex=li._note;if(want==='you'&&!ex){var nn=el('span','snote',L.needsYou);li.appendChild(nn);li._note=nn;}if(want!=='you'&&ex){li.removeChild(ex);li._note=null;}}
var hist=(t.history||[]).slice(0,4);
dR.hh.style.display=hist.length?'':'none';dR.ul.style.display=hist.length?'':'none';
while(dR.ul.children.length>hist.length)dR.ul.removeChild(dR.ul.lastChild);
for(var h2=0;h2<hist.length;h2++){var hr=dR.ul.children[h2];if(!hr){hr=el('li','',hist[h2]);dR.ul.appendChild(hr);}else if(hr.textContent!==hist[h2])hr.textContent=hist[h2];}
var arts=t.artifacts||[];
dR.ha.style.display=arts.length?'':'none';dR.al.style.display=arts.length?'':'none';
while(dR.al.children.length>arts.length)dR.al.removeChild(dR.al.lastChild);
for(var a2=0;a2<arts.length;a2++){var an=arts[a2];var ab=dR.al.children[a2];if(!ab){ab=el('button','art',an);ab.setAttribute('type','button');(function(nm,btn){btn.addEventListener('click',function(){state.artOpen=(state.artOpen===nm?null:nm);refreshArt();});})(an,ab);dR.al.appendChild(ab);}else if(ab.textContent!==an)ab.textContent=an;}
refreshArt();
var dec=(t.decided||[]).slice().sort(function(a,b){return b.at-a.at;}).slice(0,3);
dR.hd.style.display=dec.length?'':'none';dR.dl.style.display=dec.length?'':'none';
while(dR.dl.children.length>dec.length)dR.dl.removeChild(dR.dl.lastChild);
for(var d2=0;d2<dec.length;d2++){var row=dR.dl.children[d2];if(!row){row=el('li','');var tk=el('span','tick','\u2713');var tx=el('div','','');var qq=el('div','dec-q',dec[d2].question);var aa=el('div','dec-a',dec[d2].answer+' \u00B7 '+relAge(dec[d2].at,state.now));tx.appendChild(qq);tx.appendChild(aa);row.appendChild(tk);row.appendChild(tx);row._q=qq;row._a=aa;dR.dl.appendChild(row);}else{var wantQ=dec[d2].question;var wantA=dec[d2].answer+' \u00B7 '+relAge(dec[d2].at,state.now);if(row._q.textContent!==wantQ)row._q.textContent=wantQ;if(row._a.textContent!==wantA)row._a.textContent=wantA;}}
}
function refreshArt(){if(!dR)return;if(!state.artOpen){dR.av.setAttribute('hidden','');dR.av.textContent='';return;}renderArt(state.artOpen);}
function selectTask(id,open){
state.selected=id;state.artOpen=null;
for(var i=0;i<TASKS.length;i++){var r=refs.tasks[TASKS[i].id];if(r)updateRow(r,TASKS[i]);}
updateDetail();
var small=window.matchMedia?window.matchMedia('(max-width: 900px)').matches:false;
var isOpen=!!id;
if(small){if(isOpen){detailEl.className='detail open';backdrop.removeAttribute('hidden');}else{detailEl.className='detail';backdrop.setAttribute('hidden','');}}
else{backdrop.setAttribute('hidden','');detailEl.className='detail';}
detailEl.setAttribute('aria-hidden',isOpen?'false':'true');
}
function refreshAll(){
var vis=visibleTasks();
var cnt=fmtN.format(vis.length);
var hc=document.getElementById('headCount');
if(hc.textContent!==cnt)hc.textContent=cnt;
var hp=document.getElementById('pageTitle');
var al=(state.tab==='done'?vis.length+' '+L.done.toLowerCase():vis.length+' '+L.active.toLowerCase());
hp.setAttribute('aria-label',L.tasks+' '+al);
var ta=document.getElementById('tab-active');var td=document.getElementById('tab-done');
ta.setAttribute('aria-selected',state.tab==='active'?'true':'false');
td.setAttribute('aria-selected',state.tab==='done'?'true':'false');
for(var p in refs.projects)updateGroup(p);
for(var i=0;i<TASKS.length;i++){var r=refs.tasks[TASKS[i].id];if(r)updateRow(r,TASKS[i]);}
updateDetail();
if(liveEl&&state._liveMsg){if(liveEl.textContent!==state._liveMsg)liveEl.textContent=state._liveMsg;}
}
function tick(){
state.now+=30000;
refreshAll();
}
function setLive(m){state._liveMsg=m;if(liveEl&&liveEl.textContent!==m)liveEl.textContent=m;}
function init(){
buildDetail();
var order=projectsOrder();
for(var i=0;i<order.length;i++)projectsRoot.appendChild(buildGroup(order[i]));
var glyph=document.getElementById('themeGlyph');
function paintGlyph(){var th=document.documentElement.getAttribute('data-theme');if(glyph)glyph.textContent=th==='dark'?'\u263E':'\u2600';}
paintGlyph();
var btn=document.getElementById('themeBtn');
if(btn)btn.addEventListener('click',function(){
var cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
document.documentElement.setAttribute('data-theme',cur);
try{localStorage.setItem(THEME_KEY,cur);}catch(e){}
paintGlyph();});
var ta=document.getElementById('tab-active');var td=document.getElementById('tab-done');
ta.addEventListener('click',function(){state.tab='active';state.selected=null;refreshAll();});
td.addEventListener('click',function(){state.tab='done';var done=TASKS.filter(function(t){return t.done;});state.selected=done.length?done[0].id:null;refreshAll();});
var newBtn=document.getElementById('newBtn');var newBox=document.getElementById('newBox');var newInput=document.getElementById('newInput');
var projBtn=document.getElementById('projBtn');var projMenu=document.getElementById('projMenu');var projName=document.getElementById('projName');
var createBtn=document.getElementById('createBtn');
function closeMenu(){projMenu.setAttribute('hidden','');projBtn.setAttribute('aria-expanded','false');}
function openMenu(){
projMenu.textContent='';
var ps=projectsOrder();
for(var i=0;i<ps.length;i++){(function(nm){var b=el('button','',nm);b.setAttribute('role','menuitem');b.addEventListener('click',function(){state.projPick=nm;projName.textContent=nm;closeMenu();newInput.focus();});projMenu.appendChild(b);})(ps[i]);}
projMenu.removeAttribute('hidden');projBtn.setAttribute('aria-expanded','true');}
projBtn.addEventListener('pointerdown',function(e){e.preventDefault();if(projMenu.hasAttribute('hidden'))openMenu();else closeMenu();},true);
projBtn.addEventListener('mousedown',function(e){if(e.detail===0)return;},true);
projBtn.addEventListener('click',function(e){e.preventDefault();});
document.addEventListener('pointerdown',function(e){if(!projMenu.hasAttribute('hidden')&&!projMenu.contains(e.target)&&e.target!==projBtn&&!projBtn.contains(e.target))closeMenu();},true);
newBtn.addEventListener('click',function(){
var hidden=newBox.hasAttribute('hidden');
if(hidden){newBox.removeAttribute('hidden');newBtn.setAttribute('aria-expanded','true');newInput.focus();}
else{newBox.setAttribute('hidden','');newBtn.setAttribute('aria-expanded','false');newBtn.focus();}});
function doCreate(){
var v=(newInput.value||'').trim().split('\n').filter(function(x){return x.trim();})[0]||(newInput.value||'').trim();
if(!v){setLive(L.writeFirst);newInput.focus();return;}
var p=state.projPick||projectsOrder()[0]||'Tasks';
var nt={id:'task-'+Date.now().toString(36),title:v.length>72?v.slice(0,71).trimEnd()+'\u2026':v,project:p,status:'planning',statusText:L.planning,asks:[],updatedAt:Date.now(),goal:v,started:'Today',steps:[],artifacts:[],history:['You asked for it \u2013 the orchestrator is planning the steps'],decided:[]};
var ix=-1;for(var i=0;i<TASKS.length;i++)if(TASKS[i].project===p){ix=i;break;}
if(ix<0)TASKS.push(nt);else TASKS.splice(ix,0,nt);
var order2=projectsOrder();
var existing=refs.projects[p];
if(!existing){var g=buildGroup(p);projectsRoot.appendChild(g);}
else{var row=buildRow(nt);existing.section._list.appendChild(row);existing.rows[nt.id]=row;refs.tasks[nt.id]=row;}
if(state.tab!=='active'){state.tab='active';}
state.selected=nt.id;state.fresh=nt.id;
newInput.value='';newBox.setAttribute('hidden','');newBtn.setAttribute('aria-expanded','false');
setLive(L.created+' in '+p);
refreshAll();
}
createBtn.addEventListener('click',doCreate);
newInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doCreate();}else if(e.key==='Escape'){newBox.setAttribute('hidden','');newBtn.setAttribute('aria-expanded','false');newBtn.focus();}});
backdrop.addEventListener('click',function(){selectTask(null,false);});
document.addEventListener('keydown',function(e){
if(e.key==='Escape'){selectTask(null,false);closeMenu();return;}
var tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
var typing=tag==='input'||tag==='textarea'||(document.activeElement&&document.activeElement.isContentEditable);
if(typing)return;
if(e.metaKey||e.ctrlKey||e.altKey)return;
var k=(e.key||'').toLowerCase();
if(k==='c'||k==='n'){e.preventDefault();newBox.removeAttribute('hidden');newBtn.setAttribute('aria-expanded','true');newInput.focus();}
else if(k==='j'){e.preventDefault();stepFocus(1);}
else if(k==='k'){e.preventDefault();stepFocus(-1);}});
function stepFocus(d){var vis=[];for(var id in refs.tasks){var n=refs.tasks[id];if(n.style.display!=='none')vis.push(n);}if(!vis.length)return;var cur=vis.indexOf(document.activeElement);var nx=vis[cur<0?(d>0?0:vis.length-1):Math.min(vis.length-1,Math.max(0,cur+d))];if(nx)nx.focus();}
refreshAll();
selectTask('ingest',true);
window.__tasks_app={tasks:TASKS,projects:projectsOrder(),refs:refs,tick:tick,refresh:refreshAll,select:selectTask,state:state};
setInterval(function(){state.now=Date.now();refreshAll();},30000);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
