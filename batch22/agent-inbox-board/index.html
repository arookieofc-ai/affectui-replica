<title>Storefront Refresh — Agent Inbox Board</title>
<style>
:root{
  --surface:#ffffff;
  --page:#fafaf9;
  --ink:#1c1917;
  --ink-2:#171717;
  --muted:#78716c;
  --subtle:#f5f5f4;
  --border:#e7e5e4;
  --radius-lg:16px;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-lift:0 2px 4px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.09);
  --working:#2563eb;
  --working-bg:#dbeafe;
  --working-ink:#1e40af;
  --waiting:#f59e0b;
  --waiting-bg:#fef3c7;
  --waiting-ink:#92400e;
  --done:#16a34a;
  --done-bg:#dcfce7;
  --done-ink:#14532d;
  --failed:#dc2626;
  --failed-bg:#fee2e2;
  --failed-ink:#7f1d1d;
  --focus:#2563eb;
  --img-outline:rgba(0,0,0,.1);
}
html[data-theme="dark"]{
  --surface:#1c1c1f;
  --page:#101012;
  --ink:#ededed;
  --ink-2:#ededed;
  --muted:#a1a1aa;
  --subtle:#26262a;
  --border:#2e2e33;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --shadow-lift:0 2px 6px rgba(0,0,0,.6),0 14px 34px rgba(0,0,0,.55);
  --working:#60a5fa;
  --working-bg:#1e3a8a;
  --working-ink:#dbeafe;
  --waiting:#fbbf24;
  --waiting-bg:#451a03;
  --waiting-ink:#fde68a;
  --done:#4ade80;
  --done-bg:#052e16;
  --done-ink:#bbf7d0;
  --failed:#f87171;
  --failed-bg:#450a0a;
  --failed-ink:#fecaca;
  --focus:#7dd3fc;
  --img-outline:rgba(255,255,255,.1);
}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
  font-variant-numeric:tabular-nums;
  background:var(--page);
  color:var(--ink);
  line-height:1.45;
}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:12px 16px;
  display:flex;align-items:center;gap:12px;
}
.proj-dot{width:10px;height:10px;border-radius:999px;background:var(--done);flex:none;box-shadow:0 0 0 4px var(--done-bg)}
.proj-name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count-pill{
  font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap;
  background:var(--subtle);color:var(--muted);border:1px solid var(--border);
}
.count-pill.working{background:var(--working-bg);color:var(--working-ink);border-color:transparent}
.count-pill.agents{background:var(--surface);color:var(--muted)}
.spacer{flex:1}
.search{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 12px;font-size:13px;min-width:140px;max-width:220px;width:100%;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--focus);outline-offset:1px}
.theme-btn{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 10px 7px 8px;font-size:13px;font-weight:600;cursor:pointer;
  transition:transform 160ms ease,box-shadow 160ms ease,background 160ms ease;
}
.theme-btn .ticon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ctx{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.ctx-label{font-size:12px;color:var(--muted);white-space:nowrap}
.ctx-track{width:150px;height:3px;border-radius:999px;background:var(--border);overflow:hidden}
.ctx-fill{height:100%;width:32%;background:var(--working);border-radius:999px;transition:width 180ms ease}
.board{
  max-width:1180px;margin:0 auto;padding:12px 16px 28px;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:start;
}
.col{
  background:var(--surface);
  border-radius:calc(var(--radius-lg) + 12px);
  padding:12px;
  box-shadow:var(--shadow);
  border:1px solid transparent;
}
.col-head{
  min-height:44px;margin:0 0 10px 0;padding:2px 2px 10px 2px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.col-title{font-size:13px;font-weight:700;letter-spacing:.01em}
.col-count{
  font-size:12px;font-weight:700;border-radius:999px;min-width:24px;height:24px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 8px;
}
.col-count.needs{background:var(--waiting-bg);color:var(--waiting-ink)}
.col-count.running{background:var(--working-bg);color:var(--working-ink)}
.col-count.done{background:var(--done-bg);color:var(--done-ink)}
.col-sub{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.col-list{display:flex;flex-direction:column;gap:10px;min-height:60px}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:12px 12px 14px 12px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:box-shadow 170ms ease,transform 170ms ease,border-color 170ms ease,opacity 170ms ease;
  outline:none;
}
.card.selected{border-color:var(--working)}
.card.dim{opacity:.78}
.card.chain{border-color:var(--working);box-shadow:var(--shadow-lift)}
.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card-top{display:flex;align-items:center;gap:8px;min-width:0}
.pix{flex:none;width:21px;height:21px;display:grid;grid-template-columns:repeat(3,7px);grid-template-rows:repeat(3,7px);border-radius:5px;overflow:hidden;background:var(--subtle)}
.pix i{width:7px;height:7px;display:block}
.card.working .pix{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.55}}
.card-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.status{
  flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;
  border:1px solid transparent;
}
.status.waiting{background:var(--waiting-bg);color:var(--waiting-ink)}
.status.working{background:var(--working-bg);color:var(--working-ink)}
.status.done{background:var(--done-bg);color:var(--done-ink)}
.status.failed{background:var(--failed-bg);color:var(--failed-ink)}
.model-row{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 0 0 29px}
.meta-row{display:flex;align-items:center;gap:8px;margin:8px 0 0 29px;font-size:12px;color:var(--muted)}
.meta-row .elapsed,.meta-row .tokens{white-space:nowrap}
.prog{height:3px;border-radius:999px;background:var(--border);overflow:hidden;margin:8px 0 0 29px}
.prog-fill{height:100%;background:var(--working);border-radius:999px;transition:width 180ms ease}
.tools{display:flex;gap:6px;margin:10px 0 0 29px}
.tool{
  width:24px;height:24px;border-radius:999px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
  background:var(--subtle);color:var(--muted);
  border:1px solid var(--border);
}
.subagents{display:flex;flex-direction:column;gap:6px;margin:10px 0 0 29px}
.subcard{
  background:var(--subtle);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:6px 8px 6px 8px;
  font-size:12px;color:var(--ink);
  display:flex;align-items:center;gap:8px;min-width:0;
}
.subcard .sub-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}

.card-actions{display:flex;gap:8px;margin:10px 0 0 29px}
.btn{

.steps{list-style:none;margin:12px 0 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.step{

.step.done-step .n{background:var(--done-bg);color:var(--done-ink)}
.step .st{flex:1;min-width:0}
.artifact{
  margin-top:12px;border-radius:var(--radius);
  background:var(--subtle);padding:10px 12px;font-size:12.5px;
  box-shadow:inset 0 0 0 1px var(--img-outline);

.artifact code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hint{max-width:1180px;margin:0 auto;padding:0 16px 26px;font-size:12px;color:var(--muted)}
kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:0 5px;font-size:11px;background:var(--surface)}
.empty{font-size:12.5px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);padding:10px;text-align:center}
@media (max-width:920px){
  .board{grid-template-columns:1fr}
  .search{max-width:none}
  .topbar-inner{flex-wrap:wrap}
}
@media (hover: hover) and (pointer: fine){
  .card:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
  .btn:hover{box-shadow:var(--shadow-lift)}
  .theme-btn:hover{box-shadow:var(--shadow-lift)}
  .step:hover{border-color:var(--muted)}
}
</style>

  var elapsed=el("span","elapsed",fmtElapsed(t.elapsedSec)+" elapsed");
  var toks=el("span","tokens",fmtCtx(t)+" context");
  meta.appendChild(elapsed);meta.appendChild(toks);
  card.appendChild(meta);
  var prog=null,progFill=null;
  if(t.status==="running"){
    prog=el("div","prog");progFill=el("div","prog-fill");
    progFill.style.width=(t.progress||0)+"%";
    prog.appendChild(progFill);card.appendChild(prog);
  }
  var tools=el("div","tools");
  for(var i=0;i<t.tools.length;i++){
    var b=el("span","tool",initials(t.tools[i]));
    b.setAttribute("title",t.tools[i]);tools.appendChild(b);
  }
  card.appendChild(tools);
  var subsWrap=null;
  if(t.subs&&t.subs.length){
    subsWrap=el("div","subagents");
    for(var s=0;s<t.subs.length;s++){
      var sc=el("div","subcard");
      var stt=el("span","sub-t",t.subs[s].t);stt.setAttribute("title",t.subs[s].t);
      var ss=el("span","sub-s",t.subs[s].s);
      sc.appendChild(stt);sc.appendChild(ss);subsWrap.appendChild(sc);
    }
    card.appendChild(subsWrap);
  }
  var actions=el("div","card-actions");
  var openBtn=el("button","btn","Details");
  openBtn.setAttribute("type","button");
  actions.appendChild(openBtn);
  var actBtn=null;
  if(t.status==="needs"){
    actBtn=el("button","btn primary","✓ Approve");
    actBtn.setAttribute("type","button");
    actions.appendChild(actBtn);
  }
  card.appendChild(actions);
  cardEls[t.id]=card;
  fieldEls[t.id]={title:title,model:model,elapsed:elapsed,toks:toks,status:st,progFill:progFill,openBtn:openBtn,actBtn:actBtn,card:card};
  openBtn.addEventListener("click",function(ev){ev.stopPropagation();selectTask(t.id,true)});
  if(actBtn){(function(id){actBtn.addEventListener("click",function(ev){ev.stopPropagation();approveTask(id)})})(t.id)}
  card.addEventListener("click",function(){selectTask(t.id,true)});
  card.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectTask(t.id,true)}
    else if(ev.key==="a"||ev.key==="A"){approveTask(t.id)}
    else if(ev.key==="ArrowRight"||ev.key==="ArrowLeft"||ev.key==="ArrowUp"||ev.key==="ArrowDown"){ev.preventDefault();moveFocus(t.id,ev.key)}
  });
  card.addEventListener("mouseenter",function(){highlightChain(t.agent,true)});
  card.addEventListener("mouseleave",function(){highlightChain(t.agent,false)});
  card.addEventListener("focus",function(){highlightChain(t.agent,true)});
  card.addEventListener("blur",function(){highlightChain(t.agent,false)});
  return card;
}
function highlightChain(agent,on){
  for(var i=0;i<order.length;i++){
    var id=order[i];var t=byId[id];var c=cardEls[id];
    if(!c){continue}
    if(on&&t.agent===agent){
      if(!c.classList.contains("chain")){c.classList.add("chain")}
    }else{
      if(c.classList.contains("chain")){c.classList.remove("chain")}
    }
  }
}
function listFor(status){
  if(status==="needs"){return listNeeds}
  if(status==="running"){return listRunning}
  return listDone;
}
function placeCard(t){
  var card=cardEls[t.id];
  var list=listFor(t.status);
  if(card.parentNode!==list){list.appendChild(card)}
}
function updateCard(t){
  var f=fieldEls[t.id];var card=f.card;
  card.classList.remove("needs");card.classList.remove("running");card.classList.remove("done");
  card.classList.add(t.status);
  card.setAttribute("aria-label",t.title+" · "+statusText(t));
  if(!f.title.textContent||f.title.textContent!==t.title){f.title.textContent=t.title}
  var modelText=t.agent+" · "+t.model;
  if(f.model.textContent!==modelText){f.model.textContent=modelText}
  var elText=fmtElapsed(t.elapsedSec)+" elapsed";
  if(f.elapsed.textContent!==elText){f.elapsed.textContent=elText}
  var tokText=fmtCtx(t)+" context";
  if(f.toks.textContent!==tokText){f.toks.textContent=tokText}
  var sc=statusClass(t);var stx=statusText(t);
  if(f.status.textContent!==stx){f.status.textContent=stx}
  f.status.className="status "+sc;
  if(t.status==="running"){
    var p=Math.max(0,Math.min(100,t.progress||0));
    if(!f.progFill){
      var prog=el("div","prog");var pf=el("div","prog-fill");
      pf.style.width=p+"%";prog.appendChild(pf);
      var toolsNode=null;
      for(var ci=0;ci<card.childNodes.length;ci++){var ch=card.childNodes[ci];if(ch.className==="tools"){toolsNode=ch;break}}
      if(toolsNode&&toolsNode.parentNode){card.insertBefore(prog,toolsNode)}else{card.appendChild(prog)}
      f.progFill=pf;
    }else{
      var w=p+"%";
      if(f.progFill.style.width!==w){f.progFill.style.width=w}
    }
  }
  placeCard(t);
}
function counts(){
  var n=0,r=0,d=0;var agents={};
  for(var i=0;i<TASKS.length;i++){
    var t=TASKS[i];agents[t.agent]=1;
    if(t.hidden){continue}
    if(t.status==="needs"){n++}else if(t.status==="running"){r++}else{d++}
  }
  return {n:n,r:r,d:d,agents:Object.keys(agents).length};
}
function refreshCounts(){
  var c=counts();
  var nt=String(c.n),rt=String(c.r),dt=String(c.d);
  if(countNeeds.textContent!==nt){countNeeds.textContent=nt}
  if(countRunning.textContent!==rt){countRunning.textContent=rt}
  if(countDone.textContent!==dt){countDone.textContent=dt}
  var wp=c.r+" running";
  if(workingPill.textContent!==wp){workingPill.textContent=wp}
  var ap=c.agents+" agents";
  if(agentPill.textContent!==ap){agentPill.textContent=ap}
  var tot=0;for(var i=0;i<TASKS.length;i++){tot+=TASKS[i].tokensUsed}
  var cl=fmtTokens(tot)+" / 200k context";
  if(ctxLabel.textContent!==cl){ctxLabel.textContent=cl}
  var pct=Math.min(100,Math.round(tot/200000*100))+"%";
  if(ctxFill.style.width!==pct){ctxFill.style.width=pct}
}
function selectTask(id,focusDetail){
  selectedId=id;
  for(var i=0;i<order.length;i++){
    var c=cardEls[order[i]];
    if(!c){continue}
    if(order[i]===id){
      if(!c.classList.contains("selected")){c.classList.add("selected")}
      if(c.classList.contains("dim")){c.classList.remove("dim")}
    }else{
      if(c.classList.contains("selected")){c.classList.remove("selected")}
      if(!c.classList.contains("dim")){c.classList.add("dim")}
    }
  }
  renderDetail(byId[id]);
  if(!focusDetail){}
}
function clearDim(){
  for(var i=0;i<order.length;i++){var c=cardEls[order[i]];if(c&&c.classList.contains("dim")){c.classList.remove("dim")}}
}
function renderDetail(t){
  if(!t){return}
  if(dTitle.textContent!==t.title){dTitle.textContent=t.title}
  var sub=t.agent+" · "+t.model+" · "+t.note;
  if(dAgent.textContent!==sub){dAgent.textContent=sub}
  var sc=statusClass(t),stx=statusText(t);
  if(dStatus.textContent!==stx){dStatus.textContent=stx}
  dStatus.className="status "+sc;
  var ctx=fmtCtx(t);
  if(dTokens.textContent!==ctx){dTokens.textContent=ctx}
  var pct=Math.round(t.tokensUsed/t.tokensMax*100)+"%";
  if(dTokFill.style.width!==pct){dTokFill.style.width=pct}
  while(dSteps.firstChild){dSteps.removeChild(dSteps.firstChild)}
  for(var i=0;i<t.steps.length;i++){
    var li=document.createElement("li");
    li.className="step"+(t.status==="done"||i<t.steps.length-1?" done-step":"");
    var n=el("span","n",String(i+1));
    var s=el("span","st",t.steps[i]);
    li.appendChild(n);li.appendChild(s);
    (function(idx,txt){
      li.addEventListener("mouseenter",function(){li.classList.add("hl")});
      li.addEventListener("mouseleave",function(){li.classList.remove("hl")});
    })(i,t.steps[i]);
    dSteps.appendChild(li);
  }
  if(dArtifactText.textContent!==t.artifact){dArtifactText.textContent=t.artifact}
  var showApprove=(t.status==="needs");
  dApprove.style.display=showApprove?"":"none";
  dRework.style.display=showApprove||t.status==="running"?"":"none";
}
function approveTask(id){
  var t=byId[id];if(!t){return}
  if(t.status==="done"){return}
  t.status="done";t.note="Approved · just now";
  t.steps=t.steps.concat(["Approved by you"]);
  updateCard(t);refreshCounts();applyFilter(searchInput?searchInput.value:"");
  if(selectedId===id){renderDetail(t)}
}
function requestChanges(id){
  var t=byId[id];if(!t){return}
  if(t.status==="done"){return}
  t.status="running";t.progress=Math.max(5,(t.progress||40)-18);
  t.note="Reworking per feedback";
  t.steps=t.steps.concat(["Rework requested — resuming run"]);
  updateCard(t);refreshCounts();applyFilter(searchInput?searchInput.value:"");
  if(selectedId===id){renderDetail(t)}
}
function applyFilter(q){
  q=(q||"").toLowerCase();
  var anyVisible=false;
  for(var i=0;i<TASKS.length;i++){
    var t=TASKS[i];
    var hit=!q||t.title.toLowerCase().indexOf(q)>=0||t.agent.toLowerCase().indexOf(q)>=0;
    t.hidden=!hit;
    var c=cardEls[t.id];
    if(c){c.style.display=hit?"":"none"}
    if(hit){anyVisible=true}
  }
  refreshCounts();
  for(var li=0;li<3;li++){
    var list=[listNeeds,listRunning,listDone][li];
    var hasVis=false;
    for(var k=0;k<list.childNodes.length;k++){var ch=list.childNodes[k];if(ch.style&&ch.style.display!=="none"){hasVis=true;break}}
    var emptyMsg=null;
    for(var m=0;m<list.childNodes.length;m++){var n2=list.childNodes[m];if(n2.className==="empty"){emptyMsg=n2;break}}
    if(!hasVis&&!emptyMsg){
      var e2=el("div","empty","No matches in this column.");
      list.appendChild(e2);
    }else if(hasVis&&emptyMsg&&emptyMsg.parentNode){
      emptyMsg.parentNode.removeChild(emptyMsg);
    }
  }
  return anyVisible;
}
function moveFocus(id,key){
  var vis=[];
  var lists=[listNeeds,listRunning,listDone];
  for(var li=0;li<lists.length;li++){
    for(var k=0;k<lists[li].childNodes.length;k++){
      var n=lists[li].childNodes[k];
      if(n.className&&n.className.indexOf("card")>=0&&n.style.display!=="none"){vis.push(n.getAttribute("data-id"))}
    }
  }
  var idx=vis.indexOf(id);if(idx<0){return}
  var next=idx;
  if(key==="ArrowRight"||key==="ArrowDown"){next=Math.min(vis.length-1,idx+1)}
  else{next=Math.max(0,idx-1)}
  var c=cardEls[vis[next]];
  if(c&&c.focus){c.focus()}
  selectTask(vis[next],false);
}
function tick(){
  var changed=false;
  for(var i=0;i<TASKS.length;i++){
    var t=TASKS[i];
    if(t.status==="running"){
      t.elapsedSec+=1;
      t.tokensUsed=Math.min(t.tokensMax,t.tokensUsed+37);
      if(typeof t.progress==="number"){
        t.progress=Math.min(100,t.progress+0.6);
        if(t.progress>=100){
          t.status="done";t.note="Finished · just now";
          t.steps=t.steps.concat(["Run finished — moved to Done"]);
        }
      }
      updateCard(t);changed=true;
    }else if(t.status==="needs"){
      t.elapsedSec+=1;
      var f=fieldEls[t.id];
      var elText=fmtElapsed(t.elapsedSec)+" elapsed";
      if(f&&f.elapsed.textContent!==elText){f.elapsed.textContent=elText}
    }
  }
  var stillRunning=false;
  for(var j=0;j<TASKS.length;j++){if(TASKS[j].status==="running"){stillRunning=true;break}}
  if(!stillRunning){
    for(var k=0;k<TASKS.length;k++){
      var t2=TASKS[k];
      if(t2.id==="t-run-1"||t2.id==="t-run-2"||t2.id==="t-run-3"){
        t2.status="running";
        t2.progress=5;
        t2.note="Restarted loop";
        t2.steps=t2.steps.slice(0,2);
        updateCard(t2);
      }
    }
  }
  refreshCounts();
  if(selectedId&&byId[selectedId]){
    var sel=byId[selectedId];
    var elx=fmtElapsed(sel.elapsedSec)+" elapsed";
    void elx;
    renderDetailLight(sel);
  }
  return changed;
}
function renderDetailLight(t){
  var ctx=fmtCtx(t);
  if(dTokens.textContent!==ctx){dTokens.textContent=ctx}
  var pct=Math.round(t.tokensUsed/t.tokensMax*100)+"%";
  if(dTokFill.style.width!==pct){dTokFill.style.width=pct}
  var sub=t.agent+" · "+t.model+" · "+t.note;
  if(dAgent.textContent!==sub){dAgent.textContent=sub}
}
function setTheme(mode){
  var m=(mode==="dark")?"dark":"light";
  document.documentElement.setAttribute("data-theme",m);
  try{localStorage.setItem("affectui-agent-inbox-theme",m)}catch(e){}
  if(themeIcon){themeIcon.textContent=(m==="dark")?"☾":"☀"}
  if(themeLabel){themeLabel.textContent=(m==="dark")?"Dark":"Light"}
  return m;
}
function initTheme(){
  var cur="light";
  try{cur=document.documentElement.getAttribute("data-theme")||"light"}catch(e){}
  setTheme(cur);
}
if(themeBtn){themeBtn.addEventListener("click",function(){
  var cur="light";
  try{cur=document.documentElement.getAttribute("data-theme")||"light"}catch(e){}
  setTheme(cur==="dark"?"light":"dark");
})}
if(searchInput){searchInput.addEventListener("input",function(){applyFilter(searchInput.value)})}
if(dApprove){dApprove.addEventListener("click",function(){approveTask(selectedId)})}
if(dRework){dRework.addEventListener("click",function(){requestChanges(selectedId)})}
if(dClose){dClose.addEventListener("click",function(){clearDim()})}
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){clearDim()}
});
for(var b=0;b<TASKS.length;b++){var tt=TASKS[b];order.push(tt.id);var cd=buildCard(tt);listFor(tt.status).appendChild(cd)}
refreshCounts();
selectTask("t-need-1",false);
clearDim();
initTheme();
if(searchInput&&searchInput.value){applyFilter(searchInput.value)}
var timer=null;
try{timer=setInterval(tick,1000)}catch(e){}
if(typeof window!=="undefined"){
  window.__board={tasks:TASKS,byId:byId,cards:cardEls,fields:fieldEls,tick:tick,approve:approveTask,rework:requestChanges,select:selectTask,setTheme:setTheme,counts:counts,order:order};
}
})();
</script>
</body>
</html>
