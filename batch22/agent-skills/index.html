<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>/*noflash*/(function(){try{var k='agent-skills-theme';var s=null;try{s=localStorage.getItem(k);}catch(e){}if(!s){try{if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){s='dark';}else{s='light';}}catch(e){s='light';}}document.documentElement.setAttribute('data-theme',s);}catch(e){}})();</script>
<style>html{background:#fafaf9}html[data-theme="dark"]{background:#101012}</style>
<title>Agent Skills — Fieldwork</title>
<style>
:root,html[data-theme="light"]{
  --surface:#ffffff;--page:#fafaf9;--ink:#1c1917;--text:#1c1917;--muted:#78716c;--faint:#a8a29e;
  --subtle:#f5f5f4;--border:#e7e5e4;--line:rgba(0,0,0,.07);--chip:#f5f5f4;
  --radius-lg:16px;--radius:10px;--radius-sm:6px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --shadow-lift:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  --focus:rgba(0,96,226,.7);
  --blue:#0190fe;--c-purple:#a651f0;--c-orange:#f28a2e;--c-teal:#13b3a0;--c-blue:#0190fe;--c-amber:#e8b000;--c-pink:#ee3e9e;--c-green:#5fc88a;
  --img-outline:rgba(0,0,0,.1);
  --waiting-bg:#fef3c7;--waiting-ink:#92400e;--waiting-dot:#f59e0b;
}
html[data-theme="dark"]{
  --surface:#1c1c1f;--page:#101012;--ink:#ededed;--text:#e7e5e7;--muted:#a1a1aa;--faint:#71717a;
  --subtle:#26262a;--border:#2e2e33;--line:rgba(255,255,255,.08);--chip:#26262a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 14px 30px rgba(0,0,0,.5);
  --focus:rgba(77,141,255,.8);
  --blue:#4fb0fe;--c-purple:#b98af0;--c-orange:#f2a15c;--c-teal:#4fc3b4;--c-blue:#4fb0fe;--c-amber:#e6c24d;--c-pink:#f06db5;--c-green:#7dcf9f;
  --img-outline:rgba(255,255,255,.1);
  --waiting-bg:#451a03;--waiting-ink:#fde68a;--waiting-dot:#fbbf24;
}
html{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 56px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:2px 2px 12px}
.brand{min-width:0}
.crumbs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:600}
.proj{font-size:18px;font-weight:650;letter-spacing:-.01em;margin:2px 0;line-height:1.2}
.proj-sub{font-size:12.5px;color:var(--muted);margin:0}
.proj-sub strong{color:var(--ink)}
.theme-btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:999px;padding:7px 12px 7px 10px;font-size:13px;box-shadow:var(--shadow);margin-top:2px;white-space:nowrap}
.theme-btn .tic{width:16px;height:16px;display:inline-grid;place-items:center}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.agk{position:relative;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--page);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.agk-head{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px 0 20px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.agk-title{font-size:13px;font-weight:600;margin:0;flex:none}
.agk-search{display:flex;flex:0 1 220px;align-items:center;gap:6px;min-width:0;height:28px;margin-left:auto;padding:0 8px;border-radius:6px;background:var(--chip);color:var(--faint)}
.agk-search:focus-within{background:var(--surface);box-shadow:var(--shadow)}
.agk-search svg{flex:none}
.agk-search input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font-size:13px;outline:none}
.agk-search input::placeholder{color:var(--faint)}
.agk-search input::-webkit-search-cancel-button{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:28px;padding:0 10px;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line),0 1px 1px rgba(0,0,0,.04);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;border:0}
.btn svg{flex:none}
.btn--quiet{background:none;box-shadow:none;color:var(--text)}
.btn--head{flex:none}
.agk-scroll{min-height:0}
.agk-body{display:grid;gap:28px;padding:20px 16px 40px;max-width:752px;margin:0 auto;width:100%}
.chips{display:flex;gap:4px;margin:-4px -16px -14px;padding:4px 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:28px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.chips button[aria-selected="true"]{background:var(--chip);color:var(--ink)}
.sect{display:grid}
.shead{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-top:4px;font-size:13px;font-weight:600;color:var(--ink)}
.shead__n{font-size:12px;font-weight:400;color:var(--faint)}
.shead__text{margin:0 0 12px;font-size:12.5px;line-height:18px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.card{position:relative;display:flex;min-width:0;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line);padding:0}
.card__main{flex:1;display:grid;align-content:start;gap:6px;min-width:0;padding:12px 14px;border-radius:10px;text-align:left;min-height:0}
.card__top{display:flex;align-items:center;gap:8px;min-width:0;min-height:24px;padding-right:36px}
.card__name{overflow:hidden;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;text-overflow:ellipsis}
.card__desc{display:-webkit-box;min-height:36px;overflow:hidden;font-size:12.5px;line-height:18px;color:var(--muted);-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.card__foot{display:flex;align-items:center;gap:8px;margin-top:4px;min-width:0}
.chip{max-width:100%;overflow:hidden;padding:0 6px;border-radius:5px;background:var(--chip);font-size:11.5px;line-height:18px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.card__count{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.card__corner{position:absolute;top:12px;right:12px;display:flex;align-items:center;min-height:24px}
.switch{position:relative;flex:none;width:26px;height:16px;border-radius:999px;background:rgba(120,120,128,.35)}
.switch__knob{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"] .switch__knob{transform:translateX(10px)}
.card[data-off] .card__name,.card[data-off] .card__desc{color:var(--faint)}
.card[data-off] .mark{filter:grayscale(1);opacity:.55}
.card[data-fresh]{animation:land 560ms cubic-bezier(.23,1,.32,1) both,glow 1200ms ease both}
.mark{display:inline-grid;place-items:center;flex:none;border-radius:5px;background:color-mix(in srgb,var(--tone) 14%,var(--surface));color:var(--tone)}
.install{min-width:24px;min-height:24px;padding:0 6px;border-radius:6px;font-size:13px}
.install[data-small]{width:24px;height:24px;padding:0;box-shadow:inset 0 0 0 .5px var(--line)}
.install[data-state="installing"]{color:var(--blue)}
.install[data-state="done"]{background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue);box-shadow:none}
.install__icon{display:inline-grid;place-items:center;width:14px;height:14px}
.install__ring{stroke-dasharray:1;stroke-dashoffset:1;animation:fill 1400ms cubic-bezier(.4,0,.2,1) forwards}
@keyframes fill{to{stroke-dashoffset:0}}
@keyframes land{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes glow{0%,40%{box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--blue) 35%,transparent),0 4px 14px -6px color-mix(in srgb,var(--blue) 22%,transparent)}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.note{margin:0;font-size:13px;color:var(--faint)}
.center{display:grid;place-items:center;min-height:240px;padding:40px 24px;text-align:center}
.center h3{margin:0 0 6px;font-size:14px}
.center p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.panel{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px;position:sticky;top:12px}
.panel__head{display:flex;align-items:center;gap:12px}
.panel__titles{display:grid;min-width:0}
.panel__title{margin:0;font-size:15px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.panel__sub{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.panel__desc{margin:0;font-size:13px;line-height:20px;color:var(--text);overflow-wrap:anywhere}
.panel__acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.dot[data-on]{background:var(--blue)}
.section{display:grid;gap:10px}
.label{margin:0;font-size:12px;font-weight:600;color:var(--muted)}
.triggers,.steps{list-style:none;margin:0;padding:12px 14px;display:grid;gap:8px;border-radius:10px;background:color-mix(in srgb,var(--ink) 3.5%,var(--surface))}
.triggers li{font-size:13px;line-height:20px;color:var(--text);overflow-wrap:anywhere}
.steps li{display:flex;gap:10px;font-size:13px;line-height:20px;color:var(--text)}
.steps__n{display:inline-grid;place-items:center;flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line);font-size:11px;color:var(--muted)}
.needs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.need{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:8px;box-shadow:inset 0 0 0 .5px var(--line);font-size:12.5px;color:var(--text);max-width:100%}
.link{display:inline-flex;align-items:center;gap:2px;min-height:24px;margin-left:auto;padding:0 6px;border-radius:6px;font-size:12px;color:var(--muted)}
.used{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.used li{display:flex;gap:12px;align-items:baseline;font-size:13px;color:var(--text)}
.used__task{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.faint{color:var(--faint)}
.runs__head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:6px;margin-top:8px}
.chart__y{display:flex;flex-direction:column;justify-content:space-between;height:84px;margin:-6px 0;font-size:11px;color:var(--faint);text-align:right}
.chart__plot{position:relative;height:72px}
.chart__plot>i{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
.chart__plot>i:nth-child(1){top:0}.chart__plot>i:nth-child(2){top:50%}.chart__plot>i:nth-child(3){bottom:0;border-top-style:solid}
.runs{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px}
.runs>span{flex:none;width:9px;border-radius:3px 3px 1px 1px;background:color-mix(in srgb,var(--tone) 18%,var(--surface));transform-origin:bottom}
.runs>span[data-now]{background:color-mix(in srgb,var(--tone) 70%,var(--surface))}
.runs__axis{display:flex;justify-content:space-between;padding:0 2px;font-size:11px;color:var(--faint)}
.agent{display:grid;grid-template-columns:repeat(3,3px);grid-auto-rows:3px;gap:1.5px;place-content:center;width:16px;height:16px;flex:none}
.agent i{border-radius:.75px;background:rgba(0,96,226,.78);opacity:0;width:3px;height:3px}
html[data-theme="dark"] .agent i{background:rgba(77,141,255,.85)}
.agent i[data-on]{opacity:1}
.agent[data-busy] i{animation:pixel 1.2s ease-in-out infinite both}
.agent[data-busy] i:not([data-on]){opacity:.16}
@keyframes pixel{0%,100%{opacity:1}50%{opacity:.2}}
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(0,0,0,.16)}
html[data-theme="dark"] .modal{background:rgba(0,0,0,.4)}
.modal__box{display:flex;flex-direction:column;width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:16px;background:var(--surface);box-shadow:0 24px 48px -12px rgba(0,0,0,.25)}
.modal__head{display:flex;align-items:center;gap:8px;padding:16px 12px 4px 20px}
.modal__heading{display:grid;flex:1;min-width:0}
.modal__heading b{font-size:15px;font-weight:600}
.modal__heading small{font-size:12.5px;color:var(--muted)}
.icon-btn{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:7px;color:var(--muted)}
.modal__body{padding:16px 20px 20px}
.modal__foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.modal__cancel{min-height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--text)}
.modal__go{min-height:32px;padding:0 14px;border-radius:8px;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600}
.modal__go:disabled{opacity:.35;cursor:default}
.ways{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.way{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px 10px 10px;border-radius:10px;text-align:left}
.way__icon{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:9px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line);font-size:16px}
.way__text{display:grid;flex:1;min-width:0}
.way__text b{font-size:13px;font-weight:600}
.way__text small{font-size:12.5px;color:var(--muted)}
.form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field>span em{font-style:normal;font-weight:400;color:var(--faint);margin-left:4px}
.field input,.field textarea{width:100%;padding:8px 10px;border:0;border-radius:8px;background:color-mix(in srgb,var(--ink) 3.5%,var(--surface));color:var(--ink);font-size:13px;line-height:20px;outline:none;resize:vertical}
.field input{height:36px}
.writing{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0 36px;font-size:13px;color:var(--muted)}
.writing .agent{transform:scale(1.5);margin-bottom:4px}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:32px 16px;border-radius:12px;background:color-mix(in srgb,var(--ink) 3.5%,var(--surface));box-shadow:inset 0 0 0 1px var(--line);text-align:center;cursor:pointer}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{font-size:13px}
.drop small{font-size:12.5px;color:var(--muted)}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas button{padding:4px 10px;border-radius:8px;box-shadow:inset 0 0 0 .5px var(--line);font-size:12.5px;text-align:left}
.footer{margin-top:14px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--surface)}
@media(max-width:560px){.agk-search{flex:0 0 28px;justify-content:center}.agk-search input::placeholder{color:transparent}.agk-search:focus-within{flex:1 1 auto}.tiles{grid-template-columns:minmax(0,1fr)}.agk-body{padding:12px 12px 32px}}
@media (hover:hover) and (pointer:fine){
  .btn:hover{box-shadow:inset 0 0 0 .5px var(--border),0 2px 4px rgba(0,0,0,.06)}
  .btn--quiet:hover{background:var(--chip)}
  .chips button:hover{color:var(--ink)}
  .card:hover{background:color-mix(in srgb,var(--ink) 1.8%,var(--surface))}
  .way:hover{background:color-mix(in srgb,var(--ink) 3.5%,var(--surface))}
  .link:hover{background:var(--chip);color:var(--ink)}
  .icon-btn:hover{background:var(--chip);color:var(--ink)}
  .modal__go:hover{opacity:.88}
  .modal__cancel:hover{background:var(--chip)}
  .theme-btn:hover{border-color:var(--muted)}
  .ideas button:hover{background:color-mix(in srgb,var(--ink) 3.5%,var(--surface))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="crumbs">Fieldwork &middot; <b>Pro &middot; Personal</b></div>
      <h1 class="proj">Agent Skills</h1>
      <p class="proj-sub" id="projSub"><strong id="subCounts">9 installed</strong> &middot; <span>Fieldwork workspace</span></p>
    </div>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="Toggle theme"><span class="tic" id="themeIcon" aria-hidden="true">☾</span><span id="themeText">Dark</span></button>
  </header>
  <div class="app">
    <div class="agk" id="agk">
      <header class="agk-head">
        <h2 class="agk-title" id="agkTitle">Skills</h2>
        <label class="agk-search"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.5"/></svg><input id="search" type="search" placeholder="Search skills" aria-label="Search skills"></label>
        <button class="btn btn--head" id="newBtn" type="button" aria-haspopup="dialog"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><line x1="7" y1="2" x2="7" y2="12" stroke="currentColor" stroke-width="1.6"/><line x1="2" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="1.6"/></svg><span>New skill</span></button>
      </header>
      <div class="agk-scroll"><div class="agk-body" id="listBody"></div></div>
      <p class="sr" role="status" aria-live="polite" id="live"></p>
    </div>
    <aside class="panel" id="panel" aria-label="Skill"></aside>
  </div>
  <div class="footer"><span><kbd>/</kbd> search</span><span><kbd>j</kbd>/<kbd>k</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
</div>
<div class="modal" id="modal" hidden><div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mSub" id="modalBox"></div></div>
<script>
(function(){
"use strict";
var THEME_KEY="agent-skills-theme";
var L={skills:"Skills",installed:"Installed",discover:"Discover",search:"Search skills",newSkill:"New skill",install:"Install",installing:"Installing",done:"Installed",remove:"Remove",on:"On",off:"Off",turnOn:"Turn on",turnOff:"Turn off",builtin:"Built-in",yours:"Yours",community:"Community",thisWeek:"this week",runsWhen:"Steps in when you say",steps:"What it does",needs:"What it needs",usedIn:"Ran lately",notUsed:"Not used yet",permissions:"Permissions",noSkill:"Nothing open",noSkillText:"Pick a skill to see what it does and when it steps in.",noMatch:"No skill matches",noMatchText:"Try other words or another category.",emptyInstalled:"No skills yet",emptyInstalledText:"Describe what your agent should do, write it yourself or upload a SKILL.md.",emptyDiscover:"You have them all",emptyDiscoverText:"Every skill there is is already installed.",clear:"Clear search",all:"All",runs:"Runs",twoWeeksAgo:"2 weeks ago",today:"Today",categories:"Categories",discoverText:"Skills others use \u2013 add one and your agent can do it right away"};
var MIN=60000,DAY=1440;
function nowBase(){return Date.now();}
var T0=nowBase();
